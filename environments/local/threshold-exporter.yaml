# Local development environment configuration for threshold-exporter

image:
  repository: threshold-exporter
  tag: dev
  pullPolicy: Never  # Use local image loaded via 'kind load'

service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

# 本 repo 自帶的 Prometheus（k8s/03-monitoring/deployment-prometheus.yaml）在
# `monitoring`、pod label 是 `app: prometheus`，所以這裡把 exporter 的 ingress
# 收到只放它進來。chart 預設 allowExternal: true（只限 port、不限來源），因為
# chart 無從得知客戶的 scraper label（#1425）。
networkPolicy:
  allowExternal: false
  prometheusNamespace: monitoring
  prometheusPodLabels:
    app: prometheus

exporter:
  listenAddr: ":8080"
  reloadInterval: "15s"    # Faster reload for local dev

# Threshold config for local testing
# ⚠️ 這裡的 defaults 會 deep-merge 覆蓋 helm/threshold-exporter/values.yaml 的同名 key，
#    所以必須與 chart 預設同步 — 否則 `-f environments/local/...` 會把已校準的預設靜默蓋回舊值。
thresholdConfig:
  defaults:
    mysql_connections: 80
    mysql_threads_running: 30      # running-thread SATURATION warning (threads_running, NOT host CPU%); 80→30 = PMM/Nichter "high" tier (#944); renamed from mysql_cpu (#1231)
    mysql_replication_lag: 30  # async replication lag warning (seconds behind primary, sql_delay-adjusted) (#1200 WS5-P0-a)
    pg_connections: 80   # % of max_connections warning；pg 兩鍵升 chart_default（#1200 Q3=C / D4 folding）
    pg_replication_lag: 30   # replication lag warning (seconds)（#1200 Q3=C / D4 folding）
    container_cpu: 80
    container_cpu_throttle: 25
    container_memory: 85
  state_filters:
    container_crashloop:
      reasons: ["CrashLoopBackOff"]
      severity: "critical"
    container_imagepull:
      reasons: ["ImagePullBackOff", "InvalidImageName"]
      severity: "warning"
    # Scenario D: Maintenance mode — unless 攔截所有常規警報
    maintenance:
      reasons: []
      severity: "info"
      default_state: "disable"
  tenants:
    db-a:
      mysql_connections: "70"
      container_cpu: "70"
    db-b:
      mysql_connections: "100"
      mysql_threads_running: "45"      # 放寬（平台預設 30）；刻意不超過 critical tier 建議值 50
      container_memory: "90"
      _state_container_crashloop: "disable"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

replicaCount: 1
