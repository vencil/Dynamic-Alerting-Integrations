# Local development environment configuration for threshold-exporter

image:
  repository: threshold-exporter
  tag: dev
  pullPolicy: Never  # Use local image loaded via 'kind load'

service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

# 本 repo 自帶的 Prometheus（k8s/03-monitoring/deployment-prometheus.yaml）在
# `monitoring`、pod label 是 `app: prometheus`，所以這裡把 exporter 的 ingress
# 收到只放它進來。chart 預設 allowExternal: true（只限 port、不限來源），因為
# chart 無從得知客戶的 scraper label（#1425）。
networkPolicy:
  allowExternal: false
  prometheusNamespace: monitoring
  prometheusPodLabels:
    app: prometheus

exporter:
  listenAddr: ":8080"
  reloadInterval: "15s"    # Faster reload for local dev

# Threshold config for local testing
# ⚠️ 這裡的 defaults 會 deep-merge 覆蓋 helm/threshold-exporter/values.yaml 的同名 key，
#    所以必須與 chart 預設同步 — 否則 `-f environments/local/...` 會把已校準的預設靜默蓋回舊值。
thresholdConfig:
  # 規則包的閾值都內建在 exporter 裡（#3832、#4163），這裡一個都不寫（#3924）：
  # 平台值跟著 exporter 映像，沒有平台值的鍵由租戶給。
  defaults: {}
  state_filters:
    container_crashloop:
      reasons: ["CrashLoopBackOff"]
      severity: "critical"
    container_imagepull:
      reasons: ["ImagePullBackOff", "InvalidImageName"]
      severity: "warning"
    # Scenario D: Maintenance mode — unless 攔截所有常規警報
    maintenance:
      reasons: []
      severity: "info"
      default_state: "disable"
    # #1200 D-A A3: <Pack>ThresholdNotConfigured — an info alert naming each
    # threshold key that serves the tenant no threshold. Off by default; set
    # default_state to "enable" to notify every tenant, or a tenant writes
    # _state_unset_thresholds: "enable" (or "disable") to choose for itself.
    unset_thresholds:
      reasons: []
      severity: "info"
      default_state: "disable"
  tenants:
    db-a:
      mysql_connection_usage_percent: "70"
      container_cpu: "70"
    db-b:
      mysql_connection_usage_percent: "85"
      mysql_threads_running: "45"      # 平台不給預設（#3778），租戶或部署方 defaults 皆可設定；依這台主機的核數給值
      container_memory: "90"
      _state_container_crashloop: "disable"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

replicaCount: 1
