# CI/CD environment configuration for threshold-exporter

image:
  repository: ghcr.io/vencil/threshold-exporter
  tag: v0.8.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

exporter:
  listenAddr: ":8080"
  reloadInterval: "60s"    # Less frequent in CI

# CI threshold config — thresholds would be managed via GitOps
# ⚠️ 這裡的 defaults 會 deep-merge 覆蓋 helm/threshold-exporter/values.yaml 的同名 key，
#    所以必須與 chart 預設同步 — 否則 `-f environments/ci/...` 會把已校準的預設靜默蓋回舊值。
thresholdConfig:
  defaults:
    mysql_connections: 80
    mysql_threads_running: 30      # running-thread SATURATION warning (threads_running, NOT host CPU%); 80→30 = PMM/Nichter "high" tier (#944); renamed from mysql_cpu (#1231)
    mysql_replication_lag: 30  # async replication lag warning (seconds behind primary, sql_delay-adjusted) (#1200 WS5-P0-a)
    pg_connections: 80   # % of max_connections warning；pg 兩鍵升 chart_default（#1200 Q3=C / D4 folding）
    pg_replication_lag: 30   # replication lag warning (seconds)（#1200 Q3=C / D4 folding）
    container_cpu: 80
    container_cpu_throttle: 25
    container_memory: 85
  state_filters:
    container_crashloop:
      reasons: ["CrashLoopBackOff"]
      severity: "critical"
    container_imagepull:
      reasons: ["ImagePullBackOff", "InvalidImageName"]
      severity: "warning"
  tenants: {}    # Populated per-environment via values override

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

replicaCount: 1

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
