# CI/CD environment configuration for threshold-exporter

image:
  repository: ghcr.io/vencil/threshold-exporter
  tag: v0.8.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

# 本 repo 自帶的 Prometheus（k8s/03-monitoring/deployment-prometheus.yaml）在
# `monitoring`、pod label 是 `app: prometheus`，所以這裡把 exporter 的 ingress
# 收到只放它進來。chart 預設 allowExternal: true（只限 port、不限來源），因為
# chart 無從得知客戶的 scraper label（#1425）。
networkPolicy:
  allowExternal: false
  prometheusNamespace: monitoring
  prometheusPodLabels:
    app: prometheus

exporter:
  listenAddr: ":8080"
  reloadInterval: "60s"    # Less frequent in CI

# CI threshold config — thresholds would be managed via GitOps
# ⚠️ 這裡的 defaults 會 deep-merge 覆蓋 helm/threshold-exporter/values.yaml 的同名 key，
#    所以必須與 chart 預設同步 — 否則 `-f environments/ci/...` 會把已校準的預設靜默蓋回舊值。
thresholdConfig:
  # 規則包的閾值都內建在 exporter 裡（#3832、#4163），這裡一個都不寫（#3924）：
  # 平台值跟著 exporter 映像，沒有平台值的鍵由租戶給。
  defaults: {}
  state_filters:
    container_crashloop:
      reasons: ["CrashLoopBackOff"]
      severity: "critical"
    container_imagepull:
      reasons: ["ImagePullBackOff", "InvalidImageName"]
      severity: "warning"
  tenants: {}    # Populated per-environment via values override

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

replicaCount: 1

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
