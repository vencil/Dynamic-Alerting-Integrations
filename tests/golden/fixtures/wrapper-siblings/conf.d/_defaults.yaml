defaults:
  mysql_connections: 80
  container_memory: 85
state_filters:
  container_crashloop:
    reasons: ["CrashLoopBackOff"]
    severity: "critical"
optional_overrides:
  - oracle_process_count
_routing_defaults:
  receiver:
    type: "email"
    to: ["dba-oncall@example.com"]
  group_wait: "30s"
