# _defaults.yaml — Platform global defaults
# Managed by Platform Team. Tenant files should NOT contain this section.
defaults:
  cpu_usage: 80
  mem_usage: 90
  disk_usage: 85
optional_overrides:
- cpu_usage
- oracle_process_count
state_filters:
  container_crashloop:
    reasons: ["CrashLoopBackOff"]
    severity: "critical"
