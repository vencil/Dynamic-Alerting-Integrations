# Render baseline for helm/victorialogs in tests and lints that are not about
# its consumer registry. The chart's default is auth.mode=enforce, which
# refuses to render until every consumer has a Secret (#1295); this file names
# one per consumer, so they judge what an operator deploys — enforce, with the
# Secret-backed env vars — not the observe migration step.
# Only the Secrets: `auth.existingSecrets` is a map, so the registry
# (`auth.consumers`) is NOT restated here (#3847).
# tests/helm/test_victorialogs_vmauth.py holds the keys equal to the registry.
auth:
  existingSecrets:
    vector: victorialogs-vector
    grafana: victorialogs-grafana
    chargeback-aggregator: victorialogs-chargeback-aggregator
    federation-gateway: victorialogs-federation-gateway
    federation-reconciler: victorialogs-federation-reconciler
