# Render baseline for helm/tenant-api in tests that are not about writeBack.
# The chart refuses to render without writeBack.mode (#2855); these tests
# check other parts of the Deployment, so they render the acknowledged
# direct mode, which adds no Secret reference or forge flag.
# Tests about writeBack itself are in test_write_back_guard.py.
#
# The chart also refuses to render without a git repository in conf.d: the
# generator container is required (#2903) and reads only git objects. A
# pvc conf.d with no gitRepoUrl stands for "a repository already there" — no
# clone; it adds the git-gc-off init container (and the chart's own PVC).
confDir:
  type: pvc
writeBack:
  mode: direct
  directAcknowledgeNotDelivered: true
