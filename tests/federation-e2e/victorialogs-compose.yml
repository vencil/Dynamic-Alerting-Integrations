# Victorialogs-mode federation E2E stack — ADR-021 #609 PR-5. SEPARATE from the
# metrics-plane docker-compose.yml so the existing federation E2E is untouched.
# Launched by scripts/ops/federation_e2e_run.sh (victorialogs phase), which renders
# the federation-gateway chart in `mode=victorialogs` into rendered/victorialogs/
# before `compose up`.
#
# Stack:
#   mock-logstore <-- vmauth (real, enforce) <-- federation-gateway(victorialogs mode) <-- pytest driver (host)
#                        ^-- pytest driver, as each registered consumer (#1295)
#
# vmauth is the real image with the real args and auth.yml, rendered from
# helm/victorialogs by render_vmauth.py into rendered/victorialogs/vmauth.compose.yml
# (a compose override the runner passes with -f): `auth.mode: enforce` and a password
# for every registered consumer, so the gateway's requests reach the store only if
# the gateway really authenticates. The mock listens on the backend port INSIDE
# vmauth's network namespace — the same loopback-only hop VictoriaLogs has in the pod.
#
# The mock-logstore echoes the AccountID/ProjectID headers the gateway injected (it
# does NOT reimplement VictoriaLogs partitioning — see mock_logstore.py + README
# §victorialogs fidelity boundary). The assertion target is the gateway's header
# handling: JWT-verified AccountID always wins over any client spoof, fail-closed on
# a missing/malformed claim, audience-bound (metrics token 401s), endpoint allowlist;
# and vmauth's per-consumer authorization.

services:
  # Stand-in for VictoriaLogs — a pure-stdlib echo server. python:alpine has no pip
  # deps needed (mock_logstore.py is stdlib only).
  mock-logstore:
    image: python:3.14.10-alpine3.23
    command: ["python", "/app/mock_logstore.py", "${E2E_VL_BACKEND_PORT:?set by federation_e2e_run.sh from helm/victorialogs auth.backendPort}"]
    # vmauth's network namespace: reachable only through vmauth, as in the pod.
    network_mode: "service:vmauth"
    volumes:
      - ./mock_logstore.py:/app/mock_logstore.py:ro
    healthcheck:
      # The echo server answers any path; /healthz is fine. wget is in alpine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${E2E_VL_BACKEND_PORT}/healthz"]
      interval: 2s
      timeout: 1s
      retries: 30

  # Layer 2 — Envoy gateway in victorialogs mode. Config rendered from the REAL
  # Helm chart into rendered/victorialogs/ by the runner (helm template
  # --set mode=victorialogs --set jwt.audience=tenant-federation-logs). The
  # distroless image has no shell, so no compose healthcheck — the pytest driver
  # does its own readiness probe.
  federation-gateway-logs:
    image: envoyproxy/envoy:distroless-v1.38.0
    # One worker: the Lua filter caches the log-store credential PER WORKER, so
    # with several the rotation scenario (VL10) could land on a worker that had
    # never loaded the old password and pass without proving a re-read.
    command: ["-c", "/etc/envoy/envoy.yaml", "--concurrency", "1"]
    volumes:
      - ./rendered/victorialogs/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./rendered/victorialogs/revoked_check.lua:/etc/envoy/revoked_check.lua:ro
      - ./rendered/victorialogs/audit_extract.lua:/etc/envoy/audit_extract.lua:ro
      - ./rendered/jwks.json:/etc/jwks/jwks.json:ro
      - ./rendered/victorialogs/revoked.txt:/etc/revoked/revoked.txt
      # The chart mounts the Secret here (federation-gateway deployment.yaml).
      - ./rendered/victorialogs/gateway-password:/etc/victorialogs-auth/password:ro
    ports:
      - "${E2E_VL_GATEWAY_PORT:-18081}:8080"
    depends_on:
      mock-logstore:
        condition: service_healthy
  # `vmauth` (store-side authorization, #1295) is defined entirely by
  # rendered/victorialogs/vmauth.compose.yml — see render_vmauth.py.
