# Where CI runs each auto-stage pre-commit hook that no workflow names (#2694).
#
# The rule this ledger closes: every auto-stage hook in .pre-commit-config.yaml
# must EITHER be called by id (`pre-commit run <id> ...`) in a `run:` script
# under .github/workflows/, OR have an entry here saying where else CI enforces
# it. Pinned by tests/lint/test_precommit_ci_ledger.py, which reds on a hook in
# neither place, on an entry for a hook that is gone / not auto-stage / already
# called by id, and on evidence that does not resolve.
#
# Categories (the #2644 inventory, plus tenant-id-json-check):
#   a       another CI job runs the same check. evidence: workflow (repo path)
#           + job (a key of that workflow's `jobs:`) + note.
#   b       a pytest reds when a violation the hook rejects is planted in the
#           tree. evidence: pytest (node ids: a file, or file::Name[::name]).
#   exempt  the hook cannot mean anything in CI. evidence: reason.
#
# ⚠️ What the guard checks is that the evidence RESOLVES (file, job, test name
# exist), not that it still catches a violation: that was measured once per
# entry by planting one (#2644) and is not re-measured here. Nor does it check
# that an (a) job is ungated — go-fmt's go-lint is path-gated on purpose.
hooks:
- id: sed-damage-guard
  category: exempt
  evidence:
    reason: Compares the working tree with HEAD (NUL bytes added, file shrunk by more than
      50%); a CI checkout IS HEAD, so it is green by construction. NUL bytes are gated in
      CI by head-blob-hygiene (docs-ci) and file-hygiene (Lint).
- id: secrets-scan-staged
  category: exempt
  evidence:
    reason: Scans only the staged files pre-commit hands it (trufflehog filesystem); a clean
      CI checkout has nothing staged. The server-side counterpart is secret-scan.yml (trufflehog
      on the PR).
- id: workload-closure-drift
  category: b
  evidence:
    pytest:
    - tests/lint/test_check_workload_closure_drift.py
    - tests/dx/test_paired_trend_watch.py
