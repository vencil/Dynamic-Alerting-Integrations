# #3276 G1: every value a da-tools command takes, and what it is.
# The rules and the kinds: tests/shared/test_caller_path_manifest.py (module docstring).
# `by` names the reader that judges a `reader` input (documentation; the gate checks pinned_by).
# A flag declared with `_lib_input.add_input` (#3446) has no line here: its
# declaration is on the parser (`action.input_spec`), and the gate reads it there.

# COMMAND_MAP entries that dispatch to Go: no Python parser to walk.
dispatched_to_go: [batch-pr, guard, parser]

commands:
  alert-correlate:
    "--lookback": not_path
    "--min-score": not_path
    "--prometheus": url
    "--window": not_path
  alert-quality:
    "--min-score": not_path
    "--period": not_path
    "--prometheus": url
    "--tenant": not_path
  analyze-gaps:
    "--output": output
  backtest:
    "--baseline": {kind: reader, by: "da-guard served-values", pinned_by: "tests/shared/test_caller_path_manifest.py::test_a_reader_refuses_a_missing_input_by_name"}
    "--config-dir": {kind: reader, by: "da-guard served-values", pinned_by: "tests/shared/test_caller_path_manifest.py::test_a_reader_refuses_a_missing_input_by_name"}
    "--git-diff": not_path
    "--lookback": not_path
    "--markdown-output": output
    "--metric": not_path
    "--new-value": not_path
    "--old-value": not_path
    "--output": output
    "--prometheus": url
    "--tenant": not_path
  baseline:
    "--duration": not_path
    "--interval": not_path
    "--metrics": not_path
    "--output-dir": output
    "--prometheus": url
    "--tenant": not_path
  batch-diagnose:
    "--namespace": not_path
    "--output": output
    "--prometheus": url
    "--tenants": not_path
    "--timeout": not_path
    "--workers": not_path
  blind-spot:
    "--exclude-jobs": not_path
    "--prometheus": url
  byo-check:
    "--alertmanager": url
    "--prometheus": url
    target: not_path
  cardinality-forecast:
    "--limit": not_path
    "--lookback": not_path
    "--prometheus": url
    "--tenant": not_path
    "--warn-days": not_path
  check-alert:
    "--prometheus": url
    alert_name: not_path
    tenant: not_path
  config-diff:
    "--at": not_path
    "--format": not_path
  config-history diff:
    id_a: not_path
    id_b: not_path
  config-history log:
    "--limit": not_path
  config-history show:
    id: not_path
  config-history snapshot:
    "--message": not_path
  cutover:
    "--namespace": not_path
    "--prometheus": url
    "--tenant": not_path
  deprecate:
    "--plane": not_path
    "--root-dir": {kind: reader, by: "da-guard parse-tree", pinned_by: "tests/shared/test_caller_path_manifest.py::test_a_reader_refuses_a_missing_input_by_name"}
    metrics: not_path
  diagnose:
    "--prometheus": url
    tenant: not_path
  discover-mappings:
    "--endpoint": url
    "--instance": not_path
    "--job": not_path
    "--output": output
    "--prometheus": url
  drift-detect:
    "--context": not_path
    "--ignore-prefix": not_path
    "--kubeconfig": {kind: reader, by: "kubectl, relayed as rc 2", pinned_by: "tests/shared/test_caller_path_manifest.py::test_kubectls_refusal_of_a_kubeconfig_is_relayed"}
    "--labels": not_path
    "--mode": not_path
    "--namespace": not_path
  evaluate-policy:
  explain-keys:
    "--at": not_path
    "--da-guard-binary": {kind: reader, by: "the da-guard resolver", pinned_by: "tests/shared/test_caller_path_manifest.py::test_a_reader_refuses_a_missing_input_by_name"}
    "--tenant": not_path
    "--timeout": not_path
  explain-route:
    "--alertname": not_path
    "--label": not_path
    "--severity": not_path
    "--tenant": not_path
  fed-key:
    "--jwks-out": output
    "--key-bits": not_path
    "--namespace": not_path
    "--secret-key": not_path
    "--secret-name": not_path
  federation-check:
    "--edge-urls": url_list
    "--prometheus": url
    target: not_path
  generate-routes:
    "--configmap": not_path
    "--findings-json": output
    "--namespace": not_path
    "--output": output
    # #1560: a path inside the Alertmanager container, written into the
    # rendered `<field>_file`; never opened here.
    "--secret-mount-root": not_path
    "--secret-mounts-out": output
  generator-service:
    "--cache-max-bytes": not_path
    "--config-subdir": {kind: reader, by: "git ls-tree of HEAD at start, the judgement's own reading (_gsvc_child.tree_entries): no directory there is refused, no entry at all is an empty conf.d", pinned_by: "tests/shared/test_caller_paths.py::test_generator_service_refuses_a_config_subdir_that_is_no_directory"}
    "--da-guard-binary": {kind: reader, by: "the one da-guard resolution (flag, then $DA_GUARD_BINARY, then PATH); a da-guard there that does not run is 503 tool_fault naming da-guard (#3862)", pinned_by: "tests/ops/test_generator_service.py::test_the_da_guard_flag_is_the_one_that_judges_and_is_reported"}
    "--deadline-reserve-seconds": not_path
    "--git": {kind: reader, by: "the exec of --git (OSError named with the flag)", pinned_by: "tests/shared/test_caller_paths.py::test_generator_service_names_a_git_it_cannot_run"}
    "--max-body-bytes": not_path
    "--max-cache-transfer-bytes": not_path
    "--max-connections": not_path
    "--max-inflight-body-bytes": not_path
    "--max-judgement-seconds": not_path
    "--max-queue": not_path
    "--max-result-bytes": not_path
    "--max-writes": not_path
    "--memory-limit-bytes": not_path
    "--policy": {kind: reader, by: "read for every judgement: policy_unusable", pinned_by: "tests/ops/test_generator_service.py::test_policy_is_read_for_every_judgement"}
    "--read-timeout-seconds": not_path
    "--repo": {kind: reader, by: "git, at start (rev-parse --show-object-format --show-prefix, in git_env: no inherited GIT_DIR / GIT_WORK_TREE …): not a repository, or a directory inside one, refuses to start naming --repo; a work tree it cannot list is still a repository git reads (#3739)", pinned_by: "tests/ops/test_generator_service.py::test_a_repo_that_is_no_repository_is_named"}
    "--socket": output
    "--warm-ref": not_path
    "--warm-seconds": not_path
    "--work-dir": output
  gitops-check local:
  grafana-import:
    "--name": not_path
    "--namespace": not_path
  init:
    "--ci": not_path
    "--config-source": not_path
    "--da-tools-image": not_path
    "--deploy": not_path
    "--git-branch": not_path
    "--git-path": not_path
    "--git-period": not_path
    "--git-repo": not_path
    "--namespace": not_path
    "--output-dir": output
    "--rule-packs": not_path
    "--tenants": not_path
  lint:
    "--exclude": not_path
    paths: any
  migrate:
    "--output-dir": output
    "--prefix": not_path
    "--tenant": not_path
    input_file: {kind: reader, by: "da-read (Prometheus' rule loader)", pinned_by: "tests/ops/test_migrate_rule_outputs.py::test_missing_input_file_exits_caller_error"}
  migrate-credentials:
    "--manifests-out": output
  migrate-to-operator:
    "--config-dir": {kind: reader, by: "refused whatever the value: no conf.d is read, rc 2 with the routing remedy (#3572)", pinned_by: "tests/ops/test_operator_routing_single_renderer.py::test_each_alertmanagerconfig_flag_is_refused_naming_it"}
    "--namespace": not_path
    "--output-dir": output
    "--receiver-template": not_path
    "--secret-key": not_path
    "--secret-name": not_path
  offboard:
    "--config-dir": {kind: reader, by: "da-guard parse-tree", pinned_by: "tests/shared/test_caller_path_manifest.py::test_a_reader_refuses_a_missing_input_by_name"}
    tenant: not_path
  onboard:
    "--da-crdecode-binary": {kind: reader, by: _lib_consumer_read, pinned_by: "tests/shared/test_caller_path_manifest.py::test_a_reader_refuses_a_missing_input_by_name"}
    "--da-read-binary": {kind: reader, by: _lib_consumer_read, pinned_by: "tests/shared/test_caller_path_manifest.py::test_a_reader_refuses_a_missing_input_by_name"}
    "--exclude": not_path
    "--output-dir": output
    "--rule-files": any
    "--tenant-label": not_path
  opa-evaluate:
    "--config-dir": {kind: reader, by: "da-guard served-values", pinned_by: "tests/shared/test_caller_path_manifest.py::test_a_reader_refuses_a_missing_input_by_name"}
    "--opa-binary": {kind: reader, by: "OPA binary not found", pinned_by: "tests/ops/test_policy_opa_bridge.py::test_binary_missing"}
    "--opa-url": url
    "--policy-package": not_path
    "--policy-path": {kind: reader, by: "opa eval -d (a failed eval is rc 2)", pinned_by: "tests/ops/test_policy_opa_bridge.py::test_binary_that_does_not_evaluate"}
  operator-check:
    # #1560: a CR name, not a path.
    "--alertmanager": not_path
    "--kubeconfig": {kind: reader, by: "kubectl through _lib_kubectl (KubectlError)", pinned_by: "tests/shared/test_caller_path_manifest.py::test_kubectls_refusal_of_a_kubeconfig_is_relayed"}
    "--namespace": not_path
    "--prometheus": url
  operator-generate:
    "--api-version": not_path
    "--components": not_path
    "--config-dir": {kind: reader, by: "refused whatever the value: no conf.d is read, rc 2 with the routing remedy (#3572)", pinned_by: "tests/ops/test_operator_routing_single_renderer.py::test_each_alertmanagerconfig_flag_is_refused_naming_it"}
    "--namespace": not_path
    "--output-dir": output
    "--receiver-template": not_path
    "--secret-key": not_path
    "--secret-name": not_path
    "--selector-label": not_path
  patch-config:
    "--configmap": not_path
    "--exporter-namespace": not_path
    "--exporter-port": not_path
    "--exporter-selector": not_path
    "--namespace": not_path
    "--poll-interval": not_path
    "--reload-timeout": not_path
    metric_key: not_path
    tenant: not_path
    value: not_path
  rule-pack-diff:
    "--from": {kind: reader, by: "da-read (Prometheus' rule loader)", pinned_by: "tests/ops/test_rule_pack_diff.py::test_main_missing_input_exits_2"}
    "--to": {kind: reader, by: "da-read (Prometheus' rule loader)", pinned_by: "tests/ops/test_rule_pack_diff.py::test_main_missing_input_exits_2"}
  rule-pack-split:
    "--namespace": not_path
    "--output-dir": output
  runtime-audit:
    "--prometheus": url
  scaffold:
    "--db": not_path
    "--mapping-filter": not_path
    "--mapping-instance": not_path
    "--namespaces": not_path
    "--output-dir": output
    "--profile": not_path
    "--routing-group-by": not_path
    "--routing-group-interval": not_path
    "--routing-group-wait": not_path
    "--routing-profile": not_path
    "--routing-receiver": not_path
    "--routing-receiver-type": not_path
    "--routing-repeat-interval": not_path
    "--routing-smarthost": not_path
    "--severity-dedup": not_path
    "--silent-mode": not_path
    "--tenant": not_path
    "--topology": not_path
  shadow-verify:
    "--alertmanager": url
    "--prometheus": url
    phase: not_path
  silencer-drift-check:
    "--exclude": not_path
    "--rule-source": any
  state-reconcile:
    "--manifest-path": {kind: reader, by: "read_old_manifest: an existing one that is not a manifest is manifest_unreadable, never overwritten", pinned_by: "tests/ops/test_state_reconcile.py::test_an_unreadable_manifest_is_not_overwritten"}
  tenant-verify:
    "--expect-merged-hash": not_path
    tenant_id: not_path
  test-notification:
    "--rate-limit": not_path
    "--tenant": not_path
    "--timeout": not_path
  threshold-govern:
    "--lookback": not_path
    "--min-delta-pct": not_path
    "--min-samples": not_path
    "--prometheus": url
    "--tenant": not_path
  threshold-recommend:
    "--lookback": not_path
    "--min-samples": not_path
    "--prometheus": url
    "--tenant": not_path
  validate:
    "--convergence-output": output
    "--interval": not_path
    "--new": not_path
    "--old": not_path
    "--output-dir": output
    "--prometheus": url
    "--rounds": not_path
    "--stability-window": not_path
    "--tolerance": not_path
  validate-config:
    "--lint-policy": {kind: reader, by: "lint_custom_rules --policy (subprocess, #3797: validate-config never reads it; lint's own declared document judges it, its rc 2 is the custom_rules caller_error row)", pinned_by: "tests/ops/test_validate_config.py::test_lint_policy_is_lint_s_own_input"}
    "--rule-packs": {kind: reader, by: "lint_custom_rules --rule-pack-dir (subprocess; its rc 2 is the custom_rules caller_error row, #3755)", pinned_by: "tests/ops/test_validate_config.py::test_rule_packs_lint_refusal_is_a_caller_error_row"}
