# property-coverage.yaml — Property + mutation pilot coverage manifest.
#
# Per-module declaration of which top-level functions ARE in the
# property-pilot (`tests/shared/test_property_tools.py` +
# `tests/shared/_mutation_pilot.py`). The companion lint
# `scripts/tools/lint/check_property_coverage.py` enforces:
#
#   1. Every function listed under `covered:` must have at least one
#      `test_*` reference in test_property_tools.py.
#   2. Every function in the source file that's NOT in `covered:` must
#      be in `excluded:` with a reason (so additions force triage).
#   3. Listed-but-missing-from-source functions error (manifest stale).
#
# Why this exists
# ---------------
#
# Gap 2 of the testing-quality memory roadmap (#327 - #345 closure):
# the pilot landed at 31 functions, but with no enforcement, new
# pure helpers added to these modules wouldn't get flagged for
# property tests. This file is the ratchet — every function in scope
# must be triaged (covered OR excluded with reason).
#
# Adding new functions
# --------------------
#
# When you add a new top-level function to a module listed below,
# the pre-commit lint will fail until you either:
#
#   - Add a property test in test_property_tools.py and a mutation
#     entry in _mutation_pilot.py, then list the function under
#     `covered:` here, OR
#   - List it under `excluded:` with a one-line reason explaining
#     why property testing isn't applicable (I/O-bound, orchestrator,
#     argparse helper, etc.).
#
# Adding a new module to scope
# ----------------------------
#
# To bring a new module into pilot scope, add it as a top-level key
# under `modules:` and triage every existing function. The lint will
# then enforce drift detection going forward.

modules:
  # ── Pure-helper libraries (high-leverage, broad-blast-radius) ────

  scripts/tools/_lib_validation.py:
    covered:
      - parse_duration_seconds
      - format_duration
      - validate_and_clamp
      - detect_cli_lang
      - i18n_text
    excluded:
      is_threshold_number_text: "#3457 fullmatch of the pattern generated from the recipe contract; held row by row to Go's grammar_ok column of threshold_value_matrix.json and to the grammar written as a digit count over 150k generated strings by tests/shared/test_threshold_value_parity.py"
      threshold_number: "#3457 is_threshold_number_text then float + isfinite; held row by row to Go's float_ok column and number by the same file (test_python_reads_a_threshold_number_as_the_matrix_says)"
      threshold_number_text: "#3457 repr, or the 17-digit exponent form when repr is outside the grammar; round trip through threshold_number run over 50k random floats and the edge values by test_threshold_number_text_reads_back_as_the_number"
      threshold_trim: "#3457 strips the code points generated from the threshold value matrix's header (Go's strings.TrimSpace); held row by row to Go's value_part column by tests/shared/test_threshold_value_parity.py::test_python_trims_as_the_matrix_says, the set itself by test_python_trim_set_is_the_matrix_header"
      written_threshold_number: "#3457 type dispatch over threshold_trim + threshold_number (a str) or float() (a decoded number); every branch example-pinned through its callers in tests/ops/test_threshold_recommend.py and tests/ops/test_config_diff.py, the str branch row by row in test_python_trims_as_the_matrix_says"
      url_problem: "#3528 the one URL judgement; scheme dispatch property-tested through its wrapper _lib_prometheus._validate_url_scheme (tests/shared/test_property_tools.py), every unusable shape run through every URL flag's parser by tests/shared/test_caller_path_manifest.py"
