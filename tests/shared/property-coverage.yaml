      _subroute_receiver_type: "#2244 two-branch accessor (dict receiver → type, else ''); exercised through test_critical_escalation.py"
      _renders_on_route: "#2252 two-branch emit predicate (truthy timing / non-empty list group_by) mirroring _apply_timing_params + _grar_routes; example-pinned via list_tenant_subroutes in test_generate_alertmanager_routes.py::TestDomainPolicyOverrideSubroutes"
