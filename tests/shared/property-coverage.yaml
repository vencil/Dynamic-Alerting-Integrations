      receiver_optional_problem: "#2295 optional receiver values by the schema's boolean properties + httpConfig (data-driven, not a numeric/string law); table-covered by receiver_presence_cases.json, whose AM column is asserted against Alertmanager config.Load in tests/alertmanager-inhibit"
