      shown_value: "#1560 ⑤-b the one exit of a config value into a message (mask a credential path, container → type and length, string → repr only when name-like); guarded by the dynamic canary matrix tests/ops/test_routing_value_canary_matrix.py and tests/ops/test_grar_credential_plaintext.py::test_no_message_quotes_a_credential_value"
