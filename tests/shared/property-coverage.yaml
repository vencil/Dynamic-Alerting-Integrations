# property-coverage.yaml — Property + mutation pilot coverage manifest.
#
# Per-module declaration of which top-level functions ARE in the
# property-pilot (`tests/shared/test_property_tools.py` +
# `tests/shared/_mutation_pilot.py`). The companion lint
# `scripts/tools/lint/check_property_coverage.py` enforces:
#
#   1. Every function listed under `covered:` must have at least one
#      `test_*` reference in test_property_tools.py.
#   2. Every function in the source file that's NOT in `covered:` must
#      be in `excluded:` with a reason (so additions force triage).
#   3. Listed-but-missing-from-source functions error (manifest stale).
#
# Why this exists
# ---------------
#
# Gap 2 of the testing-quality memory roadmap (#327 - #345 closure):
# the pilot landed at 31 functions, but with no enforcement, new
# pure helpers added to these modules wouldn't get flagged for
# property tests. This file is the ratchet — every function in scope
# must be triaged (covered OR excluded with reason).
#
# Adding new functions
# --------------------
#
# When you add a new top-level function to a module listed below,
# the pre-commit lint will fail until you either:
#
#   - Add a property test in test_property_tools.py and a mutation
#     entry in _mutation_pilot.py, then list the function under
#     `covered:` here, OR
#   - List it under `excluded:` with a one-line reason explaining
#     why property testing isn't applicable (I/O-bound, orchestrator,
#     argparse helper, etc.).
#
# Adding a new module to scope
# ----------------------------
#
# To bring a new module into pilot scope, add it as a top-level key
# under `modules:` and triage every existing function. The lint will
# then enforce drift detection going forward.

modules:
  # ── Pure-helper libraries (high-leverage, broad-blast-radius) ────

  scripts/tools/_lib_validation.py:
    covered:
      - parse_duration_seconds
      - format_duration
      - is_disabled
      - validate_and_clamp
      - detect_cli_lang
      - i18n_text
    excluded:
      receiver_field_state: "#2137; table-covered by receiver_presence_cases.json"
      receiver_exactly_one_problem: "#2137 exactly-one receiver field groups over RECEIVER_TYPES (data-driven, not a numeric/string law); table-covered by tests/ops/test_generate_alertmanager_routes.py::TestBuildReceiverConfig pagerduty cases and tests/ops/test_notification_tester.py"
      receiver_required_problem: "#2180 required receiver fields by the schema's type + pattern (data-driven, not a numeric/string law); table-covered by receiver_presence_cases.json, whose AM column is asserted against Alertmanager config.Load in tests/alertmanager-inhibit"
      _find_tenant_schema: "#2180 file locator (I/O); same two-layout shape as _grar_validate._find_platform_rules_configmap, exercised by every receiver_required_problem call"
      _receiver_field_schemas: "#2180 schema reader (I/O + cache); its output is pinned by tests/shared/test_receiver_spec_parity.py"

  scripts/tools/_lib_io.py:
    covered:
      - load_yaml_file
      - iter_yaml_files
      - format_json_report
      - safe_label
    excluded:
      load_tenant_configs: "Orchestrator over iter_yaml_files + load_yaml_file_exporter_keys; composite contract is exercised by integration tests (text tenant ids: tests/ops/test_tenant_id_as_text.py, #2114)"
      load_yaml_file_exporter_keys: "load_yaml_file's I/O + error contract over _lib_yaml_keys' loader (#2114); the key rule is table-pinned against the exporter's decode in tests/shared/test_tenant_id_yaml_spelling_parity.py (22 spellings, Go half asserts the same table), not a value computation this function owns"
      load_yaml_file_for_rewrite: "load_yaml_file_exporter_keys' I/O + error contract over _lib_yaml_keys.RewriteLoader (#2220); the no-retype property is pinned end to end against the exporter's served values in tests/ops/test_rewrite_preserves_plain_scalars.py, not a value computation this function owns"
      strict_load_for_rewrite: "strict_safe_load driver with StrictRewriteLoader (#2220); pinned end to end against the exporter's served values in tests/ops/test_rewrite_preserves_plain_scalars.py"
      write_text_secure: "Side-effecting I/O; SAST guard ensures chmod pairing"
      write_json_secure: "Side-effecting I/O; same SAST guarantee as write_text_secure"
      write_onboard_hints: "Thin wrapper over write_json_secure"
      write_text_or_die: "Side-effecting I/O + sys.exit wrapper over write_text_secure (#1641); contract pinned by tests/shared/test_write_failure_class.py"
      write_json_or_die: "Side-effecting I/O + sys.exit wrapper over write_json_secure (#1641); same gate"
      ensure_dir: "Side-effecting I/O (mkdir -p) raising OutputWriteError (#1641); same gate"
      ensure_dir_or_die: "Side-effecting I/O + sys.exit wrapper over ensure_dir (#1641); same gate"
      _die_on_write_error: "print-to-stderr + sys.exit; no value computation (#1641)"
      read_onboard_hints: "I/O-bound; covered by integration test"
      add_config_dir_arg: "argparse boilerplate; not a value computation"
      add_json_arg: "argparse boilerplate"
      add_ci_arg: "argparse boilerplate"
      add_prometheus_arg: "argparse boilerplate"
      exit_on_yaml_file_error: "CLI-entry decorator (stderr + sys.exit on YamlFileError, #1654); example-pinned in tests/shared/test_yaml_file_error.py, no value computation to fuzz"
      output_write: "Context manager wrapping a raw output sink (#1789); the value it computes is delegated to _output_write_names_target, and the wrapping itself is side-effect-free control flow — example-pinned in tests/shared/test_lib_io_output_write.py"
      _output_write_names_target: "Pure predicate, but its inputs are real OSError instances the kernel populates (errno/filename/filename2); a generated OSError would test the fixture rather than the predicate (#1789) — example-pinned in tests/shared/test_lib_io_output_write.py"
      exit_on_output_write_error: "CLI-entry decorator (stderr + sys.exit on OutputWriteError, #1789); same rationale as exit_on_yaml_file_error, no value computation to fuzz"
      find_metric_dictionary: "Filesystem probe over two fixed candidate paths (issue 1513); the answer is which file exists on disk, not a value law — example-pinned for both layouts and the none-found case in tests/ops/test_metric_dictionary_inputs.py"
      # #2123 strict YAML reading. The key-identity rule is a closed matrix
      # measured against yaml.v3 (one row per branch of the rule), which a
      # generator would only re-derive from the implementation under test.
      _key_identity: "yaml.v3 uniqueKeys identity (kind + raw text, #2123); example-pinned row by row against the measured yaml.v3 matrix in tests/shared/test_yaml_strict_loader.py"
      duplicate_in_mapping: "One-mapping scan over _key_identity (#2123); same matrix in tests/shared/test_yaml_strict_loader.py"
      find_duplicate_key: "Whole-tree walk over duplicate_in_mapping (#2123); matrix + visit-once (alias fan-out) pins in tests/shared/test_yaml_strict_loader.py"
      raise_on_duplicate_key: "Raise-wrapper over find_duplicate_key (#2123); no value computation of its own"
      reject_equal_constructed_keys: "Legacy constructed-key identity kept for two lints (#2123); pinned by the no-widening tests in tests/shared/test_yaml_strict_loader.py"
      RejectDuplicateKeys.construct_document: "Loader hook calling raise_on_duplicate_key then PyYAML (#2123); exercised through strict_safe_load"
      _strict_loader_class: "Loader-class selector + type guard (#2123); example-pinned (TypeError on a non-strict loader)"
      strict_safe_load: "I/O-free but a thin driver over a PyYAML loader (#2123); matrix, parser-preservation and python/object refusal pinned in tests/shared/test_yaml_strict_loader.py"
      strict_safe_load_all: "Lazy multi-document driver (#2123); laziness and refusal pinned in tests/shared/test_yaml_strict_loader.py"
      load_yaml_file_strict: "File-reading twin of load_yaml_file (#2123); I/O-bound, contract parity pinned in tests/shared/test_yaml_strict_loader.py and across tools in tests/shared/test_duplicate_key_rejected_across_tools.py"
      # #2114 × #2123: strict reading composed with the exporter's key rule.
      _strict_exporter_key_class: "Loader-class selector (#2114 × #2123) over StrictExporterKeyLoader; exercised through every strict_*_exporter_keys pin in tests/shared/test_yaml_strict_loader.py"
      strict_load_exporter_keys: "strict_safe_load driven with StrictExporterKeyLoader (#2114 × #2123); identity matrix, python/object refusal and parser pinned in tests/shared/test_yaml_strict_loader.py; key text pinned in tests/shared/test_tenant_id_yaml_spelling_parity.py"
      strict_load_all_exporter_keys: "strict_safe_load_all driven with StrictExporterKeyLoader (#2114 × #2123); same pins as strict_load_exporter_keys"
      load_yaml_file_strict_exporter_keys: "File-reading twin of load_yaml_file_strict with exporter keys (#2114 × #2123); I/O-bound, contract pinned in tests/shared/test_yaml_strict_loader.py and across tools in tests/shared/test_duplicate_key_rejected_across_tools.py"
      # #2164 quoting of string fields. The verdict is PyYAML's resolver ×
      # the repo's JSON Schemas; a generator would re-derive both from the
      # code under test, so the tokens and schema shapes are example-pinned.
      compose_all_nodes: "Thin driver over a strict loader's check_node/get_node (#2164); exercised by every pin in tests/shared/test_yaml_misread_scalars.py"
      find_misread_scalars: "Node-tree × schema walk (#2164); token matrix (quoted controls, y/n, bool field, nullable field, enum, sequence, cross-file $ref, alias memo, schema-only verdict flip) pinned in tests/shared/test_yaml_misread_scalars.py"
      schema_scalar_types: "Scalar-type union over schema branches (#2164); string / boolean / mixed verdicts pinned in tests/shared/test_yaml_misread_scalars.py"
      MisreadScalar.message: "Operator-facing text (#2164); suggestion shapes (key / sequence item / null) pinned in tests/shared/test_yaml_misread_scalars.py"
      _schema_expand: "$ref / allOf / anyOf / oneOf expansion (#2164); cross-file $ref and unloaded-ref KeyError pinned in tests/shared/test_yaml_misread_scalars.py"
      _schema_key_children: "properties / patternProperties / additionalProperties child lookup (#2164); exercised through find_misread_scalars pins"
      _schema_item_children: "items / additionalItems child lookup (#2164); sequence-item pin in tests/shared/test_yaml_misread_scalars.py"
      _schema_pointer: "JSON-pointer fragment lookup (#2164); exercised through every $ref in the shipped schemas"
      _json_type_of: "Python value → JSON type name for const/enum (#2164); enum pin (_severity_dedup) in tests/shared/test_yaml_misread_scalars.py"

  scripts/tools/_lib_yaml.py:
    excluded:
      write_yaml_crd: "Side-effecting I/O (writes YAML to disk via write_text_secure); same SAST-guard rationale as _lib_io.write_text_secure/write_json_secure"
      _dict_to_yaml: "Pure minimal-YAML fallback emitter; byte-output locked by golden characterization tests in tests/ops/test_lib_yaml.py (nested/list/bool/quote/unicode/empty-container cases)"

  scripts/tools/_lib_prometheus.py:
    covered:
      - _validate_url_scheme
    excluded:
      http_get_json: "I/O-bound; covered by integration via tools that consume it"
      http_post_json: "I/O-bound; same as http_get_json"
      http_request_with_retry: "I/O + retry policy; covered by retry-specific integration tests"
      query_prometheus_instant: "I/O-bound; thin wrapper over http_get_json"
      query_prometheus_range: "I/O-bound; thin wrapper over http_get_json (r3 W1 fetch-core consolidation)"
      probe_health: "I/O-bound; thin urlopen probe over _validate_url_scheme (r3 W2 health-probe consolidation)"

  scripts/tools/_lib_godispatch.py:
    # Note: members of this module are class methods on
    # GoBinaryDispatcher, so the manifest uses dotted Class.method
    # notation. The lint's AST walker recognises both bare-function
    # names and Class.method names.
    covered:
      - GoBinaryDispatcher._resolve_binary
    excluded:
      GoBinaryDispatcher._msg: "Trivial bilingual selector; covered transitively by detect_cli_lang"
      GoBinaryDispatcher._recover_explicit_attempt: "Defensive helper for error messages; structurally simpler than _resolve_binary"
      GoBinaryDispatcher._print_binary_missing: "Side-effecting (prints to stderr); error-message templating"
      GoBinaryDispatcher.binary_missing_message: "Error-message templating; asserted by the missing-binary tests of the shims and _lib_tenant_values"
      GoBinaryDispatcher.resolve_binary: "The resolution step of _resolve_binary (covered), split out so _lib_tenant_values resolves da-guard the same way"
      GoBinaryDispatcher.dispatch: "Side-effecting (subprocess.run); covered by integration tests of guard/batchpr/parser shims"

  # ── DX tools (doc/changelog/scaffold) ─────────────────────────────

  scripts/tools/dx/generate_doc_map.py:
    covered:
