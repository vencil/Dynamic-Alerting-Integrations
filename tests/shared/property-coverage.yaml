      am_duration_seconds: "#2490 Alertmanager duration parser; its law is Go model.ParseDuration, so it is table-pinned row by row against tests/shared/am_duration_matrix.json (written by Go) in tests/shared/test_am_duration_parity.py rather than re-derived by a generator"
      positive_seconds: "#2942 argparse type: accepts a value iff float() parses it to a finite number above 0; boundary table in tests/shared/test_lib_python.py::TestPositiveSeconds"
