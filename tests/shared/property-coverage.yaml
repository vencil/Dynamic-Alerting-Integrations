      get_latest_tag: "Side-effecting (git subprocess); covered by integration"
      get_commits_since: "Side-effecting (git subprocess); covered by integration"
      load_ignored_commits: "I/O (reads .changelog-lint-ignore)"
      lint_changelog: "Multi-rule walker over commit list; covered by tests/dx/test_generate_changelog* unit tests"
      format_changelog: "Pure but template-heavy; output churn would dominate; covered by snapshot/golden tests"
      main: "CLI entry point; covered by CLI integration tests"
      lint_entry_caps: "Section growth per new entry; boundary / retro / no-base / deletion-credit cases are pinned in tests/dx/test_generate_changelog.py (TestSectionGrowthCap)"
      _section_size: "Two-value accessor over section_lines + iter_entries; covered by the cap tests"
      _git_show: "Side-effecting (git subprocess); real-repo test in TestCapBase"
      lint_unreleased_frozen: "Entry-count delta over the base (#2102); pinned in tests/dx/test_changelog_fragments.py and cells B/F of TestTheGrowthCapHasOneBaseResolverAndItIsFailClosed"
