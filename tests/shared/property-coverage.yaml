      assemble_fragments: "I/O + ordering; section/topic/created order and mixed-offset order pinned in tests/dx/test_changelog_fragments.py"
      check_fragments_consumed: "I/O (git tree + worktree) + exit code for make pre-tag; leftover / README-only / uncommitted-deletion / no-git cases pinned in tests/dx/test_changelog_fragments.py"
