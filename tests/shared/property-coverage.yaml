      url_has_userinfo: "#1560 ⑤-a urllib.parse.urlsplit username test (fail-closed on a URL it refuses); boundary table (user only, @ in path/query/fragment, non-http scheme, no authority) in tests/shared/test_credential_plaintext_policy.py::test_userinfo_boundaries"
      _walk_present: "#1560 ⑤-a walk of one site pattern (key / * / []) yielding every value; every row and wildcard example-pinned by tests/shared/test_credential_plaintext_policy.py"
      _written_out: "#1560 ⑤-a type test (non-empty scalar, not null / '' / mapping / list); its quiet cases pinned per row by tests/shared/test_credential_plaintext_policy.py::test_reference_only_rows"
      plaintext_credential_findings: "#1560 ⑤-a table-driven judgement over CREDENTIAL_REF_SITES.plaintext + CREDENTIAL_PLAINTEXT_SITES (data, not a numeric/string law); positive and negative example per row in tests/shared/test_credential_plaintext_policy.py"
      _step_matches: "#1560 ⑤-b one step of a table path against a concrete step ('*' any key, '[]' any index, else equal); exercised for every row by tests/ops/test_grar_credential_plaintext.py::test_no_message_quotes_a_credential_value"
