# property-coverage.yaml — Property + mutation pilot coverage manifest.
#
# Per-module declaration of which top-level functions ARE in the
# property-pilot (`tests/shared/test_property_tools.py` +
# `tests/shared/_mutation_pilot.py`). The companion lint
# `scripts/tools/lint/check_property_coverage.py` enforces:
#
#   1. Every function listed under `covered:` must have at least one
#      `test_*` reference in test_property_tools.py.
#   2. Every function in the source file that's NOT in `covered:` must
#      be in `excluded:` with a reason (so additions force triage).
#   3. Listed-but-missing-from-source functions error (manifest stale).
#
# Why this exists
# ---------------
#
# Gap 2 of the testing-quality memory roadmap (#327 - #345 closure):
# the pilot landed at 31 functions, but with no enforcement, new
# pure helpers added to these modules wouldn't get flagged for
# property tests. This file is the ratchet — every function in scope
# must be triaged (covered OR excluded with reason).
#
# Adding new functions
# --------------------
#
# When you add a new top-level function to a module listed below,
# the pre-commit lint will fail until you either:
#
#   - Add a property test in test_property_tools.py and a mutation
#     entry in _mutation_pilot.py, then list the function under
#     `covered:` here, OR
#   - List it under `excluded:` with a one-line reason explaining
#     why property testing isn't applicable (I/O-bound, orchestrator,
#     argparse helper, etc.).
#
# Adding a new module to scope
# ----------------------------
#
# To bring a new module into pilot scope, add it as a top-level key
# under `modules:` and triage every existing function. The lint will
# then enforce drift detection going forward.

modules:
  # ── Pure-helper libraries (high-leverage, broad-blast-radius) ────

  scripts/tools/_lib_validation.py:
    covered:
      - parse_duration_seconds
      - format_duration
      - is_disabled
      - validate_and_clamp
      - detect_cli_lang
      - i18n_text

  scripts/tools/_lib_io.py:
    covered:
      - load_yaml_file
      - iter_yaml_files
      - format_json_report
      - safe_label
    excluded:
      load_tenant_configs: "Orchestrator over iter_yaml_files + load_yaml_file (both covered); composite contract is exercised by integration tests"
      write_text_secure: "Side-effecting I/O; SAST guard ensures chmod pairing"
      write_json_secure: "Side-effecting I/O; same SAST guarantee as write_text_secure"
      write_onboard_hints: "Thin wrapper over write_json_secure"
      read_onboard_hints: "I/O-bound; covered by integration test"
      add_config_dir_arg: "argparse boilerplate; not a value computation"
      add_json_arg: "argparse boilerplate"
      add_ci_arg: "argparse boilerplate"
      add_prometheus_arg: "argparse boilerplate"

  scripts/tools/_lib_yaml.py:
    excluded:
      write_yaml_crd: "Side-effecting I/O (writes YAML to disk via write_text_secure); same SAST-guard rationale as _lib_io.write_text_secure/write_json_secure"
      _dict_to_yaml: "Pure minimal-YAML fallback emitter; byte-output locked by golden characterization tests in tests/ops/test_lib_yaml.py (nested/list/bool/quote/unicode/empty-container cases)"

  scripts/tools/_lib_prometheus.py:
    covered:
      - _validate_url_scheme
    excluded:
      http_get_json: "I/O-bound; covered by integration via tools that consume it"
      http_post_json: "I/O-bound; same as http_get_json"
      http_request_with_retry: "I/O + retry policy; covered by retry-specific integration tests"
      query_prometheus_instant: "I/O-bound; thin wrapper over http_get_json"
      query_prometheus_range: "I/O-bound; thin wrapper over http_get_json (r3 W1 fetch-core consolidation)"
      probe_health: "I/O-bound; thin urlopen probe over _validate_url_scheme (r3 W2 health-probe consolidation)"

  scripts/tools/_lib_godispatch.py:
    # Note: members of this module are class methods on
    # GoBinaryDispatcher, so the manifest uses dotted Class.method
    # notation. The lint's AST walker recognises both bare-function
    # names and Class.method names.
    covered:
      - GoBinaryDispatcher._resolve_binary
    excluded:
      GoBinaryDispatcher._msg: "Trivial bilingual selector; covered transitively by detect_cli_lang"
      GoBinaryDispatcher._recover_explicit_attempt: "Defensive helper for error messages; structurally simpler than _resolve_binary"
      GoBinaryDispatcher._print_binary_missing: "Side-effecting (prints to stderr); error-message templating"
      GoBinaryDispatcher.dispatch: "Side-effecting (subprocess.run); covered by integration tests of guard/batchpr/parser shims"

  # ── DX tools (doc/changelog/scaffold) ─────────────────────────────

  scripts/tools/dx/generate_doc_map.py:
    covered:
      - _audience_str
      - _parse_front_matter
    excluded:
      _extract_h1_title: "Trivial regex on first '# ' line; surface too small to property-test meaningfully"
      _has_en_pair: "Pure path stem check; trivial enough that tests would over-specify Path API behavior"
      _get_map_path: "Constant lookup over MAP_PATHS; would just re-state the dict"
      gather_docs: "Walks docs/ tree; I/O-bound, covered by integration via main()"
      generate_doc_map: "Orchestrator combining gather_docs + _audience_str + write; integration-test territory"
      main: "CLI entry point; covered by tests/dx/test_generate_doc_map.py CLI tests"

  scripts/tools/dx/generate_changelog.py:
    covered:
      - parse_commit
    excluded:
      git_cmd: "Side-effecting subprocess.run wrapper"
      get_latest_tag: "Side-effecting (git subprocess); covered by integration"
      get_commits_since: "Side-effecting (git subprocess); covered by integration"
      load_ignored_commits: "I/O (reads .changelog-lint-ignore)"
      lint_changelog: "Multi-rule walker over commit list; covered by tests/dx/test_generate_changelog* unit tests"
      format_changelog: "Pure but template-heavy; output churn would dominate; covered by snapshot/golden tests"
      main: "CLI entry point; covered by CLI integration tests"

  scripts/tools/dx/axe_lite_static.py:
    covered:
      - strip_frontmatter
      - scan_unicode_status
      - scan_buttons_without_name
      - scan_unlabeled_inputs
      - scan_color_only_severity
    excluded:
      _find_opening_tag: "Substring-search helper; trivial bracket-balance logic, transitively covered by every scanner that uses it"
      check_file: "Orchestrator combining all scan_* functions on a file; covered by integration"
      main: "CLI entry point"

  # ── Ops: routing pipeline + rule-pack split ──────────────────────

  scripts/tools/ops/generate_rule_pack_split.py:
    covered:
      - extract_metrics_from_expr
    excluded:
      get_lang: "Trivial env-var dispatcher; covered transitively by detect_cli_lang"
      t: "Bilingual string selector wrapper around get_lang"
      _safe_write: "I/O wrapper around write_text_secure"
      dump_yaml: "Serialization helper; thin wrapper over yaml.safe_dump"
      load_rule_pack: "I/O (yaml load)"
      extract_recording_outputs: "Pure but tightly coupled to PrometheusRule CRD shape; covered by tests/ops/test_generate_rule_pack_split.py with realistic fixtures"
      to_prometheus_rule_crd: "Output-shape transformation; covered by snapshot tests"
      validate_central_references_edge: "Multi-rule validator; covered by tests/ops/test_generate_rule_pack_split.py"
      _is_external_pipeline_input: "Pure string classifier for federated external inputs (liveness/injected/per-tenant-exporter); covered by explicit unit tests in tests/ops/test_generate_rule_pack_split.py"
      is_federated_exporter_metric: "TRK-353 shared per-tenant-exporter-family predicate (the one provenance SSOT, also imported by check_scrape_reachability); single startswith over _FEDERATED_EXPORTER_PREFIXES — example-covered by tests/ops/test_generate_rule_pack_split.py::TestIsExternalPipelineInput (family hit / non-family `*_up` miss) and by the platform-gauge mutation pins in tests/lint/test_check_scrape_reachability.py"
      _group_follows_suffix: "Boolean suffix-convention predicate driving the fail-loud routing WARN; covered by tests/ops/test_generate_rule_pack_split.py"
      split_rule_pack: "Orchestrator combining extract_metrics_from_expr + extract_recording_outputs + to_prometheus_rule_crd"
      process_rule_packs: "Top-level orchestrator over directory walk + split_rule_pack"
      main: "CLI entry point"

  scripts/tools/ops/_grar_merge.py:
    covered:
      - _substitute_tenant
      - _contains_tenant_placeholder
      - merge_routing_with_defaults
      - _apply_timing_params
    excluded:
      build_receiver_config: "Heavy state-machine over RECEIVER_TYPES; covered by test_generate_alertmanager_routes.py integration"

  scripts/tools/ops/_grar_validate.py:
    covered:
      - _extract_host
      - validate_receiver_domains
      - validate_tenant_keys
    excluded:
      load_policy: "I/O-bound; thin wrapper over load_yaml_file (covered)"
      _validate_profile_refs: "Covered by test_e2e_routing_profile.py integration"
      check_domain_policies: "Multi-branch policy validator; covered by test_e2e_routing_profile.py + test_domain_policy.py + test_grar_strict_hardening.py (strict fail-open closures)"
      _parse_policy_duration: "Pure duration parser (multi-unit/fractional/negative-reject); table-covered by test_grar_strict_hardening.py::TestParsePolicyDuration (23 example cases)"
      _validate_version_label: "ADR-024 OQ-6 version-label guard; fully branch-covered by test_generate_alertmanager_routes.py::TestValidateVersionLabel (8 example cases)"
      find_watchdog_suppressing_inhibits: "ADR-025 D1 inhibit-immunity validator; fully covered by test_generate_routes_orchestration.py::TestWatchdogInhibitImmunity (exact/regex/match-all/empty/severity/legacy-map cases)"
      assert_watchdog_inhibit_immunity: "Raises-wrapper over find_watchdog_suppressing_inhibits; covered by TestWatchdogInhibitImmunity + the assemble fail-closed test"
      find_tenant_silenceable_platform_inhibits: "Tenant-cannot-silence-platform finder (tenant-gated source × platform-matching target); example-covered by test_generate_routes_orchestration.py::TestPlatformAlertsNotTenantSilenceable (committed-base / mutation self-proof / narrowness / derived-label-set cases)"
      assert_platform_alerts_not_tenant_silenceable: "Raises-wrapper over find_tenant_silenceable_platform_inhibits; covered by TestPlatformAlertsNotTenantSilenceable (assemble fail-closed + --validate tripwire)"
      _find_platform_rules_configmap: "#1494 layout-independent lookup (flat-image copy first, then k8s/ under any ancestor); example-covered by test_grar_strict_hardening.py::TestPlatformPackLocationIsLayoutIndependent (flat-with-pack / flat-without / repo-layout cases)"
      _warn_probe_set_degraded: "Print-once side effect on the fail-OPEN fallback path; covered by the same class (message names cause + emitted once per process)"
      platform_alert_identities: "Derives the guard's probe set from configmap-rules-platform.yaml (rule-level labels ∪ expr-produced, alert_source-filtered); example-covered by TestPlatformAlertsNotTenantSilenceable (runtime-default==derived, unreachable-ConfigMap fallback, unsampled-alertname) — property-testing a ConfigMap-shaped parser would only re-assert PyYAML"
      _configmap_rule_bodies: "Yields every rule-file body a kubelet projects from a ConfigMap doc (all data keys + base64-decoded binaryData, per-key fail-soft); example-covered by test_generate_routes_orchestration.py::TestPlatformIdentityReaderCompleteness (second-data-key / second-document / binaryData-decoded / undecodable-key-does-not-blank-the-set), each verified red against the pre-fix reader"
      _pinned_label_values: "Extracts literal `label=\"v\"` values from a matcher list (reuses _INHIBIT_MATCHER_RE); covered by TestPlatformAlertsNotTenantSilenceable::test_target_pinning_a_literal_tenant_is_still_caught + the structurally-unreachable false-positive guard"
      _matcher_matches_labels: "Pure AM-matcher evaluator; branch-covered transitively via find_watchdog_suppressing_inhibits cases (=, !=, =~, !~, invalid-regex → conservative match)"
      _inhibit_target_matchers: "Target-side normalizer (thin delegate to _inhibit_side_matchers); covered transitively via find_watchdog_suppressing_inhibits legacy-map + empty-list cases"
      _inhibit_side_matchers: "Source/target-side matcher normalizer (list vs legacy match/match_re maps); covered by TestEqualLabelGatedInvariant (legacy-map form) + TestWatchdogInhibitImmunity (delegated target side)"
      _matchers_gate_label_present: "#1132 presence-gate predicate (does a side exclude the empty string for a label); fully covered by test_generate_routes_orchestration.py::TestEqualLabelGatedInvariant (matchall/exact/neg-empty/legacy-map cases)"
      find_ungated_equal_label_inhibits: "#1132 ungated-equal-label finder; covered by TestEqualLabelGatedInvariant (gated/ungated/partial/legacy-map/malformed) + the committed-configmap regression guard"
      assert_equal_labels_gated: "Raises-wrapper over find_ungated_equal_label_inhibits; covered by TestEqualLabelGatedInvariant + the strict-raise/warn enforce test"
      _canonical_tenant_key: "#1231 alias canonicalizer, exact-match mirror of Go canonicalKeyFor; example-covered by test_generate_alertmanager_routes.py::TestDeprecatedKeyAliases (exact/_critical/dimensional/prefix-typo-reject) + pinned to the registry SSOT by test_check_threshold_registry.py::test_python_alias_mirror_pinned_to_registry"
      _canonicalize_alias_keys: "#1231 alias pre-pass (canonical view + NOTICE lines); covered by TestDeprecatedKeyAliases (old/new defaults, both-spellings dedup, notice wording pins) via validate_tenant_keys"

  # ── Lint helpers (small but load-bearing) ─────────────────────────

  scripts/tools/lint/_lint_helpers.py:
    covered:
      - parse_command_map
      - parse_build_sh_tools
      - parse_build_sh_tool_paths
    excluded:
      parse_command_map_keys: "Trivial wrapper around parse_command_map; covered transitively"
      _parse_build_sh_array: "#1494 shared reader extracted from parse_build_sh_tool_paths (array name parameterised); every existing property test of parse_build_sh_tools / parse_build_sh_tool_paths now runs through it"
      parse_build_sh_array_text: "#1494 THE build.sh array reader (the file-reading _parse_build_sh_array is a thin wrapper, and check_image_pin_capability now delegates here instead of transcribing it); boundary rules table-covered by test_check_build_completeness.py::TestBuildShArrayReaderMatchesBash::test_block_boundaries_are_word_anchored (9 cases, both directions) plus four mutation-catalog entries, all 4/4 CAUGHT"
      _array_words: "#1494 shlex split of one array fragment; exercised by every case in TestBuildShArrayReaderMatchesBash including the quoted and `#`-in-name forms"
      _split_at_array_close: "#1494 the ONE close rule for build.sh array lines (header and body alike); quote-aware. Table-covered by test_check_build_completeness.py::TestBuildShArrayReaderMatchesBash::test_block_boundaries_are_word_anchored, whose `);` / `) > /dev/null` / quoted-`(` rows were taken from real bash, plus a mutation-catalog entry that disables the quote tracking"
      _strip_bom: "#1494 one-liner shared by both text readers (it was inline in each and the first fix landed in only one); mutation-catalog entry 'strip_bom: stop stripping the BOM' is CAUGHT by the BOM row of that table via test_the_tag_blob_parser_has_the_same_boundaries specifically — the sibling test goes through the file wrapper, whose utf-8-sig has already eaten the BOM, so it cannot kill it"
      parse_command_map_text: "#1494 THE COMMAND_MAP reader — check_image_pin_capability delegates here instead of transcribing it; covered by the pre-existing parse_command_map property tests (the file wrapper is now a one-line delegate) plus two mutation-catalog entries, both CAUGHT"
      strip_bash_comment: "#1494 transcription of bash's word-start `#` rule; table-covered by test_check_build_completeness.py::TestBuildShArrayReaderMatchesBash (bare / quoted / trailing-comment / `#`-in-name / quoted-`#`-in-name), expectations taken from a real bash expansion"
      parse_build_sh_repo_data_files: "#1494 thin wrapper over _parse_build_sh_array for build.sh's second copy lane; repo-level assertions in test_check_build_completeness.py::TestRepoDataFilesArePairedWithTheirConsumer"
      array_open_pattern: "#1494 one-line regex source for a word-anchored bash array header; behaviour pinned by test_check_build_completeness.py::TestBuildShArrayReaderMatchesBash::test_block_boundaries_are_word_anchored (EXTRA_TOOL_FILES must not match TOOL_FILES) plus the mutation-catalog entry that injects the old unanchored substring form"
      _array_open_re: "#1494 lru_cache compile of array_open_pattern; no behaviour of its own"
      resolve_diff_base: "Env-var lookup + git rev-parse subprocess wrapper; integration-tested via check_codename_leak --ci runs (smoke verified missing-base error path)"
      get_diff_added_lines: "Subprocess wrapper around git diff --unified=0; parsing logic split into _parse_unified_zero_diff which has dedicated unit tests in test_check_codename_leak.py::TestDiffParsing"
      _parse_unified_zero_diff: "Pure parser tested via 5 parametrized cases in test_check_codename_leak.py::TestDiffParsing covering simple add, multi-add hunk, deletion-only, mixed hunks with distinct line numbers, empty input"
      parse_bypass_tag: "Regex matcher tested via 7 parametrized cases in test_check_codename_leak.py::TestBypassTag covering basic match, optional issue, wrong lint name, case-insensitive, empty body, multi-bypass disambiguation"

  scripts/tools/lint/check_flaky_registry.py:
    covered:
      - parse_version
      - latest_version_from_changelog
    excluded:
      validate_entry: "Multi-rule schema validator; covered by 28 unit tests in test_check_flaky_registry.py"
      validate_registry: "Top-level dispatcher; covered by 28 unit tests"
      main: "CLI entry point; covered by CLI tests in test_check_flaky_registry.py"
      Issue.format: "Trivial f-string templating on dataclass; covered transitively by validate_entry/validate_registry tests"
      # Note: dunder methods (Version.__lt__/__ge__/__str__) are
      # filtered out by the AST walker (they're not "function-shaped"
      # value computations worth a separate manifest entry). Coverage
      # for these is provided indirectly via TestParseVersionProperties
      # tests of `<` / `>=` / round-trip.
