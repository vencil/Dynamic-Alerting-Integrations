  - id: tenant-api-refuses-nonspecific-scalar-policy
    reader: tenant-api
    layer: policy
    match: {shape: s6-nonspecific-value, verdict: unusable}
    mechanism: >-
      一個 domain 或它的 constraints 寫成 non-specific tag 的引號 scalar
      （`fin: ! '~'`、`constraints: ! "null"`）。PyYAML 讀成字串，產生器跳過該
