# 讀取端差異清單（ADR-036 第 2 步：policy 層與路由層）
#
# 產生器（純 Python PyYAML）是權威；Go 讀取端每一處與它不同的判讀，都必須
# 在這裡有一筆記錄。本清單只負責「接受」差異，差異本身來自兩處：
#   - policy 層：da-guard 的 ParseDomainPolicies 讀 `_domain_policy.yaml` 與
#     _parse_config_files 不同的列，由 Go 測試寫進
#     tests/shared/merge_key_go_verdicts.json（每列一個 corpus row id）。
#   - 路由層：tests/shared/routing_policy_parity_matrix.json 每個格子
#     （樹 × 租戶）的 Go 欄位與 python_differs（產生器的值）不同的欄位；每個
#     有斷言該欄位的 Go 半邊各算一筆差異（routingpolicy：pkg/routingpolicy
#     的半邊，da-guard 用的套件；da-guard）。
#   - tenant-api 自 #2903 起不再自己判 routing／policy（寫入一律交給產生器
#     判定），所以不再是讀取端，也不在本清單裡。
#
# 把關（tests/shared/test_reader_divergence_catalog.py）：
#   - 每一筆差異必須恰好被一筆記錄比中；沒比中、比中兩筆都紅。
#   - 方向由測試計算，與 direction 不同就紅——不靠人手寫。policy 層依兩邊
#     實際執行的規則集合的包含關係；產生器以 --validate --strict 執行時會擋
#     的檔（語料的 pyyaml_strict_blocks）等同不可用：Go 既不拒收、也不回報
#     會擋的問題，就是寬。路由層：產生器擋下／拒收／丟棄而 Go 沒有是寬，
#     反過來是嚴，其餘的值不同（例如 targets 不同）是 value_differs。
#   - count 是精確值；example 必須在比中的列裡；比中零列或零格（差異已消
#     失）、列出的列或格已不再是差異，都紅。清單一改，數字就出現在 diff 裡。
#   - go_looser／value_differs 一律擋住 ADR-036 第二階段，必須逐列（policy
#     層 match.rows）或逐格（路由層 match.cells）列出，處置只能是
#     fix-pending。
#   - expire_at 過期：一般 PR CI 只警告；`make pre-tag`（或設
#     READER_DIVERGENCE_STRICT_EXPIRY=1）時失敗。
#
# 欄位：
#   id:          記錄名稱，唯一
#   reader:      policy 層 da-guard；路由層 routingpolicy | da-guard
#   layer:       policy | routing
#   match:       policy 層：{shape: <corpus shape>}（該 reader 在快照裡屬於此
#                shape 的所有列；`seeded` 指沒有 shape 的固定種子列）、
#                {shape: ..., verdict: unusable}（其中 Go 判為 unusable 的列）
#                或 {rows: [<row id>, ...]}；shape 只給 go_stricter。
#                路由層：{cells: [[<tree>, <tenant>, <field>], ...]}，field 是
#                python_differs 的欄位，且必須是該 reader 有斷言的欄位。
#   mechanism:   差異的成因
#   direction:   go_looser | go_stricter | value_differs（由測試核對）
#   disposition: accept-document（只限 go_stricter，需 sign_off）|
#                fix-pending
#   ref:         追蹤票 URL
#   sign_off:    owner「以產生器為準」簽核留言的 URL（測試只能檢查格式）
#   expire_at:   到期日（ISO 日期）
#   count:       比中的列數或列出的格數（精確值）
#   example:     policy 層必填：比中的列之一（row id）；路由層已逐格列出，不填

entries:
  # --- da-guard：比產生器嚴（拒收產生器照讀的檔）---------------------------
  - id: da-guard-omap-pairs-item-model
    reader: da-guard
    layer: policy
    match: {shape: known-stricter-2759}
    mechanism: >-
      da-guard 手寫模擬 PyYAML 建構 `!!omap` / `!!pairs` 項目（以及「先被建成
      mapping、再被當 omap 項目引用」的錨點）時，不照 PyYAML 的建構順序；
      PyYAML 照讀的檔，da-guard 判為不可用。
    direction: go_stricter
    disposition: accept-document
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2759
    sign_off: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2759#issuecomment-6093354532
    expire_at: 2027-04-10
    count: 12
    example: 11508912abc9aa82

  - id: da-guard-fuzz-refusals
    reader: da-guard
    layer: policy
    # 逐列列出而不以 shape 比對：同一個 shape 裡也有一列 go_looser
    # （da-guard-strict-block-tenants），一列只能被一筆記錄比中。
    match:
      rows:
        - 1c9718cd114053b4
        - 1d01ff650f8f5cfc
        - 2a8d97bbbf771c37
        - 3262c48b82a8bc8b
        - 423fcee29bad4909
        - 5e1080d9b0e22906
        - 5f64b898ec1d1de4
        - 7668c52653b98139
        - 7c2450582f547295
        - 7dd38ba5b8dc97fd
        - 835ab62908028e95
        - 8c6bc91dba3aec88
        - 9ec8eae0ad1383b2
        - a3b2640c0621026c
        - a8b1165d87b88b06
        - ad68935480e56cad
        - bd151680098bb2d5
        - c7a0b3546b5d0743
        - f6b3702c42d1a6ec
    mechanism: >-
      固定種子的混合語料（null key、`!!omap` / `!!pairs` / `!!set`、merge、
      錨點交錯）裡，da-guard 拒收而產生器照讀、--strict 也不擋的列；成因與
      上一筆同屬 omap／pairs 建構模型。
    direction: go_stricter
    disposition: accept-document
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2759
    sign_off: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2759#issuecomment-6093354532
    expire_at: 2027-04-10
    count: 19
    example: 1c9718cd114053b4

  # --- da-guard：比產生器寬（擋住第二階段）---------------------------------
  - id: da-guard-2759-a-depth-600
    reader: da-guard
    layer: policy
    match:
      rows:
        - 41778ed26cf6cd86  # x: 600 層巢狀 list
        - 80663c6b81671bcb  # x: 600 層巢狀 mapping
    mechanism: >-
      #2759 A：巢狀 600 層時 PyYAML 的遞迴建構放棄，產生器丟檔；da-guard
      照讀出 policy。
    direction: go_looser
    disposition: fix-pending
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2759
    expire_at: 2027-01-10
    count: 2
    example: 41778ed26cf6cd86

  - id: da-guard-2759-f-set
    reader: da-guard
    layer: policy
    match:
      rows:
        - 27314f4f6be08885  # domain_policies: !!set（block）
        - f835e22ca5ccd23b  # fin: !!set（block）
        - 640251281ed28e48  # constraints: !!set（block）
        - 7cc78fffa4cde516  # domain_policies: !!set（flow）
        - 93d7d6f7f65fff6a  # fin: !!set（flow）
        - c7ac54712c07e570  # constraints: !!set（flow）
    mechanism: >-
      #2759 F：`!!set` 放在 domain_policies、domain 或 constraints。PyYAML
      只留下 key 的集合（不是 mapping），產生器丟檔或不執行該 policy；
      da-guard 當成 mapping 讀出 policy。
    direction: go_looser
    disposition: fix-pending
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2759
    expire_at: 2027-01-10
    count: 6
    example: 27314f4f6be08885

  - id: da-guard-2759-n-bom-512
    reader: da-guard
    layer: policy
    match:
      rows:
        - c318e5865a1d83c2  # 註解內的 BOM 從 byte 510 開始
        - 1b6ca508500f3001  # 註解內的 BOM 從 byte 511 開始
    mechanism: >-
      #2759 N：UTF-8 BOM 放在註解裡、跨過 byte 512。產生器照讀並執行
      policy；da-guard 讀不到任何 policy，也不報錯。
    direction: go_looser
    disposition: fix-pending
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2759
    expire_at: 2027-01-10
    count: 2
    example: c318e5865a1d83c2

  - id: da-guard-strict-block-tenants
    reader: da-guard
    layer: policy
    match:
      rows:
        - 1f679544660aa7cf  # fin: {tenants: !!omap [{~: =}], ...}
        - bf4bf836f8694735  # fin: {tenants: !!pairs [t1, {~: =}], ...}
        - c7c5d25c7697b387  # ops: &a0 {tenants: !!omap [[{a: 1}]]}（fuzz）
    mechanism: >-
      產生器以 --validate --strict 執行時，對該 domain 的 `tenants` 報
      blocking 的 domain_policy_unusable（`!!omap` / `!!pairs` 建出的項目不是
      租戶 id 字串，或整個值不是 list），整個檔被擋；da-guard 讀出 tenants、
      沒有任何 Problem，照常放行。
    direction: go_looser
    disposition: fix-pending
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2759
    expire_at: 2027-01-10
    count: 3
    example: 1f679544660aa7cf

  # --- 路由層：租戶檔的 `!!merge` key（#2700，擋住第二階段）------------------
  # 樹 tenant-merge-tag-key-2700：t1 寫 `!!merge q:`（#2700 原始重現），t2 寫
  # `!!merge _routing:`（換成已知 key）。
  - id: routingpolicy-2700-targets
    reader: routingpolicy
    layer: routing
    match:
      cells:
        - [tenant-merge-tag-key-2700, t1, targets]
        - [tenant-merge-tag-key-2700, t2, targets]
    mechanism: >-
      #2700：PyYAML 把任何帶 `!!merge` tag 的 key 當 merge key，把裡面的
      _routing 併進租戶，渲染出 slack receiver；Go 讀取端的 yaml.v3 只認字面
      `<<`，把它當普通 key：t1 沒有 _routing（targets null），t2 的 _routing
      是一個沒有 receiver 的 mapping（targets []）。
    direction: value_differs
    disposition: fix-pending
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2700
    expire_at: 2027-01-10
    count: 2

  - id: routingpolicy-2700-policy
    reader: routingpolicy
    layer: routing
    match:
      cells:
        - [tenant-merge-tag-key-2700, t1, policy]
        - [tenant-merge-tag-key-2700, t2, policy]
    mechanism: >-
      #2700：產生器以 --strict 擋下併進來的 slack receiver（domain 禁用
      slack）；pkg/routingpolicy 看不到這份 _routing，沒有任何違規。
    direction: go_looser
    disposition: fix-pending
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2700
    expire_at: 2027-01-10
    count: 2

  - id: da-guard-2700-policy
    reader: da-guard
    layer: routing
    match:
      cells:
        - [tenant-merge-tag-key-2700, t1, policy]
        - [tenant-merge-tag-key-2700, t2, policy]
    mechanism: >-
      #2700：產生器 --validate --strict 回報 slack 被禁用、rc 1；da-guard 讀不到
      併進來的 _routing，沒有 domain_policy_violation，rc 0。
    direction: go_looser
    disposition: fix-pending
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2700
    expire_at: 2027-01-10
    count: 2

  # --- 路由層：被蓋掉的 merge 來源裡有建不出來的值（#2713，擋住第二階段）----
  # 樹 tenant-merge-overridden-unconstructable-2713：t1 寫
  # `<<: {_routing: !!bool y}`，自己又寫了 _routing。
  - id: routingpolicy-2713-targets
    reader: routingpolicy
    layer: routing
    match:
      cells:
        - [tenant-merge-overridden-unconstructable-2713, t1, targets]
    mechanism: >-
      #2713：PyYAML 先建構所有 merge 來源的 pair 再合併，`!!bool y` 建不出來，
      產生器讀不了 t1.yaml、整棵樹拒收（沒有任何渲染）；yaml.v3 跳過被 t1 自己
      的 _routing 蓋掉的值，渲染出 pagerduty receiver。
    direction: value_differs
    disposition: fix-pending
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2713
    expire_at: 2027-01-10
    count: 1

  - id: routingpolicy-2713-refused
    reader: routingpolicy
    layer: routing
    match:
      cells:
        - [tenant-merge-overridden-unconstructable-2713, t1, refused]
    mechanism: >-
      #2713：產生器以 tenant_file_unreadable 拒收整棵樹（rc 1）；
      pkg/routingpolicy 照常讀出 t1 的路由，沒有任何拒收。
    direction: go_looser
    disposition: fix-pending
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2713
    expire_at: 2027-01-10
    count: 1

  - id: da-guard-2713-refused
    reader: da-guard
    layer: routing
    match:
      cells:
        - [tenant-merge-overridden-unconstructable-2713, t1, refused]
    mechanism: >-
      #2713：產生器 --validate --strict 報「config file could not be read」、
      rc 1；da-guard 讀得了整棵樹，沒有 parse_failed、沒有 finding，rc 0。
    direction: go_looser
    disposition: fix-pending
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2713
    expire_at: 2027-01-10
    count: 1
