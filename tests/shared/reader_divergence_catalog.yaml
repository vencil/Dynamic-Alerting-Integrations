# 讀取端差異清單（ADR-036 第 2 步：policy 層與路由層）
#
# 產生器（純 Python PyYAML）是權威；Go 讀取端每一處與它不同的判讀，都必須
# 在這裡有一筆記錄。本清單只負責「接受」差異，差異本身來自兩處：
#   - policy 層：da-guard 的 ParseDomainPolicies、tenant-api 的 parseConfig
#     讀 `_domain_policy.yaml` 與 _parse_config_files 不同的列，由 Go 測試寫進
#     tests/shared/merge_key_go_verdicts.json（每列一個 corpus row id）。
#   - 路由層：tests/shared/routing_policy_parity_matrix.json 每個格子
#     （樹 × 租戶）的 Go 欄位與 python_differs（產生器的值）不同的欄位；每個
#     有斷言該欄位的 Go 半邊各算一筆差異（routingpolicy：pkg/routingpolicy
#     的半邊，da-guard 與 tenant-api 共用的套件；da-guard；tenant-api）。
#
# 把關（tests/shared/test_reader_divergence_catalog.py）：
#   - 每一筆差異必須恰好被一筆記錄比中；沒比中、比中兩筆都紅。
#   - 方向由測試計算，與 direction 不同就紅——不靠人手寫。policy 層依兩邊
#     實際執行的規則集合的包含關係；產生器以 --validate --strict 執行時會擋
#     的檔（語料的 pyyaml_strict_blocks）等同不可用：Go 既不拒收、也不回報
#     會擋的問題，就是寬。路由層：產生器擋下／拒收／丟棄而 Go 沒有是寬，
#     反過來是嚴，其餘的值不同（例如 targets 不同）是 value_differs。
#   - tenant-api 拒收產生器照讀（且 --strict 不擋）的 policy 檔是
#     go_refuses，不算嚴：拒收後 watcher 沿用該檔上一份可用內容（可能是舊
#     policy），從未成功過則 policy 不可用——寫入回 503，但開了
#     --policy-unavailable-open 就一律放行。所以每筆 go_refuses 的簽核必須
#     交代這兩種情況。產生器也擋（丟檔或 --strict 擋）的檔被拒收，是兩邊
#     同判，不是差異。
#   - count 是精確值；example 必須在比中的列裡；比中零列或零格（差異已消
#     失）、列出的列或格已不再是差異，都紅。清單一改，數字就出現在 diff 裡。
#   - go_looser／value_differs 一律擋住 ADR-036 第二階段，必須逐列（policy
#     層 match.rows）或逐格（路由層 match.cells）列出，處置只能是
#     fix-pending。
#   - expire_at 過期：一般 PR CI 只警告；`make pre-tag`（或設
#     READER_DIVERGENCE_STRICT_EXPIRY=1）時失敗。
#
# 欄位：
#   id:          記錄名稱，唯一
#   reader:      policy 層 da-guard | tenant-api；路由層 routingpolicy |
#                da-guard | tenant-api
#   layer:       policy | routing
#   match:       policy 層：{shape: <corpus shape>}（該 reader 在快照裡屬於此
#                shape 的所有列；`seeded` 指沒有 shape 的固定種子列）、
#                {shape: ..., verdict: unusable}（其中 Go 判為 unusable 的列）
#                或 {rows: [<row id>, ...]}；shape 只給 go_stricter／go_refuses。
#                路由層：{cells: [[<tree>, <tenant>, <field>], ...]}，field 是
#                python_differs 的欄位，且必須是該 reader 有斷言的欄位。
#   mechanism:   差異的成因（go_refuses 另須寫明拒收的後果）
#   direction:   go_looser | go_stricter | go_refuses | value_differs（由測試核對）
#   disposition: accept-document（只限 go_stricter／go_refuses，需 sign_off）|
#                fix-pending
#   ref:         追蹤票 URL
#   sign_off:    owner「以產生器為準」簽核留言的 URL（測試只能檢查格式）
#   expire_at:   到期日（ISO 日期）
#   count:       比中的列數或列出的格數（精確值）
#   example:     policy 層必填：比中的列之一（row id）；路由層已逐格列出，不填

