  # --- tenant-api：拒收產生器照讀的 policy 檔（go_refuses）--------------------
  # 拒收的後果（每筆 mechanism 都寫明，簽核時必須交代）：
  #   - watcher（fileWiseParser，每 30 秒重讀）：拒收的那一份檔改用它上一份
  #     可用內容，另一份 policy 檔（.yaml／.yml）不受影響。上一份可能是舊
  #     policy：新版的收緊不生效，tenant-api 照舊版放行寫入。
  #   - 從未成功解析過（例如啟動時就是這份）：該檔不可用。direct 模式下，
  #     policy 判定的寫入（PUT /tenants/{id}、批次的路由 op）回 503
  #     POLICY_UNAVAILABLE；若設了 --policy-unavailable-open（或
  #     TA_POLICY_UNAVAILABLE_OPEN），這些寫入一律放行、完全不判 policy，只記
  #     log 與 tenant_api_policy_unavailable_open_total。
  #   - PR 模式（LoadSnapshot）：整份拒收，寫入被拒。
  # TODO(owner): 以下五筆的 sign_off 是佔位（#2759 本身，不是簽核留言）。請在
  # #2759 留下「以產生器為準、接受」並交代上面兩種情況的簽核，再把 sign_off
  # 換成該留言的 URL。
  - id: tenant-api-refuses-merge-key-spelling
    reader: tenant-api
    layer: policy
    match: {shape: seeded, verdict: unusable}
    mechanism: >-
      檔中任何位置有 PyYAML 當成 merge、字面卻不是 `<<` 的 key（`!!merge q:`、
      以 alias `*k` 當 key 指向 `<<`）。tenant-api 的 DomainPoliciesShapeError
      整份拒收（yaml.v3 自己的 merge 與產生器不同，#2663、#2677 R1），產生器
      照讀並執行。後果：watcher 改用該檔上一份可用內容（可能是舊 policy）；
      從未成功過則 policy 不可用，direct 模式寫入回 503，設了
      --policy-unavailable-open 則一律放行、不判 policy；PR 模式拒絕寫入。
    direction: go_refuses
    disposition: accept-document
    ref: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2759
    sign_off: https://github.com/vencil/Dynamic-Alerting-Integrations/issues/2759  # TODO(owner)
    expire_at: 2027-04-10
    count: 48
    example: 039f41da96df341d

