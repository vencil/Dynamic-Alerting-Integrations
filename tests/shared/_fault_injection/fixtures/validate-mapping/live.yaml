# The mapping migrate-rule writes (.migration/mapping/<tenant>.yaml, #4227)
tenant: tenant-x
rules_file: .migration/migrated/tenant-x/rules.yml
rules:
- group: mysql
  alert: MySQLTooManyConnections
  selectors:
  - legacy: mysql_global_status_threads_connected
    pinned: mysql_global_status_threads_connected{tenant="tenant-x"}
- group: mysql
  alert: MySQLSlowQueries
  selectors:
  - legacy: mysql_global_status_slow_queries
    pinned: mysql_global_status_slow_queries{tenant="tenant-x"}
- group: migrated-expiry
  alert: MigratedRulesExpiring
  added: true
  selectors: []
