# Prefix Mapping Table — the shape `migrate` writes (prefix-mapping.yaml)
custom_mysql_connections:
  original_metric: mysql_global_status_threads_connected
  alert_name: MySQLTooManyConnections
  golden_match: mysql_connections
  golden_rule: null
  old_query: max by(tenant) (mysql_global_status_threads_connected)
  new_query: tenant:custom_mysql_connections:max
custom_mysql_connections_critical:
  original_metric: mysql_global_status_threads_connected
  alert_name: MySQLTooManyConnectionsCritical
  golden_match: mysql_connections
  golden_rule: null
  old_query: max by(tenant) (mysql_global_status_threads_connected)
  new_query: tenant:custom_mysql_connections:max
custom_mysql_slow_queries:
  original_metric: mysql_global_status_slow_queries
  alert_name: MySQLSlowQueries
  golden_match: null
  golden_rule: null
  old_query: sum by(tenant) (rate(mysql_global_status_slow_queries[5m]))
  new_query: tenant:custom_mysql_slow_queries:sum
