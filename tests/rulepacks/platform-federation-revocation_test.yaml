# promtool behavioural tests for the federation-revocation reconciler alerts
# (ADR-028 D1 / #924). Contract:
#   1-2) TamperSuspected fires on a sustained suspected un-revoke (>0 for 5m),
#        never at 0.
#   3-5) ReconcileStale fires when the reconciler stops SUCCEEDING — last_reconcile
#        ts frozen (stuck/erroring) OR the metric absent (pod down) — and NOT while
#        the ts tracks time() (healthy). Guards the "detection silently blind" gap:
#        a fail-closed pass never refreshes the ts, so staleness surfaces it.
#   6-7) GatewayRevocationLoadFailure fires on a sustained fail-open read error
#        (>0 for 2m), never at 0 (the 2m debounce rides out pod-start / remount blips).
#   8-10) EvidenceChannelDown (#1234) fires when the heartbeat canary stops arriving
#        (channel_up == 0 for 15m) and never while it arrives. BOTH EDGES of the
#        for: window are pinned — still PENDING at 14m, FIRING at exactly 15m — so
#        a shortened `for:` cannot pass (asserting only past the window would let
#        `for: 5m` through, which is the mutation this pair is proved against).
#   15-16) The enforcement plane holding NO set at all (#1236): the projected key
#        is gone, so the gateway checks every token against an EMPTY set. critical
#        (the other three gateway alerts mean it is still enforcing something)
#        at >0 for 5m, never at 0. BOTH EDGES again — 4m PENDING, 5m FIRING.
#   11-14) The enforcement-plane staleness pair (#1235): LiveSetRejected (the file
#        as the reconciler reads it) and GatewayRevokedSetReloadRejected (the
#        gateway's own account of refusing the reload) each fire at >0 for 10m and
#        never at 0. BOTH EDGES again — 9m PENDING, 10m FIRING — because the `for:`
#        is the only thing separating "one anomalous pass" from "the enforcement
#        plane is frozen on a stale set", and a shortened one would otherwise pass.
#   17-20) THE LATCH (#1238 / TRK-352). Cases 1-16 only ever modelled conditions
#        that PERSIST, which is the half these gauges are naturally good at. A
#        gauge recomputed every 300s is structurally worst at holding a BOUNDED
#        occurrence — and that is the shape of the smallest real un-revoke. 17-19
#        are counterfactuals (they fail against the pre-#1238 rules); 20 pins the
#        cost the latch buys rather than a benefit.
# Run: promtool test rules tests/rulepacks/platform-federation-revocation_test.yaml
rule_files:
  - platform-federation-revocation.rules.yaml

evaluation_interval: 1m

tests:
  # 1) Suspected un-revoke sustained → FIRES after for:5m (not before).
  - interval: 1m
    name: tamper-fires-when-suspected
    input_series:
      - series: 'federation_revocation_tamper_suspected'
        values: '1+0x9'
    alert_rule_test:
      - eval_time: 4m
        alertname: FederationRevocationTamperSuspected
        exp_alerts: []
      - eval_time: 6m
        alertname: FederationRevocationTamperSuspected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation token un-revoke suspected — reconciler found a revoked-but-live token absent from the live set (ADR-028)"

  # 2) No tamper (0) → never fires.
  - interval: 1m
    name: tamper-clean-does-not-fire
    input_series:
      - series: 'federation_revocation_tamper_suspected'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 8m
        alertname: FederationRevocationTamperSuspected
        exp_alerts: []

  # 3) Reconciler healthy — last_reconcile ts tracks time() → NOT stale.
  - interval: 1m
    name: reconcile-fresh-not-stale
    input_series:
      - series: 'federation_revocation_last_reconcile_timestamp_seconds'
        values: '0+60x40'          # value == eval seconds → time()-value == 0
    alert_rule_test:
      - eval_time: 40m
        alertname: FederationRevocationReconcileStale
        exp_alerts: []

  # 4) Reconciler stuck — ts frozen (no successful pass) → stale FIRES after for:10m.
  - interval: 1m
    name: reconcile-frozen-fires-stale
    input_series:
      - series: 'federation_revocation_last_reconcile_timestamp_seconds'
        values: '60+0x60'          # frozen at 60; time()-60 crosses 1800 at ~31m
    alert_rule_test:
      - eval_time: 42m
        alertname: FederationRevocationReconcileStale
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation revocation reconciler stale or down — un-revoke detection is not operational (ADR-028)"

  # 5) Reconciler down — metric absent → stale FIRES via absent() after for:10m.
  - interval: 1m
    name: reconcile-absent-fires-stale
    input_series:
      - series: 'federation_revocation_tamper_suspected'   # unrelated, keeps the test populated
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: FederationRevocationReconcileStale
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation revocation reconciler stale or down — un-revoke detection is not operational (ADR-028)"

  # 6) Gateway fail-open sustained → FIRES after for:2m (not before).
  - interval: 1m
    name: gateway-failopen-fires
    input_series:
      - series: 'federation_gateway_revocation_load_errors'
        values: '2+0x9'
    alert_rule_test:
      - eval_time: 1m
        alertname: FederationGatewayRevocationLoadFailure
        exp_alerts: []
      - eval_time: 3m
        alertname: FederationGatewayRevocationLoadFailure
        exp_alerts:
          - exp_labels:
              severity: warning
              alert_source: platform
            exp_annotations:
              summary: "Federation gateway cannot read the revoked-set — fail-open is allowing revoked tokens (ADR-028 §fail-open)"

  # 7) Gateway clean (0) → never fires (the debounce rides out transients).
  - interval: 1m
    name: gateway-clean-does-not-fire
    input_series:
      - series: 'federation_gateway_revocation_load_errors'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 8m
        alertname: FederationGatewayRevocationLoadFailure
        exp_alerts: []

  # 8) Evidence channel healthy — the canary keeps arriving → NEVER fires.
  #    Held well past the 15m window so a stray inversion of the comparison
  #    (`!= 0` / `> 0`) would surface here rather than only in production.
  - interval: 1m
    name: evidence-channel-up-does-not-fire
    input_series:
      - series: 'federation_revocation_channel_up'
        values: '1+0x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: FederationRevocationEvidenceChannelDown
        exp_alerts: []

  # 9) Evidence channel dead — canary absent from the window → FIRES at for:15m.
  #    ⛔ BOTH EDGES. The 14m assertion (still PENDING, exp_alerts: []) is the
  #    load-bearing half: without it, shortening `for:` to 5m — which would page
  #    on a single missed heartbeat plus one skipped reconcile pass — still passes
  #    every remaining case. Proved by mutation: setting `for: 5m` in
  #    platform-federation-revocation.rules.yaml turns THIS eval red and nothing
  #    else.
  - interval: 1m
    name: evidence-channel-down-fires-at-for-boundary
    input_series:
      - series: 'federation_revocation_channel_up'
        values: '0+0x25'
    alert_rule_test:
      - eval_time: 14m          # for:-ε — pending, must NOT page yet
        alertname: FederationRevocationEvidenceChannelDown
        exp_alerts: []
      - eval_time: 15m          # exactly for: — fires
        alertname: FederationRevocationEvidenceChannelDown
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation revocation evidence channel is DEAD — un-revoke detection is silently blind (ADR-028 / #1234)"

  # 10) A single missed heartbeat window must NOT page. This is the false-positive
  #     guard the 15m window buys: channel_up dips to 0 for one reconcile interval
  #     (300s = 5 evals) and recovers, which the `for:` must absorb entirely.
  - interval: 1m
    name: evidence-channel-single-dip-does-not-fire
    input_series:
      - series: 'federation_revocation_channel_up'
        values: '1+0x4 0+0x4 1+0x20'   # up 5m, down 5m, up again
    alert_rule_test:
      - eval_time: 12m
        alertname: FederationRevocationEvidenceChannelDown
        exp_alerts: []
      - eval_time: 25m
        alertname: FederationRevocationEvidenceChannelDown
        exp_alerts: []

  # 11) The mounted revoked.txt carries a contract-violating line → the gateway is
  #     refusing to load the current set. FIRES at for:10m, not before.
  #     ⛔ BOTH EDGES. 10m is one reconcile interval (300s) plus an equal margin;
  #     the 9m assertion is what stops that being quietly shortened back to a
  #     single interval, where one anomalous pass would page.
  - interval: 1m
    name: live-set-rejected-fires-at-for-boundary
    input_series:
      - series: 'federation_revocation_live_set_rejected_lines'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 9m           # for:-ε — pending, must NOT page yet
        alertname: FederationRevocationLiveSetRejected
        exp_alerts: []
      - eval_time: 10m          # exactly for: — fires
        alertname: FederationRevocationLiveSetRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation revoked set violates its line contract — the gateway is refusing to load it, so revocations made since are NOT enforced (ADR-028 / #1235)"

  # 12) A clean live set (0) → never fires. Held past the window so an inverted
  #     comparison (`== 0` / `< 1`) surfaces here rather than in production.
  - interval: 1m
    name: live-set-clean-does-not-fire
    input_series:
      - series: 'federation_revocation_live_set_rejected_lines'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: FederationRevocationLiveSetRejected
        exp_alerts: []

  # 13) The gateway's own account: it refused a reload and kept its previous set.
  #     Separate metric, separate alert — the file can read clean from the
  #     reconciler's projection while the gateway is still refusing, which is why
  #     this one is not folded into #11.
  - interval: 1m
    name: gateway-reload-rejected-fires-at-for-boundary
    input_series:
      - series: 'federation_gateway_revoked_set_reload_rejected'
        values: '3+0x15'
    alert_rule_test:
      - eval_time: 9m           # for:-ε — pending, must NOT page yet
        alertname: FederationGatewayRevokedSetReloadRejected
        exp_alerts: []
      - eval_time: 10m          # exactly for: — fires
        alertname: FederationGatewayRevokedSetReloadRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation gateway REFUSED its revoked-set reload — it is enforcing a stale set, so revocations made since are NOT in force (ADR-028 / #1235)"

  # 14) No refusals in the window (0) → never fires.
  - interval: 1m
    name: gateway-reload-rejected-clean-does-not-fire
    input_series:
      - series: 'federation_gateway_revoked_set_reload_rejected'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: FederationGatewayRevokedSetReloadRejected
        exp_alerts: []

  # 15) Gateway reports the set is MISSING (#1236) → FIRES at for:5m, critical.
  #     BOTH EDGES pinned (4m PENDING, 5m FIRING): the `for:` is the only thing
  #     between "one anomalous window" and "the enforcement plane is open", and
  #     asserting only past the window would let a shortened one through — the
  #     same mutation the 15m and 10m pairs above are proved against.
  - interval: 1m
    name: gateway-revoked-set-missing-fires
    input_series:
      - series: 'federation_gateway_revoked_set_missing'
        values: '1+0x9'
    alert_rule_test:
      - eval_time: 4m
        alertname: FederationGatewayRevokedSetMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: FederationGatewayRevokedSetMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation gateway has NO revoked-set — it is enforcing an EMPTY set and honouring every revoked token (ADR-028 §fail-open)"

  # 16) File present in the window (0) → never fires.
  - interval: 1m
    name: gateway-revoked-set-missing-clean-does-not-fire
    input_series:
      - series: 'federation_gateway_revoked_set_missing'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 9m
        alertname: FederationGatewayRevokedSetMissing
        exp_alerts: []

  # ── 17-20) THE LATCH (#1238 / TRK-352) ──────────────────────────────────────
  # Cases 1-16 all model a condition that PERSISTS. That is the easy half, and
  # it is the only half that was ever tested. These four model the hard half: a
  # BOUNDED occurrence, which is the shape of the smallest real attack and the
  # shape every gauge here is structurally worst at holding.
  #
  # ⛔ Each of 17-19 is a counterfactual, not a confirmation: run it against the
  # pre-#1238 rules (`git show e2d72ce4:
  # tests/rulepacks/platform-federation-revocation.rules.yaml`) and the FIRING assertion fails — that is the whole
  # value of the change, measured rather than asserted. The trailing no-fire
  # assertion pins the 1h window itself: shorten it below the firing eval_time
  # and these go red.

  # 17) ⛔ THE #1238 ACCEPTANCE CASE. tamper_suspected non-zero for EXACTLY one
  # reconcile pass (300s == 5 one-minute samples), then back to 0 — an un-revoke
  # that was reverted before the next pass. Pre-#1238 this never fired at ANY
  # eval time, because `for: 5m` and the pass length are the same 300s, so the
  # gauge was always back to 0 one sample before the threshold was reached.
  - interval: 1m
    name: tamper-single-pass-blip-latches
    input_series:
      - series: 'federation_revocation_tamper_suspected'
        values: '1 1 1 1 1 0+0x70'
    alert_rule_test:
      # still inside `for:` — pending, not firing (pins that `for:` is honoured)
      - eval_time: 4m
        alertname: FederationRevocationTamperSuspected
        exp_alerts: []
      - eval_time: 5m
        alertname: FederationRevocationTamperSuspected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation token un-revoke suspected — reconciler found a revoked-but-live token absent from the live set (ADR-028)"
      # long after the gauge returned to 0, the detection is still pageable
      - eval_time: 30m
        alertname: FederationRevocationTamperSuspected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation token un-revoke suspected — reconciler found a revoked-but-live token absent from the live set (ADR-028)"
      # …and past the 1h window it clears (reset time is bounded, not infinite)
      - eval_time: 66m
        alertname: FederationRevocationTamperSuspected
        exp_alerts: []

  # 18) Same shape for the empty-enforcement-plane gauge (#1236). One
  # missing-read row observed by a single pass (300s) did NOT outlast `for: 5m`,
  # while the SAME row observed by two passes (600s) did — the alert fired or
  # not depending on pass alignment. Latched, alignment no longer decides.
  - interval: 1m
    name: gateway-revoked-set-missing-single-pass-latches
    input_series:
      - series: 'federation_gateway_revoked_set_missing'
        values: '1 1 1 1 1 0+0x70'
    alert_rule_test:
      - eval_time: 4m
        alertname: FederationGatewayRevokedSetMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: FederationGatewayRevokedSetMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation gateway has NO revoked-set — it is enforcing an EMPTY set and honouring every revoked token (ADR-028 §fail-open)"
      - eval_time: 30m
        alertname: FederationGatewayRevokedSetMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation gateway has NO revoked-set — it is enforcing an EMPTY set and honouring every revoked token (ADR-028 §fail-open)"
      - eval_time: 66m
        alertname: FederationGatewayRevokedSetMissing
        exp_alerts: []

  # 19) A SINGLE refused reload. The gauge counts rows in a ~600s window and is
  # rewritten every 300s, so one warning is non-zero for at most 600s — exactly
  # `for: 10m`. Pre-#1238 this NEVER fired: the last non-zero sample sits at 9m,
  # one minute short of the threshold. This is the case that showed the shipped
  # "the condition is PERSISTENT" rationale did not apply to this gauge.
  - interval: 1m
    name: gateway-reload-rejected-single-refusal-latches
    input_series:
      - series: 'federation_gateway_revoked_set_reload_rejected'
        values: '1+0x9 0+0x70'
    alert_rule_test:
      - eval_time: 9m
        alertname: FederationGatewayRevokedSetReloadRejected
        exp_alerts: []
      - eval_time: 10m
        alertname: FederationGatewayRevokedSetReloadRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation gateway REFUSED its revoked-set reload — it is enforcing a stale set, so revocations made since are NOT in force (ADR-028 / #1235)"
      - eval_time: 40m
        alertname: FederationGatewayRevokedSetReloadRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation gateway REFUSED its revoked-set reload — it is enforcing a stale set, so revocations made since are NOT in force (ADR-028 / #1235)"
      - eval_time: 72m
        alertname: FederationGatewayRevokedSetReloadRejected
        exp_alerts: []

  # 20) ⚠️ HONESTY CASE — pins the cost, not a benefit. A single SCRAPE sample
  # (not even a whole pass) latches too. `for:` therefore filters NOTHING on the
  # latched alerts; it is pure latency. This case exists so that nobody reads
  # the retained `for: 5m` as a debounce and "restores" it as one, and so that
  # the false-positive surface the latch buys is written down where it will be
  # run rather than only in a comment. The producer-side mitigation for the one
  # false positive we could name (a legitimate revocation reconciled before its
  # own ConfigMap projection has landed) is the reconciler's projection-grace,
  # NOT this `for:`.
  - interval: 1m
    name: tamper-single-sample-also-latches-for-does-not-filter
    input_series:
      - series: 'federation_revocation_tamper_suspected'
        values: '0 1 0+0x70'
    alert_rule_test:
      - eval_time: 6m
        alertname: FederationRevocationTamperSuspected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation token un-revoke suspected — reconciler found a revoked-but-live token absent from the live set (ADR-028)"
