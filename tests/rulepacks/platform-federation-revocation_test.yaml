# promtool behavioural tests for the federation-revocation reconciler alerts
# (ADR-028 D1 / #924). Contract:
#   1-2) TamperSuspected fires on a sustained suspected un-revoke (>0 for 5m),
#        never at 0.
#   3-5) ReconcileStale fires when the reconciler stops SUCCEEDING — last_reconcile
#        ts frozen (stuck/erroring) OR the metric absent (pod down) — and NOT while
#        the ts tracks time() (healthy). Guards the "detection silently blind" gap:
#        a fail-closed pass never refreshes the ts, so staleness surfaces it.
#   6-7) GatewayRevocationLoadFailure fires on a sustained fail-open read error
#        (>0 for 2m), never at 0 (the 2m debounce rides out pod-start / remount blips).
#   8-10) EvidenceChannelDown (#1234) fires when the heartbeat canary stops arriving
#        (channel_up == 0 for 15m) and never while it arrives. BOTH EDGES of the
#        for: window are pinned — still PENDING at 14m, FIRING at exactly 15m — so
#        a shortened `for:` cannot pass (asserting only past the window would let
#        `for: 5m` through, which is the mutation this pair is proved against).
#   11-14) The enforcement-plane staleness pair (#1235): LiveSetRejected (the file
#        as the reconciler reads it) and GatewayRevokedSetReloadRejected (the
#        gateway's own account of refusing the reload) each fire at >0 for 10m and
#        never at 0. BOTH EDGES again — 9m PENDING, 10m FIRING — because the `for:`
#        is the only thing separating "one anomalous pass" from "the enforcement
#        plane is frozen on a stale set", and a shortened one would otherwise pass.
# Run: promtool test rules tests/rulepacks/platform-federation-revocation_test.yaml
rule_files:
  - platform-federation-revocation.rules.yaml

evaluation_interval: 1m

tests:
  # 1) Suspected un-revoke sustained → FIRES after for:5m (not before).
  - interval: 1m
    name: tamper-fires-when-suspected
    input_series:
      - series: 'federation_revocation_tamper_suspected'
        values: '1+0x9'
    alert_rule_test:
      - eval_time: 4m
        alertname: FederationRevocationTamperSuspected
        exp_alerts: []
      - eval_time: 6m
        alertname: FederationRevocationTamperSuspected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation token un-revoke suspected — reconciler found a revoked-but-live token absent from the live set (ADR-028)"

  # 2) No tamper (0) → never fires.
  - interval: 1m
    name: tamper-clean-does-not-fire
    input_series:
      - series: 'federation_revocation_tamper_suspected'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 8m
        alertname: FederationRevocationTamperSuspected
        exp_alerts: []

  # 3) Reconciler healthy — last_reconcile ts tracks time() → NOT stale.
  - interval: 1m
    name: reconcile-fresh-not-stale
    input_series:
      - series: 'federation_revocation_last_reconcile_timestamp_seconds'
        values: '0+60x40'          # value == eval seconds → time()-value == 0
    alert_rule_test:
      - eval_time: 40m
        alertname: FederationRevocationReconcileStale
        exp_alerts: []

  # 4) Reconciler stuck — ts frozen (no successful pass) → stale FIRES after for:10m.
  - interval: 1m
    name: reconcile-frozen-fires-stale
    input_series:
      - series: 'federation_revocation_last_reconcile_timestamp_seconds'
        values: '60+0x60'          # frozen at 60; time()-60 crosses 1800 at ~31m
    alert_rule_test:
      - eval_time: 42m
        alertname: FederationRevocationReconcileStale
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation revocation reconciler stale or down — un-revoke detection is not operational (ADR-028)"

  # 5) Reconciler down — metric absent → stale FIRES via absent() after for:10m.
  - interval: 1m
    name: reconcile-absent-fires-stale
    input_series:
      - series: 'federation_revocation_tamper_suspected'   # unrelated, keeps the test populated
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: FederationRevocationReconcileStale
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation revocation reconciler stale or down — un-revoke detection is not operational (ADR-028)"

  # 6) Gateway fail-open sustained → FIRES after for:2m (not before).
  - interval: 1m
    name: gateway-failopen-fires
    input_series:
      - series: 'federation_gateway_revocation_load_errors'
        values: '2+0x9'
    alert_rule_test:
      - eval_time: 1m
        alertname: FederationGatewayRevocationLoadFailure
        exp_alerts: []
      - eval_time: 3m
        alertname: FederationGatewayRevocationLoadFailure
        exp_alerts:
          - exp_labels:
              severity: warning
              alert_source: platform
            exp_annotations:
              summary: "Federation gateway cannot read the revoked-set — fail-open is allowing revoked tokens (ADR-028 §fail-open)"

  # 7) Gateway clean (0) → never fires (the debounce rides out transients).
  - interval: 1m
    name: gateway-clean-does-not-fire
    input_series:
      - series: 'federation_gateway_revocation_load_errors'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 8m
        alertname: FederationGatewayRevocationLoadFailure
        exp_alerts: []

  # 8) Evidence channel healthy — the canary keeps arriving → NEVER fires.
  #    Held well past the 15m window so a stray inversion of the comparison
  #    (`!= 0` / `> 0`) would surface here rather than only in production.
  - interval: 1m
    name: evidence-channel-up-does-not-fire
    input_series:
      - series: 'federation_revocation_channel_up'
        values: '1+0x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: FederationRevocationEvidenceChannelDown
        exp_alerts: []

  # 9) Evidence channel dead — canary absent from the window → FIRES at for:15m.
  #    ⛔ BOTH EDGES. The 14m assertion (still PENDING, exp_alerts: []) is the
  #    load-bearing half: without it, shortening `for:` to 5m — which would page
  #    on a single missed heartbeat plus one skipped reconcile pass — still passes
  #    every remaining case. Proved by mutation: setting `for: 5m` in
  #    platform-federation-revocation.rules.yaml turns THIS eval red and nothing
  #    else.
  - interval: 1m
    name: evidence-channel-down-fires-at-for-boundary
    input_series:
      - series: 'federation_revocation_channel_up'
        values: '0+0x25'
    alert_rule_test:
      - eval_time: 14m          # for:-ε — pending, must NOT page yet
        alertname: FederationRevocationEvidenceChannelDown
        exp_alerts: []
      - eval_time: 15m          # exactly for: — fires
        alertname: FederationRevocationEvidenceChannelDown
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation revocation evidence channel is DEAD — un-revoke detection is silently blind (ADR-028 / #1234)"

  # 10) A single missed heartbeat window must NOT page. This is the false-positive
  #     guard the 15m window buys: channel_up dips to 0 for one reconcile interval
  #     (300s = 5 evals) and recovers, which the `for:` must absorb entirely.
  - interval: 1m
    name: evidence-channel-single-dip-does-not-fire
    input_series:
      - series: 'federation_revocation_channel_up'
        values: '1+0x4 0+0x4 1+0x20'   # up 5m, down 5m, up again
    alert_rule_test:
      - eval_time: 12m
        alertname: FederationRevocationEvidenceChannelDown
        exp_alerts: []
      - eval_time: 25m
        alertname: FederationRevocationEvidenceChannelDown
        exp_alerts: []

  # 11) The mounted revoked.txt carries a contract-violating line → the gateway is
  #     refusing to load the current set. FIRES at for:10m, not before.
  #     ⛔ BOTH EDGES. 10m is one reconcile interval (300s) plus an equal margin;
  #     the 9m assertion is what stops that being quietly shortened back to a
  #     single interval, where one anomalous pass would page.
  - interval: 1m
    name: live-set-rejected-fires-at-for-boundary
    input_series:
      - series: 'federation_revocation_live_set_rejected_lines'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 9m           # for:-ε — pending, must NOT page yet
        alertname: FederationRevocationLiveSetRejected
        exp_alerts: []
      - eval_time: 10m          # exactly for: — fires
        alertname: FederationRevocationLiveSetRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation revoked set violates its line contract — the gateway is refusing to load it, so revocations made since are NOT enforced (ADR-028 / #1235)"

  # 12) A clean live set (0) → never fires. Held past the window so an inverted
  #     comparison (`== 0` / `< 1`) surfaces here rather than in production.
  - interval: 1m
    name: live-set-clean-does-not-fire
    input_series:
      - series: 'federation_revocation_live_set_rejected_lines'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: FederationRevocationLiveSetRejected
        exp_alerts: []

  # 13) The gateway's own account: it refused a reload and kept its previous set.
  #     Separate metric, separate alert — the file can read clean from the
  #     reconciler's projection while the gateway is still refusing, which is why
  #     this one is not folded into #11.
  - interval: 1m
    name: gateway-reload-rejected-fires-at-for-boundary
    input_series:
      - series: 'federation_gateway_revoked_set_reload_rejected'
        values: '3+0x15'
    alert_rule_test:
      - eval_time: 9m           # for:-ε — pending, must NOT page yet
        alertname: FederationGatewayRevokedSetReloadRejected
        exp_alerts: []
      - eval_time: 10m          # exactly for: — fires
        alertname: FederationGatewayRevokedSetReloadRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
            exp_annotations:
              summary: "Federation gateway REFUSED its revoked-set reload — it is enforcing a stale set, so revocations made since are NOT in force (ADR-028 / #1235)"

  # 14) No refusals in the window (0) → never fires.
  - interval: 1m
    name: gateway-reload-rejected-clean-does-not-fire
    input_series:
      - series: 'federation_gateway_revoked_set_reload_rejected'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: FederationGatewayRevokedSetReloadRejected
        exp_alerts: []
