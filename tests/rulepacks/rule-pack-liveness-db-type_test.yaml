    alert_rule_test:
      - eval_time: 5m
        alertname: MassExporterOutage
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
              job: threshold-exporter
            exp_annotations:
              summary: "Mass exporter outage (6 tenants) — shared-dependency failure suspected"
              description: |
                More than 5 tenants AND over 10% of the declared (tenant, db_type)
                pairs simultaneously have no exporter of that
                db_type answering under job="tenant-exporters"
                (that kind's presence metric absent).
                Both conditions together mean this is almost certainly a SHARED
                failure (node pool drained, network partition, image-pull outage on a
                rolling restart) rather than N independent exporter deaths or a
                routine single-node blip. Treat as ONE incident: inspect node health
                / network / recent cluster-wide changes FIRST — remediating tenants
                one by one will not address the common cause. Per-tenant detail is in
                the fanned-out TenantExporterAbsent alerts. If instead the WHOLE
                tenant-exporters job is gone, TenantExporterJobAbsent fires instead.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/integration/troubleshooting-checklist.md#172-massexporteroutage"

