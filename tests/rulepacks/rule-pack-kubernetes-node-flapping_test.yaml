# promtool unit test — node readiness on a flapping node (#1177).
# Run: promtool test rules tests/rulepacks/rule-pack-kubernetes-node-flapping_test.yaml
#
# Two rules of the kubernetes-node-health group:
#   NodeNotReady           for: 3m + keep_firing_for: 10m — a node that is NotReady
#                          4m / Ready 1m for an hour is ONE firing episode, not 12.
#   NodeReadinessFlapping  more than 2 changes of the Ready=true gauge in 15m, held
#                          15m (kubernetes-mixin KubeNodeReadinessFlapping core, tenant-
#                          wrapped) — the flapping that is too short for NodeNotReady.
#
# Reading the times: every node is Ready for the first 20m and the waveform starts
# at 20m ("T+0"); comments give T+ offsets, eval_time is absolute. The 20m lead is
# there because MetricsQL counts a series' first sample as a change for the next
# 15m, and this fixture also runs on vmalert-tool (test_vm_alert_parity.py).
# Every assertion sits at least 30s (two evaluations) away from a measured
# pending/firing/resolved edge on BOTH engines; vmalert-tool fires and resolves
# NodeNotReady one evaluation later than promtool. Rules and their recordings are
# in one group, so the evaluation order at a tick is fixed.
# The "never fired" / "one unbroken episode" checks read ALERTS over a range, so
# they cover every evaluation, not just the sampled eval_times.
rule_files:
  - ../../rule-packs/rule-pack-kubernetes.yaml

evaluation_interval: 15s

tests:
  # ── NodeNotReady, node-1 NotReady 4m / Ready 1m from T+0 to T+60m. Measured:
  #    firing T+3m .. T+68m45s (vmalert-tool T+3m15s .. T+69m). Without
  #    keep_firing_for it fired 12 times, 45s each (T+3m, T+8m, ...).
  #      T+2m     pending (first fire is still at 3m)
  #      T+4m     firing, annotations checked
  #      T+4m30s  firing in the first Ready stretch (was resolved at T+4m)
  #      T+65m    240 firing samples in the last 60m = no gap since T+5m
  #      T+68m    firing 9m after the last NotReady ended (T+59m)
  #      T+70m    resolved
  #    NodeReadinessFlapping also fires on this node (6 changes per 15m). ──
  - name: notready-4m-1m-one-episode
    interval: 15s
    input_series:
      - series: 'kube_node_status_condition{node="node-1", condition="Ready", status="true"}'
        values: '1x79 0x15 1x3 0x15 1x3 0x15 1x3 0x15 1x3 0x15 1x3 0x15 1x3 0x15 1x3 0x15 1x3 0x15 1x3 0x15 1x3 0x15 1x3 0x15 1x64'
      - series: 'kube_pod_info{namespace="db-x", pod="app-0", uid="u-db-x-app-0", node="node-1"}'
        values: '1x380'
      - series: 'kube_pod_status_phase{namespace="db-x", pod="app-0", uid="u-db-x-app-0", phase="Running"}'
        values: '1x380'
      - series: 'tenant_metadata_info{tenant="db-x", runbook_url="http://rb/db-x", owner="team-db-x", tier="gold"}'
        values: '1x380'
    alert_rule_test:
      - eval_time: 22m
        alertname: NodeNotReady
        exp_alerts: []
      - eval_time: 24m
        alertname: NodeNotReady
        exp_alerts:
          - exp_labels:
              maintenance: mute
              severity: warning
              tenant: db-x
              node: node-1
            exp_annotations:
              summary: "Kubernetes node node-1 NotReady — affects db-x"
              summary_zh: "Kubernetes 節點 node-1 NotReady — 影響 db-x"
              platform_summary: "[gold] db-x: node node-1 NotReady — check node health / pod rescheduling"
              platform_summary_zh: "[gold] db-x: 節點 node-1 NotReady — 請檢查節點健康 / Pod 重新調度"
              description: "A Kubernetes node hosting this tenant's running pod(s) is NotReady; the workload may be rescheduled or unavailable."
              description_zh: "承載此租戶運行中 Pod 的 Kubernetes 節點處於 NotReady 狀態；工作負載可能被重新調度或無法使用。"
              runbook_url: "http://rb/db-x"
              owner: "team-db-x"
              tier: "gold"
      - eval_time: 24m30s
        alertname: NodeNotReady
        exp_alerts:
          - exp_labels:
              maintenance: mute
              severity: warning
              tenant: db-x
              node: node-1
            exp_annotations:
              summary: "Kubernetes node node-1 NotReady — affects db-x"
              summary_zh: "Kubernetes 節點 node-1 NotReady — 影響 db-x"
              platform_summary: "[gold] db-x: node node-1 NotReady — check node health / pod rescheduling"
              platform_summary_zh: "[gold] db-x: 節點 node-1 NotReady — 請檢查節點健康 / Pod 重新調度"
              description: "A Kubernetes node hosting this tenant's running pod(s) is NotReady; the workload may be rescheduled or unavailable."
              description_zh: "承載此租戶運行中 Pod 的 Kubernetes 節點處於 NotReady 狀態；工作負載可能被重新調度或無法使用。"
              runbook_url: "http://rb/db-x"
              owner: "team-db-x"
              tier: "gold"
      - eval_time: 88m
        alertname: NodeNotReady
        exp_alerts:
          - exp_labels:
              maintenance: mute
              severity: warning
              tenant: db-x
              node: node-1
            exp_annotations:
              summary: "Kubernetes node node-1 NotReady — affects db-x"
              summary_zh: "Kubernetes 節點 node-1 NotReady — 影響 db-x"
              platform_summary: "[gold] db-x: node node-1 NotReady — check node health / pod rescheduling"
              platform_summary_zh: "[gold] db-x: 節點 node-1 NotReady — 請檢查節點健康 / Pod 重新調度"
              description: "A Kubernetes node hosting this tenant's running pod(s) is NotReady; the workload may be rescheduled or unavailable."
              description_zh: "承載此租戶運行中 Pod 的 Kubernetes 節點處於 NotReady 狀態；工作負載可能被重新調度或無法使用。"
              runbook_url: "http://rb/db-x"
              owner: "team-db-x"
              tier: "gold"
      - eval_time: 90m
        alertname: NodeNotReady
        exp_alerts: []
      - eval_time: 42m
        alertname: NodeReadinessFlapping
        exp_alerts:
          - exp_labels:
              maintenance: mute
              severity: warning
              tenant: db-x
              node: node-1
            exp_annotations:
              summary: "Kubernetes node node-1 readiness is flapping — affects db-x"
              summary_zh: "Kubernetes 節點 node-1 的就緒狀態反覆變動 — 影響 db-x"
              platform_summary: "[gold] db-x: node node-1 readiness flapping, more than 2 changes in 15m — check kubelet / node network / node pressure"
              platform_summary_zh: "[gold] db-x: 節點 node-1 就緒狀態反覆變動（15 分鐘內超過 2 次）— 請檢查 kubelet／節點網路／節點資源壓力"
              description: "A Kubernetes node hosting this tenant's running pod(s) keeps switching between Ready and NotReady; the workload on it is intermittently unreachable and may be rescheduled."
              description_zh: "承載此租戶運行中 Pod 的 Kubernetes 節點在 Ready 與 NotReady 之間反覆切換；其上的工作負載會間歇性無法連線，並可能被重新調度。"
              runbook_url: "http://rb/db-x"
              owner: "team-db-x"
              tier: "gold"
    promql_expr_test:
      - expr: max by(tenant, node) (count_over_time(ALERTS{alertstate="firing", alertname="NodeNotReady"}[60m]))
        eval_time: 85m
        exp_samples:
          - labels: '{node="node-1", tenant="db-x"}'
            value: 240

