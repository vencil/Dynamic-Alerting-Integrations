  # ── NodeReadinessFlapping, three dips in 15m (settled behaviour) ──
  # Upstream's definition, kept as is: three NotReady dips inside 15m ARE
  # flapping. `> 2` then holds for 15m plus the length of the SECOND dip, so the
  # alert fires ~15m after the second dip starts and lasts about as long as that
  # dip. Measured (dips 5m apart, starting T+0):
  #      node-1 (db-x)  3 x 30s   fires for ONE evaluation, T+20m (vmalert-tool
  #                               two: T+20m, T+20m15s)
  #      node-2 (db-y)  3 x 2m    firing T+20m .. T+21m30s
  #      node-3 (db-z)  4 x 30s   firing T+20m .. T+25m
  # node-1's single evaluation cannot be asserted at an eval_time with a margin,
  # so it is pinned as "fired at some point in the 5m up to T+24m"; node-2 is the
  # case that pins "three dips fire" at a fixed time.
  #      T+19m     none firing
  #      T+20m45s  node-2 and node-3 firing (node-1 already resolved)
  #      T+23m     only node-3
  #      T+27m     none
  # Changing the threshold or `for:` moves exactly these numbers. ──
  - name: flapping-three-dips-in-15m
    interval: 15s
    input_series:
      - series: 'kube_node_status_condition{node="node-1", condition="Ready", status="true"}'
        values: '1x79 0x1 1x17 0x1 1x17 0x1 1x78'
      - series: 'kube_pod_info{namespace="db-x", pod="app-0", uid="u-db-x-app-0", node="node-1"}'
        values: '1x200'
      - series: 'kube_pod_status_phase{namespace="db-x", pod="app-0", uid="u-db-x-app-0", phase="Running"}'
        values: '1x200'
      - series: 'kube_node_status_condition{node="node-2", condition="Ready", status="true"}'
        values: '1x79 0x7 1x11 0x7 1x11 0x7 1x72'
      - series: 'kube_pod_info{namespace="db-y", pod="app-0", uid="u-db-y-app-0", node="node-2"}'
        values: '1x200'
      - series: 'kube_pod_status_phase{namespace="db-y", pod="app-0", uid="u-db-y-app-0", phase="Running"}'
        values: '1x200'
      - series: 'kube_node_status_condition{node="node-3", condition="Ready", status="true"}'
        values: '1x79 0x1 1x17 0x1 1x17 0x1 1x17 0x1 1x58'
