  # ── NodeReadinessFlapping, kube-state-metrics seen twice — same answer as once.
  #    The copies of a node's series are never identical here, so the choice of
  #    aggregation shows:
  #      node-1 (db-x)  two 30s dips 10m apart, scraped from TWO KSM replicas
  #                     -> silent (summing the replicas reads 8 changes and
  #                     fires T+15m30s .. T+24m30s)
