  #                     T+12m and counts from zero -> still firing from T+16m
  #                     (taking the lower count would restart the 15m at T+12m)
  #      node-3 (db-z)  healthy; KSM is replaced at T+0 (ksm-0 goes stale, ksm-1
  #                     appears 60s later) -> silent
