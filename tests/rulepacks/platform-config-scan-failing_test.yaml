# promtool behavioural test for ConfigScanFailing (#2452). The question the
# alert answers is "has conf.d been unscannable for more than 5 minutes", so
# every case feeds the two series the exporter actually exposes:
#   da_config_scan_failures_total{reason}  — +1 per failed watch tick; both
#       reasons pre-initialised at 0;
#   da_config_last_scan_complete_unixtime_seconds — stamped with the tick's
#       time on every clean scan only (a failed scan, including a duplicate
#       tenant, leaves it alone).
# Series are modelled as: watch ticks at k*R seconds, scraped every 30s; the
# values below were generated by stepping that model (failed ticks bump the
# counter, clean ticks stamp the gauge), not tuned to the expression.
# "Appears" = the duplicate file lands just after the last clean tick — the
# worst case, since the gauge's age counts from that tick.
#
# Contract:
#   1) FIRES within 10m of the duplicate appearing at a 30s, 120s and 300s
#      --reload-interval (a public Helm value), carrying {reason} and the
#      topology labels — and ONLY the failing reason (no cross-talk).
#   2) one failed tick at a SHORT interval (30s) does NOT fire; at 240s it
#      does (2b, pinned: no clean scan for 480s IS >5m unscannable);
#   3) a healthy exporter does NOT fire — including at a 600s interval, where
#      the gauge is legitimately older than 300s between ticks;
#   4) RESOLVES on the first clean tick after the fix;
#   5) a counter reset (pod restart) is not read as failures, even while the
#      gauge is older than 300s (the restart in 5 is modelled by hand, not by
#      the tick model);
#   6) a healthy second exporter next to a failing one is not alerted.
# Run: promtool test rules tests/rulepacks/platform-config-scan-failing_test.yaml
rule_files:
  - platform-config-scan-failing.rules.yaml

evaluation_interval: 30s

tests:
  # 1a) R=30s. Clean ticks 0..90s, every tick from 120s fails; appears ~91s.
  #     Not yet at 6m; firing by 11m (≤ 10m after it appeared). The zero
  #     walk_error series must not produce a second alert.
  - interval: 30s
    name: duplicate-tenant-30s-interval-fires-within-10m
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0 0 0 0 1+1x36'
      - series: 'da_config_scan_failures_total{reason="walk_error", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x40'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0+30x3 90x36'
    alert_rule_test:
      - eval_time: 6m
        alertname: ConfigScanFailing
        exp_alerts: []
      - eval_time: 11m
        alertname: ConfigScanFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
              reason: duplicate_tenant
              job: threshold-exporter
              instance: 10.0.0.9:8080
            exp_annotations:
              summary: "Threshold-exporter conf.d unscannable for >5m (duplicate_tenant) — config frozen at last good state"

  # 1b) R=120s. Clean ticks 0, 120, 240; ticks from 360s fail; appears ~241s.
  #     Firing by 14m (≤ 10m after it appeared).
  - interval: 30s
    name: duplicate-tenant-120s-interval-fires-within-10m
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x11 1x3 2x3 3x3 4x3 5x3 6x3 7x3 8x3 9x3 10x2'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x3 120x3 240x42'
    alert_rule_test:
      - eval_time: 14m
        alertname: ConfigScanFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
              reason: duplicate_tenant
              job: threshold-exporter
              instance: 10.0.0.9:8080
            exp_annotations:
              summary: "Threshold-exporter conf.d unscannable for >5m (duplicate_tenant) — config frozen at last good state"

  # 1c) R=300s. Clean ticks 0, 300; ticks from 600s fail; appears ~301s.
  #     Firing by 15m (≤ 10m after it appeared).
  - interval: 30s
    name: duplicate-tenant-300s-interval-fires-within-10m
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x19 1x9 2x9 3x9 4x9 5'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x9 300x50'
    alert_rule_test:
      - eval_time: 15m
        alertname: ConfigScanFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
              reason: duplicate_tenant
              job: threshold-exporter
              instance: 10.0.0.9:8080
            exp_annotations:
              summary: "Threshold-exporter conf.d unscannable for >5m (duplicate_tenant) — config frozen at last good state"

  # 1d) walk_error rides through the same way, and the zero duplicate_tenant
  #     series does not.
  - interval: 30s
    name: walk-error-fires-with-its-own-reason-only
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x40'
      - series: 'da_config_scan_failures_total{reason="walk_error", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0 0 0 0 1+1x36'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0+30x3 90x36'
    alert_rule_test:
      - eval_time: 11m
        alertname: ConfigScanFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
              reason: walk_error
              job: threshold-exporter
              instance: 10.0.0.9:8080
            exp_annotations:
              summary: "Threshold-exporter conf.d unscannable for >5m (walk_error) — config frozen at last good state"

  # 1e) #2592's two reasons ride through the same way: an unlistable root
  #     (root_unreadable) and a tree emptied of config files (empty_tree) no
  #     longer stamp the gauge, so each fires under its own reason only.
  - interval: 30s
    name: root-unreadable-fires-with-its-own-reason-only
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x40'
      - series: 'da_config_scan_failures_total{reason="walk_error", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x40'
      - series: 'da_config_scan_failures_total{reason="root_unreadable", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0 0 0 0 1+1x36'
      - series: 'da_config_scan_failures_total{reason="empty_tree", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x40'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0+30x3 90x36'
    alert_rule_test:
      - eval_time: 11m
        alertname: ConfigScanFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
              reason: root_unreadable
              job: threshold-exporter
              instance: 10.0.0.9:8080
            exp_annotations:
              summary: "Threshold-exporter conf.d unscannable for >5m (root_unreadable) — config frozen at last good state"

  - interval: 30s
    name: empty-tree-fires-with-its-own-reason-and-resolves
    input_series:
      - series: 'da_config_scan_failures_total{reason="root_unreadable", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x40'
      - series: 'da_config_scan_failures_total{reason="empty_tree", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0 0 0 0 1+1x16 17x19'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0+30x3 90x16 630+30x19'
    alert_rule_test:
      - eval_time: 10m
        alertname: ConfigScanFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
              reason: empty_tree
              job: threshold-exporter
              instance: 10.0.0.9:8080
            exp_annotations:
              summary: "Threshold-exporter conf.d unscannable for >5m (empty_tree) — config frozen at last good state"
      - eval_time: 11m
        alertname: ConfigScanFailing
        exp_alerts: []

  # 2) R=30s, ONE failed tick at 120s (a tenant moved between two files, the
  #    new one written first); the 150s tick is clean again. Never fires.
  #    ⚠️ Short intervals only: the gauge's age peaks at about 2R around a
  #    single failed tick, so this holds while that stays near 300s — see 2b.
  - interval: 30s
    name: single-failed-tick-does-not-fire
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0 0 0 0 1x36'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0+30x3 90 150+30x35'
    alert_rule_test:
      - eval_time: 5m
        alertname: ConfigScanFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: ConfigScanFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: ConfigScanFailing
        exp_alerts: []

  # 2b) Pinned current behaviour, not a goal: R=240s, ONE failed tick at 480s.
  #     Clean ticks at 240s and 720s, so for that stretch no scan succeeded
  #     for 480s — the config really was unscannable for more than 5 minutes,
  #     and the alert fires (11m), then resolves once the 720s clean tick is
  #     scraped (13m). Tick-by-tick grid over every 30s phase (scrape 30s):
  #     one failed tick never fires at R ≤ 180s, fires in some phases at
  #     190s and in every phase at 200s–420s. Requiring ≥ 2 failures instead
  #     would push R=420s past the 10-minute acceptance bound.
  - interval: 30s
    name: single-failed-tick-at-240s-interval-fires
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x15 1x24'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x7 240x15 720x7 960x7 1200'
    alert_rule_test:
      - eval_time: 11m
        alertname: ConfigScanFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
              reason: duplicate_tenant
              job: threshold-exporter
              instance: 10.0.0.9:8080
            exp_annotations:
              summary: "Threshold-exporter conf.d unscannable for >5m (duplicate_tenant) — config frozen at last good state"
      - eval_time: 13m
        alertname: ConfigScanFailing
        exp_alerts: []

  # 3a) Control — healthy at R=30s with ordinary reloads: reload_trigger_total
  #     rises, scan failures stay 0, the gauge is stamped every tick.
  - interval: 30s
    name: healthy-30s-with-reloads-does-not-fire
    input_series:
      - series: 'da_config_reload_trigger_total{reason="source", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0+1x40'
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x40'
      - series: 'da_config_scan_failures_total{reason="walk_error", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x40'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0+30x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: ConfigScanFailing
        exp_alerts: []

  # 3b) Control — healthy at R=600s: between ticks the gauge is up to 600s
  #     old (the RHS alone would be true), but nothing failed. Must NOT fire.
  - interval: 30s
    name: healthy-600s-interval-old-gauge-does-not-fire
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x60'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x19 600x19 1200x19 1800'
    alert_rule_test:
      - eval_time: 9m30s
        alertname: ConfigScanFailing
        exp_alerts: []
      - eval_time: 19m30s
        alertname: ConfigScanFailing
        exp_alerts: []

  # 4) R=30s, failing from 120s; the duplicate is removed and the 630s tick
  #    is clean. Firing at 10m; resolved at 11m (the first evaluation after
  #    the clean tick's gauge is scraped), while the [10m] counter window
  #    still holds the failures.
  - interval: 30s
    name: resolves-on-first-clean-tick
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0 0 0 0 1+1x16 17x19'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0+30x3 90x16 630+30x19'
    alert_rule_test:
      - eval_time: 10m
        alertname: ConfigScanFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
              reason: duplicate_tenant
              job: threshold-exporter
              instance: 10.0.0.9:8080
            exp_annotations:
              summary: "Threshold-exporter conf.d unscannable for >5m (duplicate_tenant) — config frozen at last good state"
      - eval_time: 11m
        alertname: ConfigScanFailing
        exp_alerts: []

  # 5) Counter reset: a HEALTHY exporter at R=600s whose counter read 5 (old
  #    failures, long fixed) restarts at 300s — the counter drops to 0, the
  #    startup scan stamps the gauge at 300s, the next tick is at 900s. From
  #    600s to 900s the gauge is older than 300s, so the RHS is TRUE and only
  #    the LHS keeps this quiet: increase() reads the 5→0 drop as a reset, not
  #    as failures. (A delta-style LHS such as max_over_time - min_over_time
  #    would read it as 5 and fire here.)
  - interval: 30s
    name: counter-reset-does-not-fire
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '5x9 0x30'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0x9 300x19 900x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: ConfigScanFailing
        exp_alerts: []
      - eval_time: 14m
        alertname: ConfigScanFailing
        exp_alerts: []

  # 6) Two exporters: .9 fails as in 1a, .10 is healthy. Only .9 alerts — the
  #    `ignoring (reason)` match pairs each counter with its own target's gauge.
  - interval: 30s
    name: healthy-neighbour-target-not-alerted
    input_series:
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0 0 0 0 1+1x36'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.9:8080"}'
        values: '0+30x3 90x36'
      - series: 'da_config_scan_failures_total{reason="duplicate_tenant", job="threshold-exporter", instance="10.0.0.10:8080"}'
        values: '0x40'
      - series: 'da_config_last_scan_complete_unixtime_seconds{job="threshold-exporter", instance="10.0.0.10:8080"}'
        values: '0+30x40'
    alert_rule_test:
      - eval_time: 11m
        alertname: ConfigScanFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              alert_source: platform
              reason: duplicate_tenant
              job: threshold-exporter
              instance: 10.0.0.9:8080
            exp_annotations:
              summary: "Threshold-exporter conf.d unscannable for >5m (duplicate_tenant) — config frozen at last good state"
