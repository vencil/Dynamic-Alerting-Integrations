# EXTRACTED COPY of the ConfigReloaderHighRestarts alert in
# k8s/03-monitoring/configmap-rules-platform.yaml (group platform-self-monitoring).
#
# ⚠️ KEEP IN SYNC with that ConfigMap — expr / labels / `for` / summary must match
# exactly. `description` is deliberately omitted: promtool compares the annotation
# set for exact equality and the multi-line operator guidance adds nothing to the
# behavioural assertions. Sync is machine-enforced by
# tests/rulepacks/test_platform_rules_extract_sync.py.
groups:
  - name: platform-self-monitoring
    rules:
      - alert: ConfigReloaderHighRestarts
        expr: |
          increase(
            kube_pod_container_status_restarts_total{
              container="config-reloader",
              namespace="monitoring"
            }[1h]
          ) >= 4
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "config-reloader sidecar in {{ $labels.pod }} is restarting frequently"
