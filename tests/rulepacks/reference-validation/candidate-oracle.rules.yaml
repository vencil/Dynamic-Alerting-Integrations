# Reference candidate rules — Oracle. DIRECT-PREDICATE form of the shipped
# rule-pack-oracle.yaml alerting logic. Why direct-predicate: production
# `max by(tenant)` aggregation strips the harness attribution labels; the direct
# predicate on the raw series preserves them and is fire/no-fire identical for
# single-signature injection. Thresholds are the DOCUMENTED rule-pack-header example
# values inlined (Oracle ships no _defaults — #1175) = a tenant with no custom
# override. `for:` durations are the shipped values (sync-gated by
# tests/rulepacks/test_reference_validation_sync.py; deliberate divergences live in
# divergence-ledger.yaml).
#
# NOT covered here (deliberate — surfaces as MISS/FN in the report = coverage gaps):
#   - oracledb_activity_parse_count_total  → the hard-parse-storm signature is written on
#     parse counts, which the exporter does not serve; OracleHighHardParseTime (#1174)
#     reads v$sys_time_model time instead (hard parse time / DB time), so it MISSes
#     here. Re-review when that signature is re-authored on the time-model metrics.
#   - oracledb_pga_allocated_bytes fault signatures (pga-bloat-exporter-starved,
#     pga-runaway-query) → their descriptions state no PGA_AGGREGATE_LIMIT, so no
#     denominator companion and no share: OracleHighPGAUsage cannot fire on them
#     (#1320 share form; with no limit set there is nothing to measure against).
#     Re-review when a signature states the limit, or when #4044 adds a signal
#     for a database with no limit.
#
# OracleHighSessionUtilization (ratio): the companion oracledb_sessions_limit inherits
# the injection identity labels, so the division matches one-to-one and keeps the
# numerator's attribution labels (#3833: every session over the SESSIONS parameter).
# OracleDatabaseDown: query-exporter serves no 0 when the database is down — the
# liveness query's query_timestamp stops advancing (#3833). The candidate keeps only
# the "unchanged across 90s" arm with the shipped `offset 90s` history guard (no
# count guard: the waveform has no restarts);
# the "never succeeded" arm needs no waveform. changes() is independent of the
# epoch, so the integrated counter waveform (rate 1/s healthy, 0 down) reads right.
# Threshold 0.85 is HARD-CODED in the shipped rule (not user_threshold). The shipped
# denominator guard `> 0` is reproduced (a zero session limit would otherwise divide
# to +Inf and over-fire; shipped drops the series instead).
# OracleHighHardParseTime (#1174): the shipped share with its AAS >= 1 gate on the DB
# time rate; 20 is the registry's reference value (operator key, no shipped value).
# OracleHighProcessCount / OracleHighPGAUsage (#1320): the same shape, a share of
# PROCESSES / PGA_AGGREGATE_LIMIT with the same `> 0` guard; 85 is the shipped
# default (process) and the registry's reference value (PGA). A signature with no
# denominator companion has no share (see NOT covered above).
groups:
  - name: oracle-ref
    interval: 30s
    rules:
      - alert: OracleDatabaseDown
        expr: changes(query_timestamp{job="tenant-exporters", query="oracle_liveness"}[90s]) == 0 and query_timestamp{job="tenant-exporters", query="oracle_liveness"} offset 90s
        for: 15s
        labels: {severity: critical}
      - alert: OracleHighActiveSessions
        expr: oracledb_sessions_active > 200
        for: 5m
        labels: {severity: warning}
      - alert: OracleTablespaceAlmostFull
        expr: oracledb_tablespace_used_percent > 85
        for: 5m
        labels: {severity: warning}
      - alert: OracleHighWaitTime
        expr: rate(oracledb_wait_time_seconds_total[5m]) > 50
        for: 5m
        labels: {severity: warning}
      - alert: OracleHighProcessCount
        expr: 100 * oracledb_process_count / (oracledb_processes_limit > 0) > 85
        for: 5m
        labels: {severity: warning}
      - alert: OracleHighPGAUsage
        expr: 100 * oracledb_pga_allocated_bytes / (oracledb_pga_aggregate_limit_bytes > 0) > 85
        for: 10m
        labels: {severity: warning}
      - alert: OracleHighHardParseTime
        expr: 100 * rate(oracledb_hard_parse_elapsed_seconds_total[5m]) / (rate(oracledb_db_time_seconds_total[5m]) >= 1) > 20
        for: 10m
        labels: {severity: warning}
      - alert: OracleHighSessionUtilization
        expr: oracledb_sessions_current / (oracledb_sessions_limit > 0) > 0.85
        for: 5m
        labels: {severity: warning}
