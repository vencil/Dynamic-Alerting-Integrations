# Reference candidate rules — DB2. DIRECT-PREDICATE form of the shipped
# rule-pack-db2.yaml alerting logic (see candidate-oracle.rules.yaml header for
# rationale). Thresholds are the DOCUMENTED rule-pack-header example values inlined
# (Oracle/DB2 ship no _defaults — #1175): connections 200 / bufferpool 0.95
# (LOW-is-bad, `<`) / log 70 / deadlock_rate 5 (per-second, rate over 5m) /
# tablespace 85 / lock_wait_time 10. `for:` are shipped values (sync-gated by
# tests/rulepacks/test_reference_validation_sync.py; deliberate divergences live in
# divergence-ledger.yaml).
#
# Post-run#1 shipped-pack changes tracked here (fidelity, TRK-339 WS4a-1):
#   - DB2HighLockWaitTime (#1188): shipped pack NOW alerts on
#     db2_lock_wait_time_seconds_total (run#1 found the orphaned recording rule);
#     mirrored below with the header-documented starting value 10.
#   - DB2HighSortOverflow (#1184): shipped ratio is now rate/rate over 5m (NOT
#     lifetime-cumulative division); its denominator guard is the #1176 minimum
#     sample, ≥ 200 sorts per 5m (n·p0 ≥ 10 at the 0.05 threshold); mirrored below.
#
# NOT covered here (declared in divergence-ledger.yaml):
#   - DB2TablespaceAlmostFull → the blind library authored no tablespace fault, so
#     the rule would be inert in this harness (still a real coverage gap finding).
#
# Raw metrics are those of rule-packs/exporters/db2.yaml (query-exporter, #3833):
#   - DB2DatabaseDown: query-exporter serves no 0 when the database is down — the
#     liveness query's query_timestamp stops advancing. Only the "unchanged across
#     90s" arm with the shipped `offset 90s` history guard (no count guard:
#     the waveform has no restarts); changes() is
#     independent of the epoch, so the integrated counter waveform reads right.
#   - DB2LowBufferpoolHitRatio: IBM's pages found / logical reads over 5m, with the
#     shipped ≥ 200 logical reads per 5m floor.
#   - DB2HighLogUsage: 100 · used / (used + available), shipped guard `> 0`.
#
# DB2HighSortOverflow (ratio): the db2_sorts_total companion inherits the injection
# identity labels with no extra label, so the rate/rate division matches one-to-one
# and keeps attribution. Threshold 0.05 is HARD-CODED in the shipped rule.
# NB the sort-overflow signature is must_detect:false — this alert firing on it = an
# OVER-FIRE finding (rule pages on a benign daily-tuning signal).
groups:
  - name: db2-ref
    interval: 30s
    rules:
      - alert: DB2DatabaseDown
        expr: changes(query_timestamp{job="tenant-exporters", query="db2_liveness"}[90s]) == 0 and query_timestamp{job="tenant-exporters", query="db2_liveness"} offset 90s
        for: 15s
        labels: {severity: critical}
      - alert: DB2HighConnections
        expr: db2_connections_current > 200
        for: 5m
        labels: {severity: warning}
      - alert: DB2LowBufferpoolHitRatio
        expr: rate(db2_bufferpool_pages_found_total[5m]) / (rate(db2_bufferpool_logical_reads_total[5m]) >= 200 / 300) < 0.95
        for: 10m
        labels: {severity: warning}
      - alert: DB2HighLogUsage
        expr: 100 * db2_log_used_bytes / ((db2_log_used_bytes + db2_log_available_bytes) > 0) > 70
        for: 5m
        labels: {severity: warning}
      - alert: DB2HighDeadlockRate
        expr: rate(db2_deadlocks_total[5m]) > 5
        for: 5m
        labels: {severity: warning}
      - alert: DB2HighLockWaitTime
        expr: rate(db2_lock_wait_time_seconds_total[5m]) > 10
        for: 5m
        labels: {severity: warning}
      - alert: DB2HighSortOverflow
        expr: rate(db2_sort_overflows_total[5m]) / (rate(db2_sorts_total[5m]) >= 200 / 300) > 0.05
        for: 10m
        labels: {severity: warning}
