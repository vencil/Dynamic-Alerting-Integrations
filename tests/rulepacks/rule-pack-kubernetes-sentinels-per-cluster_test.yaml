            value: 1
          - labels: '{alertname="CustomRecipeDiskInert", alertstate="firing", maintenance="mute", severity="warning", tenant="db-t2"}'
            value: 1

  # ── XV1) ⚠ LIMITATION: pod info labelled east, pod labels unlabelled → fires for east (its KSM is fine) ──
  - interval: 15s
    input_series:
      - series: 'user_threshold{tenant="db-t1", component="container", metric="cpu", severity="warning", version="v1"}'
