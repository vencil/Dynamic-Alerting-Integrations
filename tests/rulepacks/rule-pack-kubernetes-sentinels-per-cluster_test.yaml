        values: '2x48'
    promql_expr_test:
      - expr: count without(alertgroup) (ALERTS{alertname="VersionAwareThresholdInert", alertstate="firing"})
        eval_time: 11m
        exp_samples:
          - labels: '{alertname="VersionAwareThresholdInert", alertstate="firing", da_cluster="east", maintenance="page", severity="warning"}'
            value: 1
          - labels: '{alertname="VersionAwareThresholdInert", alertstate="firing", da_cluster="west", maintenance="page", severity="warning"}'
            value: 1

  # ── XD1) ⚠ LIMITATION: pods labelled east, volume-stats unlabelled → fires for east (the tenant is fine) ──
