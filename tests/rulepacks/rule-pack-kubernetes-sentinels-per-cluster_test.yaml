        eval_time: 11m
        exp_samples:
          - labels: '{alertname="VersionAwareThresholdInert", alertstate="firing", da_cluster="west", maintenance="page", severity="warning"}'
            value: 1

  # ── V7c) thresholds federated from two edges (a da_cluster on each row) → one alert, value 1 ──
  # The same threshold of db-t1, once from each edge's threshold-exporter.
  - interval: 15s
    input_series:
      - series: 'user_threshold{tenant="db-t1", component="container", metric="cpu", severity="warning", version="v1", da_cluster="east"}'
        values: '80x48'
      - series: 'user_threshold{tenant="db-t1", component="container", metric="cpu", severity="warning", version="v1", da_cluster="west"}'
