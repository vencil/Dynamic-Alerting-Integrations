  # ── XV3) central's own unlabelled cluster has pod labels, federated west has none → west only ──
  - interval: 15s
    input_series:
      - series: 'user_threshold{tenant="db-t1", component="container", metric="cpu", severity="warning", version="v1"}'
        values: '80x48'
      - series: 'kube_pod_info{namespace="db-t1", pod="app-1"}'
        values: '1x48'
      - series: 'kube_pod_labels{namespace="db-t1", pod="app-1", label_app_kubernetes_io_version="v1"}'
        values: '1x48'
      - series: 'kube_pod_info{namespace="db-t1", pod="app-1", da_cluster="west"}'
        values: '1x48'
    promql_expr_test:
      - expr: count without(alertgroup) (ALERTS{alertname="VersionAwareThresholdInert", alertstate="firing"})
        eval_time: 11m
        exp_samples:
          - labels: '{alertname="VersionAwareThresholdInert", alertstate="firing", da_cluster="west", maintenance="page", severity="warning"}'
            value: 1

  # ── XV4) central's own unlabelled cluster has no pod labels, federated west has them → one alert, no da_cluster ──
  - interval: 15s
    input_series:
      - series: 'user_threshold{tenant="db-t1", component="container", metric="cpu", severity="warning", version="v1"}'
