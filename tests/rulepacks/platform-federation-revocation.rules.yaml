# Bare-rules promtool target for the federation-revocation reconciler alerts
# (ADR-028 D1 / #924). promtool needs a top-level `groups:` document, not the
# deployed `data: platform-alert.yml: |` ConfigMap, so this is an EXTRACTED COPY
# of the seven alerts from k8s/03-monitoring/configmap-rules-platform.yaml.
# (It said "six" until #1238; #1236 had added the seventh without updating this
# sentence. Nothing enforces prose — test_platform_rules_extract_sync.py compares
# expr/for/labels/summary only, and deliberately in one direction.)
#
# ⚠️ KEEP IN SYNC with that ConfigMap (expr + for + labels + summary). The
# behavioural contract is exercised by platform-federation-revocation_test.yaml.
#
# Metric source: the federation-reconciler Deployment's /metrics (a da-tools
# subcommand). Names match _federation_revocation_reconciler.py's Metrics.render().
groups:
  - name: platform-federation-revocation
    rules:
      # An un-revoke was detected: a token the log says is revoked-and-live is
      # absent from the live set. Critical — a revoked federation token may be
      # accepted until its TTL.
      # ⛔ LATCHED since #1238. The gauge is recomputed every reconcile pass
      # (300s), so a one-pass detection used to expire before `for: 5m` could
      # elapse and never paged at all. `max_over_time(...[1h])` holds it. The
      # comment this replaced said `for: 5m` "rides out one reconcile interval so
      # a single transient mismatch (mount sync vs log) does not page" — that was
      # true, and it was also exactly why the smallest real attack could not page.
      # The mount-sync half is now handled at the source instead, by the
      # reconciler's projection-grace on the event query. Full rationale and the
      # residual sampling gap: the block comment in the ConfigMap + ADR-028.
      - alert: FederationRevocationTamperSuspected
        expr: max_over_time(federation_revocation_tamper_suspected[1h]) > 0
        for: 5m
        labels:
          severity: critical
          alert_source: platform
        annotations:
          summary: "Federation token un-revoke suspected — reconciler found a revoked-but-live token absent from the live set (ADR-028)"

      # The tamper-evidence itself is not operational: the reconciler has not
      # SUCCESSFULLY reconciled recently (stuck / erroring / fail-closed), OR its
      # metric is absent (pod down / never scraped). Either way detection is
      # blind — critical. Fresh deploy: last_reconcile ts starts at 0, so this is
      # stale-by-default until the first successful pass, `for: 10m` grace.
      - alert: FederationRevocationReconcileStale
        expr: |
          (time() - federation_revocation_last_reconcile_timestamp_seconds > 1800)
          or absent(federation_revocation_last_reconcile_timestamp_seconds)
        for: 10m
        labels:
          severity: critical
          alert_source: platform
        annotations:
          summary: "Federation revocation reconciler stale or down — un-revoke detection is not operational (ADR-028)"

      # The evidence channel itself is dead (#1234): the reconciler saw no
      # tenant-api heartbeat canary on a REACHABLE store, so the un-revoke
      # control is reporting all-clear over an empty feed. Without this alert an
      # empty channel is indistinguishable from "no revocations happened" and
      # neither TamperSuspected nor ReconcileStale fires. `for: 15m` ≈ 3 heartbeat
      # periods (producer 5m + reconcile 300s + settle 60s), which also covers the
      # deploy grace window (channel_up starts at 0). NO `or absent(...)` — that
      # cause is already ReconcileStale's absent() arm; duplicating it double-pages.
      - alert: FederationRevocationEvidenceChannelDown
        expr: federation_revocation_channel_up == 0
        for: 15m
        labels:
          severity: critical
          alert_source: platform
        annotations:
          summary: "Federation revocation evidence channel is DEAD — un-revoke detection is silently blind (ADR-028 / #1234)"

      # The gateway is failing to read the revoked-set and is failing OPEN
      # (revoked tokens ARE being allowed through) — the ADR-028 named Risk
      # Acceptance made visible. Warning (bounded by the 4h TTL); `for: 2m`
      # filters pod-start / volume-remount I/O blips.
      - alert: FederationGatewayRevocationLoadFailure
        expr: federation_gateway_revocation_load_errors > 0
        for: 2m
        labels:
          severity: warning
          alert_source: platform
        annotations:
          summary: "Federation gateway cannot read the revoked-set — fail-open is allowing revoked tokens (ADR-028 §fail-open)"

      # The one gateway state where the set is EMPTY rather than stale (#1236):
      # the projected key is gone, so every revoked token is honoured until its
      # TTL. critical (vs the warning above) because the exposure is active, not
      # frozen.
      # ⛔ LATCHED since #1238, and the claim this replaced was measurably wrong:
      # "one transient line outlives any `for` we would set" held only when TWO
      # passes happened to observe the row (600s of non-zero). When only one did
      # (300s) it did NOT outlive `for: 5m`, so the same event paged or did not
      # depending on pass alignment. The latch removes that dependency.
      - alert: FederationGatewayRevokedSetMissing
        expr: max_over_time(federation_gateway_revoked_set_missing[1h]) > 0
        for: 5m
        labels:
          severity: critical
          alert_source: platform
        annotations:
          summary: "Federation gateway has NO revoked-set — it is enforcing an EMPTY set and honouring every revoked token (ADR-028 §fail-open)"

      # ⛔ The next two are the OPPOSITE posture from the one above (#1235): the
      # list was read and REFUSED, so the gateway keeps the set it already had —
      # nothing extra is let through from that set, but every revocation issued
      # since the offending line appeared is unenforced, and a worker whose FIRST
      # load hit it has no previous set and enforces nothing. Neither surfaces in
      # TamperSuspected, which compares the audit log against the FILE (the file
      # DOES contain the newer revocations); a missing file was always loud, a
      # refused one was not. Two alerts because the gauges observe different
      # planes: the file as the reconciler reads it vs the gateway's own account
      # of what it loaded — either can be non-zero alone.
      # ⛔ The "persistent condition" rationale for `for: 10m` applies to
      # LiveSetRejected ONLY. That one reads the FILE, so it stays true until a
      # human fixes the line. ReloadRejected counts log rows in a ~600s window
      # rewritten every 300s, so one refused reload holds it non-zero for at most
      # 600s == `for: 10m` and never fired (promtool-verified); it is LATCHED
      # since #1238. Traffic makes it worse, not better: the gateway reloads only
      # inside the request path, so a quiet gateway with a poisoned file emits
      # sparse warnings and the gauge decays between them.
      - alert: FederationRevocationLiveSetRejected
        expr: federation_revocation_live_set_rejected_lines > 0
        for: 10m
        labels:
          severity: critical
          alert_source: platform
        annotations:
          summary: "Federation revoked set violates its line contract — the gateway is refusing to load it, so revocations made since are NOT enforced (ADR-028 / #1235)"

      - alert: FederationGatewayRevokedSetReloadRejected
        expr: max_over_time(federation_gateway_revoked_set_reload_rejected[1h]) > 0
        for: 10m
        labels:
          severity: critical
          alert_source: platform
        annotations:
          summary: "Federation gateway REFUSED its revoked-set reload — it is enforcing a stale set, so revocations made since are NOT in force (ADR-028 / #1235)"
