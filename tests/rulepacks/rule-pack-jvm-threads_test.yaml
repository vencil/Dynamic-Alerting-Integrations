# promtool unit test — JVM thread count: both exporters' names are read (#4328).
# Run: promtool test rules tests/rulepacks/rule-pack-jvm-threads_test.yaml
#
# tenant:jvm_threads:current is, per (tenant, da_cluster), the live thread
# count of the JVM with the most threads. Micrometer names the gauge
# jvm_threads_live_threads, client_java / the jmx_exporter javaagent
# jvm_threads_current. Thresholds here: warning 500, critical 800.
#   t-mm    Micrometer only, 900 ⇒ warning and critical, same metric_group on
#           both (the pair Alertmanager deduplicates). Before #4328 the record
#           had no sample for this tenant and neither alert could fire.
#   t-cj    client_java only, 600 ⇒ warning, critical quiet.
#   t-both  one JVM exposing BOTH names on the same labels with different
#           values: Micrometer 300, client_java 900 ⇒ measured 300, quiet.
#           The two sides carry ONE label set, so `or` keeps the left
#           (Micrometer) sample and the other is not looked at — not the
#           larger of the two (900), not their sum (1200).
#   t-tags  the same JVM, but its Micrometer series carries a label the
#           client_java one lacks (a common tag, application="shop"):
#           Micrometer 300, client_java 600 ⇒ measured 600. The label sets
#           differ, `or` keeps BOTH and `max` reads the larger. Still one
#           JVM's value, never the sum (900 would also fire critical).
#   t-two   two Micrometer JVMs, 600 and 300 ⇒ 600, the one with the most
#           threads: warning fires, critical quiet. Summed they read 900 and
#           critical fires too; averaged 450 and nothing fires.
# The gauges are flat from t=0. The alert group may read the record one
# evaluation late (#4033), so pending starts at 0–15s and the alerts fire at
# 5m–5m15s (for: 5m) / 3m–3m15s (for: 3m). Asserted quiet at 4m30s / 2m30s
# and firing at 10m: every assertion is 30s or more from either edge.
rule_files:
  - ../../rule-packs/rule-pack-jvm.yaml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      - series: 'jvm_threads_live_threads{tenant="t-mm", instance="app-0:8080"}'
        values: '900x48'
      - series: 'user_threshold{tenant="t-mm", component="jvm", metric="threads", severity="warning"}'
        values: '500x48'
      - series: 'user_threshold{tenant="t-mm", component="jvm", metric="threads", severity="critical"}'
        values: '800x48'

      - series: 'jvm_threads_current{tenant="t-cj", instance="app-0:9404"}'
        values: '600x48'
      - series: 'user_threshold{tenant="t-cj", component="jvm", metric="threads", severity="warning"}'
        values: '500x48'
      - series: 'user_threshold{tenant="t-cj", component="jvm", metric="threads", severity="critical"}'
        values: '800x48'

      - series: 'jvm_threads_live_threads{tenant="t-both", instance="app-0:8080"}'
        values: '300x48'
      - series: 'jvm_threads_current{tenant="t-both", instance="app-0:8080"}'
        values: '900x48'
      - series: 'user_threshold{tenant="t-both", component="jvm", metric="threads", severity="warning"}'
        values: '500x48'
      - series: 'user_threshold{tenant="t-both", component="jvm", metric="threads", severity="critical"}'
        values: '800x48'

      - series: 'jvm_threads_live_threads{tenant="t-tags", instance="app-0:8080", application="shop"}'
        values: '300x48'
      - series: 'jvm_threads_current{tenant="t-tags", instance="app-0:8080"}'
        values: '600x48'
      - series: 'user_threshold{tenant="t-tags", component="jvm", metric="threads", severity="warning"}'
        values: '500x48'
      - series: 'user_threshold{tenant="t-tags", component="jvm", metric="threads", severity="critical"}'
        values: '800x48'

      - series: 'jvm_threads_live_threads{tenant="t-two", instance="app-0:8080"}'
        values: '600x48'
      - series: 'jvm_threads_live_threads{tenant="t-two", instance="app-1:8080"}'
        values: '300x48'
      - series: 'user_threshold{tenant="t-two", component="jvm", metric="threads", severity="warning"}'
        values: '500x48'
      - series: 'user_threshold{tenant="t-two", component="jvm", metric="threads", severity="critical"}'
        values: '800x48'
    promql_expr_test:
      - expr: tenant:jvm_threads:current
        eval_time: 10m
        exp_samples:
          - labels: 'tenant:jvm_threads:current{tenant="t-mm"}'
            value: 900
          - labels: 'tenant:jvm_threads:current{tenant="t-cj"}'
            value: 600
          - labels: 'tenant:jvm_threads:current{tenant="t-both"}'
            value: 300
          - labels: 'tenant:jvm_threads:current{tenant="t-tags"}'
            value: 600
          - labels: 'tenant:jvm_threads:current{tenant="t-two"}'
            value: 600
    alert_rule_test:
      - eval_time: 4m30s
        alertname: JVMThreadPoolExhaustion
        exp_alerts: []
      - eval_time: 2m30s
        alertname: JVMThreadPoolExhaustionCritical
        exp_alerts: []
      - eval_time: 10m
        alertname: JVMThreadPoolExhaustion
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              metric_group: jvm_threads
              tenant: t-mm
            exp_annotations:
              summary: "JVMThreadPoolExhaustion on t-mm"
              summary_zh: "t-mm 上 JVM thread pool 耗盡"
              platform_summary: "[] t-mm: thread pool saturation — request backlog risk"
              platform_summary_zh: "[] t-mm：thread pool 飽和 — request 積壓風險"
              description: "Active threads 900 exceeds threshold"
              description_zh: "活動 thread 數 900 超出閾值"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              severity: warning
              maintenance: mute
              metric_group: jvm_threads
              tenant: t-cj
            exp_annotations:
              summary: "JVMThreadPoolExhaustion on t-cj"
              summary_zh: "t-cj 上 JVM thread pool 耗盡"
              platform_summary: "[] t-cj: thread pool saturation — request backlog risk"
              platform_summary_zh: "[] t-cj：thread pool 飽和 — request 積壓風險"
              description: "Active threads 600 exceeds threshold"
              description_zh: "活動 thread 數 600 超出閾值"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              severity: warning
              maintenance: mute
              metric_group: jvm_threads
              tenant: t-tags
            exp_annotations:
              summary: "JVMThreadPoolExhaustion on t-tags"
              summary_zh: "t-tags 上 JVM thread pool 耗盡"
              platform_summary: "[] t-tags: thread pool saturation — request backlog risk"
              platform_summary_zh: "[] t-tags：thread pool 飽和 — request 積壓風險"
              description: "Active threads 600 exceeds threshold"
              description_zh: "活動 thread 數 600 超出閾值"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              severity: warning
              maintenance: mute
              metric_group: jvm_threads
              tenant: t-two
            exp_annotations:
              summary: "JVMThreadPoolExhaustion on t-two"
              summary_zh: "t-two 上 JVM thread pool 耗盡"
              platform_summary: "[] t-two: thread pool saturation — request backlog risk"
              platform_summary_zh: "[] t-two：thread pool 飽和 — request 積壓風險"
              description: "Active threads 600 exceeds threshold"
              description_zh: "活動 thread 數 600 超出閾值"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 10m
        alertname: JVMThreadPoolExhaustionCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              maintenance: mute
              metric_group: jvm_threads
              tenant: t-mm
            exp_annotations:
              summary: "JVMThreadPoolExhaustionCritical on t-mm"
              summary_zh: "t-mm 上 JVM thread pool 嚴重耗盡"
              platform_summary: "[] t-mm: critical thread exhaustion — service degradation likely"
              platform_summary_zh: "[] t-mm：嚴重 thread 耗盡 — 服務降級可能性高"
              description: "Active threads 900 exceeds critical threshold"
              description_zh: "活動 thread 數 900 超出嚴重閾值"
              runbook_url: ""
              owner: ""
              tier: ""
