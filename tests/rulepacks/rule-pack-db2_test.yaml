  - interval: 15s
    input_series:
      # Minimum-sample gate (#1176): the ratio needs ≥ 200 sorts per 5m window
      # (n·p0 ≥ 10 at the 0.05 threshold). All three are bare (no metadata):
      #   db-g idle: 3 sorts / 1 overflow per 5m = 0.33 — the old `> 0` guard
      #        fired on it after for: 10m; under the gate it has no ratio.
      #   db-h 210 sorts / 21 overflows per 5m = 0.10, just over the floor — fires.
      #   db-i 190 sorts / 19 overflows per 5m = 0.10, just under it — no ratio.
      #   db-h and db-i differ only in volume, so a floor moved past either side
      #   (or dropped) turns one of them red.
      # A test case of its own, asserted only at 16m: db-h sits just over the floor
      # (0.7 vs 0.667 sorts/s), so rate()'s cold start decides when it first clears
      # it — ~4.6m on Prometheus (window-extrapolated), from the start on
      # MetricsQL (actual data span) — and for: 10m ends ~14.6m vs ~10.25m. 16m is
      # past both, so the two engines agree; x96 (24m) keeps the series fresh there.
      - series: 'db2_sort_overflows_total{tenant="db-g"}'
        values: '0+0.05x96'
      - series: 'db2_sorts_total{tenant="db-g"}'
        values: '0+0.15x96'
      - series: 'db2_sort_overflows_total{tenant="db-h"}'
        values: '0+1.05x96'
      - series: 'db2_sorts_total{tenant="db-h"}'
        values: '0+10.5x96'
      - series: 'db2_sort_overflows_total{tenant="db-i"}'
        values: '0+0.95x96'
      - series: 'db2_sorts_total{tenant="db-i"}'
        values: '0+9.5x96'
      # The bufferpool hit ratio has the same floor (≥ 200 logical reads per 5m,
      # from p0 = 0.95), built the same way: db-j 210 reads / 105 found per 5m
      # (hit 0.5) fires; db-k 190 / 95 per 5m has no ratio.
      - series: 'db2_bufferpool_logical_reads_total{tenant="db-j"}'
        values: '0+10.5x96'
      - series: 'db2_bufferpool_pages_found_total{tenant="db-j"}'
        values: '0+5.25x96'
      - series: 'user_threshold{tenant="db-j", component="db2", metric="bufferpool_hit_ratio", severity="warning"}'
        values: '0.95x96'
      - series: 'db2_bufferpool_logical_reads_total{tenant="db-k"}'
        values: '0+9.5x96'
      - series: 'db2_bufferpool_pages_found_total{tenant="db-k"}'
        values: '0+4.75x96'
      - series: 'user_threshold{tenant="db-k", component="db2", metric="bufferpool_hit_ratio", severity="warning"}'
        values: '0.95x96'
    alert_rule_test:
      - eval_time: 6m
        alertname: DB2HighSortOverflow
        exp_alerts: []
      - eval_time: 16m
