# promtool unit test — DB2 rule-pack FIRING coverage (#947 firing-coverage burn-down).
# Run: promtool test rules tests/rulepacks/rule-pack-db2_test.yaml
#
# Burns down the rule-pack-db2.yaml entries in vmalert_coverage_baseline.yaml (#969):
# the DB2 pack is one of the cross-engine migration reference packs, and until now only its threshold
# VALUE contract was tested (rule-pack-db2-threshold_test.yaml) — the firing decision,
# `for:` state machine and label/annotation rendering escaped both promtool and the
# vmalert-tool gate A. Every alert gets, at minimum:
#   * a FIRING case (non-empty exp_alerts — pins labels + rendered annotations),
#   * a no-fire control (below/above threshold on the safe side / exporter healthy),
#   * a `for:` debounce case (expr already true, eval BEFORE the for: window ⇒ no alert).
# Threshold alerts additionally exercise the maintenance opt-out and the metadata
# annotations, extending the rule-pack-mariadb-threads_test.yaml scaffold to FIVE
# tenants:
#   - db-a: breaching, metadata present    → fires, annotations carry runbook/owner/tier.
#   - db-b: breaching, NO metadata          → still fires, those annotations empty.
#   - db-c: breaching, maintenance active   → suppressed.
#   - db-d: healthy value, metadata present → no alert (threshold-driven no-fire).
#   - db-e: breaching, maintenance, NO meta → suppressed (maintenance does not
#     depend on metadata; alerts join no metadata since #3483).
# db-a's bufferpool, log and tablespace inputs carry a SECOND, healthy exporter or
# dimension so the worst-wins aggregation direction is pinned (:min for hit ratio, :max for
# tablespace usage — a min↔max flip turns the firing assertion red).
# Note DB2LowBufferpoolHitRatio inverts the comparison (min < threshold), so its db-d
# no-fire control sits ABOVE the threshold. All input values are steady-state (constant
# gauges / linear counters ⇒ constant rate once the 5m window is covered), so cross-group
# recording-rule tick skew cannot flip an exact $value at the asserted evals (#943/#949).
rule_files:
  - ../../rule-packs/rule-pack-db2.yaml

evaluation_interval: 15s

tests:
  # ── Availability: DB2DatabaseDown (raw leaf expr, no threshold/branch plumbing) ──
  - interval: 15s
    input_series:
      # query-exporter serves no 0 when the database is down: the liveness
      # query's query_timestamp stops advancing (#3833).
      # db-a: succeeds every 15s until 1m, then stops → unchanged across 90s
      # from 2m15s, firing after for: 15s.
      - series: 'query_interval{tenant="db-a", instance="qe-a:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '15x16'
      - series: 'query_timestamp{tenant="db-a", instance="qe-a:9560", job="tenant-exporters", query="db2_liveness", database="db2"}'
        values: '0+15x4 60x12'
      # db-b: healthy — the timestamp advances every sample → no-fire control.
      - series: 'query_interval{tenant="db-b", instance="qe-b:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '15x16'
      - series: 'query_timestamp{tenant="db-b", instance="qe-b:9560", job="tenant-exporters", query="db2_liveness", database="db2"}'
        values: '0+15x16'
      # db-c: the exporter runs but the liveness query never succeeded (no
      # query_timestamp at all) → fires on the second arm.
      - series: 'query_interval{tenant="db-c", instance="qe-c:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '15x16'

    alert_rule_test:
      # db-c is only pending at 0 (for: 15s).
      - eval_time: 0m
        alertname: DB2DatabaseDown
        exp_alerts: []
      # 2m: db-a's window (30s, 2m] still holds its last change (45s → 1m).
      - eval_time: 2m
        alertname: DB2DatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-c
              instance: qe-c:9560
            exp_annotations:
              summary: "DB2 instance qe-c:9560 is DOWN"
              summary_zh: "DB2 實例 qe-c:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on qe-c:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：qe-c:9560"
              runbook_url: ""
              owner: ""
              tier: ""
      # The 90s window, pinned at both edges (#3833 review). db-a's last
      # change is at 1m, so on Prometheus (t−90s, t] first holds no change at
      # 2m15s and the alert fires after for: 15s at 2m30s; MetricsQL's
      # changes() also compares the sample before the window, so vmalert
      # fires one interval later. 2m15s (neither fires) and 2m45s (both) are
      # where the engines agree; a 75s window fires by 2m15s, a 120s one
      # not before 3m.
      - eval_time: 2m15s
        alertname: DB2DatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-c
              instance: qe-c:9560
            exp_annotations:
              summary: "DB2 instance qe-c:9560 is DOWN"
              summary_zh: "DB2 實例 qe-c:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on qe-c:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：qe-c:9560"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 2m45s
        alertname: DB2DatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-a
              instance: qe-a:9560
            exp_annotations:
              summary: "DB2 instance qe-a:9560 is DOWN"
              summary_zh: "DB2 實例 qe-a:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on qe-a:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：qe-a:9560"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-c
              instance: qe-c:9560
            exp_annotations:
              summary: "DB2 instance qe-c:9560 is DOWN"
              summary_zh: "DB2 實例 qe-c:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on qe-c:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：qe-c:9560"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 3m
        alertname: DB2DatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-a
              instance: qe-a:9560
            exp_annotations:
              summary: "DB2 instance qe-a:9560 is DOWN"
              summary_zh: "DB2 實例 qe-a:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on qe-a:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：qe-a:9560"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-c
              instance: qe-c:9560
            exp_annotations:
              summary: "DB2 instance qe-c:9560 is DOWN"
              summary_zh: "DB2 實例 qe-c:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on qe-c:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：qe-c:9560"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── DB2DatabaseDown: one sample is not "stopped" (#3833). Through 30s
  #    federation a restarted exporter's first query_timestamp sample stands
  #    alone for 30s; without the count_over_time guard changes() reads 0 and
  #    the alert pages. db-d's series start at 2m, one sample per 30s. ──
  - interval: 30s
    input_series:
      - series: 'query_interval{tenant="db-d", instance="qe-d:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '_x4 15x4'
      - series: 'query_timestamp{tenant="db-d", instance="qe-d:9560", job="tenant-exporters", query="db2_liveness", database="db2"}'
        values: '_x4 100+30x4'
    alert_rule_test:
      - eval_time: 2m15s
        alertname: DB2DatabaseDown
        exp_alerts: []


  # ── Threshold + ratio alerts: four-tenant scaffold, one shared input set ──
  - interval: 15s
    input_series:
      # Tenant scaffold — metadata for db-a/db-c/db-d (db-b is the onboarding vacuum),
      # maintenance flag on db-c only.
      - series: 'tenant_metadata_info{tenant="db-a", runbook_url="http://rb/a", owner="team-a", tier="gold"}'
        values: '1x48'
      - series: 'tenant_metadata_info{tenant="db-c", runbook_url="http://rb/c", owner="team-c", tier="silver"}'
        values: '1x48'
      - series: 'tenant_metadata_info{tenant="db-d", runbook_url="http://rb/d", owner="team-d", tier="bronze"}'
        values: '1x48'
      - series: 'user_state_filter{tenant="db-c", filter="maintenance"}'
        values: '1x48'
      - series: 'user_state_filter{tenant="db-e", filter="maintenance"}'
        values: '1x48'

      # Active connections: 250 > 200 warning (db-a/b/c, and db-e in its block below); db-d 100 < 200.
      - series: 'db2_connections_current{tenant="db-a"}'
        values: '250x48'
      - series: 'db2_connections_current{tenant="db-b"}'
        values: '250x48'
      - series: 'db2_connections_current{tenant="db-c"}'
        values: '250x48'
      - series: 'db2_connections_current{tenant="db-d"}'
        values: '100x48'
      - series: 'user_threshold{tenant="db-a", component="db2", metric="connections_active", severity="warning"}'
        values: '200x48'
      - series: 'user_threshold{tenant="db-b", component="db2", metric="connections_active", severity="warning"}'
        values: '200x48'
      - series: 'user_threshold{tenant="db-c", component="db2", metric="connections_active", severity="warning"}'
        values: '200x48'
      - series: 'user_threshold{tenant="db-d", component="db2", metric="connections_active", severity="warning"}'
        values: '200x48'

      # Bufferpool hit ratio — INVERTED comparison (min < threshold fires). The
      # pack computes rate(pages found) / rate(logical reads) per exporter:
      # logical +1000/15s, found +900/15s ⇒ 0.9 < 0.95 breaches (db-a/b/c); db-d
      # found +990/15s ⇒ 0.99, the healthy no-fire control. Both counters of
      # an exporter start together, so rate()'s cold-start extrapolation scales
      # them alike and the ratio is exact from the first tick on both engines.
      - series: 'db2_bufferpool_logical_reads_total{tenant="db-a", instance="db2-a1"}'
        values: '0+1000x48'
      - series: 'db2_bufferpool_pages_found_total{tenant="db-a", instance="db2-a1"}'
        values: '0+900x48'
      # Second, HEALTHY exporter for db-a — pins worst-member-wins (:min) direction:
      # min(0.9, 0.99) = 0.9 fires; a min→max flip reads 0.99 (≥ 0.95) and goes red,
      # and so does summing the counters across exporters first (0.945).
      - series: 'db2_bufferpool_logical_reads_total{tenant="db-a", instance="db2-a2"}'
        values: '0+1000x48'
      - series: 'db2_bufferpool_pages_found_total{tenant="db-a", instance="db2-a2"}'
        values: '0+990x48'
      - series: 'db2_bufferpool_logical_reads_total{tenant="db-b"}'
        values: '0+1000x48'
      - series: 'db2_bufferpool_pages_found_total{tenant="db-b"}'
        values: '0+900x48'
      - series: 'db2_bufferpool_logical_reads_total{tenant="db-c"}'
        values: '0+1000x48'
      - series: 'db2_bufferpool_pages_found_total{tenant="db-c"}'
        values: '0+900x48'
      - series: 'db2_bufferpool_logical_reads_total{tenant="db-d"}'
        values: '0+1000x48'
      - series: 'db2_bufferpool_pages_found_total{tenant="db-d"}'
        values: '0+990x48'
      - series: 'user_threshold{tenant="db-a", component="db2", metric="bufferpool_hit_ratio", severity="warning"}'
        values: '0.95x48'
      - series: 'user_threshold{tenant="db-b", component="db2", metric="bufferpool_hit_ratio", severity="warning"}'
        values: '0.95x48'
      - series: 'user_threshold{tenant="db-c", component="db2", metric="bufferpool_hit_ratio", severity="warning"}'
        values: '0.95x48'
      - series: 'user_threshold{tenant="db-d", component="db2", metric="bufferpool_hit_ratio", severity="warning"}'
        values: '0.95x48'

      # Transaction log usage = 100 · used / (used + available): 85 / (85 + 15)
      # = 85% > 70 warning; db-d 50 / (50 + 50) = 50% < 70. db-a's second
      # exporter is at 10%, pinning the per-exporter share before :max (summing
      # first reads 47.5%, below 70, and goes red).
      - series: 'db2_log_used_bytes{tenant="db-a", instance="db2-a1"}'
        values: '85x48'
      - series: 'db2_log_available_bytes{tenant="db-a", instance="db2-a1"}'
        values: '15x48'
      - series: 'db2_log_used_bytes{tenant="db-a", instance="db2-a2"}'
        values: '10x48'
      - series: 'db2_log_available_bytes{tenant="db-a", instance="db2-a2"}'
        values: '90x48'
      - series: 'db2_log_used_bytes{tenant="db-b"}'
        values: '85x48'
      - series: 'db2_log_available_bytes{tenant="db-b"}'
        values: '15x48'
      - series: 'db2_log_used_bytes{tenant="db-c"}'
        values: '85x48'
      - series: 'db2_log_available_bytes{tenant="db-c"}'
        values: '15x48'
      - series: 'db2_log_used_bytes{tenant="db-d"}'
        values: '50x48'
      - series: 'db2_log_available_bytes{tenant="db-d"}'
        values: '50x48'
      - series: 'user_threshold{tenant="db-a", component="db2", metric="log_usage_percent", severity="warning"}'
        values: '70x48'
      - series: 'user_threshold{tenant="db-b", component="db2", metric="log_usage_percent", severity="warning"}'
        values: '70x48'
      - series: 'user_threshold{tenant="db-c", component="db2", metric="log_usage_percent", severity="warning"}'
        values: '70x48'
      - series: 'user_threshold{tenant="db-d", component="db2", metric="log_usage_percent", severity="warning"}'
        values: '70x48'

      # Deadlock counter: +300/15s ⇒ steady rate5m = 20/s > 5 (db-a/b/c/e); db-d +30/15s ⇒ 2.0.
      # ⚠️ rate() cold-start (#946): with series starting at t=0, Prometheus'
      # extrapolatedRate divides by the FULL 5m window, so the Prom rate ramps with
      # window coverage — a steady rate close to the threshold would cross very late.
      # 20 vs 5 crosses at ~1m30s on Prom (⇒ for: 5m fires at ~6m30s); MetricsQL uses
      # the actual data span and reads 20 from the first ticks (⇒ fires at ~5m15s). The
      # firing assertion below sits at 9m — past BOTH engines' fire point with wide
      # margin against promtool extrapolation-math drift, window fully covered ⇒ $value
      # is exactly 20.0 on both — so the known cold-start divergence axis is avoided by
      # construction instead of catalogued. Soak expectation: at a REAL cold-start
      # (new tenant / exporter restart / counter reset) VM's first fire leads Prometheus
      # by up to one window — expected engine math, NOT a false positive; see
      # docs/integration/victoriametrics-integration.md §3.1.
      - series: 'db2_deadlocks_total{tenant="db-a"}'
        values: '0+300x48'
      - series: 'db2_deadlocks_total{tenant="db-b"}'
        values: '0+300x48'
      - series: 'db2_deadlocks_total{tenant="db-c"}'
        values: '0+300x48'
      - series: 'db2_deadlocks_total{tenant="db-d"}'
        values: '0+30x48'
      - series: 'user_threshold{tenant="db-a", component="db2", metric="deadlock_rate", severity="warning"}'
        values: '5x48'
      - series: 'user_threshold{tenant="db-b", component="db2", metric="deadlock_rate", severity="warning"}'
        values: '5x48'
      - series: 'user_threshold{tenant="db-c", component="db2", metric="deadlock_rate", severity="warning"}'
        values: '5x48'
      - series: 'user_threshold{tenant="db-d", component="db2", metric="deadlock_rate", severity="warning"}'
        values: '5x48'

      # Tablespace usage: 92 > 85 warning; db-d 70 < 85.
      - series: 'db2_tablespace_used_percent{tenant="db-a", tablespace="USERSPACE1"}'
        values: '92x48'
      # Second, HEALTHY dimension for db-a — pins worst-dimension-wins (:max) direction:
      # max(92, 70) = 92 fires; a max→min flip reads 70 (< 85) and goes red.
      - series: 'db2_tablespace_used_percent{tenant="db-a", tablespace="SYSCATSPACE"}'
        values: '70x48'
      - series: 'db2_tablespace_used_percent{tenant="db-b", tablespace="USERSPACE1"}'
        values: '92x48'
      - series: 'db2_tablespace_used_percent{tenant="db-c", tablespace="USERSPACE1"}'
        values: '92x48'
      - series: 'db2_tablespace_used_percent{tenant="db-d", tablespace="USERSPACE1"}'
        values: '70x48'
      - series: 'user_threshold{tenant="db-a", component="db2", metric="tablespace_used_percent", severity="warning"}'
        values: '85x48'
      - series: 'user_threshold{tenant="db-b", component="db2", metric="tablespace_used_percent", severity="warning"}'
        values: '85x48'
      - series: 'user_threshold{tenant="db-c", component="db2", metric="tablespace_used_percent", severity="warning"}'
        values: '85x48'
      - series: 'user_threshold{tenant="db-d", component="db2", metric="tablespace_used_percent", severity="warning"}'
        values: '85x48'

      # Lock wait time: CUMULATIVE seconds counter ⇒ must be monotonically increasing
      # (`0+Nx48`, never a flat `Nx48` — flat has rate() == 0 and would make the alert
      # vacuous / falsely green). +60s per 15s scrape ⇒ steady rate5m = 4.0 s/s, i.e.
      # four seconds of session lock wait accrued per wall-clock second — well above the
      # 1.0 threshold. db-d accrues +3/15s ⇒ 0.2 s/s, the below-threshold control.
      # Same rate() cold-start caveat as the deadlock block: Prom's extrapolatedRate
      # divides by the full 5m window, so 4.0 vs 1.0 crosses at ~1m15s (⇒ for: 5m fires
      # at ~6m15s) while MetricsQL reads 4.0 from the first ticks. The firing assertion
      # sits at 9m — past both engines, window fully covered ⇒ $value is exactly 4.0.
      - series: 'db2_lock_wait_time_seconds_total{tenant="db-a"}'
        values: '0+60x48'
      - series: 'db2_lock_wait_time_seconds_total{tenant="db-b"}'
        values: '0+60x48'
      - series: 'db2_lock_wait_time_seconds_total{tenant="db-c"}'
        values: '0+60x48'
      - series: 'db2_lock_wait_time_seconds_total{tenant="db-d"}'
        values: '0+3x48'
      - series: 'user_threshold{tenant="db-a", component="db2", metric="lock_wait_time", severity="warning"}'
        values: '1x48'
      - series: 'user_threshold{tenant="db-b", component="db2", metric="lock_wait_time", severity="warning"}'
        values: '1x48'
      - series: 'user_threshold{tenant="db-c", component="db2", metric="lock_wait_time", severity="warning"}'
        values: '1x48'
      - series: 'user_threshold{tenant="db-d", component="db2", metric="lock_wait_time", severity="warning"}'
        values: '1x48'

      # db-f: DORMANCY control for DB2HighLockWaitTime. Breaches at the same 4.0 s/s as
      # db-a AND has tenant_metadata_info — the ONLY thing it lacks is a
      # user_threshold{metric="lock_wait_time"}. It must produce no alert: that is the
      # shipped-dormant contract (the pack ships no default for this key, so the alert
      # stays inert until a tenant opts in via conf.d). Give this alert a hardcoded
      # threshold and db-f's implicit no-fire assertion turns red.
      - series: 'tenant_metadata_info{tenant="db-f", runbook_url="http://rb/f", owner="team-f", tier="gold"}'
        values: '1x48'
      - series: 'db2_lock_wait_time_seconds_total{tenant="db-f"}'
        values: '0+60x48'

      # Sort overflow RATE ratio (hardcoded > 0.05). ⚠️ This block is DISCRIMINATING
      # by construction (#1181) — it must FAIL against the pre-fix rule:
      #   * Both metrics are CUMULATIVE counters → must be monotonically increasing.
      #     A flat `Nx48` has rate() == 0 and makes the alert vacuous (the old fixture
      #     was flat, which is why it pinned the buggy lifetime-ratio behaviour green).
      #   * They carry a LARGE BASELINE (1000 / 100000) representing a long-running
      #     instance with a healthy history, then accrue at the fault rate.
      #     - lifetime-cumulative ratio ≈ 1000/100000 = 0.01  → BELOW 0.05 (pre-fix
      #       rule sees no breach at all → nobody fires → this fixture goes red)
      #     - recent RATE ratio = 8/100 = 0.08                → ABOVE 0.05 (post-fix)
      #     That gap IS the bug: a real recent episode diluted by lifetime history.
      #   * db-d keeps the below-threshold contrast at rate 2/100 = 0.02.
      - series: 'db2_sort_overflows_total{tenant="db-a"}'
        values: '1000+8x48'
      - series: 'db2_sort_overflows_total{tenant="db-b"}'
        values: '1000+8x48'
      - series: 'db2_sort_overflows_total{tenant="db-c"}'
        values: '1000+8x48'
      - series: 'db2_sort_overflows_total{tenant="db-d"}'
        values: '1000+2x48'
      - series: 'db2_sorts_total{tenant="db-a"}'
        values: '100000+100x48'
      - series: 'db2_sorts_total{tenant="db-b"}'
        values: '100000+100x48'
      - series: 'db2_sorts_total{tenant="db-c"}'
        values: '100000+100x48'
      - series: 'db2_sorts_total{tenant="db-d"}'
        values: '100000+100x48'

      # db-e: BARE-arm maintenance control — breaches EVERY metric, is in maintenance,
      # has NO tenant_metadata_info. Only the bare arm's hand-copied
      # `unless (user_state_filter{filter="maintenance"} == 1)` can suppress it; delete
      # or typo that clause in any alert and its implicit no-fire assertion turns red.
      - series: 'db2_connections_current{tenant="db-e"}'
        values: '250x48'
      - series: 'user_threshold{tenant="db-e", component="db2", metric="connections_active", severity="warning"}'
        values: '200x48'
      - series: 'db2_bufferpool_logical_reads_total{tenant="db-e"}'
        values: '0+1000x48'
      - series: 'db2_bufferpool_pages_found_total{tenant="db-e"}'
        values: '0+900x48'
      - series: 'user_threshold{tenant="db-e", component="db2", metric="bufferpool_hit_ratio", severity="warning"}'
        values: '0.95x48'
      - series: 'db2_log_used_bytes{tenant="db-e"}'
        values: '85x48'
      - series: 'db2_log_available_bytes{tenant="db-e"}'
        values: '15x48'
      - series: 'user_threshold{tenant="db-e", component="db2", metric="log_usage_percent", severity="warning"}'
        values: '70x48'
      - series: 'db2_deadlocks_total{tenant="db-e"}'
        values: '0+300x48'
      - series: 'user_threshold{tenant="db-e", component="db2", metric="deadlock_rate", severity="warning"}'
        values: '5x48'
      - series: 'db2_tablespace_used_percent{tenant="db-e", tablespace="USERSPACE1"}'
        values: '92x48'
      - series: 'user_threshold{tenant="db-e", component="db2", metric="tablespace_used_percent", severity="warning"}'
        values: '85x48'
      - series: 'db2_lock_wait_time_seconds_total{tenant="db-e"}'
