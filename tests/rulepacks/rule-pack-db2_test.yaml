              summary_zh: "qe-db-r:9560 上的 DB2 查詢 db2_tablespace 已停止"
              platform_summary: "[] db-r: query-exporter query db2_tablespace stopped while the database answers — the alerts on its metrics are silent"
              platform_summary_zh: "[] db-r：資料庫有回應，但 query-exporter 的查詢 db2_tablespace 已停止 — 讀它指標的告警不會響"
              description: "query-exporter stopped running db2_tablespace (or it never succeeded). When a result does not fit the declared metrics it drops the query for good; the cause is in its log at the default level (\"query failed\") and in queries_total{status=\"error\"}. Fix the SQL in rule-packs/exporters/db2.yaml, then restart the exporter."
              description_zh: "query-exporter 不再執行 db2_tablespace（或從未成功）。查詢結果與宣告的指標不符時，它會永久移除該查詢；原因記在預設等級的日誌（\"query failed\"）與 queries_total{status=\"error\"}。修正 rule-packs/exporters/db2.yaml 的 SQL 後重啟 exporter。"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 11m
        alertname: DB2QueryStalled
        exp_alerts:
          - exp_labels:
              maintenance: mute
              severity: warning
              tenant: db-q
              instance: qe-db-q:9560
              query: db2_database
            exp_annotations:
              summary: "DB2 query db2_database stopped on qe-db-q:9560"
              summary_zh: "qe-db-q:9560 上的 DB2 查詢 db2_database 已停止"
              platform_summary: "[] db-q: query-exporter query db2_database stopped while the database answers — the alerts on its metrics are silent"
              platform_summary_zh: "[] db-q：資料庫有回應，但 query-exporter 的查詢 db2_database 已停止 — 讀它指標的告警不會響"
              description: "query-exporter stopped running db2_database (or it never succeeded). When a result does not fit the declared metrics it drops the query for good; the cause is in its log at the default level (\"query failed\") and in queries_total{status=\"error\"}. Fix the SQL in rule-packs/exporters/db2.yaml, then restart the exporter."
              description_zh: "query-exporter 不再執行 db2_database（或從未成功）。查詢結果與宣告的指標不符時，它會永久移除該查詢；原因記在預設等級的日誌（\"query failed\"）與 queries_total{status=\"error\"}。修正 rule-packs/exporters/db2.yaml 的 SQL 後重啟 exporter。"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              maintenance: mute
              severity: warning
              tenant: db-r
              instance: qe-db-r:9560
              query: db2_tablespace
            exp_annotations:
              summary: "DB2 query db2_tablespace stopped on qe-db-r:9560"
              summary_zh: "qe-db-r:9560 上的 DB2 查詢 db2_tablespace 已停止"
              platform_summary: "[] db-r: query-exporter query db2_tablespace stopped while the database answers — the alerts on its metrics are silent"
              platform_summary_zh: "[] db-r：資料庫有回應，但 query-exporter 的查詢 db2_tablespace 已停止 — 讀它指標的告警不會響"
              description: "query-exporter stopped running db2_tablespace (or it never succeeded). When a result does not fit the declared metrics it drops the query for good; the cause is in its log at the default level (\"query failed\") and in queries_total{status=\"error\"}. Fix the SQL in rule-packs/exporters/db2.yaml, then restart the exporter."
              description_zh: "query-exporter 不再執行 db2_tablespace（或從未成功）。查詢結果與宣告的指標不符時，它會永久移除該查詢；原因記在預設等級的日誌（\"query failed\"）與 queries_total{status=\"error\"}。修正 rule-packs/exporters/db2.yaml 的 SQL 後重啟 exporter。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── DB2DatabaseDown after federation (#3833): two clusters' pods can share
  #    an IP:port. db-u never ran its liveness query; db-v, at the same
  #    instance, is healthy. Joined on instance alone, db-v's timestamp would
  #    hide db-u's alert. ──
  - interval: 15s
    input_series:
      - series: 'query_interval{tenant="db-u", instance="10.244.0.7:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '15x12'
      - series: 'query_interval{tenant="db-v", instance="10.244.0.7:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '15x12'
      - series: 'query_timestamp{tenant="db-v", instance="10.244.0.7:9560", job="tenant-exporters", query="db2_liveness", database="db2"}'
        values: '0+15x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: DB2DatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-u
              instance: 10.244.0.7:9560
            exp_annotations:
              summary: "DB2 instance 10.244.0.7:9560 is DOWN"
              summary_zh: "DB2 實例 10.244.0.7:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on 10.244.0.7:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：10.244.0.7:9560"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── DB2DatabaseDown through 30s federation (#3833 review): the database
  #    stops after 2m; the scrape at 5m30s is missed. Requiring 3 samples in
  #    the 90s window would resolve the page there and re-fire later. ──
  - interval: 30s
    input_series:
      - series: 'query_interval{tenant="db-x", instance="qe-db-x:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '15x20'
      - series: 'query_timestamp{tenant="db-x", instance="qe-db-x:9560", job="tenant-exporters", query="db2_liveness", database="db2"}'
        values: '0+30x4 120x6 _ 120x9'
    alert_rule_test:
      - eval_time: 5m
        alertname: DB2DatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-x
              instance: qe-db-x:9560
            exp_annotations:
              summary: "DB2 instance qe-db-x:9560 is DOWN"
              summary_zh: "DB2 實例 qe-db-x:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on qe-db-x:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：qe-db-x:9560"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 5m30s
        alertname: DB2DatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-x
              instance: qe-db-x:9560
            exp_annotations:
              summary: "DB2 instance qe-db-x:9560 is DOWN"
              summary_zh: "DB2 實例 qe-db-x:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on qe-db-x:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：qe-db-x:9560"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 6m
        alertname: DB2DatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-x
              instance: qe-db-x:9560
            exp_annotations:
              summary: "DB2 instance qe-db-x:9560 is DOWN"
              summary_zh: "DB2 實例 qe-db-x:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on qe-db-x:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：qe-db-x:9560"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── DB2DatabaseDown on a NEW series: the exporter starts at 1m, the
  #    liveness query succeeds once (timestamp 60) and never again. changes()
  #    sees only the samples there are, so without the `offset 90s` sample the
  #    window (t-90s, t] reads as "no progress" from 1m15s and pages at 1m30s,
  #    30s after the last success. With it the series must reach back 90s:
  #    true from 2m30s, firing after for: 15s at 2m45s (105s after the
  #    success, the same 90-105s as a long-lived series). ──
  - interval: 15s
    input_series:
      - series: 'query_interval{tenant="db-n", instance="qe-n:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '_x4 15x20'
      - series: 'query_timestamp{tenant="db-n", instance="qe-n:9560", job="tenant-exporters", query="db2_liveness", database="db2"}'
        values: '_x4 60x20'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: DB2DatabaseDown
        exp_alerts: []
      - eval_time: 2m30s
        alertname: DB2DatabaseDown
        exp_alerts: []
      - eval_time: 2m45s
        alertname: DB2DatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-n
              instance: qe-n:9560
            exp_annotations:
              summary: "DB2 instance qe-n:9560 is DOWN"
              summary_zh: "DB2 實例 qe-n:9560 已關閉"
              description: "The DB2 liveness query has not succeeded for 90s on qe-n:9560"
              description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：qe-n:9560"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── DB2DatabaseDown across an exporter restart through 30s federation
  #    (#3833 review). The exporter at the same instance is healthy until 2m,
  #    gone, and back at 4m30s with a fresh timestamp. Its first new sample
  #    stands alone in the 90s window; with `count_over_time(...) > 0` instead
  #    of `> 1` changes() reads 0 and pages 15s after the restart. ──
  - interval: 30s
    input_series:
      - series: 'query_interval{tenant="db-z", instance="qe-z:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '15x4 _x4 15x8'
      - series: 'query_timestamp{tenant="db-z", instance="qe-z:9560", job="tenant-exporters", query="db2_liveness", database="db2"}'
        values: '0+30x4 _x4 1000+30x8'
    alert_rule_test:
      - eval_time: 4m45s
        alertname: DB2DatabaseDown
        exp_alerts: []

  # ── DB2QueryStalled stays quiet while the liveness query has never
  #    succeeded (#3833 review): db-y's exporter schedules db2_liveness and
  #    db2_database and neither ever succeeded. That is DB2DatabaseDown's
  #    page; without the `unless` arm for a liveness query that never ran,
  #    DB2QueryStalled would also fire for db2_database. ──
  - interval: 15s
    input_series:
      - series: 'query_interval{tenant="db-y", instance="qe-y:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '15x40'
      - series: 'query_interval{tenant="db-y", instance="qe-y:9560", job="tenant-exporters", query="db2_database"}'
        values: '15x40'
    alert_rule_test:
      - eval_time: 7m
        alertname: DB2QueryStalled
        exp_alerts: []

  # ── DB2DatabaseDown waits 90s for a FIRST success too (#3833, CodeRabbit):
  #    db-l's exporter serves query_interval from 0 but its first liveness
  #    run succeeds only at 1m (a slow first connection). Without the
  #    `query_interval offset 90s` guard on the never-succeeded arm, it
  #    pages at 15s while the database is up. ──
  - interval: 15s
    input_series:
      - series: 'query_interval{tenant="db-l", instance="qe-l:9560", job="tenant-exporters", query="db2_liveness"}'
        values: '15x16'
      - series: 'query_timestamp{tenant="db-l", instance="qe-l:9560", job="tenant-exporters", query="db2_liveness", database="db2"}'
        values: '_x4 60+15x12'
    alert_rule_test:
      - eval_time: 30s
        alertname: DB2DatabaseDown
        exp_alerts: []
      - eval_time: 1m
        alertname: DB2DatabaseDown
        exp_alerts: []
      - eval_time: 3m
        alertname: DB2DatabaseDown
        exp_alerts: []
