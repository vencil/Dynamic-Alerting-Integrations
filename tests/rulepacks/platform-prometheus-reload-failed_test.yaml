# promtool behavioural test for PrometheusConfigReloadFailed (#1246).
#
# The alert exists because the config-reloader sidecar turns a LOUD failure into a
# silent one. Measured on a real prom/prometheus:v3.13.1 with a deliberately broken
# rule file: POST /-/reload is rejected, this gauge drops to 0, /api/v1/rules keeps
# returning the PRE-EDIT rule, and the process stays Up — so without this alert a
# broken Rule Pack is invisible. The cases below pin that contract:
#   1) FIRES while the gauge is stuck at 0 (the real shape — a failed reload does
#      NOT self-heal; it clears only when a later reload SUCCEEDS).
#   2) does NOT fire while reloads are succeeding (gauge == 1).
#   3) does NOT fire on a fix-forward that lands inside the 2m hold-down.
# Run: promtool test rules tests/rulepacks/platform-prometheus-reload-failed_test.yaml
rule_files:
  - platform-prometheus-reload-failed.rules.yaml

evaluation_interval: 1m

tests:
  # 1) Broken Rule Pack applied and left broken: the gauge sits at 0 indefinitely.
  #    This is the case the alert is FOR — Prometheus is happily serving stale rules.
  - interval: 1m
    name: sustained-reload-failure-fires
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="prometheus", instance="localhost:9090"}'
        values: '0x30'   # stuck at 0 for 30m
    alert_rule_test:
      # 3m PINS THE HOLD-DOWN FROM ABOVE: with `for: 2m` the alert is already
      # firing here. Lengthening it (2m → 10m) leaves this probe silent and fails
      # ONLY here — case 3's 6m probe pins it from below, but nothing pins the
      # duration itself unless one case evaluates between 2m and the next value
      # someone might "round up" to.
      - eval_time: 3m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: prometheus
              instance: localhost:9090
            exp_annotations:
              summary: "Prometheus rejected its last reload — Rule Pack edits are NOT in effect"
      - eval_time: 20m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: prometheus
              instance: localhost:9090
            exp_annotations:
              summary: "Prometheus rejected its last reload — Rule Pack edits are NOT in effect"

  # 2) Healthy steady state: reloads succeed, gauge at 1 — must stay silent.
  - interval: 1m
    name: healthy-reloads-no-fire
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="prometheus", instance="localhost:9090"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []

  # 3) Fix-forward inside the hold-down: a bad pack is applied at t6 and corrected
  #    before the next kubelet sync, so the following reload succeeds at t7.
  #
  #    ⚠️ The eval at 6m is the DISCRIMINATOR for `for: 2m` and must not be removed:
  #    the gauge IS 0 there, so a rule WITHOUT the hold-down would already be FIRING,
  #    whereas `for: 2m` keeps it merely pending (1m < 2m). Probing only after
  #    recovery (8m/20m, gauge back to 1) would pass with or without `for:` — i.e.
  #    would not test the debounce at all.
  - interval: 1m
    name: fix-forward-within-holddown-no-fire
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="prometheus", instance="localhost:9090"}'
        values: '1+0x5 0 1+0x24'   # 1 for t0-5, 0 at t6, back to 1 t7-30
    alert_rule_test:
      - eval_time: 6m    # DISCRIMINATOR: gauge==0 here; a rule with no `for` FIRES
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []
      - eval_time: 8m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []

  # 4) DISCRIMINATOR for the job selector: this alert is about the PLATFORM's
  #    Prometheus, scraped by the static `job="prometheus"` self-scrape. Any other
  #    Prometheus that ends up scraped under a different job (a tenant's own, or a
  #    federation upstream reached through the annotation-based jobs) emits the very
  #    same metric name, and paging the platform team for a tenant's broken config
  #    would be wrong. Dropping `{job="prometheus"}` fails ONLY this case.
  - interval: 1m
    name: other-prometheus-job-no-fire
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="tenant-prometheus", instance="10.1.2.3:9090"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []
