  # ── OracleDatabaseDown after federation (#3833): two clusters' pods can share
  #    an IP:port. db-u never ran its liveness query; db-v, at the same
  #    instance, is healthy. Joined on instance alone, db-v's timestamp would
  #    hide db-u's alert. ──
  - interval: 15s
    input_series:
      - series: 'query_interval{tenant="db-u", instance="10.244.0.7:9560", job="tenant-exporters", query="oracle_liveness"}'
        values: '15x8'
      - series: 'query_interval{tenant="db-v", instance="10.244.0.7:9560", job="tenant-exporters", query="oracle_liveness"}'
        values: '15x8'
      - series: 'query_timestamp{tenant="db-v", instance="10.244.0.7:9560", job="tenant-exporters", query="oracle_liveness", database="oracle"}'
        values: '0+15x8'
    alert_rule_test:
      - eval_time: 1m
        alertname: OracleDatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-u
              instance: 10.244.0.7:9560
            exp_annotations:
              summary: "Oracle instance 10.244.0.7:9560 is DOWN"
              summary_zh: "Oracle 實例 10.244.0.7:9560 已關閉"
              description: "The Oracle liveness query has not succeeded for 90s on 10.244.0.7:9560"
              description_zh: "Oracle 存活查詢 90 秒內沒有成功，實例：10.244.0.7:9560"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── OracleDatabaseDown through 30s federation (#3833 review): the database
  #    stops after 2m; the scrape at 5m30s is missed. Requiring 3 samples in
  #    the 90s window would resolve the page there and re-fire later. ──
  - interval: 30s
    input_series:
      - series: 'query_interval{tenant="db-x", instance="qe-db-x:9560", job="tenant-exporters", query="oracle_liveness"}'
        values: '15x20'
      - series: 'query_timestamp{tenant="db-x", instance="qe-db-x:9560", job="tenant-exporters", query="oracle_liveness", database="oracle"}'
        values: '0+30x4 120x6 _ 120x9'
    alert_rule_test:
      - eval_time: 5m
        alertname: OracleDatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-x
              instance: qe-db-x:9560
            exp_annotations:
              summary: "Oracle instance qe-db-x:9560 is DOWN"
              summary_zh: "Oracle 實例 qe-db-x:9560 已關閉"
              description: "The Oracle liveness query has not succeeded for 90s on qe-db-x:9560"
              description_zh: "Oracle 存活查詢 90 秒內沒有成功，實例：qe-db-x:9560"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 5m30s
        alertname: OracleDatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-x
              instance: qe-db-x:9560
            exp_annotations:
              summary: "Oracle instance qe-db-x:9560 is DOWN"
              summary_zh: "Oracle 實例 qe-db-x:9560 已關閉"
              description: "The Oracle liveness query has not succeeded for 90s on qe-db-x:9560"
              description_zh: "Oracle 存活查詢 90 秒內沒有成功，實例：qe-db-x:9560"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 6m
        alertname: OracleDatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-x
              instance: qe-db-x:9560
            exp_annotations:
              summary: "Oracle instance qe-db-x:9560 is DOWN"
              summary_zh: "Oracle 實例 qe-db-x:9560 已關閉"
              description: "The Oracle liveness query has not succeeded for 90s on qe-db-x:9560"
              description_zh: "Oracle 存活查詢 90 秒內沒有成功，實例：qe-db-x:9560"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── OracleDatabaseDown on a NEW series: the exporter starts at 1m, the
  #    liveness query succeeds once (timestamp 60) and never again. changes()
  #    sees only the samples there are, so without the `offset 90s` sample the
  #    window (t-90s, t] reads as "no progress" from 1m15s and pages at 1m30s,
  #    30s after the last success. With it the series must reach back 90s:
  #    true from 2m30s, firing after for: 15s at 2m45s (105s after the
  #    success, the same 90-105s as a long-lived series). ──
  - interval: 15s
    input_series:
      - series: 'query_interval{tenant="db-n", instance="qe-n:9560", job="tenant-exporters", query="oracle_liveness"}'
        values: '_x4 15x20'
      - series: 'query_timestamp{tenant="db-n", instance="qe-n:9560", job="tenant-exporters", query="oracle_liveness", database="oracle"}'
        values: '_x4 60x20'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: OracleDatabaseDown
        exp_alerts: []
      - eval_time: 2m30s
        alertname: OracleDatabaseDown
        exp_alerts: []
      - eval_time: 2m45s
        alertname: OracleDatabaseDown
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: db-n
              instance: qe-n:9560
            exp_annotations:
              summary: "Oracle instance qe-n:9560 is DOWN"
              summary_zh: "Oracle 實例 qe-n:9560 已關閉"
              description: "The Oracle liveness query has not succeeded for 90s on qe-n:9560"
              description_zh: "Oracle 存活查詢 90 秒內沒有成功，實例：qe-n:9560"
              runbook_url: ""
              owner: ""
              tier: ""
