  # ── OracleQueryStalled (#3833): query-exporter drops a query for good on a
  #    result-shape error. db-q: liveness and oracle_process keep running,
  #    oracle_sessions stops at 1m → its window (t-5m, t] holds only the
  #    stopped value from 5m45s, firing after for: 5m at 10m45s on Prometheus;
  #    MetricsQL's changes() also compares against the sample just before the
  #    window, so vmalert fires one interval later. Asserted at 10m30s (neither
  #    fires) and 11m (both fire). db-r: oracle_wait_time is scheduled (query_interval) but
  #    never succeeded → fires at 5m. db-s: the database is down (liveness
  #    stops too) → OracleDatabaseDown's case, not this one. db-t: in
  #    maintenance → muted. Success is read off queries_total{status="success"}
  #    (a run with no rows succeeds without touching query_timestamp). ──
  - interval: 15s
    input_series:
      - series: 'query_timestamp{tenant="db-q", instance="qe-db-q:9560", job="tenant-exporters", query="oracle_liveness", database="oracle"}'
        values: '0+15x48'
      - series: 'queries_total{tenant="db-q", instance="qe-db-q:9560", job="tenant-exporters", query="oracle_process", database="oracle", status="success"}'
        values: '1+1x48'
      - series: 'queries_total{tenant="db-q", instance="qe-db-q:9560", job="tenant-exporters", query="oracle_sessions", database="oracle", status="success"}'
        values: '1+1x4 5x44'
      - series: 'query_timestamp{tenant="db-r", instance="qe-db-r:9560", job="tenant-exporters", query="oracle_liveness", database="oracle"}'
        values: '0+15x48'
      - series: 'query_interval{tenant="db-r", instance="qe-db-r:9560", job="tenant-exporters", query="oracle_wait_time"}'
        values: '15x48'
      - series: 'query_timestamp{tenant="db-s", instance="qe-db-s:9560", job="tenant-exporters", query="oracle_liveness", database="oracle"}'
        values: '0+15x4 60x44'
      - series: 'queries_total{tenant="db-s", instance="qe-db-s:9560", job="tenant-exporters", query="oracle_sessions", database="oracle", status="success"}'
        values: '1+1x4 5x44'
      - series: 'query_timestamp{tenant="db-t", instance="qe-db-t:9560", job="tenant-exporters", query="oracle_liveness", database="oracle"}'
        values: '0+15x48'
      - series: 'queries_total{tenant="db-t", instance="qe-db-t:9560", job="tenant-exporters", query="oracle_sessions", database="oracle", status="success"}'
        values: '1+1x4 5x44'
      - series: 'user_state_filter{tenant="db-t", filter="maintenance"}'
        values: '1x48'
      # db-w: oracle_tablespace succeeds with no rows — query-exporter then
      # leaves query_timestamp alone, but queries_total{status="success"}
      # counts the run → not stalled.
      - series: 'query_timestamp{tenant="db-w", instance="qe-db-w:9560", job="tenant-exporters", query="oracle_liveness", database="oracle"}'
        values: '0+15x48'
      - series: 'query_interval{tenant="db-w", instance="qe-db-w:9560", job="tenant-exporters", query="oracle_tablespace"}'
        values: '60x48'
      - series: 'queries_total{tenant="db-w", instance="qe-db-w:9560", job="tenant-exporters", query="oracle_tablespace", database="oracle", status="success"}'
        values: '1+0x3 2+0x3 3+0x3 4+0x3 5+0x3 6+0x3 7+0x3 8+0x3 9+0x3 10+0x3 11+0x3 12+0x3'
    alert_rule_test:
      - eval_time: 4m45s
        alertname: OracleQueryStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: OracleQueryStalled
        exp_alerts:
          - exp_labels:
              maintenance: mute
              severity: warning
              tenant: db-r
              instance: qe-db-r:9560
              query: oracle_wait_time
            exp_annotations:
              summary: "Oracle query oracle_wait_time stopped on qe-db-r:9560"
              summary_zh: "qe-db-r:9560 上的 Oracle 查詢 oracle_wait_time 已停止"
              platform_summary: "[] db-r: query-exporter query oracle_wait_time stopped while the database answers — the alerts on its metrics are silent"
              platform_summary_zh: "[] db-r：資料庫有回應，但 query-exporter 的查詢 oracle_wait_time 已停止 — 讀它指標的告警不會響"
              description: "query-exporter stopped running oracle_wait_time (or it never succeeded). When a result does not fit the declared metrics it drops the query for good; the cause is in its log at the default level (\"query failed\") and in queries_total{status=\"error\"}. Fix the SQL in rule-packs/exporters/oracle.yaml, then restart the exporter."
              description_zh: "query-exporter 不再執行 oracle_wait_time（或從未成功）。查詢結果與宣告的指標不符時，它會永久移除該查詢；原因記在預設等級的日誌（\"query failed\"）與 queries_total{status=\"error\"}。修正 rule-packs/exporters/oracle.yaml 的 SQL 後重啟 exporter。"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 10m30s
        alertname: OracleQueryStalled
        exp_alerts:
          - exp_labels:
              maintenance: mute
              severity: warning
              tenant: db-r
              instance: qe-db-r:9560
              query: oracle_wait_time
            exp_annotations:
              summary: "Oracle query oracle_wait_time stopped on qe-db-r:9560"
              summary_zh: "qe-db-r:9560 上的 Oracle 查詢 oracle_wait_time 已停止"
              platform_summary: "[] db-r: query-exporter query oracle_wait_time stopped while the database answers — the alerts on its metrics are silent"
              platform_summary_zh: "[] db-r：資料庫有回應，但 query-exporter 的查詢 oracle_wait_time 已停止 — 讀它指標的告警不會響"
              description: "query-exporter stopped running oracle_wait_time (or it never succeeded). When a result does not fit the declared metrics it drops the query for good; the cause is in its log at the default level (\"query failed\") and in queries_total{status=\"error\"}. Fix the SQL in rule-packs/exporters/oracle.yaml, then restart the exporter."
              description_zh: "query-exporter 不再執行 oracle_wait_time（或從未成功）。查詢結果與宣告的指標不符時，它會永久移除該查詢；原因記在預設等級的日誌（\"query failed\"）與 queries_total{status=\"error\"}。修正 rule-packs/exporters/oracle.yaml 的 SQL 後重啟 exporter。"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 11m
        alertname: OracleQueryStalled
        exp_alerts:
          - exp_labels:
              maintenance: mute
              severity: warning
              tenant: db-q
              instance: qe-db-q:9560
              query: oracle_sessions
            exp_annotations:
              summary: "Oracle query oracle_sessions stopped on qe-db-q:9560"
              summary_zh: "qe-db-q:9560 上的 Oracle 查詢 oracle_sessions 已停止"
              platform_summary: "[] db-q: query-exporter query oracle_sessions stopped while the database answers — the alerts on its metrics are silent"
              platform_summary_zh: "[] db-q：資料庫有回應，但 query-exporter 的查詢 oracle_sessions 已停止 — 讀它指標的告警不會響"
              description: "query-exporter stopped running oracle_sessions (or it never succeeded). When a result does not fit the declared metrics it drops the query for good; the cause is in its log at the default level (\"query failed\") and in queries_total{status=\"error\"}. Fix the SQL in rule-packs/exporters/oracle.yaml, then restart the exporter."
              description_zh: "query-exporter 不再執行 oracle_sessions（或從未成功）。查詢結果與宣告的指標不符時，它會永久移除該查詢；原因記在預設等級的日誌（\"query failed\"）與 queries_total{status=\"error\"}。修正 rule-packs/exporters/oracle.yaml 的 SQL 後重啟 exporter。"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              maintenance: mute
              severity: warning
              tenant: db-r
              instance: qe-db-r:9560
              query: oracle_wait_time
            exp_annotations:
              summary: "Oracle query oracle_wait_time stopped on qe-db-r:9560"
              summary_zh: "qe-db-r:9560 上的 Oracle 查詢 oracle_wait_time 已停止"
              platform_summary: "[] db-r: query-exporter query oracle_wait_time stopped while the database answers — the alerts on its metrics are silent"
              platform_summary_zh: "[] db-r：資料庫有回應，但 query-exporter 的查詢 oracle_wait_time 已停止 — 讀它指標的告警不會響"
              description: "query-exporter stopped running oracle_wait_time (or it never succeeded). When a result does not fit the declared metrics it drops the query for good; the cause is in its log at the default level (\"query failed\") and in queries_total{status=\"error\"}. Fix the SQL in rule-packs/exporters/oracle.yaml, then restart the exporter."
              description_zh: "query-exporter 不再執行 oracle_wait_time（或從未成功）。查詢結果與宣告的指標不符時，它會永久移除該查詢；原因記在預設等級的日誌（\"query failed\"）與 queries_total{status=\"error\"}。修正 rule-packs/exporters/oracle.yaml 的 SQL 後重啟 exporter。"
              runbook_url: ""
