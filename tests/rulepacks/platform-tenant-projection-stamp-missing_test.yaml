# promtool behavioural test for TenantProjectionStampMissing (ADR-021
# §日誌進入端的契約 — audit rows with a verified account_id that reached only 0:0).
# Run: promtool test rules tests/rulepacks/platform-tenant-projection-stamp-missing_test.yaml
#
# The input series model what helm/vector's prometheus_exporter really serves
# for a log_to_metric counter (measured on Vector 0.61.0): the series appears
# at the first miss already at >= 1, carries no earlier sample, and DISAPPEARS
# 60-120s after its last increment (flush_period_secs default 60); the next
# miss re-creates it at 1. So most series below are short-lived — the shape
# `increase()`/`rate()` cannot see (testing-playbook §PromQL rule-test traps).
# The scrape labels (pod / instance / job) are the real per-pod target shape.
#
# Validates:
#   1) ONE miss (a two-sample series) fires at once, with the description
#      rendered, and keeps firing for the 1h window.
#   2) It clears once that sample has left the 1h window.
#   3) Two lives of one pod's series (vanished, re-created at 1) and a second
#      pod are summed per reason into ONE alert; the two reasons are separate
#      alerts.
#   4) No series at all (a healthy pipeline: Vector up, nothing missed) → no
#      alert.
rule_files:
  - ../../rule-packs/rule-pack-platform.yaml

evaluation_interval: 1m

tests:
  # 1 + 2) A single miss at 5m on one pod; the exporter served it twice
  # (5m, 6m), then expired it. The last sample is at 6m, so the 1h window
  # (t-1h, t] still holds it at 65m and no longer at 66m.
  - interval: 1m
    name: single-short-lived-miss-fires-for-the-window-then-clears
    input_series:
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '_x5 1 1 _x80'
      - series: 'vector_uptime_seconds{pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0+60x86'
    alert_rule_test:
      - eval_time: 4m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              severity: warning
              alert_source: platform
            exp_annotations: &one_not_projected
              summary: "Tenant audit rows with a verified account_id reached only the platform 0:0 store (not_projected)"
              description: |
                In the last hour at least 1 federation
                audit row(s) carrying a valid `account_id` (the verified claim of
                a tenant's logs token) reached the platform 0:0 store but no
                tenant partition (reason=not_projected). The tenant holds
                an AccountID, so it should see these rows and does not.
                not_projected: the tenant_id is blank or missing from helm/vector
                `tenantProjections` — usually a tenant issued a logs token
                before its projection was added; add it (copy the AccountID
                from `_account_registry.yaml`) and upgrade the chart.
                origin_rejected: demux reclassified the row to suspicious_audit
                because its pod_owner fails `audit.gatewayPodOwnerPrefix` —
                either a forged row from a gateway-labelled pod, or a prefix
                that no longer matches the real gateway (which empties every
                tenant partition). Find the rows in 0:0 with
                `log_type:federation_audit OR log_type:suspicious_audit` and a
                non-empty account_id, grouped by tenant_id / pod_name. Nothing
                is cut off automatically (ADR-021 §日誌進入端的契約). See
                platform-log-aggregation-runbook §8.7.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md"
      - eval_time: 40m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              severity: warning
              alert_source: platform
            exp_annotations: *one_not_projected
      - eval_time: 65m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              severity: warning
              alert_source: platform
            exp_annotations: *one_not_projected
      - eval_time: 66m
        alertname: TenantProjectionStampMissing
        exp_alerts: []

  # 3) vector-a: a life counting to 3 (2m-4m), expired, then a new life at 1
  #    (10m-11m). vector-b: a life counting to 2 (8m-9m). Both not_projected:
  #    per pod the max over the window is 3 and 2, summed to 5 (a lower bound
  #    — the two lives of vector-a are not added). vector-c: origin_rejected,
  #    a separate alert with its own value.
  - interval: 1m
    name: lives-and-pods-sum-per-reason-reasons-stay-separate
    input_series:
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '_x2 1 2 3 _x5 1 1 _x10'
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-b", instance="10.0.0.2:9598", job="vector-metrics"}'
        values: '_x8 1 2 _x12'
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="origin_rejected", pod="vector-c", instance="10.0.0.3:9598", job="vector-metrics"}'
        values: '_x9 4 _x12'
    alert_rule_test:
      - eval_time: 15m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              severity: warning
              alert_source: platform
            exp_annotations:
              summary: "Tenant audit rows with a verified account_id reached only the platform 0:0 store (not_projected)"
              description: |
                In the last hour at least 5 federation
                audit row(s) carrying a valid `account_id` (the verified claim of
                a tenant's logs token) reached the platform 0:0 store but no
                tenant partition (reason=not_projected). The tenant holds
                an AccountID, so it should see these rows and does not.
                not_projected: the tenant_id is blank or missing from helm/vector
                `tenantProjections` — usually a tenant issued a logs token
                before its projection was added; add it (copy the AccountID
                from `_account_registry.yaml`) and upgrade the chart.
                origin_rejected: demux reclassified the row to suspicious_audit
                because its pod_owner fails `audit.gatewayPodOwnerPrefix` —
                either a forged row from a gateway-labelled pod, or a prefix
                that no longer matches the real gateway (which empties every
                tenant partition). Find the rows in 0:0 with
                `log_type:federation_audit OR log_type:suspicious_audit` and a
                non-empty account_id, grouped by tenant_id / pod_name. Nothing
                is cut off automatically (ADR-021 §日誌進入端的契約). See
                platform-log-aggregation-runbook §8.7.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md"
          - exp_labels:
              reason: origin_rejected
              severity: warning
              alert_source: platform
            exp_annotations:
              summary: "Tenant audit rows with a verified account_id reached only the platform 0:0 store (origin_rejected)"
              description: |
                In the last hour at least 4 federation
                audit row(s) carrying a valid `account_id` (the verified claim of
                a tenant's logs token) reached the platform 0:0 store but no
                tenant partition (reason=origin_rejected). The tenant holds
                an AccountID, so it should see these rows and does not.
                not_projected: the tenant_id is blank or missing from helm/vector
                `tenantProjections` — usually a tenant issued a logs token
                before its projection was added; add it (copy the AccountID
                from `_account_registry.yaml`) and upgrade the chart.
                origin_rejected: demux reclassified the row to suspicious_audit
                because its pod_owner fails `audit.gatewayPodOwnerPrefix` —
                either a forged row from a gateway-labelled pod, or a prefix
                that no longer matches the real gateway (which empties every
                tenant partition). Find the rows in 0:0 with
                `log_type:federation_audit OR log_type:suspicious_audit` and a
                non-empty account_id, grouped by tenant_id / pod_name. Nothing
                is cut off automatically (ADR-021 §日誌進入端的契約). See
                platform-log-aggregation-runbook §8.7.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md"

  # 4) Healthy pipeline: Vector is up and scraped, the counter never existed.
  - interval: 1m
    name: no-miss-series-no-alert
    input_series:
      - series: 'vector_uptime_seconds{pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0+60x90'
      - series: 'vector_component_discarded_events_total{component_id="tenant_stamp_check", intentional="true", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0+100x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 90m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
