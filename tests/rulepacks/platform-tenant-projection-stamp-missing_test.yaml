                token is forwarded holds an AccountID, so it should see these rows.
                not_projected: federation_audit rows whose tenant_id is blank or
                missing from helm/vector `tenantProjections` — usually a tenant
                issued a logs token before its projection was added; add it
                (copy the AccountID from `_account_registry.yaml`) and upgrade
                the chart. If the tenant was just offboarded, its token was not
                revoked (or the revocation has not reached the gateway yet):
                revoke it first.
                origin_rejected: suspicious_audit rows — demux reclassified them
                because their pod_owner fails `audit.gatewayPodOwnerPrefix`:
                either forged rows from a gateway-labelled pod, or a prefix
                that no longer matches the real gateway (which empties every
                tenant partition). Find the rows in 0:0 with
                `log_type:federation_audit OR log_type:suspicious_audit`, a
                non-empty account_id and upstream, grouped by tenant_id /
                pod_name. Nothing is cut off automatically (ADR-021
                §日誌進入端的契約). See platform-log-aggregation-runbook §8.7.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md"
      - eval_time: 66m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 100m
        alertname: TenantProjectionStampMissing
        exp_alerts: []

  # 7) Healthy pipeline: both reasons held at 0 for hours, nothing missed.
  - interval: 1m
    name: zero-series-no-alert
    input_series:
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0x180'
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="origin_rejected", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 90m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 180m
        alertname: TenantProjectionStampMissing
        exp_alerts: []

  # 8) A rollout replaces vector-a with vector-b at 70m. vector-b resumed
  #    from the node's checkpoint and counted 2 replayed misses before its
  #    first scrape, so its first sample is already 2 and increase() sees no
  #    step. Prometheus held Vector data an hour earlier, so the new-series
  #    arm fires with the whole value for the hour the series is new.
  - interval: 1m
    name: new-series-born-non-zero-fires
    input_series:
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0x70'
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-b", instance="10.0.0.2:9598", job="vector-metrics"}'
        values: '_x70 2x70'
      - series: 'vector_uptime_seconds{pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0+60x70'
      - series: 'vector_uptime_seconds{pod="vector-b", instance="10.0.0.2:9598", job="vector-metrics"}'
        values: '_x70 0+60x70'
    alert_rule_test:
      - eval_time: 69m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 75m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              job: vector-metrics
              severity: warning
              alert_source: platform
            exp_annotations: &born_non_zero
              summary: "Tenant audit rows with a verified account_id reached only the platform 0:0 store (not_projected)"
              description: |
                Within the last hour Vector counted about 2
                gateway audit rows carrying a valid `account_id` (the verified
                claim of a tenant's logs token) for a request that reached the
                log store, which ended up in the platform 0:0 store but in no
                tenant partition (reason=not_projected). A tenant whose
                token is forwarded holds an AccountID, so it should see these rows.
                not_projected: federation_audit rows whose tenant_id is blank or
                missing from helm/vector `tenantProjections` — usually a tenant
                issued a logs token before its projection was added; add it
                (copy the AccountID from `_account_registry.yaml`) and upgrade
                the chart. If the tenant was just offboarded, its token was not
                revoked (or the revocation has not reached the gateway yet):
                revoke it first.
                origin_rejected: suspicious_audit rows — demux reclassified them
                because their pod_owner fails `audit.gatewayPodOwnerPrefix`:
                either forged rows from a gateway-labelled pod, or a prefix
                that no longer matches the real gateway (which empties every
                tenant partition). Find the rows in 0:0 with
                `log_type:federation_audit OR log_type:suspicious_audit`, a
                non-empty account_id and upstream, grouped by tenant_id /
                pod_name. Nothing is cut off automatically (ADR-021
                §日誌進入端的契約). See platform-log-aggregation-runbook §8.7.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md"
      - eval_time: 125m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              job: vector-metrics
              severity: warning
              alert_source: platform
            exp_annotations: *born_non_zero
      - eval_time: 135m
        alertname: TenantProjectionStampMissing
        exp_alerts: []

  # 9) Prometheus starts collecting at 0m (empty TSDB) while vector-a's
  #    counter already reads 5 from before. Every series looks new, but
  #    there was no Vector data an hour earlier, so the new-series arm is
  #    muted and nothing fires; after the first hour the series is not new.
  - interval: 1m
    name: collection-start-with-non-zero-counter-does-not-fire
    input_series:
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '5x90'
      - series: 'vector_uptime_seconds{pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0+60x90'
    alert_rule_test:
      - eval_time: 10m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 59m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 65m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 90m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
