# promtool behavioural test for TenantProjectionStampMissing (ADR-021
# §日誌進入端的契約 — audit rows with a verified account_id that reached only 0:0).
# Run: promtool test rules tests/rulepacks/platform-tenant-projection-stamp-missing_test.yaml
#
# The input series model what helm/vector's prometheus_exporter serves: the
# chart pre-initialises the counter to 0 for every reason (static_metrics
# source tenant_stamp_zero), so each series exists from Vector's start at 0,
# a miss is a step up, and the series stays exported between misses. A pod
# restart either restarts the counter at 0 under the same labels (container
# restart) or starts a new series at 0 (new pod). The scrape labels
# (pod / instance / job) are the real per-pod target shape.
#
# The rendered value is asserted in every firing case, so a rate() in place
# of increase() (same firing times, per-second value) is caught too.
#
# Validates:
#   1) ONE miss (0 -> 1) fires at once with the description rendered, holds
#      while the last 0 sample is inside the 1h window, and clears after.
#   2) The same with a 5m scrape interval.
#   3) Two pods and two increments are summed per reason into ONE alert; the
#      two reasons are separate alerts; pod / instance are aggregated away and
#      the job is kept.
#   4) Two Vector installs (different namespace label) stay two alerts — the
#      aggregation drops only instance / pod / host (`sum without`, like the
#      sibling Vector alerts), not the topology.
#   5) A steady stream: the value is the last hour's count, not the counter.
#   6) A restart is not a miss: a container restart (counter back to 0, same
#      labels) and a new pod (new series at 0) do not fire, and a restart
#      after a miss does not hold the alert past the miss's hour.
#   7) A healthy pipeline: series at 0 for hours → no alert.
#   8) A new series whose first sample is already > 0 (misses replayed from
#      the node's checkpoint before the first scrape) fires.
#   9) A collection that starts with counters already > 0 does not fire.
#
# Boundary instants are asserted one or more scrapes away from the window
# edge: MetricsQL's increase() bases the window on the last sample before it
# and does not extrapolate, so it holds one scrape longer than PromQL and
# reads exact values where PromQL extrapolates. test_vm_alert_parity.py runs
# this file on both engines.
rule_files:
  - ../../rule-packs/rule-pack-platform.yaml

evaluation_interval: 1m

tests:

  # 1) A single miss at 5m on one pod, scraped every 1m. The last 0 sample is
  #    at 4m: PromQL's left-open range holds it up to 63m; MetricsQL bases the
  #    window on the last sample before it and holds one scrape longer, so the
  #    clear is asserted at 66m, where both engines agree.
  - interval: 1m
    name: single-miss-fires-for-the-window-then-clears
    input_series:
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0x4 1x90'
    alert_rule_test:
      - eval_time: 4m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              job: vector-metrics
              severity: warning
              alert_source: platform
            exp_annotations: &one_not_projected
              summary: "Tenant audit rows with a verified account_id reached only the platform 0:0 store (not_projected)"
              description: |
                Within the last hour Vector counted about 1
                gateway audit rows carrying a valid `account_id` (the verified
                claim of a tenant's logs token) for a request that reached the
                log store, which ended up in the platform 0:0 store but in no
                tenant partition (reason=not_projected). A tenant whose
                token is forwarded holds an AccountID, so it should see these rows.
                not_projected: federation_audit rows whose tenant_id is blank or
                missing from helm/vector `tenantProjections` — usually a tenant
                issued a logs token before its projection was added; add it
                (copy the AccountID from `_account_registry.yaml`) and upgrade
                the chart. If the tenant was just offboarded, its token was not
                revoked (or the revocation has not reached the gateway yet):
                revoke it first.
                origin_rejected: suspicious_audit rows — demux reclassified them
                because their pod_owner fails `audit.gatewayPodOwnerPrefix`:
                either forged rows from a gateway-labelled pod, or a prefix
                that no longer matches the real gateway (which empties every
                tenant partition). Find the rows in 0:0 with
                `log_type:federation_audit OR log_type:suspicious_audit`, a
                non-empty account_id and upstream, grouped by tenant_id /
                pod_name. Nothing is cut off automatically (ADR-021
                §日誌進入端的契約). See platform-log-aggregation-runbook §8.7.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md"
      - eval_time: 40m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              job: vector-metrics
              severity: warning
              alert_source: platform
            exp_annotations: *one_not_projected
      - eval_time: 63m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              job: vector-metrics
              severity: warning
              alert_source: platform
            exp_annotations: *one_not_projected
      - eval_time: 66m
        alertname: TenantProjectionStampMissing
        exp_alerts: []

  # 2) The same with a 5m scrape interval: samples at 0m/5m/10m read 0, from
  #    15m on 1. Fires at the first scrape that sees the step and holds about
  #    1h minus one scrape interval; the clear is asserted at 80m, past both
  #    engines' boundary (PromQL 70m, MetricsQL one scrape later).
  - interval: 5m
    name: five-minute-scrape-sees-the-miss
    input_series:
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0x2 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: TenantProjectionStampMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              job: vector-metrics
              severity: warning
              alert_source: platform
            exp_annotations: &slow_scrape_15m
              summary: "Tenant audit rows with a verified account_id reached only the platform 0:0 store (not_projected)"
              description: |
                Within the last hour Vector counted about 1
                gateway audit rows carrying a valid `account_id` (the verified
                claim of a tenant's logs token) for a request that reached the
                log store, which ended up in the platform 0:0 store but in no
                tenant partition (reason=not_projected). A tenant whose
                token is forwarded holds an AccountID, so it should see these rows.
                not_projected: federation_audit rows whose tenant_id is blank or
                missing from helm/vector `tenantProjections` — usually a tenant
                issued a logs token before its projection was added; add it
                (copy the AccountID from `_account_registry.yaml`) and upgrade
                the chart. If the tenant was just offboarded, its token was not
                revoked (or the revocation has not reached the gateway yet):
                revoke it first.
                origin_rejected: suspicious_audit rows — demux reclassified them
                because their pod_owner fails `audit.gatewayPodOwnerPrefix`:
                either forged rows from a gateway-labelled pod, or a prefix
                that no longer matches the real gateway (which empties every
                tenant partition). Find the rows in 0:0 with
                `log_type:federation_audit OR log_type:suspicious_audit`, a
                non-empty account_id and upstream, grouped by tenant_id /
                pod_name. Nothing is cut off automatically (ADR-021
                §日誌進入端的契約). See platform-log-aggregation-runbook §8.7.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md"
      - eval_time: 60m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              job: vector-metrics
              severity: warning
              alert_source: platform
            exp_annotations: *slow_scrape_15m
      - eval_time: 80m
        alertname: TenantProjectionStampMissing
        exp_alerts: []

  # 3) vector-a: two misses (0 -> 1 at 2m, -> 3 at 10m). vector-b: one miss at
  #    8m. Both not_projected, summed to 4. vector-c: origin_rejected, a
  #    separate alert with its own value.
  - interval: 1m
    name: pods-sum-per-reason-reasons-stay-separate
    input_series:
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '0 0 1x7 3x10'
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="not_projected", pod="vector-b", instance="10.0.0.2:9598", job="vector-metrics"}'
        values: '0x7 1x12'
      - series: 'vector_tenant_projection_stamp_missed_events_total{reason="origin_rejected", pod="vector-c", instance="10.0.0.3:9598", job="vector-metrics"}'
        values: '0x8 4x10'
    alert_rule_test:
      - eval_time: 15m
        alertname: TenantProjectionStampMissing
        exp_alerts:
          - exp_labels:
              reason: not_projected
              job: vector-metrics
              severity: warning
              alert_source: platform
            exp_annotations:
              summary: "Tenant audit rows with a verified account_id reached only the platform 0:0 store (not_projected)"
              description: |
                Within the last hour Vector counted about 4
                gateway audit rows carrying a valid `account_id` (the verified
                claim of a tenant's logs token) for a request that reached the
                log store, which ended up in the platform 0:0 store but in no
                tenant partition (reason=not_projected). A tenant whose
                token is forwarded holds an AccountID, so it should see these rows.
                not_projected: federation_audit rows whose tenant_id is blank or
                missing from helm/vector `tenantProjections` — usually a tenant
                issued a logs token before its projection was added; add it
                (copy the AccountID from `_account_registry.yaml`) and upgrade
                the chart. If the tenant was just offboarded, its token was not
                revoked (or the revocation has not reached the gateway yet):
                revoke it first.
                origin_rejected: suspicious_audit rows — demux reclassified them
                because their pod_owner fails `audit.gatewayPodOwnerPrefix`:
                either forged rows from a gateway-labelled pod, or a prefix
                that no longer matches the real gateway (which empties every
                tenant partition). Find the rows in 0:0 with
                `log_type:federation_audit OR log_type:suspicious_audit`, a
                non-empty account_id and upstream, grouped by tenant_id /
                pod_name. Nothing is cut off automatically (ADR-021
                §日誌進入端的契約). See platform-log-aggregation-runbook §8.7.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md"
          - exp_labels:
              reason: origin_rejected
              job: vector-metrics
              severity: warning
              alert_source: platform
            exp_annotations:
              summary: "Tenant audit rows with a verified account_id reached only the platform 0:0 store (origin_rejected)"
              description: |
                Within the last hour Vector counted about 4
                gateway audit rows carrying a valid `account_id` (the verified
                claim of a tenant's logs token) for a request that reached the
                log store, which ended up in the platform 0:0 store but in no
                tenant partition (reason=origin_rejected). A tenant whose
                token is forwarded holds an AccountID, so it should see these rows.
                not_projected: federation_audit rows whose tenant_id is blank or
                missing from helm/vector `tenantProjections` — usually a tenant
                issued a logs token before its projection was added; add it
                (copy the AccountID from `_account_registry.yaml`) and upgrade
                the chart. If the tenant was just offboarded, its token was not
                revoked (or the revocation has not reached the gateway yet):
