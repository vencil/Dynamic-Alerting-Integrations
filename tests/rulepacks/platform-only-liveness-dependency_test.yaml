# promtool unit test — 只載平台 pack、沒載 liveness pack（#3771 審查）。
# Run: promtool test rules tests/rulepacks/platform-only-liveness-dependency_test.yaml
#
# MassExporterOutage 讀 liveness pack 錄的 tenant:exporter_present，並 and on() 哨兵
# tenant:exporter_presence_loaded。只載平台 pack 時：
#   L1  6 個宣告 mariadb 的租戶 exporter 全健康 → Mass 不響（拿掉哨兵守門就常駐 critical）；
#       ExporterPresenceRulesNotLoaded 在 10m 響（warning），9m 不響
#   L2  沒有任何租戶宣告 db_type（tenant_expected_exporter 缺席）→ 哨兵告警不響
# 「載了告警、存在判定缺席」的情形由 tests/rulepacks/test_exporter_presence.py 以
# 拿掉生成區塊的 liveness pack 副本跑（同一個 group，無法只用 rule_files 組出來）。
# tenant id 用 t-* placeholder（dev-rule：fixture 不寫死真實租戶名）。
rule_files:
  - ../../rule-packs/rule-pack-platform.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: L1-platform-only-mass-silent-sentinel-alert-fires
    input_series:
      - series: 'tenant_expected_exporter{tenant="t-0", db_type="mariadb", instance="te:8080", pod="p"}'
        values: '1x20'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-0", instance="10.5.0.0:9104"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-0", instance="10.5.0.0:9104"}'
        values: '1x20'
      - series: 'tenant_expected_exporter{tenant="t-1", db_type="mariadb", instance="te:8080", pod="p"}'
        values: '1x20'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-1", instance="10.5.0.1:9104"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-1", instance="10.5.0.1:9104"}'
        values: '1x20'
      - series: 'tenant_expected_exporter{tenant="t-2", db_type="mariadb", instance="te:8080", pod="p"}'
        values: '1x20'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-2", instance="10.5.0.2:9104"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-2", instance="10.5.0.2:9104"}'
        values: '1x20'
      - series: 'tenant_expected_exporter{tenant="t-3", db_type="mariadb", instance="te:8080", pod="p"}'
        values: '1x20'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-3", instance="10.5.0.3:9104"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-3", instance="10.5.0.3:9104"}'
        values: '1x20'
      - series: 'tenant_expected_exporter{tenant="t-4", db_type="mariadb", instance="te:8080", pod="p"}'
        values: '1x20'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-4", instance="10.5.0.4:9104"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-4", instance="10.5.0.4:9104"}'
        values: '1x20'
      - series: 'tenant_expected_exporter{tenant="t-5", db_type="mariadb", instance="te:8080", pod="p"}'
        values: '1x20'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-5", instance="10.5.0.5:9104"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-5", instance="10.5.0.5:9104"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MassExporterOutage
        exp_alerts: []
      - eval_time: 9m
        alertname: ExporterPresenceRulesNotLoaded
        exp_alerts: []
      - eval_time: 10m
        alertname: ExporterPresenceRulesNotLoaded
        exp_alerts:
          - exp_labels:
              severity: warning
              alert_source: platform
            exp_annotations:
              summary: "Exporter presence rules are not loaded — per-tenant exporter liveness is off"
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/integration/byo-prometheus-integration.md"
              description: |
                Tenants declare _metadata.db_type (tenant_expected_exporter is
                present) but tenant:exporter_presence_loaded, recorded by
                rule-pack-liveness.yaml, is absent for 10m. TenantExporterAbsent and
                MassExporterOutage are guarded on it and stay silent, so no
                tenant's exporter outage pages. Load the whole liveness pack
                (its one rule file / ConfigMap key holds the presence rules and the
                alerts together) next to this platform pack.

  - interval: 1m
    name: L2-nobody-declared-sentinel-alert-silent
    input_series:
      - series: 'up{job="tenant-exporters", tenant="t-0", instance="10.5.0.0:9104"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ExporterPresenceRulesNotLoaded
        exp_alerts: []
