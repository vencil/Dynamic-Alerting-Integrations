# promtool unit test — 單一 tenant-exporters target 停機（#3737）。
# Run: promtool test rules tests/rulepacks/rule-pack-liveness-replica_test.yaml
#
# 對象：TenantExporterReplicaDown（rule-pack-liveness.yaml Rule B）與它和
# TenantExporterAbsent（Rule A）的互斥：
#   R1  兩副本一掛：9m 不響、剛滿 10m 響、只點名掛掉那個；Rule A 不響
#   R2  兩副本都活                     → 都不響
#   R3  單副本租戶全掛                 → 只有 Rule A
#   R4  多副本全掛                     → 只有 Rule A
#   R5  先一掛後全掛                   → Rule B 交棒給 Rule A
#   R6  滾動重啟短暫 up=0              → 不響（for:10m）
#   R7  租戶隔離                       → 不借別租戶的 up==1（攔 on(tenant)→on()）
#   R8  維護中                         → 只靜音該租戶（maintenance: mute）
#   R9  同一個 db_type 兩個 Service、一個全掛 → Rule B 響、Rule A 不響（#3771 已知殘餘缺口；
#       不同 db_type 的情境在 rule-pack-liveness-db-type_test.yaml）
#   R10 series 沒有 pod／service label  → 文案退回泛稱、不留空洞（攔拿掉 with）
#   R11 未宣告 db_type 的租戶            → Rule B 也不響（#3771 opt-in；攔拿掉 opt-in 子句）；
#       由 TenantExporterUndeclared 指名（見 rule-pack-liveness-db-type_test.yaml）
#   R12 同租戶只有別的 job 為 up=1       → Rule B 不響（攔拿掉右側 job filter）
#   R13 別的 job 的 target up=0          → Rule B 不響（攔拿掉左側 job filter）
# input_series 帶真實 scrape label（job/tenant/instance/pod/service）；tenant id 用
# t1/t2（dev-rule：fixture 不寫死真實租戶名）。
rule_files:
  - ../../rule-packs/rule-pack-liveness.yaml

evaluation_interval: 1m

tests:
  # ── R1 必響：兩副本一掛。9m 不響、剛滿 10m 那一點就響、只點名掛掉的那個；Rule A 不響
  - interval: 1m
    name: R1-one-of-two-replicas-down-fires-at-exactly-10m
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t1", db_type="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x20'
      # exporter-presence series of the target above (#3771): present while it answers.
      - series: 'mysql_up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '0x20'
    alert_rule_test:
      # for:10m：0m 起 pending，9m 還沒滿。
      - eval_time: 9m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      # 剛滿 10m：firing。for 改長（例如 12m）這一點就轉紅。
      - eval_time: 10m
        alertname: TenantExporterReplicaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              job: tenant-exporters
              tenant: t1
              instance: "10.1.0.2:9104"
              pod: mdb-1
              service: mdb
            exp_annotations:
              summary: "Exporter target 10.1.0.2:9104 down for tenant t1 (another tenant-exporters target of the tenant is up)"
              summary_zh: "租戶 t1 的 exporter target 10.1.0.2:9104 停機（同租戶仍有其他 tenant-exporters target 為 up）"
              description: "Target 10.1.0.2:9104 (pod mdb-1) of tenant t1 has read up=0 for 10m while at least one other up{job=\"tenant-exporters\"} target of the same tenant reads up=1. That target may belong to a different Service: if Service mdb has no other replica, its metrics are no longer scraped at all. When it was the only exporter of one of the tenant's declared db_types, TenantExporterAbsent (critical) fires for that db_type as well; when another Service of the same db_type is still up, this warning is the only signal. If every target of the tenant goes down, this alert resolves and TenantExporterAbsent takes over. Only tenants that declare db_type in _metadata get this alert; an undeclared tenant gets TenantExporterUndeclared instead."
              description_zh: "租戶 t1 的 target 10.1.0.2:9104（pod mdb-1）已 10 分鐘 up=0，同時同租戶仍有至少一個 up{job=\"tenant-exporters\"} target 為 up=1。那個 target 可能屬於別的 Service：若 Service mdb 沒有其他副本，它的指標已完全沒被抓取。它若是租戶宣告的某個 db_type 唯一的 exporter，TenantExporterAbsent（critical）也會對那個 db_type 響；同一個 db_type 若還有別的 Service 是 up，本告警就是唯一的訊號。若租戶所有 target 都掛，本告警會解除，改由 TenantExporterAbsent 接手。只有在 _metadata 宣告了 db_type 的租戶才會收到本告警；沒宣告的租戶改收 TenantExporterUndeclared。"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 10m
        alertname: TenantExporterAbsent
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantExporterReplicaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              job: tenant-exporters
              tenant: t1
              instance: "10.1.0.2:9104"
              pod: mdb-1
              service: mdb
            exp_annotations:
              summary: "Exporter target 10.1.0.2:9104 down for tenant t1 (another tenant-exporters target of the tenant is up)"
              summary_zh: "租戶 t1 的 exporter target 10.1.0.2:9104 停機（同租戶仍有其他 tenant-exporters target 為 up）"
              description: "Target 10.1.0.2:9104 (pod mdb-1) of tenant t1 has read up=0 for 10m while at least one other up{job=\"tenant-exporters\"} target of the same tenant reads up=1. That target may belong to a different Service: if Service mdb has no other replica, its metrics are no longer scraped at all. When it was the only exporter of one of the tenant's declared db_types, TenantExporterAbsent (critical) fires for that db_type as well; when another Service of the same db_type is still up, this warning is the only signal. If every target of the tenant goes down, this alert resolves and TenantExporterAbsent takes over. Only tenants that declare db_type in _metadata get this alert; an undeclared tenant gets TenantExporterUndeclared instead."
              description_zh: "租戶 t1 的 target 10.1.0.2:9104（pod mdb-1）已 10 分鐘 up=0，同時同租戶仍有至少一個 up{job=\"tenant-exporters\"} target 為 up=1。那個 target 可能屬於別的 Service：若 Service mdb 沒有其他副本，它的指標已完全沒被抓取。它若是租戶宣告的某個 db_type 唯一的 exporter，TenantExporterAbsent（critical）也會對那個 db_type 響；同一個 db_type 若還有別的 Service 是 up，本告警就是唯一的訊號。若租戶所有 target 都掛，本告警會解除，改由 TenantExporterAbsent 接手。只有在 _metadata 宣告了 db_type 的租戶才會收到本告警；沒宣告的租戶改收 TenantExporterUndeclared。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── R2 不響：兩副本都活
  - interval: 1m
    name: R2-both-replicas-up-nothing-fires
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t1", db_type="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x20'
      # exporter-presence series of the target above (#3771): present while it answers.
      - series: 'mysql_up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '1x20'
      # exporter-presence series of the target above (#3771): present while it answers.
      - series: 'mysql_up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantExporterAbsent
        exp_alerts: []

  # ── R3 單副本租戶全掛：只有 Rule A 響
  - interval: 1m
    name: R3-single-replica-tenant-down-only-absent-fires
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t2", db_type="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t2", instance="10.2.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantExporterAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              maintenance: page
              job: threshold-exporter
              tenant: t2
              db_type: mariadb
            exp_annotations:
              summary: "Exporter absent for tenant t2 (mariadb)"
              summary_zh: "租戶 t2 (mariadb) 的 exporter 缺席"
              description: "No mariadb exporter of tenant t2 has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs mariadb, remove it from _metadata.db_type; if the tenant was de-provisioned, remove its conf.d _metadata too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t2 的 mariadb exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 mariadb，請從 _metadata.db_type 移除；若租戶已退租，請確認 conf.d _metadata 也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── R4 多副本全掛：只有 Rule A 響，Rule B 不疊響
  - interval: 1m
    name: R4-all-replicas-down-only-absent-fires
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t1", db_type="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '0x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantExporterAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              maintenance: page
              job: threshold-exporter
              tenant: t1
              db_type: mariadb
            exp_annotations:
              summary: "Exporter absent for tenant t1 (mariadb)"
              summary_zh: "租戶 t1 (mariadb) 的 exporter 缺席"
              description: "No mariadb exporter of tenant t1 has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs mariadb, remove it from _metadata.db_type; if the tenant was de-provisioned, remove its conf.d _metadata too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t1 的 mariadb exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 mariadb，請從 _metadata.db_type 移除；若租戶已退租，請確認 conf.d _metadata 也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── R5 交棒：mdb-1 0m 起掛、mdb-0 15m 起也掛 → 先 Rule B，後只剩 Rule A
  - interval: 1m
    name: R5-handover-replica-alert-to-absent
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t1", db_type="mariadb"}'
        values: '1x30'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x14 0x15'
      # exporter-presence series of the target above (#3771): present while it answers.
      - series: 'mysql_up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x14 stale stale stale stale stale stale stale stale stale stale stale stale stale stale stale stale'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: TenantExporterReplicaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              job: tenant-exporters
              tenant: t1
              instance: "10.1.0.2:9104"
              pod: mdb-1
              service: mdb
            exp_annotations:
              summary: "Exporter target 10.1.0.2:9104 down for tenant t1 (another tenant-exporters target of the tenant is up)"
              summary_zh: "租戶 t1 的 exporter target 10.1.0.2:9104 停機（同租戶仍有其他 tenant-exporters target 為 up）"
              description: "Target 10.1.0.2:9104 (pod mdb-1) of tenant t1 has read up=0 for 10m while at least one other up{job=\"tenant-exporters\"} target of the same tenant reads up=1. That target may belong to a different Service: if Service mdb has no other replica, its metrics are no longer scraped at all. When it was the only exporter of one of the tenant's declared db_types, TenantExporterAbsent (critical) fires for that db_type as well; when another Service of the same db_type is still up, this warning is the only signal. If every target of the tenant goes down, this alert resolves and TenantExporterAbsent takes over. Only tenants that declare db_type in _metadata get this alert; an undeclared tenant gets TenantExporterUndeclared instead."
              description_zh: "租戶 t1 的 target 10.1.0.2:9104（pod mdb-1）已 10 分鐘 up=0，同時同租戶仍有至少一個 up{job=\"tenant-exporters\"} target 為 up=1。那個 target 可能屬於別的 Service：若 Service mdb 沒有其他副本，它的指標已完全沒被抓取。它若是租戶宣告的某個 db_type 唯一的 exporter，TenantExporterAbsent（critical）也會對那個 db_type 響；同一個 db_type 若還有別的 Service 是 up，本告警就是唯一的訊號。若租戶所有 target 都掛，本告警會解除，改由 TenantExporterAbsent 接手。只有在 _metadata 宣告了 db_type 的租戶才會收到本告警；沒宣告的租戶改收 TenantExporterUndeclared。"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 12m
        alertname: TenantExporterAbsent
        exp_alerts: []
      # 20m：全掛已 5m → Rule A firing、Rule B 已解除。
      - eval_time: 20m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantExporterAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              maintenance: page
              job: threshold-exporter
              tenant: t1
              db_type: mariadb
            exp_annotations:
              summary: "Exporter absent for tenant t1 (mariadb)"
              summary_zh: "租戶 t1 (mariadb) 的 exporter 缺席"
              description: "No mariadb exporter of tenant t1 has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs mariadb, remove it from _metadata.db_type; if the tenant was de-provisioned, remove its conf.d _metadata too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t1 的 mariadb exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 mariadb，請從 _metadata.db_type 移除；若租戶已退租，請確認 conf.d _metadata 也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── R6 滾動重啟：一個副本 up=0 9 分鐘後回來 → for:10m 吸收，全程不響
  - interval: 1m
    name: R6-rolling-restart-absorbed-by-for
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t1", db_type="mariadb"}'
        values: '1x25'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x25'
      # exporter-presence series of the target above (#3771): present while it answers.
      - series: 'mysql_up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x25'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '1 0x8 1x16'
      # exporter-presence series of the target above (#3771): present while it answers.
      - series: 'mysql_up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '1 stale stale stale stale stale stale stale stale stale 1x16'
    alert_rule_test:
      - eval_time: 9m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 10m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantExporterAbsent
        exp_alerts: []

  # ── R7 租戶隔離：t1 唯一副本掛、t2 健康 → Rule B 不得借 t2 的 up==1（t1 歸 Rule A）
  - interval: 1m
    name: R7-tenant-isolation
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t1", db_type="mariadb"}'
        values: '1x20'
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t2", db_type="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '0x20'
      - series: 'up{job="tenant-exporters", tenant="t2", instance="10.2.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x20'
      # exporter-presence series of the target above (#3771): present while it answers.
      - series: 'mysql_up{job="tenant-exporters", tenant="t2", instance="10.2.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantExporterAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              maintenance: page
              job: threshold-exporter
              tenant: t1
              db_type: mariadb
            exp_annotations:
              summary: "Exporter absent for tenant t1 (mariadb)"
              summary_zh: "租戶 t1 (mariadb) 的 exporter 缺席"
              description: "No mariadb exporter of tenant t1 has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs mariadb, remove it from _metadata.db_type; if the tenant was de-provisioned, remove its conf.d _metadata too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t1 的 mariadb exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 mariadb，請從 _metadata.db_type 移除；若租戶已退租，請確認 conf.d _metadata 也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── R8 maintenance: mute：t1 維護中不響；同形狀的 t2 沒在維護照響
  - interval: 1m
    name: R8-maintenance-mutes-only-that-tenant
    input_series:
      # Rule B 是 opt-in（#3771）：兩個租戶都宣告 db_type。
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", tenant="t1", db_type="mariadb"}'
        values: '1x20'
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", tenant="t2", db_type="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '0x20'
      - series: 'up{job="tenant-exporters", tenant="t2", instance="10.2.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t2", instance="10.2.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '0x20'
      - series: 'user_state_filter{job="threshold-exporter", instance="10.0.0.9:8080", filter="maintenance", tenant="t1"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: TenantExporterReplicaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              job: tenant-exporters
              tenant: t2
              instance: "10.2.0.2:9104"
              pod: mdb-1
              service: mdb
            exp_annotations:
              summary: "Exporter target 10.2.0.2:9104 down for tenant t2 (another tenant-exporters target of the tenant is up)"
              summary_zh: "租戶 t2 的 exporter target 10.2.0.2:9104 停機（同租戶仍有其他 tenant-exporters target 為 up）"
              description: "Target 10.2.0.2:9104 (pod mdb-1) of tenant t2 has read up=0 for 10m while at least one other up{job=\"tenant-exporters\"} target of the same tenant reads up=1. That target may belong to a different Service: if Service mdb has no other replica, its metrics are no longer scraped at all. When it was the only exporter of one of the tenant's declared db_types, TenantExporterAbsent (critical) fires for that db_type as well; when another Service of the same db_type is still up, this warning is the only signal. If every target of the tenant goes down, this alert resolves and TenantExporterAbsent takes over. Only tenants that declare db_type in _metadata get this alert; an undeclared tenant gets TenantExporterUndeclared instead."
              description_zh: "租戶 t2 的 target 10.2.0.2:9104（pod mdb-1）已 10 分鐘 up=0，同時同租戶仍有至少一個 up{job=\"tenant-exporters\"} target 為 up=1。那個 target 可能屬於別的 Service：若 Service mdb 沒有其他副本，它的指標已完全沒被抓取。它若是租戶宣告的某個 db_type 唯一的 exporter，TenantExporterAbsent（critical）也會對那個 db_type 響；同一個 db_type 若還有別的 Service 是 up，本告警就是唯一的訊號。若租戶所有 target 都掛，本告警會解除，改由 TenantExporterAbsent 接手。只有在 _metadata 宣告了 db_type 的租戶才會收到本告警；沒宣告的租戶改收 TenantExporterUndeclared。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── R9 同一個 db_type 兩個 Service（mdb 與 mdb-analytics，皆 mariadb）：mdb 唯一副本掛
  #    → Rule B 響；Rule A 被同 db_type 另一個 Service 的 mysql_up 擋住（#3771 已知殘餘缺口，
  #    釘住現行行為。不同 db_type 時 Rule A 會響，見 rule-pack-liveness-db-type_test.yaml M1）
  - interval: 1m
    name: R9-multi-service-only-replica-of-one-service-down
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t1", db_type="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '0x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.5:9104", pod="mdb-analytics-0", service="mdb-analytics"}'
        values: '1x20'
      # exporter-presence series of the target above (#3771): present while it answers.
      - series: 'mysql_up{job="tenant-exporters", tenant="t1", instance="10.1.0.5:9104", pod="mdb-analytics-0", service="mdb-analytics"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: TenantExporterReplicaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              job: tenant-exporters
              tenant: t1
              instance: "10.1.0.1:9104"
              pod: mdb-0
              service: mdb
            exp_annotations:
              summary: "Exporter target 10.1.0.1:9104 down for tenant t1 (another tenant-exporters target of the tenant is up)"
              summary_zh: "租戶 t1 的 exporter target 10.1.0.1:9104 停機（同租戶仍有其他 tenant-exporters target 為 up）"
              description: "Target 10.1.0.1:9104 (pod mdb-0) of tenant t1 has read up=0 for 10m while at least one other up{job=\"tenant-exporters\"} target of the same tenant reads up=1. That target may belong to a different Service: if Service mdb has no other replica, its metrics are no longer scraped at all. When it was the only exporter of one of the tenant's declared db_types, TenantExporterAbsent (critical) fires for that db_type as well; when another Service of the same db_type is still up, this warning is the only signal. If every target of the tenant goes down, this alert resolves and TenantExporterAbsent takes over. Only tenants that declare db_type in _metadata get this alert; an undeclared tenant gets TenantExporterUndeclared instead."
              description_zh: "租戶 t1 的 target 10.1.0.1:9104（pod mdb-0）已 10 分鐘 up=0，同時同租戶仍有至少一個 up{job=\"tenant-exporters\"} target 為 up=1。那個 target 可能屬於別的 Service：若 Service mdb 沒有其他副本，它的指標已完全沒被抓取。它若是租戶宣告的某個 db_type 唯一的 exporter，TenantExporterAbsent（critical）也會對那個 db_type 響；同一個 db_type 若還有別的 Service 是 up，本告警就是唯一的訊號。若租戶所有 target 都掛，本告警會解除，改由 TenantExporterAbsent 接手。只有在 _metadata 宣告了 db_type 的租戶才會收到本告警；沒宣告的租戶改收 TenantExporterUndeclared。"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 12m
        alertname: TenantExporterAbsent
        exp_alerts: []

  # ── R10 series 沒有 pod／service label（自建 Prometheus、舊設定、BYO）→ 文案不留空洞、退回泛稱
  - interval: 1m
    name: R10-no-pod-or-service-label-renders-without-gaps
    input_series:
      - series: 'tenant_expected_exporter{tenant="t1", db_type="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: TenantExporterReplicaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              job: tenant-exporters
              tenant: t1
              instance: "10.1.0.2:9104"
            exp_annotations:
              summary: "Exporter target 10.1.0.2:9104 down for tenant t1 (another tenant-exporters target of the tenant is up)"
              summary_zh: "租戶 t1 的 exporter target 10.1.0.2:9104 停機（同租戶仍有其他 tenant-exporters target 為 up）"
              description: "Target 10.1.0.2:9104 of tenant t1 has read up=0 for 10m while at least one other up{job=\"tenant-exporters\"} target of the same tenant reads up=1. That target may belong to a different Service: if its Service has no other replica, its metrics are no longer scraped at all. When it was the only exporter of one of the tenant's declared db_types, TenantExporterAbsent (critical) fires for that db_type as well; when another Service of the same db_type is still up, this warning is the only signal. If every target of the tenant goes down, this alert resolves and TenantExporterAbsent takes over. Only tenants that declare db_type in _metadata get this alert; an undeclared tenant gets TenantExporterUndeclared instead."
              description_zh: "租戶 t1 的 target 10.1.0.2:9104已 10 分鐘 up=0，同時同租戶仍有至少一個 up{job=\"tenant-exporters\"} target 為 up=1。那個 target 可能屬於別的 Service：若該 Service 沒有其他副本，它的指標已完全沒被抓取。它若是租戶宣告的某個 db_type 唯一的 exporter，TenantExporterAbsent（critical）也會對那個 db_type 響；同一個 db_type 若還有別的 Service 是 up，本告警就是唯一的訊號。若租戶所有 target 都掛，本告警會解除，改由 TenantExporterAbsent 接手。只有在 _metadata 宣告了 db_type 的租戶才會收到本告警；沒宣告的租戶改收 TenantExporterUndeclared。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── R11 沒在 _metadata 宣告 db_type 的租戶（無 tenant_expected_exporter）：先一掛、後全掛，
  #    Rule A／B 都不響（#3771：Rule B 改 opt-in；拿掉 `and on(tenant) group by(tenant)
  #    (tenant_expected_exporter)` 這一行，12m 那一點就轉紅）。這種租戶由 Rule C
  #    TenantExporterUndeclared 指名，見 rule-pack-liveness-db-type_test.yaml U1。
  - interval: 1m
    name: R11-undeclared-tenant-gets-no-replica-or-absent-alert
    input_series:
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x14 0x15'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '0x30'
      # 另一個宣告了 db_type 的租戶：證明 tenant_expected_exporter 不是整個缺席（opt-in 是逐租戶的）。
      - series: 'tenant_expected_exporter{tenant="t2", db_type="mariadb"}'
        values: '1x30'
      - series: 'up{job="tenant-exporters", tenant="t2", instance="10.2.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x30'
      - series: 'mysql_up{job="tenant-exporters", tenant="t2", instance="10.2.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 12m
        alertname: TenantExporterAbsent
        exp_alerts: []
      - eval_time: 25m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 25m
        alertname: TenantExporterAbsent
        exp_alerts: []

  # ── R12 右側 job filter：同租戶只有別的 job 為 up=1、tenant-exporters 全掛 → Rule B 不響（只剩 Rule A）
  - interval: 1m
    name: R12-other-job-up-does-not-count-as-sibling
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t1", db_type="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '0x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.2:9104", pod="mdb-1", service="mdb"}'
        values: '0x20'
      - series: 'up{job="other", tenant="t1", instance="10.1.0.7:9100", pod="node-0", service="node"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantExporterAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              maintenance: page
              job: threshold-exporter
              tenant: t1
              db_type: mariadb
            exp_annotations:
              summary: "Exporter absent for tenant t1 (mariadb)"
              summary_zh: "租戶 t1 (mariadb) 的 exporter 缺席"
              description: "No mariadb exporter of tenant t1 has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs mariadb, remove it from _metadata.db_type; if the tenant was de-provisioned, remove its conf.d _metadata too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t1 的 mariadb exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 mariadb，請從 _metadata.db_type 移除；若租戶已退租，請確認 conf.d _metadata 也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── R13 左側 job filter：別的 job 的 target up=0、tenant-exporters 健康 → Rule B 不響
  - interval: 1m
    name: R13-other-job-down-is-not-a-tenant-exporter
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t1", db_type="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x20'
      # exporter-presence series of the target above (#3771): present while it answers.
      - series: 'mysql_up{job="tenant-exporters", tenant="t1", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1x20'
      - series: 'up{job="other", tenant="t1", instance="10.1.0.7:9100", pod="node-0", service="node"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantExporterAbsent
        exp_alerts: []
