# promtool unit test — the shipped default of oracle_tablespace_used_percent.
# One tenant, the registry's value as its warning threshold: silent below it,
# pending once above it, firing when `for:` has passed.
# tests/rulepacks/test_armed_key_binding.py holds the shape of this file and
# replays it with the threshold moved to both extremes.
rule_files:
  - ../../rule-packs/rule-pack-oracle.yaml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      # The fullest tablespace at 80 % for 10m, then 90 %.
      - series: 'oracledb_tablespace_used_percent{tenant="t-armed", instance="db-0", tablespace="USERS"}'
        values: '80x40 90x40'
      - series: 'user_threshold{tenant="t-armed", component="oracle", metric="tablespace_used_percent", severity="warning"}'
        values: '85x81'
    promql_expr_test:
      # Below the threshold, long past `for:` — silent.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="OracleTablespaceAlmostFull"})
        eval_time: 8m
        exp_samples: []
      # Above it, `for:` not yet served — pending, not firing.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="pending", alertname="OracleTablespaceAlmostFull"})
        eval_time: 12m
        exp_samples:
          - labels: '{alertname="OracleTablespaceAlmostFull", tenant="t-armed"}'
            value: 1
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="OracleTablespaceAlmostFull"})
        eval_time: 12m
        exp_samples: []
      # `for:` served — firing.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="OracleTablespaceAlmostFull"})
        eval_time: 17m
        exp_samples:
          - labels: '{alertname="OracleTablespaceAlmostFull", tenant="t-armed"}'
            value: 1
