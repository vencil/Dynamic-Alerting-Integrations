# promtool behavioural test for TenantApiPolicyUnavailable (hub #2486 Q7-2;
# since #2903 the gauge is the generator container's readiness, ADR-036 §5):
#   1) FIRES when writes stay unjudgeable (gauge == 0 sustained).
#   2) does NOT fire while they can be judged (gauge == 1).
#   3) does NOT fire on a one-tick dip (gauge 0 for < the 2m hold-down) — a
#      container restart or a policy ConfigMap update caught mid-way.
# Run: promtool test rules tests/rulepacks/platform-policy-unavailable_test.yaml
rule_files:
  - ../../rule-packs/rule-pack-platform.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: unavailable-fires
    input_series:
      - series: 'tenant_api_policy_available{job="tenant-api", instance="10.0.0.2:8080"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: TenantApiPolicyUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              alert_source: platform
              job: tenant-api
              instance: 10.0.0.2:8080
            exp_annotations:
              description: |
                The generator container in the tenant-api pod cannot judge writes,
                so tenant-api refuses every write that changes a conf.d file
                (PUT /tenants/{id}, custom alerts, tenant and group batches, in
                every write mode) with 503: POLICY_UNAVAILABLE when the deployment
                policy file (generator.policy.existingConfigMap) cannot be read or
                parsed, VALIDATOR_UNAVAILABLE when the container does not answer,
                has no da-read or da-guard, or is older than the policy's
                min_generator_version. Reads are unaffected. The 503 body's
                `reason` and the generator container's log say which; GET
                /v1/status on its socket (the container's probe) shows the
                policy error. Repair the policy ConfigMap, or fix the container
                (image with generator-service, da-read, da-guard), and the alert clears on
                the next scrape. There is no escape hatch (ADR-036 §5): the
                previous --policy-unavailable-open is removed, and this gauge no
                longer reflects a _domain_policy.yaml in conf.d or "its last good
                version".
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/governance-security.md"
              summary: "tenant-api writes cannot be judged — the generator container or its deployment policy is unavailable; writes answer 503"

  - interval: 1m
    name: available-no-fire
    input_series:
      - series: 'tenant_api_policy_available{job="tenant-api", instance="10.0.0.2:8080"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: TenantApiPolicyUnavailable
        exp_alerts: []

  # ⚠️ The eval at 6m is the DISCRIMINATOR for `for: 2m`: the gauge IS 0 there,
  # so a rule without the hold-down would already fire.
  - interval: 1m
    name: one-tick-dip-no-fire
    input_series:
      - series: 'tenant_api_policy_available{job="tenant-api", instance="10.0.0.2:8080"}'
        values: '1+0x5 0 1+0x24'
    alert_rule_test:
      - eval_time: 6m
        alertname: TenantApiPolicyUnavailable
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantApiPolicyUnavailable
        exp_alerts: []
