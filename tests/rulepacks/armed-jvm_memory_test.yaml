# promtool unit test — the shipped default of jvm_memory.
# One tenant, the registry's value as its warning threshold: silent below it,
# pending once above it, firing when `for:` has passed.
# tests/rulepacks/test_armed_key_binding.py holds the shape of this file and
# replays it with the threshold moved to both extremes.
rule_files:
  - ../../rule-packs/rule-pack-jvm.yaml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      # 75 % of the max heap used for 10m, then 85 %.
      - series: 'jvm_memory_used_bytes{tenant="t-armed", instance="app-0", area="heap"}'
        values: '75x40 85x40'
      - series: 'jvm_memory_max_bytes{tenant="t-armed", instance="app-0", area="heap"}'
        values: '100x81'
      - series: 'user_threshold{tenant="t-armed", component="jvm", metric="memory", severity="warning"}'
        values: '80x81'
    promql_expr_test:
      # Below the threshold, long past `for:` — silent.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="JVMMemoryPressure"})
        eval_time: 8m
        exp_samples: []
      # Above it, `for:` not yet served — pending, not firing.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="pending", alertname="JVMMemoryPressure"})
        eval_time: 12m
        exp_samples:
          - labels: '{alertname="JVMMemoryPressure", tenant="t-armed"}'
            value: 1
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="JVMMemoryPressure"})
        eval_time: 12m
        exp_samples: []
      # `for:` served — firing.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="JVMMemoryPressure"})
        eval_time: 17m
        exp_samples:
          - labels: '{alertname="JVMMemoryPressure", tenant="t-armed"}'
            value: 1
