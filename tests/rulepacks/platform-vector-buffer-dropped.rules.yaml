# Bare-rules promtool target for the VectorBufferEventsDropped alert (#1291).
# promtool can't consume the deployed ConfigMap directly (it needs a top-level
# `groups:` document, not `data: platform-alert.yml: |`), so this is an EXTRACTED
# COPY of the alert from k8s/03-monitoring/configmap-rules-platform.yaml.
#
# ⚠️ KEEP IN SYNC with that ConfigMap — the expr/for/labels/summary here must match.
# tests/rulepacks/test_platform_rules_extract_sync.py enforces it.
groups:
  - name: federation-audit
    rules:
      - alert: VectorBufferEventsDropped
        expr: |
          sum by (component_id) (
            rate(vector_buffer_discarded_events_total[5m])
          ) > 0
        for: 5m
        labels:
          severity: warning
          alert_source: platform
        annotations:
          summary: "Vector sink {{ $labels.component_id }} dropping events for 5m"
