# EXTRACTED COPY of the CronJob-failure alert in
# k8s/03-monitoring/configmap-rules-platform.yaml (group platform-self-monitoring).
#
# ⚠️ KEEP IN SYNC with that ConfigMap — expr / labels / `for` must match exactly.
# `description` is deliberately omitted here: promtool compares the annotation
# set for exact equality, and the multi-line operator guidance adds nothing to
# the behavioural assertions. Sync is machine-enforced by
# tests/rulepacks/test_platform_rules_extract_sync.py.
groups:
  - name: platform-self-monitoring
    rules:
      - alert: CronJobLastRunFailed
        expr: |
          (
            max by (owner_name, namespace) (
              (
                max by (job_name, namespace) (
                  kube_job_status_start_time{namespace="monitoring"}
                )
                and on (job_name, namespace)
                  max by (job_name, namespace) (
                    kube_job_failed{namespace="monitoring", condition="true"}
                  ) == 1
              )
              * on (job_name, namespace) group_left (owner_name)
                max by (job_name, namespace, owner_name) (
                  kube_job_owner{namespace="monitoring", owner_kind="CronJob"}
                )
            )
            ==
            max by (owner_name, namespace) (
              (
                max by (job_name, namespace) (
                  kube_job_status_start_time{namespace="monitoring"}
                )
                and on (job_name, namespace)
                  (
                    max by (job_name, namespace) (
                      kube_job_failed{namespace="monitoring", condition="true"}
                    )
                    or
                    max by (job_name, namespace) (
                      kube_job_complete{namespace="monitoring", condition="true"}
                    )
                  ) == 1
              )
              * on (job_name, namespace) group_left (owner_name)
                max by (job_name, namespace, owner_name) (
                  kube_job_owner{namespace="monitoring", owner_kind="CronJob"}
                )
            )
          )
          unless on (owner_name, namespace)
            label_replace(
              max by (cronjob, namespace) (
                kube_cronjob_spec_suspend{namespace="monitoring"}
              ) == 1,
              "owner_name", "$1", "cronjob", "(.*)"
            )
        for: 15m
        labels:
          severity: warning
          alert_source: platform
        annotations:
          summary: "CronJob {{ $labels.owner_name }}: most recent run failed"
