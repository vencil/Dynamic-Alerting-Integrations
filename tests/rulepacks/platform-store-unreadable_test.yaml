# promtool behavioural test for TenantApiStoreUnreadable (#2939):
#   1) FIRES once one reason is > 0 for the 10m hold-down — the `> 0`
#      threshold is the point: a single FIFO refuses every write.
#   2) does NOT fire before the 10m hold-down (discriminates `for: 10m`).
#   3) does NOT fire while every reason is 0.
#   4) CLEARS once the gauge returns to 0 (the next walk after the repair).
#   5) two reasons at once give ONE alert per pod (`max by (job, instance)`).
# Run: promtool test rules tests/rulepacks/platform-store-unreadable_test.yaml
rule_files:
  - ../../rule-packs/rule-pack-platform.yaml

evaluation_interval: 1m

tests:
  # special_file 0 for 5m, 1 from 5m to 30m, 0 afterwards; the other reasons 0.
  # ⚠️ 12m is the DISCRIMINATOR for `for: 10m`: the gauge is already 1 there,
  # so a rule with a shorter hold-down (or none) would fire.
  - interval: 1m
    name: fires-after-hold-down-and-clears
    input_series:
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="special_file"}'
        values: '0x4 1x25 0x20'
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="read_error"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 12m
        alertname: TenantApiStoreUnreadable
        exp_alerts: []
      - eval_time: 16m
        alertname: TenantApiStoreUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              alert_source: platform
              job: tenant-api
              instance: 10.0.0.2:8080
            exp_annotations:
              description: |
                tenant-api's own copy of conf.d holds 1 or more entries
                of one kind the server cannot read and git cannot hold
                (tenant_api_store_unreadable_entries by reason: special_file = a
                FIFO, socket or device named like a config file; read_error;
                walk_error = a directory that cannot be listed; stat_error = a
                failed stat that is not an unresolvable link). Every write through
                tenant-api answers 500 TENANT_STORE_FAULT until it is gone; reads
                are unaffected. This is the server's storage, not the
                configuration: find the entries in the tenant-api log ("conf.d
                holds unreadable entries" names them), then remove or repair them
                on the pod's volume, or reset the copy from git. tenant-api
                re-walks conf.d for the gauge at scrape time, so the alert
                clears by itself after the repair.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/api/tenant-api-hardening.md"
              summary: "tenant-api's conf.d copy has entries the server cannot read — every write answers 500 TENANT_STORE_FAULT"
      - eval_time: 35m
        alertname: TenantApiStoreUnreadable
        exp_alerts: []

  # All reasons 0 throughout: never fires.
  - interval: 1m
    name: all-zero-silent
    input_series:
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="special_file"}'
        values: '0x40'
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="walk_error"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: TenantApiStoreUnreadable
        exp_alerts: []

  # Two reasons > 0 on one pod: ONE alert (the reason label is aggregated away).
  - interval: 1m
    name: two-reasons-one-alert
    input_series:
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="special_file"}'
        values: '1x30'
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="walk_error"}'
        values: '2x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: TenantApiStoreUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              alert_source: platform
              job: tenant-api
              instance: 10.0.0.2:8080
            exp_annotations:
              description: |
                tenant-api's own copy of conf.d holds 2 or more entries
                of one kind the server cannot read and git cannot hold
                (tenant_api_store_unreadable_entries by reason: special_file = a
                FIFO, socket or device named like a config file; read_error;
                walk_error = a directory that cannot be listed; stat_error = a
                failed stat that is not an unresolvable link). Every write through
                tenant-api answers 500 TENANT_STORE_FAULT until it is gone; reads
                are unaffected. This is the server's storage, not the
                configuration: find the entries in the tenant-api log ("conf.d
                holds unreadable entries" names them), then remove or repair them
                on the pod's volume, or reset the copy from git. tenant-api
                re-walks conf.d for the gauge at scrape time, so the alert
                clears by itself after the repair.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/api/tenant-api-hardening.md"
              summary: "tenant-api's conf.d copy has entries the server cannot read — every write answers 500 TENANT_STORE_FAULT"
