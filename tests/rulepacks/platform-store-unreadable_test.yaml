# promtool behavioural test for TenantApiStoreUnreadable (#2939):
#   1) FIRES once one reason is > 0 for the 10m hold-down — the `> 0`
#      threshold is the point: a single FIFO refuses every write.
#   2) does NOT fire before the 10m hold-down (discriminates `for: 10m`).
#   3) does NOT fire while every reason is 0.
#   4) CLEARS once the gauge returns to 0 (the next walk after the repair).
#   5) two reasons at once give ONE alert per pod (`max by (job, instance)`).
# Run: promtool test rules tests/rulepacks/platform-store-unreadable_test.yaml
rule_files:
  - platform-store-unreadable.rules.yaml

evaluation_interval: 1m

tests:
  # special_file 0 for 5m, 1 from 5m to 30m, 0 afterwards; the other reasons 0.
  # ⚠️ 12m is the DISCRIMINATOR for `for: 10m`: the gauge is already 1 there,
  # so a rule with a shorter hold-down (or none) would fire.
  - interval: 1m
    name: fires-after-hold-down-and-clears
    input_series:
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="special_file"}'
        values: '0x4 1x25 0x20'
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="read_error"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 12m
        alertname: TenantApiStoreUnreadable
        exp_alerts: []
      - eval_time: 16m
        alertname: TenantApiStoreUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              alert_source: platform
              job: tenant-api
              instance: 10.0.0.2:8080
            exp_annotations:
              summary: "tenant-api's conf.d copy has entries the server cannot read — every write answers 500 TENANT_STORE_FAULT"
      - eval_time: 35m
        alertname: TenantApiStoreUnreadable
        exp_alerts: []

  # All reasons 0 throughout: never fires.
  - interval: 1m
    name: all-zero-silent
    input_series:
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="special_file"}'
        values: '0x40'
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="walk_error"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: TenantApiStoreUnreadable
        exp_alerts: []

  # Two reasons > 0 on one pod: ONE alert (the reason label is aggregated away).
  - interval: 1m
    name: two-reasons-one-alert
    input_series:
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="special_file"}'
        values: '1x30'
      - series: 'tenant_api_store_unreadable_entries{job="tenant-api", instance="10.0.0.2:8080", reason="walk_error"}'
        values: '2x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: TenantApiStoreUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              alert_source: platform
              job: tenant-api
              instance: 10.0.0.2:8080
            exp_annotations:
              summary: "tenant-api's conf.d copy has entries the server cannot read — every write answers 500 TENANT_STORE_FAULT"
