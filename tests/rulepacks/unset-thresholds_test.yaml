# promtool unit test — <Pack>ThresholdNotConfigured (#1200 D-A A3, #1175).
# threshold-exporter serves user_threshold_unset{tenant,pack,key,fix} for each key
# the platform ships no value for that serves a subscribed tenant no threshold
# (state filter unset_thresholds; off by default — the exporter does the gating,
# pkg/config/unset_thresholds.go). Each pack raises an info alert for its own
# keys, only for a tenant whose exporter of that kind answers under
# job="tenant-exporters", and not in maintenance; the text follows `fix`.
# Generated by the snippet in the #1200 D-A A3 PR description.
# Run: promtool test rules tests/rulepacks/unset-thresholds_test.yaml
rule_files:
  - ../../rule-packs/rule-pack-clickhouse.yaml
  - ../../rule-packs/rule-pack-db2.yaml
  - ../../rule-packs/rule-pack-elasticsearch.yaml
  - ../../rule-packs/rule-pack-jvm.yaml
  - ../../rule-packs/rule-pack-kafka.yaml
  - ../../rule-packs/rule-pack-mariadb.yaml
  - ../../rule-packs/rule-pack-mongodb.yaml
  - ../../rule-packs/rule-pack-nginx.yaml
  - ../../rule-packs/rule-pack-oracle.yaml
  - ../../rule-packs/rule-pack-rabbitmq.yaml
  - ../../rule-packs/rule-pack-redis.yaml

evaluation_interval: 15s

tests:
  # Must fire for t1 only: t2 has no redis exporter, t3 is in maintenance.
  - interval: 15s
    input_series:
      - series: 'user_threshold_unset{tenant="t1", pack="redis", key="redis_replication_lag", fix="tenant"}'
        values: '1x160'
      - series: 'redis_up{tenant="t1", job="tenant-exporters", instance="r1:9121"}'
        values: '1x160'
      - series: 'user_threshold_unset{tenant="t2", pack="redis", key="redis_replication_lag", fix="tenant"}'
        values: '1x160'
      - series: 'user_threshold_unset{tenant="t3", pack="redis", key="redis_replication_lag", fix="tenant"}'
        values: '1x160'
      - series: 'redis_up{tenant="t3", job="tenant-exporters", instance="r3:9121"}'
        values: '1x160'
      - series: 'user_state_filter{tenant="t3", filter="maintenance", severity="info"}'
        values: '1x160'
    alert_rule_test:
      - alertname: RedisThresholdNotConfigured
        eval_time: 29m
        exp_alerts: []
      - alertname: RedisThresholdNotConfigured
        eval_time: 31m
        exp_alerts:
          - exp_labels:
              tenant: t1
              pack: redis
              key: redis_replication_lag
              fix: tenant
              severity: info
              maintenance: mute
            exp_annotations:
              summary: "redis_replication_lag has no threshold for t1: the alert on it stays silent"
              summary_zh: "t1 沒有設定 redis_replication_lag：讀它的告警不會響"
              platform_summary: "redis_replication_lag: no threshold, so its alert never fires (fix: tenant)"
              platform_summary_zh: "redis_replication_lag：沒有門檻值，讀它的告警不會響（處理方：tenant）"
              description: "No threshold is served for redis_replication_lag, so the redis alert that reads it never fires. Write a threshold to arm it, or \"disable\" to keep it off and end this notice."
              description_zh: "redis_replication_lag 沒有送出任何門檻值，redis 讀它的告警因此永遠不會響。寫一個門檻值就會啟用；寫 \"disable\" 則維持關閉並結束這則提醒。"
              runbook_url: ""
              owner: ""
              tier: ""

  # Must not fire: another kind of exporter does not count.
  - interval: 15s
    input_series:
      - series: 'user_threshold_unset{tenant="t1", pack="redis", key="redis_replication_lag", fix="tenant"}'
        values: '1x160'
      - series: 'mysql_up{tenant="t1", job="tenant-exporters"}'
        values: '1x160'
      - series: 'rabbitmq_up{tenant="t1", job="tenant-exporters"}'
        values: '1x160'
    alert_rule_test:
      - alertname: RedisThresholdNotConfigured
        eval_time: 35m
        exp_alerts: []

  # Must not fire for an exporter under another job; the notice is per pack:
  # mariadb's key (component "mysql", pack "mariadb") fires for mysql_up.
  - interval: 15s
    input_series:
      - series: 'user_threshold_unset{tenant="t1", pack="redis", key="redis_connected_clients", fix="platform"}'
        values: '1x160'
      - series: 'redis_up{tenant="t1", job="some-other-job"}'
        values: '1x160'
      - series: 'user_threshold_unset{tenant="t1", pack="mariadb", key="mysql_threads_running", fix="tenant"}'
        values: '1x160'
      - series: 'mysql_up{tenant="t1", job="tenant-exporters"}'
        values: '1x160'
    alert_rule_test:
      - alertname: MariaDBThresholdNotConfigured
        eval_time: 35m
        exp_alerts:
          - exp_labels:
              tenant: t1
              pack: mariadb
              key: mysql_threads_running
              fix: tenant
              severity: info
              maintenance: mute
            exp_annotations:
              summary: "mysql_threads_running has no threshold for t1: the alert on it stays silent"
              summary_zh: "t1 沒有設定 mysql_threads_running：讀它的告警不會響"
              platform_summary: "mysql_threads_running: no threshold, so its alert never fires (fix: tenant)"
              platform_summary_zh: "mysql_threads_running：沒有門檻值，讀它的告警不會響（處理方：tenant）"
              description: "No threshold is served for mysql_threads_running, so the mariadb alert that reads it never fires. Write a threshold to arm it, or \"disable\" to keep it off and end this notice."
              description_zh: "mysql_threads_running 沒有送出任何門檻值，mariadb 讀它的告警因此永遠不會響。寫一個門檻值就會啟用；寫 \"disable\" 則維持關閉並結束這則提醒。"
              runbook_url: ""
              owner: ""
              tier: ""
      - alertname: RedisThresholdNotConfigured
        eval_time: 35m
        exp_alerts: []

  # Each presence metric counts on its own (rabbitmq built-in plugin, JVM before
  # jmx_exporter 1.0, JVM current names, nginx), and fix="platform" says so.
  - interval: 15s
    input_series:
      - series: 'user_threshold_unset{tenant="t1", pack="rabbitmq", key="rabbitmq_connections", fix="platform"}'
        values: '1x160'
      - series: 'rabbitmq_identity_info{tenant="t1", job="tenant-exporters"}'
        values: '1x160'
      - series: 'user_threshold_unset{tenant="t2", pack="jvm", key="jvm_memory", fix="platform"}'
        values: '1x160'
      - series: 'jvm_memory_bytes_used{tenant="t2", job="tenant-exporters", area="heap"}'
        values: '1000x160'
      - series: 'user_threshold_unset{tenant="t3", pack="jvm", key="jvm_threads", fix="platform"}'
        values: '1x160'
      - series: 'jvm_memory_used_bytes{tenant="t3", job="tenant-exporters", area="heap", id="G1 Eden Space"}'
        values: '1000x160'
      - series: 'user_threshold_unset{tenant="t4", pack="nginx", key="nginx_connections", fix="platform"}'
        values: '1x160'
      - series: 'nginx_up{tenant="t4", job="tenant-exporters"}'
        values: '1x160'
    alert_rule_test:
      - alertname: RabbitMQThresholdNotConfigured
        eval_time: 35m
        exp_alerts:
          - exp_labels:
              tenant: t1
              pack: rabbitmq
              key: rabbitmq_connections
              fix: platform
              severity: info
              maintenance: mute
            exp_annotations:
              summary: "rabbitmq_connections has no threshold for t1: the alert on it stays silent"
              summary_zh: "t1 沒有設定 rabbitmq_connections：讀它的告警不會響"
              platform_summary: "rabbitmq_connections: no threshold, so its alert never fires (fix: platform)"
              platform_summary_zh: "rabbitmq_connections：沒有門檻值，讀它的告警不會響（處理方：platform）"
              description: "The platform does not declare rabbitmq_connections, so a tenant value for it is not read and the rabbitmq alert that reads it never fires. The platform must add it to the root defaults or optional_overrides; write \"disable\" to end this notice."
              description_zh: "平台沒有宣告 rabbitmq_connections，租戶寫的值不會被讀，rabbitmq 讀它的告警因此永遠不會響。要由平台把它加進根層的 defaults 或 optional_overrides；寫 \"disable\" 可結束這則提醒。"
              runbook_url: ""
              owner: ""
              tier: ""
      - alertname: JVMThresholdNotConfigured
