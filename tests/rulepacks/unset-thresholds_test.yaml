              description: "The platform does not declare jvm_memory, so a tenant value for it is not read and the jvm alert that reads it never fires. The platform must add it to the root defaults or optional_overrides; write \"disable\" to end this notice."
              description_zh: "平台沒有宣告 jvm_memory，租戶寫的值不會被讀，jvm 讀它的告警因此永遠不會響。要由平台把它加進根層的 defaults 或 optional_overrides；寫 \"disable\" 可結束這則提醒。"
              runbook_url: ""
