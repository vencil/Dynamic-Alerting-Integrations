# promtool unit test — the shipped default of es_disk_usage_percent.
# One tenant, the registry's value as its warning threshold: silent below it,
# pending once above it, firing when `for:` has passed.
# tests/rulepacks/test_armed_key_binding.py holds the shape of this file and
# replays it with the threshold moved to both extremes.
rule_files:
  - ../../rule-packs/rule-pack-elasticsearch.yaml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      # 80 % of the data path used for 10m (20 of 100 available), then 90 %.
      - series: 'elasticsearch_filesystem_data_available_bytes{tenant="t-armed", instance="es-0"}'
        values: '20x40 10x40'
      - series: 'elasticsearch_filesystem_data_size_bytes{tenant="t-armed", instance="es-0"}'
        values: '100x81'
      - series: 'user_threshold{tenant="t-armed", component="es", metric="disk_usage_percent", severity="warning"}'
        values: '85x81'
    promql_expr_test:
      # Below the threshold, long past `for:` — silent.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="ElasticsearchHighDiskUsage"})
        eval_time: 8m
        exp_samples: []
      # Above it, `for:` not yet served — pending, not firing.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="pending", alertname="ElasticsearchHighDiskUsage"})
        eval_time: 12m
        exp_samples:
          - labels: '{alertname="ElasticsearchHighDiskUsage", tenant="t-armed"}'
            value: 1
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="ElasticsearchHighDiskUsage"})
        eval_time: 12m
        exp_samples: []
      # `for:` served — firing.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="ElasticsearchHighDiskUsage"})
        eval_time: 17m
        exp_samples:
          - labels: '{alertname="ElasticsearchHighDiskUsage", tenant="t-armed"}'
            value: 1
