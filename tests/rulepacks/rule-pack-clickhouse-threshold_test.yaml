# promtool unit test — #731 exporter↔rule-pack metric-label contract (clickhouse).
# Proves the (multi-line) threshold recording rule resolves under the REAL exporter
# shape `user_threshold{component="clickhouse", metric="queries_rate"}` (was querying
# the full `metric="clickhouse_queries_rate"` → empty → silent before #731).
# Run: promtool test rules tests/rulepacks/rule-pack-clickhouse-threshold_test.yaml
rule_files:
  - ../../rule-packs/rule-pack-clickhouse.yaml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      - series: 'user_threshold{tenant="t1", component="clickhouse", metric="queries_rate", severity="warning"}'
        values: '300x5'
    promql_expr_test:
      - expr: tenant:alert_threshold:clickhouse_queries_rate
        eval_time: 1m
        exp_samples:
          - labels: 'tenant:alert_threshold:clickhouse_queries_rate{tenant="t1"}'
            value: 300

  # #3658 critical tier: clickhouse_active_connections_critical. t-fire sits above the critical
  # threshold (300); t-quiet sits between warning (200) and critical,
  # so only the warning twin ClickHouseHighConnections would page it — ClickHouseHighConnectionsCritical must not.
  - interval: 15s
    input_series:
      - series: "ClickHouseMetrics_TCPConnection{tenant=\"t-fire\"}"
        values: "350x60"
      - series: "user_threshold{tenant=\"t-fire\", component=\"clickhouse\", metric=\"active_connections\", severity=\"warning\"}"
        values: "200x60"
      - series: "user_threshold{tenant=\"t-fire\", component=\"clickhouse\", metric=\"active_connections\", severity=\"critical\"}"
        values: "300x60"
      - series: "ClickHouseMetrics_TCPConnection{tenant=\"t-quiet\"}"
        values: "250x60"
      - series: "user_threshold{tenant=\"t-quiet\", component=\"clickhouse\", metric=\"active_connections\", severity=\"warning\"}"
        values: "200x60"
      - series: "user_threshold{tenant=\"t-quiet\", component=\"clickhouse\", metric=\"active_connections\", severity=\"critical\"}"
        values: "300x60"
    promql_expr_test:
      - expr: tenant:alert_threshold:clickhouse_active_connections_critical
        eval_time: 1m
        exp_samples:
          - labels: "tenant:alert_threshold:clickhouse_active_connections_critical{tenant=\"t-fire\"}"
            value: 300
          - labels: "tenant:alert_threshold:clickhouse_active_connections_critical{tenant=\"t-quiet\"}"
            value: 300
    alert_rule_test:
      - eval_time: 150s
        alertname: ClickHouseHighConnectionsCritical
        exp_alerts: []
      - eval_time: 10m
        alertname: ClickHouseHighConnectionsCritical
        exp_alerts:
          # only t-fire; t-quiet is above warning but below critical.
          - exp_labels:
              severity: "critical"
              maintenance: "mute"
              metric_group: "clickhouse_active_connections"
              tenant: "t-fire"
            exp_annotations:
              summary: "ClickHouse active connections exceed critical threshold"
              summary_zh: "ClickHouse 活動連線超出嚴重閾值"
              platform_summary: "[] t-fire: ClickHouse connections at critical level — max_connections is near and new clients will be refused; cap the offending client pool now"
              platform_summary_zh: "[] t-fire：ClickHouse 連線數達嚴重水位 — 接近 max_connections，新客戶端將被拒；請立即限制造成問題的 client pool"
              description: "350 active connections (critical threshold exceeded)"
              description_zh: "350 個活動連線（超過嚴重閾值）"
              runbook_url: ""
              owner: ""
              tier: ""
