# promtool unit test — ContainerCrashLoop (#1177): one alert per tenant counting
# crash-looping containers, from two arms joined per container:
#   waiting  tenant:container_crashloop_waiting:by_container (CrashLoopBackOff now)
#   restart  tenant:container_restart_loop:by_container (>=3 restarts in 1h, one
#            within 20m, no OOM kill in the hour)
# Run: promtool test rules tests/rulepacks/rule-pack-kubernetes-crashloop_test.yaml
rule_files:
  - ../../rule-packs/rule-pack-kubernetes.yaml

evaluation_interval: 15s

tests:
  # ── Restart arm, 1m samples. Restarts at 10/12/14/16/18m unless noted;
  #    asserted at 25m (last restart inside the 20m recency window) and at 45m
  #    (27m after it: resolved — the tail after a fix is bounded).
  #   db-a  5 restarts, counter starts at 7       -> fires (exact max-min, not 12)
  #   db-b  2 restarts                            -> silent (the >=3 bar)
  #   db-c  5 restarts, OOM kill on the container -> silent (left to the OOM alerts)
  #   db-d  5 restarts, crashloop filter off      -> silent
  #   db-e  5 restarts, maintenance               -> silent
  #   db-f  2 restarts seen by TWO KSM replicas   -> silent (not summed into 4)
  #   db-g  OOM on the sidecar, 4 restarts on app -> fires (exclusion is per container)
  #   db-h  pod recreated under the same name,    -> fires (2 + 2 across two uids)
  #         2 restarts in each uid
  #   db-i  counter drops 12 -> 0, then 1 restart -> silent (counts 1, not 12) ──
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="db-a", pod="app-0", uid="u-a", container="app"}'
        values: '7x9 8x2 9x2 10x2 11x2 12x40'
      - series: 'tenant_metadata_info{tenant="db-a", runbook_url="http://rb/a", owner="team-a", tier="gold"}'
        values: '1x60'
      - series: 'user_state_filter{tenant="db-a", filter="container_crashloop"}'
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="db-b", pod="app-0", uid="u-b", container="app"}'
        values: '0x9 1x2 2x48'
      - series: 'user_state_filter{tenant="db-b", filter="container_crashloop"}'
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="db-c", pod="app-0", uid="u-c", container="app"}'
        values: '0x9 1x2 2x2 3x2 4x2 5x40'
      - series: 'container_oom_events_total{namespace="db-c", pod="app-0", container="app"}'
        values: '0x9 1x50'
      - series: 'user_state_filter{tenant="db-c", filter="container_crashloop"}'
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="db-d", pod="app-0", uid="u-d", container="app"}'
        values: '0x9 1x2 2x2 3x2 4x2 5x40'
      - series: 'kube_pod_container_status_restarts_total{namespace="db-e", pod="app-0", uid="u-e", container="app"}'
        values: '0x9 1x2 2x2 3x2 4x2 5x40'
      - series: 'user_state_filter{tenant="db-e", filter="container_crashloop"}'
        values: '1x60'
      - series: 'user_state_filter{tenant="db-e", filter="maintenance"}'
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="db-f", pod="app-0", uid="u-f", container="app", instance="ksm-0"}'
        values: '0x9 1x2 2x48'
      - series: 'kube_pod_container_status_restarts_total{namespace="db-f", pod="app-0", uid="u-f", container="app", instance="ksm-1"}'
        values: '0x9 1x2 2x48'
      - series: 'user_state_filter{tenant="db-f", filter="container_crashloop"}'
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="db-g", pod="app-0", uid="u-g", container="app"}'
        values: '0x9 1x2 2x2 3x2 4x42'
      - series: 'container_oom_events_total{namespace="db-g", pod="app-0", container="sidecar"}'
        values: '0x9 1x50'
      - series: 'user_state_filter{tenant="db-g", filter="container_crashloop"}'
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="db-h", pod="app-0", uid="u-h1", container="app"}'
        values: '0x9 1x2 2x2 _x46'
      - series: 'kube_pod_container_status_restarts_total{namespace="db-h", pod="app-0", uid="u-h2", container="app"}'
        values: '_x13 0x2 1x2 2x42'
      - series: 'user_state_filter{tenant="db-h", filter="container_crashloop"}'
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="db-i", pod="app-0", uid="u-i", container="app"}'
        values: '12x10 0x3 1x46'
      - series: 'user_state_filter{tenant="db-i", filter="container_crashloop"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 8m
        alertname: ContainerCrashLoop
        exp_alerts: []
      - eval_time: 25m
        alertname: ContainerCrashLoop
        exp_alerts:
          - exp_labels:
              maintenance: mute
              severity: critical
              tenant: db-a
            exp_annotations:
              summary: "Container crash loop detected in db-a"
              summary_zh: "db-a 偵測到容器崩潰迴圈"
              platform_summary: "[gold] db-a: crash loop detected — check deployment and image health"
              platform_summary_zh: "[gold] db-a: 偵測到崩潰迴圈 — 請檢查部署和映像檔案狀態"
              description: "1 container(s) crash-looping: in CrashLoopBackOff now, or restarted >=3 times in the last hour (once within 20m, no OOM kill) — per container in tenant:container_crashloop_waiting:by_container and tenant:container_restart_loop:by_container"
              description_zh: "1 個容器處於崩潰迴圈：目前在 CrashLoopBackOff，或過去一小時內重啟 >=3 次（最近 20 分鐘內仍有重啟、非 OOM）— 逐容器見 tenant:container_crashloop_waiting:by_container 與 tenant:container_restart_loop:by_container"
              runbook_url: "http://rb/a"
              owner: "team-a"
              tier: "gold"
          - exp_labels:
              maintenance: mute
              severity: critical
              tenant: db-g
            exp_annotations:
              summary: "Container crash loop detected in db-g"
              summary_zh: "db-g 偵測到容器崩潰迴圈"
              platform_summary: "[] db-g: crash loop detected — check deployment and image health"
              platform_summary_zh: "[] db-g: 偵測到崩潰迴圈 — 請檢查部署和映像檔案狀態"
              description: "1 container(s) crash-looping: in CrashLoopBackOff now, or restarted >=3 times in the last hour (once within 20m, no OOM kill) — per container in tenant:container_crashloop_waiting:by_container and tenant:container_restart_loop:by_container"
              description_zh: "1 個容器處於崩潰迴圈：目前在 CrashLoopBackOff，或過去一小時內重啟 >=3 次（最近 20 分鐘內仍有重啟、非 OOM）— 逐容器見 tenant:container_crashloop_waiting:by_container 與 tenant:container_restart_loop:by_container"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              maintenance: mute
              severity: critical
              tenant: db-h
            exp_annotations:
              summary: "Container crash loop detected in db-h"
              summary_zh: "db-h 偵測到容器崩潰迴圈"
              platform_summary: "[] db-h: crash loop detected — check deployment and image health"
              platform_summary_zh: "[] db-h: 偵測到崩潰迴圈 — 請檢查部署和映像檔案狀態"
              description: "1 container(s) crash-looping: in CrashLoopBackOff now, or restarted >=3 times in the last hour (once within 20m, no OOM kill) — per container in tenant:container_crashloop_waiting:by_container and tenant:container_restart_loop:by_container"
              description_zh: "1 個容器處於崩潰迴圈：目前在 CrashLoopBackOff，或過去一小時內重啟 >=3 次（最近 20 分鐘內仍有重啟、非 OOM）— 逐容器見 tenant:container_crashloop_waiting:by_container 與 tenant:container_restart_loop:by_container"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 45m
        alertname: ContainerCrashLoop
        exp_alerts: []

