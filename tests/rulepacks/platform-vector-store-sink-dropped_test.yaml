              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md"
      - eval_time: 50m
        alertname: VectorStoreSinkDroppingEvents
        exp_alerts: []

  # Scrape gap of 15m (stale marker, then nothing) with no new drop: the old
  # non-zero counter must not look new when it comes back.
  - interval: 1m
    name: scrape-gap-does-not-repage-an-old-drop
    input_series:
      - series: 'vector_component_discarded_events_total{component_id="victorialogs", component_kind="sink", intentional="false", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '4x20 stale _x14 4x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: VectorStoreSinkDroppingEvents
        exp_alerts: []
      - eval_time: 37m
        alertname: VectorStoreSinkDroppingEvents
        exp_alerts: []
      - eval_time: 41m
        alertname: VectorStoreSinkDroppingEvents
        exp_alerts: []
      - eval_time: 47m
        alertname: VectorStoreSinkDroppingEvents
        exp_alerts: []

  # Vector restarts in place: stale, then the counter comes back at 1 (one
  # refused batch after the restart). increase() counts the reset.
  - interval: 1m
    name: restart-then-one-refused-batch-fires
    input_series:
      - series: 'vector_component_discarded_events_total{component_id="victorialogs", component_kind="sink", intentional="false", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '10x20 stale 1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: VectorStoreSinkDroppingEvents
        exp_alerts: []
      - eval_time: 23m
        alertname: VectorStoreSinkDroppingEvents
        exp_alerts:
