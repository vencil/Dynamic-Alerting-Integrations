                in the vector chart against the store's consumer `vector`
                (platform-log-aggregation-runbook.md §1.2), and the Vector
                logs for the response code.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md"
