  # 8) A Prometheus with no history (fresh, or restarted on an emptyDir) meets
  #    a counter Vector created long ago: no earlier value, but no earlier
  #    scrape of that target either, so it is not taken for a new drop.
  - interval: 1m
    name: fresh-prometheus-does-not-repage-old-drops
    input_series:
      - series: 'up{instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '1x60'
      - series: 'vector_component_discarded_events_total{component_id="victorialogs", component_kind="sink", intentional="false", pod="vector-a", instance="10.0.0.1:9598", job="vector-metrics"}'
        values: '4x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: VectorStoreSinkDroppingEvents
        exp_alerts: []
      - eval_time: 15m
        alertname: VectorStoreSinkDroppingEvents
        exp_alerts: []
      - eval_time: 45m
        alertname: VectorStoreSinkDroppingEvents
        exp_alerts: []

  # 9) Prometheus down for 70m, longer than the look-back, nothing new lost.
  - interval: 1m
    name: long-outage-does-not-repage-old-drops
    input_series:
