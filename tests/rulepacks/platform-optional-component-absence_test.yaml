# promtool behavioural test: absence alerts on OPTIONAL components fire only when the
# component is deployed and scraped (#1595 D1b).
#
# federation-reconciler and federation-gateway are optional charts. Their two absence
# alerts — FederationRevocationReconcileStale's absent() arm and
# FederationAuditPipelineSilent — were unguarded, so both critical alerts fired forever
# wherever federation was not deployed (raw and Prometheus Operator mode alike). Each
# is now AND-ed with a kube-state-metrics presence check (the reconciler Deployment
# with replicas > 0; a gateway pod with the audit-metrics container) — not with `up`,
# which vanishes exactly when the scrape target is lost, the failure these alerts
# exist to catch. Removing a guard makes the not-deployed case red; swapping it for
# an `up` guard makes the deployed-not-scraped case red. The rule that every absent() over an optional chart's metric
# carries such a guard is pinned by tests/lint/test_absence_guard.py.
# Run: promtool test rules tests/rulepacks/platform-optional-component-absence_test.yaml
rule_files:
  - ../../rule-packs/rule-pack-platform.yaml

evaluation_interval: 1m

tests:

  # FederationRevocationReconcileStale: no reconciler Deployment (federation not
  # deployed) → the absent() arm is guarded off. It fired forever before #1595 D1b.
  - interval: 1m
    name: reconciler-not-deployed-no-alert
    input_series:
    - series: up{job="threshold-exporter", instance="10.0.0.9:8080"}
      values: 1+0x30
    alert_rule_test:
    - eval_time: 20m
      alertname: FederationRevocationReconcileStale
      exp_alerts: []

  # FederationRevocationReconcileStale: the Deployment exists with replicas 0 → off.
  - interval: 1m
    name: reconciler-scaled-to-zero-no-alert
    input_series:
    - series: kube_deployment_spec_replicas{namespace="da-system", deployment="federation-reconciler", job="kube-state-metrics"}
      values: 0+0x30
    alert_rule_test:
    - eval_time: 20m
      alertname: FederationRevocationReconcileStale
      exp_alerts: []

  # FederationRevocationReconcileStale: the Deployment runs (KSM) but no reconciler
  # series reach Prometheus — no `up` either (ServiceMonitor off, scrape label lost).
  # This is what the absent() arm exists for, so it fires; an `up`-based guard
  # would hide it.
  - interval: 1m
    name: reconciler-deployed-not-scraped-fires
    input_series:
    - series: kube_deployment_spec_replicas{namespace="da-system", deployment="federation-reconciler", job="kube-state-metrics"}
      values: 1+0x30
    alert_rule_test:
    - eval_time: 12m
      alertname: FederationRevocationReconcileStale
      exp_alerts:
      - exp_labels:
          severity: critical
          alert_source: platform
        exp_annotations:
          summary: Federation revocation reconciler stale or down — un-revoke detection is not operational (ADR-028)
          description: |
            The federation-reconciler has not SUCCESSFULLY reconciled in over 30
            minutes, or its metrics are absent (pod down / never scraped). A
            fail-closed pass (a VictoriaLogs query or revoked.txt read failed)
            deliberately does NOT refresh the last-reconcile timestamp, so a
            stuck reconciler surfaces here rather than as a false all-clear — but
            while it is stale the un-revoke tamper-evidence is BLIND. ACTION:
            check the reconciler Deployment (`kubectl get deploy -A -l
            app.kubernetes.io/name=federation-reconciler`), its recent logs for fail-closed messages,
            and VictoriaLogs reachability. Details:
            docs/adr/028-federation-revocation-tamper-evidence.md.
          runbook_url: https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/adr/028-federation-revocation-tamper-evidence.md

  # FederationRevocationReconcileStale: deployed, scraped and reconciling → silent.
  - interval: 1m
    name: reconciler-deployed-scraped-fresh-no-alert
    input_series:
    - series: kube_deployment_spec_replicas{namespace="da-system", deployment="federation-reconciler", job="kube-state-metrics"}
      values: 1+0x30
    - series: federation_revocation_last_reconcile_timestamp_seconds{job="federation-reconciler"}
      values: 0+60x30
    alert_rule_test:
    - eval_time: 20m
      alertname: FederationRevocationReconcileStale
      exp_alerts: []

  # FederationAuditPipelineSilent: no gateway at all → guarded off. It fired forever
  # before #1595 D1b.
  - interval: 1m
    name: gateway-not-deployed-no-alert
    input_series:
    - series: up{job="threshold-exporter", instance="10.0.0.9:8080"}
      values: 1+0x30
    alert_rule_test:
    - eval_time: 20m
      alertname: FederationAuditPipelineSilent
      exp_alerts: []

  # FederationAuditPipelineSilent: the gateway runs with auditLog off (no audit-metrics
  # container) → there is no audit pipeline to be silent.
  - interval: 1m
    name: gateway-without-audit-sidecar-no-alert
    input_series:
    - series: kube_pod_container_info{namespace="da-system", pod="federation-gateway-0", container="envoy", job="kube-state-metrics"}
      values: 1+0x30
    alert_rule_test:
    - eval_time: 20m
      alertname: FederationAuditPipelineSilent
      exp_alerts: []

  # FederationAuditPipelineSilent: the audit sidecar runs (KSM) but no
  # tenant_federation_requests_total for 10m (not scraped, or broken) → fires.
  - interval: 1m
    name: gateway-audit-deployed-not-scraped-fires
    input_series:
    - series: kube_pod_container_info{namespace="da-system", pod="federation-gateway-0", container="audit-metrics", job="kube-state-metrics"}
      values: 1+0x30
    - series: kube_pod_container_info{namespace="da-system", pod="federation-gateway-0", container="envoy", job="kube-state-metrics"}
      values: 1+0x30
    alert_rule_test:
    - eval_time: 16m
      alertname: FederationAuditPipelineSilent
      exp_alerts:
      - exp_labels:
          severity: critical
          alert_source: platform
        exp_annotations:
          summary: Federation audit pipeline has produced zero rows for 10m
          description: |
            No `tenant_federation_requests_total` samples in the last
            10m — federation gateway audit pipeline is broken. Check
            (a) gateway pods Running, (b) audit-metrics sidecar logs, (c) the
            Prometheus scrape target. If both gateway + sidecar are
            healthy the silence may indicate genuine zero traffic
            (suppress the alert during planned maintenance).
          runbook_url: https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/adr/020-tenant-federation.md

  # FederationAuditPipelineSilent: audit sidecar scraped and counting → silent.
  - interval: 1m
    name: gateway-audit-deployed-with-traffic-no-alert
    input_series:
    - series: kube_pod_container_info{namespace="da-system", pod="federation-gateway-0", container="audit-metrics", job="kube-state-metrics"}
      values: 1+0x30
    - series: kube_pod_container_info{namespace="da-system", pod="federation-gateway-0", container="envoy", job="kube-state-metrics"}
      values: 1+0x30
    - series: tenant_federation_requests_total{tenant="tenant-x", status="ok", job="federation-gateway", instance="10.0.0.8:3903"}
      values: 0+5x30
    alert_rule_test:
    - eval_time: 20m
      alertname: FederationAuditPipelineSilent
      exp_alerts: []
