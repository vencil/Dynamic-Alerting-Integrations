# promtool unit test — RabbitMQ memory / disk alarm (#3973).
# RabbitMQ blocks every publisher while a node's memory or free-disk alarm is in
# effect. Both exporters the pack supports export it as a 0/1 gauge:
# kbudde/rabbitmq_exporter per node (cluster/node/self), the rabbitmq_prometheus
# plugin for the scraped node. Critical, for: 1m, muted in maintenance.
# Generated by the snippet in the #3973 PR description.
# Run: promtool test rules tests/rulepacks/rule-pack-rabbitmq-alarms_test.yaml
rule_files:
  - ../../rule-packs/rule-pack-rabbitmq.yaml

evaluation_interval: 15s

tests:
  # memory: kbudde fires (t1), the plugin fires (t2), 0 stays quiet (t3), maintenance
  # mutes (t4); not before for: 1m.
  - interval: 15s
    input_series:
      - series: 'rabbitmq_node_mem_alarm{tenant="t1", cluster="c", node="rabbit@a", self="1"}'
        values: '1x20'
      - series: 'rabbitmq_node_mem_alarm{tenant="t1", cluster="c", node="rabbit@b", self="0"}'
        values: '0x20'
      - series: 'rabbitmq_alarms_memory_used_watermark{tenant="t2", instance="r2:15692"}'
        values: '1x20'
      - series: 'rabbitmq_node_mem_alarm{tenant="t3", cluster="c", node="rabbit@c", self="1"}'
        values: '0x20'
      - series: 'rabbitmq_alarms_memory_used_watermark{tenant="t3", instance="r3:15692"}'
        values: '0x20'
      - series: 'rabbitmq_alarms_memory_used_watermark{tenant="t4", instance="r4:15692"}'
        values: '1x20'
      - series: 'user_state_filter{tenant="t4", filter="maintenance", severity="info"}'
        values: '1x20'
    alert_rule_test:
      - alertname: RabbitMQMemoryAlarm
        eval_time: 45s
        exp_alerts: []
      - alertname: RabbitMQMemoryAlarm
        eval_time: 2m
        exp_alerts:
          - exp_labels:
              tenant: t1
              severity: critical
              maintenance: mute
              metric_group: rabbitmq_node_mem_percent
            exp_annotations:
              summary: "RabbitMQ memory alarm on t1: publishers are blocked"
              summary_zh: "t1 的 RabbitMQ 記憶體告警已觸發：所有 publisher 被擋住"
              platform_summary: "[] t1: RabbitMQ memory alarm — publishers blocked"
              platform_summary_zh: "[] t1: RabbitMQ 記憶體告警 — publisher 被擋住"
              description: "A node of this tenant has its memory alarm in effect, so RabbitMQ blocks every connection that publishes. Free memory (drain queues, add consumers) or raise vm_memory_high_watermark; a watermark of 0 blocks publishers by design."
              description_zh: "這個租戶有節點的記憶體告警生效中，RabbitMQ 會擋住所有發佈訊息的連線。請釋放記憶體（消化佇列、增加 consumer）或調高 vm_memory_high_watermark；watermark 設為 0 時本來就會擋住所有 publisher。"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              tenant: t2
              severity: critical
              maintenance: mute
              metric_group: rabbitmq_node_mem_percent
            exp_annotations:
              summary: "RabbitMQ memory alarm on t2: publishers are blocked"
              summary_zh: "t2 的 RabbitMQ 記憶體告警已觸發：所有 publisher 被擋住"
              platform_summary: "[] t2: RabbitMQ memory alarm — publishers blocked"
              platform_summary_zh: "[] t2: RabbitMQ 記憶體告警 — publisher 被擋住"
              description: "A node of this tenant has its memory alarm in effect, so RabbitMQ blocks every connection that publishes. Free memory (drain queues, add consumers) or raise vm_memory_high_watermark; a watermark of 0 blocks publishers by design."
              description_zh: "這個租戶有節點的記憶體告警生效中，RabbitMQ 會擋住所有發佈訊息的連線。請釋放記憶體（消化佇列、增加 consumer）或調高 vm_memory_high_watermark；watermark 設為 0 時本來就會擋住所有 publisher。"
              runbook_url: ""
              owner: ""
              tier: ""

  # memory: both exporters scraped for one tenant with the same label set — a 0
  # from one must not hide a 1 from the other (each side tagged before `or`).
  - interval: 15s
    input_series:
      - series: 'rabbitmq_node_mem_alarm{tenant="t5"}'
        values: '0x20'
      - series: 'rabbitmq_alarms_memory_used_watermark{tenant="t5"}'
        values: '1x20'
    alert_rule_test:
      - alertname: RabbitMQMemoryAlarm
        eval_time: 2m
        exp_alerts:
          - exp_labels:
              tenant: t5
              severity: critical
              maintenance: mute
              metric_group: rabbitmq_node_mem_percent
            exp_annotations:
              summary: "RabbitMQ memory alarm on t5: publishers are blocked"
              summary_zh: "t5 的 RabbitMQ 記憶體告警已觸發：所有 publisher 被擋住"
              platform_summary: "[] t5: RabbitMQ memory alarm — publishers blocked"
              platform_summary_zh: "[] t5: RabbitMQ 記憶體告警 — publisher 被擋住"
              description: "A node of this tenant has its memory alarm in effect, so RabbitMQ blocks every connection that publishes. Free memory (drain queues, add consumers) or raise vm_memory_high_watermark; a watermark of 0 blocks publishers by design."
              description_zh: "這個租戶有節點的記憶體告警生效中，RabbitMQ 會擋住所有發佈訊息的連線。請釋放記憶體（消化佇列、增加 consumer）或調高 vm_memory_high_watermark；watermark 設為 0 時本來就會擋住所有 publisher。"
              runbook_url: ""
              owner: ""
              tier: ""

  # disk: kbudde fires (t1), the plugin fires (t2), 0 stays quiet (t3), maintenance
  # mutes (t4); not before for: 1m.
  - interval: 15s
    input_series:
      - series: 'rabbitmq_node_disk_free_alarm{tenant="t1", cluster="c", node="rabbit@a", self="1"}'
        values: '1x20'
      - series: 'rabbitmq_node_disk_free_alarm{tenant="t1", cluster="c", node="rabbit@b", self="0"}'
        values: '0x20'
      - series: 'rabbitmq_alarms_free_disk_space_watermark{tenant="t2", instance="r2:15692"}'
        values: '1x20'
      - series: 'rabbitmq_node_disk_free_alarm{tenant="t3", cluster="c", node="rabbit@c", self="1"}'
        values: '0x20'
      - series: 'rabbitmq_alarms_free_disk_space_watermark{tenant="t3", instance="r3:15692"}'
        values: '0x20'
      - series: 'rabbitmq_alarms_free_disk_space_watermark{tenant="t4", instance="r4:15692"}'
        values: '1x20'
      - series: 'user_state_filter{tenant="t4", filter="maintenance", severity="info"}'
        values: '1x20'
    alert_rule_test:
      - alertname: RabbitMQDiskAlarm
        eval_time: 45s
        exp_alerts: []
      - alertname: RabbitMQDiskAlarm
        eval_time: 2m
        exp_alerts:
          - exp_labels:
              tenant: t1
              severity: critical
              maintenance: mute
            exp_annotations:
              summary: "RabbitMQ disk alarm on t1: publishers are blocked"
              summary_zh: "t1 的 RabbitMQ 磁碟告警已觸發：所有 publisher 被擋住"
              platform_summary: "[] t1: RabbitMQ disk alarm — publishers blocked"
              platform_summary_zh: "[] t1: RabbitMQ 磁碟告警 — publisher 被擋住"
              description: "A node of this tenant has its disk alarm in effect, so RabbitMQ blocks every connection that publishes. Free disk space on the node (purge or move data, grow the volume); lowering disk_free_limit only narrows the margin before the disk fills."
              description_zh: "這個租戶有節點的磁碟告警生效中，RabbitMQ 會擋住所有發佈訊息的連線。請釋放該節點的磁碟空間（清除或搬移資料、擴充磁碟）；調低 disk_free_limit 只會縮小磁碟寫滿前的安全邊際。"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              tenant: t2
              severity: critical
              maintenance: mute
            exp_annotations:
              summary: "RabbitMQ disk alarm on t2: publishers are blocked"
              summary_zh: "t2 的 RabbitMQ 磁碟告警已觸發：所有 publisher 被擋住"
              platform_summary: "[] t2: RabbitMQ disk alarm — publishers blocked"
              platform_summary_zh: "[] t2: RabbitMQ 磁碟告警 — publisher 被擋住"
              description: "A node of this tenant has its disk alarm in effect, so RabbitMQ blocks every connection that publishes. Free disk space on the node (purge or move data, grow the volume); lowering disk_free_limit only narrows the margin before the disk fills."
              description_zh: "這個租戶有節點的磁碟告警生效中，RabbitMQ 會擋住所有發佈訊息的連線。請釋放該節點的磁碟空間（清除或搬移資料、擴充磁碟）；調低 disk_free_limit 只會縮小磁碟寫滿前的安全邊際。"
              runbook_url: ""
              owner: ""
              tier: ""

  # disk: both exporters scraped for one tenant with the same label set — a 0
  # from one must not hide a 1 from the other (each side tagged before `or`).
  - interval: 15s
    input_series:
      - series: 'rabbitmq_node_disk_free_alarm{tenant="t5"}'
        values: '0x20'
      - series: 'rabbitmq_alarms_free_disk_space_watermark{tenant="t5"}'
        values: '1x20'
    alert_rule_test:
      - alertname: RabbitMQDiskAlarm
        eval_time: 2m
        exp_alerts:
          - exp_labels:
              tenant: t5
              severity: critical
              maintenance: mute
            exp_annotations:
              summary: "RabbitMQ disk alarm on t5: publishers are blocked"
              summary_zh: "t5 的 RabbitMQ 磁碟告警已觸發：所有 publisher 被擋住"
              platform_summary: "[] t5: RabbitMQ disk alarm — publishers blocked"
              platform_summary_zh: "[] t5: RabbitMQ 磁碟告警 — publisher 被擋住"
              description: "A node of this tenant has its disk alarm in effect, so RabbitMQ blocks every connection that publishes. Free disk space on the node (purge or move data, grow the volume); lowering disk_free_limit only narrows the margin before the disk fills."
              description_zh: "這個租戶有節點的磁碟告警生效中，RabbitMQ 會擋住所有發佈訊息的連線。請釋放該節點的磁碟空間（清除或搬移資料、擴充磁碟）；調低 disk_free_limit 只會縮小磁碟寫滿前的安全邊際。"
