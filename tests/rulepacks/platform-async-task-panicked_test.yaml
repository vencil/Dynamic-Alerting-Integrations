# promtool behavioural test for TenantApiAsyncTaskPanicked (#2913):
#   1) FIRES on a SINGLE panic (counter 0 -> 1) once the 5m hold-down passes —
#      the `> 0` threshold is the point: any panic is a tenant-api bug.
#   2) does NOT fire while the counter stays 0.
#   3) does NOT fire before the 5m hold-down (discriminates `for: 5m`).
#   4) CLEARS once the panic has left the 15m window.
#   5) a pod restart (counter back to 0, then flat) does NOT fire.
# Run: promtool test rules tests/rulepacks/platform-async-task-panicked_test.yaml
rule_files:
  - platform-async-task-panicked.rules.yaml

evaluation_interval: 1m

tests:
  # Counter 0 for 10m, one panic at 10m, flat at 1 afterwards.
  # ⚠️ The eval at 16m is the DISCRIMINATOR for the `> 0` threshold: increase()
  # over the window is ~1 there, so a `> 1` rule would stay silent.
  - interval: 1m
    name: single-panic-fires
    input_series:
      - series: 'tenant_api_async_task_panics_total{job="tenant-api", instance="10.0.0.2:8080"}'
        values: '0x9 1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: TenantApiAsyncTaskPanicked
        exp_alerts:
          - exp_labels:
              severity: warning
              alert_source: platform
              job: tenant-api
              instance: 10.0.0.2:8080
            exp_annotations:
              summary: "tenant-api async batch task panicked — task marked failed, tenant-api bug"

  # ⚠️ The eval at 13m is the DISCRIMINATOR for `for: 5m`: increase() is already
  # > 0 there (panic at 10m), so a rule without the hold-down would fire.
  # The eval at 40m checks the alert clears once the 0 samples left the window.
  - interval: 1m
    name: hold-down-and-clear
    input_series:
      - series: 'tenant_api_async_task_panics_total{job="tenant-api", instance="10.0.0.2:8080"}'
        values: '0x9 1x40'
    alert_rule_test:
      - eval_time: 13m
        alertname: TenantApiAsyncTaskPanicked
        exp_alerts: []
      - eval_time: 40m
        alertname: TenantApiAsyncTaskPanicked
        exp_alerts: []

  - interval: 1m
    name: no-panic-no-fire
    input_series:
      - series: 'tenant_api_async_task_panics_total{job="tenant-api", instance="10.0.0.2:8080"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: TenantApiAsyncTaskPanicked
        exp_alerts: []

  # Counter at 3 (old panics, long out of window), then the process restarts
  # and the counter starts again at 0. increase() treats the drop as a reset
  # and adds the new value (0), so nothing fires.
  - interval: 1m
    name: restart-reset-no-fire
    input_series:
      - series: 'tenant_api_async_task_panics_total{job="tenant-api", instance="10.0.0.2:8080"}'
        values: '3x19 0x20'
    alert_rule_test:
      - eval_time: 30m
        alertname: TenantApiAsyncTaskPanicked
        exp_alerts: []
