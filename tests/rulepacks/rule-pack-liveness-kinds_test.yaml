# promtool unit test — 存活判定以 (tenant, pack) 為粒度（#3771）。
# Run: promtool test rules tests/rulepacks/rule-pack-liveness-kinds_test.yaml
#
# 對象：rule-pack-liveness.yaml 的內嵌存在判定（_lib_exporter_presence.py 生成）、
# TenantExporterAbsent（Rule A）、TenantExporterReplicaDown（Rule B）、
# TenantExporterUndeclared（Rule C），以及平台 pack 的 MassExporterOutage。
#   M1  租戶宣告 [mariadb, redis]；mariadb 唯一副本掛、redis 健康
#       → Absent{pack=mariadb} critical 響、redis 不響；Rule B 也響（warning）
#       （把 on(tenant, pack) 改回 on(tenant) 就轉紅：redis 的存在會擋住 mariadb）
#   M2  單值宣告（[mariadb]）、exporter 活著但 DB 連不上（mysql_up=0）→ 不響
#       （存在判定看 exporter 有沒有回應，DB 停機是 MariaDBDown 的事）
#   M3  兩種都健康 → 不響
#   M4  存在指標只認 job="tenant-exporters"：別的 job 的 mysql_up 不算 → 響
#   M5  rabbitmq 兩種 exporter：只有內建 plugin 的 rabbitmq_identity_info 也算在場 → 不響
#   U1  未宣告租戶有 exporter（存在指標在場）→ Undeclared 響（warning）；宣告過的租戶不響
#   U4  （併在 U1）未宣告、只有應用自己 /metrics 的租戶 → 不響（沒有任何 kind 的存在指標）
#   U4b （併在 U1）未宣告、應用順帶吐 jvm_* → 不響（jvm：undeclared_notice: false，#4097）
#   U8  未宣告、有 nginx exporter → Undeclared{pack=nginx} 響；旁邊的 jvm_* 不被點名（#4097）
#   M6  宣告 [nginx, jvm]、nginx 缺席 → Absent{pack=nginx} 響、jvm 不響（#4097）
#   M7  宣告 [jvm]、JVM target 不見 → Absent{pack=jvm} 響；只吐舊名的 JVM 算在場（#4097）
#   U5  未宣告租戶的 exporter 全掛 → 仍響（左手邊回看 1h），1h 後才解除
#   U2  沒有任何租戶宣告 _expected_exporters、threshold-exporter 活著 → Undeclared 照響
#       （守門讀 tenant_metadata_info，不是 tenant_expected_exporter；守門改讀後者就轉紅）
#   U3  threshold-exporter 全掛（tenant_metadata_info、tenant_expected_exporter 都缺席）
#       → Undeclared 一條都不響（拿掉守門就對每個租戶齊響）
#   U6  宣告 [mariadb]、同時跑 redis exporter → Undeclared{pack=redis} 響、mariadb 不響
#       （整租戶 unless on(tenant) 會漏掉 redis）
#   U7  退租：conf.d 與 exporter 一起移除（tenant_metadata_info 不再有該租戶，其他租戶
#       仍有）→ Undeclared 不響（守門改回 on() 就在回看期間誤報）
#   P1  6 個租戶各宣告 [mariadb, redis]、mariadb 全掛 → MassExporterOutage 響，
#       $value＝6 個租戶，比例 6/12 組（舊的 on(tenant) 下 redis 擋住全部、不響）
#   P2  同形狀只有 5 個租戶 → 5 不 > 5，不響
#   P3  1 個租戶宣告 7 種全掛 + 49 個健康租戶 → 不響（7 組但只 1 個租戶；比例 7/56＞10%）
# tenant id 用 t-* placeholder（dev-rule：fixture 不寫死真實租戶名）。
rule_files:
  - ../../rule-packs/rule-pack-liveness.yaml
  - ../../rule-packs/rule-pack-platform.yaml

evaluation_interval: 1m

tests:
  # ── M1 #3771 情境：mariadb 唯一副本掛、同租戶 redis 健康
  - interval: 1m
    name: M1-mariadb-down-redis-up-absent-fires-for-mariadb
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t-multi", pack="mariadb"}'
        values: '1x20'
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t-multi", pack="redis"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-multi", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1 0x19'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-multi", instance="10.1.0.1:9104", pod="mdb-0", service="mdb"}'
        values: '1 stale'
      - series: 'up{job="tenant-exporters", tenant="t-multi", instance="10.1.0.5:9121", pod="rds-0", service="rds"}'
        values: '1x20'
      - series: 'redis_up{job="tenant-exporters", tenant="t-multi", instance="10.1.0.5:9121", pod="rds-0", service="rds"}'
        values: '1x20'
      - series: 'tenant_metadata_info{job="threshold-exporter", tenant="t-multi", owner="", runbook_url="", tier=""}'
        values: '1x20'
    alert_rule_test:
      # 1m 起缺席；for:3m → 3m 還在 pending，5m 已 firing（存在判定內嵌在 expr 裡，
      # 不依賴其他規則的評估順序）。
      - eval_time: 3m
        alertname: TenantExporterAbsent
        exp_alerts: []
      - eval_time: 5m
        alertname: TenantExporterAbsent
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: t-multi
              pack: mariadb
              job: threshold-exporter
            exp_annotations:
              summary: "Exporter absent for tenant t-multi (mariadb)"
              summary_zh: "租戶 t-multi (mariadb) 的 exporter 缺席"
              description: "No mariadb exporter of tenant t-multi has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs mariadb, remove it from _expected_exporters; if the tenant was de-provisioned, remove its conf.d entry too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t-multi 的 mariadb exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 mariadb，請從 _expected_exporters 移除；若租戶已退租，請確認 conf.d 裡它的設定也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""
      # Rule B（副本級）同時響：同租戶 redis 的 up==1 是它的右側。
      - eval_time: 12m
        alertname: TenantExporterReplicaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              job: tenant-exporters
              tenant: t-multi
              instance: "10.1.0.1:9104"
              pod: mdb-0
              service: mdb
            exp_annotations:
              summary: "Exporter target 10.1.0.1:9104 down for tenant t-multi (another tenant-exporters target of the tenant is up)"
              summary_zh: "租戶 t-multi 的 exporter target 10.1.0.1:9104 停機（同租戶仍有其他 tenant-exporters target 為 up）"
              description: "Target 10.1.0.1:9104 (pod mdb-0) of tenant t-multi has read up=0 for 10m while at least one other up{job=\"tenant-exporters\"} target of the same tenant reads up=1. That target may belong to a different Service: if Service mdb has no other replica, its metrics are no longer scraped at all. When it was the only exporter of one of the kinds the tenant declares in _expected_exporters, TenantExporterAbsent (critical) fires for that kind as well; when another Service of the same kind is still up, this warning is the only signal. If every target of the tenant goes down, this alert resolves and TenantExporterAbsent takes over. Only tenants that declare _expected_exporters get this alert; an undeclared tenant gets TenantExporterUndeclared instead."
              description_zh: "租戶 t-multi 的 target 10.1.0.1:9104（pod mdb-0）已 10 分鐘 up=0，同時同租戶仍有至少一個 up{job=\"tenant-exporters\"} target 為 up=1。那個 target 可能屬於別的 Service：若 Service mdb 沒有其他副本，它的指標已完全沒被抓取。它若是租戶在 _expected_exporters 宣告的某個 kind 唯一的 exporter，TenantExporterAbsent（critical）也會對那個 kind 響；同一個 kind 若還有別的 Service 是 up，本告警就是唯一的訊號。若租戶所有 target 都掛，本告警會解除，改由 TenantExporterAbsent 接手。只有宣告了 _expected_exporters 的租戶才會收到本告警；沒宣告的租戶改收 TenantExporterUndeclared。"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 12m
        alertname: TenantExporterUndeclared
        exp_alerts: []

  # ── M2 單值宣告、exporter 活著但 DB 連不上（mysql_up=0 仍在場）→ Absent 不響
  - interval: 1m
    name: M2-single-declaration-exporter-alive-db-down-no-absent
    input_series:
      - series: 'tenant_expected_exporter{tenant="t-single", pack="mariadb"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-single", instance="10.2.0.1:9104"}'
        values: '1x20'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-single", instance="10.2.0.1:9104"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: TenantExporterAbsent
        exp_alerts: []

  # ── M3 兩種都健康 → 什麼都不響
  - interval: 1m
    name: M3-both-kinds-healthy-nothing-fires
    input_series:
      - series: 'tenant_expected_exporter{tenant="t-multi", pack="mariadb"}'
        values: '1x20'
      - series: 'tenant_expected_exporter{tenant="t-multi", pack="redis"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-multi", instance="10.1.0.1:9104"}'
        values: '1x20'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-multi", instance="10.1.0.1:9104"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-multi", instance="10.1.0.5:9121"}'
        values: '1x20'
      - series: 'redis_up{job="tenant-exporters", tenant="t-multi", instance="10.1.0.5:9121"}'
        values: '1x20'
      - series: 'tenant_metadata_info{tenant="t-multi", owner="", runbook_url="", tier=""}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: TenantExporterAbsent
        exp_alerts: []
      - eval_time: 16m
        alertname: TenantExporterReplicaDown
        exp_alerts: []
      - eval_time: 16m
        alertname: TenantExporterUndeclared
        exp_alerts: []

  # ── M4 存在指標只認 job="tenant-exporters"：別的 job 的 mysql_up 不算在場 → 響
  - interval: 1m
    name: M4-presence-from-another-job-does-not-count
    input_series:
      - series: 'tenant_expected_exporter{tenant="t-single", pack="mariadb"}'
        values: '1x20'
      - series: 'mysql_up{job="other-scrape", tenant="t-single", instance="10.9.0.1:9104"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: TenantExporterAbsent
        exp_alerts:
          - exp_labels:
              maintenance: page
              severity: critical
              tenant: t-single
              pack: mariadb
            exp_annotations:
              summary: "Exporter absent for tenant t-single (mariadb)"
              summary_zh: "租戶 t-single (mariadb) 的 exporter 缺席"
              description: "No mariadb exporter of tenant t-single has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs mariadb, remove it from _expected_exporters; if the tenant was de-provisioned, remove its conf.d entry too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t-single 的 mariadb exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 mariadb，請從 _expected_exporters 移除；若租戶已退租，請確認 conf.d 裡它的設定也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── M5 rabbitmq 內建 plugin（rabbitmq_identity_info，沒有 rabbitmq_up）也算在場
  - interval: 1m
    name: M5-rabbitmq-builtin-plugin-counts-as-present
    input_series:
      - series: 'tenant_expected_exporter{tenant="t-mq", pack="rabbitmq"}'
        values: '1x20'
      - series: 'up{job="tenant-exporters", tenant="t-mq", instance="10.3.0.1:15692"}'
        values: '1x20'
      - series: 'rabbitmq_identity_info{job="tenant-exporters", tenant="t-mq", instance="10.3.0.1:15692", rabbitmq_node="rabbit@mq-0", rabbitmq_cluster="mq"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: TenantExporterAbsent
        exp_alerts: []

  # ── U1 未宣告租戶有 target → Undeclared 響（for:15m）；宣告過的租戶不響
  - interval: 1m
    name: U1-undeclared-tenant-fires-declared-does-not
    input_series:
      - series: 'tenant_expected_exporter{tenant="t-declared", pack="mariadb"}'
        values: '1x30'
      - series: 'up{job="tenant-exporters", tenant="t-declared", instance="10.4.0.1:9104"}'
        values: '1x30'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-declared", instance="10.4.0.1:9104"}'
        values: '1x30'
      - series: 'tenant_metadata_info{tenant="t-declared", owner="", runbook_url="", tier=""}'
        values: '1x30'
      # 未宣告、有 DB exporter（mysql_up 在場）→ 響；另一個 target up=0 不影響。
      - series: 'up{job="tenant-exporters", tenant="t-loose", instance="10.4.0.2:9104"}'
        values: '1x30'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-loose", instance="10.4.0.2:9104"}'
        values: '1x30'
      - series: 'up{job="tenant-exporters", tenant="t-loose", instance="10.4.0.3:9104"}'
        values: '0x30'
      - series: 'tenant_metadata_info{tenant="t-loose", owner="", runbook_url="", tier=""}'
        values: '1x30'
      # U4：未宣告、只有應用自己的 /metrics 的租戶（沒有任何 kind 的存在指標）→ 不響。
      #     左手邊改回 up{job="tenant-exporters"} 就轉紅（t-app 也會響）。
      - series: 'up{job="tenant-exporters", tenant="t-app", instance="10.4.0.4:8080"}'
        values: '1x30'
      - series: 'http_requests_total{job="tenant-exporters", tenant="t-app", instance="10.4.0.4:8080"}'
        values: '1+1x30'
      - series: 'tenant_metadata_info{tenant="t-app", owner="", runbook_url="", tier=""}'
        values: '1x30'
      # U4b（#4097）：未宣告、應用順帶吐 jvm_*（新舊兩個名字都有）→ 不響。jvm 可以宣告，
      #     但 registry 標了 undeclared_notice: false，Undeclared 不點名它；把那個欄位拿掉
      #     （或讓左手邊涵蓋每一種 kind）就轉紅（t-java 會以 pack=jvm 響）。
      - series: 'up{job="tenant-exporters", tenant="t-java", instance="10.4.0.5:8080"}'
        values: '1x30'
      - series: 'jvm_memory_used_bytes{job="tenant-exporters", tenant="t-java", instance="10.4.0.5:8080", area="heap"}'
        values: '5x30'
      - series: 'jvm_memory_bytes_used{job="tenant-exporters", tenant="t-java", instance="10.4.0.5:8080", area="heap"}'
        values: '5x30'
      - series: 'tenant_metadata_info{tenant="t-java", owner="", runbook_url="", tier=""}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: TenantExporterUndeclared
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantExporterUndeclared
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              tenant: t-loose
              pack: mariadb
            exp_annotations:
              summary: "Tenant t-loose runs a mariadb exporter but does not declare mariadb in _expected_exporters"
              summary_zh: "租戶 t-loose 有 mariadb exporter 在回應，但沒有在 _expected_exporters 宣告 mariadb"
              description: "A mariadb exporter of tenant t-loose has answered under job=\"tenant-exporters\" within the last hour, but the tenant's _expected_exporters does not list mariadb, so TenantExporterAbsent does not cover that exporter: if it stops answering, nothing pages. Add mariadb to the tenant's top-level _expected_exporters list (for example _expected_exporters: [mariadb, redis])."
              description_zh: "租戶 t-loose 的 mariadb exporter 最近一小時內在 job=\"tenant-exporters\" 下回應過，但租戶的 _expected_exporters 沒有列出 mariadb，所以 TenantExporterAbsent 不涵蓋它：它停止回應時不會有任何告警。請把 mariadb 加進租戶頂層的 _expected_exporters 列表（例如 _expected_exporters: [mariadb, redis]）。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── U2 沒有任何租戶宣告 _expected_exporters（導入期），threshold-exporter 活著 → Undeclared 照響
  - interval: 1m
    name: U2-nobody-declared-yet-still-fires
    input_series:
      - series: 'up{job="tenant-exporters", tenant="t-loose", instance="10.4.0.2:9104"}'
        values: '1x30'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-loose", instance="10.4.0.2:9104"}'
        values: '1x30'
      - series: 'tenant_metadata_info{tenant="t-loose", owner="", runbook_url="", tier=""}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: TenantExporterUndeclared
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              tenant: t-loose
              pack: mariadb
            exp_annotations:
              summary: "Tenant t-loose runs a mariadb exporter but does not declare mariadb in _expected_exporters"
              summary_zh: "租戶 t-loose 有 mariadb exporter 在回應，但沒有在 _expected_exporters 宣告 mariadb"
              description: "A mariadb exporter of tenant t-loose has answered under job=\"tenant-exporters\" within the last hour, but the tenant's _expected_exporters does not list mariadb, so TenantExporterAbsent does not cover that exporter: if it stops answering, nothing pages. Add mariadb to the tenant's top-level _expected_exporters list (for example _expected_exporters: [mariadb, redis])."
              description_zh: "租戶 t-loose 的 mariadb exporter 最近一小時內在 job=\"tenant-exporters\" 下回應過，但租戶的 _expected_exporters 沒有列出 mariadb，所以 TenantExporterAbsent 不涵蓋它：它停止回應時不會有任何告警。請把 mariadb 加進租戶頂層的 _expected_exporters 列表（例如 _expected_exporters: [mariadb, redis]）。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── U3 threshold-exporter 全掛：它發的 tenant_metadata_info、tenant_expected_exporter
  #    都缺席 → Undeclared 一條都不響（拿掉守門就對兩個租戶齊響）
  - interval: 1m
    name: U3-threshold-exporter-down-undeclared-silent
    input_series:
      - series: 'up{job="tenant-exporters", tenant="t-declared", instance="10.4.0.1:9104"}'
        values: '1x30'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-declared", instance="10.4.0.1:9104"}'
        values: '1x30'
      - series: 'up{job="tenant-exporters", tenant="t-loose", instance="10.4.0.2:9104"}'
        values: '1x30'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-loose", instance="10.4.0.2:9104"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: TenantExporterUndeclared
        exp_alerts: []

  # ── U5 未宣告租戶的 DB exporter 全掛（存在指標在 60m 後消失）→ Undeclared 不自己解除
  #    （左手邊回看 1h），最後一個樣本（60m）1h 後才解除。左手邊不回看就在 ~65m 解除、轉紅。
  - interval: 1m
    name: U5-undeclared-stays-after-exporters-vanish-for-1h
    input_series:
      - series: 'mysql_up{job="tenant-exporters", tenant="t-loose", instance="10.4.0.2:9104"}'
        values: '1x60 _x200'
      - series: 'tenant_metadata_info{tenant="t-loose", owner="", runbook_url="", tier=""}'
        values: '1x260'
    promql_expr_test:
      - expr: count by(tenant) (ALERTS{alertstate="firing", alertname="TenantExporterUndeclared"})
        eval_time: 50m
        exp_samples:
          - labels: '{tenant="t-loose"}'
            value: 1
      - expr: count by(tenant) (ALERTS{alertstate="firing", alertname="TenantExporterUndeclared"})
        eval_time: 110m
        exp_samples:
          - labels: '{tenant="t-loose"}'
            value: 1
