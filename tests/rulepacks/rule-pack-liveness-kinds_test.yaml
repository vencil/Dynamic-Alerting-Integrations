              maintenance: mute
              tenant: t-edge
              pack: nginx
            exp_annotations:
              summary: "Tenant t-edge runs a nginx exporter but does not declare nginx in _expected_exporters"
              summary_zh: "租戶 t-edge 有 nginx exporter 在回應，但沒有在 _expected_exporters 宣告 nginx"
              description: "A nginx exporter of tenant t-edge has answered under job=\"tenant-exporters\" within the last hour, but the tenant's _expected_exporters does not list nginx, so TenantExporterAbsent does not cover that exporter: if it stops answering, nothing pages. Add nginx to the tenant's top-level _expected_exporters list (for example _expected_exporters: [mariadb, redis])."
              description_zh: "租戶 t-edge 的 nginx exporter 最近一小時內在 job=\"tenant-exporters\" 下回應過，但租戶的 _expected_exporters 沒有列出 nginx，所以 TenantExporterAbsent 不涵蓋它：它停止回應時不會有任何告警。請把 nginx 加進租戶頂層的 _expected_exporters 列表（例如 _expected_exporters: [mariadb, redis]）。"
              runbook_url: ""
              owner: ""
              tier: ""

