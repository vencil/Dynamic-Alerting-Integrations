  # ── M6 #4097：nginx、jvm 也是可宣告的 kind。租戶宣告 [nginx, jvm]；nginx exporter 掛
  #    （nginx_up 缺席）、JVM 還在吐 jvm_memory_used_bytes → Absent{pack=nginx} 響、jvm 不響。
  #    （把 nginx 從 registry 的 presence 拿掉、或左手邊不發 pack=nginx，本測試轉紅：
  #    v2.9 的 db_type 沒有 nginx 這個值，只跑 nginx 的租戶宣告不了任何東西。）
  - interval: 1m
    name: M6-nginx-declared-and-absent-fires-jvm-present-does-not
    input_series:
      - series: 'tenant_expected_exporter{tenant="t-web", pack="nginx"}'
        values: '1x20'
      - series: 'tenant_expected_exporter{tenant="t-web", pack="jvm"}'
        values: '1x20'
      - series: 'nginx_up{job="tenant-exporters", tenant="t-web", instance="10.6.0.1:9113"}'
        values: '1 stale'
      - series: 'jvm_memory_used_bytes{job="tenant-exporters", tenant="t-web", instance="10.6.0.2:8080", area="heap"}'
        values: '5x20'
      - series: 'tenant_metadata_info{tenant="t-web", owner="", runbook_url="", tier=""}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: TenantExporterAbsent
        exp_alerts: []
      - eval_time: 5m
        alertname: TenantExporterAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              maintenance: page
              tenant: t-web
              pack: nginx
            exp_annotations:
              summary: "Exporter absent for tenant t-web (nginx)"
              summary_zh: "租戶 t-web (nginx) 的 exporter 缺席"
              description: "No nginx exporter of tenant t-web has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs nginx, remove it from _expected_exporters; if the tenant was de-provisioned, remove its conf.d entry too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t-web 的 nginx exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 nginx，請從 _expected_exporters 移除；若租戶已退租，請確認 conf.d 裡它的設定也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── M7 #4097：宣告 [jvm]、JVM 的 target 整個不見 → Absent{pack=jvm} 響；另一個租戶的
  #    JVM 只吐舊名 jvm_memory_bytes_used（jmx_exporter 1.0 之前）也算在場 → 不響。
  - interval: 1m
    name: M7-jvm-declared-and-absent-fires-old-metric-name-counts
    input_series:
      - series: 'tenant_expected_exporter{tenant="t-app", pack="jvm"}'
        values: '1x20'
      - series: 'jvm_memory_used_bytes{job="tenant-exporters", tenant="t-app", instance="10.6.1.1:8080", area="heap"}'
        values: '5 stale'
      - series: 'tenant_metadata_info{tenant="t-app", owner="", runbook_url="", tier=""}'
        values: '1x20'
      - series: 'tenant_expected_exporter{tenant="t-legacy", pack="jvm"}'
        values: '1x20'
      - series: 'jvm_memory_bytes_used{job="tenant-exporters", tenant="t-legacy", instance="10.6.1.2:8080", area="heap"}'
        values: '5x20'
      - series: 'tenant_metadata_info{tenant="t-legacy", owner="", runbook_url="", tier=""}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: TenantExporterAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              maintenance: page
              tenant: t-app
              pack: jvm
            exp_annotations:
              summary: "Exporter absent for tenant t-app (jvm)"
              summary_zh: "租戶 t-app (jvm) 的 exporter 缺席"
              description: "No jvm exporter of tenant t-app has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs jvm, remove it from _expected_exporters; if the tenant was de-provisioned, remove its conf.d entry too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t-app 的 jvm exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 jvm，請從 _expected_exporters 移除；若租戶已退租，請確認 conf.d 裡它的設定也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""

  # ── U8 #4097：未宣告、有 nginx exporter 在回應 → Undeclared{pack=nginx} 響（nginx 現在是
  #    可宣告的 kind，沒宣告就沒有 Absent 涵蓋它）。同一個租戶順帶吐的 jvm_* 不被點名
  #    （registry：jvm 標 undeclared_notice: false）。
  - interval: 1m
    name: U8-undeclared-nginx-fires-jvm-beside-it-does-not
    input_series:
      - series: 'nginx_up{job="tenant-exporters", tenant="t-edge", instance="10.6.2.1:9113"}'
        values: '1x30'
      - series: 'jvm_memory_used_bytes{job="tenant-exporters", tenant="t-edge", instance="10.6.2.2:8080", area="heap"}'
