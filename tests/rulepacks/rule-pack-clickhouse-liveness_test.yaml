# ============================================================
# ClickHouse liveness (#3618, owner decision B′; shim removed in #3682).
#
# ClickHouse serves /metrics itself (no separate exporter), so its target
# being down IS the server being down, and TenantExporterAbsent
# (rule-pack-liveness.yaml) is what pages for it. ClickHouseDown is gone
# (#3682): the assertions on it below expect nothing, so the old shim coming
# back (it would page twice for one outage) turns this red. A rule of that
# name selecting another job would not fire here and stays green.
#
# Two tenants are down at once — a ClickHouse one and a PostgreSQL one — both
# scraped by the shipped job tenant-exporters:
#   2m30s  nothing yet (TenantExporterAbsent's for: 3m).
#   3m30s  TenantExporterAbsent fires for BOTH tenants; nothing else.
# Tenant ids are fixture-local placeholders.
# ============================================================
rule_files:
  - ../../rule-packs/rule-pack-clickhouse.yaml
  - ../../rule-packs/rule-pack-liveness.yaml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      - series: 'up{job="tenant-exporters", instance="t-ch", tenant="t-ch"}'
        values: '0x10'
      - series: 'up{job="tenant-exporters", instance="t-pg", tenant="t-pg"}'
        values: '0x10'
      - series: 'tenant_expected_exporter{tenant="t-ch", db_type="clickhouse"}'
        values: '1x10'
      - series: 'tenant_expected_exporter{tenant="t-pg", db_type="postgresql"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: ClickHouseDown
        exp_alerts: []
      - eval_time: 2m30s
        alertname: TenantExporterAbsent
        exp_alerts: []
      - eval_time: 3m30s
        alertname: TenantExporterAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              maintenance: page
              tenant: t-ch
              db_type: clickhouse
            exp_annotations:
              summary: "Exporter absent for tenant t-ch (clickhouse)"
              summary_zh: "租戶 t-ch (clickhouse) 的 exporter 缺席"
              description: "No clickhouse exporter of tenant t-ch has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs clickhouse, remove it from _metadata.db_type; if the tenant was de-provisioned, remove its conf.d _metadata too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t-ch 的 clickhouse exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 clickhouse，請從 _metadata.db_type 移除；若租戶已退租，請確認 conf.d _metadata 也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              severity: critical
              maintenance: page
              tenant: t-pg
              db_type: postgresql
            exp_annotations:
              summary: "Exporter absent for tenant t-pg (postgresql)"
              summary_zh: "租戶 t-pg (postgresql) 的 exporter 缺席"
              description: "No postgresql exporter of tenant t-pg has answered a scrape under job=\"tenant-exporters\" for 3m (its presence metric is absent; other exporter kinds of the tenant may still be up). Either the exporter pod is down (up=0, Service alive) or the tenant's scrape target was removed (series absent). If the tenant no longer runs postgresql, remove it from _metadata.db_type; if the tenant was de-provisioned, remove its conf.d _metadata too (otherwise this is a stale-config false positive)."
              description_zh: "租戶 t-pg 的 postgresql exporter 已 3 分鐘沒有在 job=\"tenant-exporters\" 下回應 scrape（它的存在指標缺席；同租戶其他種類的 exporter 可能仍正常）。可能是 exporter pod 掛了 (up=0、Service 還在) 或租戶的 scrape target 被移除 (series 缺席)。若租戶已不再使用 postgresql，請從 _metadata.db_type 移除；若租戶已退租，請確認 conf.d _metadata 也一併移除 (否則這是殘留組態造成的假陽性)。"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 3m30s
        alertname: ClickHouseDown
        exp_alerts: []
