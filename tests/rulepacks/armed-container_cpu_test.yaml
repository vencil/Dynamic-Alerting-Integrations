# promtool unit test — the shipped default of container_cpu.
# One tenant, the registry's value as its warning threshold: silent below it,
# pending once above it, firing when `for:` has passed.
# tests/rulepacks/test_armed_key_binding.py holds the shape of this file and
# replays it with the threshold moved to both extremes.
rule_files:
  - ../../rule-packs/rule-pack-kubernetes.yaml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      # 75 % of a 1-core limit for 10m (11.25 CPU-seconds per 15s), then 90 % (13.5).
      - series: 'container_cpu_usage_seconds_total{namespace="db-armed", pod="app-1", container="app"}'
        values: '0+11.25x40 463.5+13.5x40'
      - series: 'kube_pod_container_resource_limits{resource="cpu", namespace="db-armed", pod="app-1", container="app"}'
        values: '1x81'
      - series: 'kube_pod_labels{namespace="db-armed", pod="app-1"}'
        values: '1x81'
      - series: 'user_threshold{tenant="db-armed", component="container", metric="cpu", severity="warning"}'
        values: '80x81'
    promql_expr_test:
      # Below the threshold, long past `for:` — silent.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="PodContainerHighCPU"})
        eval_time: 9m
        exp_samples: []
      # Above it, `for:` not yet served — pending, not firing.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="pending", alertname="PodContainerHighCPU"})
        eval_time: 12m30s
        exp_samples:
          - labels: '{alertname="PodContainerHighCPU", tenant="db-armed"}'
            value: 1
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="PodContainerHighCPU"})
        eval_time: 12m30s
        exp_samples: []
      # `for:` served — firing.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="PodContainerHighCPU"})
        eval_time: 18m
        exp_samples:
          - labels: '{alertname="PodContainerHighCPU", tenant="db-armed"}'
            value: 1
