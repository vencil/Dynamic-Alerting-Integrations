# promtool unit test — MassExporterOutage 以 (tenant, pack) 為單位計數，不是以列（#4097）。
# Run: promtool test rules tests/rulepacks/platform-mass-outage-per-cluster_test.yaml
#
# `_expected_exporters` 的條目可以是 `kind@cluster`：一個 (tenant, pack) 宣告了三個叢集，
# 在 tenant_expected_exporter 是三列，在 TenantExporterAbsent 最多三列。MassExporterOutage
# 的比例兩邊都先收成「組」再數；門檻（> 5）數的是租戶。
#   Q1  6 個租戶各宣告 mariadb@a、@b、@c，各自只有叢集 c 缺席；另有 48 個只寫 kind 的健康租戶
#       → 缺席 6 組／共 54 組＝11.1% ＞ 10%、6 個租戶 ＞ 5 → 響，$value＝6
#       （以列計：分子 6 列／分母 18＋48＝66 列＝9.1% → 不響）
#   Q2  6 個租戶各宣告三個叢集、三個叢集【全部】缺席；另有 60 個健康租戶
#       → 缺席 6 組／共 66 組＝9.1% → 不響
#       （以列計：18／78＝23% → 響；只把分子收成組、分母仍以列計：6／78 → 不響，Q1 會抓到）
#   Q3  5 個租戶各宣告三個叢集、全部缺席；另有 20 個健康租戶 → 5 組／25 組＝20%，但只有 5 個
#       租戶，不 ＞ 5 → 不響（門檻若數到逐叢集的列，會是 15）
# 門檻與比例都是【全艦隊】的：宣告由各邊緣叢集的 threshold-exporter 經 federation 送來時，
# 每一列帶著來源的 da_cluster；組若留著它，門檻與比例就變成逐來源各算一次。R1–R3 是同一個
# 「6 個缺席租戶／共 50 組＝12%」，只差宣告怎麼分散在來源上——三者都必須是【一則】、6 tenants、
# 告警上沒有 da_cluster（規則的門檻是 ＞ 5 個租戶且 ＞ 10%，所以 3+3 也要響）：
#   R1  3+3  三個缺席租戶的宣告經 east 來、三個經 west 來（逐來源計：各 3，不 ＞ 5 → 不響）
#   R2  6+0  六個都經 east 來（逐來源計：響一則，但帶 da_cluster="east"）
#   R3  6+6  同六個租戶（mariadb@east）的宣告由 east、west 各送一份（逐來源計：兩則）
# tenant_expected_exporter 帶 threshold-exporter 自己的 job／instance／pod，與只寫 kind 的列
# 一樣：兩種列收成組之後要落在同一組，告警才只有一則。
# tenant id 用 t-* placeholder（dev-rule：fixture 不寫死真實租戶名）。序列逐條寫出，不靠樣板。
rule_files:
  - ../../rule-packs/rule-pack-platform.yaml

evaluation_interval: 1m

tests:
  # ── Q1 每個租戶三個叢集裡缺一個：一組算一組
  - interval: 1m
    name: Q1-one-of-three-clusters-absent-is-one-pair
    input_series:
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t-m01", pack="mariadb", expected_cluster="a"}'
        values: '1x10'
      - series: 'mysql_up{job="tenant-exporters", tenant="t-m01", instance="10.1.0.1:9104", da_cluster="a"}'
        values: '1x10'
      - series: 'up{job="tenant-exporters", tenant="t-m01", instance="10.1.0.1:9104", da_cluster="a"}'
        values: '1x10'
      - series: 'tenant_expected_exporter{job="threshold-exporter", instance="10.0.0.9:8080", pod="te-0", tenant="t-m01", pack="mariadb", expected_cluster="b"}'
