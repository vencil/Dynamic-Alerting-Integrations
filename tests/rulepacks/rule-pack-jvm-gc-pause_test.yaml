# promtool unit test — the UNIT of the JVM GC pause thresholds (#4032).
# Run: promtool test rules tests/rulepacks/rule-pack-jvm-gc-pause_test.yaml
#
# jvm_gc_pause / jvm_gc_pause_critical are compared with
# rate(jvm_gc_pause_seconds_sum[5m]): seconds of GC pause accrued PER SECOND.
# The registry called the unit "seconds/5m" until #4032 — the same quantity
# scaled by 300. This file pins which of the two the rule computes, with
# pause totals whose two readings fall on opposite sides of the threshold:
#   t-hi    +9 s per 15s   = 0.6 s/s  (180 s per 5m)  > 0.5  ⇒ warning fires
#   t-lo    +3.75 s per 15s = 0.25 s/s ( 75 s per 5m) < 0.5  ⇒ quiet. Read as
#           seconds per 5m (an increase() rule) 75 is far above 0.5 and fires.
#   t-crit  +18 s per 15s  = 1.2 s/s                  > 1.0  ⇒ critical fires
#   t-sum   two JVMs at +4.5 s per 15s = 0.3 s/s each  ⇒ 0.6 together > 0.5:
#           the rule adds the tenant's JVMs up (a rule taking the busiest
#           JVM, or their average, reads 0.3 and stays quiet).
# Assertions sit at 10m / 8m. With series starting at t=0 Prometheus' rate()
# ramps with window coverage (#946): it passes each threshold at 4m15s, so
# `for: 5m` / `for: 3m` end at 9m15s / 7m15s; VictoriaMetrics reads the full
# rate from the first ticks and fires earlier (5m15s / 3m15s). By the asserted
# times the window is fully covered and $value is the same on both. At 3m / 2m
# neither engine fires yet (Prometheus: not over the threshold; VM: pending).
rule_files:
  - ../../rule-packs/rule-pack-jvm.yaml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      - series: 'jvm_gc_pause_seconds_sum{tenant="t-hi", instance="app-1:8080"}'
        values: '0+9x48'
      - series: 'user_threshold{tenant="t-hi", component="jvm", metric="gc_pause", severity="warning"}'
        values: '0.5x48'
      - series: 'jvm_gc_pause_seconds_sum{tenant="t-lo", instance="app-2:8080"}'
        values: '0+3.75x48'
      - series: 'user_threshold{tenant="t-lo", component="jvm", metric="gc_pause", severity="warning"}'
        values: '0.5x48'
      - series: 'jvm_gc_pause_seconds_sum{tenant="t-sum", instance="app-4:8080"}'
        values: '0+4.5x48'
      - series: 'jvm_gc_pause_seconds_sum{tenant="t-sum", instance="app-5:8080"}'
        values: '0+4.5x48'
      - series: 'user_threshold{tenant="t-sum", component="jvm", metric="gc_pause", severity="warning"}'
        values: '0.5x48'
      - series: 'jvm_gc_pause_seconds_sum{tenant="t-crit", instance="app-3:8080"}'
        values: '0+18x48'
      - series: 'user_threshold{tenant="t-crit", component="jvm", metric="gc_pause", severity="critical"}'
        values: '1x48'
    alert_rule_test:
      - eval_time: 3m
        alertname: JVMHighGCPause
        exp_alerts: []
      - eval_time: 10m
        alertname: JVMHighGCPause
        exp_alerts:
          - exp_labels:
              severity: warning
              maintenance: mute
              metric_group: jvm_gc_pause
              tenant: t-hi
            exp_annotations:
              summary: "JVMHighGCPause on t-hi"
              summary_zh: "t-hi 上 JVM GC pause 過高"
              platform_summary: "[] t-hi: GC pause elevated — JVM tuning review"
              platform_summary_zh: "[] t-hi：GC pause 升高 — JVM 調優審查"
              description: "GC pause 0.600 s/s (seconds paused per second, all JVMs of the tenant) exceeds threshold"
              description_zh: "GC pause 0.600 秒/秒（每秒暫停的秒數，租戶所有 JVM 加總）超出閾值"
              runbook_url: ""
              owner: ""
              tier: ""
          - exp_labels:
              severity: warning
              maintenance: mute
              metric_group: jvm_gc_pause
              tenant: t-sum
            exp_annotations:
              summary: "JVMHighGCPause on t-sum"
              summary_zh: "t-sum 上 JVM GC pause 過高"
              platform_summary: "[] t-sum: GC pause elevated — JVM tuning review"
              platform_summary_zh: "[] t-sum：GC pause 升高 — JVM 調優審查"
              description: "GC pause 0.600 s/s (seconds paused per second, all JVMs of the tenant) exceeds threshold"
              description_zh: "GC pause 0.600 秒/秒（每秒暫停的秒數，租戶所有 JVM 加總）超出閾值"
              runbook_url: ""
              owner: ""
              tier: ""
      - eval_time: 2m
        alertname: JVMHighGCPauseCritical
        exp_alerts: []
      - eval_time: 8m
        alertname: JVMHighGCPauseCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              maintenance: mute
              metric_group: jvm_gc_pause
              tenant: t-crit
            exp_annotations:
              summary: "JVMHighGCPauseCritical on t-crit"
              summary_zh: "t-crit 上 JVM GC pause 嚴重過高"
              platform_summary: "[] t-crit: critical GC pause — application performance impacted"
              platform_summary_zh: "[] t-crit：嚴重 GC pause — 應用程式效能受影響"
              description: "GC pause 1.200 s/s (seconds paused per second, all JVMs of the tenant) exceeds critical threshold"
              description_zh: "GC pause 1.200 秒/秒（每秒暫停的秒數，租戶所有 JVM 加總）超出嚴重閾值"
              runbook_url: ""
              owner: ""
              tier: ""
