# promtool unit test — the shipped default of db2_tablespace_used_percent.
# One tenant, the registry's value as its warning threshold: silent below it,
# pending once above it, firing when `for:` has passed.
# tests/rulepacks/test_armed_key_binding.py holds the shape of this file and
# replays it with the threshold moved to both extremes.
rule_files:
  - ../../rule-packs/rule-pack-db2.yaml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      # The fullest tablespace at 75 % for 10m, then 85 %.
      - series: 'db2_tablespace_used_percent{tenant="t-armed", instance="db-0", tablespace="USERSPACE1"}'
        values: '75x40 85x40'
      - series: 'user_threshold{tenant="t-armed", component="db2", metric="tablespace_used_percent", severity="warning"}'
        values: '80x81'
    promql_expr_test:
      # Below the threshold, long past `for:` — silent.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="DB2TablespaceAlmostFull"})
        eval_time: 8m
        exp_samples: []
      # Above it, `for:` not yet served — pending, not firing.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="pending", alertname="DB2TablespaceAlmostFull"})
        eval_time: 12m
        exp_samples:
          - labels: '{alertname="DB2TablespaceAlmostFull", tenant="t-armed"}'
            value: 1
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="DB2TablespaceAlmostFull"})
        eval_time: 12m
        exp_samples: []
      # `for:` served — firing.
      - expr: count by(alertname, tenant) (ALERTS{alertstate="firing", alertname="DB2TablespaceAlmostFull"})
        eval_time: 17m
        exp_samples:
          - labels: '{alertname="DB2TablespaceAlmostFull", tenant="t-armed"}'
            value: 1
