# promtool unit test — #731 exporter↔rule-pack metric-label contract (jvm).
# Proves the threshold recording rules resolve under the REAL exporter shape
# `user_threshold{component="jvm", metric="gc_time_percent"}` (a rule querying the
# full key as `metric=` reads nothing and stays silent, #731). Covers warning + the
# `_critical` severity-split tier.
# Run: promtool test rules tests/rulepacks/rule-pack-jvm-threshold_test.yaml
rule_files:
  - ../../rule-packs/rule-pack-jvm.yaml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      - series: 'user_threshold{tenant="t1", component="jvm", metric="gc_time_percent", severity="warning"}'
        values: '10x5'
      - series: 'user_threshold{tenant="t1", component="jvm", metric="gc_time_percent", severity="critical"}'
        values: '25x5'
    promql_expr_test:
      - expr: tenant:alert_threshold:jvm_gc_time_percent
        eval_time: 1m
        exp_samples:
          - labels: 'tenant:alert_threshold:jvm_gc_time_percent{tenant="t1"}'
            value: 10
      - expr: tenant:alert_threshold:jvm_gc_time_percent_critical
        eval_time: 1m
        exp_samples:
          - labels: 'tenant:alert_threshold:jvm_gc_time_percent_critical{tenant="t1"}'
            value: 25
