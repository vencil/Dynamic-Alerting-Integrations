        eval_time: 12m
        exp_samples:
          - labels: '{tenant="t-1", instance="10.1.0.1:9104", da_cluster="west"}'
            value: 1
      # 只寫 kind：Rule A 被 east 擋住。
      - expr: ALERTS{alertname="TenantExporterAbsent"}
        eval_time: 12m
        exp_samples: []
