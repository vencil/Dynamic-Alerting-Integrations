# Bare-rules promtool target for the TenantApiStoreScanStale alert. promtool
# can't consume the deployed ConfigMap directly (it needs a top-level `groups:`
# document, not `data: platform-alert.yml: |`), so this is an EXTRACTED COPY of
# the alert from k8s/03-monitoring/configmap-rules-platform.yaml.
#
# ⚠️ KEEP IN SYNC with that ConfigMap — the expr/for/labels/summary here must match
# byte-for-byte. tests/rulepacks/test_platform_rules_extract_sync.py enforces it.
groups:
  - name: platform-self-monitoring
    rules:
      - alert: TenantApiStoreScanStale
        expr: |
          (time() - tenant_api_store_scan_last_success_timestamp_seconds{job="tenant-api"} > 300)
          or
          (tenant_api_up{job="tenant-api"} unless on (job, instance) tenant_api_store_scan_last_success_timestamp_seconds{job="tenant-api"})
        for: 10m
        labels:
          severity: warning
          alert_source: platform
        annotations:
          summary: "tenant-api cannot measure its conf.d copy — TenantApiStoreUnreadable is blind"
