# promtool behavioural test for BuiltinDefaultsDigestMismatch (#3831, #3832
# decision 5 / 8). The platform pack's recording rule
# rule_pack_builtin_defaults_info{rulepack_digest} carries the digest of the
# built-in defaults table of the registry the pack was generated from; the
# threshold-exporter (da_config_builtin_defaults_info{digest}) and tenant-api
# (tenant_api_builtin_defaults_info{digest}) serve the digest of the table
# they were compiled with.
#
# ⚠️ The pack's digest this file expects — rulepack_digest: "968ca3d1c003" —
# is the CURRENT table's: `check_threshold_registry.py --regen` rewrites it,
# everywhere in this file, when the table changes, and `--ci` fails while it
# is stale. Any other 12-hex digest here is a made-up component digest.
#
# Contract:
#   1) every component on the pack's digest fires nothing;
#   2) a threshold-exporter on another digest fires after `for: 30m`, its
#      text naming both digests;
#   3) a threshold-exporter that serves no digest series (a release older
#      than the built-in layer) fires with digest="none";
#   4) a tenant-api on another digest fires for tenant-api alone;
#   5) a mismatch shorter than `for: 30m` (a rolling upgrade) fires nothing;
#   6) one replica behind of two fires for that job;
#   7) a component that is down or not scraped is not judged here;
#   8) a pod rescheduled (new instance) with the same wrong digest keeps the
#      alert's `for:` running.
# Several pack versions loaded at once: platform-builtin-defaults-two-packs_test.yaml.
# Run: promtool test rules tests/rulepacks/platform-builtin-defaults-digest_test.yaml
rule_files:
  - ../../rule-packs/rule-pack-platform.yaml

evaluation_interval: 1m

tests:
  # 1) aligned: nothing fires, long past `for:`.
  - interval: 1m
    name: aligned-components-fire-nothing
    input_series:
      - series: 'up{job="threshold-exporter", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'da_config_builtin_defaults_info{job="threshold-exporter", instance="10.0.0.1:8080", digest="968ca3d1c003"}'
        values: '1x60'
      - series: 'up{job="tenant-api", instance="10.0.0.2:8080"}'
        values: '1x60'
      - series: 'tenant_api_builtin_defaults_info{job="tenant-api", instance="10.0.0.2:8080", digest="968ca3d1c003"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: BuiltinDefaultsDigestMismatch
        exp_alerts: []
      - eval_time: 60m
        alertname: BuiltinDefaultsRulePackDigestsDiffer
        exp_alerts: []

  # 2) the exporter is on another table: pending until 30m, then firing.
  - interval: 1m
    name: exporter-on-another-digest-fires
    input_series:
      - series: 'up{job="threshold-exporter", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'da_config_builtin_defaults_info{job="threshold-exporter", instance="10.0.0.1:8080", digest="0123456789ab"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: BuiltinDefaultsDigestMismatch
        exp_alerts: []
      - eval_time: 31m
        alertname: BuiltinDefaultsDigestMismatch
        exp_alerts:
          - exp_labels:
              severity: warning
              alert_source: platform
              job: threshold-exporter
              digest: "0123456789ab"
            exp_annotations:
              summary: "threshold-exporter built-in defaults table 0123456789ab differs from the platform rule pack's 968ca3d1c003 "
              description: |
                threshold-exporter has served the built-in defaults table
                0123456789ab for 30 minutes (on at least one of its
                instances); the platform rule pack was generated from the
                threshold registry whose table is 968ca3d1c003 .
                digest="none" means an instance serves no digest series: a release
                older than the built-in layer, which gives no default-armed
                threshold a value unless conf.d writes it.
                Which side is newer decides what goes wrong (#3832 decision 5):
                rule packs newer than the threshold-exporter — a newly
                default-armed threshold has no value, so its alert never fires;
                threshold-exporter newer than the rule packs — it serves rows no
                rule reads, and recalibrated values are read by the old rules.
                For tenant-api, compare with the threshold-exporter's digest too
                (da_config_builtin_defaults_info): tenant-api newer than the
                exporter — a write that relies on the built-in layer passes
                tenant-api's check while the exporter serves no row for it;
                tenant-api older — it may refuse a write the exporter would serve.
                Upgrade the threshold-exporter, tenant-api and the rule packs
                until every digest is the same; `da-guard effective` (da-tools)
                prints the digest of the table it was built with. Do not remove
                the copies of the platform values from conf.d (the migration
                command) while this fires.
              runbook_url: "https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/adr/017-defaults-yaml-inheritance-dual-hash.md"

  # 3) an exporter older than the built-in layer serves no digest series.
  - interval: 1m
    name: exporter-without-digest-fires-as-none
    input_series:
      - series: 'up{job="threshold-exporter", instance="10.0.0.1:8080"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: BuiltinDefaultsDigestMismatch
        exp_alerts: []
    promql_expr_test:
      - expr: count by (job, digest) (ALERTS{alertname="BuiltinDefaultsDigestMismatch", alertstate="firing"})
        eval_time: 31m
        exp_samples:
          - labels: '{job="threshold-exporter", digest="none"}'
            value: 1

  # 4) the exporter is aligned, tenant-api is not: tenant-api alone fires.
  - interval: 1m
    name: tenant-api-on-another-digest-fires-alone
    input_series:
      - series: 'up{job="threshold-exporter", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'da_config_builtin_defaults_info{job="threshold-exporter", instance="10.0.0.1:8080", digest="968ca3d1c003"}'
        values: '1x60'
      - series: 'up{job="tenant-api", instance="10.0.0.2:8080"}'
        values: '1x60'
      - series: 'tenant_api_builtin_defaults_info{job="tenant-api", instance="10.0.0.2:8080", digest="ba9876543210"}'
        values: '1x60'
    promql_expr_test:
      - expr: count by (job, digest) (ALERTS{alertname="BuiltinDefaultsDigestMismatch", alertstate="firing"})
        eval_time: 31m
        exp_samples:
          - labels: '{job="tenant-api", digest="ba9876543210"}'
            value: 1

  # 5) a mismatch for 20 minutes (one component upgraded before the other),
  #    then aligned: never fires.
  - interval: 1m
    name: rolling-upgrade-shorter-than-for-fires-nothing
    input_series:
      - series: 'up{job="threshold-exporter", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'da_config_builtin_defaults_info{job="threshold-exporter", instance="10.0.0.1:8080", digest="0123456789ab"}'
        values: '1x20 _x40'
      - series: 'da_config_builtin_defaults_info{job="threshold-exporter", instance="10.0.0.1:8080", digest="968ca3d1c003"}'
        values: '_x20 1x40'
    promql_expr_test:
      - expr: count(ALERTS{alertname="BuiltinDefaultsDigestMismatch", alertstate="firing"})
        eval_time: 60m
        exp_samples: []
      - expr: count(ALERTS{alertname="BuiltinDefaultsDigestMismatch", alertstate="pending"})
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1

  # 6) two replicas, one still on the old release: the job fires as "none".
  - interval: 1m
    name: one-replica-behind-fires-for-its-job
    input_series:
      - series: 'up{job="threshold-exporter", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'da_config_builtin_defaults_info{job="threshold-exporter", instance="10.0.0.1:8080", digest="968ca3d1c003"}'
        values: '1x60'
      - series: 'up{job="threshold-exporter", instance="10.0.0.3:8080"}'
        values: '1x60'
    promql_expr_test:
      - expr: count by (job, digest) (ALERTS{alertname="BuiltinDefaultsDigestMismatch", alertstate="firing"})
        eval_time: 31m
        exp_samples:
          - labels: '{job="threshold-exporter", digest="none"}'
            value: 1

  # 7) down (up == 0) or not scraped at all: not this alert's call
  #    (ThresholdExporterDown / ThresholdExporterAbsent).
  - interval: 1m
    name: down-or-unscraped-component-is-not-judged
    input_series:
      - series: 'up{job="threshold-exporter", instance="10.0.0.1:8080"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: BuiltinDefaultsDigestMismatch
        exp_alerts: []

  # 8) the pod is rescheduled at 20m (new instance), still on the wrong
  #    digest: the alert fires at 30m as if nothing moved.
  - interval: 1m
    name: rescheduled-pod-keeps-for-running
    input_series:
      - series: 'up{job="threshold-exporter", instance="10.0.0.1:8080"}'
        values: '1x20 _x40'
      - series: 'da_config_builtin_defaults_info{job="threshold-exporter", instance="10.0.0.1:8080", digest="0123456789ab"}'
        values: '1x20 _x40'
      - series: 'up{job="threshold-exporter", instance="10.0.0.7:8080"}'
        values: '_x20 1x40'
      - series: 'da_config_builtin_defaults_info{job="threshold-exporter", instance="10.0.0.7:8080", digest="0123456789ab"}'
        values: '_x20 1x40'
    promql_expr_test:
      - expr: count by (job, digest) (ALERTS{alertname="BuiltinDefaultsDigestMismatch", alertstate="firing"})
        eval_time: 31m
        exp_samples:
          - labels: '{job="threshold-exporter", digest="0123456789ab"}'
            value: 1
