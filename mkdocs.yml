# Exclude repo-root README symlinks from the MkDocs site build.
# docs/README-root.md and docs/README-root.en.md are symlinks to the
# repo-root README files, intended for GitHub display only. Their
# `docs/foo.md` style links don't resolve when built inside docs_dir.
exclude_docs: |
  README-root.md
  README-root.en.md

# Docs that are deliberately NOT in the nav (gitignore-style, relative to
# docs_dir). This is the *declaration* half of `validation.nav.omitted_files`
# below: without it that gate would flag all 72 of these and never go green.
#
# The list is not new policy — it is the same exemption set that
# scripts/tools/dx/generate_nav.py has carried in its EXCLUDE_PATTERNS
# constant, plus the ZH-primary/EN-auxiliary language policy. Moving it here
# puts it next to the nav it talks about, where a reader editing the nav can
# see it, instead of in a Python constant that MkDocs cannot read.
#
# ⚠️ `overrides/` is the theme's `custom_dir`, but it lives INSIDE docs_dir, so a
# `.md` dropped there is treated as a doc page like any other — measured: a probe
# file under it fails the gate without this line. Same for `assets/`.
#
# ⚠️ `internal/` is NOT a uniform exemption. `internal/test-coverage-matrix.md`
# is deliberately IN the nav (under 場景) and stays there — `not_in_nav` only
# suppresses the "exists but is not in the nav" complaint for files that are
# absent from the nav. It never removes anything from the nav, and mkdocs does
# not warn about the overlap (measured, not assumed).
not_in_nav: |
  internal/
  includes/
  tags.md
  overrides/
  assets/
  *.en.md

# Link validation (mkdocs >= 1.6 native).
# `anchors` defaults to `info`, i.e. swallowed by the build log — which is how
# a batch of `#section` links rotted unnoticed. Promoting it to `warn` makes
# the mismatches visible and greppable by
# scripts/tools/lint/mkdocs_strict_check.sh.
#
# Detection only, on purpose. The site's heading ids come from
# Python-Markdown's default (ASCII-only) `toc` slugify, which both collapses
# whitespace runs and strips CJK outright — `9. 維度標籤 — 多 DB 類型支援`
# becomes `#9-db`, and a pure-CJK heading becomes `#_1`. github.com's slugger
# does neither. The two renderers genuinely disagree, so these warnings are
# real findings against the *site*, not noise. Reconciling them means swapping
# `toc.slugify` for a GFM-compatible one — staged separately as B3. Do NOT
# lower this back to `info` to make the count go away.
validation:
  nav:
    # mkdocs defaults this to `info`, i.e. swallowed by the build log — which is
    # exactly how 58 published docs drifted out of the nav unnoticed until #1902
    # (3 of them with no inbound link at all, reachable only by guessing a URL).
    # `warn` makes mkdocs_strict_check.sh fail on it, so the nav cannot silently
    # fall behind docs/ again. The complementary direction (a nav entry whose
    # file is gone) is already gated by `nav.not_found`, which mkdocs defaults
    # to `warn`.
    omitted_files: warn
  links:
    anchors: warn

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  features:
    # Navigation & Discovery
    - navigation.instant
    - navigation.instant.loading
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    # Content Discovery
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    # Page Content
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    # UI Features
    - announce.dismiss

  palette:
    # Light mode
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 深色模式
    # Dark mode
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 淺色模式

  font:
    text: Roboto
    code: Roboto Mono

  # Icon customizations
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Bridge repo-root rule-packs/*.md into the site without a git symlink
# (replaces docs/rule-packs -> ../rule-packs; see the hook docstring).
hooks:
  - scripts/mkdocs/rule_packs_bridge.py

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags: {}
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          nav_translations:
            Home: 首頁
            Getting Started: 快速入門
            Core Architecture: 核心架構
            Integration Guides: 整合指南
            Migration: 遷移
            Governance & Security: 治理與安全
            Scenarios: 場景
            Reference: 參考
        - locale: en
          name: English
          build: true
          nav_translations:
            首頁: Home
            快速入門: Getting Started
            核心架構: Core Architecture
            整合指南: Integration Guides
            遷移: Migration
            治理與安全: Governance & Security
            場景: Scenarios
            參考: Reference
            架構與設計: Architecture & Design
            Context 圖: Context Diagram
            性能基準: Performance Benchmarks
            GitOps 部署: GitOps Deployment
            遷移指南: Migration Guide
            遷移引擎: Migration Engine
            Custom Rule 治理: Custom Rule Governance
            跨租戶 ConfigMap 硬化: Cross-Tenant ConfigMap Hardening
            進階場景: Advanced Scenarios
            Shadow Monitoring 切換: Shadow Monitoring Cutover
            多叢集 Federation: Multi-cluster Federation
            Tenant 生命週期: Tenant Lifecycle
            API 端點: API Endpoints
            Alert 速查: Alert Reference
            故障排查: Troubleshooting
            術語表: Glossary
            架構決策 (ADR): Architecture Decisions (ADR)
            總覽: Overview
            CLI 速查表: CLI Cheat Sheet
            互動式工具: Interactive Tools
            Migration Troubleshooting Checklist: Migration Troubleshooting Checklist

markdown_extensions:
  # Tables
  - tables
  # Admonitions (notes, warnings, etc.)
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Code highlighting
  - pymdownx.highlight:
      use_pygments: true
      pygments_style: material
      anchor_linenums: true
      line_anchors: ''
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  # Lists & Tabs
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  # Emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  # Other
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
  - footnotes
  - abbr

extra:
  # Alternate language links
  alternate:
    - name: 中文
      lang: zh
      link: /Dynamic-Alerting-Integrations/
    - name: English
      lang: en
      link: /Dynamic-Alerting-Integrations/en/

  # Analytics (uncomment and configure for your provider)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
  #   feedback:
  #     title: 這個頁面對你有幫助嗎？
  #     ratings:
  #       - icon: material/emoticon-happy-outline
