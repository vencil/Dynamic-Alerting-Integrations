# Machine contract only: paths, methods, status codes, media types, the ?at=
# parameter, and the /api/v1/config/identity schema. Every one of those is
# checked against the running handlers by
# components/threshold-exporter/app/openapi_spec_parity_test.go, and a field
# that test does not check (an example, a metric list) fails it — prose lives
# in README.md next to this file and in components/threshold-exporter/README.md.
openapi: 3.0.0
info:
  title: Threshold Exporter API
  # The /api/<version>/ prefix the paths below share, not a release number.
  version: v1
  description: |
    Read-only endpoints of threshold-exporter. Metric names, types and labels:
    components/threshold-exporter/README.md §3.3. POST /api/v1/tenants/simulate
    is not described here; its contract is in that README's §3.1 endpoint table.

paths:
  /metrics:
    get:
      summary: Prometheus scrape target
      operationId: getMetrics
      tags: [Metrics]
      responses:
        '200':
          description: Prometheus text format; OpenMetrics is not enabled
          content:
            text/plain; version=0.0.4:
              schema:
                type: string

  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      tags: [Health]
      responses:
        '200':
          description: The process is serving
          content:
            text/plain:
              schema:
                type: string

  /ready:
    get:
      summary: Readiness probe
      operationId: getReady
      tags: [Health]
      responses:
        '200':
          description: A config is loaded
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: No config loaded yet
          content:
            text/plain:
              schema:
                type: string

  /api/v1/config:
    get:
      summary: Human-read dump of the loaded config
      operationId: getConfigDebug
      tags: [Debug]
      parameters:
        - name: at
          in: query
          description: RFC 3339 time to resolve scheduled overrides at; omitted means now
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Plain-text dump (layout is for people, not a contract)
          content:
            text/plain:
              schema:
                type: string

  /api/v1/config/identity:
    get:
      summary: Identity of the config being served (machine contract)
      operationId: getConfigIdentity
      tags: [Debug]
      responses:
        '200':
          description: Also before any config is loaded, with loaded=false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigIdentity'
        '405':
          description: A method other than GET / HEAD
    head:
      summary: Same as GET, without a body
      operationId: headConfigIdentity
      tags: [Debug]
      responses:
        '200':
          description: Headers of the GET response, no body

components:
  schemas:
    ConfigIdentity:
      type: object
      description: Field meanings are in docs/api/README.md §5
      required: [schema, loaded, mode, last_reload, config_hash, parse_failed]
      properties:
        schema:
          type: integer
          enum: [1]
        loaded:
          type: boolean
        mode:
          type: string
          enum: [directory, single-file]
        last_reload:
          type: string
        config_hash:
          type: string
        parse_failed:
          type: array
          items:
            type: string

tags:
  - name: Metrics
  - name: Health
  - name: Debug
