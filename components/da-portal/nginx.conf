# da-portal image's server block: static files only (ADR-027 §5).
# No forwarding and no identity header — the logged-in portal runs inside the
# tenant-api pod with its own config (helm/tenant-api configmap-portal-nginx),
# and the da-portal chart mounts its own conf.d over this one
# (helm/da-portal configmap-nginx); this file is what `docker run` serves.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        interactive/index.html;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options            "DENY"             always;
    add_header X-Content-Type-Options     "nosniff"           always;
    add_header X-XSS-Protection           "1; mode=block"     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    # ── Static assets caching ─────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── YAML / JSON data (allow volume-mount override) ────────
    location ~* \.(json|yaml)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ── Simulate preview: explicitly NOT provided (#2125) ────────
    # POST /api/v1/tenants/simulate is served by threshold-exporter, not
    # tenant-api, and this image has no API behind it. The fixed code is
    # what the simulate-preview widget keys on (drift pinned by
    # tests/shared/test_portal_simulate_not_provided.py).
    # No add_header here on purpose: any add_header in a location drops the
    # server-level security headers above; Content-Type comes from
    # default_type instead.
    location = /api/v1/tenants/simulate {
        default_type application/json;
        return 501 '{"code":"SIMULATE_NOT_PROVIDED","error":"simulate preview is not provided by this deployment: the portal does not proxy /api/v1/tenants/simulate (served by threshold-exporter)"}';
    }

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /interactive/index.html;
    }

    # ── Health check (for K8s readinessProbe) ─────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Deny access to sensitive files ────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
