  /api/v1/tenants/{id}/metrics:
    get:
      description: |-
        Lists the metric names that have at least one series
        carrying {tenant="<id>"} in the last 24h, optionally
        filtered by a name prefix. Backs the portal recipe-
        authoring UX (ADR-024 Capability B). Stateless proxy over
        Prometheus; the result can only contain the tenant's own
        metrics.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Metric-name prefix filter ([a-zA-Z0-9_:]*)
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.DiscoverMetricsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Discover a tenant's metric names
      tags:
      - tenants
  /api/v1/tenants/{id}/validate:
    post:
      consumes:
      - application/yaml
      description: |-
        Dry-run validation of a tenant YAML without writing to disk.
        When conf.d holds an entry that cannot be read other than the tenant's file (#2939), the answer is
        valid: false with the text PUT /api/v1/tenants/{id} returns in its 409 TENANT_TREE_UNREADABLE (a
        symlink that cannot be resolved) or its 500 TENANT_STORE_FAULT (an entry of tenant-api's copy the server cannot read);
        when the tenant's own file cannot be read, with PUT's 409 TENANT_CONFIG_NOT_LOADABLE text.
        The body is judged by PUT's own refusal sequence, in PUT's order (#3062): the write scope on {id} as the file
        holds it and as the body proposes it, a masked-credential placeholder, the body's own shape (it must declare
        tenants.{id} alone, API-shaped, #3064), the tenant file's resolution, a git-managed tenant (#3064: valid: false
        with PUT's 409 TENANT_GIT_MANAGED text and code: TENANT_GIT_MANAGED), the tenant file differing from HEAD
        in this server's copy (#1535: valid: false with PUT's 409 TENANT_FILE_DIRTY text and code: TENANT_FILE_DIRTY), a tenant another conf.d file also
        declares, validation. A refusal is valid: false with the text PUT refuses with (a validation error
        listed bare, one per warning). In PR write mode PUT runs the steps from the tenant file's resolution on the latest
        base branch, which this server's copy may lag: they are not run here, only the body-only pre-flight (#1718).
        This route needs read permission only, but the verdict is the write's: a caller who may read the tenant and not write
        it gets valid: false with the write gate's text, as its PUT is refused (#3062; before, such a caller got a verdict on
        the body alone). POST /api/v1/tenants/{id}/diff shows that caller a masked preview instead.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Tenant YAML content
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ValidateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Validate tenant config
      tags:
      - tenants
  /api/v1/tenants/batch:
    post:
      consumes:
      - application/json
      description: |-
        Apply patch operations to multiple tenants in one call.
        All or nothing, in one commit: every operation is checked (tenant id, write permission, then merged and validated under the write lock on the tree the earlier operations leave; the route generator container then judges the tree with the whole batch applied, #2903),
        and only when every one passes are the changed files committed together — one commit in direct mode, a PR/MR with one commit in PR write-back mode.
        When any operation is refused, nothing is written: 422 with status rejected, the refused operations with status error (message, code) and every other operation with status not_applied.
        With ?async=true (direct mode) the same verdict is reached when the task runs; a rejected batch ends the task as failed, with the same per-operation results.
        The batch is applied and judged in a separate staging git worktree; the branch is advanced first, then the served config files, so readers never see content that was not committed (while the files are updated they may see some of the batch's files new and others old, all committed).
        An operation may also remove keys with unset (only "_routing" and "_routing_receiver_type"): unset ["_routing"] turns routing back on for a tenant a disabling _routing turned off; unset ["_routing_receiver_type"] removes the flat key tenant-api used to write, which nothing renders and which, while on disk, makes every other write to the tenant fail key validation (#2983). A patch may not write a _routing-prefixed key other than _routing and _routing_profile (400 INVALID_BODY).
        Direct mode: an operation whose tenant config file cannot be loaded as a tenant config (config_error malformed_yaml | invalid_config)
        is refused with code TENANT_CONFIG_NOT_LOADABLE (and rejects the batch); repair the tenant file itself first.
        Also config_error not_round_trippable (#2903): re-encoding the tenant file would change content the update does not edit (the message names the first difference inside the tenant's own block); rewrite the file with a whole-file PUT.
      parameters:
      - description: Batch operations
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.BatchRequest'
      - description: Enable async mode (true/false)
        in: query
        name: async
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.BatchResponse'
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: 'PR write-back mode: the forge token lacks write scope to open
            the PR/MR. (An operation refused by the write scope, on the local copy
            or on the latest base branch, rejects the batch with a 422 instead.)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: 'Direct mode, code CONFLICT, with committed: false — the repository
            changed outside tenant-api while the batch ran; nothing was written, refresh
            and retry. With committed: true and commit — the batch WAS committed (that
            commit) but the write did not finish cleanly on the server; refresh before
            changing anything.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: 'Batch rejected (status rejected): at least one operation was
            refused — by the checks on this server''s copy, or (PR write-back mode)
            on the latest base branch the PR/MR would be cut from — so nothing was
            written and no PR/MR was opened. results lists every operation in request
            order: status error (message, code: e.g. FORBIDDEN, TENANT_DECLARED_ELSEWHERE,
            TENANT_FILE_DIRTY (direct mode, #1535: the operation''s tenant file differs
            from HEAD in tenant-api''s copy), TENANT_CONFIG_NOT_LOADABLE, TENANT_TREE_UNREADABLE,
            CONFIG_DECODE_ERROR, INTERNAL_ERROR) for the refused ones, not_applied
            for the rest. TENANT_TREE_UNREADABLE (#2939): the tree after the batch
            holds an unresolvable symlink (dangling, looping, or with a non-directory
            in its path) that no operation replaces; every operation not refused for
            another reason carries it; an operation whose own tenant file cannot be
            read (and is not an unresolvable symlink (dangling, looping, or with a
            non-directory in its path)) is TENANT_CONFIG_NOT_LOADABLE, and the message
            names the entries only for a caller with write permission on all tenants
            (otherwise their number); an async task''s stored results never name them.
            Also when the route generator container refuses the batch as a whole (#2903,
            ADR-036 §4: the tree with the whole batch applied is judged once): every
            result is status error with code GENERATOR_FINDINGS (its message names
            the findings about that result''s tenant) and findings[] / findings_compared_with_base
            / unrelated_findings_withheld carry the findings as for PUT /tenants/{id};
            or code GENERATOR_REJECTED (memory, incomplete, too_large: the files the
            batch produces are too large to judge in one request — split the batch,
            invalid_request, normalized: git attributes would commit other bytes than
            the ones judged). An async batch''s task carries the same per-op results.'
          schema:
            $ref: '#/definitions/internal_handler.BatchResponse'
        "429":
          description: 'Too many requests: code GENERATOR_REJECTED (#2903) — the route
            generator container gave no verdict this time, retry (Retry-After): reason
            busy, deadline, git_read, mismatch (what it judged is still not what would
            be written after one re-judgement) or no_time (too little of the request''s
            time left to judge). Nothing written. Also code RATE_LIMITED (per-caller
            rate limit)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: 'Internal error; or code TENANT_STORE_FAULT (#2939): tenant-api''s
            own copy of conf.d holds an entry the server cannot read and git cannot
            hold (a FIFO, socket or device named like a config file, a failed read,
            an unlistable directory); the batch fails whole, nothing written — it
            is fixed on the server or its volume, not by changing operations. Entry
            names as for the 422; an async task''s stored results never name them'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: 'Service unavailable: the write plane is busy (WRITE_OVERLOADED),
            the forge is degraded (FORGE_UNAVAILABLE) or the config worktree was on
            a PR branch (TREE_NOT_ON_BASE). Also, for every write that changes a conf.d
            file (#2903, ADR-036 §5): code VALIDATOR_UNAVAILABLE when the route generator
            container cannot judge (reason unreachable, bad_response, amtool_missing,
            generator_too_old, internal_error), or POLICY_UNAVAILABLE when its deployment
            policy file is unusable (reason policy_unusable, or policy_unreadable
            for tenant-api''s own copy); Retry-After; nothing written. Also code UPSTREAM_ERROR
            (#1535) when the request was cancelled or reached its deadline before
            a synchronous batch finished: unlike the cases above it may already be
            committed (a git command that hits its own deadline may already have moved
            the ref), so refresh to see whether it was before retrying'
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Batch tenant operations
      tags:
      - tenants
  /api/v1/tenants/search:
    get:
      description: |-
        Server-side filter / sort / pagination over the tenants visible to the caller (RBAC-filtered). Each item's config_derived is derived from config at request time (「依設定推算」), not observed from Alertmanager; the response's config_derivation names the conf.d files skipped as unparseable.
        When the conf.d root platform files cannot be read, an item's metadata carries only the tenant file's own `_metadata` values and the item is marked `metadata_incomplete`: like a degraded item (config_error) it is visible only to callers whose matching RBAC rule does not restrict environments or domains, no metadata filter (environment / tier / domain / db_type / tag) matches it, and q matches its id only.
        An item whose `_metadata` does not decode is marked `metadata_incomplete` the same way, with empty metadata fields.
      parameters:
      - description: Case-insensitive substring over id / owner / domain / db_type
          / tags
        in: query
        name: q
        type: string
      - description: Exact environment
        in: query
        name: environment
        type: string
      - description: Exact tier
        in: query
        name: tier
        type: string
      - description: Exact domain
        in: query
        name: domain
        type: string
      - description: Exact db_type
        in: query
        name: db_type
        type: string
      - description: A tag the tenant must carry (case-sensitive)
        in: query
        name: tag
        type: string
      - description: Page size (default 50, max 500)
        in: query
        name: page_size
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Sort key
        enum:
        - id
        - environment
        - tier
        - domain
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Search tenants
      tags:
      - tenants
