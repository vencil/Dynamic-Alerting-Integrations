  /api/v1/groups/{id}/batch:
    post:
      consumes:
      - application/json
      description: |-
        Apply a patch to all tenants in a group, through the same pipeline as POST /api/v1/tenants/batch
        (one operation per member): patch values are range-checked (400), and each member is checked for write permission; the route generator container judges the tree with every member's change applied (#2903).
        unset removes keys from every member (only "_routing" and "_routing_receiver_type"): unset ["_routing"] turns routing back on for members a disabling _routing turned off; unset ["_routing_receiver_type"] removes the flat key tenant-api used to write (#2983). A patch may not write a _routing-prefixed key other than _routing and _routing_profile (400).
        All or nothing, in one commit, as POST /api/v1/tenants/batch: when any member is refused nothing is written (422, status rejected, the refused members with status error, the others not_applied);
        otherwise every changed member file is in one commit (direct mode) or one PR/MR with one commit (PR write-back mode). A rejected async run ends the task as failed with the same results.
        Results and summary list only the members the caller may read; a refusal of a member the caller cannot read still rejects the batch.
        PR write-back mode: the whole group becomes one PR/MR (status pending_review, pr_url, pr_number); nothing is committed to the base branch.
        A member that does not exist (no tenant section on the base the write merges into, e.g. offboarded while still listed in the group) is not created:
        its result has status skipped and message "tenant does not exist", nothing is written for it, it does not reject the batch, and the summary counts it apart ("1 succeeded, 1 skipped").
        PR write-back mode ignores ?async=true and answers 200 synchronously, as POST /api/v1/tenants/batch does.
        Direct mode: a member whose config file cannot be loaded as a tenant config (config_error malformed_yaml | invalid_config)
        is refused with code TENANT_CONFIG_NOT_LOADABLE (and rejects the batch); repair the tenant file itself first.
        Also config_error not_round_trippable (#2903): re-encoding the tenant file would change content the update does not edit (the message names the first difference inside the tenant's own block); rewrite the file with a whole-file PUT.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Patch to apply
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.GroupBatchRequest'
      - description: Enable async mode (true/false)
        in: query
        name: async
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.GroupBatchResponse'
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: 'PR write-back mode: the forge token lacks write scope to open
            the PR/MR. (A member refused by the write scope, on the local copy or
            on the latest base branch, rejects the batch with a 422 instead.)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: 'Direct mode, code CONFLICT, with committed: false — the repository
            changed outside tenant-api while the batch ran; nothing was written, refresh
            and retry. With committed: true and commit — the batch WAS committed (that
            commit) but the write did not finish cleanly on the server; refresh before
            changing anything.'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: 'Batch rejected (status rejected): at least one member was
            refused — by the checks on this server''s copy, or (PR write-back mode)
            on the latest base branch — so nothing was written and no PR/MR was opened.
            results lists the members the caller may read: status error (message,
            code) for the refused ones, not_applied for the rest; the messages name
            no member index. Codes TENANT_TREE_UNREADABLE and TENANT_CONFIG_NOT_LOADABLE
            as on POST /api/v1/tenants/batch (#2939). Also when the route generator
            container refuses the batch as a whole (#2903, ADR-036 §4: the tree with
            the whole batch applied is judged once): every result is status error
            with code GENERATOR_FINDINGS (its message names the findings about that
            result''s tenant) and findings[] / findings_compared_with_base / unrelated_findings_withheld
            carry the findings as for PUT /tenants/{id}; or code GENERATOR_REJECTED
            (memory, incomplete, too_large: the files the batch produces are too large
            to judge in one request — split the batch, invalid_request, normalized:
            git attributes would commit other bytes than the ones judged). An async
            batch''s task carries the same per-op results.'
          schema:
            $ref: '#/definitions/internal_handler.GroupBatchResponse'
        "429":
          description: 'Too many requests: code GENERATOR_REJECTED (#2903) — the route
            generator container gave no verdict this time, retry (Retry-After): reason
            busy, deadline, git_read, mismatch (what it judged is still not what would
            be written after one re-judgement) or no_time (too little of the request''s
            time left to judge). Nothing written. Also code RATE_LIMITED (per-caller
            rate limit)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: 'Internal error; or code TENANT_STORE_FAULT (#2939): tenant-api''s
            own copy of conf.d holds an entry the server cannot read and git cannot
            hold (a FIFO, socket or device named like a config file, a failed read,
            an unlistable directory); the batch fails whole, nothing written — it
            is fixed on the server or its volume, not by changing operations. Entry
            names as for the 422; an async task''s stored results never name them'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: 'Service unavailable: the write plane is busy (WRITE_OVERLOADED)
            or the forge is degraded (FORGE_UNAVAILABLE). Also, for every write that
            changes a conf.d file (#2903, ADR-036 §5): code VALIDATOR_UNAVAILABLE
            when the route generator container cannot judge (reason unreachable, bad_response,
            amtool_missing, generator_too_old, internal_error), or POLICY_UNAVAILABLE
            when its deployment policy file is unusable (reason policy_unusable, or
            policy_unreadable for tenant-api''s own copy); Retry-After; nothing written.
            Also code UPSTREAM_ERROR (#1535) when the request was cancelled or reached
            its deadline before a synchronous batch finished: unlike the cases above
            it may already be committed (a git command that hits its own deadline
            may already have moved the ref), so refresh to see whether it was before
            retrying'
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Batch operation on group members
      tags:
      - groups
  /api/v1/me:
    get:
      description: 'Returns the authenticated user''s email, groups, accessible tenants,
        and permissions. Requires an identity only, no grant (#2520): a caller no
        rule matches (including under a configured _rbac.yaml with zero rules) gets
        200 with empty permissions and accessible_tenants. Lists only the rules matching
        the caller — a summary of those rules, not of effective access: a matched
        rule that grants nothing right now (an org-scoped rule without the org claim
        under enforce) is still listed.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get current user identity and permissions
      tags:
      - identity
  /api/v1/prs:
    get:
      description: |-
        Returns pending pull/merge requests created by tenant-api, filtered by caller's tenant RBAC.
        A batch PR/MR (several tenants; `tenant_id` empty, `tenants` lists them) is returned only to callers who may read every tenant it covers.
        A batch PR/MR whose tenants tenant-api did not record (e.g. created before a restart) is returned only to callers who may read every tenant.
      parameters:
      - description: Filter by tenant ID
        in: query
        name: tenant
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.PRListResponse'
      summary: List pending PRs/MRs
      tags:
      - prs
  /api/v1/tenants:
    get:
      description: |-
        Returns tenants visible to the authenticated user, filtered by RBAC.
        config_derived is derived from config at request time (「依設定推算」), not observed from Alertmanager.
        A tenant whose config file is not usable is returned as a degraded row carrying only `id` and `config_error`
        (unreadable | not_regular_file | malformed_yaml | invalid_config — parses as YAML at the syntax level but cannot be
        loaded as a tenant config: wrong shape, errors only a typed decode detects, such as duplicate keys, or a declared
        tenant id that is not valid UTF-8 — threshold-exporter skips such a file whole).
        Its environment/domain are unknown, so the
        row is visible only to callers whose matching RBAC rule does not restrict environments or domains.
        When the conf.d root platform files cannot be read, every other row's metadata carries only the tenant file's own `_metadata`
        values and the row is marked `metadata_incomplete`; its visibility is that of a degraded row.
        A row whose `_metadata` does not decode is marked `metadata_incomplete` the same way, with empty metadata fields.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler.TenantSummary'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List tenants
      tags:
      - tenants
  /api/v1/tenants/{id}:
    get:
      description: |-
        Returns the raw YAML and resolved thresholds for a single tenant.
        managed_by says who changes the tenant (#3064). "api": its conf.d file (located by its name) is API-shaped —
        one YAML document declaring only this tenant (or none yet), with no anchor, alias, merge key (<<) or tagged
        key at the top level or directly under tenants: — so raw_yaml, source_hash and custom_alerts are that
        tenant's alone. "git": any other file (shared with other tenants, a name that is not the declared id, several
        documents, YAML indirection where tenants are declared, not YAML), with git_managed_reason; the answer is the
        effective view only — resolved_thresholds and validation_warnings / validation_notices, or config_error —
        and raw_yaml, source_hash and custom_alerts are ABSENT, for every caller. Every write to such a tenant is
        refused with 409 TENANT_GIT_MANAGED; change it in git.
        When an API-managed tenant's file cannot be loaded as a tenant config, the answer is still 200 with raw_yaml
        and source_hash, plus `config_error` (invalid_config, as on the list row); threshold-exporter skips such a
        file, so resolved_thresholds, custom_alerts and the validation fields are absent (not empty: the file's
        content is not vouched for). Partial writes refuse such a file (409 TENANT_CONFIG_NOT_LOADABLE) until it is
        repaired; a whole-file PUT can replace it. When the end-of-life check cannot decode the current file's
        tenants: block, that PUT requires write permission on all tenants (an RBAC rule with tenants: ["*"] granting
        write and no org-scope, environments or domains; a prefix pattern does not count) and is otherwise refused
        with 400, file unchanged — fix it in git then; when allowed, its end-of-life recipe usage counts as none, so
        a body with an end-of-life recipe is refused. A file that exists but cannot be read at all (permissions, I/O,
        a directory) refuses the write.
        A caller who may read the tenant but not write it gets raw_yaml with every receiver credential replaced by
        "<masked: write permission required>" and comments removed, custom_alerts masked the same way and
        source_hash empty (masked: true);
        or raw_yaml, custom_alerts and source_hash empty with raw_yaml_withheld: true when the file uses an anchor or alias
        (inside the tenant's own section: anywhere else makes the tenant git-managed).
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.TenantDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: 'Conflict: ambiguous tenant file, or the tenant''s conf.d file
            is not a regular file (code TENANT_CONFIG_NOT_LOADABLE, config_error not_regular_file)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get tenant config
      tags:
      - tenants
    put:
      consumes:
      - application/yaml
      description: |-
        Validates, writes, and commits a tenant's YAML configuration. The body replaces the tenant's conf.d file whole.
        Only an API-managed tenant is written (#3064): one whose file (located by its name) is API-shaped — one YAML
        document declaring only {id}, with no anchor, alias, merge key (<<) or tagged key at the top level or
        directly under tenants: (anchors and aliases inside the tenant's own section are fine). Any other tenant is
        git-managed (GET marks it managed_by: git) and every write is refused with 409 TENANT_GIT_MANAGED, in both write
        modes; change it in git. The body must be API-shaped too (400), so it declares exactly tenants.{id}.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Tenant YAML content
        in: body
        name: body
        required: true
        schema:
          type: string
      - description: 'Attribute the PR to a non-UI write source. Allowlisted: threshold-governance
          (#656). Omit for tenant-manager UI.'
        in: header
        name: X-DA-Write-Source
        type: string
      - description: 'Optimistic concurrency: the source_hash GET /tenants/{id} returned
          for the file this body was derived from. 409 if the file changed since.
          16 lowercase hex chars; a malformed value is a 400, never ignored. Direct
          write-back mode only (501 in PR mode).'
        in: header
        name: X-DA-Base-Hash
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.PutTenantResponse'
        "400":
          description: 'Bad request. A value the body writes that is the masked-credential
            placeholder is code INVALID_BODY with one violations[] entry per value
            (#1560; send the real value; nothing written); The flat _routing_receiver_type
            is a 400 BAD_REQUEST from the tenant key validation (#2903; the receiver
            type is _routing.receiver.type). Routing (receivers, matcher values, group_by,
            the domain policy) is judged by the route generator container: a refusal
            is a 422 GENERATOR_FINDINGS (#2903). Also 400 when the tenant id is not
            a DNS-1123 label: 1-63 lowercase letters, digits and -, starting and ending
            with a letter or digit (ADR-035; the route generator refuses a tree that
            declares any other id; nothing written). Also 400 when the body is not
            API-shaped (#3064): it declares a tenant besides {id}, several documents,
            or an anchor, alias, merge key or tagged key at the top level or directly
            under tenants: (nothing written). Also 400 when the current tenant file''s
            tenants: block cannot be decoded for the end-of-life check and the caller
            lacks write permission on all tenants (#2405; nothing written)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions. In PR write-back mode
            the write scope is judged again on the latest base branch, which this
            server''s local copy may lag: a refusal there is the same 403 with tenant_id,
            and no PR/MR or branch is left'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: 'Conflict: code TENANT_GIT_MANAGED (#3064) when the tenant
            is git-managed — its conf.d file (on the latest base branch in PR write-back
            mode) is not API-shaped; tenant_id and git_managed_reason (not_tenant_document,
            several_documents, yaml_indirection, tenant_count, id_mismatch) in the
            envelope, naming no other tenant; judged before the base hash; nothing
            written. Or base hash mismatch (current_source_hash only when the current
            file is API-shaped: the hash GET /tenants/{id} shows), pending PR, ambiguous
            tenant file, the tenant is also declared by another conf.d file (code
            TENANT_DECLARED_ELSEWHERE, a fixed text; nothing written), the tenant''s
            conf.d file is not a regular file (code TENANT_CONFIG_NOT_LOADABLE, config_error
            not_regular_file; nothing written), or code TENANT_TREE_UNREADABLE when
            conf.d holds an unresolvable symlink (dangling, looping, or with a non-directory
            in its path) other than the file this write replaces (#2939, ADR-036 §4:
            the tree after the write is judged; repair it in git; nothing written;
            unreadable_count always, the entries'' names and reasons in the text and
            in unreadable only for a caller with write permission on all tenants).
            The tenant''s own file being unreadable in any other way (a failed read,
            a FIFO) is TENANT_CONFIG_NOT_LOADABLE (config_error unreadable or not_regular_file)
            for every caller: it is never replaced. A tenant file that is itself an
            unresolvable symlink (dangling, looping, or with a non-directory in its
            path) does not count: the write replaces it; or code TENANT_FILE_DIRTY
            (#1535, direct mode) when the tenant''s conf.d file in tenant-api''s copy
            differs from the commit the write lands on (modified, staged, deleted,
            untracked or marked skip-worktree / assume-unchanged outside tenant-api,
            or a link or the target on a symlinked tenant file''s way inside the repository
            changed; a target outside the repository, in a nested repository or a
            submodule is not judged): fixed text, no path; nothing written; commit
            or discard the change in the repository, then retry'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: 'Payload too large: the body is over TA_MAX_BODY_BYTES (code
            PAYLOAD_TOO_LARGE; nothing written). The body is refused whole, never
            written truncated (#2778)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: 'Refused by the route generator container (#2903, ADR-036 §4):
            code GENERATOR_FINDINGS — the conf.d tree with this write applied does
            not pass `generate-routes --validate --strict`; findings[] lists the generator''s
            findings, the ones naming this write''s file or tenant first (related:
            true), pre_existing set when findings_compared_with_base is true (the
            tree before the write was judged too); a finding unrelated to this write
            is shown only to a caller with write permission on all tenants (others
            get unrelated_findings_withheld). Or code GENERATOR_REJECTED with reason
            memory / incomplete / too_large (the files the write produces are too
            large to judge in one request) / invalid_request: the generator gave no
            verdict; or normalized: git attributes (.gitattributes eol, text or a
            filter) would commit other bytes than the ones the generator judged. Nothing
            written'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: 'Too many requests: code GENERATOR_REJECTED (#2903) — the route
            generator container gave no verdict this time, retry (Retry-After): reason
            busy, deadline, git_read, mismatch (what it judged is still not what would
            be written after one re-judgement) or no_time (too little of the request''s
            time left to judge). Nothing written. Also code RATE_LIMITED (per-caller
            rate limit)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: 'Internal error: code INTERNAL_ERROR, among others when the
            commit or the file write fails (#1535: a fault of the server, not of the
            body; the detail is in the server log under request_id); or code TENANT_STORE_FAULT
            (#2939): tenant-api''s own copy of conf.d holds an entry the server cannot
            read and git cannot hold — a FIFO, socket or device named like a config
            file, a file whose read fails, a sub-directory that cannot be listed,
            a failed stat that is not an unresolvable link — other than the written
            tenant file; it is fixed on the server or its volume (or by resetting
            the copy from git), not by a write; wins over TENANT_TREE_UNREADABLE;
            nothing written; entry names disclosed as for TENANT_TREE_UNREADABLE'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: 'Service unavailable: the write plane is busy (WRITE_OVERLOADED),
            the forge is degraded (FORGE_UNAVAILABLE) or the config worktree is not
            on the base branch (TREE_NOT_ON_BASE). Also, for every write that changes
            a conf.d file (#2903, ADR-036 §5): code VALIDATOR_UNAVAILABLE when the
            route generator container cannot judge (reason unreachable, bad_response,
            amtool_missing, generator_too_old, internal_error), or POLICY_UNAVAILABLE
            when its deployment policy file is unusable (reason policy_unusable, or
            policy_unreadable for tenant-api''s own copy); Retry-After; nothing written.
            Also code UPSTREAM_ERROR (#1535) when the request was cancelled or reached
            its deadline before the write finished: unlike the cases above it may
            already be committed (a git command that hits its own deadline may already
            have moved the ref), so refresh to see whether it was before retrying'
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Update tenant config
      tags:
      - tenants
  /api/v1/tenants/{id}/access:
    get:
      description: |-
        Lightweight authorization probe that reuses the tenant read
        RBAC decision: returns 200 {allow:true} when the caller has
        read permission on {id}, or 403 otherwise. Purpose-built for
        sibling services (e.g. the recipe-preview service, #657) so
        they never re-implement RBAC or over-fetch the tenant config.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Check whether the caller may read a tenant (RBAC probe)
      tags:
      - tenants
  /api/v1/tenants/{id}/custom-alerts:
    put:
      consumes:
      - application/json
      description: |-
        Merges the supplied recipe array into the tenant's
        `_custom_alerts` (comment-preserving AST edit), validates
        (S5 Go validator), and commits. Optimistic concurrency via
        base_hash (409 on drift). Empty array deletes the key.
        409 TENANT_CONFIG_NOT_LOADABLE config_error not_round_trippable when re-encoding the tenant file would change content other than _custom_alerts (#2903; the message names the first difference inside the tenant's own block; nothing written).
        409 TENANT_CONFIG_NOT_LOADABLE (with tenant_id, config_error) when the tenant's file cannot be loaded as a
        tenant config (malformed_yaml | invalid_config, as on GET): repair the tenant file itself first, e.g. with a
        whole-file PUT /api/v1/tenants/{id}, which replaces it (an API-shaped file only: one that is not YAML, or
        is shared with other tenants, is git-managed and repaired in git). Also 409 TENANT_CONFIG_NOT_LOADABLE with config_error
        not_regular_file when the tenant's conf.d file is not a regular file: nothing is read or written, and the
        whole-file PUT refuses it too, so replace it with a regular file in git.
        409 TENANT_TREE_UNREADABLE as on PUT /api/v1/tenants/{id} when conf.d holds an unresolvable symlink (dangling, looping, or with a non-directory in its path) other
        than the tenant's file, 500 TENANT_STORE_FAULT when tenant-api's copy holds an entry the server cannot
        read (#2939; nothing written); 409 TENANT_CONFIG_NOT_LOADABLE config_error unreadable when the tenant's
        own file cannot be read.
        409 TENANT_GIT_MANAGED when the tenant is git-managed (#3064): its conf.d file is not API-shaped (shared
        with other tenants, a name that is not the declared id, several documents, YAML indirection where tenants are
        declared, or not YAML), so GET shows no custom_alerts or source_hash and no edit can be based on them; judged
        before the base_hash check; nothing written. For an API-managed tenant the file holds that tenant alone, so
        base_hash (the whole file's source_hash) covers exactly its content. A 409 CONFLICT carries
        current_source_hash only when the current file is API-shaped.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Desired recipe list + base_hash
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.PutCustomAlertsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.PutCustomAlertsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: 'Not found: no tenant file, or the tenant file is a symlink
            that cannot be resolved (dangling, looping — a self-loop included — or
            through a non-directory): it has no content to merge recipes into, so
            there is no tenant here (a whole-file PUT /api/v1/tenants/{id} replaces
            such a link)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: 'Conflict: the tenant is git-managed (TENANT_GIT_MANAGED, #3064),
            base_hash drift (CONFLICT), the tenant file cannot be loaded or is not
            a regular file (TENANT_CONFIG_NOT_LOADABLE), the tenant is declared by
            another conf.d file (TENANT_DECLARED_ELSEWHERE), or code TENANT_TREE_UNREADABLE
            when conf.d holds an unresolvable symlink (dangling, looping, or with
            a non-directory in its path) other than the file this write replaces (#2939,
            ADR-036 §4: the tree after the write is judged; repair it in git; nothing
            written; unreadable_count always, the entries'' names and reasons in the
            text and in unreadable only for a caller with write permission on all
            tenants). The tenant''s own file being unreadable in any other way (a
            failed read, a FIFO) is TENANT_CONFIG_NOT_LOADABLE (config_error unreadable
            or not_regular_file) for every caller: it is never replaced; or code TENANT_FILE_DIRTY
            (#1535, direct mode) when the tenant''s conf.d file in tenant-api''s copy
            differs from the commit the write lands on (modified, staged, deleted,
            untracked or marked skip-worktree / assume-unchanged outside tenant-api,
            or a link or the target on a symlinked tenant file''s way inside the repository
            changed; a target outside the repository, in a nested repository or a
            submodule is not judged): fixed text, no path; nothing written; commit
            or discard the change in the repository, then retry'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: 'Refused by the route generator container (#2903, ADR-036 §4):
            code GENERATOR_FINDINGS — the conf.d tree with this write applied does
            not pass `generate-routes --validate --strict`; findings[] lists the generator''s
            findings, the ones naming this write''s file or tenant first (related:
            true), pre_existing set when findings_compared_with_base is true (the
            tree before the write was judged too); a finding unrelated to this write
            is shown only to a caller with write permission on all tenants (others
            get unrelated_findings_withheld). Or code GENERATOR_REJECTED with reason
            memory / incomplete / too_large (the files the write produces are too
            large to judge in one request) / invalid_request: the generator gave no
            verdict; or normalized: git attributes (.gitattributes eol, text or a
            filter) would commit other bytes than the ones the generator judged. Nothing
            written'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: 'Too many requests: code GENERATOR_REJECTED (#2903) — the route
            generator container gave no verdict this time, retry (Retry-After): reason
            busy, deadline, git_read, mismatch (what it judged is still not what would
            be written after one re-judgement) or no_time (too little of the request''s
            time left to judge). Nothing written. Also code RATE_LIMITED (per-caller
            rate limit)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: 'Internal error: code INTERNAL_ERROR, among others when the
            commit or the file write fails (#1535: a fault of the server, not of the
            body; the detail is in the server log under request_id); or code TENANT_STORE_FAULT
            (#2939): tenant-api''s own copy of conf.d holds an entry the server cannot
            read and git cannot hold — a FIFO, socket or device named like a config
            file, a file whose read fails, a sub-directory that cannot be listed,
            a failed stat that is not an unresolvable link — other than the written
            tenant file; it is fixed on the server or its volume (or by resetting
            the copy from git), not by a write; wins over TENANT_TREE_UNREADABLE;
            nothing written; entry names disclosed as for TENANT_TREE_UNREADABLE'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: 'Service unavailable: the write plane is busy (WRITE_OVERLOADED),
            the forge is degraded (FORGE_UNAVAILABLE) or the config worktree is not
            on the base branch (TREE_NOT_ON_BASE). Also, for every write that changes
            a conf.d file (#2903, ADR-036 §5): code VALIDATOR_UNAVAILABLE when the
            route generator container cannot judge (reason unreachable, bad_response,
            amtool_missing, generator_too_old, internal_error), or POLICY_UNAVAILABLE
            when its deployment policy file is unusable (reason policy_unusable, or
            policy_unreadable for tenant-api''s own copy); Retry-After; nothing written.
            Also code UPSTREAM_ERROR (#1535) when the request was cancelled or reached
            its deadline before the write finished: unlike the cases above it may
            already be committed (a git command that hits its own deadline may already
            have moved the ref), so refresh to see whether it was before retrying'
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Replace a tenant's custom-alert recipes
      tags:
      - tenants
  /api/v1/tenants/{id}/diff:
    post:
      consumes:
      - application/json
      description: |-
        Returns unified diff between current file and proposed content.
        The diff header names current/<id>.yaml and proposed/<id>.yaml.
        The proposed side is what PUT /api/v1/tenants/{id} would write: the proposal, which replaces the tenant's
        file whole (#3064: only an API-managed tenant's file, which holds that tenant alone, is written or shown).
        A proposal PUT would refuse is refused here exactly as PUT refuses it — the same status and body, judged in PUT's
        order (#3062): the write scope on {id} as the file holds it and as the proposal proposes it, a masked-credential
        placeholder, the proposal's own shape (it must declare tenants.{id} alone, API-shaped, #3064), the tenant file's
        resolution, a git-managed tenant (409 TENANT_GIT_MANAGED, for every caller, #3064), a tenant another conf.d file
        also declares, validation. In PR write mode the current file is this server's copy, which may lag the base branch
        PUT judges on.
        A caller who may read the tenant but not write it gets, instead of PUT's 403, the diff of the masked forms of
        both sides (re-encoded, without comments, every receiver credential replaced by "<masked: write permission required>"),
        with masked: true; a change to a credential value alone then shows has_diff false. Such a caller gets 422
        MASKED_PREVIEW_UNAVAILABLE when either side is not YAML, holds several documents, or uses an anchor, alias or merge key.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Proposed YAML
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.DiffRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.DiffResponse'
        "400":
          description: 'Bad request: the PUT this previews would be refused with this
            400 (#3062: the same body)'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: 'Forbidden: the PUT this previews would be refused with this
            403 (#3062: the same body) — the proposal moves {id} outside the caller''s
            write scope'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: 'Conflict: the PUT this previews would be refused — code TENANT_GIT_MANAGED
            when the tenant is git-managed (#3064; as PUT''s 409, for every caller),
            ambiguous tenant file, TENANT_DECLARED_ELSEWHERE, or code TENANT_TREE_UNREADABLE
            when conf.d holds an unresolvable symlink (dangling, looping, or with
            a non-directory in its path) other than the file this write replaces (#2939,
            ADR-036 §4: the tree after the write is judged; repair it in git; nothing
            written; unreadable_count always, the entries'' names and reasons in the
            text and in unreadable only for a caller with write permission on all
            tenants). The tenant''s own file being unreadable in any other way (a
            failed read, a FIFO) is TENANT_CONFIG_NOT_LOADABLE (config_error unreadable
            or not_regular_file) for every caller: it is never replaced; or code TENANT_FILE_DIRTY
            (#1535, direct mode) when the tenant''s conf.d file in tenant-api''s copy
            differs from the commit the write lands on (modified, staged, deleted,
            untracked or marked skip-worktree / assume-unchanged outside tenant-api,
            or a link or the target on a symlinked tenant file''s way inside the repository
            changed; a target outside the repository, in a nested repository or a
            submodule is not judged): fixed text, no path; nothing written; commit
            or discard the change in the repository, then retry'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: 'Internal error; or code TENANT_STORE_FAULT (#2939): tenant-api''s
            own copy of conf.d holds an entry the server cannot read and git cannot
            hold — a FIFO, socket or device named like a config file, a file whose
            read fails, a sub-directory that cannot be listed, a failed stat that
            is not an unresolvable link — other than the written tenant file; it is
            fixed on the server or its volume (or by resetting the copy from git),
            not by a write; wins over TENANT_TREE_UNREADABLE; nothing written; entry
            names disclosed as for TENANT_TREE_UNREADABLE (the 500 the PUT this previews
            would get)'
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Preview config diff
      tags:
      - tenants
  /api/v1/tenants/{id}/effective:
    get:
      description: |-
        Returns the tenant config after merging the _defaults.yaml
        chain from L0 (conf.d root) down to the tenant's own file,
        with the root platform files' per-tenant `tenants:` entries
        applied between the chain and the tenant file (the tenant
        file wins key by key); platform_overlay names the files and
        keys that layer supplied and is omitted when it supplied none.
        A tenant's _profile is expanded as /metrics expands it: the
        profile (from the root platform files' profiles: blocks) fills
        in keys neither the tenant file nor the platform entries set;
        profile_overlay names the profile, the files and the keys it
        supplied and is omitted when it supplied none.
        Includes two SHA-256 hashes (truncated to 16 hex chars):
        source_hash for raw file content and merged_hash for the
        canonical-JSON of the merged dict. Parity target:
        scripts/tools/dx/describe_tenant.py.
        effective_config keeps every value as written; not_served
        names each key whose shown value /metrics does not serve,
        with the exporter's own reason (parse_failed,
        root_defaults_unwrapped, value_rejected, value_unparsed,
        value_unparsed_dropped, window_invalid, undeliverable,
        root_null_undeclared, spelling_duplicate, unregistered)
        and the file of the value shown; unregistered is a `_` key
        the reserved-key registry does not list, which /metrics
        serves in no layer; spelling_duplicate names a
        spelling of a threshold that the same mapping also writes
        under the spelling /metrics serves (two spellings of one
        dimensional key, or both #1231 names). Dimensional keys are
        one threshold whatever their label order or quoting: every key
        here is spelled as the layer that supplied its value wrote it.
        chain_parse_failed lists the
        defaults_chain files with a syntax error the exporter does not
        read; they are read as empty and the tenant is still answered
        (200). Both are omitted when empty.
        A caller who may read the tenant but not write it gets every
        receiver credential in effective_config (webhook / chat URLs,
        PagerDuty keys, passwords, tokens — at any depth) replaced by
        "<masked: write permission required>", with masked: true and
        source_hash and merged_hash empty (either would let a guess of
        a credential be checked offline).
        source_hash is the hash of the whole tenant file: it is shown only for an API-managed tenant (#3064: its
        file is API-shaped, as GET /tenants/{id} reports with managed_by: api). For a git-managed tenant it is empty
        with source_hash_withheld: true, for every caller (every write to it is refused; change it in git).
        A 500 CONFIG_DECODE_ERROR about a file that declares a tenant the caller may not read (#3050), or whose
        tenants cannot be listed with certainty while the caller lacks read permission on all tenants, carries a
        fixed text instead of the decoder's message (which quotes the value).
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.TenantEffectiveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: 'Conflict: ambiguous tenant file, or the tenant is declared
            by more than one conf.d file'
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get tenant effective (merged) config
      tags:
      - tenants
  /api/v1/tenants/{id}/federation:
    get:
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vencil_tenant-api_internal_federation_fedpolicy.Subset'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get a tenant's effective federation metric subset
      tags:
      - federation
    put:
      consumes:
      - application/json
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Metric subset
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_vencil_tenant-api_internal_federation_fedpolicy.Subset'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
        "507":
          description: Insufficient Storage
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Replace a tenant's federation metric subset
      tags:
