definitions:
  ErrorResponse:
    properties:
      action:
        type: string
      code:
        type: string
      error:
        type: string
      help:
        type: string
      request_id:
        type: string
      retry_after_s:
        type: integer
      violations:
        items:
          $ref: '#/definitions/Violation'
        type: array
    required:
    - code
    - error
    type: object
  Violation:
    properties:
      field:
        type: string
      reason:
        type: string
    type: object
  config.NotServedKey:
    properties:
      file:
        description: |-
          File is the root-relative slash path of the file whose value the
          effective config shows (the key's winning layer); empty when no single
          file applies.
        type: string
      reason:
        description: Reason is one of the NotServed* constants.
        type: string
    type: object
  config.PlatformOverlaySource:
    properties:
      file:
        type: string
      keys:
        items:
          type: string
        type: array
    type: object
  config.ProfileOverlaySource:
    properties:
      file:
        type: string
      keys:
        items:
          type: string
        type: array
      profile:
        type: string
    type: object
  config.ResolvedThreshold:
    properties:
      component:
        type: string
      customLabels:
        additionalProperties:
          type: string
        description: dimensional labels from {key="value"} syntax
        type: object
      metric:
        type: string
      regexLabels:
        additionalProperties:
          type: string
        description: regex labels from {key=~"pattern"} syntax
        type: object
      severity:
        type: string
      tenant:
        type: string
      value:
        format: float64
        type: number
    type: object
  github_com_vencil_tenant-api_internal_federation_fedpolicy.Config:
    properties:
      whitelist:
        items:
          $ref: '#/definitions/github_com_vencil_tenant-api_internal_federation_fedpolicy.WhitelistEntry'
        type: array
    type: object
  github_com_vencil_tenant-api_internal_federation_fedpolicy.Subset:
    properties:
      metrics:
        items:
          type: string
        type: array
    type: object
  github_com_vencil_tenant-api_internal_federation_fedpolicy.WhitelistEntry:
    properties:
      metric:
        type: string
    type: object
  github_com_vencil_tenant-api_internal_generator.Finding:
    properties:
      blocks:
        type: string
      field:
        type: string
      file:
        type: string
      kind:
        type: string
      message:
        type: string
      policy:
        type: string
      pre_existing:
        description: |-
          PreExisting: the same finding is reported on the base commit without
          this write. nil when the base was not judged (see
          FindingsError.ComparedWithBase).
        type: boolean
      related:
        description: 'Related: the finding names a file or a tenant this write changes.'
        type: boolean
      severity:
        type: string
      tenant:
        type: string
    type: object
  github_com_vencil_tenant-api_internal_platform.MergeableState:
    enum:
    - ""
    - mergeable
    - conflict
    type: string
    x-enum-varnames:
    - MergeableUnknown
    - MergeableOK
    - MergeableConflict
  github_com_vencil_tenant-api_internal_platform.PRInfo:
    properties:
      created_at:
        description: ISO 8601 timestamp
        type: string
      head_ref:
        description: Source branch name
        type: string
      mergeable:
        allOf:
        - $ref: '#/definitions/github_com_vencil_tenant-api_internal_platform.MergeableState'
        description: |-
          Mergeable is the conflict-visibility tri-state (#646). GitLab populates
          it from the list-MR response's detailed_merge_status (free); GitHub
          leaves it MergeableUnknown (list-PRs API omits it). See MergeableState.
      number:
        description: GitHub PR number or GitLab MR IID
        type: integer
      state:
        description: '"open"/"opened", "closed", "merged"'
        type: string
      tenant_id:
        description: Extracted from branch name; empty for a batch PR/MR
        type: string
      tenants:
        description: |-
          Tenants are the tenants a batch PR/MR covers, as tenant-api recorded
          them when it created the PR/MR (#3123). Empty for a single-tenant PR/MR,
          and for a batch PR/MR this process did not create (e.g. after a
          restart): such a PR/MR is shown only to callers who read every tenant.
        items:
          type: string
        type: array
      title:
        description: PR/MR title
        type: string
      web_url:
        description: Browser-accessible URL
        type: string
    type: object
  github_com_vencil_tenant-api_internal_rbac.BoolProvenance:
    properties:
      source:
        type: string
      value:
        type: boolean
    type: object
  github_com_vencil_tenant-api_internal_rbac.CoverageGap:
    properties:
      status:
        type: string
      surface:
        type: string
    type: object
  github_com_vencil_tenant-api_internal_rbac.EffectivePerms:
    properties:
      admin:
        type: boolean
      read:
        type: boolean
      write:
        type: boolean
    type: object
  github_com_vencil_tenant-api_internal_rbac.Permission:
    enum:
    - read
    - write
    - admin
    type: string
    x-enum-varnames:
    - PermRead
    - PermWrite
    - PermAdmin
  github_com_vencil_tenant-api_internal_rbac.ReverseCompleteness:
    properties:
      covers:
        items:
          type: string
        type: array
      not_covered:
        items:
          $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.CoverageGap'
        type: array
    type: object
  github_com_vencil_tenant-api_internal_rbac.ReverseConfigAnchor:
    properties:
      rbac_sha256:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.StringProvenance'
      tenant_orgs_sha256:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.StringProvenance'
    type: object
  github_com_vencil_tenant-api_internal_rbac.ReverseFlags:
    properties:
      metadata_scope_enforce:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.BoolProvenance'
      org_scope_enforce:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.BoolProvenance'
    type: object
  github_com_vencil_tenant-api_internal_rbac.ReverseGrant:
    properties:
      constraints_not_evaluated:
        description: |-
          ConstraintsNotEvaluated is the fixed machine-readable declaration that
          this report transcribes environments/domains but never evaluates them
          against the tenant's actual labels (axis-2 decision 2b) — a reader must
          not treat a transcribed constraint as a verified restriction.
        items:
          type: string
        type: array
      domains:
        items:
          type: string
        type: array
      domains_count:
        description: redacted view only
        type: integer
      effective:
        allOf:
        - $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.EffectivePerms'
        description: ruleGrants expansion
      environments:
        description: |-
          Environments/Domains transcribe the rule verbatim; NOT evaluated against
          tenant labels (axis 2). The redacted view STRIPS the verbatim strings —
          they are free-form text that can carry customer-recognizable markers, and
          the redacted audience is wider than platform admins — keeping the keys
          (emptied) and carrying the sizes in EnvironmentsCount/DomainsCount
          (redacted view only, mirroring who.groups_count/claims_count).
        items:
          type: string
        type: array
      environments_count:
        description: redacted view only
        type: integer
      index:
        type: integer
      org_gate:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.ReverseOrgGate'
      pattern_kind:
        description: 'redacted view only: literal|prefix|wildcard'
        type: string
      permissions:
        description: rule verbatim
        items:
          $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.Permission'
        type: array
      platform_wide:
        description: |-
          PlatformWide is RULE-level: true iff ANY pattern in the rule's tenant
          list is the literal "*" (the same tenantMatches(rule.Tenants, "*") borrow
          the endpoint bar runs) — NOT a property of the first-hit TenantPattern,
          which stays the narrower member on a mixed list like ["db-team-1","*"].
        type: boolean
      rule:
        description: stripped in the redacted view
        type: string
      surfaces:
        items:
          type: string
        type: array
      tenant_pattern:
        description: the pattern that hit X; stripped when redacted
        type: string
      who:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.ReverseWho'
    type: object
  github_com_vencil_tenant-api_internal_rbac.ReverseOrgGate:
    properties:
      claim_key:
        type: string
      outcome_enforce:
        type: string
      outcome_shadow:
        type: string
      passing_org_values:
        description: opt-in (IncludeOrgValues); sorted
        items:
          type: string
        type: array
      required:
        type: boolean
      unsatisfiable:
        type: boolean
    type: object
  github_com_vencil_tenant-api_internal_rbac.ReverseReport:
    properties:
      advisory:
        type: string
      completeness:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.ReverseCompleteness'
      config_anchor:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.ReverseConfigAnchor'
      flags:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.ReverseFlags'
      generated_at:
        type: string
      grants:
        items:
          $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.ReverseGrant'
        type: array
      mode:
        type: string
      schema_version:
        type: integer
      tenant:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.ReverseTenant'
      verdict:
        type: string
    type: object
  github_com_vencil_tenant-api_internal_rbac.ReverseTenant:
    properties:
      id:
        type: string
      org_status:
        type: string
      orgs:
        description: opt-in; sorted; absent by default
        items:
          type: string
        type: array
    type: object
  github_com_vencil_tenant-api_internal_rbac.ReverseWho:
    properties:
      claims_all_of:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      claims_count:
        description: redacted view only
        type: integer
      groups_any_of:
        items:
          type: string
        type: array
      groups_count:
        description: redacted view only
        type: integer
      kind:
        type: string
      legacy_group:
        type: string
    type: object
  github_com_vencil_tenant-api_internal_rbac.StringProvenance:
    properties:
      source:
        type: string
      value:
        type: string
    type: object
  internal_handler.AccessResponse:
    properties:
      allow:
        description: Allow is always true in a 200 response (see the type doc).
        type: boolean
      permission:
        description: Permission is the permission level that was checked.
        type: string
      tenant:
        description: Tenant echoes the authorized tenant ID.
        type: string
    type: object
  internal_handler.BatchOperation:
    properties:
      patch:
        additionalProperties:
          type: string
        description: |-
          key → value to set (e.g., "_silent_mode": "warning"); at most 1000 entries.
          May be omitted; an operation with neither patch nor unset changes nothing.
        type: object
      tenant_id:
        maxLength: 256
        minLength: 1
        type: string
      unset:
        description: |-
          keys to remove from the tenant's config block; at most 1000 entries. Only "_routing" and
          "_routing_receiver_type" are accepted: removing `_routing` resets the tenant to
          `_routing_defaults` and its routing profile, which turns routing back on for a tenant a
          disabling `_routing` turned off (the route generator judges the result, as every
          write); removing `_routing_receiver_type` drops the flat key tenant-api used to write,
          which nothing renders (#2983). A key the tenant does not carry, or a
          tenant that does not exist, makes it a no-op: with no patch nothing is written and no
          tenant is created. A key must not appear twice, nor in both patch and unset.
        items:
          type: string
        maxItems: 1000
        type: array
    required:
    - tenant_id
    type: object
  internal_handler.BatchRequest:
    properties:
      operations:
        items:
          $ref: '#/definitions/internal_handler.BatchOperation'
        maxItems: 1000
        minItems: 1
        type: array
    required:
    - operations
    type: object
  internal_handler.BatchResponse:
    properties:
      findings:
        description: |-
          Findings is set on a batch the generator container refused with
          findings (#2903, ADR-036 §4; every result then has code
          GENERATOR_FINDINGS): its --findings-json entries for the tree the
          batch would produce, the ones naming a file or tenant of the batch
          first and marked related; pre_existing when the base was judged too
          (FindingsComparedWithBase). Unrelated findings only for a caller with
          write permission on all tenants; others get UnrelatedFindingsWithheld.
        items:
          $ref: '#/definitions/github_com_vencil_tenant-api_internal_generator.Finding'
        type: array
      findings_compared_with_base:
        type: boolean
      message:
        description: 'v2.6.0: human-readable message'
        type: string
      pr_number:
        description: 'v2.6.0: PR/MR number in PR mode'
        type: integer
      pr_url:
        description: 'v2.6.0: PR/MR URL in PR mode'
        type: string
      results:
        items:
          $ref: '#/definitions/internal_handler.BatchResult'
        type: array
      status:
        description: '"completed" | "pending_review" (PR mode) | "rejected" (HTTP
          422: an op was refused, nothing written)'
        type: string
      summary:
        description: 'e.g., "5 succeeded"; a rejected batch: "1 failed, 4 not applied"'
        type: string
      task_id:
        description: async task ID
        type: string
      unrelated_findings_withheld:
        type: integer
      warnings:
        description: |-
          Warnings is the batch-level advisory list for PR mode (#1231): the
          per-op notices aggregated by WritePRBatch. Batch-level (not per-result)
          because PR-mode Results are frozen at "included" BEFORE the write runs;
          each notice self-identifies its tenant (`tenant=<id>` in the wording).
        items:
          type: string
        type: array
    type: object
  internal_handler.BatchResult:
    properties:
      code:
        description: |-
          Code is a machine-readable error code for a FAILED op, set only for the
          failure classes a client is expected to branch on: TENANT_DECLARED_ELSEWHERE,
          TENANT_CONFIG_NOT_LOADABLE (the tenant file cannot be loaded as a tenant
          config, #2373), TENANT_GIT_MANAGED (the op's tenant is git-managed, #3064:
          nothing written, change it in git), INTERNAL_ERROR (the conf.d walk behind
          that check could not
          run, or another server-side failure), the route generator's codes
          (GENERATOR_FINDINGS, GENERATOR_REJECTED, VALIDATOR_UNAVAILABLE,
          POLICY_UNAVAILABLE; #2903), and — PR mode, judged on the latest base branch —
          FORBIDDEN (write scope) and CONFIG_DECODE_ERROR (the base's
          _tenant_orgs.yaml cannot be read). Empty for every other failure and for an
          op that was not refused.
        type: string
      message:
        type: string
      status:
        description: |-
          "ok" | "error" | "not_applied"; PR mode: "included" for an op taken into
          the PR/MR. A batch is all or nothing: when any op is "error", nothing in
          the batch is written and every op that was not refused itself is
          "not_applied". A group batch also reports "skipped" for a member that
          does not exist on the base the write merges into (message "tenant does
          not exist"); nothing is written for it, and it does not fail the batch.
        type: string
      tenant_id:
        type: string
      warnings:
        description: |-
          Warnings carries non-blocking advisories for an op that SUCCEEDED
          (#1231 deprecated-key alias notices from the direct write path).
          Error results never carry warnings — Message owns the failure text.
        items:
          type: string
        type: array
    type: object
  internal_handler.BoolDelta:
    properties:
      from:
        type: boolean
      to:
        type: boolean
    type: object
  internal_handler.ConfigDerivedMeta:
    properties:
      config_loaded_at:
        description: When conf.d was last loaded into the cache the states were evaluated
          from.
        type: string
      evaluated_at:
        description: Request time the states were evaluated at (silences and maintenance
          windows with `expires` are judged against it).
        type: string
      load_error:
        description: Set when conf.d could not be loaded at all; no tenant then has
          config_derived. The loader's own message (paths relative to conf.d) only
          for unrestricted callers; any other caller gets a fixed message, since the
          loader's message names other tenants.
        type: string
      parse_failed_files:
        description: conf.d files threshold-exporter skips because they fail to parse
          — a broken file, not a missing tenant. Unrestricted callers (open mode,
          or an admin restricted on no org, environment or domain) get root-relative
          paths; any other caller gets only the file name, and only for a file named
          after a tenant it could see as a degraded list row. Other files are left
          out without trace (not even counted).
        items:
          type: string
        type: array
    type: object
  internal_handler.ConfigDerivedState:
    properties:
      maintenance_active:
        description: Whether the exporter would emit user_state_filter{filter="maintenance"}
          for this tenant.
        type: boolean
      silent_targets:
        description: Severities whose notifications the exporter's user_silent_mode
          would silence ("critical" / "warning"), sorted; [] when none.
        items:
          type: string
        type: array
    type: object
  internal_handler.DiffRequest:
    properties:
      proposed:
        description: proposed YAML content
        type: string
    type: object
  internal_handler.DiffResponse:
    properties:
      diff:
        type: string
      has_diff:
        type: boolean
      masked:
        description: |-
          Masked is true when the caller may read the tenant but not write it
          (#1560): the diff is then between the masked forms of the current file
          and the proposal — re-encoded, without comments, every receiver
          credential replaced by "<masked: write permission required>" — so
          has_diff does not report a change to a credential value.
        type: boolean
      tenant_id:
        type: string
    type: object
  internal_handler.DiscoverMetricsResponse:
    properties:
      metrics:
        description: Metrics is the sorted list of metric names visible to this tenant.
        items:
          type: string
        type: array
      truncated:
        description: |-
          Truncated is true when the result hit the server-side cap; the
          caller should narrow with a longer prefix.
        type: boolean
    type: object
  internal_handler.DryRunAdded:
    properties:
      candidate_index:
        type: integer
      rule:
        description: stripped in the redacted view
        type: string
    type: object
  internal_handler.DryRunCandidate:
    properties:
      rbac_yaml:
        type: string
    type: object
  internal_handler.DryRunChanged:
    properties:
      candidate_index:
        type: integer
      claim_key:
        allOf:
        - $ref: '#/definitions/internal_handler.StringDelta'
        description: |-
          ClaimKey is the fourth axis: org_gate.claim_key (rule.OrgScope). A
          same-name pair that re-scopes to a different declared claim key changes
          here even when the three outcome axes are identical (e.g. an unlabeled
          tenant, where every required gate reads pass/fail_unlabeled regardless of
          which key). The claim key IS a claim identifier, so it is DROPPED in the
          redacted view (mirroring ReverseOrgGate.ClaimKey) — the redact rebuild's
          allowlist simply never copies it forward.
      live_index:
        type: integer
      outcome_enforce:
        $ref: '#/definitions/internal_handler.StringDelta'
      outcome_shadow:
        $ref: '#/definitions/internal_handler.StringDelta'
      rule:
        description: stripped in the redacted view
        type: string
      unsatisfiable:
        $ref: '#/definitions/internal_handler.BoolDelta'
    type: object
  internal_handler.DryRunDiff:
    properties:
      added:
        items:
          $ref: '#/definitions/internal_handler.DryRunAdded'
        type: array
      alignment:
        type: string
      changed:
        items:
          $ref: '#/definitions/internal_handler.DryRunChanged'
        type: array
      removed:
        items:
          $ref: '#/definitions/internal_handler.DryRunRemoved'
        type: array
      unchanged:
        items:
          $ref: '#/definitions/internal_handler.DryRunUnchanged'
        type: array
    type: object
  internal_handler.DryRunRemoved:
    properties:
      live_index:
        type: integer
      rule:
        description: stripped in the redacted view
        type: string
    type: object
  internal_handler.DryRunRequest:
    properties:
      candidate:
        $ref: '#/definitions/internal_handler.DryRunCandidate'
    type: object
  internal_handler.DryRunResponse:
    properties:
      baseline:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.ReverseReport'
      candidate:
        $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.ReverseReport'
      candidate_sha256:
        type: string
      caveats:
        items:
          type: string
        type: array
      diff:
        $ref: '#/definitions/internal_handler.DryRunDiff'
      generated_at:
        type: string
      schema_version:
        type: integer
    type: object
  internal_handler.DryRunUnchanged:
    properties:
      candidate_index:
        type: integer
      live_index:
        type: integer
      rule:
        description: stripped in the redacted view
        type: string
    type: object
  internal_handler.GroupBatchRequest:
    properties:
      patch:
        additionalProperties:
          type: string
        description: |-
          key → value to set on every member (e.g., "_silent_mode": "warning");
          at most 1000 entries. May be empty only when unset names a key (else 400).
        type: object
      unset:
        description: |-
          keys to remove from every member's config block; at most 1000 entries. Only "_routing" and
          "_routing_receiver_type" are accepted: removing `_routing` resets the member to
          `_routing_defaults` and its routing profile, which turns routing back on for a member a
          disabling `_routing` turned off (the route generator judges the result, as every
          write); removing `_routing_receiver_type` drops the flat key tenant-api used to write,
          which nothing renders (#2983). A key the member does not carry makes it
          a no-op. A key must not appear twice, nor in both patch and unset.
        items:
          type: string
        maxItems: 1000
        type: array
    type: object
  internal_handler.GroupBatchResponse:
    properties:
      findings:
        description: |-
          Findings, FindingsComparedWithBase, UnrelatedFindingsWithheld: as in
          BatchResponse — a batch the generator container refused with
          findings (#2903).
        items:
          $ref: '#/definitions/github_com_vencil_tenant-api_internal_generator.Finding'
        type: array
      findings_compared_with_base:
        type: boolean
      group_id:
        type: string
      message:
        description: human-readable message (PR mode)
        type: string
      pr_number:
        description: PR/MR number in PR mode
        type: integer
      pr_url:
        description: PR/MR URL in PR mode
        type: string
      results:
        items:
          $ref: '#/definitions/internal_handler.BatchResult'
        type: array
      status:
        description: '"completed" | "pending_review" (PR mode) | "rejected" (HTTP
          422: a member was refused, nothing written)'
        type: string
      summary:
        description: 'e.g., "5 succeeded"; a rejected batch: "1 failed, 4 not applied"'
        type: string
      task_id:
        type: string
      unrelated_findings_withheld:
        type: integer
      warnings:
        description: |-
          Warnings is the batch-level advisory list for PR mode, as in
          BatchResponse.Warnings; each notice names its tenant.
        items:
          type: string
        type: array
    type: object
  internal_handler.GroupResponse:
    properties:
      description:
        type: string
      filters:
        additionalProperties:
          type: string
        type: object
      id:
        type: string
      label:
        type: string
      members:
        items:
          type: string
        type: array
    type: object
  internal_handler.MeResponse:
    properties:
      accessible_domains:
        description: nil = all
        items:
          type: string
        type: array
      accessible_environments:
        description: nil = all
        items:
          type: string
        type: array
      accessible_tenants:
        items:
          type: string
        type: array
      claims:
        additionalProperties:
          type: string
        description: |-
          Claims are the named verified claims carried by the request principal
          (ADR-027 / LD-6 P2; declared via --identity-claim-headers). omitempty:
          with no claim axes declared (nil map) the key is absent, keeping the
          zero-config response body byte-identical to pre-P2. Go serialises map
          keys sorted, so the rendering is deterministic.
        type: object
      email:
        type: string
      groups:
        items:
          type: string
        type: array
      org_claim_keys:
        description: |-
          OrgClaimKeys are the org-scope claim keys of the rules THIS caller
          matches (ADR-027 / LD-6 P7) — a caller-relative fact ("which of my
          claims act as an org axis for me"), NOT "does the platform run an org
          axis". Intersected with the principal's present claims by construction:
          the redacted reverse report strips claim keys as customer-recognizable
          identifiers (they name the identity axes a deployment runs), so /me
          must not reveal an org-scope key name the caller does not already
          carry a value for. Sorted, de-duplicated; omitempty keeps the zero-org
          (and pre-P7) response body byte-identical.
        items:
          type: string
        type: array
      permissions:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      user:
        type: string
    type: object
  internal_handler.PRListResponse:
    properties:
      count:
        type: integer
      pending_prs:
        items:
          $ref: '#/definitions/github_com_vencil_tenant-api_internal_platform.PRInfo'
        type: array
    type: object
  internal_handler.PutCustomAlertsRequest:
    properties:
      base_hash:
        description: |-
          BaseHash is the source_hash the client got from GET. REQUIRED —
          optimistic concurrency is the safe default, not opt-in: an empty
          base_hash would silently disable clobber protection (self-review F2).
        type: string
      custom_alerts:
        description: |-
          CustomAlerts is the desired FULL recipe list (collection-replace —
          the client owns the array, having loaded it via GET). A POINTER so an
          ABSENT field (nil) is rejected — a truncated/buggy request must NOT
          be read as "delete every recipe" (self-review F1, a data-loss
          footgun). An explicit empty array `[]` IS the intentional delete-all
          (Reef 2).
        items:
          additionalProperties: {}
          type: object
        type: array
    type: object
  internal_handler.PutCustomAlertsResponse:
    properties:
      source_hash:
        description: new hash post-write (for the next edit)
        type: string
      status:
        type: string
      tenant_id:
        type: string
      warnings:
        description: |-
          Warnings carries non-blocking advisories for a write that SUCCEEDED —
          the #1231 deprecated-key alias notices from the shared write-boundary
          validation. They concern the tenant file's THRESHOLD keys (the write
          re-validates the whole merged document), not the recipes being saved:
          this endpoint is the portal's only tenant-file write path, so it is
          where a mysql_cpu-era file gets its author-facing migration signal.
        items:
          type: string
        type: array
    type: object
  internal_handler.PutGroupRequest:
    properties:
      description:
        maxLength: 4096
        type: string
      filters:
        additionalProperties:
          type: string
        type: object
      label:
        maxLength: 256
        minLength: 1
        type: string
      members:
        description: |-
          At least one member (#3123): an empty group has nothing to authorize a
          reader or writer against. Emptying a group is a DELETE.
        items:
          type: string
        maxItems: 1000
        minItems: 1
        type: array
    required:
    - label
    type: object
  internal_handler.PutTenantResponse:
    properties:
      message:
        type: string
      pr_number:
        type: integer
      pr_url:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      warnings:
        description: |-
          Warnings carries NON-BLOCKING advisories for a write that SUCCEEDED —
          currently the #1231 deprecated-key alias notices (e.g. a body still
          spelling mysql_threads_running as mysql_cpu). The write went through;
          these tell the author what to migrate before the transition window
          closes. Never populated on error responses.
        items:
          type: string
        type: array
    type: object
  internal_handler.PutViewRequest:
    properties:
      description:
        maxLength: 1024
        type: string
      filters:
        additionalProperties:
          type: string
        type: object
      label:
        maxLength: 256
        minLength: 1
        type: string
    required:
    - filters
    - label
    type: object
  internal_handler.SearchResponse:
    properties:
      config_derivation:
        $ref: '#/definitions/internal_handler.ConfigDerivedMeta'
      items:
        items:
          $ref: '#/definitions/internal_handler.TenantSummary'
        type: array
      next_offset:
        description: Offset of the next page; null on the last page.
        type: integer
        x-nullable: true
      page_size:
        type: integer
      total_matched:
        type: integer
    type: object
  internal_handler.StringDelta:
    properties:
      from:
        type: string
      to:
        type: string
    type: object
  internal_handler.TenantDetail:
    properties:
      config_error:
        description: |-
          ConfigError is set when the tenant's file cannot be loaded as a tenant
          config (#2373) — the same reason GET /api/v1/tenants reports on the
          tenant's row: malformed_yaml (not parseable as YAML) or invalid_config
          (parses as YAML but cannot be loaded as a tenant config — wrong shape,
          errors only a typed decode detects, or a declared tenant id that is not
          valid UTF-8). threshold-exporter skips such a file whole, so nothing is
          derived from it: raw_yaml and source_hash are returned for an
          API-managed tenant (so the file can be opened and fixed; withheld as
          RawYAMLWithheld says) — a file that is not YAML is git-managed (#3064,
          ManagedBy), so neither is returned for it — and resolved_thresholds, custom_alerts,
          validation_warnings and validation_notices are ABSENT — not empty,
          which would read as "none". Partial writes (PUT .../custom-alerts, the
          batch patches) refuse such a file (TENANT_CONFIG_NOT_LOADABLE) until
          the tenant file itself is repaired. Absent on a usable file.
        enum:
        - malformed_yaml
        - invalid_config
        type: string
      custom_alerts:
        description: |-
          CustomAlerts is the tenant's `_custom_alerts` recipes as structured
          JSON (ADR-024 §S6b-2). The portal recipe modal reads this directly so
          the client never parses YAML — the backend owns the round-trip on both
          read and write. Empty slice when the tenant has none.
        items:
          additionalProperties: {}
          type: object
        type: array
      git_managed_reason:
        description: |-
          GitManagedReason says why the tenant is git-managed (managed_by: git):
          not_tenant_document (not YAML, or its root or tenants: is not a
          mapping), several_documents, yaml_indirection, tenant_count (several
          tenants), id_mismatch (the one tenant is not the file's name). A
          fixed code: it names no tenant. Absent when managed_by is api.
        enum:
        - not_tenant_document
        - several_documents
        - yaml_indirection
        - tenant_count
        - id_mismatch
        type: string
      id:
        type: string
      managed_by:
        description: |-
          ManagedBy is "api" when the tenant's conf.d file is API-shaped (#3064):
          one YAML document declaring only this tenant (or none yet), under the
          file's own name, with no anchor, alias, merge key (<<) or tagged key at
          the top level or directly under tenants:. Such a file is the tenant's alone:
          raw_yaml, source_hash and custom_alerts describe this tenant only, and
          the writes accept it. "git" for every other file (shared with other
          tenants, a name that is not the declared id, several documents, YAML
          indirection where tenants are declared, not YAML): the tenant is
          changed only in git, the answer carries the effective view alone —
          resolved_thresholds and the validation fields (or config_error) — with
          raw_yaml, source_hash and custom_alerts ABSENT, and every write is
          refused with 409 TENANT_GIT_MANAGED.
        enum:
        - api
        - git
        type: string
      masked:
        description: |-
          Masked is true when the caller may read this tenant but not write it
          (#1560): raw_yaml is then the file re-encoded with every receiver
          credential (webhook / chat URLs, PagerDuty keys, passwords, tokens)
          replaced by the placeholder "<masked: write permission required>" and
          without comments, and custom_alerts is masked the same way. A PUT
          carrying the placeholder is refused (400), so a masked copy cannot be
          written back over the real values. source_hash is then empty: a hash
          of the stored file would let a guess be checked offline.
        type: boolean
      raw_yaml:
        type: string
      raw_yaml_withheld:
        description: |-
          RawYAMLWithheld is true, with raw_yaml, custom_alerts and source_hash
          empty, when the caller would be shown the masked form but the file
          cannot be masked with certainty: it uses an anchor or alias inside the
          tenant's section (a credential can be placed outside any credential
          field through one).
        type: boolean
      resolved_thresholds:
        items:
          $ref: '#/definitions/config.ResolvedThreshold'
        type: array
      source_hash:
        description: |-
          SourceHash is SHA-256[:16] of the raw tenant file. Clients echo it
          back as `base_hash` on PUT .../custom-alerts for optimistic-
          concurrency (ADR-024 §S6b-2): the write 409s if the file changed
          underneath them.
        type: string
      validation_notices:
        items:
          type: string
        type: array
      validation_warnings:
        description: |-
          Warnings is the BLOCKING validation set (KeyValidation.Errors) — what a
          write of this exact file would be rejected on. It judges only the keys
          the tenant's own file writes: a problem in a root platform file's
          `tenants:` entry for this tenant (#2208), or in the profile the tenant
          elects (#1385), is never here. Notices is the advisory set, which
          never blocks a write: deprecated-key alias notices (#1231 — the file
          keeps resolving and writing, but carries a spelling the author should
          migrate), one notice per problem in a root platform file's entry for
          this tenant, naming that file ("platform file <name>, entry
          tenants.<id>: …"), and one per problem in the part of the elected
          profile that reaches this tenant, naming the file and the profile
          ("platform file <name>, profile "<p>" …") — the platform operator
          fixes those there. Split fields so a client never has to text-parse
          severity out of one list.
        items:
          type: string
        type: array
    type: object
  internal_handler.TenantEffectiveResponse:
    properties:
      chain_parse_failed:
        description: |-
          ChainParseFailed is every file of DefaultsChain that does not parse
          and that /metrics therefore does not read at all (it is in the build's
          ParseFailed): the resolve reads it as an empty file, as the exporter
          does, instead of failing the tenant (#2296). Root-relative, chain
          order. Filled by ResolveEffective and EffectiveTree; omitted when none.
        items:
          type: string
        type: array
      defaults_chain:
        items:
          type: string
        type: array
      effective_config:
        additionalProperties: {}
        type: object
      masked:
        description: |-
          Masked is true when every receiver credential in effective_config was
          replaced by the placeholder "<masked: write permission required>"
          because the caller may read the tenant but not write it; source_hash
          and merged_hash are then empty.
        type: boolean
      merged_hash:
        type: string
      not_served:
        additionalProperties:
          $ref: '#/definitions/config.NotServedKey'
        description: |-
          NotServed names each key of EffectiveConfig whose value, as shown,
          /metrics does not serve, with the reason the exporter's own build or
          resolver gives for it and the file of the value shown (#2296,
          not_served.go). EffectiveConfig keeps the value as written. Filled by
          ResolveEffective and EffectiveTree; nil from ScopeEffective, and
          omitted when no key is named.
        type: object
      platform_overlay:
        description: |-
          PlatformOverlay names the root platform files whose `tenants:` block
          supplied values to EffectiveConfig (#2019), in merge order, each with
          the top-level keys it supplied — only keys the tenant file does not
          write and no later platform file overwrote. Omitted when that layer
          contributes nothing. Same name and shape as describe_tenant.py.
        items:
          $ref: '#/definitions/config.PlatformOverlaySource'
        type: array
      profile_overlay:
        description: |-
          ProfileOverlay names the profile the tenant is on (`_profile`, from
          the tenant file or the platform overlay) and, per root platform file
          that profile's filled-in values came from (merge order), the
          top-level keys it supplied to EffectiveConfig — only keys neither the
          tenant file nor the platform overlay writes (#2117). Omitted when the
          profile contributes nothing (no `_profile`, an unknown profile, or
          every key already set). Same name and shape as describe_tenant.py.
        items:
          $ref: '#/definitions/config.ProfileOverlaySource'
        type: array
      source_file:
        type: string
      source_hash:
        type: string
      source_hash_withheld:
        description: |-
          SourceHashWithheld is true, with source_hash empty, when the tenant
          is git-managed (#3064: its file is not API-shaped — shared with other
          tenants, say), for every caller: source_hash is the hash of that whole
          file, which no write may use as a base and which confirms a guess of
          it offline (#3050). merged_hash is this tenant's merge only.
        type: boolean
      tenant_id:
        type: string
      warnings:
        items:
          type: string
        type: array
    type: object
  internal_handler.TenantSummary:
    properties:
      config_derived:
        allOf:
        - $ref: '#/definitions/internal_handler.ConfigDerivedState'
        description: 'Silent-mode / maintenance state DERIVED FROM CONFIG (「依設定推算」)
          at request time — what threshold-exporter would emit for this conf.d, not
          a reading from Alertmanager. Absent when it cannot be derived: a degraded
          row (config_error), a file the exporter skips, or conf.d not loading (see
          config_derivation on the search response).'
      config_error:
        description: |-
          ConfigError is set on a DEGRADED row (#1680): the tenant's conf.d file
          exists but is not usable, so every other field except ID is empty —
          its metadata is UNKNOWN, not unlabeled. Absent on a healthy row.
          Values: unreadable (stat/read failed, e.g. an unresolvable symlink —
          dangling, looping or through a non-directory — or a permission
          error), not_regular_file (e.g. a symlink to a directory),
          malformed_yaml (not parseable as YAML), invalid_config (parses as YAML
          at the syntax level but cannot be loaded as a tenant config — wrong
          shape, errors the YAML library only detects on a typed decode, such
          as duplicate keys, or a declared tenant id that is not valid UTF-8,
          which threshold-exporter rejects the whole file for). The first three
          come from confd.FileProblem; invalid_config is decided by this handler.
        enum:
        - unreadable
        - not_regular_file
        - malformed_yaml
        - invalid_config
        type: string
      db_type:
        type: string
      domain:
        type: string
      environment:
        type: string
      groups:
        items:
          type: string
        type: array
      id:
        type: string
      maintenance:
        description: Raw `_state_maintenance` value from the tenant's own config file,
          not the tenant's state (see config_derived); omitted when config_derived
          cannot be derived.
        type: string
      metadata_incomplete:
        description: 'Set when the row''s metadata is unknown: the conf.d root platform
          files could not be read (the metadata fields then carry only the tenant
          file''s own `_metadata` values), or the tenant''s `_metadata` does not decode
          (the metadata fields are then empty, as threshold-exporter reads them).
          The row''s visibility is that of a degraded row (only callers whose matching
          RBAC rule does not restrict environments or domains see it); the search
          metadata filters do not match it. Absent otherwise.'
        type: boolean
      owner:
        type: string
      profile:
        type: string
      region:
        type: string
      silent_mode:
        description: Raw `_silent_mode` value from the tenant's own config file, not
          the tenant's state (see config_derived); omitted when config_derived cannot
          be derived.
        type: string
      tags:
        items:
          type: string
        type: array
      tier:
        type: string
    type: object
  internal_handler.ValidateResponse:
    properties:
      code:
        description: |-
          Code is TENANT_GIT_MANAGED when the verdict is PUT's refusal of a
          git-managed tenant (#3064; warnings carries its text), so a client can
          tell "change this tenant in git" from a body to fix. Absent otherwise.
        enum:
        - TENANT_GIT_MANAGED
        type: string
      notices:
        items:
          type: string
        type: array
      valid:
        type: boolean
      warnings:
        items:
          type: string
        type: array
    type: object
  internal_handler.ViewResponse:
    properties:
      created_by:
        type: string
      description:
        type: string
      filters:
        additionalProperties:
          type: string
        type: object
      id:
        type: string
      label:
        type: string
    type: object
  internal_handler_federation.BackfillAccountsResponse:
    properties:
      allocated:
        description: |-
          Allocated lists the tenants that received a NEW account_id, in
          allocation (id-ascending) order.
        items:
          type: string
        type: array
      allocated_count:
        description: AllocatedCount is len(Allocated) — convenient for the operator.
        type: integer
      already_present:
        description: |-
          AlreadyPresent is how many scanned tenants already held an id (so a
          re-run shows 0 newly allocated and every tenant already present).
        type: integer
      status:
        type: string
    type: object
  internal_handler_federation.CreateFederationTokenRequest:
    properties:
      capability:
        enum:
        - metrics
        - logs
        type: string
      description:
        maxLength: 256
        type: string
      tenant_id:
        maxLength: 128
        minLength: 1
        type: string
    required:
    - tenant_id
    type: object
  internal_handler_federation.CreateFederationTokenResponse:
    properties:
      record:
        $ref: '#/definitions/internal_handler_federation.FederationTokenRecord'
      token:
        type: string
    type: object
  internal_handler_federation.FederationTokenRecord:
    properties:
      account_id:
        type: integer
      capability:
        type: string
      description:
        type: string
      expires_at:
        type: string
      issued_at:
        type: string
      issued_by:
        type: string
      tenant_id:
        type: string
      token_id:
        type: string
    type: object
  internal_handler_federation.PutFederationPolicyRequest:
    properties:
      force:
        type: boolean
      reason:
        type: string
      whitelist:
        items:
          $ref: '#/definitions/github_com_vencil_tenant-api_internal_federation_fedpolicy.WhitelistEntry'
        type: array
    type: object
info:
  contact: {}
  description: |-
    Multi-tenant configuration management API for the Dynamic Alerting Platform.
    Provides CRUD over per-tenant alert thresholds, RBAC-scoped writes, and async batch operations.
    Auth is enforced by the oauth2-proxy sidecar and forwarded via X-Forwarded-Email / X-Forwarded-Groups.
  license:
    name: See repository LICENSE
  title: Tenant API
  version: v2.8.0
paths:
  /api/v1/audit/tenants/{id}/access-report:
    get:
      description: |-
        Enumerates the live RBAC config with the SAME predicates the
        forward gates run and reports, per rule, who is granted what on
        tenant {id} under which org-gate conditions (both shadow and
        enforce outcomes). Audit-only: authorization decisions remain
        with the forward gates. Requires a NON-org-scoped platform
        admin grant; all other callers receive a constant 403
        regardless of {id} (no tenant-enumeration oracle). Note the
        redacted view cannot remove the org-membership inference carried
        by a grant entry's mere existence: for a value-pinned org rule,
        the grant entry itself is weakly identifying.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Opt-in expansions
        enum:
        - org_values
        in: query
        name: include
        type: string
      - default: full
        description: Report projection
        enum:
        - full
        - redacted
        in: query
        name: view
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vencil_tenant-api_internal_rbac.ReverseReport'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 'Reverse access report: who can access this tenant (audit-only)'
      tags:
      - audit
  /api/v1/audit/tenants/{id}/access-report/dry-run:
    post:
      consumes:
      - application/json
      description: |-
        Evaluates an operator-supplied candidate _rbac.yaml through the
        SAME strict parse+validation pipeline and reverse-report core
        the live config runs, WITHOUT installing it, and reports what
        would change for tenant {id}: the live baseline report, the
        candidate report (config_anchor honestly unanchored; the
        envelope's candidate_sha256 pins the submitted bytes), and a
        structural diff paired by rule name before any redaction.
        Mutates nothing. Requires the same NON-org-scoped platform
        admin grant as the GET endpoint; all other callers receive the
        byte-identical constant 403 (no tenant-enumeration oracle).
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Opt-in expansions
        enum:
        - org_values
        in: query
        name: include
        type: string
      - default: full
        description: Report projection
        enum:
        - full
        - redacted
        in: query
        name: view
        type: string
      - description: Candidate config envelope
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.DryRunRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.DryRunResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 'What-if dry-run: diff a candidate _rbac.yaml''s access report (audit-only)'
      tags:
      - audit
  /api/v1/federation/accounts/backfill:
    post:
      description: Assigns a monotonic account_id (ADR-021) to every conf.d tenant
        lacking one, in one committed registry write. Idempotent. Requires platform
        admin.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_federation.BackfillAccountsResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Backfill account IDs for all existing tenants
      tags:
      - federation
  /api/v1/federation/policy:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vencil_tenant-api_internal_federation_fedpolicy.Config'
      summary: Get the platform federation whitelist
      tags:
      - federation
    put:
      consumes:
      - application/json
      parameters:
      - description: Whitelist + optional admission force/reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler_federation.PutFederationPolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
        "507":
          description: Insufficient Storage
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Replace the platform federation whitelist
      tags:
      - federation
  /api/v1/federation/tokens:
    get:
      description: Returns the non-expired federation token records for the tenant
        named by the tenant_id query parameter. Requires admin permission on that
        tenant. The signed JWTs themselves are not returned.
      parameters:
      - description: Tenant ID
        in: query
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler_federation.FederationTokenRecord'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List a tenant's federation tokens
      tags:
      - federation
    post:
      consumes:
      - application/json
      description: Mints a short-lived RS256 JWT for the named tenant. capability=metrics
        (default, ADR-020) → metrics audience, no account_id. capability=logs (ADR-021)
        → logs audience with the tenant's monotonic account_id embedded (allocated
        on first use). Requires admin permission on the tenant. The signed token is
        returned once and is not retrievable afterwards.
      parameters:
      - description: Token request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler_federation.CreateFederationTokenRequest'
      produces:
