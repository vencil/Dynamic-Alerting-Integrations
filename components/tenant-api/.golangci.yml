version: "2"
# ⛔ Files behind a build tag are OUTSIDE the default build, so `golangci-lint
# run ./...` never loads them — silently, with rc=0. `test/forgee2e/` sat there
# until #1751. Enrolling the tag HERE rather than as a CI flag keeps a local
# `run ./...` equivalent to the gate.
#
# ⚠️ Loaded is not the same as reported: every file under `test/forgee2e/` is a
# `_test.go`, so the blanket errcheck and forbidigo exclusions at the bottom of
# this file apply to all of them. What the tag buys is the linters this file
# does NOT exclude from tests.
#
# ⛔ The tags present in the tree are derived by
# tests/ops/test_go_lint_module_coverage.py; which of them need an entry here
# is a hand-written disposition in that file, and only `enrol` is verified.
run:
  build-tags:
    - forge_e2e
linters:
  default: standard
  # godoclint: a doc comment must start with the name of the declaration it is
  # attached to, and a package may carry only one package doc. It catches the
  # comment that ends up describing the WRONG declaration — a shape gofmt, vet
  # and the tests are all blind to.
  #
  # ⚠️ The start-with-name rule fires only when the declaration HOLDING the
  # comment is exported, so that half is a first layer, not full coverage. The
  # package-doc rules fire regardless of export,
  # and several of the sites fixed here went through that path.
  #
  # ⛔ When it flags a `const (...)` / `var (...)` group heading, split the group
  # into its own block so the heading becomes a block-level doc. Do NOT insert a
  # blank line: that silences the linter by deleting the text from godoc.
  #
  # ⛔ On "package has more than one godoc", do NOT add a `_test.go` exclusion
  # (this file already has three to copy from). Measured: it hides the file that
  # actually carries the second package doc and leaves the innocent one red. Put
  # a blank line above the offending file's `package` clause instead.
  #
  # Coverage numbers and the gate's positive controls live in the CHANGELOG
  # entry and in PR #1743.
  enable:
    - depguard
    - forbidigo
    - godoclint
  settings:
    forbidigo:
      # #932 follow-up: keep outbound HTTP clients off the process-wide
      # http.DefaultClient/DefaultTransport pool. Sharing it let
      # httptest.Server.Close() flush a connection out from under a parallel
      # in-flight request (a flaky "CloseIdleConnections called"). Route every
      # client through platform.NewHTTPClient, which clones an isolated
      # transport. transport.go is the one sanctioned site that names
      # http.DefaultTransport (to clone it) and is excluded below.
      #
      # Scope note: forbidigo matches identifiers/selectors, so it cannot express
      # "a raw &http.Client{} literal with a nil Transport" — #932's exact shape.
      # That specific regression is held by platform's NewHTTPClient isolation
      # test + review; these rules forbid the shared-pool entrypoints that would
      # reintroduce the class.
      forbid:
        - pattern: 'http\.DefaultClient'
          msg: 'http.DefaultClient shares a process-wide connection pool; use platform.NewHTTPClient (#932).'
        - pattern: 'http\.DefaultTransport'
          msg: 'http.DefaultTransport is the shared pool #932 flushed; get an isolated transport via platform.NewHTTPClient.'
        - pattern: 'http\.(Get|Post|Head|PostForm)\b'
          msg: 'package-level http.Get/Post/Head/PostForm use the shared DefaultClient; build a platform.NewHTTPClient instance (#932).'
        # #1279 trigger (1), made mechanical. TestMetricsHandler_Golden reads
        # two process-globals that have NO reset seam: ws.activeHub (written by
        # every NewHub/NewHubWithConfig, and never un-set — once stored,
        # ClientCountSnapshot's ok stays true for the rest of the binary) and
        # orphan's gauges (written only by Detector.scanOnce, reachable solely
        # through a Detector built by NewDetector, then Run). Today no other
        # internal/handler test touches either, so the seams are deliberately
        # NOT built. The first test that does would turn the golden's
        # preconditions flaky under -count=N — that is the moment to build
        # them, and this rule makes that moment a red lint instead of a nightly
        # surprise. Scoped to internal/handler tests by the exclusions below.
        #
        # ⛔ Do NOT silence a hit with //nolint or by widening the exclusion:
        # build the idempotent reset seams #1279 describes (NOT save/restore —
        # last-cleanup-wins under t.Parallel()), then delete these two rules.
        #
        # ⚠️ Matches source text (analyze-types is off), so an import alias
        # (`w "…/internal/ws"`) evades it. scanOnce is unexported in package
        # orphan, so NewDetector is the only way a handler test can rescan.
        - pattern: 'ws\.NewHub'
          msg: 'constructing a real ws hub writes ws.activeHub, a process-global with no reset seam that TestMetricsHandler_Golden reads; build the reset seam first (#1279).'
        - pattern: 'orphan\.NewDetector'
          msg: 'a real orphan Detector rescan writes the orphan gauges, process-globals with no reset seam that TestMetricsHandler_Golden reads; build the reset seam first (#1279).'
    errcheck:
      # CLI/stdout writes are intentional fire-and-forget; checking their error is
      # noise (they only fail on a broken stdout, where there is nothing to do).
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    depguard:
      # Dependency-direction ratchet (codifies the import-graph audit): the domain
      # layer must not depend on the HTTP handler layer. Keeps the core verifiable,
      # testable, and regenerable independently of the volatile HTTP boundary.
      # Currently satisfied — this pins it so an AI rewrite cannot silently invert it.
      rules:
        domain-no-handler:
          list-mode: lax
          files:
            - "**/internal/policy/**"
            - "**/internal/rbac/**"
            - "**/internal/customalerts/**"
            - "**/internal/groups/**"
            - "**/internal/views/**"
          deny:
            - pkg: github.com/vencil/tenant-api/internal/handler
              desc: domain packages must not import the HTTP handler layer
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: internal/platform/transport\.go
        linters:
          - forbidigo
      # tests legitimately name http.DefaultTransport/DefaultClient for assertions
      # (e.g. the NewHTTPClient isolation test asserts tr != http.DefaultTransport)
      # and use raw clients against real forges, not the unit-test httptest pool.
      #
      # ⚠️ Keyed on `text: '#932'` (every #932 msg above carries the tag) so the
      # #1279 rules are NOT swept up by it. Consequence: a future forbidigo rule
      # IS reported in tests unless it is added here too — this rule used to be
      # a blanket, and is now scoped to the #932 family by name.
      - path: _test\.go
        text: '#932'
        linters:
          - forbidigo
      # #1279 rules report ONLY in internal/handler's own tests: that package's
      # test binary is the one TestMetricsHandler_Golden shares process-globals
      # with. Production (cmd/server/main.go builds the real hub and detector)
      # and every other package — including the internal/handler/federation
      # subpackage, a separate test binary — are exempt. `[^/]*` keeps the
      # subpackage out.
      - path-except: internal/handler/[^/]*_test\.go
        text: '#1279'
        linters:
          - forbidigo

# ⛔ v2 moved gofmt OUT of `linters` into this section; with only `linters:` a
# mis-formatted tree still exits 0. tests/ops/test_go_lint_module_coverage.py
# asserts this section stays able to report.
formatters:
  enable:
    - gofmt

# Both default to truncating; 0 = report everything.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
