version: "2"
# ⛔ Files behind a build tag are OUTSIDE the default build, so `golangci-lint
# run ./...` never loads them — silently, with rc=0. `test/forgee2e/` sat there
# until #1751. Enrolling the tag HERE rather than as a CI flag keeps a local
# `run ./...` equivalent to the gate.
#
# ⚠️ Loaded is not the same as reported: every file under `test/forgee2e/` is a
# `_test.go`, so the blanket errcheck and forbidigo exclusions at the bottom of
# this file apply to all of them. What the tag buys is the linters this file
# does NOT exclude from tests.
#
# ⛔ The tags present in the tree are derived by
# tests/ops/test_go_lint_module_coverage.py; which of them need an entry here
# is a hand-written disposition in that file, and only `enrol` is verified.
run:
  build-tags:
    - forge_e2e
linters:
  default: standard
  # godoclint: a doc comment must start with the name of the declaration it is
  # attached to, and a package may carry only one package doc. It catches the
  # comment that ends up describing the WRONG declaration — a shape gofmt, vet
  # and the tests are all blind to.
  #
  # ⚠️ The start-with-name rule fires only when the declaration HOLDING the
  # comment is exported, so that half is a first layer, not full coverage. The
  # package-doc rules fire regardless of export,
  # and several of the sites fixed here went through that path.
  #
  # ⛔ When it flags a `const (...)` / `var (...)` group heading, split the group
  # into its own block so the heading becomes a block-level doc. Do NOT insert a
  # blank line: that silences the linter by deleting the text from godoc.
  #
  # ⛔ On "package has more than one godoc", do NOT add a `_test.go` exclusion
  # (this file already has three to copy from). Measured: it hides the file that
  # actually carries the second package doc and leaves the innocent one red. Put
  # a blank line above the offending file's `package` clause instead.
  #
  # Coverage numbers and the gate's positive controls live in the CHANGELOG
  # entry and in PR #1743.
  enable:
    - depguard
    - forbidigo
    - godoclint
  settings:
    forbidigo:
      # Type-aware matching (#2778 round 2): each expression is matched in its
      # package-qualified form, so `stdio "io"` still reads as io.ReadAll and a
      # *http.Request field or method reads as http.Request.<name> whatever the
      # variable is called. See the #2778 rules for what this still misses.
      analyze-types: true
      # #932 follow-up: keep outbound HTTP clients off the process-wide
      # http.DefaultClient/DefaultTransport pool. Sharing it let
      # httptest.Server.Close() flush a connection out from under a parallel
      # in-flight request (a flaky "CloseIdleConnections called"). Route every
      # client through platform.NewHTTPClient, which clones an isolated
      # transport. transport.go is the one sanctioned site that names
      # http.DefaultTransport (to clone it) and is excluded below.
      #
      # Scope note: forbidigo matches identifiers/selectors, so it cannot express
      # "a raw &http.Client{} literal with a nil Transport" — #932's exact shape.
      # That specific regression is held by platform's NewHTTPClient isolation
      # test + review; these rules forbid the shared-pool entrypoints that would
      # reintroduce the class.
      forbid:
        - pattern: 'http\.DefaultClient'
          msg: 'http.DefaultClient shares a process-wide connection pool; use platform.NewHTTPClient (#932).'
        - pattern: 'http\.DefaultTransport'
          msg: 'http.DefaultTransport is the shared pool #932 flushed; get an isolated transport via platform.NewHTTPClient.'
        - pattern: 'http\.(Get|Post|Head|PostForm)\b'
          msg: 'package-level http.Get/Post/Head/PostForm use the shared DefaultClient; build a platform.NewHTTPClient instance (#932).'
        # #1279 trigger (1), made mechanical. TestMetricsHandler_Golden reads
        # two process-globals that have NO reset seam: ws.activeHub (written by
        # every NewHub/NewHubWithConfig, and never un-set — once stored,
        # ClientCountSnapshot's ok stays true for the rest of the binary) and
        # orphan's gauges (written only by Detector.scanOnce, reachable solely
        # through a Detector built by NewDetector, then Run). Today no other
        # internal/handler test touches either, so the seams are deliberately
        # NOT built. The first test that does would turn the golden's
        # preconditions flaky under -count=N — that is the moment to build
        # them, and this rule makes that moment a red lint instead of a nightly
        # surprise. Scoped to internal/handler tests by the exclusions below.
        #
        # ⛔ Do NOT silence a hit with //nolint or by widening the exclusion:
        # build the idempotent reset seams #1279 describes (NOT save/restore —
        # last-cleanup-wins under t.Parallel()), then delete these two rules.
        #
        # analyze-types (above) matches the package-qualified name, so an
        # import alias (`w "…/internal/ws"`) no longer evades it. scanOnce is
        # unexported in package orphan, so NewDetector is the only way a
        # handler test can rescan.
        - pattern: 'ws\.NewHub'
          msg: 'constructing a real ws hub writes ws.activeHub, a process-global with no reset seam that TestMetricsHandler_Golden reads; build the reset seam first (#1279).'
        - pattern: 'orphan\.NewDetector'
          msg: 'a real orphan Detector rescan writes the orphan gauges, process-globals with no reset seam that TestMetricsHandler_Golden reads; build the reset seam first (#1279).'
        # #2778 follow-up: a handler reads its request body through the
        # request_body helpers — ReadLimitedBody / readLimitedBody (cap
        # d.MaxBody()), readBodyWithin (the batch endpoints' cap), or
        # readBodyCapped with an endpoint's own cap (recipe preview:
        # recipepreview.MaxRequestBytes) — never by itself. A bare
        # io.LimitReader stops at the cap WITHOUT an error, so an over-cap body
        # was parsed from its truncated prefix: a 400 "invalid JSON" naming
        # neither size nor cap, or, for YAML, a silent partial write behind a
        # 200. An uncapped read (json.NewDecoder(r.Body), #1722) holds whatever
        # the client sends.
        #
        # Two halves, because forbidigo sees a selector, not its argument:
        #   - the request itself: any field or method of *http.Request that
        #     reads the body (Body, GetBody, the Form family, the multipart
        #     readers). analyze-types makes this the TYPE's name
        #     (http.Request.Body), so it holds whatever the variable is called
        #     and never touches resp.Body (http.Response.Body);
        #   - io.LimitReader / io.ReadAll / ioutil.ReadAll, which no handler
        #     needs outside the helper either.
        #
        # Scope (exclusions below, keyed on text '#2778'): non-test files of
        # internal/handler and its subpackages; read_body_capped.go, which
        # holds only readBodyCapped, is the one exempt file.
        #
        # ⚠️ Still not caught: the body reached WITHOUT naming it — r handed to
        # a function outside internal/handler that reads r.Body there, or to an
        # interface (io.Reader) obtained some other way. Review holds those.
        - pattern: '^http\.Request\.(Body|GetBody|Form|PostForm|MultipartForm|ParseForm|ParseMultipartForm|FormValue|PostFormValue|FormFile|MultipartReader)$'
          msg: 'read the request body through the request_body helpers (handler.ReadLimitedBody, readBodyWithin, readBodyCapped) — they answer an over-cap body with 413 instead of truncating or not capping it (#2778).'
        - pattern: '^io\.(LimitReader|ReadAll)$'
          msg: 'read a request body through handler.ReadLimitedBody (413 on over-cap) instead of a bare io.LimitReader/io.ReadAll, which truncates silently or not at all (#2778).'
        - pattern: '^ioutil\.ReadAll$'
          msg: 'read a request body through handler.ReadLimitedBody (413 on over-cap) instead of ioutil.ReadAll, which has no cap (#2778).'
    errcheck:
      # CLI/stdout writes are intentional fire-and-forget; checking their error is
      # noise (they only fail on a broken stdout, where there is nothing to do).
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    depguard:
      # Dependency-direction ratchet (codifies the import-graph audit): the domain
      # layer must not depend on the HTTP handler layer. Keeps the core verifiable,
      # testable, and regenerable independently of the volatile HTTP boundary.
      # Currently satisfied — this pins it so an AI rewrite cannot silently invert it.
      #
      # ⛔ internal/rbac/import_direction_test.go reads domain-no-handler's
      # `files:` from THIS file (the one list; #3226) and runs the same check
      # without golangci-lint, so dropping depguard from `linters.enable` does
      # not retire the rule. Each entry must stay of the form
      # "**/internal/<dir>/**" — the test fails on any other shape rather than
      # guess what it covers.
      rules:
        domain-no-handler:
          list-mode: lax
          # The list's criterion (#3226): EVERY package under internal/ is
          # listed, except two that cannot be:
          #   - internal/handler and its subpackages — the layer this denies;
          #   - internal/federation/orphan — its external test package
          #     (enumerator_parity_test.go, #1680) imports handler on purpose
          #     to compare GET /tenants with the orphan scans. Its non-test
          #     code cannot import handler anyway: handler imports orphan, so
          #     that is an import cycle the compiler rejects.
          # Most of the listed packages are also imported by handler, so a
          # non-test file of theirs importing it is already a cycle; the rule
          # adds their external `_test` packages and the ones handler does not
          # import (github, gitlab, statemigrate, staterestore, testutil). A
          # new internal package goes here unless it has a reason like
          # orphan's — import_direction_test fails on a package directory
          # that is neither listed nor one of those two exemptions.
          files:
            - "**/internal/async/**"
            - "**/internal/boundedcall/**"
            - "**/internal/confd/**"
            - "**/internal/configwatcher/**"
            - "**/internal/credmask/**"
            - "**/internal/customalerts/**"
            - "**/internal/errcode/**"
            - "**/internal/errkind/**"
            - "**/internal/federation/account/**"
            - "**/internal/federation/fedpolicy/**"
            - "**/internal/federation/logprojection/**"
            - "**/internal/federation/logvis/**"
            - "**/internal/federation/token/**"
            - "**/internal/generator/**"
            - "**/internal/github/**"
            - "**/internal/gitlab/**"
            - "**/internal/gitops/**"
            - "**/internal/groups/**"
            - "**/internal/platform/**"
            - "**/internal/proxyconfig/**"
            - "**/internal/rbac/**"
            - "**/internal/recipepreview/**"
            - "**/internal/statemigrate/**"
            - "**/internal/staterestore/**"
            - "**/internal/statestore/**"
            - "**/internal/tenantorg/**"
            - "**/internal/testutil/**"
            - "**/internal/views/**"
            - "**/internal/ws/**"
          deny:
            - pkg: github.com/vencil/tenant-api/internal/handler
              desc: domain packages must not import the HTTP handler layer
        # #3226: errkind names the kinds of failure for both sides of the
        # boundary — the domain errors say which they are, the handler's table
        # answers them. It stays a leaf: nothing of this module (a cycle with
        # every domain package waiting to happen) and not net/http (a status
        # code belongs in the handler's table, not in the names).
        errkind-leaf:
          list-mode: lax
          files:
            - "**/internal/errkind/**"
          deny:
            - pkg: github.com/vencil/tenant-api/internal
              desc: errkind is a leaf — it imports nothing of tenant-api (#3226)
            - pkg: net/http
              desc: errkind holds names only; statuses and codes are the handler's kindTable (#3226)
        # #3202: errcode is the one list of the error codes — the handler, the
        # RBAC middleware, the generator client and the async task store all
        # name a code from it instead of a copy of its string. That holds only
        # while every one of them may import it: a leaf, nothing of this module
        # (a code knows no kind, no status, no handler) and not net/http (which
        # status a code is answered with is the handler's kindTable).
        errcode-leaf:
          list-mode: lax
          files:
            - "**/internal/errcode/**"
          deny:
            - pkg: github.com/vencil/tenant-api/internal
              desc: errcode is a leaf — it imports nothing of tenant-api (#3202)
            - pkg: net/http
              desc: errcode holds codes and remedies only; statuses are the handler's kindTable (#3202)
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: internal/platform/transport\.go
        linters:
          - forbidigo
      # tests legitimately name http.DefaultTransport/DefaultClient for assertions
      # (e.g. the NewHTTPClient isolation test asserts tr != http.DefaultTransport)
      # and use raw clients against real forges, not the unit-test httptest pool.
      #
      # ⚠️ Keyed on `text: '#932'` (every #932 msg above carries the tag) so the
      # #1279 rules are NOT swept up by it. Consequence: a future forbidigo rule
      # IS reported in tests unless it is added here too — this rule used to be
      # a blanket, and is now scoped to the #932 family by name.
      - path: _test\.go
        text: '#932'
        linters:
          - forbidigo
      # #1279 rules report ONLY in internal/handler's own tests: that package's
      # test binary is the one TestMetricsHandler_Golden shares process-globals
      # with. Production (cmd/server/main.go builds the real hub and detector)
      # and every other package — including the internal/handler/federation
      # subpackage, a separate test binary — are exempt. `[^/]*` keeps the
      # subpackage out.
      - path-except: internal/handler/[^/]*_test\.go
        text: '#1279'
        linters:
          - forbidigo
      # #2778 rules report only in internal/handler (and its subpackages),
      # only in non-test files, and never in read_body_capped.go — the one
      # function that reads r.Body through io.LimitReader. The rest of
      # request_body.go stays under the rules.
      - path-except: internal/handler/
        text: '#2778'
        linters:
          - forbidigo
      - path: _test\.go
        text: '#2778'
        linters:
          - forbidigo
      - path: internal/handler/read_body_capped\.go
        text: '#2778'
        linters:
          - forbidigo

# ⛔ v2 moved gofmt OUT of `linters` into this section; with only `linters:` a
# mis-formatted tree still exits 0. tests/ops/test_go_lint_module_coverage.py
# asserts this section stays able to report.
formatters:
  enable:
    - gofmt

# Both default to truncating; 0 = report everything.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
