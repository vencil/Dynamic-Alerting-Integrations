# mongo-prod.yaml — 範例: MongoDB 租戶閾值設定
# 來源參考: percona/mongodb_exporter
# ⚠️ 本範例刻意不放維度鍵（`metric{label="value"}`）：出貨的 rule pack 以 `max by(tenant)` 取租戶最大值，
#    維度 label 在那一步就丟掉了——維度鍵改到的是整個租戶的門檻（各維度值與 base 合成一個值），
#    對維度鍵寫 "disable" 只是不送出這一列，不會只停掉那個維度的告警。要依維度判斷得改 rule pack（#3475）；語法見 docs/design/config-driven.md。
# 三態（限 _defaults.yaml 的 defaults: 有值的 key）: 數值=Custom, 省略=Default, "disable"=停用
# ⚠️ 列在 optional_overrides: 的宣告 key 沒有值可繼承 ⇒ 省略＝沒有值＝靜默，只有兩態（#1321）
tenants:
  mongo-prod:
    # 路由：引用本目錄 _routing_profiles.yaml 的 profile（#2326：子目錄的 profile
    # 對本子樹的租戶可見；本子樹 _domain_policy.yaml 的 finance 政策據此驗證）
    _routing_profile: domain-finance-tier1

    # --- 基本閾值 (全域) ---
    mongodb_connections_current: "500"
    mongodb_connections_current_critical: "800"
    mongodb_replication_lag: "10"                           # #1196 C 由 mongodb_repl_lag_seconds 改名
    mongodb_replication_lag_critical: "30"
