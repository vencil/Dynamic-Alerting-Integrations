# _domain_policy.yaml — Domain Compliance Constraints (ADR-007)
#
# Define business domain constraints that validate (not inject) the final
# resolved routing configuration. Violations are reported as WARN by default,
# or ERROR with --strict mode (CI runs --validate --strict, so violations of
# a policy placed in the live conf.d/ are blocking).
#
# Domain policies are checked AFTER the four-layer merge:
#   _routing_defaults → routing_profiles[ref] → tenant _routing → domain_policies(validate)
#
# This file sits in the examples/ SUBDIRECTORY, so it applies to the tenants of
# this subtree only (#2326, ADR-007 amendment 2026-09-28): naming a tenant that
# lives outside examples/ is an ERROR under --strict (the entry is not
# enforced), and the conf.d root's own policies still apply here on top
# (policies at different levels are judged additively).

domain_policies:
  # Finance domain: strict compliance — no Slack, must use PagerDuty/email
  finance:
    description: "Finance domain compliance requirements"
    tenants: [redis-prod, mongo-prod]
    constraints:
      allowed_receiver_types: [pagerduty, email, opsgenie]
      forbidden_receiver_types: [slack, webhook]
      enforce_group_by: [tenant, alertname, severity]
      max_repeat_interval: 1h
      min_group_wait: 30s
      # require_critical_escalation: true  # enforced: at least one severity=critical
      #   path to PagerDuty — the main receiver is pagerduty, or a `routes` entry
      #   with match {severity: critical} sends to pagerduty (ADR-007; a
      #   non-PagerDuty destination that still gets critical alerts is WARN
      #   only). Both tenants route through the `domain-finance-tier1`
      #   profile (main receiver pagerduty), so enabling it holds today.

  # E-commerce domain: standard SLA
  ecommerce:
    description: "E-commerce domain standards"
    tenants: [es-prod]
    constraints:
      allowed_receiver_types: [slack, pagerduty, email, webhook]
      max_repeat_interval: 12h

