# es-prod.yaml — 範例: Elasticsearch 租戶閾值設定 (維度標籤)
# 來源參考: prometheus-community/elasticsearch_exporter
#
# ES 典型維度: index (索引), node (節點)
# ⚠️ 維度 key 的 base（去掉 {…} 的部分）必須是平台宣告的 key：在 _defaults.yaml 的 defaults: 有值，
#    或列在 optional_overrides:；否則不產生 metric，validate-config 報 unread（no_row）（ADR-038 §11）
# 三態（限 _defaults.yaml 的 defaults: 有值的 key）: 數值=Custom, 省略=Default, "disable"=停用
# ⚠️ 列在 optional_overrides: 的宣告 key 沒有值可繼承 ⇒ 省略＝沒有值＝靜默，只有兩態（#1321）
tenants:
  es-prod:
    # --- 基本閾值 (全域) ---
    # 叢集健康（yellow/red）不是閾值鍵：rule pack 直接比對 health 狀態，租戶無從調整（#3014）
    es_heap_usage_percent: "85"                             # #1196 C 由 es_jvm_memory_used_percent 改名
    es_disk_usage_percent: "85"                             # 已用率超過 85% 警告（#1196 C 語意反向：原 free% 15）
    es_pending_tasks: "50"

    # --- 維度閾值: 按 index 分設 (查詢負載差異大) ---
    "es_search_latency_ms{index=\"logs-prod\"}": "2000"       # 日誌全文檢索較重，放寬到 2s
    "es_search_latency_ms{index=\"metrics-prod\"}": "500"     # 聚合查詢應快速回應
    "es_search_latency_ms{index=\"audit-trail\"}": "3000"     # 稽核查詢偶發、可容忍較慢

    # --- 維度閾值: 按 node 分設 (特定節點可能硬體不同) ---
    "es_heap_usage_percent{node=\"es-hot-01\"}": "90"
    "es_heap_usage_percent{node=\"es-warm-01\"}": "80"
    "es_disk_usage_percent{node=\"es-warm-01\"}": "90"       # warm 節點以容量換成本，水位放寬
