# db-a.yaml — Tenant-managed thresholds (DEVELOPMENT EXAMPLE)
# ⚠️  此檔為開發參考範本，不會被包含在發布的 Helm chart 或 Docker image 中。
# Only 'tenants' block is allowed here.
tenants:
  db-a:
    mysql_connection_usage_percent: "70"
    container_cpu: "70"
    # #869, #4097: _expected_exporters opts this tenant into per-tenant exporter
    # liveness — a list of the exporter kinds it runs (rule packs that have a
    # presence metric: mariadb, redis, nginx, jvm, …). The exporter emits
    # tenant_expected_exporter{tenant="db-a",pack="mariadb"}=1, the LHS of
    # TenantExporterAbsent (rule-pack-liveness.yaml). Without it the tenant is
    # NOT liveness-monitored (opt-in). It is not a tenant_metadata_info label
    # (that stays {tenant,runbook_url,owner,tier}).
    _expected_exporters: [mariadb]
