# optional_overrides 為生成段（#1310）——「平台認得這個 key，但不主張它的值」。
# 與 defaults 的差別是整個對比的重點：進 defaults ＝ 對每個租戶都武裝一個平台選的
# 數字；列在這裡 ＝ 租戶可以在自己的檔案裡設它並生效（resolveDeclaredRows 只在租戶
# 給了值時發射），平台自己不發射，租戶不設就是靜默。
# ⛔ 只含 optional_overrides tier 的平鍵，不含 `<base>_critical`——後者走
# resolveCriticalRows，base 沒進 defaults 就整列丟棄，列進來只是裝飾（#1311）。
# 改內容走 scaffold_tenant.RULE_PACKS ＋ check_threshold_registry.py --regen。
optional_overrides:
  # >>> GENERATED:threshold-registry:dev-optional — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
  # ── mariadb：MariaDB / MySQL (mysqld_exporter) ──
  - mysql_threads_running
    # threads — threads_running saturation, NOT host CPU% — running-threads 1m-avg warning; 30 =
    # PMM/Nichter 'high' tier, a reference start to calibrate per host (a healthy count scales with
    # CPU cores); renamed from mysql_cpu (2-release alias window, old spelling still resolves)
  # ── oracle：Oracle Database (oracledb_exporter) ──
  - oracle_wait_time_rate   # s/s — Wait time rate (5m)
  - oracle_process_count   # count — Active processes warning
    # ⚠ 參考庫實測反例（#1176）：例行備份批次會到 560 個 process —— 此值會對正常運作誤警；這個數字是起點，不是平台背書的值
  - oracle_pga_allocated_bytes   # bytes (4GB) — PGA allocation warning
    # ⚠ 參考庫實測反例（#1176）：計畫性 stats-gather 會用到 22 GB PGA —— 此值會對正常運作誤警；這個數字是起點，不是平台背書的值
  # ── db2：IBM DB2 (ibm_db2_exporter) ──
  - db2_log_usage_percent   # % — Transaction log usage warning
  - db2_deadlock_rate   # count/s — Deadlock rate (5m)
    # ⚠ 參考庫實測反例（#1176）：真實的 ~90/min deadlock storm 低於 5/s（＝300/min），因此接不到 ——
    # 此值接不到該抓的故障；這個數字是起點，不是平台背書的值
  - db2_tablespace_used_percent   # % — Tablespace usage warning
  # ── clickhouse：ClickHouse (built-in /metrics) ──
  - clickhouse_max_part_count   # count — Max part count per partition
  - clickhouse_replication_queue   # count — Replication queue size
  - clickhouse_memory_tracking_bytes   # bytes (8GB) — Memory tracking warning
  # <<< GENERATED:threshold-registry:dev-optional

# dimensions 為生成段（#3475，ADR-038 §11）：每個 base 的維度鍵可帶哪些 label 才會送出。
# 出貨清單 = threshold registry 宣告、且 rule pack 依該 label 聚合的組合；自訂規則若依某個
# 維度讀，就在這裡加上 base 與 label。改出貨內容走 scaffold_tenant.RULE_PACKS ＋ --regen。
dimensions:
  # >>> GENERATED:threshold-registry:dev-dimensions — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
  container_cpu: [version]
  container_memory: [version]
  # <<< GENERATED:threshold-registry:dev-dimensions

state_filters:
  container_crashloop:
    reasons: ["CrashLoopBackOff"]
    severity: "critical"
  container_imagepull:
    reasons: ["ImagePullBackOff", "InvalidImageName"]
    severity: "warning"
  maintenance:
    reasons: []
    severity: "info"
    default_state: "disable"

# v1.4.0 Routing Defaults: domain expert sets default notification config.
# Tenants inherit these defaults unless they override with _routing in their YAML.
# {{tenant}} placeholder is replaced with the tenant name at merge time.
_routing_defaults:
  receiver:
    type: "email"
    to: ["dba-oncall@example.com"]
    # 'from' is REQUIRED on an email receiver unless a global smtp_from is set.
    # The deployed base (k8s/03-monitoring/configmap-alertmanager.yaml) has no
    # global smtp_* block — SMTP is configured per-receiver here (smarthost) — so
    # an email receiver without 'from' renders a config Alertmanager rejects with
    # "no global SMTP from set" (amtool check-config). Keep this set.
    from: "alerting@example.com"
    smarthost: "smtp.example.com:587"
  group_by: ["alertname", "tenant"]
  group_wait: "30s"
  group_interval: "5m"
  repeat_interval: "4h"

# v1.7.0 Platform Enforced Routing: NOC always receives critical alerts.
# Inserted BEFORE tenant routes with continue: true — tenants cannot override.
# Set enabled: false (or remove) to disable.
# _routing_enforced:
#   enabled: true
#   receiver:
#     type: "webhook"
#     url: "https://noc.example.com/alerts"
#   match:
#     - 'severity="critical"'
#   group_by: ["alertname", "tenant"]
#   group_wait: "15s"
#   repeat_interval: "1h"
#
# ── Selector 怎麼挑：租戶 critical vs 平台自監控 ──────────────────
# 上面的 `severity="critical"` 是「NOC 收所有租戶 critical」的用例。
# 若你要收的是**平台自己**的自監控告警（Prometheus / Alertmanager /
# exporter / tenant-api / 聯邦與投影管線的健康，`configmap-rules-platform.yaml`
# 裡的告警），selector 要改成正向 discriminator：
#
#   match:
#     - 'alert_source="platform"'
#
# 除 `Watchdog`（走 index-0 心跳專線）外全部帶 `alert_source: platform`；
# 該值為平台樹**保留值**，租戶 rule pack 不得使用。
#
# ⛔ 兩者無法用同一條 enforced route 同時表達：`_routing_enforced` 只產生
# **一條** route，且 `match` 陣列內的多個 matcher 是 **AND** 不是 OR。要二選一：
#   * `alert_source="platform"` → 除 `Watchdog` 外的平台自監控全部收到，租戶 critical 走各租戶自己的 `_routing`
#   * `severity="critical"`     → 租戶 critical 全收，但平台自監控只涵蓋
#                                 `severity: critical` 的那些，warning 與 info 收不到
#
# ⚠️ 想寫「所有租戶」時不要用 `tenant=~".*"`：Alertmanager 語意「label 不存在
# == 空值」，`.*` 會把平台告警一起吃進租戶通道。改寫 `tenant!=""` 只解決一半——
# 有 3 條平台告警（TenantMetricsOverLimit／FederationRejectionRateAnomaly／
# FederationGatewayBackendErrors）帶 tenant label（後兩條由 expr `sum by (tenant)`
# 在觸發時產生，規則檔的 `labels:` 看不到），仍會被撈進來。
# 真正的「只要租戶告警」＝ `tenant!=""` ＋ `alert_source=""` 兩個 matcher（AND）。
#
# 完整說明（噪音特性、`tenant=""` 兜底的負向斷言陷阱）見
# docs/integration/byo-alertmanager-integration.md §11。
