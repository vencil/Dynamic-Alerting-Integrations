# _defaults.yaml — Platform-managed global settings (DEVELOPMENT EXAMPLE)
# ⚠️  此檔為開發參考範本，不會被包含在發布的 Helm chart 或 Docker image 中。
#     生產環境請透過 Helm values 或 GitOps 注入。
# Loaded first (underscore prefix sorts before letters).
# Only this file should contain 'defaults', 'state_filters', and '_routing_defaults'.
#
# defaults 為生成段（#1200 WS1a PR-2）：內容＝threshold-registry 的
# chart_default 集，與 helm/threshold-exporter/values.yaml 出貨預設同源
# （本範本先前多帶 pg_connections/pg_replication_lag＝helm↔dev 漂移，
# 改生成後歸一；pg_* 是否升 chart_default 屬 D4 家族 owner 拍板）。
# 改值走 scaffold_tenant.RULE_PACKS ＋ check_threshold_registry.py --regen。
defaults:
  # >>> GENERATED:threshold-registry:dev-defaults — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
  # ── kubernetes：Kubernetes (cAdvisor + KSM) ──
  # % — Container CPU % of limit (weakest link)
  container_cpu: 80
  # % — Chronic CFS throttle: % of ACTIVE 100ms periods throttled, NOT % CPU lost (critical tier
  # opt-in via container_cpu_throttle_critical, suggest 50; #944)
  container_cpu_throttle: 25
  # % — Container memory % of limit (weakest link)
  container_memory: 85
  # ── mariadb：MariaDB / MySQL (mysqld_exporter) ──
  # count — Max threads_connected warning（critical 加嚴 opt-in：mysql_connections_critical，registry 建議
  # 120）
  mysql_connections: 80
  # threads — Running-threads 1m-avg saturation warning; 80→30 = PMM/Nichter 'high' (#944). NOT host
  # CPU% — key kept as mysql_cpu (config-contract stability; metric/alert renamed, #944
  # closed)（critical 加嚴 opt-in：mysql_cpu_critical，registry 建議 50）
  mysql_cpu: 30
  # seconds — Async replication lag warning (seconds behind primary, sql_delay-adjusted); 30 =
  # APA/mysqld-mixin consensus trigger (they page critical at 30s; demoted to warning — PMM's lag-
  # template family default is 600s warning). Enabled by default (#1200 WS5-P0-a Q3=C)（critical 加嚴
  # opt-in：mysql_replication_lag_critical，registry 建議 120）
  mysql_replication_lag: 30
  # <<< GENERATED:threshold-registry:dev-defaults

state_filters:
  container_crashloop:
    reasons: ["CrashLoopBackOff"]
    severity: "critical"
  container_imagepull:
    reasons: ["ImagePullBackOff", "InvalidImageName"]
    severity: "warning"
  maintenance:
    reasons: []
    severity: "info"
    default_state: "disable"

# v1.4.0 Routing Defaults: domain expert sets default notification config.
# Tenants inherit these defaults unless they override with _routing in their YAML.
# {{tenant}} placeholder is replaced with the tenant name at merge time.
_routing_defaults:
  receiver:
    type: "email"
    to: ["dba-oncall@example.com"]
    # 'from' is REQUIRED on an email receiver unless a global smtp_from is set.
    # The deployed base (k8s/03-monitoring/configmap-alertmanager.yaml) has no
    # global smtp_* block — SMTP is configured per-receiver here (smarthost) — so
    # an email receiver without 'from' renders a config Alertmanager rejects with
    # "no global SMTP from set" (amtool check-config). Keep this set.
    from: "alerting@example.com"
    smarthost: "smtp.example.com:587"
  group_by: ["alertname", "tenant"]
  group_wait: "30s"
  group_interval: "5m"
  repeat_interval: "4h"

