# critical row。清單刻意不收 _critical 也是同一個理由：它們用不到宣告集（#1311）。
# ⚠️ 下列數字是「參考起點」不是背書——正式採用前必須以該租戶實際 baseline 校準。
#   mysql_connections_critical: 120   # count — Critical tier (Scenario D)
#   mysql_threads_running_critical: 50
