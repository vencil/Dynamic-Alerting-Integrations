# ============================================================
# Rule Pack: MariaDB / MySQL (via mysqld_exporter / Percona)
# 預設啟用 — 涵蓋連線數、執行緒飽和、複合瓶頸、重啟偵測
#
# 需要的 exporter:
#   - mysqld_exporter (https://github.com/prometheus/mysqld_exporter)
#   - 或 Percona PMM exporter
#
# >>> GENERATED:threshold-registry:pack-mariadb — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
