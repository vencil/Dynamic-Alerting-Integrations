#       #944 keep — 2-release alias window, old spelling still resolves)
#   mysql_replication_lag: 30   [chart-default]
#       seconds — Async replication lag warning (seconds behind primary, sql_delay-adjusted); 30 =
#       APA/mysqld-mixin consensus trigger (they page critical at 30s; demoted to warning — PMM's
#       lag-template family default is 600s warning). Enabled by default (#1200 WS5-P0-a Q3=C)
#
# optional_overrides（不在出貨清單裡，但 base 已出貨——租戶今天就設得動）：
