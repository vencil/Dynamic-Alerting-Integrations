#
# es_search_latency_ms 起始值 1000 的推導（#1196 D）：
# Awesome Prometheus Alerts 的 ElasticsearchHighQueryLatency 用同一條公式
# （rate(query_time)/rate(query_total)，平均每次 query 秒數）以 1s / for 5m /
# warning 告警，是唯一與本 rule 語意完全同構的社群錨；官方 exporter 範例、
# Elastic Stack Monitoring 內建 rules、New Relic / Grafana Cloud 整合、
# AWS OpenSearch 推薦 alarms 均無 search latency 預設條目（Elastic 在
# kibana#74821 明示固定閾值難有通用預設）。文獻健康帶：Last9 給平均延遲
# <100ms 健康、>500ms critical；Datadog 生態 Claranet 模組給 10ms/20ms
# （低延遲集群取向＝outlier，防後人誤引）。1000ms＝社群同構錨原值，對混合
# 負載保守抗噪；本 rule 是平均值，平均破 1s 時 P99 通常已達數秒。
# ⚠️ 起始點非通用值：搜尋延遲隨 query 複雜度、shard 拓撲與快取命中率差
# 一到兩個數量級，正式採用前應以租戶 baseline 校準（低延遲搜尋型租戶可
# 下探 200–500）。
#
# Tenant config 範例 (conf.d/es-prod.yaml):
#   tenants:
#     es-prod:
#       es_heap_usage_percent: "80"
#       es_disk_usage_percent: "75"
#       # 維度標籤 — 不同 index 設定不同大小閾值
#       "es_index_store_size_bytes{index=\"logs-prod\"}": "107374182400"
#       "es_index_store_size_bytes{index=\"metrics\"}": "53687091200"
