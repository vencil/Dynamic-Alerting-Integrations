          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 10m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Elasticsearch has unassigned shards on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Elasticsearch 有未分配的分片"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ES unassigned shards — check node capacity"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Elasticsearch 未分配分片 — 請檢查節點容量"
          description: "{{ $value }} unassigned shards — check node capacity"
          description_zh: "{{ $value }} 個未分配的分片 — 請檢查節點容量"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: ElasticsearchPendingTasks
        expr: |
          (
            tenant:es_pending_tasks:max
            > on(tenant) group_left
            tenant:alert_threshold:es_pending_tasks
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "es_pending_tasks"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Elasticsearch pending cluster tasks on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Elasticsearch 有待處理的叢集工作"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ES pending cluster tasks — cluster overload review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Elasticsearch 待處理叢集工作 — 請檢查叢集負載"
          description: "{{ $value }} pending tasks — cluster may be overloaded"
          description_zh: "{{ $value }} 個待處理工作 — 叢集可能負載過高"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier (opt-in via es_pending_tasks_critical)
      - alert: ElasticsearchPendingTasksCritical
        expr: |
          (
            tenant:es_pending_tasks:max
            > on(tenant) group_left
            tenant:alert_threshold:es_pending_tasks_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "es_pending_tasks"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Elasticsearch pending cluster tasks critical on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Elasticsearch 待處理叢集工作嚴重堆積"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ES master task backlog at critical level — mapping, settings and shard changes stall; stop bulk index or mapping churn and check master load now"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Elasticsearch master 工作嚴重堆積 — mapping、設定與分片變更將停滯；請立即停止大量建立索引或 mapping 變動並檢查 master 負載"
          description: "{{ $value }} pending tasks (critical threshold exceeded)"
          description_zh: "{{ $value }} 個待處理工作（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
