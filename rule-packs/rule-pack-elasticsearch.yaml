# ============================================================
groups:
  # -------------------------------------------------------
  # Normalization: Elasticsearch metrics
  # -------------------------------------------------------
  - name: elasticsearch-normalization
    interval: 15s
    rules:
      # Cluster health (0=green, 1=yellow, 2=red)
      - record: tenant:es_cluster_health:status
        expr: |
          max by(tenant) (elasticsearch_cluster_health_status{color="red"}) * 2
          + max by(tenant) (elasticsearch_cluster_health_status{color="yellow"})

      # JVM heap usage percent
      - record: tenant:es_heap_usage_percent:max
        expr: |
          max by(tenant) (
            elasticsearch_jvm_memory_used_bytes{area="heap"}
            / elasticsearch_jvm_memory_max_bytes{area="heap"}
          ) * 100

      # Disk usage percent
      - record: tenant:es_disk_usage_percent:max
        expr: |
          max by(tenant) (
            1 - (
              elasticsearch_filesystem_data_available_bytes
              / elasticsearch_filesystem_data_size_bytes
            )
          ) * 100

      # Search latency (ms)
      - record: tenant:es_search_latency_ms:avg
        expr: |
          sum by(tenant) (rate(elasticsearch_indices_search_query_time_seconds[5m]))
          / sum by(tenant) (rate(elasticsearch_indices_search_query_total[5m]))
          * 1000

      # Pending cluster tasks
      - record: tenant:es_pending_tasks:max
        expr: max by(tenant) (elasticsearch_cluster_health_number_of_pending_tasks)

      # Unassigned shards
      - record: tenant:es_unassigned_shards:count
        expr: max by(tenant) (elasticsearch_cluster_health_unassigned_shards)

  # -------------------------------------------------------
  # Threshold normalization: Elasticsearch
  # -------------------------------------------------------
  - name: elasticsearch-threshold-normalization
    interval: 15s
    rules:
      - record: tenant:alert_threshold:es_heap_usage_percent
        expr: max by(tenant) (user_threshold{component="es", metric="heap_usage_percent", severity="warning"})

      - record: tenant:alert_threshold:es_heap_usage_percent_critical
        expr: max by(tenant) (user_threshold{component="es", metric="heap_usage_percent", severity="critical"})

      - record: tenant:alert_threshold:es_disk_usage_percent
        expr: max by(tenant) (user_threshold{component="es", metric="disk_usage_percent", severity="warning"})

      - record: tenant:alert_threshold:es_disk_usage_percent_critical
        expr: max by(tenant) (user_threshold{component="es", metric="disk_usage_percent", severity="critical"})

      - record: tenant:alert_threshold:es_search_latency_ms
        expr: max by(tenant) (user_threshold{component="es", metric="search_latency_ms", severity="warning"})

      - record: tenant:alert_threshold:es_search_latency_ms_critical
        expr: max by(tenant) (user_threshold{component="es", metric="search_latency_ms", severity="critical"})

      - record: tenant:alert_threshold:es_pending_tasks
        expr: max by(tenant) (user_threshold{component="es", metric="pending_tasks", severity="warning"})

      - record: tenant:alert_threshold:es_pending_tasks_critical
        expr: max by(tenant) (user_threshold{component="es", metric="pending_tasks", severity="critical"})

  # -------------------------------------------------------
  # Alert Rules: Elasticsearch
  # -------------------------------------------------------
  - name: elasticsearch-alerts
    rules:
      - alert: ElasticsearchClusterRed
        expr: |
          tenant:es_cluster_health:status == 2
        for: 30s
        labels:
          severity: critical
          maintenance: page
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Elasticsearch cluster RED on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Elasticsearch 叢集狀態為 RED"
          description: "Cluster health is RED — data loss or unavailability possible"
          description_zh: "叢集健康狀態為 RED — 可能造成資料遺失或無法使用"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      - alert: ElasticsearchClusterYellow
        expr: |
          tenant:es_cluster_health:status == 1
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Elasticsearch cluster YELLOW on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Elasticsearch 叢集狀態為 YELLOW"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ES cluster YELLOW — replica shards unassigned"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Elasticsearch 叢集 YELLOW — 副本分片未分配"
          description: "Some replica shards are unassigned"
          description_zh: "部分副本分片未分配"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: ElasticsearchHighHeapUsage
        expr: |
          (
            tenant:es_heap_usage_percent:max
            > on(tenant) group_left
            tenant:alert_threshold:es_heap_usage_percent
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "es_heap_usage_percent"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Elasticsearch high heap usage on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Elasticsearch JVM heap 使用率過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ES heap usage high — JVM sizing review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Elasticsearch heap 使用率過高 — 請檢查 JVM 大小"
          description: "JVM heap: {{ $value | printf \"%.1f\" }}%"
          description_zh: "JVM heap: {{ $value | printf \"%.1f\" }}%"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier (opt-in via es_heap_usage_percent_critical)
      - alert: ElasticsearchHighHeapUsageCritical
        expr: |
          (
            tenant:es_heap_usage_percent:max
            > on(tenant) group_left
            tenant:alert_threshold:es_heap_usage_percent_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "es_heap_usage_percent"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Elasticsearch heap usage critical on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Elasticsearch JVM heap 使用率嚴重過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ES heap at critical level — circuit breakers trip and long GC pauses follow; shed heavy queries and aggregations now"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Elasticsearch heap 達嚴重水位 — circuit breaker 將觸發並出現長時間 GC 停頓；請立即卸除重查詢與聚合"
          description: "JVM heap: {{ $value | printf \"%.1f\" }}% (critical threshold exceeded)"
          description_zh: "JVM heap: {{ $value | printf \"%.1f\" }}%（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
