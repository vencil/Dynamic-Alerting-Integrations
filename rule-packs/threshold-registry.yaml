# threshold-registry.yaml — threshold 契約 SoT（TRK-339 WS1a / #1200 D2）
#
# 地位：epic #1200 D2（2026-07-23 LOCKED）拍板 threshold 契約收斂到本檔——
# 語言中立（helm/docs/portal 直讀）、schema 可驗證
# （docs/schemas/threshold-registry.schema.json）。
#
# ✅ PR-2（rewire）後本檔已是真 SoT：原手抄面改為由本檔生成（定界符內），
# 定界符外手寫 prose 照舊——
#   1. rule-pack header 閾值段（defaults tier + optional_overrides 警語段，
#      依「在出貨清單裡 / 不在但 base 已出貨 / 兩者皆無」分三小段各配一份警語）
#   2. helm/threshold-exporter/values.yaml thresholdConfig.defaults
#      （arming: default 的 key）
#   3. components/threshold-exporter/config/conf.d/_defaults.yaml defaults 段
#   4. 上述兩個 runtime 面的 optional_overrides: 宣告 key 清單（#1310；
#      是 list 不是 map——平台認得該 key 但不主張其值）
# 新鮮度由 check_threshold_registry.py --ci 面強制（stale＝硬錯）。
#
# ✅ D-A PR-3 起本檔是手寫的唯一來源：閾值、arming、metric_class 與
# deprecated_aliases 都直接寫在這裡。scaffold_tenant.RULE_PACKS 的閾值部分改由
# 本檔生成（scripts/tools/ops/_rule_packs_generated.py），scaffold 只保留
# state_filters 與 dimensional_example。改閾值請改本檔，再跑：
#   python3 scripts/tools/lint/check_threshold_registry.py --regen
# （重產所有生成面與 RULE_PACKS 生成模組；本檔不會被改寫）。
# critical_of 是推導欄位：key 以 _critical 結尾且同 pack 有 base key 時才寫，
# 寫錯或漏寫會被 --ci 的自身一致性檢查擋下。
#
# 範圍：threshold 身分（defaults / optional_overrides 兩層＋arming）。
# state_filters 與 dimensional_example 仍歸 scaffold（非閾值身分）。
# 本 registry 首要服務的 enforcement 路徑是 18-key 修復線（#1196 / TRK-337）。
#
# arming／portability／blocker（D-A A1，#3773 拆成正交欄位）：每個非 _critical 的
# key 都要寫前兩個，_critical 都不寫（跟隨 base）。
#   arming       default（chart 出貨即啟用，限 defaults 層）| operator（要部署方自己給值）
#   portability  portable（一個值可跨部署沿用）| ratio_pending（絕對值，正解是改比值，
#                #1320）| site_specific（沒有普世的值）。非 portable 必附
#                portability_reason 與 portability_reason_zh，各一行。
#   blocker      選填 {kind, tracking, reason, reason_zh}：kind 為 unwired（沒有資料源）、
#                aggregation_bug、unmeasured、value_disputed；tracking 是追蹤的 issue 號。
# 閘門：arming: default 必須 portable 且沒有 blocker；要出貨一個不可攜的值，得寫
# default_exception: {tracking: <issue>}。
# 推導、不手寫：「規則包會讀、chart 不出貨」（原 NOT_CHART_ARMED）與「可攜、未出貨、
# 無阻塞」的 A2 驗證候選集合。
#
# deprecated_aliases（#1231）：退役舊拼法 → canonical key（2-release 過渡窗）。
# 本區段是 alias SSOT——唯一的 runtime 鏡像 Go（pkg/config/aliases.go）由 pin 測試
# 釘住本區段（鏡像漂移＝CI 紅）；Python 不留副本，經 da-guard key-spellings 問（#3556）。
#
# retired_keys（#3829）：已退役、沒有 rule pack 再讀的閾值 key →
#   {replaced_by: <現役 key>|null, tracking: <issue>, hint: <給 operator 的英文一句>}。
# 共用 key 判決對它一律判 unread／error／retired（不論哪一層寫、有沒有 reader 讀），
# hint 點名 replaced_by；tenant-api 的 batch unset 放行它。alias 窗口關閉時，舊拼法從
# deprecated_aliases 移到這裡。--regen 生成 Go 表
# components/threshold-exporter/app/pkg/config/retired_threshold_keys_gen.go（stale＝--ci 紅）。
# 一致性（--ci）：不得是現役 key、不得在 deprecated_aliases 任一側、replaced_by 須為
# 現役 key 或 null、tracking 必填。<old>_critical 隨 base 一併退役（判成以
# <replaced_by>_critical 替代，同 alias 的推導），所以 <old>_critical 也不得是現役 key。
version: 1
packs:
  kubernetes:
    display: Kubernetes (cAdvisor + KSM)
    exporter: cAdvisor + kube-state-metrics
    default_on: true
    rule_pack_file: rule-packs/rule-pack-kubernetes.yaml
  postgresql:
    display: PostgreSQL (postgres_exporter)
    exporter: prometheus-community/postgres_exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-postgresql.yaml
  mariadb:
    display: MariaDB / MySQL (mysqld_exporter)
    exporter: prom/mysqld-exporter or Percona
    default_on: true
    rule_pack_file: rule-packs/rule-pack-mariadb.yaml
  redis:
    display: Redis (oliver006/redis_exporter)
    exporter: oliver006/redis_exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-redis.yaml
  mongodb:
    display: MongoDB (percona/mongodb_exporter)
    exporter: percona/mongodb_exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-mongodb.yaml
  elasticsearch:
    display: Elasticsearch (elasticsearch_exporter)
    exporter: justwatchcom/elasticsearch_exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-elasticsearch.yaml
  oracle:
    display: Oracle Database (oracledb_exporter)
    exporter: iamseth/oracledb_exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-oracle.yaml
  db2:
    display: IBM DB2 (ibm_db2_exporter)
    exporter: ibm_db2_exporter (community)
    default_on: false
    rule_pack_file: rule-packs/rule-pack-db2.yaml
  clickhouse:
    display: ClickHouse (built-in /metrics)
    exporter: ClickHouse built-in Prometheus endpoint
    default_on: false
    rule_pack_file: rule-packs/rule-pack-clickhouse.yaml
  kafka:
    display: Apache Kafka (danielqsj/kafka-exporter)
    exporter: danielqsj/kafka-exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-kafka.yaml
  rabbitmq:
    display: RabbitMQ (kbudde/rabbitmq_exporter)
    exporter: kbudde/rabbitmq_exporter or built-in Prometheus plugin
    default_on: false
    rule_pack_file: rule-packs/rule-pack-rabbitmq.yaml
  jvm:
    display: JVM (jmx_exporter / Micrometer)
    exporter: prometheus/jmx_exporter or Spring Boot Actuator
    default_on: false
    rule_pack_file: rule-packs/rule-pack-jvm.yaml
  nginx:
    display: Nginx (nginx-prometheus-exporter)
    exporter: nginxinc/nginx-prometheus-exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-nginx.yaml
keys:
  container_cpu:
    pack: kubernetes
    tier: defaults
    value: 80
    unit: '%'
    desc: Container CPU % of limit (weakest link)
    metric_class: saturation
    arming: default
    portability: portable
    dimensions:
    - version
  container_cpu_throttle:
    pack: kubernetes
    tier: defaults
    value: 25
    unit: '%'
    desc: 'Chronic CFS throttle: % of ACTIVE 100ms periods throttled, NOT % CPU lost
      (critical tier opt-in via container_cpu_throttle_critical, declared in optional_overrides;
      #944)'
    metric_class: saturation
    arming: default
    portability: portable
  container_memory:
    pack: kubernetes
    tier: defaults
    value: 85
    unit: '%'
    desc: Container memory % of limit (weakest link)
    metric_class: saturation
    arming: default
    portability: portable
    dimensions:
    - version
  container_cpu_critical:
    pack: kubernetes
    tier: optional_overrides
    value: 95
    unit: '%'
    desc: Container CPU critical
    metric_class: saturation
    critical_of: container_cpu
  container_cpu_throttle_critical:
    pack: kubernetes
    tier: optional_overrides
    value: 50
    unit: '%'
    desc: CFS throttle critical
    metric_class: saturation
    critical_of: container_cpu_throttle
  container_memory_critical:
    pack: kubernetes
    tier: optional_overrides
    value: 95
    unit: '%'
    desc: Container memory critical
    metric_class: saturation
    critical_of: container_memory
  pg_connections:
    pack: postgresql
    tier: defaults
    value: 80
    unit: '% of max_connections'
    desc: Connection usage % warning
    metric_class: saturation
    arming: default
    portability: portable
  pg_replication_lag:
    pack: postgresql
    tier: defaults
    value: 30
    unit: seconds
    desc: Replication lag warning
    metric_class: replication
    arming: default
    portability: portable
  pg_connections_critical:
    pack: postgresql
    tier: optional_overrides
    value: 90
    unit: '% of max_connections'
    desc: Critical tier connections
    metric_class: saturation
    critical_of: pg_connections
  pg_replication_lag_critical:
    pack: postgresql
    tier: optional_overrides
    value: 60
    unit: seconds
    desc: Critical tier replication lag
    metric_class: replication
    critical_of: pg_replication_lag
  mysql_connection_usage_percent:
    pack: mariadb
    tier: defaults
    value: 80
    unit: '% of max_connections'
    desc: 'Connection usage warning: threads_connected as a share of max_connections,
      per instance, busiest instance per tenant; 80 = PMM "MySQL connections in use"
      template / awesome-prometheus-alerts. Replaces the absolute-count key
      mysql_connections (#3778: a unit change is a removal plus an addition, no alias)'
    metric_class: saturation
    arming: default
    portability: portable
  mysql_threads_running:
    pack: mariadb
    tier: optional_overrides
    value: 30
    unit: threads
    desc: 'threads_running saturation, NOT host CPU% — running-threads 1m-avg warning;
      30 = PMM/Nichter ''high'' tier, a reference start to calibrate per host (a healthy
      count scales with CPU cores); renamed from mysql_cpu (2-release alias window,
      old spelling still resolves)'
    metric_class: saturation
    arming: operator
    portability: site_specific
    portability_reason: "A healthy number of running threads scales with the host's CPU count"
    portability_reason_zh: "健康的 running threads 數隨主機的 CPU 核數而定"
  mysql_replication_lag:
    pack: mariadb
    tier: defaults
    value: 30
    unit: seconds
    desc: Async replication lag warning (seconds behind primary, sql_delay-adjusted);
      30 = APA/mysqld-mixin consensus trigger (they page critical at 30s; demoted
      to warning — PMM's lag-template family default is 600s warning). Enabled by
      default (#1200 WS5-P0-a Q3=C)
    metric_class: replication
    arming: default
    portability: portable
  mysql_connection_usage_percent_critical:
    pack: mariadb
    tier: optional_overrides
    value: 90
    unit: '% of max_connections'
    desc: Critical tier connection usage (same tier pair as pg_connections_critical)
    metric_class: saturation
    critical_of: mysql_connection_usage_percent
  mysql_threads_running_critical:
    pack: mariadb
    tier: optional_overrides
    value: 50
    unit: threads
    desc: Critical tier (running-threads saturation); 120→50 = PMM critical-load /
      Nichter 'overloaded' (#944); renamed from mysql_cpu_critical (#1231, 2-release
      alias window)
    metric_class: saturation
    critical_of: mysql_threads_running
  mysql_replication_lag_critical:
    pack: mariadb
    tier: optional_overrides
    value: 120
    unit: seconds
    desc: Critical tier replication lag; 120 = 4x the APA/mixin 30s trigger, 5x below
      PMM family 600s — sustained minutes-level lag is a failover data-loss window
      (#1200 WS5-P0-a)
    metric_class: replication
    critical_of: mysql_replication_lag
  redis_memory_used_bytes:
    pack: redis
    tier: defaults
    value: 4294967296
    unit: bytes (4GB)
    desc: Memory usage warning
    metric_class: saturation
    arming: operator
    portability: ratio_pending
    portability_reason: "Absolute bytes do not carry across deployments; the portable form is a share of maxmemory (redis_memory_max_bytes), pending #1320"
    portability_reason_zh: "絕對位元組跨部署沒有意義；可攜的形式是佔 maxmemory 的比例（redis_memory_max_bytes），待 #1320"
  redis_connected_clients:
    pack: redis
    tier: defaults
    value: 200
    unit: count
    desc: Connected clients warning
    metric_class: saturation
    arming: operator
    portability: ratio_pending
    portability_reason: "An absolute client count does not carry across deployments; the portable form is a share of maxclients (redis_config_maxclients), pending #1320"
    portability_reason_zh: "絕對連線數跨部署沒有意義；可攜的形式是佔 maxclients 的比例（redis_config_maxclients），待 #1320"
  redis_evicted_keys_rate:
    pack: redis
    tier: defaults
    value: 100
    unit: keys/s
    desc: 'Key eviction rate; #1196 B identity fix: renamed from redis_evicted_keys_total
      (alert demands _rate) + moved optional_overrides→defaults — unwired dead key,
      no alias'
    metric_class: efficiency
    arming: operator
    portability: site_specific
    portability_reason: "Eviction is normal for an LRU cache; the tolerable rate depends on the workload"
    portability_reason_zh: "LRU 快取淘汰是常態，可容忍的速率取決於工作負載"
  redis_replication_lag:
    pack: redis
    tier: defaults
    value: 30
    unit: seconds
    desc: 'Replica lag warning; 30 = same anchor as mysql/pg replication_lag — redis
      replication is normally sub-second, so 30s is unambiguous trouble (noise-averse
      pick, #1231 owner call); #1196 C identity fix, no alias'
    metric_class: replication
    arming: operator
    portability: portable
  redis_connected_clients_critical:
    pack: redis
    tier: optional_overrides
    value: 300
    unit: count
    desc: Connected clients critical
    metric_class: saturation
    critical_of: redis_connected_clients
  redis_memory_used_bytes_critical:
    pack: redis
    tier: optional_overrides
    value: 5368709120
    unit: bytes
    desc: Memory usage critical
    metric_class: saturation
    critical_of: redis_memory_used_bytes
  redis_replication_lag_critical:
    pack: redis
    tier: optional_overrides
    value: 50
    unit: seconds
    desc: Replica lag critical
    metric_class: replication
    critical_of: redis_replication_lag
  mongodb_connections_current:
    pack: mongodb
    tier: defaults
    value: 300
    unit: count
    desc: Current connections warning
    metric_class: saturation
    arming: operator
    portability: ratio_pending
    portability_reason: "An absolute connection count does not carry across deployments; the portable form is a share of current plus available connections, pending #1320"
    portability_reason_zh: "絕對連線數跨部署沒有意義；可攜的形式是佔「已用＋可用」連線的比例，待 #1320"
  mongodb_replication_lag:
    pack: mongodb
    tier: defaults
    value: 10
    unit: seconds
    desc: 'Replication lag warning; #1196 C identity fix: renamed from mongodb_repl_lag_seconds
      (alert demands mongodb_replication_lag) — unwired dead key, no alias'
    metric_class: replication
    arming: operator
    portability: portable
  mongodb_opcounters_rate:
    pack: mongodb
    tier: defaults
    value: 10000
    unit: ops/s
    desc: 'Total operations rate; #1196 B identity fix: renamed from mongodb_opcounters_total
      (alert demands _rate) + moved optional_overrides→defaults — unwired dead key,
      no alias'
    metric_class: throughput
    arming: operator
    portability: site_specific
    portability_reason: "Operation volume is workload, not a fault; any number is specific to the deployment"
    portability_reason_zh: "操作量是工作負載而非故障，任何數字都只適用於特定部署"
  mongodb_connections_current_critical:
    pack: mongodb
    tier: optional_overrides
    value: 450
    unit: count
    desc: Current connections critical
    metric_class: saturation
    critical_of: mongodb_connections_current
  mongodb_replication_lag_critical:
    pack: mongodb
    tier: optional_overrides
    value: 30
    unit: seconds
    desc: Replication lag critical
    metric_class: replication
    critical_of: mongodb_replication_lag
  es_heap_usage_percent:
    pack: elasticsearch
    tier: defaults
    value: 85
    unit: '%'
    desc: 'JVM heap usage warning; #1196 C identity fix: renamed from es_jvm_memory_used_percent
      (alert demands es_heap_usage_percent) — unwired dead key, no alias'
    metric_class: saturation
    arming: operator
    portability: portable
  es_disk_usage_percent:
    pack: elasticsearch
    tier: defaults
    value: 85
    unit: '%'
    desc: 'Disk USAGE % warning (used = 1 - available/size, recording rule tenant:es_disk_usage_percent:max,
      compared with >); 85 = same band as oracle/db2 tablespace_used_percent; #1196
      C semantic flip: replaces es_filesystem_free_percent 15 (FREE %) — carrying
      15 into a used-% rule would fire permanently'
    metric_class: capacity
    arming: operator
    portability: portable
  es_pending_tasks:
    pack: elasticsearch
    tier: defaults
    value: 50
    unit: count
    desc: 'Pending cluster tasks warning; 50 = existing de-facto shipped value (init_project.py
      catalog + examples/es-prod.yaml); #1196 D: key was alert-demanded but absent
      from scaffold'
    metric_class: state
    arming: operator
    portability: site_specific
    portability_reason: "A normal pending-task backlog scales with cluster size and change rate"
    portability_reason_zh: "正常的 pending task 量隨叢集規模與變更頻率而定"
  es_search_latency_ms:
    pack: elasticsearch
    tier: defaults
    value: 1000
    unit: ms
    desc: Avg search latency warning (rate(query_time)/rate(query_total), per-query
      mean); 1000 = Awesome Prometheus Alerts ElasticsearchHighQueryLatency anchor
      (same formula, 1s/5m warning) — the only community rule semantically identical
      to ours; full derivation + calibration caveat in the pack header (#1196 D)
    metric_class: latency
    arming: operator
    portability: site_specific
    portability_reason: "Acceptable search latency is a service-level choice of the deployment"
    portability_reason_zh: "可接受的搜尋延遲是各部署的服務等級選擇"
  es_disk_usage_percent_critical:
    pack: elasticsearch
    tier: optional_overrides
    value: 90
    unit: '%'
    desc: Disk usage critical
    metric_class: capacity
    critical_of: es_disk_usage_percent
  es_heap_usage_percent_critical:
    pack: elasticsearch
    tier: optional_overrides
    value: 90
    unit: '%'
    desc: JVM heap usage critical
    metric_class: saturation
    critical_of: es_heap_usage_percent
  es_pending_tasks_critical:
    pack: elasticsearch
    tier: optional_overrides
    value: 150
    unit: count
    desc: Pending cluster tasks critical
    metric_class: state
    critical_of: es_pending_tasks
  es_search_latency_ms_critical:
    pack: elasticsearch
    tier: optional_overrides
    value: 2000
    unit: ms
    desc: Avg search latency critical
    metric_class: latency
    critical_of: es_search_latency_ms
  oracle_sessions_active:
    pack: oracle
    tier: defaults
    value: 200
    unit: count
    desc: Active sessions warning
    metric_class: saturation
    arming: operator
    portability: ratio_pending
    portability_reason: "An absolute session count does not carry across deployments (#1176 measured a benign peak of 240); the portable form is a share of the SESSIONS limit, pending #1320"
    portability_reason_zh: "絕對 session 數跨部署沒有意義（#1176 量到良性尖峰 240）；可攜的形式是佔 SESSIONS 上限的比例，待 #1320"
    value_counterexample:
      issue: 1176
      direction: over_fire
      observed: a healthy diurnal peak reaches 240 active sessions
      observed_zh: 健康的日夜週期尖峰會到 240 個 active session
  oracle_tablespace_used_percent:
    pack: oracle
    tier: defaults
    value: 85
    unit: '%'
    desc: Tablespace usage warning
    metric_class: capacity
    arming: operator
    portability: portable
  oracle_wait_time_rate:
    pack: oracle
    tier: optional_overrides
    value: 50
    unit: s/s
    desc: Wait time rate (5m)
    metric_class: latency
    arming: operator
    portability: site_specific
    portability_reason: "The normal wait profile differs per workload"
    portability_reason_zh: "正常的等待輪廓因工作負載而異"
    blocker:
      kind: unmeasured
      tracking: 1320
      reason: "No measurement yet; #1320 keeps it declared until there is a signal"
      reason_zh: "尚無實測；#1320 在有訊號前維持宣告"
  oracle_process_count:
    pack: oracle
    tier: optional_overrides
    value: 300
    unit: count
    desc: Active processes warning
    metric_class: capacity
    arming: operator
    portability: ratio_pending
    portability_reason: "#1176 measured a routine backup at 560 processes; the portable form is a share of the PROCESSES limit, pending #1320"
    portability_reason_zh: "#1176 量到例行備份達 560 個 process；可攜的形式是佔 PROCESSES 上限的比例，待 #1320"
    value_counterexample:
      issue: 1176
      direction: over_fire
      observed: a routine backup batch reaches 560 processes
      observed_zh: 例行備份批次會到 560 個 process
  oracle_pga_allocated_bytes:
    pack: oracle
    tier: optional_overrides
    value: 4294967296
    unit: bytes (4GB)
    desc: PGA allocation warning
    metric_class: capacity
    arming: operator
    portability: ratio_pending
    portability_reason: "#1176 measured a planned stats-gather at 22 GB; the portable form is a share of PGA_AGGREGATE_LIMIT, pending #1320"
    portability_reason_zh: "#1176 量到計畫性 stats-gather 用到 22 GB；可攜的形式是佔 PGA_AGGREGATE_LIMIT 的比例，待 #1320"
    value_counterexample:
      issue: 1176
      direction: over_fire
      observed: a planned stats-gather reaches 22 GB PGA
      observed_zh: 計畫性 stats-gather 會用到 22 GB PGA
  oracle_sessions_active_critical:
    pack: oracle
    tier: optional_overrides
    value: 280
    unit: count
    desc: Active sessions critical
    metric_class: saturation
    critical_of: oracle_sessions_active
  oracle_tablespace_used_percent_critical:
    pack: oracle
    tier: optional_overrides
    value: 95
    unit: '%'
    desc: Tablespace usage critical
    metric_class: capacity
    critical_of: oracle_tablespace_used_percent
  db2_connections_active:
    pack: db2
    tier: defaults
    value: 200
    unit: count
    desc: Active connections warning
    metric_class: saturation
    arming: operator
    portability: ratio_pending
    portability_reason: "An absolute connection count does not carry across deployments (#1176 measured a benign peak of 360); the portable form is a share of MAXAPPLS, pending #1320"
    portability_reason_zh: "絕對連線數跨部署沒有意義（#1176 量到良性尖峰 360）；可攜的形式是佔 MAXAPPLS 的比例，待 #1320"
    value_counterexample:
      issue: 1176
      direction: over_fire
      observed: a peak-hour workload reaches 360 connections
      observed_zh: 尖峰時段的工作負載會到 360 個連線
  db2_bufferpool_hit_ratio:
    pack: db2
    tier: defaults
