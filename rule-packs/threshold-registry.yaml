# threshold-registry.yaml — threshold 契約 SoT（TRK-339 WS1a / #1200 D2）
#
# 地位：epic #1200 D2（2026-07-23 LOCKED）拍板 threshold 契約收斂到本檔——
# 語言中立（helm/docs/portal 直讀）、schema 可驗證
# （docs/schemas/threshold-registry.schema.json）。
#
# ✅ PR-2（rewire）後本檔已是真 SoT：原手抄面改為由本檔生成（定界符內），
# 定界符外手寫 prose 照舊——
#   1. rule-pack header 閾值段（defaults tier + optional_overrides 警語段，
#      依「在出貨清單裡 / 不在但 base 已出貨 / 兩者皆無」分三小段各配一份警語）
#   2. helm/threshold-exporter/values.yaml thresholdConfig.defaults
#      （chart_default 集）
#   3. components/threshold-exporter/config/conf.d/_defaults.yaml defaults 段
#   4. 上述兩個 runtime 面的 optional_overrides: 宣告 key 清單（#1310；
#      是 list 不是 map——平台認得該 key 但不主張其值）
# 新鮮度由 check_threshold_registry.py --check 面強制（stale＝硬錯）。
#
# ⚠️ 過渡期殘留：scaffold_tenant.RULE_PACKS 仍是 config 生成路徑的運作副本，
# 本檔由它機械萃取（scripts/tools/ops/_registry_lib.py build_registry_doc()，
# 外加 registry-scope 附掛表 CHART_DEFAULT_KEYS）。兩者的語意等價由 pre-commit
# gate check_threshold_registry.py 強制（防雙 SoT 漂移）。
# 改閾值請改 scaffold_tenant.RULE_PACKS，再跑：
#   python3 scripts/tools/lint/check_threshold_registry.py --regen
# （會同時重產本檔＋所有生成面。）PR-3 起 scaffold RULE_PACKS 降為生成物/
# runtime 載入，附掛表併回本檔。
#
# 範圍：threshold 身分（defaults / optional_overrides 兩層＋chart_default）。
# state_filters 與 dimensional_example 仍歸 scaffold（非閾值身分）。萃取為全量；
# 本 registry 首要服務的 enforcement 路徑是 18-key 修復線（#1196 / TRK-337）。
#
# deprecated_aliases（#1231）：退役舊拼法 → canonical key（2-release 過渡窗）。
# 本區段是 alias SSOT——Go（pkg/config/aliases.go）與 Python（_grar_validate.py）
# 兩個 runtime 鏡像由 pin 測試釘住本區段（鏡像漂移＝CI 紅）。
version: 1
packs:
  kubernetes:
    display: Kubernetes (cAdvisor + KSM)
    exporter: cAdvisor + kube-state-metrics
    default_on: true
    rule_pack_file: rule-packs/rule-pack-kubernetes.yaml
  postgresql:
    display: PostgreSQL (postgres_exporter)
    exporter: prometheus-community/postgres_exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-postgresql.yaml
  mariadb:
    display: MariaDB / MySQL (mysqld_exporter)
    exporter: prom/mysqld-exporter or Percona
    default_on: true
    rule_pack_file: rule-packs/rule-pack-mariadb.yaml
  redis:
    display: Redis (oliver006/redis_exporter)
    exporter: oliver006/redis_exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-redis.yaml
  mongodb:
    display: MongoDB (percona/mongodb_exporter)
    exporter: percona/mongodb_exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-mongodb.yaml
  elasticsearch:
    display: Elasticsearch (elasticsearch_exporter)
    exporter: justwatchcom/elasticsearch_exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-elasticsearch.yaml
  oracle:
    display: Oracle Database (oracledb_exporter)
    exporter: iamseth/oracledb_exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-oracle.yaml
  db2:
    display: IBM DB2 (ibm_db2_exporter)
    exporter: ibm_db2_exporter (community)
    default_on: false
    rule_pack_file: rule-packs/rule-pack-db2.yaml
  clickhouse:
    display: ClickHouse (built-in /metrics)
    exporter: ClickHouse built-in Prometheus endpoint
    default_on: false
    rule_pack_file: rule-packs/rule-pack-clickhouse.yaml
  kafka:
    display: Apache Kafka (danielqsj/kafka-exporter)
    exporter: danielqsj/kafka-exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-kafka.yaml
  rabbitmq:
    display: RabbitMQ (kbudde/rabbitmq_exporter)
    exporter: kbudde/rabbitmq_exporter or built-in Prometheus plugin
    default_on: false
    rule_pack_file: rule-packs/rule-pack-rabbitmq.yaml
  jvm:
    display: JVM (jmx_exporter / Micrometer)
    exporter: prometheus/jmx_exporter or Spring Boot Actuator
    default_on: false
    rule_pack_file: rule-packs/rule-pack-jvm.yaml
  nginx:
    display: Nginx (nginx-prometheus-exporter)
    exporter: nginxinc/nginx-prometheus-exporter
    default_on: false
    rule_pack_file: rule-packs/rule-pack-nginx.yaml
keys:
  container_cpu:
    pack: kubernetes
    tier: defaults
    value: 80
    unit: '%'
    desc: Container CPU % of limit (weakest link)
    metric_class: saturation
    chart_default: true
  container_cpu_throttle:
    pack: kubernetes
    tier: defaults
    value: 25
    unit: '%'
    desc: 'Chronic CFS throttle: % of ACTIVE 100ms periods throttled, NOT % CPU lost
      (critical tier opt-in via container_cpu_throttle_critical, suggest 50; #944)'
    metric_class: saturation
    chart_default: true
  container_memory:
    pack: kubernetes
    tier: defaults
    value: 85
    unit: '%'
    desc: Container memory % of limit (weakest link)
    metric_class: saturation
    chart_default: true
  pg_connections:
    pack: postgresql
    tier: defaults
    value: 80
    unit: '% of max_connections'
    desc: Connection usage % warning
    metric_class: saturation
    chart_default: true
  pg_replication_lag:
    pack: postgresql
    tier: defaults
    value: 30
    unit: seconds
    desc: Replication lag warning
    metric_class: replication
    chart_default: true
  pg_connections_critical:
    pack: postgresql
    tier: optional_overrides
    value: 90
    unit: '% of max_connections'
    desc: Critical tier connections
    metric_class: saturation
    critical_of: pg_connections
  pg_replication_lag_critical:
    pack: postgresql
    tier: optional_overrides
    value: 60
    unit: seconds
    desc: Critical tier replication lag
    metric_class: replication
    critical_of: pg_replication_lag
  mysql_connections:
    pack: mariadb
    tier: defaults
    value: 80
    unit: count
    desc: Max threads_connected warning
    metric_class: saturation
    chart_default: true
  mysql_threads_running:
    pack: mariadb
    tier: defaults
    value: 30
    unit: threads
    desc: 'threads_running saturation, NOT host CPU% — running-threads 1m-avg warning;
      80→30 = PMM/Nichter ''high'' (#944); renamed from mysql_cpu (#1231 owner-approved
      reversal of the #944 keep — 2-release alias window, old spelling still resolves)'
    metric_class: saturation
    chart_default: true
  mysql_replication_lag:
    pack: mariadb
    tier: defaults
    value: 30
    unit: seconds
    desc: Async replication lag warning (seconds behind primary, sql_delay-adjusted);
      30 = APA/mysqld-mixin consensus trigger (they page critical at 30s; demoted
      to warning — PMM's lag-template family default is 600s warning). Enabled by
      default (#1200 WS5-P0-a Q3=C)
    metric_class: replication
    chart_default: true
  mysql_connections_critical:
    pack: mariadb
    tier: optional_overrides
    value: 120
    unit: count
    desc: Critical tier (Scenario D)
    metric_class: saturation
    critical_of: mysql_connections
  mysql_threads_running_critical:
    pack: mariadb
    tier: optional_overrides
    value: 50
    unit: threads
    desc: Critical tier (running-threads saturation); 120→50 = PMM critical-load /
      Nichter 'overloaded' (#944); renamed from mysql_cpu_critical (#1231, 2-release
      alias window)
    metric_class: saturation
    critical_of: mysql_threads_running
  mysql_replication_lag_critical:
    pack: mariadb
    tier: optional_overrides
    value: 120
    unit: seconds
    desc: Critical tier replication lag; 120 = 4x the APA/mixin 30s trigger, 5x below
      PMM family 600s — sustained minutes-level lag is a failover data-loss window
      (#1200 WS5-P0-a)
    metric_class: replication
    critical_of: mysql_replication_lag
  redis_memory_used_bytes:
    pack: redis
    tier: defaults
    value: 4294967296
    unit: bytes (4GB)
    desc: Memory usage warning
    metric_class: saturation
  redis_connected_clients:
    pack: redis
    tier: defaults
    value: 200
    unit: count
    desc: Connected clients warning
    metric_class: saturation
  redis_evicted_keys_rate:
    pack: redis
    tier: defaults
    value: 100
    unit: keys/s
    desc: 'Key eviction rate; #1196 B identity fix: renamed from redis_evicted_keys_total
      (alert demands _rate) + moved optional_overrides→defaults — unwired dead key,
      no alias'
    metric_class: efficiency
  redis_replication_lag:
    pack: redis
    tier: defaults
    value: 30
    unit: seconds
    desc: 'Replica lag warning; 30 = same anchor as mysql/pg replication_lag — redis
      replication is normally sub-second, so 30s is unambiguous trouble (noise-averse
      pick, #1231 owner call); #1196 C identity fix, no alias'
    metric_class: replication
  mongodb_connections_current:
    pack: mongodb
    tier: defaults
    value: 300
    unit: count
    desc: Current connections warning
    metric_class: saturation
  mongodb_replication_lag:
    pack: mongodb
    tier: defaults
    value: 10
    unit: seconds
    desc: 'Replication lag warning; #1196 C identity fix: renamed from mongodb_repl_lag_seconds
      (alert demands mongodb_replication_lag) — unwired dead key, no alias'
    metric_class: replication
  mongodb_opcounters_rate:
    pack: mongodb
    tier: defaults
    value: 10000
    unit: ops/s
    desc: 'Total operations rate; #1196 B identity fix: renamed from mongodb_opcounters_total
      (alert demands _rate) + moved optional_overrides→defaults — unwired dead key,
      no alias'
    metric_class: throughput
  es_heap_usage_percent:
    pack: elasticsearch
    tier: defaults
    value: 85
    unit: '%'
    desc: 'JVM heap usage warning; #1196 C identity fix: renamed from es_jvm_memory_used_percent
      (alert demands es_heap_usage_percent) — unwired dead key, no alias'
    metric_class: saturation
  es_disk_usage_percent:
    pack: elasticsearch
    tier: defaults
    value: 85
    unit: '%'
    desc: 'Disk USAGE % warning (used = 1 - available/size, recording rule tenant:es_disk_usage_percent:max,
      compared with >); 85 = same band as oracle/db2 tablespace_used_percent; #1196
      C semantic flip: replaces es_filesystem_free_percent 15 (FREE %) — carrying
      15 into a used-% rule would fire permanently'
    metric_class: capacity
  es_pending_tasks:
    pack: elasticsearch
    tier: defaults
    value: 50
    unit: count
    desc: 'Pending cluster tasks warning; 50 = existing de-facto shipped value (init_project.py
      catalog + examples/elasticsearch-tenant.yaml); #1196 D: key was alert-demanded
      but absent from scaffold'
    metric_class: state
  es_search_latency_ms:
    pack: elasticsearch
    tier: defaults
    value: 1000
    unit: ms
    desc: Avg search latency warning (rate(query_time)/rate(query_total), per-query
      mean); 1000 = Awesome Prometheus Alerts ElasticsearchHighQueryLatency anchor
      (same formula, 1s/5m warning) — the only community rule semantically identical
      to ours; full derivation + calibration caveat in the pack header (#1196 D)
    metric_class: latency
  oracle_sessions_active:
    pack: oracle
    tier: defaults
    value: 200
    unit: count
    desc: Active sessions warning
    metric_class: saturation
  oracle_tablespace_used_percent:
    pack: oracle
    tier: defaults
    value: 85
    unit: '%'
    desc: Tablespace usage warning
    metric_class: capacity
  oracle_wait_time_rate:
    pack: oracle
    tier: optional_overrides
    value: 50
    unit: s/s
    desc: Wait time rate (5m)
    metric_class: latency
  oracle_process_count:
    pack: oracle
    tier: optional_overrides
    value: 300
    unit: count
    desc: Active processes warning
    metric_class: capacity
  oracle_pga_allocated_bytes:
    pack: oracle
    tier: optional_overrides
    value: 4294967296
    unit: bytes (4GB)
    desc: PGA allocation warning
    metric_class: capacity
  db2_connections_active:
    pack: db2
    tier: defaults
    value: 200
    unit: count
    desc: Active connections warning
    metric_class: saturation
  db2_bufferpool_hit_ratio:
    pack: db2
    tier: defaults
    value: 0.95
    unit: ratio
    desc: Bufferpool hit ratio warning
    metric_class: efficiency
  db2_lock_wait_time:
    pack: db2
    tier: defaults
    value: 10
    unit: s/s
    desc: Lock wait accumulation rate warning (rate over 5m, summed across the tenant's
      instances); 10 ≈ 6.7x the 1.5 normal level both reference libraries agree on,
      below both fault levels (25/60) — full derivation + calibration workflow in
      the pack header (#1196 D)
    metric_class: latency
  db2_log_usage_percent:
    pack: db2
    tier: optional_overrides
    value: 70
    unit: '%'
    desc: Transaction log usage warning
    metric_class: capacity
  db2_deadlock_rate:
    pack: db2
    tier: optional_overrides
    value: 5
    unit: count/s
    desc: Deadlock rate (5m)
    metric_class: errors
  db2_tablespace_used_percent:
    pack: db2
    tier: optional_overrides
    value: 85
    unit: '%'
    desc: Tablespace usage warning
    metric_class: capacity
  clickhouse_queries_rate:
    pack: clickhouse
    tier: defaults
    value: 500
    unit: qps
    desc: Query rate warning (5m)
    metric_class: throughput
  clickhouse_active_connections:
    pack: clickhouse
    tier: defaults
    value: 200
    unit: count
    desc: Active TCP connections warning
    metric_class: saturation
  clickhouse_max_part_count:
    pack: clickhouse
    tier: optional_overrides
    value: 300
    unit: count
    desc: Max part count per partition
    metric_class: capacity
  clickhouse_replication_queue:
    pack: clickhouse
    tier: optional_overrides
    value: 50
    unit: count
    desc: Replication queue size
    metric_class: replication
  clickhouse_memory_tracking_bytes:
    pack: clickhouse
    tier: optional_overrides
    value: 8589934592
    unit: bytes (8GB)
    desc: Memory tracking warning
    metric_class: capacity
  kafka_consumer_lag:
    pack: kafka
    tier: defaults
    value: 1000
    unit: messages
    desc: Consumer lag warning
    metric_class: saturation
  kafka_under_replicated_partitions:
    pack: kafka
    tier: defaults
    value: 0
    unit: count
    desc: Under-replicated partitions (should be 0)
    metric_class: replication
  kafka_broker_count:
    pack: kafka
    tier: defaults
    value: 3
    unit: count
    desc: Minimum broker count warning
    metric_class: state
  kafka_active_controllers:
    pack: kafka
    tier: defaults
    value: 1
    unit: count
    desc: Minimum active controllers (should be 1)
    metric_class: state
  kafka_request_rate:
    pack: kafka
    tier: defaults
    value: 10000
    unit: msg/s
    desc: Message rate warning (5m)
    metric_class: throughput
  kafka_consumer_lag_critical:
    pack: kafka
    tier: optional_overrides
    value: 10000
    unit: messages
    desc: Consumer lag critical
    metric_class: saturation
    critical_of: kafka_consumer_lag
  kafka_under_replicated_partitions_critical:
    pack: kafka
    tier: optional_overrides
    value: 1
    unit: count
    desc: Under-replicated critical
    metric_class: replication
    critical_of: kafka_under_replicated_partitions
  kafka_request_rate_critical:
    pack: kafka
    tier: optional_overrides
    value: 50000
    unit: msg/s
    desc: Message rate critical
    metric_class: throughput
    critical_of: kafka_request_rate
  rabbitmq_queue_messages:
    pack: rabbitmq
    tier: defaults
    value: 100000
    unit: messages
    desc: Queue depth warning
    metric_class: saturation
  rabbitmq_node_mem_percent:
    pack: rabbitmq
    tier: defaults
    value: 80
    unit: '%'
    desc: Node memory usage warning
    metric_class: saturation
  rabbitmq_connections:
    pack: rabbitmq
    tier: defaults
    value: 1000
    unit: count
    desc: Connection count warning
    metric_class: saturation
  rabbitmq_consumers:
    pack: rabbitmq
    tier: defaults
    value: 5
    unit: count
    desc: Minimum consumer count warning
    metric_class: state
  rabbitmq_unacked_messages:
    pack: rabbitmq
    tier: defaults
    value: 10000
    unit: messages
    desc: Unacknowledged messages warning
    metric_class: saturation
  rabbitmq_queue_messages_critical:
    pack: rabbitmq
    tier: optional_overrides
    value: 500000
    unit: messages
    desc: Queue depth critical
    metric_class: saturation
    critical_of: rabbitmq_queue_messages
  rabbitmq_node_mem_percent_critical:
    pack: rabbitmq
    tier: optional_overrides
    value: 95
    unit: '%'
    desc: Node memory critical
    metric_class: saturation
    critical_of: rabbitmq_node_mem_percent
  jvm_gc_pause:
    pack: jvm
    tier: defaults
    value: 0.5
    unit: seconds/5m
    desc: GC pause duration rate warning
    metric_class: latency
  jvm_memory:
    pack: jvm
    tier: defaults
    value: 80
    unit: '%'
    desc: Heap memory usage warning
    metric_class: saturation
  jvm_threads:
    pack: jvm
    tier: defaults
    value: 500
    unit: count
    desc: Active thread count warning
    metric_class: saturation
  jvm_gc_pause_critical:
    pack: jvm
    tier: optional_overrides
    value: 1.0
    unit: seconds/5m
    desc: GC pause critical
    metric_class: latency
    critical_of: jvm_gc_pause
  jvm_memory_critical:
    pack: jvm
    tier: optional_overrides
    value: 95
    unit: '%'
    desc: Heap memory critical
    metric_class: saturation
    critical_of: jvm_memory
  jvm_threads_critical:
    pack: jvm
    tier: optional_overrides
    value: 800
    unit: count
    desc: Thread count critical
    metric_class: saturation
    critical_of: jvm_threads
  nginx_connections:
    pack: nginx
    tier: defaults
    value: 1000
    unit: count
    desc: Active connections warning
    metric_class: saturation
  nginx_request_rate:
    pack: nginx
    tier: defaults
    value: 5000
    unit: req/s
    desc: Request rate warning
    metric_class: throughput
  nginx_waiting:
    pack: nginx
    tier: defaults
    value: 200
    unit: count
    desc: Waiting connections (backlog) warning
    metric_class: saturation
  nginx_connections_critical:
    pack: nginx
    tier: optional_overrides
    value: 2000
    unit: count
    desc: Active connections critical
    metric_class: saturation
    critical_of: nginx_connections
  nginx_request_rate_critical:
    pack: nginx
    tier: optional_overrides
    value: 10000
    unit: req/s
    desc: Request rate critical
    metric_class: throughput
    critical_of: nginx_request_rate
  nginx_waiting_critical:
    pack: nginx
    tier: optional_overrides
    value: 500
    unit: count
    desc: Waiting connections critical
    metric_class: saturation
    critical_of: nginx_waiting
deprecated_aliases:
  mysql_cpu: mysql_threads_running
