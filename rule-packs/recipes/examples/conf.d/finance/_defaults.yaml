# Custom Alerts example — a subdirectory _defaults.yaml carries no recipe.
# The exporter has no subtree inheritance for _custom_alerts (ADR-024 §3): a
# recipe written here, at the top level or under defaults:, reaches no tenant
# and the compiler builds no rule for it. A recipe shared by the tenants under
# finance/ is written in a profile instead — `finance` in the root
# _profiles.yaml — and each tenant binds it with `_profile: finance`:
#   - pay-a binds it and writes no list of its own → served the profile's list;
#   - pay-b binds it and writes its own list → served its own list only.
