# Custom Alerts example — where a recipe is declared (ADR-024 §3).
#
# The exporter takes each tenant's _custom_alerts from ONE place: the tenant's
# own entry, else its `tenants:` entry in a root platform file, else the profile
# it binds. It never merges, and it never serves _custom_alerts written at the
# top level or under defaults: of a _defaults.yaml (this file or any
# subdirectory's) — so none is declared here.
#
# An `absence` recipe shared by every tenant would also storm: any tenant that
# does not export the metric trivially satisfies absence and fires. A safe
# shared absence needs a presence-guard (constrain candidates to tenants actually
# exporting the metric); that guard is deferred (see #741 / S5 phantom-metric
# catalog). So the absence demo lives at a tenant leaf (shop.yaml), where
# self-scoping is unambiguous.
