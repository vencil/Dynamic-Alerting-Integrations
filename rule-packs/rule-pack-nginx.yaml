# ============================================================
# Rule Pack: Nginx (via nginx-prometheus-exporter)
# v1.12.0: Active connections, request rate, connection backlog 監控
#
# 需要的 exporter:
#   - https://github.com/nginxinc/nginx-prometheus-exporter
#
# >>> GENERATED:threshold-registry:pack-nginx — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
# 對應的 threshold-exporter 閾值（全部內建在讀取端，conf.d 不必列；[chart-default]=平台出貨即啟用，省略就用平台值；未標者沒有平台值，「未啟用」一行寫原因，租戶、子目錄或 profile 給值才發射）:
#   nginx_connections: 1000   # count — Active connections warning
#       未啟用（依部署而定）：絕對連線數取決於流量，worker_connections 沒有匯出可當分母
#   nginx_request_rate: 5000   # req/s — Request rate warning
#       未啟用（依部署而定）：請求量是工作負載而非故障，任何數字都只適用於特定部署
#   nginx_waiting: 200   # count — Waiting connections (backlog) warning
#       未啟用（依部署而定）：閒置的 keep-alive 連線也算 waiting，正常數量取決於流量與 keepalive 設定
#
# <base>_critical（critical 層；沒有平台值）：租戶、子目錄或 profile 寫了就送一條
# severity=critical 的列，根目錄寫的是每個租戶的 critical 預設值（#4173）；
# base 整族關掉（`<base>: "disable"`）時不送。
# ⚠️ 下列數字是「參考起點」不是背書——正式採用前必須以該租戶實際 baseline 校準。
#   nginx_connections_critical: 2000   # count — Active connections critical
#   nginx_request_rate_critical: 10000   # req/s — Request rate critical
#   nginx_waiting_critical: 500   # count — Waiting connections critical
# <<< GENERATED:threshold-registry:pack-nginx
#
# Tenant config 範例 (conf.d/db-a.yaml):
#   tenants:
#     db-a:
#       nginx_connections: "800"
#       nginx_request_rate: "3000"
#       nginx_waiting: "150"
#       nginx_connections_critical: "1500"
# ============================================================

groups:
  # --- Part 1: Normalization Recording Rules ---
  - name: nginx-normalization
    interval: 15s
    rules:
      # Active connections — max across instances
      - record: tenant:nginx_connections_active:max
        expr: |
          max by(tenant, da_cluster) (
            nginx_connections_active
          )

      # Request rate — 5m rate of total requests
      - record: tenant:nginx_requests:rate5m
        expr: |
          sum by(tenant, da_cluster) (
            rate(nginx_http_requests_total[5m])
          )

      # Waiting connections (backlog)
      - record: tenant:nginx_connections_waiting:max
        expr: |
          max by(tenant, da_cluster) (
            nginx_connections_waiting
          )

  # --- Part 2: Threshold Normalization ---
  - name: nginx-threshold-normalization
    interval: 15s
    rules:
      # Connections — warning
      - record: tenant:alert_threshold:nginx_connections
        expr: max by(tenant) (user_threshold{component="nginx", metric="connections", severity="warning"})
      # Connections — critical
      - record: tenant:alert_threshold:nginx_connections_critical
        expr: max by(tenant) (user_threshold{component="nginx", metric="connections", severity="critical"})

      # Request rate — warning
      - record: tenant:alert_threshold:nginx_request_rate
        expr: max by(tenant) (user_threshold{component="nginx", metric="request_rate", severity="warning"})
      # Request rate — critical
      - record: tenant:alert_threshold:nginx_request_rate_critical
        expr: max by(tenant) (user_threshold{component="nginx", metric="request_rate", severity="critical"})

      # Waiting — warning
      - record: tenant:alert_threshold:nginx_waiting
        expr: max by(tenant) (user_threshold{component="nginx", metric="waiting", severity="warning"})
      # Waiting — critical
      - record: tenant:alert_threshold:nginx_waiting_critical
        expr: max by(tenant) (user_threshold{component="nginx", metric="waiting", severity="critical"})

  # --- Part 3: Alert Rules ---
  - name: nginx-alerts
    rules:
      # ---- Connections ----
      - alert: NginxHighConnections
        expr: |
          (
            tenant:nginx_connections_active:max
            > on(tenant) group_left
            tenant:alert_threshold:nginx_connections
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "nginx_connections"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "NginxHighConnections on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Nginx 連線數過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Nginx connection threshold exceeded — upstream review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Nginx 連線閾值已超出 — upstream 審查"
          description: "Active connections {{ $value }} exceeds threshold"
          description_zh: "活動連線 {{ $value }} 超出閾值"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      - alert: NginxHighConnectionsCritical
        expr: |
          (
            tenant:nginx_connections_active:max
            > on(tenant) group_left
            tenant:alert_threshold:nginx_connections_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 3m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "nginx_connections"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "NginxHighConnectionsCritical on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Nginx 連線飽和嚴重"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: critical Nginx connection saturation — escalate"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：嚴重 Nginx 連線飽和 — 需升級處理"
          description: "Active connections {{ $value }} exceeds critical threshold"
          description_zh: "活動連線 {{ $value }} 超出嚴重閾值"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      # ---- Request Rate ----
      - alert: NginxRequestRateSpike
        expr: |
          (
            tenant:nginx_requests:rate5m
            > on(tenant) group_left
            tenant:alert_threshold:nginx_request_rate
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "nginx_request_rate"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "NginxRequestRateSpike on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Nginx request 速率尖峰"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: request rate spike — traffic pattern review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：request 速率尖峰 — 流量模式審查"
          description: "Request rate {{ $value }} req/s exceeds threshold"
          description_zh: "Request 速率 {{ $value }} 請求/秒 超出閾值"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      - alert: NginxRequestRateSpikeCritical
        expr: |
          (
            tenant:nginx_requests:rate5m
            > on(tenant) group_left
            tenant:alert_threshold:nginx_request_rate_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 3m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "nginx_request_rate"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "NginxRequestRateSpikeCritical on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Nginx request 速率尖峰嚴重"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: critical request rate — possible DDoS or traffic surge, escalate"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：嚴重 request 速率 — 可能 DDoS 或流量激增，需升級處理"
          description: "Request rate {{ $value }} req/s exceeds critical threshold"
          description_zh: "Request 速率 {{ $value }} 請求/秒 超出嚴重閾值"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      # ---- Connection Backlog ----
      - alert: NginxConnectionBacklog
        expr: |
          (
            tenant:nginx_connections_waiting:max
            > on(tenant) group_left
            tenant:alert_threshold:nginx_waiting
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "nginx_waiting"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "NginxConnectionBacklog on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Nginx 連線積壓"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: connection backlog building — upstream capacity review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：連線積壓正在累積 — upstream 容量審查"
          description: "Waiting connections {{ $value }} exceeds threshold"
          description_zh: "等待中的連線 {{ $value }} 超出閾值"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      - alert: NginxConnectionBacklogCritical
        expr: |
          (
            tenant:nginx_connections_waiting:max
            > on(tenant) group_left
            tenant:alert_threshold:nginx_waiting_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 3m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "nginx_waiting"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "NginxConnectionBacklogCritical on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Nginx 連線積壓嚴重"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: critical connection backlog — service degradation likely"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：嚴重連線積壓 — 服務降級可能性高"
          description: "Waiting connections {{ $value }} exceeds critical threshold"
          description_zh: "等待中的連線 {{ $value }} 超出嚴重閾值"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

  # -------------------------------------------------------
  # Unconfigured thresholds (#1200 D-A A3, #1175)
  # -------------------------------------------------------
  # The platform ships no value for some keys this pack reads; until the
  # tenant (or the platform's conf.d) writes one, the alert comparing against
  # it never fires. threshold-exporter serves user_threshold_unset{tenant,
  # pack, key} for each such key that serves no threshold and is not
  # disabled, for tenants whose state filter unset_thresholds is on (off by
  # default); this names them for a tenant whose nginx exporter is answering.
  # The expr is generated from scripts/tools/_lib_exporter_presence.py —
  # run `python3 scripts/tools/_lib_exporter_presence.py --write`, do not
  # edit it by hand.
  - name: nginx-unset-thresholds
    rules:
      - alert: NginxThresholdNotConfigured
        expr: |
          (
            max without(instance, pod) (user_threshold_unset{pack="nginx"})
            and on(tenant)
            (nginx_up{job="tenant-exporters"})
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30m
        labels:
          severity: info
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "{{ $labels.key }} has no threshold for {{ $labels.tenant }}: the alert on it stays silent"
          summary_zh: "{{ $labels.tenant }} 沒有設定 {{ $labels.key }}：讀它的告警不會響"
          platform_summary: "{{ $labels.key }}: no threshold, so its alert never fires"
          platform_summary_zh: "{{ $labels.key }}：沒有門檻值，讀它的告警不會響"
          description: "No threshold is served for {{ $labels.key }}, so the {{ $labels.pack }} alert that reads it never fires. Write a threshold to arm it, or \"disable\" to keep it off and end this notice."
          description_zh: "{{ $labels.key }} 沒有送出任何門檻值，{{ $labels.pack }} 讀它的告警因此永遠不會響。寫一個門檻值就會啟用；寫 \"disable\" 則維持關閉並結束這則提醒。"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
