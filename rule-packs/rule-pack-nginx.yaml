# Rule Pack: Nginx (via nginx-prometheus-exporter)
# v1.12.0: Active connections, request rate, connection backlog 監控
#
# 需要的 exporter:
#   - https://github.com/nginxinc/nginx-prometheus-exporter
#
# >>> GENERATED:threshold-registry:pack-nginx — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
# 對應的 threshold-exporter defaults（defaults tier——平台預設路徑會發射、告警可達）:
#   nginx_connections: 1000   # count — Active connections warning
#   nginx_request_rate: 5000   # req/s — Request rate warning
#   nginx_waiting: 200   # count — Waiting connections (backlog) warning
#
# optional_overrides（documented-but-dormant——登錄有案、平台預設不出貨）：
# ⛔ 啟用前提（別跳過）：threshold-exporter 只對「存在於 defaults 的 key」
# 發射 user_threshold——resolveBaseRows 迭代的是 c.Defaults，resolveCriticalRows
# 也要求 base key 在 defaults 才處理 _critical 覆寫（components/
# threshold-exporter/app/pkg/config/resolve.go）。下列 key 必須先進
# _defaults.yaml / Helm values 的 defaults，租戶 conf.d 才有東西可覆寫——
# 只在租戶檔填一個不在 defaults 的 key 永遠不會生效：那不是 dormant，
# 是永久無法啟用。
#   nginx_connections_critical: 2000   # count — Active connections critical
#   nginx_request_rate_critical: 10000   # req/s — Request rate critical
#   nginx_waiting_critical: 500   # count — Waiting connections critical
# <<< GENERATED:threshold-registry:pack-nginx
