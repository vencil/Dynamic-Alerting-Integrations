# ============================================================
groups:
  # -------------------------------------------------------
  # Normalization: Oracle Database metrics
  # -------------------------------------------------------
  - name: oracle-normalization
    interval: 15s
    rules:
      # Active sessions
      - record: tenant:oracle_sessions_active:max
        expr: max by(tenant) (oracledb_sessions_active)

      # Tablespace usage percentage (key dimensional metric)
      - record: tenant:oracle_tablespace_used_percent:max
        expr: max by(tenant) (oracledb_tablespace_used_percent)

      # Wait time rate (seconds per second over 5m window)
      - record: tenant:oracle_wait_time:rate5m
        expr: sum by(tenant) (rate(oracledb_wait_time_seconds_total[5m]))

      # Process count
      - record: tenant:oracle_process_count:max
        expr: max by(tenant) (oracledb_process_count)

      # PGA allocated memory (bytes)
      - record: tenant:oracle_pga_allocated_bytes:max
        expr: max by(tenant) (oracledb_pga_allocated_bytes)

      # Session utilization ratio (active / max)
      - record: tenant:oracle_session_utilization:ratio
        expr: |
          max by(tenant) (oracledb_sessions_active)
          / max by(tenant) (oracledb_resource_limit{resource="sessions"} > 0)

  # -------------------------------------------------------
  # Threshold normalization: Oracle
  # -------------------------------------------------------
  - name: oracle-threshold-normalization
    interval: 15s
    rules:
      - record: tenant:alert_threshold:oracle_sessions_active
        expr: max by(tenant) (user_threshold{component="oracle", metric="sessions_active", severity="warning"})

      - record: tenant:alert_threshold:oracle_sessions_active_critical
        expr: max by(tenant) (user_threshold{component="oracle", metric="sessions_active", severity="critical"})

      - record: tenant:alert_threshold:oracle_tablespace_used_percent
        expr: max by(tenant) (user_threshold{component="oracle", metric="tablespace_used_percent", severity="warning"})

      - record: tenant:alert_threshold:oracle_tablespace_used_percent_critical
        expr: max by(tenant) (user_threshold{component="oracle", metric="tablespace_used_percent", severity="critical"})

      - record: tenant:alert_threshold:oracle_wait_time_rate
        expr: max by(tenant) (user_threshold{component="oracle", metric="wait_time_rate", severity="warning"})

      - record: tenant:alert_threshold:oracle_process_count
        expr: max by(tenant) (user_threshold{component="oracle", metric="process_count", severity="warning"})

      - record: tenant:alert_threshold:oracle_pga_allocated_bytes
        expr: max by(tenant) (user_threshold{component="oracle", metric="pga_allocated_bytes", severity="warning"})

  # -------------------------------------------------------
  # Alert Rules: Oracle
  # -------------------------------------------------------
  - name: oracle-alerts
    rules:
      - alert: OracleDatabaseDown
        expr: oracledb_up == 0
        for: 15s
        labels:
          severity: critical
          maintenance: page
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle instance {{ $labels.instance }} is DOWN"
          summary_zh: "Oracle 實例 {{ $labels.instance }} 已關閉"
          description: "oracledb_up=0 for 15s on {{ $labels.instance }}"
          description_zh: "oracledb_up=0，持續 15 秒，實例：{{ $labels.instance }}"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      - alert: OracleHighActiveSessions
        expr: |
          (
            tenant:oracle_sessions_active:max
            > on(tenant) group_left
            tenant:alert_threshold:oracle_sessions_active
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "oracle_sessions_active"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle high active sessions on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle 活動 session 數過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle active sessions elevated — connection pool review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle 活動 session 數升高 — connection pool 審查"
          description: "{{ $value | printf \"%.0f\" }} active sessions"
          description_zh: "{{ $value | printf \"%.0f\" }} 個活動 session"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier (opt-in via oracle_sessions_active_critical)
      - alert: OracleHighActiveSessionsCritical
        expr: |
          (
            tenant:oracle_sessions_active:max
            > on(tenant) group_left
            tenant:alert_threshold:oracle_sessions_active_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "oracle_sessions_active"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle active sessions critical on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle 活動 session 數嚴重過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle active sessions at critical level — check headroom to SESSIONS/PROCESSES (new logins fail past it; OracleHighSessionUtilization measures it); find blocking sessions"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle 活動 session 數達嚴重水位 — 請確認距 SESSIONS／PROCESSES 上限的餘裕（超過後新登入會失敗，比例見 OracleHighSessionUtilization）；找出阻塞的 session"
          description: "{{ $value | printf \"%.0f\" }} active sessions (critical threshold exceeded)"
          description_zh: "{{ $value | printf \"%.0f\" }} 個活動 session（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
