          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle wait time elevated — performance bottleneck review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle 等待時間升高 — 效能瓶頸審查"
          description: "Wait time rate: {{ $value | printf \"%.1f\" }}s/s"
          description_zh: "等待時間速率：{{ $value | printf \"%.1f\" }}秒/秒"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: OracleHighProcessCount
        expr: |
          (
            tenant:oracle_process_count:max
            > on(tenant) group_left
            tenant:alert_threshold:oracle_process_count
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle high process count on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle process 數過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle process count high — resource review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle process 數過高 — 資源審查"
          description: "{{ $value | printf \"%.0f\" }} active processes"
          description_zh: "{{ $value | printf \"%.0f\" }} 個活動 process"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: OracleHighPGAUsage
        expr: |
          (
            tenant:oracle_pga_allocated_bytes:max
            > on(tenant) group_left
            tenant:alert_threshold:oracle_pga_allocated_bytes
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 10m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle high PGA usage on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle PGA 使用率過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle PGA usage high — memory sizing review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle PGA 使用率過高 — 記憶體大小調整審查"
          description: "PGA allocated: {{ $value | humanize1024 }}B"
          description_zh: "配置的 PGA：{{ $value | humanize1024 }}B"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: OracleHighSessionUtilization
        expr: |
          tenant:oracle_session_utilization:ratio > 0.85
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle session limit approaching on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle session 限制即將達到"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle session limit approaching — capacity action needed"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle session 限制即將達到 — 需採取容量擴增行動"
          description: "Session utilization: {{ $value | humanizePercentage }}"
          description_zh: "Session 使用率：{{ $value | humanizePercentage }}"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

  # -------------------------------------------------------
  # Unconfigured thresholds (#1200 D-A A3, #1175)
  # -------------------------------------------------------
  # The platform ships no value for some keys this pack reads; until the
  # tenant (or the platform's conf.d) writes one, the alert comparing against
  # it never fires. threshold-exporter serves user_threshold_unset{tenant,
  # pack, key, fix} for each such key that serves no threshold and is not
  # disabled, for tenants whose state filter unset_thresholds is on (off by
  # default); this names them for a tenant whose oracle exporter is answering.
  # The expr is generated from scripts/tools/_lib_exporter_presence.py —
  # run `python3 scripts/tools/_lib_exporter_presence.py --write`, do not
  # edit it by hand.
  - name: oracle-unset-thresholds
    rules:
      - alert: OracleThresholdNotConfigured
        expr: |
          (
            max without(instance, pod) (user_threshold_unset{pack="oracle"})
            and on(tenant)
            (query_interval{query="oracle_liveness", job="tenant-exporters"})
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30m
        labels:
          severity: info
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "{{ $labels.key }} has no threshold for {{ $labels.tenant }}: the alert on it stays silent"
          summary_zh: "{{ $labels.tenant }} 沒有設定 {{ $labels.key }}：讀它的告警不會響"
          platform_summary: "{{ $labels.key }}: no threshold, so its alert never fires (fix: {{ $labels.fix }})"
          platform_summary_zh: "{{ $labels.key }}：沒有門檻值，讀它的告警不會響（處理方：{{ $labels.fix }}）"
          description: "{{ if eq $labels.fix \"platform\" }}The platform does not declare {{ $labels.key }}, so a tenant value for it is not read and the {{ $labels.pack }} alert that reads it never fires. The platform must add it to the root defaults or optional_overrides; write \"disable\" to end this notice.{{ else }}No threshold is served for {{ $labels.key }}, so the {{ $labels.pack }} alert that reads it never fires. Write a threshold to arm it, or \"disable\" to keep it off and end this notice.{{ end }}"
          description_zh: "{{ if eq $labels.fix \"platform\" }}平台沒有宣告 {{ $labels.key }}，租戶寫的值不會被讀，{{ $labels.pack }} 讀它的告警因此永遠不會響。要由平台把它加進根層的 defaults 或 optional_overrides；寫 \"disable\" 可結束這則提醒。{{ else }}{{ $labels.key }} 沒有送出任何門檻值，{{ $labels.pack }} 讀它的告警因此永遠不會響。寫一個門檻值就會啟用；寫 \"disable\" 則維持關閉並結束這則提醒。{{ end }}"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
