#       # 維度鍵只會改到整個租戶的門檻、寫 "disable" 只是不送出這一列、不會只停掉那個維度，所以這裡不示範（#3475）。
# ============================================================
groups:
  # -------------------------------------------------------
  # Normalization: Oracle Database metrics
  # -------------------------------------------------------
  - name: oracle-normalization
    interval: 15s
    rules:
      # Active sessions
      - record: tenant:oracle_sessions_active:max
        expr: max by(tenant) (oracledb_sessions_active)

      # Tablespace usage percentage (key dimensional metric)
      - record: tenant:oracle_tablespace_used_percent:max
        expr: max by(tenant) (oracledb_tablespace_used_percent)

      # Wait time rate (seconds per second over 5m window)
      - record: tenant:oracle_wait_time:rate5m
        expr: sum by(tenant) (rate(oracledb_wait_time_seconds_total[5m]))

      # Process usage, % of the PROCESSES parameter (#1320). PROCESSES is an
      # instance-wide limit and counts background processes too, so the
      # numerator is every row of v$process. Connected to a PDB, v$process shows
      # only part of the instance and the share is a lower bound; connect to the
      # CDB root to watch the whole limit. Divided per exporter before the max,
      # so two databases (or RAC instances) of one tenant are not mixed; a limit
      # read as 0 drops out of the share instead of dividing to +Inf.
      - record: tenant:oracle_process_usage:percent
        expr: |
          max by(tenant) (
            100 * oracledb_process_count
            / (oracledb_processes_limit > 0)
          )

      # PGA usage, % of PGA_AGGREGATE_LIMIT (#1320): past the limit Oracle
      # terminates the sessions holding the most untunable PGA. A limit of 0
      # means none is set; that database then has no share and the alert on it
      # stays silent. Connected to a PDB, both sides are what that PDB sees: the
      # limit is the PDB's own when it sets one, otherwise the CDB's, and then
      # the share is a lower bound. Divided per exporter before the max.
      - record: tenant:oracle_pga_usage:percent
        expr: |
          max by(tenant) (
            100 * oracledb_pga_allocated_bytes
            / (oracledb_pga_aggregate_limit_bytes > 0)
          )

      # Session utilization ratio: sessions counted against the SESSIONS parameter
      # of the container the exporter is connected to, over that parameter — all
      # sessions, idle ones included (a leaked pool holds idle sessions), not just
      # ACTIVE user sessions. Connected to a PDB, the numerator is that PDB's
      # sessions; the denominator is the PDB's own SESSIONS when it sets one,
      # otherwise the CDB's (inherited), and then the ratio is a lower bound —
      # the other containers' sessions count against that limit but are not
      # visible from the PDB. Connect to the CDB root to watch the whole limit.
      # Divided per exporter before the max, so two databases of one tenant are
      # not mixed (#3833).
      - record: tenant:oracle_session_utilization:ratio
        expr: |
          max by(tenant) (
            oracledb_sessions_current / (oracledb_sessions_limit > 0)
          )

  # -------------------------------------------------------
  # Threshold normalization: Oracle
  # -------------------------------------------------------
  - name: oracle-threshold-normalization
    interval: 15s
    rules:
      - record: tenant:alert_threshold:oracle_sessions_active
        expr: max by(tenant) (user_threshold{component="oracle", metric="sessions_active", severity="warning"})

      - record: tenant:alert_threshold:oracle_sessions_active_critical
        expr: max by(tenant) (user_threshold{component="oracle", metric="sessions_active", severity="critical"})

      - record: tenant:alert_threshold:oracle_tablespace_used_percent
        expr: max by(tenant) (user_threshold{component="oracle", metric="tablespace_used_percent", severity="warning"})

      - record: tenant:alert_threshold:oracle_tablespace_used_percent_critical
        expr: max by(tenant) (user_threshold{component="oracle", metric="tablespace_used_percent", severity="critical"})

      - record: tenant:alert_threshold:oracle_wait_time_rate
        expr: max by(tenant) (user_threshold{component="oracle", metric="wait_time_rate", severity="warning"})

      - record: tenant:alert_threshold:oracle_process_usage_percent
        expr: max by(tenant) (user_threshold{component="oracle", metric="process_usage_percent", severity="warning"})

      - record: tenant:alert_threshold:oracle_pga_usage_percent
        expr: max by(tenant) (user_threshold{component="oracle", metric="pga_usage_percent", severity="warning"})

  # -------------------------------------------------------
  # Alert Rules: Oracle
  # -------------------------------------------------------
  - name: oracle-alerts
    rules:
      # query-exporter keeps serving while the database is down and reports no
      # 0: oracledb_up expires and query_timestamp of the liveness query stops
      # advancing (rule-packs/exporters/oracle.yaml, #3833). Down = the
      # liveness query's timestamp did not change across 90s (6 runs at its 15s
      # interval) with at least 2 samples there — one sample alone (an exporter
      # that just restarted, seen through 30s federation) is not "stopped", and
      # 3 would let one missed federation scrape resolve a firing page — or an
      # exporter that serves the query but never ran it successfully. Detection
      # takes about 90-105s after the last success (iamseth's up==0 for: 15s
      # took 25-40s): the cost of reading progress instead of a 0 the exporter
      # never reports.
      # The series must also have a sample from 90s ago (`offset 90s`): changes()
      # sees only the samples there are, so a series that began 30s ago, ran
      # once and then stopped would otherwise read as 90s without progress and
      # page 60s early.
      # changes() rather than time() - query_timestamp: the exporter's clock
      # does not matter. Joined on (tenant, instance): two clusters' pods can
      # share an IP:port after federation.
      - alert: OracleDatabaseDown
        expr: |
          max by(tenant, instance) (
            changes(query_timestamp{job="tenant-exporters", query="oracle_liveness"}[90s]) == 0
            and
            count_over_time(query_timestamp{job="tenant-exporters", query="oracle_liveness"}[90s]) > 1
            and
            query_timestamp{job="tenant-exporters", query="oracle_liveness"} offset 90s
          )
          or
          max by(tenant, instance) (
            query_interval{job="tenant-exporters", query="oracle_liveness"}
            unless on(tenant, instance)
            query_timestamp{job="tenant-exporters", query="oracle_liveness"}
          )
        for: 15s
        labels:
          severity: critical
          maintenance: page
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle instance {{ $labels.instance }} is DOWN"
          summary_zh: "Oracle 實例 {{ $labels.instance }} 已關閉"
          description: "The Oracle liveness query has not succeeded for 90s on {{ $labels.instance }}"
          description_zh: "Oracle 存活查詢 90 秒內沒有成功，實例：{{ $labels.instance }}"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      # query-exporter removes a query from its schedule for good when its result
      # does not fit the metrics declared for it (wrong column names or column
      # count: db.py FATAL_ERRORS); the gauges then expire and the threshold
      # alerts on them go silent. This names such a query while the database
      # itself answers: its successful-run count stopped across 5m (the longest
      # query interval is 60s), or the exporter schedules it and it never
      # succeeded (#3833). queries_total{status="success"}, not query_timestamp:
      # a run that returns no rows succeeds without touching query_timestamp.
      - alert: OracleQueryStalled
        expr: |
          (
            max by(tenant, instance, query) (
              increase(queries_total{job="tenant-exporters", query=~"oracle_.+", query!="oracle_liveness", status="success"}[5m]) == 0
              and
              count_over_time(queries_total{job="tenant-exporters", query=~"oracle_.+", query!="oracle_liveness", status="success"}[5m]) > 1
            )
            or
            max by(tenant, instance, query) (
              query_interval{job="tenant-exporters", query=~"oracle_.+", query!="oracle_liveness"}
              unless on(tenant, instance, query)
              queries_total{job="tenant-exporters", query=~"oracle_.+", query!="oracle_liveness", status="success"}
            )
          )
          unless on(tenant, instance)
          max by(tenant, instance) (
            (
              changes(query_timestamp{job="tenant-exporters", query="oracle_liveness"}[5m]) == 0
              and
              count_over_time(query_timestamp{job="tenant-exporters", query="oracle_liveness"}[5m]) > 1
            )
            or
            (query_interval{job="tenant-exporters", query="oracle_liveness"}
             unless on(tenant, instance)
             query_timestamp{job="tenant-exporters", query="oracle_liveness"})
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle query {{ $labels.query }} stopped on {{ $labels.instance }}"
          summary_zh: "{{ $labels.instance }} 上的 Oracle 查詢 {{ $labels.query }} 已停止"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: query-exporter query {{ $labels.query }} stopped while the database answers — the alerts on its metrics are silent"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：資料庫有回應，但 query-exporter 的查詢 {{ $labels.query }} 已停止 — 讀它指標的告警不會響"
          description: "query-exporter stopped running {{ $labels.query }} (or it never succeeded). When a result does not fit the declared metrics it drops the query for good; the cause is in its log at the default level (\"query failed\") and in queries_total{status=\"error\"}. Fix the SQL in rule-packs/exporters/oracle.yaml, then restart the exporter."
          description_zh: "query-exporter 不再執行 {{ $labels.query }}（或從未成功）。查詢結果與宣告的指標不符時，它會永久移除該查詢；原因記在預設等級的日誌（\"query failed\"）與 queries_total{status=\"error\"}。修正 rule-packs/exporters/oracle.yaml 的 SQL 後重啟 exporter。"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      - alert: OracleHighActiveSessions
        expr: |
          (
            tenant:oracle_sessions_active:max
            > on(tenant) group_left
            tenant:alert_threshold:oracle_sessions_active
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "oracle_sessions_active"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle high active sessions on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle 活動 session 數過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle active sessions elevated — connection pool review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle 活動 session 數升高 — connection pool 審查"
          description: "{{ $value | printf \"%.0f\" }} active sessions"
          description_zh: "{{ $value | printf \"%.0f\" }} 個活動 session"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier (opt-in via oracle_sessions_active_critical)
      - alert: OracleHighActiveSessionsCritical
        expr: |
          (
            tenant:oracle_sessions_active:max
            > on(tenant) group_left
            tenant:alert_threshold:oracle_sessions_active_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "oracle_sessions_active"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle active sessions critical on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle 活動 session 數嚴重過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle active sessions at critical level — check headroom to SESSIONS/PROCESSES (new logins fail past it; OracleHighSessionUtilization measures it); find blocking sessions"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle 活動 session 數達嚴重水位 — 請確認距 SESSIONS／PROCESSES 上限的餘裕（超過後新登入會失敗，比例見 OracleHighSessionUtilization）；找出阻塞的 session"
          description: "{{ $value | printf \"%.0f\" }} active sessions (critical threshold exceeded)"
          description_zh: "{{ $value | printf \"%.0f\" }} 個活動 session（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: OracleTablespaceAlmostFull
        expr: |
          (
            tenant:oracle_tablespace_used_percent:max
            > on(tenant) group_left
            tenant:alert_threshold:oracle_tablespace_used_percent
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "oracle_tablespace_used_percent"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle tablespace nearing capacity on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle tablespace 即將滿容"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle tablespace nearing capacity — storage review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle tablespace 即將滿容 — 儲存審查"
          description: "Tablespace usage: {{ $value | printf \"%.1f\" }}%"
          description_zh: "Tablespace 使用率：{{ $value | printf \"%.1f\" }}%"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier (opt-in via oracle_tablespace_used_percent_critical)
      - alert: OracleTablespaceAlmostFullCritical
        expr: |
          (
            tenant:oracle_tablespace_used_percent:max
            > on(tenant) group_left
            tenant:alert_threshold:oracle_tablespace_used_percent_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "oracle_tablespace_used_percent"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle tablespace critically full on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle tablespace 嚴重接近滿容"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle tablespace almost out of space — inserts will fail with ORA-01653; add a datafile or enable autoextend now"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle tablespace 空間即將用盡 — 寫入將以 ORA-01653 失敗；請立即新增 datafile 或啟用 autoextend"
          description: "Tablespace usage: {{ $value | printf \"%.1f\" }}% (critical threshold exceeded)"
          description_zh: "Tablespace 使用率：{{ $value | printf \"%.1f\" }}%（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: OracleHighWaitTime
        expr: |
          (
            tenant:oracle_wait_time:rate5m
            > on(tenant) group_left
            tenant:alert_threshold:oracle_wait_time_rate
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle high wait time on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle 等待時間過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle wait time elevated — performance bottleneck review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle 等待時間升高 — 效能瓶頸審查"
          description: "Wait time rate: {{ $value | printf \"%.1f\" }}s/s"
          description_zh: "等待時間速率：{{ $value | printf \"%.1f\" }}秒/秒"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: OracleHighProcessCount
        expr: |
          (
            tenant:oracle_process_usage:percent
            > on(tenant) group_left
            tenant:alert_threshold:oracle_process_usage_percent
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle processes approaching the PROCESSES limit on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle process 數逼近 PROCESSES 上限"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle processes near the PROCESSES limit — capacity review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle process 數逼近 PROCESSES 上限 — 容量審查"
          description: "Processes: {{ $value | printf \"%.1f\" }}% of the PROCESSES limit"
          description_zh: "Process 數：PROCESSES 上限的 {{ $value | printf \"%.1f\" }}%"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: OracleHighPGAUsage
        expr: |
          (
            tenant:oracle_pga_usage:percent
            > on(tenant) group_left
            tenant:alert_threshold:oracle_pga_usage_percent
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 10m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle PGA approaching PGA_AGGREGATE_LIMIT on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle PGA 逼近 PGA_AGGREGATE_LIMIT"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle PGA near PGA_AGGREGATE_LIMIT — sessions are terminated past it"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle PGA 逼近 PGA_AGGREGATE_LIMIT — 超過時會終止 session"
          description: "PGA allocated: {{ $value | printf \"%.1f\" }}% of PGA_AGGREGATE_LIMIT"
          description_zh: "配置的 PGA：PGA_AGGREGATE_LIMIT 的 {{ $value | printf \"%.1f\" }}%"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # PGA_AGGREGATE_LIMIT not set (#4044): tenant:oracle_pga_usage:percent drops
      # a database whose limit reads 0 (no limit), so OracleHighPGAUsage can never
      # fire for it — while the tenant has set oracle_pga_usage_percent, so
      # OracleThresholdNotConfigured stays quiet too. This notice closes that gap:
      # info only, it pages nobody. It names the tenant, not the database; a tenant
      # with two databases, one of them limited, still gets its share from the
      # other and this notice for the unlimited one, per database (instance).
      - alert: OraclePGALimitNotSet
        expr: |
          (
            max by(tenant, instance) (oracledb_pga_aggregate_limit_bytes == 0)
            and on(tenant)
            tenant:alert_threshold:oracle_pga_usage_percent
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30m
        labels:
          severity: info
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle PGA_AGGREGATE_LIMIT is not set on {{ $labels.tenant }}: the PGA alert stays silent"
          summary_zh: "{{ $labels.tenant }} 的 Oracle 沒有設定 PGA_AGGREGATE_LIMIT：PGA 告警不會響"
          platform_summary: "{{ $labels.tenant }}: PGA_AGGREGATE_LIMIT is 0, so oracle_pga_usage_percent has nothing to measure against"
          platform_summary_zh: "{{ $labels.tenant }}：PGA_AGGREGATE_LIMIT 為 0，oracle_pga_usage_percent 沒有可比的上限"
          description: "Database {{ $labels.instance }} of this tenant runs with PGA_AGGREGATE_LIMIT = 0 (no limit), so its PGA share is not computed and OracleHighPGAUsage cannot fire for it, although oracle_pga_usage_percent is set. Set PGA_AGGREGATE_LIMIT, or write \"disable\" for oracle_pga_usage_percent to end this notice."
          description_zh: "這個租戶的資料庫 {{ $labels.instance }} 的 PGA_AGGREGATE_LIMIT 為 0（沒有上限），所以不計算它的 PGA 比例，即使設了 oracle_pga_usage_percent，OracleHighPGAUsage 也不會為它而響。設定 PGA_AGGREGATE_LIMIT，或把 oracle_pga_usage_percent 寫成 \"disable\" 就會結束這則提醒。"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: OracleHighSessionUtilization
        expr: |
          tenant:oracle_session_utilization:ratio > 0.85
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Oracle session limit approaching on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 Oracle session 限制即將達到"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Oracle session limit approaching — capacity action needed"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：Oracle session 限制即將達到 — 需採取容量擴增行動"
          description: "Session utilization: {{ $value | humanizePercentage }}"
          description_zh: "Session 使用率：{{ $value | humanizePercentage }}"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

  # -------------------------------------------------------
  # Unconfigured thresholds (#1200 D-A A3, #1175)
  # -------------------------------------------------------
  # The platform ships no value for some keys this pack reads; until the
  # tenant (or the platform's conf.d) writes one, the alert comparing against
  # it never fires. threshold-exporter serves user_threshold_unset{tenant,
  # pack, key, fix} for each such key that serves no threshold and is not
  # disabled, for tenants whose state filter unset_thresholds is on (off by
  # default); this names them for a tenant whose oracle exporter is answering.
  # The expr is generated from scripts/tools/_lib_exporter_presence.py —
  # run `python3 scripts/tools/_lib_exporter_presence.py --write`, do not
  # edit it by hand.
  - name: oracle-unset-thresholds
    rules:
      - alert: OracleThresholdNotConfigured
        expr: |
          (
            max without(instance, pod) (user_threshold_unset{pack="oracle"})
            and on(tenant)
            (query_interval{query="oracle_liveness", job="tenant-exporters"})
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30m
        labels:
          severity: info
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "{{ $labels.key }} has no threshold for {{ $labels.tenant }}: the alert on it stays silent"
          summary_zh: "{{ $labels.tenant }} 沒有設定 {{ $labels.key }}：讀它的告警不會響"
          platform_summary: "{{ $labels.key }}: no threshold, so its alert never fires (fix: {{ $labels.fix }})"
          platform_summary_zh: "{{ $labels.key }}：沒有門檻值，讀它的告警不會響（處理方：{{ $labels.fix }}）"
          description: "{{ if eq $labels.fix \"platform\" }}The platform does not declare {{ $labels.key }}, so a tenant value for it is not read and the {{ $labels.pack }} alert that reads it never fires. The platform must add it to the root defaults or optional_overrides; write \"disable\" to end this notice.{{ else }}No threshold is served for {{ $labels.key }}, so the {{ $labels.pack }} alert that reads it never fires. Write a threshold to arm it, or \"disable\" to keep it off and end this notice.{{ end }}"
          description_zh: "{{ if eq $labels.fix \"platform\" }}平台沒有宣告 {{ $labels.key }}，租戶寫的值不會被讀，{{ $labels.pack }} 讀它的告警因此永遠不會響。要由平台把它加進根層的 defaults 或 optional_overrides；寫 \"disable\" 可結束這則提醒。{{ else }}{{ $labels.key }} 沒有送出任何門檻值，{{ $labels.pack }} 讀它的告警因此永遠不會響。寫一個門檻值就會啟用；寫 \"disable\" 則維持關閉並結束這則提醒。{{ end }}"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
