#       db2_bufferpool_hit_ratio: "0.98"
#       # 維度鍵（metric{label="value"}）在本 pack 不依維度判斷：門檻以 max by(tenant) 取租戶最大值，
#       # 維度鍵只會改到整個租戶的門檻、寫 "disable" 只是不送出這一列、不會只停掉那個維度，所以這裡不示範（#3475）。
# ============================================================
groups:
  # -------------------------------------------------------
  # Normalization: DB2 metrics
  # -------------------------------------------------------
  - name: db2-normalization
    interval: 15s
    rules:
      # Connected applications (MON_GET_DATABASE.APPLS_CUR_CONS)
      - record: tenant:db2_connections_active:max
        expr: max by(tenant) (db2_connections_current)

      # Bufferpool hit ratio over the last 5m, 0–1, IBM's formula: pages the
      # agents found in the pool (without prefetched ones) / logical reads, per
      # exporter, then the worst one (rule-packs/exporters/db2.yaml). Rates of
      # the database's own counters, not the hit ratio since activation, which
      # a long-running database would dilute (#3833).
      # 最小樣本 gate：5 分鐘至少 200 次 logical read 才算比值。和
      # tenant:db2_sort_overflow_ratio:avg 同一條推導（比例的 success-failure
      # 條件 n ≥ 10 / min(p0, 1−p0)），p0 取 registry 的參考值 0.95，得 200；
      # 它只保證比值可以解讀，不控制誤報。
      - record: tenant:db2_bufferpool_hit_ratio:min
        expr: |
          min by(tenant) (
            rate(db2_bufferpool_pages_found_total[5m])
            / (rate(db2_bufferpool_logical_reads_total[5m]) >= 200 / 300)
          )

      # Active transaction log in use, % of used + available, per exporter,
      # then the fullest. Under infinite logging the exporter serves neither
      # gauge (DB2 reports available −1), so there is no share and no alert.
      - record: tenant:db2_log_usage_percent:max
        expr: |
          max by(tenant) (
            100 * db2_log_used_bytes
            / ((db2_log_used_bytes + db2_log_available_bytes) > 0)
          )

      # Deadlock rate
      - record: tenant:db2_deadlocks:rate5m
        expr: sum by(tenant) (rate(db2_deadlocks_total[5m]))

      # Tablespace usage percentage
      - record: tenant:db2_tablespace_used_percent:max
        expr: max by(tenant) (db2_tablespace_used_percent)

      # Lock wait accrual RATE — seconds of lock wait accrued PER SECOND, averaged
      # over a 5m window. ⚠️ NOT "seconds per 5m window": rate() divides by the
      # window, so the unit is s/s (dimensionless — 1.0 means one second of waiting
      # accrues every second, i.e. one connection blocked full-time). The old comment
      # said "per 5m window", which is the same number scaled by 300 — an operator
      # who sized the threshold from it would set a value 300x too high and the alert
      # would never fire. This became load-bearing once the threshold key below made
      # it a knob operators actually fill in.
      # Aggregation note: sum by(tenant) ADDS across DB2 instances, so the threshold's
      # meaning scales with instance count (same convention as db2_deadlocks:rate5m).
      - record: tenant:db2_lock_wait_time:rate5m
        expr: sum by(tenant) (rate(db2_lock_wait_time_seconds_total[5m]))

      # Sort overflow ratio — RATE ratio, NOT lifetime-cumulative ratio (#1181).
      # db2_sort_overflows_total / db2_sorts_total are both CUMULATIVE counters. Dividing
      # them raw yields the all-time overflow fraction, which progressively
      # desensitises as the instance ages: on a long-running database a severe
      # recent episode (say 50% of sorts overflowing for an hour) is diluted by the
      # lifetime denominator and may never cross the threshold. Taking rate() of
      # both over a common window keeps the ratio scoped to recent behaviour.
      # The ratio itself is window-length-independent (numerator and denominator
      # scale together), so the 0.05 threshold semantics are unchanged.
      #
      # 最小樣本 gate（#1176）：5 分鐘窗內至少 200 次排序才計算比值，否則這個租戶
      # 沒有比值、告警不會響。閒置庫 5 分鐘 3 次排序、1 次溢位就是 33%，這種比值
      # 不是可以拿來和 0.05 比的估計值。200 來自比例的 success-failure（large
      # counts）條件：n·p0 ≥ 10 且 n·(1−p0) ≥ 10，即 n ≥ 10 / min(p0, 1−p0)，
      # p0 = 0.05 時為 200；改 0.05 門檻時要一起改。它只由門檻推出、與租戶流量
      # 無關。⚠️ 它只保證比值可以解讀，不控制誤報：n = 200 時真實比例 0.04 的庫，
      # 單一窗量到超過 0.05 的機率約 18%（二項分布）；門檻附近的雜訊靠 for: 10m
      # 吸收。代價是排序量低於 200 次／5m 的庫，即使真的大量溢位也不會告警。
      # 窗是 5m，所以寫成每秒 200 / 300 次。0.05 門檻本身仍待真實流量校準（#1176）。
      - record: tenant:db2_sort_overflow_ratio:avg
        expr: |
          sum by(tenant) (rate(db2_sort_overflows_total[5m]))
          / (sum by(tenant) (rate(db2_sorts_total[5m])) >= 200 / 300)

  # -------------------------------------------------------
  # Threshold normalization: DB2
  # -------------------------------------------------------
  - name: db2-threshold-normalization
    interval: 15s
    rules:
      - record: tenant:alert_threshold:db2_connections_active
        expr: max by(tenant) (user_threshold{component="db2", metric="connections_active", severity="warning"})

      - record: tenant:alert_threshold:db2_connections_active_critical
        expr: max by(tenant) (user_threshold{component="db2", metric="connections_active", severity="critical"})

      - record: tenant:alert_threshold:db2_bufferpool_hit_ratio
        expr: max by(tenant) (user_threshold{component="db2", metric="bufferpool_hit_ratio", severity="warning"})

      - record: tenant:alert_threshold:db2_log_usage_percent
        expr: max by(tenant) (user_threshold{component="db2", metric="log_usage_percent", severity="warning"})

      - record: tenant:alert_threshold:db2_deadlock_rate
        expr: max by(tenant) (user_threshold{component="db2", metric="deadlock_rate", severity="warning"})

      - record: tenant:alert_threshold:db2_tablespace_used_percent
        expr: max by(tenant) (user_threshold{component="db2", metric="tablespace_used_percent", severity="warning"})

      - record: tenant:alert_threshold:db2_lock_wait_time
        expr: max by(tenant) (user_threshold{component="db2", metric="lock_wait_time", severity="warning"})

      - record: tenant:alert_threshold:db2_lock_wait_time_critical
        expr: max by(tenant) (user_threshold{component="db2", metric="lock_wait_time", severity="critical"})

  # -------------------------------------------------------
  # Alert Rules: DB2
  # -------------------------------------------------------
  - name: db2-alerts
    rules:
      # query-exporter keeps serving while the database is down and reports no
      # 0: db2_up expires and query_timestamp of the liveness query stops
      # advancing (rule-packs/exporters/db2.yaml, #3833). Down = the
      # liveness query's timestamp did not change across 90s (6 runs at its 15s
      # interval) with at least 2 samples there — one sample alone (an exporter
      # that just restarted, seen through 30s federation) is not "stopped", and
      # 3 would let one missed federation scrape resolve a firing page — or an
      # exporter that serves the query but never ran it successfully. Detection
      # takes about 90-105s after the last success (the previous exporter's db2_up == 0
      # for: 15s took 25-40s): the cost of reading progress instead of a 0 the exporter
      # never reports.
      # The "never succeeded" arm waits as long: the exporter must have served
      # query_interval 90s ago, so a first success that is merely slow (the
      # connection still opening, a scrape that came early) does not page.
      # The series must also have a sample from 90s ago (`offset 90s`): changes()
      # sees only the samples there are, so a series that began 30s ago, ran
      # once and then stopped would otherwise read as 90s without progress and
      # page 60s early.
      # changes() rather than time() - query_timestamp: the exporter's clock
      # does not matter. Joined on (tenant, instance): two clusters' pods can
      # share an IP:port after federation.
      - alert: DB2DatabaseDown
        expr: |
          max by(tenant, instance) (
            changes(query_timestamp{job="tenant-exporters", query="db2_liveness"}[90s]) == 0
            and
            count_over_time(query_timestamp{job="tenant-exporters", query="db2_liveness"}[90s]) > 1
            and
            query_timestamp{job="tenant-exporters", query="db2_liveness"} offset 90s
          )
          or
          max by(tenant, instance) (
            (
              query_interval{job="tenant-exporters", query="db2_liveness"}
              unless on(tenant, instance)
              query_timestamp{job="tenant-exporters", query="db2_liveness"}
            )
            and on(tenant, instance)
            query_interval{job="tenant-exporters", query="db2_liveness"} offset 90s
          )
        for: 15s
        labels:
          severity: critical
          maintenance: page
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 instance {{ $labels.instance }} is DOWN"
          summary_zh: "DB2 實例 {{ $labels.instance }} 已關閉"
          description: "The DB2 liveness query has not succeeded for 90s on {{ $labels.instance }}"
          description_zh: "DB2 存活查詢 90 秒內沒有成功，實例：{{ $labels.instance }}"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      # query-exporter removes a query from its schedule for good when its result
      # does not fit the metrics declared for it (wrong column names or column
      # count: db.py FATAL_ERRORS); the gauges then expire and the threshold
      # alerts on them go silent. This names such a query while the database
      # itself answers: its successful-run count stopped across 5m (the longest
      # query interval is 60s), or the exporter schedules it and it never
      # succeeded (#3833). queries_total{status="success"}, not query_timestamp:
      # a run that returns no rows succeeds without touching query_timestamp.
      - alert: DB2QueryStalled
        expr: |
          (
            max by(tenant, instance, query) (
              increase(queries_total{job="tenant-exporters", query=~"db2_.+", query!="db2_liveness", status="success"}[5m]) == 0
              and
              count_over_time(queries_total{job="tenant-exporters", query=~"db2_.+", query!="db2_liveness", status="success"}[5m]) > 1
            )
            or
            max by(tenant, instance, query) (
              query_interval{job="tenant-exporters", query=~"db2_.+", query!="db2_liveness"}
              unless on(tenant, instance, query)
              queries_total{job="tenant-exporters", query=~"db2_.+", query!="db2_liveness", status="success"}
            )
          )
          unless on(tenant, instance)
          max by(tenant, instance) (
            (
              changes(query_timestamp{job="tenant-exporters", query="db2_liveness"}[5m]) == 0
              and
              count_over_time(query_timestamp{job="tenant-exporters", query="db2_liveness"}[5m]) > 1
            )
            or
            (query_interval{job="tenant-exporters", query="db2_liveness"}
             unless on(tenant, instance)
             query_timestamp{job="tenant-exporters", query="db2_liveness"})
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 query {{ $labels.query }} stopped on {{ $labels.instance }}"
          summary_zh: "{{ $labels.instance }} 上的 DB2 查詢 {{ $labels.query }} 已停止"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: query-exporter query {{ $labels.query }} stopped while the database answers — the alerts on its metrics are silent"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：資料庫有回應，但 query-exporter 的查詢 {{ $labels.query }} 已停止 — 讀它指標的告警不會響"
          description: "query-exporter stopped running {{ $labels.query }} (or it never succeeded). When a result does not fit the declared metrics it drops the query for good; the cause is in its log at the default level (\"query failed\") and in queries_total{status=\"error\"}. Fix the SQL in rule-packs/exporters/db2.yaml, then restart the exporter."
          description_zh: "query-exporter 不再執行 {{ $labels.query }}（或從未成功）。查詢結果與宣告的指標不符時，它會永久移除該查詢；原因記在預設等級的日誌（\"query failed\"）與 queries_total{status=\"error\"}。修正 rule-packs/exporters/db2.yaml 的 SQL 後重啟 exporter。"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      - alert: DB2HighConnections
        expr: |
          (
            tenant:db2_connections_active:max
            > on(tenant) group_left
            tenant:alert_threshold:db2_connections_active
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "db2_connections_active"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 high active connections on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 DB2 連線數過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: DB2 connection usage high — pool sizing review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：DB2 連線使用率過高 — pool 大小調整審查"
          description: "{{ $value | printf \"%.0f\" }} active connections"
          description_zh: "{{ $value | printf \"%.0f\" }} 個活動連線"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier (opt-in via db2_connections_active_critical)
      - alert: DB2HighConnectionsCritical
        expr: |
          (
            tenant:db2_connections_active:max
            > on(tenant) group_left
            tenant:alert_threshold:db2_connections_active_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "db2_connections_active"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 active connections critical on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 DB2 連線數嚴重過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: DB2 connections at critical level — check headroom to MAXAPPLS (new connections are refused past it); cap the offending pool"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：DB2 連線數達嚴重水位 — 請確認距 MAXAPPLS 的餘裕（超過後新連線會被拒）；限制造成問題的連線池"
          description: "{{ $value | printf \"%.0f\" }} active connections (critical threshold exceeded)"
          description_zh: "{{ $value | printf \"%.0f\" }} 個活動連線（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: DB2LowBufferpoolHitRatio
        expr: |
          (
            tenant:db2_bufferpool_hit_ratio:min
            < on(tenant) group_left
            tenant:alert_threshold:db2_bufferpool_hit_ratio
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 10m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 low bufferpool hit ratio on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 DB2 bufferpool 命中率偏低"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: DB2 bufferpool hit ratio low — memory tuning review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：DB2 bufferpool 命中率偏低 — 記憶體調優審查"
          description: "Hit ratio: {{ $value | printf \"%.4f\" }} — check bufferpool sizing"
          description_zh: "命中率：{{ $value | printf \"%.4f\" }} — 檢查 bufferpool 大小調整"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: DB2HighLogUsage
        expr: |
          (
            tenant:db2_log_usage_percent:max
            > on(tenant) group_left
            tenant:alert_threshold:db2_log_usage_percent
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 high transaction log usage on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 DB2 交易日誌使用率過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: DB2 transaction log usage high — log space review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：DB2 交易日誌使用率過高 — 日誌空間審查"
          description: "Log usage: {{ $value | printf \"%.1f\" }}%"
          description_zh: "日誌使用率：{{ $value | printf \"%.1f\" }}%"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: DB2HighDeadlockRate
        expr: |
          (
            tenant:db2_deadlocks:rate5m
            > on(tenant) group_left
            tenant:alert_threshold:db2_deadlock_rate
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 high deadlock rate on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 DB2 死鎖率過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: DB2 deadlock rate elevated — application contention review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：DB2 死鎖率升高 — 應用程式爭用審查"
          description: "{{ $value | printf \"%.1f\" }} deadlocks/sec"
          description_zh: "{{ $value | printf \"%.1f\" }} 個死鎖/秒"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: DB2TablespaceAlmostFull
        expr: |
          (
            tenant:db2_tablespace_used_percent:max
            > on(tenant) group_left
            tenant:alert_threshold:db2_tablespace_used_percent
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 tablespace nearing capacity on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 DB2 tablespace 即將滿容"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: DB2 tablespace nearing capacity — storage review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：DB2 tablespace 即將滿容 — 儲存審查"
          description: "Tablespace usage: {{ $value | printf \"%.1f\" }}%"
          description_zh: "Tablespace 使用率：{{ $value | printf \"%.1f\" }}%"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Lock wait contention. The `tenant:db2_lock_wait_time:rate5m` recording rule
      # shipped WITHOUT any consumer — no threshold normalization, no alert — so a real
      # lock-contention incident produced a populated series that paged nobody. Two
      # independent blind-written reference waveforms both reproduced the miss.
      # `for: 5m` matches DB2HighDeadlockRate: both are rate() over a cumulative
      # contention counter (as opposed to the 10m efficiency-ratio gauges), and the
      # rate5m window already absorbs short lock convoys, so 5m means ~10m of
      # sustained contention before anyone is paged.
      - alert: DB2HighLockWaitTime
        expr: |
          (
            tenant:db2_lock_wait_time:rate5m
            > on(tenant) group_left
            tenant:alert_threshold:db2_lock_wait_time
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "db2_lock_wait_time"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 high lock wait time on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 DB2 鎖等待時間過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: DB2 lock wait time high — lock contention review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：DB2 鎖等待時間過高 — 鎖爭用審查"
          description: "{{ $value | printf \"%.1f\" }}s of lock wait accrued per second"
          description_zh: "每秒累積 {{ $value | printf \"%.1f\" }} 秒的鎖等待"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier (opt-in via db2_lock_wait_time_critical)
      - alert: DB2HighLockWaitTimeCritical
        expr: |
          (
            tenant:db2_lock_wait_time:rate5m
            > on(tenant) group_left
            tenant:alert_threshold:db2_lock_wait_time_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "db2_lock_wait_time"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 lock wait time critical on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 DB2 鎖等待時間嚴重過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: DB2 lock waits at critical level — transactions are queueing behind locks; find the lock-holding application and end it now"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：DB2 鎖等待達嚴重水位 — 交易正排隊等鎖；請立即找出持有鎖的應用程式並結束它"
          description: "{{ $value | printf \"%.1f\" }}s of lock wait accrued per second (critical threshold exceeded)"
          description_zh: "每秒累積 {{ $value | printf \"%.1f\" }} 秒的鎖等待（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: DB2HighSortOverflow
        expr: |
          tenant:db2_sort_overflow_ratio:avg > 0.05
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 10m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "DB2 high sort overflow ratio on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 上 DB2 sort overflow 比率過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: DB2 sort overflow ratio high — SORTHEAP tuning review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：DB2 sort overflow 比率過高 — SORTHEAP 調優審查"
          description: "Sort overflow ratio: {{ $value | printf \"%.2f\" }} — consider increasing SORTHEAP"
          description_zh: "Sort overflow 比率：{{ $value | printf \"%.2f\" }} — 考慮增加 SORTHEAP"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

  # -------------------------------------------------------
  # Unconfigured thresholds (#1200 D-A A3, #1175)
  # -------------------------------------------------------
  # The platform ships no value for some keys this pack reads; until the
  # tenant (or the platform's conf.d) writes one, the alert comparing against
  # it never fires. threshold-exporter serves user_threshold_unset{tenant,
  # pack, key, fix} for each such key that serves no threshold and is not
  # disabled, for tenants whose state filter unset_thresholds is on (off by
  # default); this names them for a tenant whose db2 exporter is answering.
  # The expr is generated from scripts/tools/_lib_exporter_presence.py —
  # run `python3 scripts/tools/_lib_exporter_presence.py --write`, do not
  # edit it by hand.
  - name: db2-unset-thresholds
    rules:
      - alert: DB2ThresholdNotConfigured
        expr: |
          (
            max without(instance, pod) (user_threshold_unset{pack="db2"})
            and on(tenant)
            (query_interval{query="db2_liveness", job="tenant-exporters"})
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30m
        labels:
          severity: info
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "{{ $labels.key }} has no threshold for {{ $labels.tenant }}: the alert on it stays silent"
          summary_zh: "{{ $labels.tenant }} 沒有設定 {{ $labels.key }}：讀它的告警不會響"
          platform_summary: "{{ $labels.key }}: no threshold, so its alert never fires (fix: {{ $labels.fix }})"
          platform_summary_zh: "{{ $labels.key }}：沒有門檻值，讀它的告警不會響（處理方：{{ $labels.fix }}）"
          description: "{{ if eq $labels.fix \"platform\" }}The platform does not declare {{ $labels.key }}, so a tenant value for it is not read and the {{ $labels.pack }} alert that reads it never fires. The platform must add it to the root defaults or optional_overrides; write \"disable\" to end this notice.{{ else }}No threshold is served for {{ $labels.key }}, so the {{ $labels.pack }} alert that reads it never fires. Write a threshold to arm it, or \"disable\" to keep it off and end this notice.{{ end }}"
          description_zh: "{{ if eq $labels.fix \"platform\" }}平台沒有宣告 {{ $labels.key }}，租戶寫的值不會被讀，{{ $labels.pack }} 讀它的告警因此永遠不會響。要由平台把它加進根層的 defaults 或 optional_overrides；寫 \"disable\" 可結束這則提醒。{{ else }}{{ $labels.key }} 沒有送出任何門檻值，{{ $labels.pack }} 讀它的告警因此永遠不會響。寫一個門檻值就會啟用；寫 \"disable\" 則維持關閉並結束這則提醒。{{ end }}"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
