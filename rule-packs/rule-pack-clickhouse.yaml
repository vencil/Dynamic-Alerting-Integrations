# ============================================================
# Rule Pack: ClickHouse (via its built-in /metrics endpoint)
# 選配 — 涵蓋 Queries、Connections、Parts、Replication、Memory、MergeRate
#
# 需要的 endpoint:
#   - ClickHouse 內建 Prometheus endpoint (/metrics)。本 pack 讀的指標名
#     (ClickHouseMetrics_* / ClickHouseProfileEvents_*) 全是它的；clickhouse_exporter
#     的指標名不同，不支援。沒有獨立 exporter，所以 target 的 up==0 就是 server
#     連不上——ClickHouse 停機由 rule-pack-liveness.yaml 的 TenantExporterAbsent
#     負責（#3618）。
#
