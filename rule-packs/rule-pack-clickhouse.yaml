#   clickhouse_queries_rate: 500   # qps — Query rate warning (5m)
#       未啟用（依部署而定）：查詢量是工作負載而非故障，任何數字都只適用於特定部署
#   clickhouse_active_connections: 200   # count — Active TCP connections warning
#       未啟用（待改比值）：絕對連線數跨部署沒有意義；上限（max_connections）目前沒有匯出，分母由 #1320 決定
#
