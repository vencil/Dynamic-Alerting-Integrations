# <<< GENERATED:threshold-registry:pack-clickhouse
#
# Tenant config 範例 (conf.d/clickhouse-prod.yaml):
#   tenants:
#     clickhouse-prod:
#       clickhouse_queries_rate: "300"
#       clickhouse_active_connections: "150"
#       # 維度鍵（metric{label="value"}）在本 pack 不依維度判斷：門檻以 max by(tenant) 取租戶最大值，
#       # 維度鍵只會改到整個租戶的門檻、寫 "disable" 只是不送出這一列、不會只停掉那個維度，所以這裡不示範（#3475）。
# ============================================================
groups:
  # ─────────────────────────────────────────────
  # 1. Normalization Recording Rules
  # ─────────────────────────────────────────────
  - name: clickhouse-normalization
    rules:
      # Query rate (5m)
      - record: tenant:clickhouse_queries:rate5m
        expr: |
          sum by(tenant) (
            rate(ClickHouseProfileEvents_Query{tenant!=""}[5m])
          )

      # Active connections (current)
      - record: tenant:clickhouse_active_connections:max
        expr: |
          max by(tenant) (
            ClickHouseMetrics_TCPConnection{tenant!=""}
          )

      # Max part count for partition (hotspot indicator)
      - record: tenant:clickhouse_max_part_count:max
        expr: |
          max by(tenant) (
            ClickHouseAsyncMetrics_MaxPartCountForPartition{tenant!=""}
          )

      # Replication queue size
      - record: tenant:clickhouse_replication_queue:max
        expr: |
          max by(tenant) (
            ClickHouseMetrics_ReplicatedSendQueueSize{tenant!=""}
            + ClickHouseMetrics_ReplicatedFetchQueueSize{tenant!=""}
          )

      # Memory tracking (current resident bytes)
      - record: tenant:clickhouse_memory_tracking:max
        expr: |
          max by(tenant) (
            ClickHouseMetrics_MemoryTracking{tenant!=""}
          )

      # Failed queries rate (5m)
      - record: tenant:clickhouse_failed_queries:rate5m
        expr: |
          sum by(tenant) (
            rate(ClickHouseProfileEvents_FailedQuery{tenant!=""}[5m])
          )

  # ─────────────────────────────────────────────
  # 2. Threshold Normalization (user_threshold → per-tenant ceiling)
  # ─────────────────────────────────────────────
  - name: clickhouse-threshold-normalization
    rules:
      - record: tenant:alert_threshold:clickhouse_queries_rate
        expr: |
          max by(tenant) (
            user_threshold{component="clickhouse", metric="queries_rate", severity="warning"}
          )

      - record: tenant:alert_threshold:clickhouse_active_connections
        expr: |
          max by(tenant) (
            user_threshold{component="clickhouse", metric="active_connections", severity="warning"}
          )

      - record: tenant:alert_threshold:clickhouse_active_connections_critical
        expr: |
          max by(tenant) (
            user_threshold{component="clickhouse", metric="active_connections", severity="critical"}
          )

      - record: tenant:alert_threshold:clickhouse_max_part_count
        expr: |
          max by(tenant) (
            user_threshold{component="clickhouse", metric="max_part_count", severity="warning"}
          )

      - record: tenant:alert_threshold:clickhouse_replication_queue
        expr: |
          max by(tenant) (
            user_threshold{component="clickhouse", metric="replication_queue", severity="warning"}
          )

      - record: tenant:alert_threshold:clickhouse_memory_tracking_bytes
        expr: |
          max by(tenant) (
            user_threshold{component="clickhouse", metric="memory_tracking_bytes", severity="warning"}
          )

  # ─────────────────────────────────────────────
  # 3. Alert Rules
  # ─────────────────────────────────────────────
  - name: clickhouse-alerts
    rules:
      # --- Query Rate ---
      - alert: ClickHouseHighQueryRate
        expr: |
          (
            tenant:clickhouse_queries:rate5m
            > on(tenant) group_left
            tenant:alert_threshold:clickhouse_queries_rate
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "ClickHouse query rate exceeds threshold"
          summary_zh: "ClickHouse 查詢率超出閾值"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ClickHouse query rate elevated — workload review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：ClickHouse 查詢率升高 — 工作負載審查"
          description: "{{ $value | printf \"%.1f\" }} queries/sec exceeds threshold"
          description_zh: "{{ $value | printf \"%.1f\" }} 次查詢/秒超出閾值"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # --- Active Connections ---
      - alert: ClickHouseHighConnections
        expr: |
          (
            tenant:clickhouse_active_connections:max
            > on(tenant) group_left
            tenant:alert_threshold:clickhouse_active_connections
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "clickhouse_active_connections"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "ClickHouse active connections exceed threshold"
          summary_zh: "ClickHouse 活動連線超出閾值"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ClickHouse connections exceeded — client pool review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：ClickHouse 連線已超出 — client pool 審查"
          description: "{{ $value | printf \"%.0f\" }} active connections"
          description_zh: "{{ $value | printf \"%.0f\" }} 個活動連線"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier (opt-in via clickhouse_active_connections_critical)
      - alert: ClickHouseHighConnectionsCritical
        expr: |
          (
            tenant:clickhouse_active_connections:max
            > on(tenant) group_left
            tenant:alert_threshold:clickhouse_active_connections_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "clickhouse_active_connections"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "ClickHouse active connections exceed critical threshold"
          summary_zh: "ClickHouse 活動連線超出嚴重閾值"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ClickHouse connections at critical level — check headroom to max_connections (new clients are refused past it); cap the offending client pool"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：ClickHouse 連線數達嚴重水位 — 請確認距 max_connections 的餘裕（超過後新客戶端會被拒）；限制造成問題的 client pool"
          description: "{{ $value | printf \"%.0f\" }} active connections (critical threshold exceeded)"
          description_zh: "{{ $value | printf \"%.0f\" }} 個活動連線（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # --- Max Part Count (partition merge pressure) ---
      - alert: ClickHouseHighPartCount
        expr: |
          (
            tenant:clickhouse_max_part_count:max
            > on(tenant) group_left
            tenant:alert_threshold:clickhouse_max_part_count
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 10m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "ClickHouse max part count per partition exceeds threshold (merge pressure)"
          summary_zh: "ClickHouse partition 最大 part 數超出閾值（merge 壓力）"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ClickHouse partition merge pressure — part count review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：ClickHouse partition merge 壓力 — part 數量審查"
          description: "Part count: {{ $value | printf \"%.0f\" }} exceeds threshold"
          description_zh: "Part 數量：{{ $value | printf \"%.0f\" }} 超出閾值"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # --- Replication Queue ---
      - alert: ClickHouseReplicationLag
        expr: |
          (
            tenant:clickhouse_replication_queue:max
            > on(tenant) group_left
            tenant:alert_threshold:clickhouse_replication_queue
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "ClickHouse replication queue size exceeds threshold"
          summary_zh: "ClickHouse 複寫隊列大小超出閾值"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ClickHouse replication queue high — replica health check"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：ClickHouse 複寫隊列過高 — replica 健康檢查"
          description: "Queue size: {{ $value | printf \"%.0f\" }} tasks pending"
          description_zh: "隊列大小：{{ $value | printf \"%.0f\" }} 個待處理任務"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # --- Memory Tracking ---
      - alert: ClickHouseHighMemoryUsage
        expr: |
          (
            tenant:clickhouse_memory_tracking:max
            > on(tenant) group_left
            tenant:alert_threshold:clickhouse_memory_tracking_bytes
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "ClickHouse memory tracking exceeds threshold"
          summary_zh: "ClickHouse 記憶體追蹤超出閾值"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: ClickHouse memory usage high — resource sizing review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：ClickHouse 記憶體使用率過高 — 資源大小調整審查"
          description: "Memory tracked: {{ $value | humanize1024 }}B"
          description_zh: "追蹤的記憶體：{{ $value | humanize1024 }}B"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # --- Failed Queries (fixed threshold, no user override) ---
      - alert: ClickHouseHighFailedQueryRate
        expr: |
          tenant:clickhouse_failed_queries:rate5m > 10
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "ClickHouse failed query rate > 10/s"
          summary_zh: "ClickHouse 查詢失敗率 > 10/秒"
          description: "Failed query rate: {{ $value | printf \"%.1f\" }} queries/sec"
          description_zh: "查詢失敗率：{{ $value | printf \"%.1f\" }} 次查詢/秒"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
