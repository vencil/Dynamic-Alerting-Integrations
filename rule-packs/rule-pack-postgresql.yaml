#
# 對應的 threshold-exporter 閾值（全部內建在讀取端，conf.d 不必列；[chart-default]=平台出貨即啟用，省略就用平台值；未標者沒有平台值，「未啟用」一行寫原因，租戶、子目錄或 profile 給值才發射）:
#   pg_connections: 80   [chart-default]   # % of max_connections — Connection usage % warning
#   pg_replication_lag: 30   [chart-default]   # seconds — Replication lag warning
