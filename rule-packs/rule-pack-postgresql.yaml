#   pg_replication_lag_critical: 60   # seconds — Critical tier replication lag
# <<< GENERATED:threshold-registry:pack-postgresql
#
# Tenant config 範例 (conf.d/db-c.yaml):
#   tenants:
#     db-c:
#       pg_connections: "70"                  # 自訂連線使用率警告閾值 (%)
#       pg_connections_critical: "90"         # Critical 閾值 (%)
#       pg_replication_lag: "20"              # 複寫延遲警告閾值 (秒)
#       pg_replication_lag_critical: "60"     # Critical 閾值 (秒)
# ============================================================
groups:
  # -------------------------------------------------------
  # Normalization: PostgreSQL metrics
  # -------------------------------------------------------
  - name: postgresql-normalization
    interval: 15s
    rules:
      # Connection usage ratio: active connections / max_connections (0-100 %)
      - record: tenant:pg_connection_usage:ratio
        expr: |
          100 * max by(tenant, da_cluster) (pg_stat_activity_count)
          / on(tenant, da_cluster)
          clamp_min(max by(tenant, da_cluster) (pg_settings_max_connections), 1)

      # Replication lag in seconds (max across replicas).
      #   - Two names for one quantity (#4354): postgres_exporter's replication
      #     collector (v0.13.0 on) serves pg_replication_lag_seconds;
      #     pg_replication_lag is what the `pg_replication` entry of its sample
      #     queries.yaml served up to v0.12.1 (--extend.query-path). Both are
      #     EXTRACT(EPOCH FROM now() - pg_last_xact_replay_timestamp()) on a
      #     standby and 0 on a primary — seconds, same help text ("Replication
      #     lag behind master in seconds"). With only the old name, a tenant on
      #     a current exporter had no lag series and the alert never fired.
      #   - One difference, not corrected here: since v0.14.0 the collector
      #     also reads 0 while the standby has replayed everything it received,
      #     so an idle primary no longer looks like growing lag. The old query
      #     did not.
      #   - One exporter serving both names (a current exporter still given the
      #     old queries.yaml): both are read and `max` takes the larger, so
      #     that tenant gets the old query's value, as before #4354. Measured
      #     on v0.21.1: a queries.yaml metric carries `server`, the collector's
      #     does not, and with several DSNs the collector serves the FIRST
      #     server only. `ignoring(server)` would pair the collector's one
      #     series with every server's old one and drop the other servers' lag
      #     — a missed alert, not a louder one. Both cases are pinned (t-both,
      #     t-multi in
      #     tests/rulepacks/rule-pack-postgresql-replication-lag-names_test.yaml).
      - record: tenant:pg_replication_lag:max
        expr: |
          max by(tenant, da_cluster) (
            pg_replication_lag_seconds or pg_replication_lag
          )

      # Deadlocks in the last 5 minutes — a COUNT, not a per-second rate (#4033).
      # Summed over the cluster's databases (pg_stat_database_deadlocks is one
      # counter per datname). A counter that restarts from zero (PostgreSQL
      # restart, pg_stat_reset) adds nothing. A counter that JUMPS to another
      # non-zero value does: Prometheus cannot tell that from deadlocks, so a
      # failover or an exporter re-pointed at a node with its own statistics can
      # raise PostgreSQLHighDeadlocks once, for under 5 minutes.
      - record: tenant:pg_deadlocks:increase5m
        expr: sum by(tenant, da_cluster) (increase(pg_stat_database_deadlocks[5m]))

      # Rollback ratio: rollbacks / total transactions (0 when idle)
      - record: tenant:pg_rollback_ratio:rate5m
        expr: |
          sum by(tenant, da_cluster) (rate(pg_stat_database_xact_rollback[5m]))
          / on(tenant, da_cluster)
          clamp_min(
            sum by(tenant, da_cluster) (rate(pg_stat_database_xact_commit[5m]))
            + sum by(tenant, da_cluster) (rate(pg_stat_database_xact_rollback[5m])),
            1
          )

  # -------------------------------------------------------
  # Threshold normalization: PostgreSQL
  # -------------------------------------------------------
  - name: postgresql-threshold-normalization
    interval: 15s
    rules:
      - record: tenant:alert_threshold:pg_connections
        expr: max by(tenant) (user_threshold{component="pg", metric="connections", severity="warning"})

      - record: tenant:alert_threshold:pg_connections_critical
        expr: max by(tenant) (user_threshold{component="pg", metric="connections", severity="critical"})

      - record: tenant:alert_threshold:pg_replication_lag
        expr: max by(tenant) (user_threshold{component="pg", metric="replication_lag", severity="warning"})

      - record: tenant:alert_threshold:pg_replication_lag_critical
        expr: max by(tenant) (user_threshold{component="pg", metric="replication_lag", severity="critical"})

  # -------------------------------------------------------
  # Alert Rules: PostgreSQL
  # -------------------------------------------------------
  - name: postgresql-alerts
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 15s
        labels:
          severity: critical
          maintenance: page
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "PostgreSQL instance {{ $labels.instance }} is DOWN"
          summary_zh: "PostgreSQL 實例 {{ $labels.instance }} 已關閉"
          description: "pg_up=0 for 15s on {{ $labels.instance }}"
          description_zh: "pg_up=0，持續 15 秒，實例：{{ $labels.instance }}"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      - alert: PostgreSQLHighConnections
        expr: |
          (
            tenant:pg_connection_usage:ratio
            > on(tenant) group_left
            tenant:alert_threshold:pg_connections
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30s
        labels:
          severity: warning
          maintenance: mute
          metric_group: "pg_connections"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "High connection usage on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 連線使用率過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: connection usage high — review max_connections and pool sizing"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：連線使用率過高 — 檢查 max_connections 與連線集區大小設定"
          description: "{{ $value | printf \"%.1f\" }}% of max_connections used (warning threshold exceeded)"
          description_zh: "已使用 {{ $value | printf \"%.1f\" }}% 的 max_connections（超過警告閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier
      - alert: PostgreSQLHighConnectionsCritical
        expr: |
          (
            tenant:pg_connection_usage:ratio
            > on(tenant) group_left
            tenant:alert_threshold:pg_connections_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30s
        labels:
          severity: critical
          maintenance: mute
          metric_group: "pg_connections"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Critical connection usage on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 連線使用率嚴重過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: critical connection saturation — immediate action needed"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：連線飽和 — 需立即採取行動"
          description: "{{ $value | printf \"%.1f\" }}% of max_connections used (critical threshold exceeded)"
          description_zh: "已使用 {{ $value | printf \"%.1f\" }}% 的 max_connections（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: PostgreSQLHighReplicationLag
        expr: |
          (
            tenant:pg_replication_lag:max
            > on(tenant) group_left
            tenant:alert_threshold:pg_replication_lag
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30s
        labels:
          severity: warning
          maintenance: mute
          metric_group: "pg_replication_lag"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "High replication lag on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 複寫延遲過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: replication lag elevated — check replica health"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：複寫延遲升高 — 檢查副本健態"
          description: "{{ $value | printf \"%.1f\" }}s replication lag (warning threshold exceeded)"
          description_zh: "複寫延遲 {{ $value | printf \"%.1f\" }}s（超過警告閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier
      - alert: PostgreSQLHighReplicationLagCritical
        expr: |
          (
            tenant:pg_replication_lag:max
            > on(tenant) group_left
            tenant:alert_threshold:pg_replication_lag_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30s
        labels:
          severity: critical
          maintenance: mute
          metric_group: "pg_replication_lag"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Critical replication lag on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 複寫延遲嚴重"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: critical replication lag — failover risk, escalate"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：複寫延遲嚴重 — 有容錯移轉風險，需升級處理"
          description: "{{ $value | printf \"%.1f\" }}s replication lag (critical threshold exceeded)"
          description_zh: "複寫延遲 {{ $value | printf \"%.1f\" }}s（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # More than 30 deadlocks in the last 5 minutes, per cluster. 30 is an inline
      # constant (no tenant key) — numerically the former 0.1/s × 300 s (#4033).
      # The number compared is Prometheus' extrapolated increase(): a burst that
      # lands inside the window can read about 5% above the raw count at a 15s
      # scrape (300/285; more at longer scrape intervals), so a raw count a few
      # below 30 can already fire. VictoriaMetrics does not extrapolate and
      # compares the raw count (docs/integration/victoriametrics-integration.md §3.1).
      - alert: PostgreSQLHighDeadlocks
        expr: |
          tenant:pg_deadlocks:increase5m > 30
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        # The expr already looks back 5m; `for:` only has to outlast one missed
        # scrape. With a per-second rate and for: 5m a short burst never fired:
        # once it slides out of the window the value is 0, so the condition
        # held ~4m45s at most, never the 5m `for:` asked for (#4033).
        for: 1m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Deadlocks detected on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 偵測到死鎖"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: deadlocks detected — application-level lock contention"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：偵測到死鎖 — 應用層鎖競爭"
          description: "{{ $value | printf \"%.0f\" }} deadlocks in the last 5 minutes"
          description_zh: "過去 5 分鐘 {{ $value | printf \"%.0f\" }} 次死鎖"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # High rollback ratio (> 5% of transactions are rollbacks)
      - alert: PostgreSQLHighRollbackRatio
        expr: |
          tenant:pg_rollback_ratio:rate5m > 0.05
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "High rollback ratio on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 回滾比率過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: high rollback ratio — application error pattern"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}：回滾比率過高 — 應用程式錯誤樣式"
          description: "{{ $value | humanizePercentage }} of transactions are rollbacks"
          description_zh: "{{ $value | humanizePercentage }} 的交易已回滾"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: PostgreSQLRecentRestart
        expr: |
          (time() - pg_postmaster_start_time_seconds) < 300
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 0s
        labels:
          severity: info
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "{{ $labels.instance }} restarted recently"
          summary_zh: "{{ $labels.instance }} 最近已重新啟動"
          description: "PostgreSQL uptime is only {{ $value | printf \"%.0f\" }}s (< 5 min)"
          description_zh: "PostgreSQL 運行時間僅 {{ $value | printf \"%.0f\" }}s（少於 5 分鐘）"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
