groups:
  # -------------------------------------------------------
  # Normalization: RabbitMQ metrics
  # -------------------------------------------------------
  - name: rabbitmq-normalization
    interval: 15s
    rules:
      # Queue depth: maximum messages ready for delivery across all queues
      - record: tenant:rabbitmq_queue_messages:max
        expr: max by(tenant) (rabbitmq_queue_messages_ready)

      # Consumer count: active consumers across all queues
      - record: tenant:rabbitmq_consumers:max
        expr: max by(tenant) (rabbitmq_queue_consumers)

      # Total connections to the broker
      - record: tenant:rabbitmq_connections:max
        expr: max by(tenant) (rabbitmq_connections)

      # Memory usage as percentage of configured limit
      - record: tenant:rabbitmq_node_mem_percent:ratio
        expr: |
          100 * max by(tenant) (rabbitmq_node_mem_used)
          / on(tenant)
          clamp_min(max by(tenant) (rabbitmq_node_mem_limit), 1)

      # Unacknowledged messages (typically indicates consumer slowness)
      - record: tenant:rabbitmq_unacked_messages:max
        expr: max by(tenant) (rabbitmq_queue_messages_unacked)

  # -------------------------------------------------------
  # Threshold normalization: RabbitMQ
  # -------------------------------------------------------
  - name: rabbitmq-threshold-normalization
    interval: 15s
    rules:
      - record: tenant:alert_threshold:rabbitmq_queue_messages
        expr: max by(tenant) (user_threshold{component="rabbitmq", metric="queue_messages", severity="warning"})

      - record: tenant:alert_threshold:rabbitmq_queue_messages_critical
        expr: max by(tenant) (user_threshold{component="rabbitmq", metric="queue_messages", severity="critical"})

      - record: tenant:alert_threshold:rabbitmq_node_mem_percent
        expr: max by(tenant) (user_threshold{component="rabbitmq", metric="node_mem_percent", severity="warning"})

      - record: tenant:alert_threshold:rabbitmq_node_mem_percent_critical
        expr: max by(tenant) (user_threshold{component="rabbitmq", metric="node_mem_percent", severity="critical"})

      - record: tenant:alert_threshold:rabbitmq_connections
        expr: max by(tenant) (user_threshold{component="rabbitmq", metric="connections", severity="warning"})

      - record: tenant:alert_threshold:rabbitmq_consumers
        expr: max by(tenant) (user_threshold{component="rabbitmq", metric="consumers", severity="warning"})

      - record: tenant:alert_threshold:rabbitmq_unacked_messages
        expr: max by(tenant) (user_threshold{component="rabbitmq", metric="unacked_messages", severity="warning"})

  # -------------------------------------------------------
  # Alert Rules: RabbitMQ
  # -------------------------------------------------------
  - name: rabbitmq-alerts
    rules:
      # DEPRECATED (#869): superseded by TenantExporterAbsent in rule-pack-liveness.yaml.
      # GLOBAL absent() → false-negative when one live tenant masks another's outage,
      # and empty `tenant` label. Kept ONE release as a deprecation shim so external
      # matchers on RabbitMQExporterAbsent don't break. Removal: next release.
      - alert: RabbitMQExporterAbsent
        expr: absent(rabbitmq_identity_info{job="tenant-exporters"})
        for: 30s
        labels:
          severity: critical
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "RabbitMQ exporter target missing"
          summary_zh: "RabbitMQ exporter 目標缺失"
          description: "No rabbitmq_identity_info metric found for 30s"
          description_zh: "30 秒內未找到 rabbitmq_identity_info metric"

      - alert: RabbitMQHighQueueDepth
        expr: |
          (
            (
              (
                tenant:rabbitmq_queue_messages:max
                > on(tenant) group_left
                tenant:alert_threshold:rabbitmq_queue_messages
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            * on(tenant) group_left(runbook_url, owner, tier)
              tenant_metadata_info
          )
          or
          (
            (
              (
                tenant:rabbitmq_queue_messages:max
                > on(tenant) group_left
                tenant:alert_threshold:rabbitmq_queue_messages
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            unless on(tenant) tenant_metadata_info
          )
        for: 30s
        labels:
          severity: warning
          metric_group: "rabbitmq_queue_messages"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "High RabbitMQ queue depth on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 RabbitMQ 佇列深度過高"
          platform_summary: "[{{ $labels.tier }}] {{ $labels.tenant }}: queue depth threshold exceeded — consumer capacity review"
          platform_summary_zh: "[{{ $labels.tier }}] {{ $labels.tenant }}: 佇列深度超過閾值 — 請檢查消費者容量"
          description: "Messages ready: {{ $value | printf \"%.0f\" }} (warning threshold exceeded)"
          description_zh: "待發送訊息: {{ $value | printf \"%.0f\" }} (超過警告閾值)"

          runbook_url: "{{ $labels.runbook_url }}"
          owner: "{{ $labels.owner }}"
          tier: "{{ $labels.tier }}"
      # Critical tier
      - alert: RabbitMQHighQueueDepthCritical
        expr: |
          (
            (
              (
                tenant:rabbitmq_queue_messages:max
                > on(tenant) group_left
                tenant:alert_threshold:rabbitmq_queue_messages_critical
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            * on(tenant) group_left(runbook_url, owner, tier)
              tenant_metadata_info
          )
          or
          (
            (
              (
                tenant:rabbitmq_queue_messages:max
                > on(tenant) group_left
                tenant:alert_threshold:rabbitmq_queue_messages_critical
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            unless on(tenant) tenant_metadata_info
          )
        for: 30s
        labels:
          severity: critical
          metric_group: "rabbitmq_queue_messages"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Critical RabbitMQ queue depth on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 RabbitMQ 佇列深度嚴重過高"
          platform_summary: "[{{ $labels.tier }}] {{ $labels.tenant }}: critical queue depth — immediate consumer scaling needed"
          platform_summary_zh: "[{{ $labels.tier }}] {{ $labels.tenant }}: 佇列深度嚴重 — 需要立即擴展消費者"
          description: "Messages ready: {{ $value | printf \"%.0f\" }} (critical threshold exceeded)"
          description_zh: "待發送訊息: {{ $value | printf \"%.0f\" }} (超過嚴重閾值)"

          runbook_url: "{{ $labels.runbook_url }}"
          owner: "{{ $labels.owner }}"
          tier: "{{ $labels.tier }}"
      - alert: RabbitMQHighMemory
        expr: |
          (
            (
              (
                tenant:rabbitmq_node_mem_percent:ratio
                > on(tenant) group_left
                tenant:alert_threshold:rabbitmq_node_mem_percent
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            * on(tenant) group_left(runbook_url, owner, tier)
              tenant_metadata_info
          )
          or
          (
            (
              (
                tenant:rabbitmq_node_mem_percent:ratio
                > on(tenant) group_left
                tenant:alert_threshold:rabbitmq_node_mem_percent
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            unless on(tenant) tenant_metadata_info
          )
        for: 30s
        labels:
          severity: warning
          metric_group: "rabbitmq_node_mem_percent"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "High RabbitMQ memory usage on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 RabbitMQ 記憶體使用率過高"
          platform_summary: "[{{ $labels.tier }}] {{ $labels.tenant }}: RabbitMQ memory usage high — broker sizing review"
          platform_summary_zh: "[{{ $labels.tier }}] {{ $labels.tenant }}: RabbitMQ 記憶體使用率過高 — 請檢查 broker 大小"
          description: "Memory used: {{ $value | printf \"%.1f\" }}% of limit (warning threshold exceeded)"
          description_zh: "已使用記憶體: 限制的 {{ $value | printf \"%.1f\" }}% (超過警告閾值)"

          runbook_url: "{{ $labels.runbook_url }}"
          owner: "{{ $labels.owner }}"
          tier: "{{ $labels.tier }}"
      # Critical tier
      - alert: RabbitMQHighMemoryCritical
        expr: |
          (
            (
              (
                tenant:rabbitmq_node_mem_percent:ratio
                > on(tenant) group_left
                tenant:alert_threshold:rabbitmq_node_mem_percent_critical
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            * on(tenant) group_left(runbook_url, owner, tier)
              tenant_metadata_info
          )
          or
          (
            (
              (
                tenant:rabbitmq_node_mem_percent:ratio
                > on(tenant) group_left
                tenant:alert_threshold:rabbitmq_node_mem_percent_critical
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            unless on(tenant) tenant_metadata_info
          )
        for: 30s
        labels:
          severity: critical
          metric_group: "rabbitmq_node_mem_percent"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Critical RabbitMQ memory usage on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 RabbitMQ 記憶體使用率嚴重過高"
          platform_summary: "[{{ $labels.tier }}] {{ $labels.tenant }}: critical RabbitMQ memory — broker at risk, escalate"
          platform_summary_zh: "[{{ $labels.tier }}] {{ $labels.tenant }}: RabbitMQ 記憶體嚴重 — broker 有風險，請上報"
          description: "Memory used: {{ $value | printf \"%.1f\" }}% of limit (critical threshold exceeded)"
          description_zh: "已使用記憶體: 限制的 {{ $value | printf \"%.1f\" }}% (超過嚴重閾值)"

          runbook_url: "{{ $labels.runbook_url }}"
          owner: "{{ $labels.owner }}"
          tier: "{{ $labels.tier }}"
      - alert: RabbitMQHighConnections
        expr: |
          (
            (
              (
                tenant:rabbitmq_connections:max
                > on(tenant) group_left
                tenant:alert_threshold:rabbitmq_connections
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            * on(tenant) group_left(runbook_url, owner, tier)
              tenant_metadata_info
          )
          or
          (
            (
              (
                tenant:rabbitmq_connections:max
                > on(tenant) group_left
                tenant:alert_threshold:rabbitmq_connections
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            unless on(tenant) tenant_metadata_info
          )
        for: 30s
        labels:
          severity: warning
          metric_group: "rabbitmq_connections"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "High RabbitMQ connection count on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 RabbitMQ 連線數過高"
          platform_summary: "[{{ $labels.tier }}] {{ $labels.tenant }}: RabbitMQ connection count high — client pool review"
          platform_summary_zh: "[{{ $labels.tier }}] {{ $labels.tenant }}: RabbitMQ 連線數過高 — 請檢查客戶端連線池"
          description: "Active connections: {{ $value | printf \"%.0f\" }} (warning threshold exceeded)"
          description_zh: "活躍連線: {{ $value | printf \"%.0f\" }} (超過警告閾值)"

          runbook_url: "{{ $labels.runbook_url }}"
          owner: "{{ $labels.owner }}"
          tier: "{{ $labels.tier }}"
      - alert: RabbitMQLowConsumers
        expr: |
          (
            (
              (
                tenant:rabbitmq_consumers:max
                < on(tenant) group_left
                tenant:alert_threshold:rabbitmq_consumers
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            * on(tenant) group_left(runbook_url, owner, tier)
              tenant_metadata_info
          )
          or
          (
            (
              (
                tenant:rabbitmq_consumers:max
                < on(tenant) group_left
                tenant:alert_threshold:rabbitmq_consumers
              )
              unless on(tenant)
              (user_state_filter{filter="maintenance"} == 1)
            )
            unless on(tenant) tenant_metadata_info
