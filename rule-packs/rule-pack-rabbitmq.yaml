#       rabbitmq_queue_messages: "50000"                  # 自訂佇列深度警告閾值
#       rabbitmq_queue_messages_critical: "200000"        # Critical 閾值
#       rabbitmq_node_mem_percent: "85"                   # 記憶體使用警告閾值 (%)
