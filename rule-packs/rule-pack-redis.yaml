# <<< GENERATED:threshold-registry:pack-redis
#
# Tenant config 範例 (conf.d/redis-prod.yaml):
#   tenants:
#     redis-prod:
#       redis_memory_used_bytes: "6442450944"   # 6 GB
#       redis_connected_clients: "300"
#       # 維度鍵（metric{label="value"}）在本 pack 不依維度判斷：門檻以 max by(tenant) 取租戶最大值，
#       # 維度鍵只會改到整個租戶的門檻、寫 "disable" 只是不送出這一列、不會只停掉那個維度，所以這裡不示範（#3475）。
# ============================================================
groups:
  # -------------------------------------------------------
  # Normalization: Redis metrics
  # -------------------------------------------------------
  - name: redis-normalization
    interval: 15s
    rules:
      # Memory usage (absolute bytes)
      - record: tenant:redis_memory_used_bytes:max
        expr: max by(tenant) (redis_memory_used_bytes)

      # Connected clients
      - record: tenant:redis_connected_clients:max
        expr: max by(tenant) (redis_connected_clients)

      # Key eviction rate
      - record: tenant:redis_evicted_keys:rate5m
        expr: sum by(tenant) (rate(redis_evicted_keys_total[5m]))

      # Keyspace hit ratio
      - record: tenant:redis_keyspace_hit_ratio:avg
        expr: |
          sum by(tenant) (rate(redis_keyspace_hits_total[5m]))
          / (
            sum by(tenant) (rate(redis_keyspace_hits_total[5m]))
            + sum by(tenant) (rate(redis_keyspace_misses_total[5m]))
          )

      # Replication lag (for replicas)
      - record: tenant:redis_replication_lag:max
        expr: max by(tenant) (redis_connected_slave_lag_seconds)

  # -------------------------------------------------------
  # Threshold normalization: Redis
  # -------------------------------------------------------
  - name: redis-threshold-normalization
    interval: 15s
    rules:
      - record: tenant:alert_threshold:redis_memory_used_bytes
        expr: max by(tenant) (user_threshold{component="redis", metric="memory_used_bytes", severity="warning"})

      - record: tenant:alert_threshold:redis_memory_used_bytes_critical
        expr: max by(tenant) (user_threshold{component="redis", metric="memory_used_bytes", severity="critical"})

      - record: tenant:alert_threshold:redis_connected_clients
        expr: max by(tenant) (user_threshold{component="redis", metric="connected_clients", severity="warning"})

      - record: tenant:alert_threshold:redis_connected_clients_critical
        expr: max by(tenant) (user_threshold{component="redis", metric="connected_clients", severity="critical"})

      - record: tenant:alert_threshold:redis_evicted_keys_rate
        expr: max by(tenant) (user_threshold{component="redis", metric="evicted_keys_rate", severity="warning"})

      - record: tenant:alert_threshold:redis_replication_lag
        expr: max by(tenant) (user_threshold{component="redis", metric="replication_lag", severity="warning"})

      - record: tenant:alert_threshold:redis_replication_lag_critical
        expr: max by(tenant) (user_threshold{component="redis", metric="replication_lag", severity="critical"})

  # -------------------------------------------------------
  # Alert Rules: Redis
  # -------------------------------------------------------
  - name: redis-alerts
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 15s
        labels:
          severity: critical
          maintenance: page
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Redis instance {{ $labels.instance }} is DOWN"
          summary_zh: "Redis 實例 {{ $labels.instance }} 已停機"
          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"

      - alert: RedisHighMemory
        expr: |
          (
            tenant:redis_memory_used_bytes:max
            > on(tenant) group_left
            tenant:alert_threshold:redis_memory_used_bytes
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "redis_memory_used_bytes"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Redis high memory usage on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Redis 記憶體使用率過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Redis memory threshold breached — evaluate maxmemory policy"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Redis 記憶體閾值超過 — 請評估 maxmemory 政策"
          description: "Memory usage: {{ $value | humanize1024 }}B"
          description_zh: "記憶體使用量: {{ $value | humanize1024 }}B"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier (opt-in via redis_memory_used_bytes_critical)
      - alert: RedisHighMemoryCritical
        expr: |
          (
            tenant:redis_memory_used_bytes:max
            > on(tenant) group_left
            tenant:alert_threshold:redis_memory_used_bytes_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: critical
          maintenance: mute
          metric_group: "redis_memory_used_bytes"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Redis memory critical on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Redis 記憶體使用量達嚴重水位"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Redis memory at critical level — check headroom to maxmemory (eviction / OOM risk); free memory or raise maxmemory"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: Redis 記憶體達嚴重水位 — 請確認距 maxmemory 的餘裕（有驅逐／OOM 風險）；釋放記憶體或調高 maxmemory"
          description: "Memory usage: {{ $value | humanize1024 }}B (critical threshold exceeded)"
          description_zh: "記憶體使用量: {{ $value | humanize1024 }}B（超過嚴重閾值）"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: RedisHighConnections
        expr: |
          (
            tenant:redis_connected_clients:max
            > on(tenant) group_left
            tenant:alert_threshold:redis_connected_clients
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 5m
        labels:
          severity: warning
          maintenance: mute
          metric_group: "redis_connected_clients"
