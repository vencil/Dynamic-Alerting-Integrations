#   kafka_consumer_lag_critical: 10000   # messages — Consumer lag critical
#   kafka_under_replicated_partitions_critical: 1   # count — Under-replicated critical
# <<< GENERATED:threshold-registry:pack-kafka
#
# Tenant config 範例 (conf.d/messaging-a.yaml):
#   tenants:
#     messaging-a:
#       kafka_consumer_lag: "5000"                        # 自訂消費者延遲警告閾值
#       kafka_consumer_lag_critical: "10000"              # Critical 閾值
#       kafka_under_replicated_partitions: "2"            # 警告：複製不足的 partition 超過 2 個
#       kafka_under_replicated_partitions_critical: "5"   # Critical：複製不足的 partition 超過 5 個
#       kafka_broker_count: "2"                           # 最小代理數警告閾值
# ============================================================
groups:
  # -------------------------------------------------------
  # Normalization: Kafka metrics
  # -------------------------------------------------------
  - name: kafka-normalization
    interval: 15s
    rules:
      # Consumer lag: maximum lag across all consumer groups
      - record: tenant:kafka_consumer_lag:max
        expr: max by(tenant) (kafka_consumergroup_lag_sum)

      # Under-replicated partitions: number of partitions without all in-sync replicas.
      # The source metric is a per-partition 0/1 flag ("1 if Topic/Partition is
      # under Replicated", danielqsj/kafka_exporter), so the count is a SUM over
      # partitions — a max across them is only ever 0 or 1 and never crosses a
      # threshold >= 1 (#3770).
      # Inner max dedups replicas: kafka_exporter reports every partition of the
      # whole cluster from each instance, and tenant-exporters scrapes per pod
      # (#3723), so N exporter replicas yield N series per partition differing
      # only in instance/pod. Summing those directly would count each partition
      # N times. Max (not min) also keeps a partition counted when replicas
      # disagree because their metadata refreshed at different times (1 vs 0).
      # Caveat: a tenant with two Kafka clusters sharing a topic name and
      # partition number is undercounted (the exporter exposes no cluster label).
      # Upstream blind spot: when the exporter's Replicas/ISR lookup for a
      # partition fails it still emits 0 for that partition, so this undercounts.
      - record: tenant:kafka_under_replicated_partitions:sum
        expr: |
          sum by(tenant) (
            max by(tenant, topic, partition) (kafka_topic_partition_under_replicated_partition)
          )

      # Total broker count in cluster
      - record: tenant:kafka_broker_count:max
        expr: max by(tenant) (kafka_brokers)

  # -------------------------------------------------------
  # Threshold normalization: Kafka
  # -------------------------------------------------------
  - name: kafka-threshold-normalization
    interval: 15s
    rules:
      - record: tenant:alert_threshold:kafka_consumer_lag
        expr: max by(tenant) (user_threshold{component="kafka", metric="consumer_lag", severity="warning"})

      - record: tenant:alert_threshold:kafka_consumer_lag_critical
        expr: max by(tenant) (user_threshold{component="kafka", metric="consumer_lag", severity="critical"})

      - record: tenant:alert_threshold:kafka_under_replicated_partitions
        expr: max by(tenant) (user_threshold{component="kafka", metric="under_replicated_partitions", severity="warning"})

      - record: tenant:alert_threshold:kafka_under_replicated_partitions_critical
        expr: max by(tenant) (user_threshold{component="kafka", metric="under_replicated_partitions", severity="critical"})

      - record: tenant:alert_threshold:kafka_broker_count
        expr: max by(tenant) (user_threshold{component="kafka", metric="broker_count", severity="warning"})

  # -------------------------------------------------------
  # Alert Rules: Kafka
  # -------------------------------------------------------
  - name: kafka-alerts
    rules:
      - alert: KafkaHighConsumerLag
        expr: |
          (
            tenant:kafka_consumer_lag:max
            > on(tenant) group_left
            tenant:alert_threshold:kafka_consumer_lag
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30s
        labels:
          severity: warning
          maintenance: mute
          metric_group: "kafka_consumer_lag"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "High Kafka consumer lag on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Kafka 消費者延遲過高"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: consumer lag elevated — consumer capacity review"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: 消費者延遲提升 — 請檢查消費者容量"
          description: "Consumer lag: {{ $value | printf \"%.0f\" }} (warning threshold exceeded)"
          description_zh: "消費者延遲: {{ $value | printf \"%.0f\" }} (超過警告閾值)"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier
      - alert: KafkaHighConsumerLagCritical
        expr: |
          (
            tenant:kafka_consumer_lag:max
            > on(tenant) group_left
            tenant:alert_threshold:kafka_consumer_lag_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30s
        labels:
          severity: critical
          maintenance: mute
          metric_group: "kafka_consumer_lag"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Critical Kafka consumer lag on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Kafka 消費者延遲嚴重"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: critical consumer lag — immediate consumer scaling needed"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: 消費者延遲嚴重 — 需要立即擴展消費者"
          description: "Consumer lag: {{ $value | printf \"%.0f\" }} (critical threshold exceeded)"
          description_zh: "消費者延遲: {{ $value | printf \"%.0f\" }} (超過嚴重閾值)"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: KafkaUnderReplicatedPartitions
        expr: |
          (
            tenant:kafka_under_replicated_partitions:sum
            > on(tenant) group_left
            tenant:alert_threshold:kafka_under_replicated_partitions
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30s
        labels:
          severity: warning
          maintenance: mute
          metric_group: "kafka_under_replicated_partitions"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Under-replicated partitions detected on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 偵測到複製不足的分割區"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: under-replicated partitions — broker health check"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: 複製不足分割區 — 請檢查 broker 健康狀態"
          description: "Under-replicated partitions: {{ $value | printf \"%.0f\" }} (warning threshold exceeded)"
          description_zh: "複製不足的分割區數: {{ $value | printf \"%.0f\" }} (超過警告閾值)"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      # Critical tier
      - alert: KafkaUnderReplicatedPartitionsCritical
        expr: |
          (
            tenant:kafka_under_replicated_partitions:sum
            > on(tenant) group_left
            tenant:alert_threshold:kafka_under_replicated_partitions_critical
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30s
        labels:
          severity: critical
          maintenance: mute
          metric_group: "kafka_under_replicated_partitions"
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Critical under-replicated partitions on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的複製不足分割區情況嚴重"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: critical under-replication — data durability at risk, escalate"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: 複製不足情況嚴重 — 資料耐久性有風險，請上報"
          description: "Under-replicated partitions: {{ $value | printf \"%.0f\" }} (critical threshold exceeded)"
          description_zh: "複製不足的分割區數: {{ $value | printf \"%.0f\" }} (超過嚴重閾值)"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
      - alert: KafkaLowBrokerCount
        expr: |
          (
            tenant:kafka_broker_count:max
            < on(tenant) group_left
            tenant:alert_threshold:kafka_broker_count
          )
          unless on(tenant)
          (user_state_filter{filter="maintenance"} == 1)
        for: 30s
        labels:
          severity: warning
          maintenance: mute
          tenant: "{{ $labels.tenant }}"
        annotations:
          summary: "Low Kafka broker count on {{ $labels.tenant }}"
          summary_zh: "{{ $labels.tenant }} 的 Kafka broker 數量過少"
          platform_summary: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: broker count below minimum — cluster availability at risk"
          platform_summary_zh: "[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: broker 數量低於最小值 — 叢集可用性有風險"
          description: "Active brokers: {{ $value | printf \"%.0f\" }} (below minimum threshold)"
          description_zh: "活躍的 broker: {{ $value | printf \"%.0f\" }} (低於最小閾值)"

          runbook_url: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}"
          owner: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}"
          tier: "{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}"
