# （components/threshold-exporter/app/pkg/config/resolve.go）。
# 而下列每個 key 的 base，出貨的 Helm values 與 repo 的 dev conf.d 範本都沒有供給：
# 租戶在這兩種拓撲下填一個並不會發射任何 user_threshold。
# 要能用，部署面必須先供給 base（scaffold_tenant 針對選到
