# try-local — a one-command showcase of the Dynamic Alerting platform.
#
#   cd try-local && cp .env.example .env && docker compose up -d
#
# What you get (full stack):
#   - da-portal      :8081  live Tenant Manager (2 demo tenants + a saved view)
#   - oauth2-proxy   :8080  the API's front door: /api/ → tenant-api's Unix
#                           socket, every path exempt from login (ADR-027 §3)
#   - tenant-api     :8083  file-based config API (commit-on-write, dev-bypass
#                           auth); the API is only behind oauth2-proxy — this
#                           port answers /health, /ready and /metrics only
#   - generator             the generator container's service: tenant-api asks
#                           it before every write (#2903; built from source)
#   - recipe-preview        would-fire preview (#657), asked by tenant-api over
#                           a shared Unix socket (ADR-027 §5; no port) —
#                           POST :8080/api/v1/tenants/<id>/recipe-preview
#   - prometheus     :9090  /alerts shows the headline critical FIRING
#   - alertmanager   :9093  the firing alert, routed to a null receiver
#   - grafana        :3000  the REAL federation-revocation security dashboard,
#                           fed by a synthetic mock (Act 2 — see README)
#   - threshold-exporter    config-driven user_threshold metrics (internal)
#   - pushgateway    :9091  holds the synthetic DB metric the seed pushed
#
# Mode 0 (core twins) — just the live Tenant Manager, no monitoring:
#   docker compose up da-portal oauth2-proxy tenant-api
# (pulls in only the fast seed-git one-shot and the generator service, which
# tenant-api needs to write; pushgateway/prometheus/etc. stay down)
#
# Ports are overridable via .env (see .env.example). Component image tags are
# per-line (EXPORTER_TAG/TENANT_API_TAG/PORTAL_TAG), default v2.8.0.
name: da-try-local

services:
  # ── Self-built component images (ghcr.io/vencil/*) ───────────────────────
  threshold-exporter:
    image: ghcr.io/vencil/threshold-exporter:${EXPORTER_TAG:-v2.8.0}
    command:
      - "--config-dir=/etc/threshold-exporter/conf.d"
      - "--listen=:8080"
    volumes:
      - ./seed/conf.d:/etc/threshold-exporter/conf.d:ro
    expose:
      - "8080"
    restart: unless-stopped
    # Distroless image (no shell/wget) → no compose healthcheck; Prometheus's
    # scrape success is the effective health signal.

  tenant-api:
    # Built from source. try-local users already clone the repo, so a one-time
    # local build is fine, and it builds for the host's native arch (no arm64
    # wait).
    # ⛔ This comment used to say `--dev-bypass-auth` (#619 / ADR-022) was in no
    # published image and to switch to `v2.9.0` once one shipped. Both halves were
    # wrong by the time anyone read them: the flag ships from tenant-api/v2.9.7
    # onward, and **v2.9.0 was never cut on this line** (it goes v2.8.0 → v2.9.7),
    # so following that instruction gave `manifest unknown` and the stack would
    # not come up. Corrected in #1337 ①.
    # Switching to a published image is therefore now possible — but it changes
    # what the demo RUNS (auth path, arch, first-boot time), so it is deliberately
    # not bundled with a pinning change. Use a real tag if you do it:
    #   image: ghcr.io/vencil/tenant-api:${TENANT_API_TAG:-v2.9.8}
    build:
      context: ..
      dockerfile: components/tenant-api/Dockerfile
    image: da-try-local/tenant-api:source
    # #2885: seeds the demo saved view into the state volume (never over a
    # record already there), then execs tenant-api. Overriding the entrypoint
    # clears the image's CMD; TA_ADDR / TA_CONFIG_DIR below carry the same
    # settings.
    entrypoint: ["/bin/sh", "/seed/state-seed.sh"]
    # #2903: the generator's uid (10001, try-local/generator/Dockerfile) — the
    # generator service answers only a peer of its own uid. seed-git hands
    # the state volume to this uid.
    user: "10001:10001"
    environment:
      TA_CONFIG_DIR: /conf.d
      TA_RBAC_PATH: /conf.d/_rbac.yaml
      TA_WRITE_MODE: direct
      TA_ADDR: ":8080"
      # tenant-api's own records (groups, saved views, federation settings,
      # AccountID registry) live outside the conf.d git tree (#2856). A named
      # volume keeps them across `docker compose down` / `up`.
      TA_STATE_STORE: dir
      TA_STATE_DIR: /state
      # ADR-027 §2: the API is served only on this Unix socket, behind the
      # oauth2-proxy service below (same socket volume); the TCP port answers
      # /health, /ready and /metrics only. tenant-api reads which headers
      # carry identity from the same config file oauth2-proxy runs with.
      TA_HUMAN_SOCKET: /run/ta-human/human.sock
      TA_OAUTH2_PROXY_CONFIG: /etc/oauth2-proxy/oauth2-proxy.yaml
      # LOCAL-DEV-ONLY auth bypass (ADR-022, ADR-027 §3). oauth2-proxy runs
      # with every path exempt from login, so no request carries an identity;
      # the bypass injects the demo identity on the socket plane. Panics if
      # ever run inside Kubernetes; SAST forbids this var in deploy manifests.
      # try-local/ is intentionally NOT scanned by L4.
      TA_DEV_BYPASS_AUTH: "true"
      TA_DEV_BYPASS_EMAIL: dev@local
      TA_DEV_BYPASS_GROUPS: demo-admins
      # commit-on-write runs `git` inside the container against the bind-mounted
      # /conf.d, which git rejects as "dubious ownership" (host uid != container
      # uid). Mark it safe via env-config (git 2.31+; no file mount needed).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      # #2903 (ADR-036 §3): every write that changes conf.d asks the generator
      # service below first; tenant-api refuses to start without its socket.
      TA_GENERATOR_SOCKET: /run/da-generator/generator.sock
      # ADR-027 §5: the recipe-preview service below, on a socket in the
      # shared `preview-sock` volume; asked only after tenant-api authorizes.
      TA_RECIPE_PREVIEW_SOCKET: /run/recipe-preview/preview.sock
    volumes:
      - ./seed/conf.d:/conf.d:rw
      - tenant-api-state:/state
      - generator-sock:/run/da-generator
      - preview-sock:/run/recipe-preview
      # Demo state records + state-seed.sh (#2885). Directory mount, not
      # single-file (the WSL2 single-file bind-mount landmine).
      - ./seed:/seed:ro
      # ADR-027 §2: the oauth2-proxy config (directory mount, not single-file:
      # the WSL2 single-file bind-mount landmine) and the API's socket.
      - ./oauth2-proxy:/etc/oauth2-proxy:ro
      - human-sock:/run/ta-human
    ports:
      # Probes and metrics only (ADR-027 §3: /health, /ready, /metrics; any
      # other path is 404, an identity header is 400). The API is :8080 on
      # the oauth2-proxy service.
      - "127.0.0.1:${EXPOSE_API_PROBE_PORT:-8083}:8080"
    depends_on:
      seed-git:
        condition: service_completed_successfully
      # healthy = the generator's socket answers (the image's HEALTHCHECK);
      # the generator also mounts the socket volume first, so it is created
      # with the generator image's ownership (uid 10001).
      generator:
        condition: service_healthy
    restart: unless-stopped

  oauth2-proxy:
    # ADR-027 §2, §3: the only way to the API. Same image and the same kind of
    # structured config file (--alpha-config) as the tenant-api Helm chart; the
    # file routes /api/ to tenant-api's Unix socket (shared `human-sock`
    # volume). Dev topology: every path is exempt from login, so nothing is
    # authenticated and no identity header is injected (client copies are
    # stripped); tenant-api's dev bypass supplies the demo identity.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    # tenant-api's uid: the socket is 0660, owner tenant-api (uid 10001).
    user: "10001:10001"
    command:
      - --alpha-config=/etc/oauth2-proxy/oauth2-proxy.yaml
      # Every request exempt from login: by source address (all of them),
      # not --skip-auth-route, which oauth2-proxy refuses for a path it finds
      # ambiguous (control character, `;`, `//`) and answers with its sign-in
      # page. Same flags as the contract test (tests/contract/).
      - --trusted-ip=0.0.0.0/0
      - --trusted-ip=::/0
      - --email-domain=*
      # A fixed demo value (32 bytes): no session is ever created.
      - --cookie-secret=try-local-not-a-secret-32-bytes!
      - --cookie-secure=false
    volumes:
      - ./oauth2-proxy:/etc/oauth2-proxy:ro
      - human-sock:/run/ta-human
    ports:
      # Loopback-only: dev-bypass injects an ADMIN identity for every request,
      # so exposing this on 0.0.0.0 would hand anyone on the LAN write/commit
      # access. try-local is local-only by design.
      - "127.0.0.1:${EXPOSE_API_PORT:-8080}:8080"
    depends_on:
      tenant-api:
        condition: service_started
    networks:
      default:
        # The PINNED PUBLISHED portal image (v2.8.0) has a baked-in upstream of
        # this exact FQDN, port 8080 (tenant-api lives in its dedicated
        # `tenant-api` namespace, #1004). ⚠️ A portal image built after ADR-027
        # §5 forwards nothing (components/da-portal/nginx.conf), so bumping
        # PORTAL_TAG past it needs this topology changed first: oauth2-proxy
        # routing "/" to the portal, as the tenant-api chart does — otherwise
        # Tenant Manager silently shows demo data. The alias makes it resolve
        # to THIS proxy inside compose, so the published portal image runs
        # UNCHANGED (no file mount) and reaches the API the only way there is:
        # through oauth2-proxy (ADR-027 §2).
        # The old .monitoring alias is kept ONLY because the pinned PUBLISHED
        # v2.8.0 portal image still bakes the pre-#1004 upstream — nginx dies at
        # startup ("host not found in upstream") without it. Drop it when
        # PORTAL_TAG is bumped to an image built after #1004.
        aliases:
          - tenant-api.tenant-api.svc.cluster.local
          - tenant-api.monitoring.svc.cluster.local
    restart: unless-stopped

  generator:
    # #2903 (ADR-036 §3): the generator container's service. tenant-api asks it
    # before every write that changes conf.d, over a Unix socket on the shared
    # `generator-sock` volume, and refuses to start without it. Built from
    # try-local/generator/Dockerfile (Python + PyYAML, git, da-guard,
    # da-crdecode, da-read, uid 10001 — the runtime the da-tools image gives
    # it; the context is the repo root because those three are built from
    # this checkout's Go, #3530); the
    # service itself is the CHECKOUT's
    # scripts/tools, mounted read-only (tools/v2.9.0 has no generator-service
    # yet). tenant-api runs as the same uid (`user:` there) — the service
    # answers only its own uid. It reads the config repo from git objects
    # only, read-only.
    build:
      context: ..
      dockerfile: try-local/generator/Dockerfile
    image: da-try-local/generator:source
    command:
      - --socket=/run/da-generator/generator.sock
      - --repo=/conf.d
      - --config-subdir=.
      - --work-dir=/tmp/da-generator
    environment:
      # The bind-mounted repo is owned by the host's uid (see tenant-api).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ./seed/conf.d:/conf.d:ro
      - ../scripts/tools:/opt/da-tools:ro
      - generator-sock:/run/da-generator
    depends_on:
      # seed-git turns off git's automatic gc on the repo this reads.
      seed-git:
        condition: service_completed_successfully
    restart: unless-stopped

  da-portal:
    image: ghcr.io/vencil/da-portal:${PORTAL_TAG:-v2.8.0}
    ports:
      # Loopback-only: the portal proxies to tenant-api, so LAN exposure here
      # is the same admin-access risk as exposing tenant-api directly.
      - "127.0.0.1:${EXPOSE_PORTAL_PORT:-8081}:80"
    depends_on:
      # nginx resolves the upstream FQDN at startup with no `resolver`, so the
      # oauth2-proxy container (which owns the alias) MUST be started first or
      # nginx dies with `host not found in upstream`. service_started is enough
      # — Docker DNS registers the alias as soon as the container starts.
      oauth2-proxy:
        condition: service_started
    healthcheck:
      # The published image's baked healthcheck is `wget http://localhost/healthz`,
      # but inside the container `localhost` resolves to ::1 (IPv6) first while
      # nginx listens on IPv4 :80 only → it NEVER goes healthy (the nightly's
      # wait-for-healthy gate then times out). Override with explicit 127.0.0.1.
      # The image-level root fix (Dockerfile HEALTHCHECK → 127.0.0.1) ships in the
      # same PR, but try-local pins the PUBLISHED v2.8.0 image (which still has the
      # bug), so this override stays until a portal image built after that fix is
      # released and PORTAL_TAG is bumped to it.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  recipe-preview:
    # Would-fire preview service (#657). Built from source like tenant-api.
    # ADR-027 §5: no port and no identity — it listens only on a Unix socket
    # in the `preview-sock` volume shared with tenant-api, answers only a
    # peer of its own uid (tenant-api's, 10001), and tenant-api authorizes
    # the caller before it asks. Reach it through the API:
    #   POST :8080/api/v1/tenants/<id>/recipe-preview
    build:
      context: ..
      dockerfile: components/recipe-preview/Dockerfile
    image: da-try-local/recipe-preview:source
    user: "10001:10001"
    environment:
      PREVIEW_SOCKET: /run/recipe-preview/preview.sock
    volumes:
      - preview-sock:/run/recipe-preview
    restart: unless-stopped

  # ── Monitoring stack (official multi-arch images) ────────────────────────
  pushgateway:
    image: prom/pushgateway:v1.11.5
    ports:
      - "127.0.0.1:${EXPOSE_PUSHGATEWAY_PORT:-9091}:9091"
    restart: unless-stopped
    # No shell in the image → no CMD healthcheck. Dependents use
    # service_started; the seed's curl --retry-connrefused covers listen lag.

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=1h"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Rule packs from the repo's single source of truth (mounted read-only).
      - ../rule-packs:/etc/prometheus/rules:ro
    ports:
      - "127.0.0.1:${EXPOSE_PROM_PORT:-9090}:9090"
    depends_on:
      threshold-exporter:
        condition: service_started
      pushgateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.2
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.listen-address=:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${EXPOSE_AM_PORT:-9093}:9093"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grafana:
    # The federation-revocation SECURITY dashboard, live on your laptop. In the
    # DEFAULT stack (not profile-gated) so trial users actually see it — this is
    # "Act 2" after the MariaDB red light (see README). Pinned to the SAME image
    # tag as the k8s Deployment (k8s/03-monitoring/deployment-grafana.yaml) so
    # what you see here matches prod.
    image: grafana/grafana:12.4.14
    environment:
      # Anonymous Admin + no login form: a one-command laptop demo shouldn't ask
      # for a password. Safe ONLY because the port is loopback-only (below); the
      # k8s Deployment uses real admin credentials + oauth. NOT for any exposed
      # deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Land trial users on the demo-notice dashboard FIRST (it frames the data
      # as synthetic before they read the real panels), then they click through
      # to the federation board. Path is inside the mounted provisioning dir.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/trylocal-home.json
    volumes:
      # Provisioning: datasource (Prometheus, isDefault → resolves the SOT
      # dashboard's ${DS_PROMETHEUS} var) + the dashboard file-provider.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      # The demo-notice home dashboard (try-local only).
      - ./grafana/dashboards/trylocal-home.json:/etc/grafana/provisioning/dashboards/trylocal-home.json:ro
      # THE REAL PROD DASHBOARD, bind-mounted READ-ONLY straight from the k8s
      # source of truth — single source, zero drift, and it stays the actual
      # production artifact (we never fork/edit it for the demo; honesty comes
      # from the notice dashboard + datasource name + README, not from touching
      # this JSON).
      - ../k8s/03-monitoring/federation-revocation-dashboard.json:/etc/grafana/provisioning/dashboards/federation-revocation-dashboard.json:ro
    ports:
      # Loopback-only (same posture as the rest of the stack): anonymous Admin is
      # enabled above, so LAN exposure would hand anyone on the network full
      # Grafana admin. Local-only by design.
      - "127.0.0.1:${EXPOSE_GRAFANA_PORT:-3000}:3000"
    depends_on:
      # Grafana's datasource points at the prometheus service; start it first.
      prometheus:
        condition: service_started
    healthcheck:
      # /api/health is Grafana's documented readiness endpoint (same one the k8s
      # readinessProbe uses). The image bundles wget (verified). Retries*interval
      # allows for first-boot plugin/provisioning load.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ── Seed one-shots (run to completion, then exit) ────────────────────────
  seed-git:
    # git-init the config repo so commit-on-write has a repo. No monitoring
    # dependency → Mode 0 stays minimal. Directory mount (not single-file) to
    # avoid the WSL2 single-file bind-mount landmine.
    # Release tag, deliberately WITHOUT a digest (#1337 ①). The deploy surface
    # pins this same image by digest (helm/tenant-api/templates/deployment.yaml
    # and the nightly scan matrix) —
    # ⛔ do not copy that here. Those two are covered by Renovate's
    # managerFilePatterns and move together; `try-local/**` matches none of them,
    # so a digest here would be the one copy nothing ever bumps. Since alpine/git
    # is rebuilt weekly and its CVE remediation is precisely a digest refresh
    # (see .github/workflows/nightly-image-scan.yaml), a frozen digest would keep
    # the demo on a known-vulnerable layer permanently and — unlike a tag — it
    # could not self-heal. The tag being mutable is the lesser evil here; on the
    # deploy surface, where we DO own the bump loop, the trade goes the other way.
    image: alpine/git:v2.54.0
    entrypoint: ["/bin/sh"]
    command: ["/seed/git-init.sh"]
    environment:
      CONF_DIR: /seed/conf.d
      # #2903: tenant-api runs as the generator's uid; the state volume it
      # writes (created owned by the tenant-api image's own user) is handed
      # to that uid here (as root).
      APP_UID: "10001"
      CHOWN_DIRS: /state
    volumes:
      - ./seed:/seed:rw
      - tenant-api-state:/state
    restart: "no"

  seed-metrics:
    # Push the synthetic high-connections metric so the headline critical fires.
    image: curlimages/curl:8.23.0
    entrypoint: ["/bin/sh"]
    command: ["/seed/push-metrics.sh"]
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
    volumes:
      - ./seed:/seed:ro
    depends_on:
      pushgateway:
        condition: service_started
    restart: "no"

  # ── Continuous seed (loops; NOT a one-shot) ──────────────────────────────
  mock-reconciler:
    # Stands in for the federation-revocation reconciler (which needs K8s +
    # VictoriaLogs). Loops every ~15s re-pushing the 6 platform-global metrics
    # with last_reconcile_ts=NOW each iteration. WHY a loop, not a one-shot like
    # seed-metrics: pushgateway does not honor injected timestamps, so a static
    # last_reconcile_ts would make `time()-ts` climb and the Grafana freshness
    # panel flip to a FALSE red "Stale" within ~30m — re-pushing ts=now keeps it
    # a live green sawtooth. (Full rationale in push-federation-metrics.sh.)
    # restart: unless-stopped so the freshness signal survives a pushgateway
    # bounce (re-push repopulates the memory-only gateway).
    image: curlimages/curl:8.23.0
    entrypoint: ["/bin/sh"]
    command: ["/seed/push-federation-metrics.sh"]
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
      PUSH_INTERVAL: "15"
    volumes:
      - ./seed:/seed:ro
    depends_on:
      pushgateway:
        condition: service_started
    restart: unless-stopped

volumes:
  # tenant-api state store (#2856); see the tenant-api service above.
  tenant-api-state:
  # The generator's socket directory (#2903); see the generator service.
  generator-sock:
  # recipe-preview's socket directory (ADR-027 §5), shared with tenant-api;
  # owned by the uid both run as.
  preview-sock:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=10001,gid=10001,mode=0770"
  # The API's Unix socket directory (ADR-027 §2), shared by tenant-api (binds
  # the socket) and oauth2-proxy (dials it). tmpfs like the Helm chart's
  # memory emptyDir, owned by the uid both run as.
  human-sock:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=10001,gid=10001,mode=0770"
