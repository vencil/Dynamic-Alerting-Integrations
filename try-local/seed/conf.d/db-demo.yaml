# db-demo — the headline tenant. The seed one-shot pushes a synthetic
# mysql_global_status_threads_connected{tenant="db-demo"}=200 to pushgateway;
# 200 > the critical threshold (120) below → rule-pack-mariadb's
# MariaDBHighConnectionsCritical fires (severity=critical). This is the red
# light visible in Prometheus :9090/alerts and Alertmanager :9093.
#
# The fire-chain (verified against rule-pack-mariadb.yaml + resolve.go):
#   user_threshold{tenant=db-demo,metric=connections,severity=warning}=50
#   user_threshold{tenant=db-demo,metric=connections,severity=critical}=120
#   tenant_metadata_info{tenant=db-demo,...}=1   (from _metadata, group_left join)
tenants:
  db-demo:
    mysql_connections: "50"            # warning threshold
    mysql_connections_critical: "120"  # critical threshold → headline alert
    # Running-threads saturation warning (gauge: concurrent threads executing, a
    # USE-method proxy — NOT host CPU%). Dormant by design: push-metrics.sh seeds no
    # mysql_global_status_threads_running, so MariaDBHighThreadsRunning stays quiet and the
    # single connections-critical red light remains the headline. 40 against the platform
    # default of 30 (_defaults.yaml, #944 calibration) = a tenant that tolerates more
    # concurrency than the baseline — an override that LOOSENS. Note that
    # GET /api/v1/tenants/db-demo/effective returns only the MERGED result (40) plus the
    # defaults_chain file list: the 30 it overrode is not in the response (EffectiveConfig
    # keeps MergedDefaults `json:"-"`), so the inheritance is readable in these files,
    # not in the API payload.
    mysql_threads_running: "40"
    _metadata:
      owner: "platform-db-team"
      tier: "tier-1"
      runbook_url: "https://runbooks.demo.local/mysql-high-connections"
      environment: "production"
      domain: "ecommerce"
      db_type: "mariadb"
    # Minimal tenant routing (#2315), so this seed is also a routing fixture:
    # validate.yaml runs `generate_alertmanager_routes.py --validate --strict
    # --policy .github/custom-rule-policy.yaml` over this tree, and without a
    # `_routing` block that gate would check zero routes here.
    # ⚠️ The try-local Alertmanager does NOT load generated routes — it runs
    # the static try-local/alertmanager.yml (receiver 'null', nothing sent),
    # so this URL is never dialled. It is an RFC 2606 `example.com` host on
    # purpose: that CI gate's policy allowlist is `*.example.com` + the named
    # SaaS hosts, and an in-stack address (`http://alertmanager:9093/`) is
    # refused by it as "not in allowed_domains".
    _routing:
      receiver:
        type: webhook
        url: "https://hooks.example.com/try-local/db-demo"
