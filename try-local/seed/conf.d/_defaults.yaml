# Platform default thresholds (try-local seed).
#
# No threshold of the rule packs is listed here (#3924): every one is built
# into the readers (threshold-registry; #3832, #4163). A key the platform ships
# armed serves the platform's value to every tenant that writes none
# (mysql_connection_usage_percent 80, mysql_replication_lag 30 for the mariadb
# pack loaded in this demo); every other key has no platform value — only the
# deployment can calibrate it — and is served once a tenant writes it
# (db-demo.yaml sets mysql_threads_running, cache-demo.yaml
# redis_connected_clients). A `<key>_critical` in a tenant file is served the
# same way (db-demo.yaml's mysql_connection_usage_percent_critical drives the
# headline critical alert).
#
# Which keys there are, the platform's values, and how many tenants set each:
#   da-tools validate-config --config-dir try-local/seed/conf.d  (platform_defaults)
# Tenant overrides are strings ("70", "70:critical", "disable").

# dimensions 為生成段（#3475，ADR-038 §11）：每個 base 的維度鍵可帶哪些 label 才會送出。
# 出貨清單 = threshold registry 宣告、且 rule pack 依該 label 聚合的組合；自訂規則若依某個
# 維度讀，就在這裡加上 base 與 label。改出貨內容走 scaffold_tenant.RULE_PACKS ＋ --regen。
dimensions:
  # >>> GENERATED:threshold-registry:try-local-dimensions — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
  container_cpu: [version]
  container_memory: [version]
  # <<< GENERATED:threshold-registry:try-local-dimensions
