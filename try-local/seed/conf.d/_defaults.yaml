# Platform default thresholds (try-local seed).
#
# A key listed under `defaults:` below is emitted as a `user_threshold` series
# for EVERY tenant (resolveBaseRows iterates `defaults`), and a tenant override
# replaces that value — so every demo threshold key that needs a platform value
# must be listed there. Values are numbers (float64), tenant overrides are
# strings ("70", "70:critical", "disable").
#
# ⚠️ "absent from `defaults:` ⇒ silently ignored" was true until #1310 and is
# what this comment used to say; it is now FALSE for the `optional_overrides:`
# block 50 lines below (#1321). Those 9 keys carry no platform value, but a
# tenant CAN set them and `resolveDeclaredRows` emits the row — the third state.
# Absent from BOTH blocks is still ignored.
#
# SUPPLY CONTRACT: every WARNING-tier key the packs in prometheus.yml
# `rule_files` demand must be listed below — rule-pack-mariadb reads
# mysql_connections / mysql_threads_running / mysql_replication_lag via
# tenant:alert_threshold:*. A demanded key missing here leaves its alert
# loaded but unable to fire even with data present (#1200's empty-set silence).
# The `_critical` tier canNOT be supplied here: resolveCriticalRows scans
# TENANT OVERRIDES only (app/pkg/config/resolve.go), so a `<key>_critical` line
# in defaults falls through to the base resolver and emits a junk
# user_threshold{metric="<key>_critical", severity="warning"} that no recording
# rule reads. Critical tiers belong in a tenant file (see db-demo.yaml's
# mysql_connections_critical) — which is why this pack's *Critical alerts have
# no supply in the demo.
# The mysql_* values mirror the platform defaults (operating SoT:
# scripts/tools/ops/scaffold_tenant.py RULE_PACKS → the gated extract
# rule-packs/threshold-registry.yaml; hand-maintained copies: helm values,
# components/threshold-exporter/config/conf.d/, environments/*). No gate
# compares THIS copy's values against those — guard-defaults-impact.yml does
# trigger on `**/_defaults.yaml`, but it checks blast radius, not cross-copy
# drift — so a recalibration has to land here by hand (#944 missed this file).
defaults:
  mysql_connections: 80      # db-demo overrides → drives the headline critical alert
  mysql_threads_running: 30      # running-thread SATURATION warning (threads_running, NOT host CPU%); 80→30 = PMM/Nichter "high" tier (#944); renamed from mysql_cpu (#1231)
  mysql_replication_lag: 30  # async replication lag warning (seconds behind primary, sql_delay-adjusted); quiet here — the seed pushes no mysql_slave_status_* series (#1200 WS5-P0-a)
  redis_connected_clients: 8000  # cache-demo (sentinel/dedup concept demo). DEMO-ONLY value — the platform default is 200 (threshold-registry.yaml); no redis pack is loaded here anyway

# DECLARED-WITHOUT-VALUE keys (#1310). Key NAMES only — the platform recognises
# them and asserts no number; a tenant sets one in its own file and
# resolveDeclaredRows emits it, otherwise nothing happens. NOT a candidate list
# for `defaults:` above: moving one up there arms a platform-chosen number for
# every tenant, the opposite of what this section means.
#
# Why it is here at all: try-local is the ONE topology where threshold-exporter
# and tenant-api share a single conf.d, so it is the cheapest place to prove the
# declared key end-to-end (Portal Save → tenant-api write validation → exporter
# emission) without a cluster. The packs loaded by this demo are mariadb/redis,
# so none of these fire here — they are present so the write path can be
# exercised, and so this file matches the shape the shipping artifacts have.
#
# SOURCE: rule-packs/threshold-registry.yaml, the `tier: optional_overrides`
# keys that are NOT `<base>_critical`. This block is now GENERATED from it by
# `check_threshold_registry.py --regen`, exactly like the two shipped copies
# (helm/threshold-exporter/values.yaml `thresholdConfig.optional_overrides` and
# components/threshold-exporter/config/conf.d/_defaults.yaml).
#
# ⛔ It used to be hand-maintained with a documented "if those diverge, THEY are
# right and this copy needs a hand edit" step. The gate on it
# (tests/ops/test_generate_alertmanager_routes.py::TestShippedDeclaredListIsSettable)
# compares the PARSED list — so it never saw anything comment-shaped, and when
# the shipped copies gained the per-key measured-counter-example caveat (#1176)
# this seed became the one conf.d in the repo without it, with nothing turning
# red. Generating it deletes the manual step rather than documenting it better.
# The `defaults:` values above still have no such gate — that caveat stands.
optional_overrides:
  # >>> GENERATED:threshold-registry:try-local-optional — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
  # ── oracle：Oracle Database (oracledb_exporter) ──
  - oracle_wait_time_rate   # s/s — Wait time rate (5m)
  - oracle_process_count   # count — Active processes warning
    # ⚠ 參考庫實測反例（#1176）：例行備份批次會到 560 個 process —— 此值會對正常運作誤警；這個數字是起點，不是平台背書的值
  - oracle_pga_allocated_bytes   # bytes (4GB) — PGA allocation warning
    # ⚠ 參考庫實測反例（#1176）：計畫性 stats-gather 會用到 22 GB PGA —— 此值會對正常運作誤警；這個數字是起點，不是平台背書的值
  # ── db2：IBM DB2 (ibm_db2_exporter) ──
  - db2_log_usage_percent   # % — Transaction log usage warning
  - db2_deadlock_rate   # count/s — Deadlock rate (5m)
    # ⚠ 參考庫實測反例（#1176）：真實的 ~90/min deadlock storm 低於 5/s（＝300/min），因此接不到 ——
    # 此值接不到該抓的故障；這個數字是起點，不是平台背書的值
  - db2_tablespace_used_percent   # % — Tablespace usage warning
  # ── clickhouse：ClickHouse (built-in /metrics) ──
  - clickhouse_max_part_count   # count — Max part count per partition
  - clickhouse_replication_queue   # count — Replication queue size
  - clickhouse_memory_tracking_bytes   # bytes (8GB) — Memory tracking warning
  # <<< GENERATED:threshold-registry:try-local-optional
