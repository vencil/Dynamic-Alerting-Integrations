# RBAC for the try-local demo (group → tenants → permissions).
#
# There is no login here: tenant-api's local-dev auth bypass hands it an
# identity whose groups come from TA_DEV_BYPASS_GROUPS in
# try-local/docker-compose.yaml (ADR-027 §3). Group names match by exact
# string, so every group listed there needs a rule below that makes it a
# platform admin — tenants:["*"] (the literal "*"), admin, and no
# org-scope / environments / domains. Without it the Tenant Manager lists
# nothing and the platform-level portal views are refused.
#
# tests/ops/test_trylocal_rbac_bypass_groups.py holds the two files together;
# rename a group in one and that test names the other.
#
# The wildcard also makes GET /api/v1/tenants list BOTH seed tenants, which is
# what the portal Tenant Manager renders. (Note: /api/v1/me therefore reports
# accessible_tenants:["*"] — see try-local/README.md.)
groups:
  - name: demo-admins
    tenants: ["*"]
    permissions: [read, write, admin]
