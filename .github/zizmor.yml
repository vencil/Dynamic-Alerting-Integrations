# zizmor (#3756 ③c, owner 2026-11-28): three audits on, every other one off.
#
# On: excessive-permissions, overprovisioned-secrets, secrets-inherit — the
# whole repository was brought to zero findings for these when the hook was
# added, so there is no baseline and no ignore list.
#
# Off: every other audit zizmor 1.32.0 has (read off the pinned binary: each
# finding's documentation link names its audit). They stay off by decision,
# not by oversight — `unpinned-uses` alone reports 252 findings and is its own
# question (#4327).
#
# ⚠️ zizmor accepts a rule name it does not know without a word. A wrong or
# stale name below therefore turns nothing off silently: the audit it meant
# keeps running, and its findings make the hook red — loud, the safe way. A
# zizmor upgrade that adds an audit enables it the same way, in the upgrade's
# own PR. Pinned in .pre-commit-config.yaml (zizmorcore/zizmor-pre-commit).
rules:
  adhoc-packages:
    disable: true
  anonymous-definition:
    disable: true
  archived-uses:
    disable: true
  artipacked:
    disable: true
  bot-conditions:
    disable: true
  cache-poisoning:
    disable: true
  concurrency-limits:
    disable: true
  dangerous-triggers:
    disable: true
  dependabot-cooldown:
    disable: true
  dependabot-execution:
    disable: true
  forbidden-uses:
    disable: true
  github-app:
    disable: true
  github-env:
    disable: true
  hardcoded-container-credentials:
    disable: true
  impostor-commit:
    disable: true
  insecure-commands:
    disable: true
  insecure-url-scheme:
    disable: true
  known-vulnerable-actions:
    disable: true
  misfeature:
    disable: true
  obfuscation:
    disable: true
  ref-confusion:
    disable: true
  ref-version-mismatch:
    disable: true
  secrets-outside-env:
    disable: true
  self-hosted-runner:
    disable: true
  self-repository:
    disable: true
  stale-action-refs:
    disable: true
  superfluous-actions:
    disable: true
  template-injection:
    disable: true
  typosquat-uses:
    disable: true
  undocumented-permissions:
    disable: true
  unpinned-images:
    disable: true
  unpinned-tools:
    disable: true
  unpinned-uses:
    disable: true
  unredacted-secrets:
    disable: true
  unsound-condition:
    disable: true
  unsound-contains:
    disable: true
  unsound-ternary:
    disable: true
  use-trusted-publishing:
    disable: true
