name: Playwright E2E Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      # TRK-242: portal source moved to tools/portal/src/. Watch the
      # whole portal package (source + build config + manifest) so any
      # change that affects bundle output triggers smoke. Also watch
      # docs/interactive/index.html which is the runtime entry loader,
      # plus what CI actually serves and executes: the committed dist
      # bundles and the jsx-loader page itself (a dist-only rebuild
      # used to merge without ever running smoke).
      - 'tools/portal/**'
      - 'docs/interactive/index.html'
      - 'docs/assets/dist/**'
      - 'docs/assets/jsx-loader.html'
      - 'tests/e2e/**'
      - 'package.json'
      - '.github/workflows/playwright.yml'
      # The A-13 lint runner below. Without this entry, a pull request that
      # ONLY edits the runner does not start this workflow, so the one CI leg
      # that executes it never runs — and the local hook would be running the
      # edited copy against itself. #1428.
      - 'scripts/tools/lint/e2e_spec_lint.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/portal/**'
      - 'docs/interactive/index.html'
      - 'docs/assets/dist/**'
      - 'docs/assets/jsx-loader.html'
      - 'tests/e2e/**'
      - 'package.json'
      - '.github/workflows/playwright.yml'
      # The A-13 lint runner below. Without this entry, a pull request that
      # ONLY edits the runner does not start this workflow, so the one CI leg
      # that executes it never runs — and the local hook would be running the
      # edited copy against itself. #1428.
      - 'scripts/tools/lint/e2e_spec_lint.sh'

permissions:
  contents: read
  pull-requests: write

jobs:
  # A-13: no `test.skip()` / `test.fixme()` in E2E specs, in any spelling —
  # the rule does not distinguish them. Until #1428 this
  # rule had exactly one execution point — the `playwright-lint` pre-commit
  # hook — and that hook cannot run inside a `git worktree`, which is how this
  # repo is normally worked: tests/e2e/node_modules is gitignored, so a new work
  # tree starts without it and never fixes itself. A repo-wide grep of
  # .github/workflows/ for `eslint` returned nothing, so the server side caught
  # none of it.
  #
  # ⛔ A SEPARATE JOB, not a step inside "Smoke Tests (Chromium)". As a step it
  # was measurably worse than nothing: GitHub stops a job at the first failing
  # step, so one parked spec would have skipped the browser install, the portal
  # server and the whole smoke run — and since this workflow is not a required
  # check, that would trade "E2E ran and passed" for "E2E never ran" while
  # still not blocking the merge. The report-upload and PR-comment steps carry
  # `if: always()`, so they would have run and found no report, leaving the pull
  # request with no visible signal at all.
  #
  # ⚠️ ADVISORY, not blocking. Neither this job nor "Smoke Tests (Chromium)" is
  # among main's required status checks (measured 2026-08-14 against the
  # branch-protection API: 19 contexts, neither name is one of them), so a red
  # here does not stop a merge. Adding a name to branch protection is NOT the
  # fix on its own: this workflow is suppressed wholesale by a top-level
  # `paths:` filter, and GitHub treats a required check that reports no status
  # as permanently pending — the trap validate.yaml's banner describes. The
  # repo's shape for a blocking leg is a ci.yml job plus an `if: always()`
  # aggregation gate (see "Portal Tests"). Tracked in #1428.
  lint-specs:
    name: E2E Spec Lint (A-13)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # No `lfs: true` here on purpose: the LFS payload is the visual
          # regression baselines, which eslint never reads. Only the smoke job
          # needs them.

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tests/e2e/package-lock.json'

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      # No `working-directory`: the script derives the repo root from its own
      # location, which is what lets the pre-commit hook and `make lint-e2e`
      # run the very same file from wherever they happen to be invoked.
      - name: Lint E2E specs (A-13 fixme/skip guard)
        run: bash scripts/tools/lint/e2e_spec_lint.sh

  test:
    name: Smoke Tests (Chromium)
    runs-on: ubuntu-latest
    # TRK-233: 10-min cap restored. The TRK-232e investigation traced
    # the workers=N failures to a stale TRK-231 build hack — `define:
    # { React: 'globalThis.__bundledReact' }` paired with a side-
    # effect entry import. The destructure pattern `const { useState }
    # = React;` in 11 component files (rewritten to read the global)
    # raced against the chunk that set the global, causing ~20 specs
    # to fail under workers=N>1.
    #
    # Real fix in this commit: components use explicit ESM React
    # imports (`import { useState } from 'react'`); the build-time
    # alias is gone. Local benchmarks at workers=4 + ThreadingHTTP-
    # Server: 192 / 192 pass in 1.5 min (vs ~12 min broken state /
    # 5.2 min workers=1 / 3.5 min workers=2). 10-min cap is now
    # generous (~6x headroom).
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # LFS-tracked visual regression baselines under
          # tests/e2e/*-snapshots/ must be materialized for Playwright
          # toHaveScreenshot() to compare against. Without this, checkout
          # leaves 130-byte pointer files on disk and Playwright sees the
          # LFS metadata instead of the baseline PNG.
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          # Keyed on the LOCKFILE, not package.json. `npm ci` installs exactly
          # what the lockfile pins, so a lockfile-only change (a security bump
          # inside an existing range) must invalidate the cache — keyed on
          # package.json it would not, and the job would keep restoring the
          # pre-bump tree. Matches ci.yml's portal job, which already keys on
          # tools/portal/package-lock.json.
          cache-dependency-path: 'tests/e2e/package-lock.json'

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      # Cache Playwright browser binaries (~150 MB chromium download).
      # `npx playwright install` is idempotent: re-running with cache hit
      # is a fast no-op. Key includes the playwright version derived from
      # tests/e2e/package-lock.json so cache invalidates on bump.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install chromium

      - name: Start Portal server
        working-directory: tests/e2e
        run: |
          npm run serve:portal &
          SERVER_PID=$!
          echo "Portal server started with PID: $SERVER_PID"

          # Retry loop: wait up to 30 seconds for Portal readiness
          RETRY_COUNT=0
          MAX_RETRIES=30
          RETRY_INTERVAL=1

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Checking Portal readiness (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)..."
            if curl -sf http://localhost:8080/interactive/ > /dev/null 2>&1; then
              echo "✓ Portal is ready (HTTP 200)"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep $RETRY_INTERVAL
            fi
          done

          echo "✗ Portal failed to start within 30 seconds"
          echo "Final curl attempt for debug info:"
          curl -v http://localhost:8080/interactive/ 2>&1 || true
          exit 1
        timeout-minutes: 2

      - name: Run Playwright smoke tests
        working-directory: tests/e2e
        # TRK-233 perf settings:
        #   --workers=4    parallelize across 4 playwright workers.
        #                  ubuntu-latest runners have 4 vCPUs; the portal
        #                  server is multi-threaded (serve_threaded.py)
        #                  so concurrent JSX fetches don't bottleneck.
        #                  Local benchmark: workers=1 = 5.2 min, workers=2
        #                  = 3.5 min (1 flaky retry-pass), workers=4 =
        #                  1.5 min (192 / 192 clean). 4 wins on both axes.
        #   --reporter=list,html  swap dots-only progress for inline test
        #                  names so CI failures are tagged with the spec
        #                  immediately; keep html for artifact upload.
        run: npm test -- --workers=4 --reporter=list,html
        env:
          CI: 'true'
          BASE_URL: 'http://localhost:8080/interactive/'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload test videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-videos
          path: tests/e2e/test-results/
          retention-days: 3

      - name: Comment on PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const testReportPath = 'tests/e2e/playwright-report/index.html';
            if (fs.existsSync(testReportPath)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ Playwright smoke tests completed. [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
              });
            }
