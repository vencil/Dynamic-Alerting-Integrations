name: Playwright E2E Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      # Only the A-13 spec lint runs here now; the smoke run moved to
      # ci.yml (#1428), where it runs on every PR.
      # These paths are the ones that can change what the lint reads or
      # how it runs.
      - 'tools/portal/**'
      - 'docs/interactive/index.html'
      - 'docs/assets/jsx-loader.html'
      - 'tests/e2e/**'
      - '.github/workflows/playwright.yml'
      # The A-13 lint runner below. Without this entry, a pull request that
      # ONLY edits the runner does not start this workflow, so the one CI leg
      # that executes it never runs — and the local hook would be running the
      # edited copy against itself. #1428.
      - 'scripts/tools/lint/e2e_spec_lint.sh'
      # The behavioural test the lint-specs job runs (#1446): a PR that only
      # edits it must still run it, or a broken edit lands unexecuted.
      - 'tests/lint/test_e2e_spec_lint_behaviour.py'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/portal/**'
      - 'docs/interactive/index.html'
      - 'docs/assets/jsx-loader.html'
      - 'tests/e2e/**'
      - '.github/workflows/playwright.yml'
      # The A-13 lint runner below. Without this entry, a pull request that
      # ONLY edits the runner does not start this workflow, so the one CI leg
      # that executes it never runs — and the local hook would be running the
      # edited copy against itself. #1428.
      - 'scripts/tools/lint/e2e_spec_lint.sh'
      # The behavioural test the lint-specs job runs (#1446): a PR that only
      # edits it must still run it, or a broken edit lands unexecuted.
      - 'tests/lint/test_e2e_spec_lint_behaviour.py'

# The smoke run's PR comment (the only write) moved to ci.yml with it (#1428).
permissions:
  contents: read

jobs:
  # A-13: no `test.skip()` / `test.fixme()` in E2E specs, in any spelling —
  # the rule does not distinguish them. Until #1428 this
  # rule had exactly one execution point — the `playwright-lint` pre-commit
  # hook — and that hook cannot run inside a `git worktree`, which is how this
  # repo is normally worked: tests/e2e/node_modules is gitignored, so a new work
  # tree starts without it and never fixes itself. A repo-wide grep of
  # .github/workflows/ for `eslint` returned nothing, so the server side caught
  # none of it.
  #
  # ⛔ A SEPARATE JOB from the smoke run, not a step inside it: GitHub stops a
  # job at the first failing step, so one parked spec would have skipped the
  # browser install, the portal server and the whole smoke run.
  #
  # The smoke run itself is no longer here (#1428). It is ci.yml's
  # `smoke-tests-run`, behind the `Smoke Tests (Chromium)` aggregate gate
  # that branch protection requires: this workflow's top-level `paths:`
  # filter suppressed it wholesale on a PR touching no portal file, and a
  # required check that reports no status sits permanently pending. This job
  # stays advisory (`advisory:` in .github/required-checks.yaml, which says
  # why) and path-filtered.
  lint-specs:
    name: E2E Spec Lint (A-13)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # No `lfs: true` here on purpose: the LFS payload is the visual
          # regression baselines, which eslint never reads. Only ci.yml's
          # smoke-tests-run needs them.

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'tests/e2e/package-lock.json'

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      # No `working-directory`: the script derives the repo root from its own
      # location, which is what lets the pre-commit hook and `make lint-e2e`
      # run the very same file from wherever they happen to be invoked.
      - name: Lint E2E specs (A-13 fixme/skip guard)
        run: bash scripts/tools/lint/e2e_spec_lint.sh

      # #1446: the step above proves today's specs are clean; it cannot prove
      # the chain would still CATCH a parked one. This runs the real script
      # against a throwaway tree holding a byte-for-byte copy of tests/e2e plus
      # an injected `test.fixme()`, and requires a red. It needs the
      # node_modules installed above, and without it the module skips — so
      # VIBE_REQUIRE_E2E_ESLINT=1 makes that skip a failure here, the one place
      # the install is guaranteed. tests/lint/test_e2e_spec_lint.py (Python
      # Tests, every PR) pins this step's existence, its variable and its
      # order after `npm ci`.
      - name: Setup Python (A-13 behavioural test)
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: A-13 chain catches a parked spec (behavioural test)
        env:
          VIBE_REQUIRE_E2E_ESLINT: "1"
          # No test here runs a Go binary; without this tests/conftest.py builds
          # da-guard, da-crdecode and da-read on the cold Go cache first —
          # minutes, past this job's timeout (test_e2e_spec_lint.py pins it).
          VIBE_TEST_GO_BINARIES: skip
        run: |
          pip install pytest pyyaml -c requirements/ci-constraints.txt
          python -m pytest tests/lint/test_e2e_spec_lint_behaviour.py -q -rs
