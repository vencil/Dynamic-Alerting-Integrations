name: Secret Scan (L2 server-side)

# L2 of the L0/L1/L2/L3 secret-scan multi-layer (#445 AC ii).
#
#   L0  GitHub native push-protection           (#470, repo setting)
#   L1  pre-commit hook, local, bypassable       (#445 AC i, secrets-scan-staged)
#   L2  THIS — server-side, unbypassable         (#445 AC ii)
#   L3  release-time image digest verification   (#445 AC iii)
#
# L1 can be skipped with `git commit --no-verify`; L2 cannot — it runs on
# GitHub's infrastructure on every PR and nightly, regardless of any
# contributor's local tooling.
#
# Two scan modes:
#   - pull_request → diff-only scan (commits in base..head), BOUNDED TO THE
#     PR HEAD via --branch. Target ≤ 1 min. The bound is load-bearing, not
#     an optimisation: see the --branch comment in that step (#1364).
#   - schedule (nightly 02:00 UTC) / workflow_dispatch → full git-history
#     scan, deliberately unbounded across refs.
#
# Detector scope is NOT the default set: TRUFFLEHOG_EXCLUDE_DETECTORS below
# names the detectors switched off repo-wide, each with its evidence and an
# exit condition. tests/ops/test_secret_scan_gate.py holds that list to a
# registry and re-derives, from the tree, that the project really does not
# use the excluded provider.
#
# Verified/unverified policy is owned by scripts/tools/lint/trufflehog_to_sarif.py
# (trufflehog has no native SARIF output; the converter also classifies):
#   - VERIFIED finding (credential confirmed live) → SARIF `error` + the
#     converter exits 1 → this workflow fails → PR merge blocked / nightly
#     emails the maintainer. Triggers the SOP (rotate first).
#   - unverified/unknown finding → SARIF `warning`, converter exits 0 →
#     surfaced in Code Scanning, does NOT block.
#
# Forked-PR handling: a PR from a fork gets a read-only GITHUB_TOKEN and
# CANNOT write security-events. The diff scan still RUNS; the SARIF is
# uploaded as a plain artifact instead of to Code Scanning. The nightly
# full scan (which runs on the main repo with a write token) backfills the
# Security tab. We deliberately do NOT use `pull_request_target` — that
# would run fork-authored code with a privileged token (RCE-to-secrets).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # 02:00 UTC daily — full git-history scan.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

# Explicit, least-privilege. NOT inherited from repo defaults.
permissions:
  contents: read            # checkout
  security-events: write    # upload-sarif → Code Scanning
  pull-requests: read       # read PR base/head metadata

concurrency:
  # Supersede stale PR runs when a new commit lands (avoids the Ghost-Green
  # race where an older run's result attaches to a newer commit). Each
  # scheduled run has a distinct ref so they don't cancel each other.
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned trufflehog version — verified real (CLI release v3.95.3).
  TRUFFLEHOG_VERSION: "3.95.3"
  # trufflehog's `git` mode does an INTERNAL `git clone` of the repo.
  # This repo uses Git LFS for visual-regression PNG snapshots; the
  # clone's checkout invokes the LFS smudge filter, which fails when an
  # LFS object is missing from remote storage ("remote missing object"
  # → smudge filter failed → checkout aborts → whole scan dies).
  # Secret scanning never needs PNG binary content — skip LFS smudge so
  # trufflehog's clone checks out LFS *pointer* files (tiny text) and
  # proceeds. Inherited by trufflehog's `git clone` subprocess.
  GIT_LFS_SKIP_SMUDGE: "1"
  # Detectors switched OFF for BOTH scan modes. Keep this list TINY: every
  # entry is a class of real leak this gate permanently stops seeing, and
  # a scan-layer exclusion is only defensible for a provider this project
  # does not integrate with. tests/ops/test_secret_scan_gate.py re-derives
  # that premise from the tree on every run, so an entry cannot outlive it.
  #
  # Lob (#1364) — the detector matches
  #   `(?i:lob)(?:.|[\n\r]){0,40}?\b([a-zA-Z0-9_]{40})\b`
  # i.e. ANY 40-character identifier sitting within 40 characters of the
  # letters "lob" — which occur inside ordinary words like `global` and
  # `blob`. It then marks the hit live on any 2xx from
  # api.lob.com/v1/addresses.
  #
  # OBSERVED (Code Scanning's open TruffleHog alerts, 2026-08-08): 277
  # alerts — 242 Lob, ALL at `error`, i.e. all Verified; 32 Gitlab + 3 URI,
  # all `warning`, none verified. Every Lob hit inspected is a Python
  # test-function name or a Prometheus metric name. Whether the endpoint
  # accepts them or the check is degenerate some other way is not
  # established here; what IS established is that a 100%-verified rate on
  # identifiers carries no information. And verified results BYPASS
  # trufflehog's own known-false-positive filter, so they land here as
  # blocking SARIF `error`s telling the reader to run the rotate-first SOP.
  #
  # EXIT: delete this entry the day the project integrates with Lob.
  TRUFFLEHOG_EXCLUDE_DETECTORS: "Lob"

jobs:
  secret-scan:
    name: Scan for secrets (trufflehog → SARIF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: PR diff scan needs base..head reachable; nightly
          # scans the whole history. fetch-depth:1 would make both useless.
          fetch-depth: 0
          # For PR events, check out the PR head SHA explicitly (not the
          # auto-generated merge ref) so the scanned commit set matches
          # what the contributor actually pushed.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Determine scan mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Install trufflehog
        run: |
          set -euo pipefail
          # Official install.sh, pinned to an explicit release tag. install.sh
          # resolves the correct release asset for the runner OS/arch — this
          # avoids guessing a container-image tag string (`v3.95.3` vs
          # `3.95.3`), which would be a fabricated-pin risk.
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin "v${TRUFFLEHOG_VERSION}"
          trufflehog --version

      - name: Run trufflehog (diff scan)
        if: steps.mode.outputs.mode == 'pr'
        # Route the base ref through env, NOT raw ${{ }} interpolation into the
        # run: script (same script-injection class as the commitlint PR-title
        # fix, #1021). base.ref is privileged-only (branch names in the base
        # repo), so this is hardening-by-convention: zero raw
        # ${{ github.event.* }} inside run: — nobody copies a raw-splice line.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Scan from the MERGE BASE (common ancestor), NOT the base
          # branch's current tip. `pull_request.base.sha` is the base
          # branch HEAD at event time — if `main` advanced after the PR
          # branched, that SHA is NOT in the PR branch's ancestry.
          # trufflehog --since-commit with a non-ancestor SHA can't bound
          # the walk and falls back to scanning the FULL history (slow +
          # surfaces years-old unrelated findings as noise). The merge
          # base is the actual fork point, so the range is exactly the
          # PR's own commits. (Gemini review of PR #496 — Git Ancestry Trap.)
          #
          # actions/checkout fetch-depth:0 fetches commits but not
          # necessarily the base-branch ref — fetch it so merge-base
          # resolves (same pattern as planning-status-sync.yaml).
          git fetch --no-tags --quiet origin "$BASE_REF"
          MERGE_BASE=$(git merge-base HEAD "origin/$BASE_REF")
          # ⛔ --branch BOUNDS THE WALK TO THIS PR. Without it, trufflehog's
          # git source appends `--all` to its internal `git log`
          # (gitparse.RepoPath: `if head != "" { args = append(args, head) }
          # else { args = append(args, "--all") }`), and its clone is made
          # with `-c remote.origin.fetch=+refs/*:refs/remotes/origin/*`, so
          # EVERY branch actions/checkout fetched comes along. --since-commit
          # does not save us: it only stops the walk when the merge base is
          # emitted, and commits on OTHER branches are not ancestors of it,
          # so they are scanned and charged to this run. Measured on #1363:
          # 2 of its 3 findings lived in a file that was on neither `main`
          # nor the PR branch, and the PR could not go green by any change
          # to its own diff (#1364).
          #
          # The value is a RESOLVED SHA, not `HEAD` and not a branch name:
          # actions/checkout leaves the workspace on a detached HEAD with no
          # `refs/heads/*` at all (verified in the run log), so the clone
          # trufflehog makes has no local branch and its own HEAD does not
          # point at the PR head. trufflehog short-circuits ref resolution
          # entirely for a full hash (`resolveHash` → `plumbing.IsHash`).
          HEAD_SHA=$(git rev-parse HEAD)
          echo "Diff scan ${MERGE_BASE}..${HEAD_SHA} (this branch only)"
          # No --fail: trufflehog exits 0 on findings by default; the
          # converter owns the block/warn policy. --json → NDJSON on stdout.
          # ⛔ --fail-on-scan-errors: WITHOUT it a scan error is not fatal.
          # trufflehog reports it via reporter.ChunkErr and still EXITS 0
          # (main.go gates the errors on this flag, default false), so an
          # unresolvable --branch produces an EMPTY findings.json, the
          # converter prints "no secrets detected", and the job goes GREEN
          # having scanned NOTHING — output byte-identical to a clean scan.
          # Measured on the pinned CLI, in a throwaway repo carrying one
          # obvious secret:
          #   good --branch                      → exit 0, 1 finding
          #   --branch <nonexistent sha>         → exit 0, 0 findings  ← green
          #   same + --fail-on-scan-errors       → exit 1, 0 findings
          #   good --branch + the flag           → exit 0, 1 finding (no false block)
          # TRADE-OFF, stated because it is not free: any per-file scan
          # error now fails the job. That is the deliberate direction — the
          # failure mode it replaces is a silent green on a security gate.
          trufflehog git "file://${PWD}" \
            --branch "${HEAD_SHA}" \
            --since-commit "${MERGE_BASE}" \
            --exclude-detectors "${TRUFFLEHOG_EXCLUDE_DETECTORS}" \
            --fail-on-scan-errors \
            --json \
            > findings.json
          echo "trufflehog diff scan complete: $(wc -l < findings.json) finding line(s)"

      - name: Run trufflehog (full git-history scan)
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -euo pipefail
          # Deliberately NOT --branch-bounded, unlike the diff scan above.
          # This is the repo-wide net: `--all` over every fetched ref is the
          # behaviour we want here, because a secret on an unmerged branch is
          # still a leaked secret. What made it wrong in PR mode is that it
          # charged another branch's finding to somebody's merge gate.
          # Same fail-closed reasoning as the diff scan above: a scan error
          # must not present as "nothing found". Verified not to false-block
          # this shape (no --branch) on the pinned CLI.
          trufflehog git "file://${PWD}" \
            --exclude-detectors "${TRUFFLEHOG_EXCLUDE_DETECTORS}" \
            --fail-on-scan-errors \
            --json \
            > findings.json
          echo "trufflehog full scan complete: $(wc -l < findings.json) finding line(s)"

      - name: Convert to SARIF + apply verified-finding policy
        id: convert
        run: |
          python3 -X utf8 scripts/tools/lint/trufflehog_to_sarif.py \
            --input findings.json \
            --output results.sarif \
            --tool-version "${TRUFFLEHOG_VERSION}" \
            --scan-mode "${{ steps.mode.outputs.mode }}"

      # --- Surface results. Both upload steps use `if: always()` so a
      #     VERIFIED finding (convert step exited 1) still lands in Code
      #     Scanning / artifacts before the job's failure propagates.
      #     The `convert.outcome != 'skipped'` guard avoids a confusing
      #     "results.sarif not found" secondary failure when an earlier
      #     step (trufflehog install/scan) failed and convert never ran. ---

      - name: Upload SARIF to Code Scanning
        # Skip for forked PRs — their read-only token cannot write
        # security-events; the artifact-fallback step below handles them.
        if: >-
          always() &&
          steps.convert.outcome != 'skipped' &&
          !(github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          # Distinct category so this doesn't clobber CodeQL's own
          # Code Scanning results.
          category: secret-scan

      - name: Upload SARIF as artifact (forked-PR fallback)
        # Forked PRs only: no security-events write. The nightly full scan
        # (main repo, write token) backfills the Security tab.
        if: >-
          always() &&
          steps.convert.outcome != 'skipped' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-sarif
          path: results.sarif
          retention-days: 14
