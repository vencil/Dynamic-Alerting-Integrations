# blast-radius.yml — Blast Radius Report (v2.7.0+) for hierarchical conf.d/
#
# Evolution of config-diff.yaml for hierarchical conf.d/ with _defaults.yaml
# inheritance (ADR-016/017). Uses describe-tenant --all to compute effective
# configs on both base and PR, then blast_radius.py to diff and classify.
#
# Tiers:
#   A = threshold / routing receiver changes (highlight)
#   B = other alerting field changes (list)
#   C = PROVABLY format-only changes (count only; NOT the fallback —
#       anything unclassified is B, because C's rendered text claims
#       "no threshold/routing/alerting impact", #1419)

name: Blast Radius

on:
  pull_request:
    branches: [main]
    paths:
      - "components/threshold-exporter/config/conf.d/**"
      - "conf.d/**"

permissions:
  pull-requests: write

jobs:
  blast-radius:
    name: Blast Radius Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml -c requirements/ci-constraints.txt

      - name: Detect conf.d path
        id: detect
        run: |
          # Support both repo-root conf.d/ and exporter conf.d/
          if [ -d "conf.d" ]; then
            echo "conf_d=conf.d" >> $GITHUB_OUTPUT
          elif [ -d "components/threshold-exporter/config/conf.d" ]; then
            echo "conf_d=components/threshold-exporter/config/conf.d" >> $GITHUB_OUTPUT
          else
            echo "conf_d=" >> $GITHUB_OUTPUT
            # ⛔ On a pull_request this is not a benign "nothing to do". The
            # `paths:` filter above only fires when conf.d/ itself changed, so
            # a PR that triggers this workflow and then finds no directory has
            # removed the tree from where this step looks — by deleting it, or
            # by MOVING or renaming it, which the `::error::` at the end of
            # this branch already tells the reader to fix ("If the tree moved,
            # update the two paths this step searches"). ⚠️ An earlier version
            # of this comment said "the one PR that can … is the PR that
            # DELETED the tree", which its own neighbouring message
            # contradicts. Either way it is the largest blast radius there is.
            # (⛔ And it pointed at that message as "three lines below", which
            # was twelve — the same line-counting habit a sibling file in this
            # PR now bans outright. Named, not counted.)
            # ⚠️ NOT "every later step", which is what this said, and no
            # count replacing it either — the correction that first went in
            # here carried a number nothing asserts, on a line whose whole
            # subject is a claim that went stale. Named instead: every step
            # that can PRODUCE a report is gated on this output; `Post PR
            # comment` gates on `steps.blast.outputs.has_report` and `Upload
            # report artifact` is `always()`, both deliberately and both
            # argued for further down. What holds is the part that matters
            # here: nothing downstream can produce a
            # report, this job has no verdict step, so the old
            # warning-and-continue meant that PR got a green run and no
            # comment at all (#1419).
            # No event test here: `on:` accepts pull_request only, so there is
            # no second arm to write. guard-defaults-impact.yml does test the
            # event because it also accepts workflow_dispatch.
            echo "::error::No conf.d/ directory found on a PR that changed conf.d/ — nothing was analysed. If the tree moved, update the two paths this step searches."
            exit 1
          fi

      - name: Generate PR effective configs
        if: steps.detect.outputs.conf_d != ''
        env:
          CONF_D: ${{ steps.detect.outputs.conf_d }}
        run: |
          set -euo pipefail
          python3 scripts/tools/dx/describe_tenant.py \
            --all \
            --conf-d "$CONF_D" \
            --output /tmp/pr-effective.json
          # Symmetric with the base side below. Without this an exit-0 run that
          # wrote nothing leaves the PR side empty against a full baseline, and
          # the report flips into "every tenant was deleted".
          if [ ! -s /tmp/pr-effective.json ]; then
            echo "::error::describe-tenant exited 0 but wrote no PR-side configs to /tmp/pr-effective.json"
            exit 1
          fi

      - name: Generate base effective configs
        if: steps.detect.outputs.conf_d != ''
        # Bind the base ref via env, NOT raw ${{ }} interpolation into the
        # run: script (same script-injection class as the commitlint PR-title
        # fix, #1021). github.base_ref is privileged-only — house rule: zero
        # raw ${{ github.event.* }} / ${{ github.base_ref }} inside run:.
        env:
          BASE_REF: ${{ github.base_ref }}
          CONF_D: ${{ steps.detect.outputs.conf_d }}
        run: |
          set -euo pipefail
          base_tree=/tmp/base-conf.d
          rm -rf "$base_tree"; mkdir -p "$base_tree"

          # ⛔ The baseline is rebuilt from git OBJECTS into a directory of its
          # own. It used to be produced by overlaying the base branch onto the
          # PR worktree (`git checkout "origin/$BASE_REF" -- .`), which is wrong
          # in two ways that need no command to fail (#1419):
          #   * `git checkout <ref> -- .` does not DELETE files the PR added, so
          #     a newly added tenant stayed on disk and was read as part of the
          #     "base". Both sides then matched and the report said "no changes"
          #     — for the single loudest thing a conf.d PR can do. Measured: a
          #     PR adding db-new got "No effective tenant config changes
          #     detected"; rebuilding the baseline gets "db-new (NEW)".
          #   * the restore afterwards (`git checkout - -- .`) needs an `@{-1}`
          #     that a detached PR checkout has no reason to have — measured
          #     rc=128 every run — so the worktree was left holding BASE
          #     content, and the very next step runs blast_radius.py FROM the
          #     worktree. A PR touching both conf.d/ and that script got its
          #     report computed by the OLD tool.
          # Not touching the worktree removes both, and the stash/restore dance
          # with them.
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" >/dev/null; then
            echo "::error::base ref origin/${BASE_REF} does not resolve — the checkout step must keep fetch-depth: 0"
            exit 1
          fi

          # Base branch may not have describe-tenant yet (pre-v2.7.0). THAT case
          # has no baseline to compute and `{}` is the honest answer; a crash of
          # the tool is not the same statement. Asked of the base COMMIT, not of
          # the worktree, now that the worktree is never rewritten.
          # ⛔ Probed with ls-tree, not `cat-file -e`. `cat-file -e` returns 128
          # for BOTH "no such path" and "git could not answer" (broken object
          # store, partial-clone fetch failure), so its exit code cannot carry
          # the distinction this branch depends on — and collapsing them turns
          # "I do not know" into "the base branch is old", hands `{}` to the
          # comparison and prints a ::notice:: asserting something false. That
          # is the defect class this whole file is about.
          # ls-tree separates them: absent is rc=0 with empty output, broken is
          # rc!=0. Same shape as the listing below, deliberately.
          probe=$(mktemp)
          set +e
          git ls-tree -z "origin/$BASE_REF" -- scripts/tools/dx/describe_tenant.py > "$probe"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::git ls-tree exited $rc probing origin/$BASE_REF for describe-tenant — cannot tell whether the base has it"
            exit "$rc"
          fi
          if [ ! -s "$probe" ]; then
            echo "::notice::base origin/$BASE_REF predates describe-tenant — comparing against an empty baseline"
            echo "{}" > /tmp/base-effective.json
            exit 0
          fi

          # `-r` because conf.d/ is hierarchical (ADR-016/017) and the baseline
          # has to carry the whole inheritance chain. `-z` because ls-tree
          # otherwise C-quotes non-ASCII paths and the `git show` below would
          # then fail with a message blaming the object rather than the quoting.
          # ⚠️ `-z` does that ON ITS OWN. An earlier draft also passed
          # `-c core.quotePath=false` and this comment credited it; measured
          # against git 2.54, `-c core.quotePath=true` WITH `-z` is already
          # unquoted, so the flag was doing nothing.
          # No `--name-only`: the type/mode column is what keeps a gitlink or a
          # symlink out of the baseline, the same reason config-diff.yaml keeps
          # it.
          listing=$(mktemp)
          set +e
          git ls-tree -r -z "origin/$BASE_REF" -- "$CONF_D/" > "$listing"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::git ls-tree exited $rc for origin/$BASE_REF:$CONF_D/ — cannot build a baseline"
            exit "$rc"
          fi
          if [ ! -s "$listing" ]; then
            echo "::notice::base origin/$BASE_REF has no $CONF_D/ — comparing against an empty baseline"
            echo "{}" > /tmp/base-effective.json
            exit 0
          fi

          while IFS=$'\t' read -r -d '' meta path; do
            # Regular blobs only. A gitlink has no blob to show (the run would
            # die blaming a "truncated baseline"), and a symlink's blob is its
            # TARGET PATH — `git show` would write that string into a file and
            # the baseline would quietly contain a config-shaped lie.
            case "$meta" in
              "100644 blob "*|"100755 blob "*) ;;
              *) echo "::warning::skipping non-file entry in $CONF_D/: $path"; continue ;;
            esac
            rel="${path#"$CONF_D"/}"
            # `--` so a path starting with `-` is not read as an option; without
            # it dirname prints its usage to stderr, `set -e` does not see it
            # inside a command substitution, and the failure surfaces later as a
            # confusing `mv` error.
            mkdir -p "$base_tree/$(dirname -- "$rel")"
            # Scratch first, promote on success: redirecting onto the
            # destination creates the file before git runs, which is how empty
            # files used to stand in for real configs.
            scratch=$(mktemp)
            if ! git show "origin/$BASE_REF:$path" > "$scratch"; then
              echo "::error::git show failed for origin/$BASE_REF:$path — refusing to compute a blast radius against a truncated baseline"
              exit 1
            fi
            # Same 0600-from-mktemp trap as config-diff.yaml. Consumed by
            # python3 as the runner user here rather than by a container,
            # so it is not currently fatal — pinned anyway so the two
            # baselines cannot drift into disagreeing about readability.
            # ⛔ Same shape as config-diff.yaml: `cmd && rm` puts `cmd` on the
            # LEFT of `&&`, where `bash -e` does not stop for it. Measured: the
            # loop finished, the script continued, the step exited 0 — an
            # incomplete baseline reported as a clean one.
            if ! install -m 0644 "$scratch" "$base_tree/$rel"; then
              echo "::error::failed to place the baseline copy at $base_tree/$rel — refusing to compute a blast radius against an incomplete baseline"
              exit 1
            fi
            rm -f "$scratch"
          done < "$listing"

          python3 scripts/tools/dx/describe_tenant.py \
            --all \
            --conf-d "$base_tree" \
            --output /tmp/base-effective.json
          if [ ! -s /tmp/base-effective.json ]; then
            echo "::error::describe-tenant exited 0 but wrote no baseline to /tmp/base-effective.json"
            exit 1
          fi

      - name: Compute blast radius
        if: steps.detect.outputs.conf_d != ''
        id: blast
        # Same env-binding as "Generate base effective configs" above (#1021
        # class): no raw base-ref interpolation inside run:.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Find changed conf.d files for header
          # ⛔⛔ HOW TO RESOLVE THE CONFLICT THIS BLOCK CAUSES, measured on the
          # real merge rather than reasoned about. The baseline-substitution PR
          # edits this same file, and merging the two produces exactly ONE
          # conflict hunk — this statement and its comments. Resolve it IN
          # PLACE to the version below.
          # ⛔ Do NOT run file-level `git checkout --theirs` on this workflow
          # (`.github/workflows/blast-radius.yml`) — that form replaces the
          # WHOLE FILE with this branch's copy and
          # silently discards the FOUR hunks git had already auto-merged from
          # the other branch — no conflict markers, no warning. Measured: the
          # in-place resolution gives `1 failed, 283 passed`, the file-level
          # one gives `17 failed, 267 passed`, and the extra sixteen name the
          # other branch's guards rather than anything about this line.
          # ⛔ The remaining single red is `test_control_the_display_only_
          # exemption_is_not_stale`, and the fix is to DELETE the
          # `_DISPLAY_ONLY_LISTINGS` exemption in the other branch's test
          # module (plus the paragraph above it), NOT to re-point its literal
          # at the statement below. The version below carries `-z`, so the rule
          # covers it for real. Measured: deleting gives 284 passed.
          # ⚠️ This note lives on THIS side of the hunk on purpose. The same
          # guidance used to sit on the other side, where resolving the
          # conflict deletes it — instructions that only exist inside the thing
          # being replaced are gone precisely when someone needs them.
          #
          # ⛔ `-z` and the consumer's surrogate handling are ONE change and
          # land together. Without `-z` git C-quotes any non-ASCII path and the
          # reviewer reads `"\347\222\260-prod/conf.d/_defaults.yaml"` as the
          # list of what changed. With `-z` alone the raw bytes reach
          # `--changed-files`, argv decodes them to lone surrogates, and
          # `blast_radius.py` writes its report with
          # `write_text(encoding="utf-8")` — strict — so the step died with
          # `UnicodeEncodeError: surrogates not allowed` and a traceback
          # blaming the tool. Measured both ways. `_printable()` in
          # `blast_radius.py` is the other half; splitting them across PRs is
          # what made the workflow-side PR revert its own copy of this line.
          # ⛔ The cap is taken on the SEPARATOR THE PRODUCER EMITS. This was
          # `tr '\0' '\n' | head -5`, and the five-file limit then depended on
          # the order of two pipeline stages that look interchangeable: move
          # the `tr` after the `head` and the stream reaching `head` contains
          # no newlines at all, so it is one "line", the cap passes everything
          # through, and a 300-file PR renders 300 paths into the comment
          # header with nothing to say the limit stopped applying. `head -z`
          # counts the NUL-terminated records `git diff -z` actually writes, so
          # there is no ordering left to get wrong.
          # ⚠️ Second effect, and the reason the old caveat is gone: a filename
          # containing a literal newline used to be split and counted as two
          # entries. It now stays one record; the newline is flattened to a
          # space AFTER the cap, so it can neither inflate the count nor break
          # the header line.
          # ⛔⛔ THIS STATEMENT IS EDITED BY BOTH #1419 PRs AND THIS IS THE
          # MERGED FORM. The sibling PR (baseline substitution) rewrote the same
          # line to capture git's own exit status, because this step has no
          # `set -o pipefail` and the value came out of a pipeline: the
          # assignment inherited `sed`'s success, so a bad base ref printed
          # `fatal: bad revision`, left the value empty, returned 0, and the
          # header silently disappeared from a report that otherwise rendered
          # normally — "git could not tell me what changed" rendered as "nothing
          # changed", this file's own defect class. Whichever PR merged second
          # would have replaced the other's hardening with no conflict marker on
          # the semantics, so both live here.
          # ⛔ Through a FILE, not a variable, and that is forced rather than
          # stylistic: `$(git diff -z …)` cannot work. bash drops NUL bytes from
          # a command substitution (measured: six changed paths came back as one
          # concatenated string, with the warning only on stderr), so capturing
          # the listing to check its status would destroy the separators the cap
          # then counts. The sibling's variable form and `-z` are incompatible;
          # the file is what lets both properties hold at once.
          # ⚠️ And writing it to a file is now CORRECT for the `-z` rule too.
          # The sibling's comment records that an earlier file-based version
          # made that rule fire — rightly by its own definition, since a listing
          # read back from a file must be NUL-separated. It is, here.
          # ⚠️ No `set -o pipefail`, and the reason is the second half of
          # this sentence rather than the first. git is NOT in the pipeline
          # here — it redirects to a file and `head` reads that file — so the
          # SIGPIPE story an earlier version of this comment told ("`head -z`
          # closes the pipe early, so git comes back 141 on every large PR")
          # cannot happen: measured at 3000 records with pipefail on, rc=0 and
          # the value correct. That rationale was carried over verbatim from
          # the pre-merge `git … | head` form and stopped being true the
          # moment the merge moved git out of the pipeline. What is true is
          # that the status that matters is git's own, taken before the
          # pipeline — which is exactly why nothing downstream needs to
          # propagate one.
          changed_raw=$(mktemp)
          set +e
          git diff -z --name-only "origin/$BASE_REF"...HEAD -- "${{ steps.detect.outputs.conf_d }}" > "$changed_raw"
          diff_rc=$?
          set -e
          if [ "$diff_rc" -ne 0 ]; then
            echo "::warning::git diff exited $diff_rc listing the changed files for the comment header — the header will say so, which is NOT the same as this PR changing nothing"
            # ⛔ A SENTENCE, not an empty string. Emptiness renders exactly the
            # same header as never passing `--changed-files` at all (measured:
            # both give `### Blast Radius Report`), so on the reviewer's screen
            # "git could not tell me what changed" and "nobody asked" were
            # byte-identical — the `::warning::` above only exists in the job
            # log, which nobody reading the comment sees. Fixing this at the
            # shell layer and stopping there is the defect this file is about,
            # one layer up.
            CHANGED_FILES="(could not be listed — git diff exited $diff_rc; see the job log)"
          else
            total=$(tr -cd '\0' < "$changed_raw" | wc -c)
            CHANGED_FILES=$(head -z -n 5 < "$changed_raw" | tr '\n' ' ' | tr '\0' ',' | sed 's/,$//')
            # ⚠️ The cap has to SAY it capped. `git diff --name-only` is sorted,
            # so an 8-file PR rendered the alphabetically-first five and read as
            # a complete list; the only contradicting signal was the `Affected
            # tenants` row further down. The comment above worried about the
            # opposite direction (a 300-path header) and the cap fixed that
            # half; the disclosure is the other half.
            if [ "$total" -gt 5 ]; then
              CHANGED_FILES="$CHANGED_FILES (+$((total - 5)) more)"
            fi
          fi

          python3 scripts/tools/ops/blast_radius.py \
            --base /tmp/base-effective.json \
            --pr /tmp/pr-effective.json \
            --format json \
            --output /tmp/blast-radius-report.json

          ARTIFACT_HINT="Full per-tenant diff available in the \`blast-radius-report\` artifact on [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

          python3 scripts/tools/ops/blast_radius.py \
            --base /tmp/base-effective.json \
            --pr /tmp/pr-effective.json \
            --format markdown \
            --changed-files "$CHANGED_FILES" \
            --artifact-hint "$ARTIFACT_HINT" \
            --output /tmp/blast-radius-comment.md

          if [ -s /tmp/blast-radius-comment.md ]; then
            echo "has_report=true" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment
        if: steps.blast.outputs.has_report == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/blast-radius-comment.md', 'utf8');
            // ⛔ Provenance, because this comment is STICKY. A run that fails
            // before this step leaves the PREVIOUS verdict in place, unedited
            // and with no "edited" badge, reading as though it describes the
            // current push — and #1419 made that MORE common by converting
            // silent-green paths into red ones. The SHA and run link are the
            // only way a reader can tell. Read from `context`, never from an
            // Actions expression interpolation (#1021 class house rule).
            const sha = (context.payload.pull_request?.head?.sha || context.sha).slice(0, 7);
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const stamp = '\n<sub>commit `' + sha + '` • [run log](' + runUrl + ')</sub>\n';
            const marker = '<!-- blast-radius-bot -->';
            const body = `${marker}\n${report}\n\n---\n*Generated by [blast_radius.py](../blob/main/scripts/tools/ops/blast_radius.py) • v2.7.0 Hierarchical Config Blast Radius*${stamp}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload report artifact
        # ⛔ NOT gated on `steps.blast.outputs.has_report`, which is set by the
        # SECOND blast_radius.py call while the artifact is written by the
        # FIRST. So the markdown call raising, or `Post PR comment` failing,
        # leaves a COMPLETE report.json on disk and no comment on the PR — the
        # exact moment the artifact is the only place the diff exists, and the
        # exact moment the old condition threw it away.
        #
        # ⚠️ An earlier version of this comment said "the partial artifact is
        # the only diagnostic" and claimed the same argument as the sibling in
        # guard-defaults-impact.yml. That was WRONG for this file and is
        # corrected here rather than deleted, because the wrong version reads
        # more reassuring than the right one. That sibling BUILDS its report
        # incrementally (`: > "$REPORT"` at step top, appended per tree), so a
        # mid-step death genuinely leaves a partial. This one is a single
        # `out_path.write_text` after all computation (`blast_radius.py`), so on
        # every earlier failure path (Detect exiting 1, dependency install,
        # either describe-tenant call, the json call itself) there is NO file at
        # all and this upload is a no-op.
        # ⚠️ NOT "complete or absent, never partial", which is what this said.
        # That conflates "the CONTENT was finished" with "the FILE was
        # finished", and only the first follows from writing once at the end.
        # `write_text` opens with mode `w`, i.e. it TRUNCATES first and then
        # flushes in chunks (measured: 24 bytes → 0 on open → 100000 before
        # close), so a kill during the write leaves a truncated file on disk —
        # reproduced with SIGTERM mid-write, 35MB of a 60MB payload, rc 143.
        # The cancellation half of the old claim was therefore false, and it is
        # the half the sentence went out of its way to assert.
        # ⚠️ Kept as `always()` anyway, and the reason is a size argument rather
        # than an impossibility one: this report is bounded by
        # COMMENT_SAFETY_LIMIT, so it is written in a single flush in practice
        # and a torn one is not a shape anybody has seen. If that bound ever
        # goes away, a partial report uploaded under the name of a complete one
        # is a real hazard and this needs a marker, not a bigger claim.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blast-radius-report
          path: /tmp/blast-radius-report.json
          retention-days: 30
          # Explicit for the same reason the sibling pins it: on the (common)
          # no-file paths above, the absence must not add a second red on top of
          # the real failure. `warn` IS the action's current default — pinning it
          # is a pin against a future major changing that, not a behaviour change.
          if-no-files-found: warn
