name: Deploy Documentation

# Builds the MkDocs site and deploys it via the GitHub Actions Pages
# pipeline (NOT `mkdocs gh-deploy` to a gh-pages branch).
#
# Why Actions-native (migrated from `mkdocs gh-deploy --force`):
#   The previous workflow pushed the built site to the `gh-pages` branch,
#   but GitHub Pages was serving from `main:/docs` (legacy Jekyll). The two
#   were disconnected: every deploy was green yet the live site root 404'd
#   because Pages ran Jekyll over the MkDocs *source* (which has no root
#   index.html — only index.md + Liquid-hostile content). Serving via
#   `actions/deploy-pages` deploys the SAME `mkdocs build` output the lint
#   job runs (docs-ci `MkDocs Build Verification` -> mkdocs_strict_check.sh),
#   so deploy and lint track one artifact instead of two disconnected build
#   systems — closing the gap where "lint green" said nothing about what was
#   actually served.
#
#   ONE-TIME prerequisite (NOT done by this workflow): the Pages serving
#   source must be switched to "GitHub Actions" once — Settings -> Pages ->
#   Source, or `gh api -X PUT repos/<owner>/<repo>/pages -f build_type=workflow`.
#   `actions/configure-pages` does NOT migrate an existing legacy branch
#   source (its `enablement` only *enables* Pages when absent, and needs a
#   token beyond GITHUB_TOKEN). Once the source is "workflow" this pipeline
#   owns deploys; `pages-health.yaml` then asserts the source can't silently
#   drift back to a branch/folder, plus a live HTTP 200 backstop.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'   # rendered in nav (mkdocs.yml) via the docs/CHANGELOG.md symlink
      - 'mkdocs.yml'
      - 'rule-packs/*.md'
      - 'scripts/mkdocs/**'
      # The portal bundles under docs/assets/dist/ are built from this tree
      # in the job below (#3738). Without this entry a PR that only edits
      # portal source never redeploys, and Pages keeps serving the old
      # bundles. Pinned by tests/ops/test_portal_dist_consumers_build.py.
      - 'tools/portal/**'
      - '.github/workflows/mkdocs-deploy.yaml'
  workflow_dispatch:  # manual trigger

# Least-privilege: only `contents: read` at the workflow level (the build job
# just checks out + builds). The Pages write scopes (pages: write + id-token:
# write, needed only by actions/deploy-pages) live on the deploy job alone —
# the build job (configure-pages + upload-pages-artifact) needs no write token.
# (zizmor excessive-permissions; CodeRabbit on #861.)
permissions:
  contents: read

# Serialize deploys; never cancel an in-flight one (a half-applied Pages
# deployment is worse than waiting). Matches the GitHub Pages starter.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: mkdocs-${{ hashFiles('mkdocs.yml') }}
      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-static-i18n pymdown-extensions -c requirements/ci-constraints.txt
      # #3738: the site ships docs/assets/dist/ as-is, and that directory is
      # build output that is not in git, so build the portal bundles from
      # source here. (Before #3738 the bundles were committed, and that copy
      # went stale on main even after CI compared it on the PR's merge ref:
      # branch protection is not strict, so main can move between that check
      # and the merge.) Node major = the dev container's
      # (docs/internal/toolchain-versions.md; test_toolchain_pin_parity.py).
      # Pinned before `mkdocs build` by tests/ops/test_portal_dist_consumers_build.py.
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tools/portal/package-lock.json
      - name: Install portal build dependencies
        working-directory: tools/portal
        run: npm ci
      - name: Build portal bundles (docs/assets/dist/)
        working-directory: tools/portal
        run: npm run build
      - name: Build site
        # Plain `mkdocs build` (NOT --strict): the docs-ci `MkDocs Build
        # Verification` job gates PR quality via mkdocs_strict_check.sh.
        # Keeping the deploy build resilient means a known-acceptable link
        # warning can't take the whole site down. Same `mkdocs build` the
        # lint job runs (via mkdocs_strict_check.sh) — but that lint can pass
        # on filtered known-acceptable warnings, so docs-ci stays the quality
        # gate; this step just ships the build.
        run: mkdocs build
      - name: Configure Pages
        # Provides Pages build metadata for this run. Does NOT switch an
        # existing legacy branch source to "workflow" — that is the one-time
        # step noted in the header. Harmless once the source is already
        # "GitHub Actions".
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    # Job-level override (replaces the workflow-level `contents: read`): only
    # actions/deploy-pages needs these write scopes, so they stay off the build job.
    permissions:
      pages: write      # create the Pages deployment
      id-token: write   # OIDC token actions/deploy-pages exchanges
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
