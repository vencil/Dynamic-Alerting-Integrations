name: Security Audit (Python SAST)

# bandit gate for dev-rules.md Rule #5 (#455). HARD-FAIL since #1643 —
# the warn-only soak opened 2026-05-20 with a 2-week horizon and was still
# open 15 weeks later, while this job is the mechanism dev-rules.md §5
# names for items 2/4/5/6. Flipped on a surface that reports 0 MEDIUM+
# findings at this floor.
# ⚠️ That 0 is held up by `# nosec` suppressions already in the tree — with
# `--ignore-nosec` the same command reports findings. Audit them with:
#   bandit -c .bandit -r scripts/tools components/da-tools -ll -ii --ignore-nosec
# ⛔ A `# nosec` with no parseable `B<ID>` is a BLANKET suppression (every rule
# on that line, B506 included) and its warning text is identical to a harmless
# one — see dev-rules.md §5 Suppression.
# Scope: scripts/tools/** + components/da-tools/** (other Python dirs
# excluded via .bandit). Floor `-ll -ii` = MEDIUM severity × confidence.
# ⚠️ This job is NOT a required status check (`advisory:` in
# .github/required-checks.yaml), and it CANNOT be listed as one as written: the `paths:` filters below mean the workflow does not run at all
# on a PR that touches nothing in scope, so a required context would never be
# reported and such PRs would hang on "Expected — Waiting for status".
# Making it required needs the workflow to run on every PR first (no top-level
# `paths:`). ⛔ Do not then gate the JOB on paths instead: a skipped job
# reports `skipped`, which satisfies a required check — the gate is green
# without ever running. validate.yaml once did exactly that with
# dorny/paths-filter and retired it in #3756 for this reason. Opposite
# direction from the one above (too loose vs too tight).
# ⛔ BOTH have to be done, in this order: (A) make the workflow always run,
# (B) add the fail-closed aggregation #1398 asks for. Doing (A) alone hands
# you a required check that passes when bandit never ran.

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/tools/**/*.py"
      - "components/da-tools/**/*.py"
      - ".bandit"
      - ".github/workflows/security-audit.yaml"
  push:
    branches: [main]
    paths:
      - "scripts/tools/**/*.py"
      - "components/da-tools/**/*.py"
      - ".bandit"
      - ".github/workflows/security-audit.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Python SAST (bandit -ll -ii)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install bandit
        # Pinned to the dev-container version so local/CI behaviour matches.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet 'bandit==1.9.4'
          bandit --version

      - name: Run bandit (medium severity + confidence)
        id: bandit
        # ⛔ Hard-fail (#1643). Do not put `continue-on-error` back: this step
        # is the only enforcement of dev-rules.md §5 item 4 since the AST
        # duplicate in tests/shared/test_sast.py was removed.
        continue-on-error: false
        run: |
          set -euo pipefail
          bandit -c .bandit \
            -r scripts/tools components/da-tools \
            -ll -ii \
            -f json \
            -o bandit-report.json

      - name: Summarize findings
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f bandit-report.json ]; then
            echo "::warning::bandit-report.json not produced (scan step failed before output)"
            exit 0
          fi
          n=$(python3 -c "import json,sys; print(len(json.load(open('bandit-report.json'))['results']))")
          echo "bandit findings (MEDIUM+ severity & confidence): $n"
          if [ "$n" -gt 0 ]; then
            echo "::error::bandit found $n MEDIUM+ severity/confidence finding(s) — see uploaded report. The scan step above has already failed this job (#1643)."
            python3 -c "import json; r=json.load(open('bandit-report.json'))['results']; [print(f\"  [{i['test_id']} sev={i['issue_severity']}] {i['filename']}:{i['line_number']} — {i['issue_text'][:120]}\") for i in r]"
          fi

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14
