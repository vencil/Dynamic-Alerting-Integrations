name: Forge E2E — GitHub (post-merge)

# Real-forge E2E for tenant-api's PR write-back against a DEDICATED GitHub
# sandbox repo (issue #616, Track 1). Complements the httptest unit tests
# (#615, deterministic protocol) with real api.github.com behaviour: Link-header
# pagination, true permission 403, full PR round-trip.
#
# ⛔ SECURITY: runs on same-repo events ONLY — post-merge push to main + manual
# dispatch. NEVER `pull_request` / `pull_request_target` — a forge write-PAT in
# a fork-influenced workflow is a classic pwn-request (token exfil). `on: push`
# never fires for fork PRs, so fork contributors are unaffected and unblocked.

on:
  # per-PR (same-repo) + post-merge. `pull_request` (NOT `_target`) is safe:
  # GitHub withholds secrets from FORK PRs, so loadGitHubCfg sees no token and
  # SKIPS → fork contributors are non-blocking; same-repo PRs get secrets and
  # run the real E2E. paths-filtered so only tenant-api changes trigger it.
  pull_request:
    paths:
      - "components/tenant-api/**"
      - ".github/workflows/forge-e2e-github.yaml"
      # #3756: whatever else the job reads, from what it was measured to read
      # by access time (.github/path-traces/forge-e2e-github.yaml.json), less
      # what a pattern above already covers. The job's assert step fails,
      # naming the file, when it reads something this list does not cover.
      # The `push` list below is hand-written and not held to the
      # measurement. Do not edit between the markers.
      # BEGIN GENERATED path-trace (scripts/ops/workflow_path_filter.py generate)
      - ".github/path-traces/forge-e2e-github.yaml.json"
      - "scripts/ops/atime_trace.py"
      - "scripts/ops/paths_filter_glob.py"
      - "scripts/ops/workflow_path_filter.py"
      - "scripts/tools/_lib_compat.py"
      - "scripts/tools/_lib_exitcodes.py"
      # END GENERATED path-trace
  push:
    branches: [main]
    paths:
      - "components/tenant-api/**"
      - ".github/workflows/forge-e2e-github.yaml"
  workflow_dispatch:
    inputs:
      seed_pagination_fixture:
        description: "One-time: seed/top-up the >100-PR pagination fixture (#636)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: forge-e2e-github
  cancel-in-progress: false

env:
  # Dedicated throwaway sandbox — NOT the real repo (the E2E opens/deletes PRs).
  E2E_GITHUB_REPO: vencil/tenant-api-e2e-sandbox

jobs:
  github-e2e:
    name: GitHub real-forge E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # BEGIN GENERATED path-trace-env job=github-e2e
      - name: Set access times back, to measure what this job reads (#3756)
        run: python3 -I scripts/ops/atime_trace.py reset --state "$RUNNER_TEMP/atime-trace.json" --canary-dir "$GITHUB_WORKSPACE/.git/atime-canary"
      # END GENERATED path-trace-env
      - uses: actions/setup-go@v6
        with:
          go-version-file: components/tenant-api/go.mod

      # Pre-sweep orphan PRs/branches from any prior failed/cancelled run so a
      # stuck repo doesn't inflate this run's pagination. Skips if secrets unset.
      - name: Janitor — pre-sweep orphans
        working-directory: components/tenant-api
        env:
          E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_GITHUB_RO_TOKEN: ${{ secrets.E2E_GITHUB_RO_TOKEN }}
          E2E_GITHUB_JANITOR: "1"
        run: go test -tags forge_e2e -count=1 -run TestForgeE2E_GitHub_Janitor ./test/forgee2e/... -v

      # One-time pagination fixture seed (#636) — manual dispatch only. Creates/
      # tops-up the >100 long-lived open PRs under tenant-api/fixture/ that the
      # janitor preserves and TestForgeE2E_GitHub_Pagination reads. Paced + retried
      # so it survives GitHub's secondary rate limit. No-op on push / pull_request.
      - name: Seed pagination fixture (#636, manual)
        if: github.event_name == 'workflow_dispatch' && inputs.seed_pagination_fixture
        working-directory: components/tenant-api
        env:
          E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_GITHUB_SEED_FIXTURE: "1"
        run: go test -tags forge_e2e -count=1 -timeout 20m -run TestForgeE2E_GitHub_SeedPaginationFixture ./test/forgee2e/... -v

      - name: GitHub forge E2E scenarios
        working-directory: components/tenant-api
        env:
          E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_GITHUB_RO_TOKEN: ${{ secrets.E2E_GITHUB_RO_TOKEN }}
        run: go test -tags forge_e2e -count=1 -timeout 20m -run TestForgeE2E_GitHub ./test/forgee2e/... -v

      # always(): clean up this run's residue even if a scenario was killed
      # mid-teardown (before its t.Cleanup ran).
      - name: Janitor — post-sweep (always)
        if: always()
        working-directory: components/tenant-api
        env:
          E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_GITHUB_RO_TOKEN: ${{ secrets.E2E_GITHUB_RO_TOKEN }}
          E2E_GITHUB_JANITOR: "1"
        run: go test -tags forge_e2e -count=1 -run TestForgeE2E_GitHub_Janitor ./test/forgee2e/... -v

      # #3756: every tracked file this job read must be in
      # `on.pull_request.paths` above. After the post-sweep, so that its reads
      # are measured too; it does not run when the job is cancelled (the
      # post-sweep does). The step is compared with the generated text key
      # for key, so an `env:` added to it is refused by `generate --check`;
      # so is anything after it that is not an artifact upload. Generated.
      # BEGIN GENERATED path-trace-assert job=github-e2e
      - name: Path filter covers everything this job read (#3756)
        if: ${{ !cancelled() }}
        run: python3 -I scripts/ops/atime_trace.py finish --state "$RUNNER_TEMP/atime-trace.json" && python3 scripts/ops/workflow_path_filter.py assert --workflow forge-e2e-github.yaml --job github-e2e --state "$RUNNER_TEMP/atime-trace.json" --out "$RUNNER_TEMP/path-trace.json" --leg "${{ strategy.job-index }}/${{ strategy.job-total }}"
      # END GENERATED path-trace-assert

      # What `assert --out` wrote: on a red run, `workflow_path_filter.py
      # merge` this file into .github/path-traces/forge-e2e-github.yaml.json.
      - name: Upload the trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: path-trace-forge-e2e-github-github-e2e
          path: ${{ runner.temp }}/path-trace.json
          if-no-files-found: warn
