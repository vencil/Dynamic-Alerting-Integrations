name: Component Docker Build (PR smoke)

# Issue #474 — Layer 1 of the trigger-asymmetry safety net.
#
# Problem it solves: PR CI tests the *code* (Go Tests / Portal Tests / lint),
# but release.yaml (on: push.tags) tests the *artifact* (the production image).
# Anything that only breaks at image-build time has ZERO pre-tag coverage and
# only surfaces at tag push — the worst possible moment. v2.8.0 release hit 2
# such dormant bugs in 30 min (#472 portal Dockerfile moved-file COPY, #473
# exporter pkg/ COPY missing). This workflow runs `docker build` against the
# 7 self-built Dockerfiles on every PR that touches their build inputs, so
# build breakage fails at the introducing PR, not at release.
#
# ⚠️ Two of the seven ship inside Helm charts and are never published, so the
# tag-time release build does NOT cover them at all (#1337). Their remaining
# build coverage is NOT symmetric, so do not write it as one sentence:
#   * vector-projection-gate — this workflow, the nightly scan and
#     `make docker-build-all` are the only things that build it anywhere.
#   * federation-audit-sidecar — additionally built on every CI run by the
#     `federation-e2e` job (ci.yml), whose compose stack builds it from source
#     (tests/federation-e2e/docker-compose.yml) and then scrapes its metrics.
#
# Cost: ~30-60 s per component, only on PRs touching the paths below. The
# exception is federation-audit-sidecar, which since #1337 compiles mtail from
# source (~25 s locally with a warm module cache; a cold runner also pays the
# clone + module download).
# No registry push (forked PRs work — `load: true` is local-daemon only).
#
# Trivy CVE scan: **informational at PR time (exit-code 0)**, NOT blocking.
# This deviates from #474's literal "exit-code 1" wording, deliberately:
# issue #448 (same author, later v2 rewrite) argues a blocking CVE scan at
# PR time lets a fresh upstream base-image CVE block UNRELATED PRs with no
# warning. We keep the build a hard gate (deterministic, blames this diff)
# and surface CVEs as visible-but-non-blocking output. Flip to exit-code 1
# here only if the project decides PR-time CVE-blocking is wanted.
#
# ⛔ CORRECTION (#1337): this block used to add "release.yaml's own image CVE
# scan is likewise treated as informational (#448)". That is FALSE — all five
# release jobs set `exit-code: 1` with no `continue-on-error`, so a fixable
# HIGH/CRITICAL fails the release job. What is true, and is the likely origin of
# the confusion, is that the scan runs POST-PUSH: the image is already in the
# registry by then, so what it blocks is the release job going green, not the
# publication of that image. (And in 4 of the 5 jobs it is the last step, so
# nothing further is prevented either; only release-da-tools has signing / SBOM /
# archive / GitHub-Release steps after it.)

on:
  pull_request:
    paths:
      - "components/threshold-exporter/app/**"
      - "components/tenant-api/**"
      - "components/da-portal/**"
      - "components/da-tools/app/**"
      - "components/recipe-preview/**"
      - "scripts/tools/dx/_recipe_preview.py"          # recipe-preview Dockerfile COPY source (bundled eval core)
      - "scripts/tools/dx/compile_custom_alerts.py"    # recipe-preview COPY source (bundled compiler)
      - "scripts/tools/dx/custom_alerts/**"            # recipe-preview COPY source
      - "scripts/tools/lint/check_rulepack_sync.py"    # recipe-preview COPY source
      - "scripts/tools/_lib_exitcodes.py"              # recipe-preview COPY source
      - "scripts/tools/_lib_compat.py"                 # recipe-preview COPY source
      - "docs/interactive/**"        # da-portal Dockerfile COPY source
      - "tools/portal/src/**"        # da-portal COPY source (post TD-042 restructure)
      - "docs/assets/**"             # da-portal COPY source
      - "docs/.nojekyll"             # da-portal COPY source (rarely changes, but it IS a COPY input)
      # Chart-shipped self-built images (#1337). Both build from their own
      # directory, so the Dockerfile + its siblings are the whole input set.
      - "helm/federation-gateway/audit-sidecar/**"
      - "helm/vector/projection-gate/**"
      - ".github/workflows/component-docker-build.yaml"

concurrency:
  group: component-docker-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Since #1337 one leg clones github.com/google/mtail and downloads a Go
    # module graph. `git fetch -q` has no timeout of its own, and with
    # `fail-fast: false` a hung fetch would otherwise burn GitHub's 360-minute
    # default. Same value the nightly scan already uses for the same builds.
    timeout-minutes: 25
    strategy:
      fail-fast: false  # build all components so one break doesn't mask another
      matrix:
        # ⛔ Keep in sync with nightly-image-scan.yaml's `scan` matrix and with
        # `make docker-build-all` — this is now MECHANICAL, not prose:
        # test_selfbuilt_matrix_covers_every_dockerfile
        # (tests/ops/test_nightly_scan_matrix_drift.py) pins all three against
        # the repo's Dockerfile inventory (#1337).
        #
        # All 7 self-built Dockerfiles. The split below covers 5 of them; the
        # remaining 2 are the chart-shipped pair, and both are self-contained
        # (their build context is their own directory) — see their entries.
        #
        # 4 are self-contained (build from source in
        # Docker / COPY in-repo assets): threshold-exporter, da-portal, tenant-api,
        # recipe-preview — exactly where source-COPY paths drift (#472 da-portal
        # moved file, #473 exporter pkg/ COPY; recipe-preview COPYs the bundled
        # scripts/tools eval core). da-tools COPYs pre-built Go binaries + a build.sh-
        # assembled tools/ dir; we STUB those (empty tools/ + touch'd binaries, see
        # the stub step) so `docker build` validates the Dockerfile COPY *paths* +
        # syntax — the #472/#473 class — WITHOUT the Go cross-compile (that stays in
        # release.yaml; binary functionality is covered by Go CI). The stub proves
        # COPY targets resolve, not that binaries run.
        include:
          - name: threshold-exporter
            context: components/threshold-exporter/app
            dockerfile: components/threshold-exporter/app/Dockerfile
          - name: da-tools
            context: components/da-tools/app
            dockerfile: components/da-tools/app/Dockerfile
          - name: da-portal
            context: .
            dockerfile: components/da-portal/Dockerfile
          - name: tenant-api
            context: .
            dockerfile: components/tenant-api/Dockerfile
          - name: recipe-preview
            context: .
            dockerfile: components/recipe-preview/Dockerfile
          # Self-built but never published — they ship inside charts, so their
          # only pre-merge build coverage is right here (#1337).
          - name: federation-audit-sidecar
            context: helm/federation-gateway/audit-sidecar
            dockerfile: helm/federation-gateway/audit-sidecar/Dockerfile
          - name: vector-projection-gate
            context: helm/vector/projection-gate
            dockerfile: helm/vector/projection-gate/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # da-portal Dockerfile COPYs docs/assets/vendor/ (offline-mode assets that
      # release.yaml populates via vendor_download.sh). For a build SMOKE test we
      # only need the dir to exist — image falls back to CDN at runtime when empty.
      # Without this the build fails on "docs/assets/vendor: not found" (caught by
      # local `docker build` during #474 self-review — static YAML check would not).
      - name: Ensure da-portal vendor dir exists
        if: matrix.name == 'da-portal'
        run: mkdir -p docs/assets/vendor

      # da-tools Dockerfile COPYs a build.sh-assembled tools/ dir + 3 pre-built Go
      # binaries (da-guard / da-batchpr / da-parser). For a COPY-PATH smoke test we
      # stub them (empty dir + zero-byte files) instead of running the Go cross-
      # compile — the Dockerfile only COPY+chmod's the binaries (never RUNs them at
      # build time), so a stub validates COPY-path correctness + Dockerfile syntax
      # (#472/#473 class) at ~zero cost. Binary functionality is covered by Go CI.
      # Verified locally during #474 self-review (build succeeds with this stub).
      - name: Stub da-tools build inputs (COPY-path smoke only)
        if: matrix.name == 'da-tools'
        run: |
          mkdir -p components/da-tools/app/tools
          # #463 multi-arch: Dockerfile now COPYs da-<tool>.${TARGETARCH}.
          for b in da-guard da-batchpr da-parser; do
            for a in amd64 arm64; do
              touch "components/da-tools/app/$b.$a"
            done
          done

      # Hard gate: build must succeed. Catches #472/#473-class dormant breaks.
      - name: Build image (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: local-pr-test/${{ matrix.name }}:pr

      # Informational (exit-code 0, see header). Same severity/ignore-unfixed
      # contract as release.yaml so PR-time output matches release-time output.
      - name: Trivy CVE scan (informational)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: local-pr-test/${{ matrix.name }}:pr
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # recipe-preview: waive evidence-backed bundled-promtool CVEs so PR-time
          # output matches the release gate (components/recipe-preview/.trivyignore.yaml
          # + promtool.openvex.json). Empty → no-op for the other components.
          trivyignores: ${{ matrix.name == 'recipe-preview' && 'components/recipe-preview/.trivyignore.yaml' || '' }}
        continue-on-error: true
