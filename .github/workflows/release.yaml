# release.yaml — Build & push container images + Helm chart on tag
#
# 觸發條件：本檔 `on.push.tags` 就是發布線的清單（單一來源；文件不另行計數）：
#   - exporter/v*        → threshold-exporter Docker image + Helm chart
#   - tools/v*           → da-tools Docker image，以及 recipe-preview Docker image
#                          （#1040：同一個 tag、同一個 commit，見 Job 4）
#   - portal/v*          → da-portal Docker image + Helm chart (Interactive Tools Portal)
#   - tenant-api/v*      → tenant-api Docker image + Helm chart
#   - v*                 → platform tag，僅用於 GitHub Release 錨點，不觸發 build
#                          （故不在 on.push.tags 裡）
#
# 產出：
#   - ghcr.io/vencil/threshold-exporter:v<version>  (Docker image, v-prefixed)
#   - ghcr.io/vencil/da-tools:v<da-tools-version>    (Docker image, v-prefixed)
#   - ghcr.io/vencil/recipe-preview:v<da-tools-version> (Docker image；tenant-api
#     chart 的 recipe-preview 容器，tag 跟隨 generator.image.tag)
#   - ghcr.io/vencil/da-portal:v<version>             (Docker image, v-prefixed)
#   - ghcr.io/vencil/tenant-api:v<version>             (Docker image, v-prefixed)
#   - oci://ghcr.io/vencil/charts/threshold-exporter (Helm chart)
#   - oci://ghcr.io/vencil/charts/da-portal          (Helm chart, #1352 案例 A)
#   - oci://ghcr.io/vencil/charts/tenant-api         (Helm chart)
#
# ⛔ 宣告 ≠ 已發布（#1352）。上面每一列是「切了對應 tag 之後這支 workflow 會
#   產出的東西」。recipe-preview image 從下一個 tools/v* 起才會產出：
#   tools/v2.9.0 以前它只由從未被切過的 recipe-preview/v* 線建置，所以
#   ghcr.io/vencil/recipe-preview 目前不存在。哪個 tools tag 建了它，由
#   scripts/tools/lint/check_image_pin_capability.py 解析該 tag 的本檔判定。
#
# 前置條件：
#   - Repository Settings → Actions → Workflow permissions → Read and write
#   - 或建立 PAT 並設為 GHCR_TOKEN secret
#
# ⛔ 先掃再發布（#1278）。每個 component job 的順序是：
#   build → push 到「候選 tag」`:candidate-<run_id>-<run_attempt>`
#   → Trivy 掃 build step 輸出的那個 digest（hard gate，exit-code 1）
#   →（da-tools / recipe-preview）cosign 簽 digest → `docker buildx imagetools
#     create` 把正式 tag（`:latest`、`:v<version>`）指到「同一個 digest」並回讀
#     驗證 → 之後才 SBOM、helm push、GitHub Release。
#   所以掃到可修的 HIGH/CRITICAL 時，客戶拉得到的東西（正式 tag、chart、簽章、
#   Release）一件都不會出現。候選 tag 不刻意清理——理由見
#   docs/internal/github-release-playbook.md §Release-gate 陷阱。
#   順序由 tests/ops/test_release_scan_before_publish.py 解析本檔守住；同一支
#   也守「掃描擋得住」（#3870）：Trivy 步驟只准 name/uses/with（無 if、
#   continue-on-error、env），exit-code 字面 1，severity／ignore-unfixed 取
#   tests/_trivy_contract.py（三個掃描共用的單一來源），trivyignores 只准該
#   映像自己的 components/<image>/.trivyignore.yaml，掃描之後的步驟 if 不得
#   呼叫狀態函式，任何層級的 env 不得設 TRIVY_*，repo 根目錄不得有 Trivy 預設
#   會讀的 trivy.yaml／trivy-secret.yaml。
#   da-tools 另在 Trivy 之後、簽章與 promote 之前，對同一個 digest 實際執行映像
#   （scripts/ops/smoke_da_tools_image.sh，#3258）；不過就不發布。位置由
#   tests/ops/test_release_da_tools_smoke.py 守住。
#
# ⛔ 已發布的版號不可變（#3848）。寫 registry 與 GitHub Release 的動作只有一個
#   入口：scripts/tools/dx/release_publish.py（image / chart / assets）。檢查在
#   發布動作「裡面」，不是旁邊一個可被繞過的步驟：
#   - 映像正式 tag 已存在 → 讀它的 org.opencontainers.image.revision label；
#     等於 github.sha 就什麼都不寫（`latest` 也不動），不同或沒有 label 就失敗；
#     要發布時 `latest` 先寫、版號 tag 最後寫，中途失敗時版號不存在、re-run 會補上；
#   - chart 版號已存在 → 與這次打包的 .tgz 逐檔比對（Chart.yaml 以 `helm show chart` 的輸出比），
#     相同就不 push，不同就失敗並列出檔案；
#   - Release 資產絕不覆蓋：全在就不傳、全不在就全傳、只有一部分就失敗。
#   只有 registry 回「沒有這個 manifest」（404）才算第一次發布；其餘（401/403、
#   5xx、429、斷線、內容對不上 digest）一律 rc 2、job 失敗。本檔其他步驟一律
#   不得出現發布指令，每個 build 都寫入 revision label，同一個 tag 的 run 不並行
#   （concurrency）——由 tests/ops/test_release_immutable_wiring.py 解析本檔守住。

name: Release

on:
  push:
    tags:
      - "exporter/v*"
      - "tools/v*"
      - "portal/v*"
      - "tenant-api/v*"

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: vencil

permissions:
  contents: read
  packages: write

# #3848: two runs for one tag (a re-run while the first is still going) would
# both find the version absent and both publish. Queued, never cancelled: a
# cancelled release stops half way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------
  # Job 1: Build & push threshold-exporter image + Helm chart
  # ----------------------------------------------------------------
  release-exporter:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/exporter/')
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#exporter/v}" >> "$GITHUB_OUTPUT"

      - name: Verify Chart.yaml version matches tag
        run: |
          CHART_VER=$(grep '^version:' helm/threshold-exporter/Chart.yaml | awk '{print $2}')
          if [ "$CHART_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: Chart.yaml version ($CHART_VER) != tag (${{ steps.version.outputs.VERSION }})"
            echo "Run: make bump-docs EXPORTER=${{ steps.version.outputs.VERSION }}"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Docker image (multi-arch: amd64 + arm64, #463) ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # #1278: push ONLY a candidate tag. The formal `:v<version>` / `:latest`
      # tags appear later, by promotion of this step's digest, and only if the
      # Trivy scan of that digest passes.
      - name: Build and push threshold-exporter candidate image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # Repo root: the builder runs scripts/ops/go_build.sh (#3425);
          # Dockerfile.dockerignore next to the Dockerfile narrows the context.
          context: .
          file: components/threshold-exporter/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # #3848: the commit this image is built from, read back before a
          # re-run may skip promotion (release_publish.py image).
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/threshold-exporter:candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify multi-arch manifest (#463)
        run: bash scripts/ops/verify_multiarch.sh ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/threshold-exporter@${{ steps.build.outputs.digest }}

      # --- Helm chart: package + verify now (fail fast, publishes nothing);
      # `helm push` waits until the image digest has passed the scan ---
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # Explicit, never the action's `latest` default (which silently
          # crossed Helm 3→4). tests/shared/test_toolchain_pin_parity.py.
          version: v4.3.0

      - name: Package Helm chart
        run: |
          mkdir -p .build
          helm package helm/threshold-exporter -d .build/

      # ⛔ #1755: assert what the archive CONTAINS before it is published. The
      # source-tree gate (check_chart_ship_surface.py) runs on every PR; this one
      # reads the .tgz itself, which is the only place a package-time surprise —
      # a stray file written by an earlier step, a newly pulled subchart — is
      # visible. `check_chart_ship_surface.py` asserts this step still exists.
      - name: Verify packaged chart contents (#1755)
        run: |
          python3 -X utf8 scripts/tools/lint/check_chart_package_contents.py \
            --chart helm/threshold-exporter \
            --tgz .build/threshold-exporter-${{ steps.version.outputs.VERSION }}.tgz

      # --- Security scan (PRE-publish hard gate — exit-code 1; #1278) ---
      # Scans the candidate DIGEST the build step produced — the exact object
      # the promotion step below re-tags — so "scanned" and "published" cannot
      # diverge. A fixable HIGH/CRITICAL fails the job here, and nothing a
      # customer pulls (formal tags, chart) has been created yet. (#1337 had
      # to document the opposite: this used to run after the image AND the
      # chart were already public.)
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Trivy binary pinned (the action's own default moves with every
          # action bump). Same version as Makefile TRIVY_VERSION and
          # .devcontainer/install-trivy.sh — tests/shared/test_toolchain_pin_parity.py.
          version: v0.74.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/threshold-exporter@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # #3848 fail-fast: a chart version already published with other content
      # fails the job here, before the image is published. Not the gate — the
      # chart publish step below re-checks inside the push.
      - name: Check the chart version is not already published (#3848)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHARTS: oci://${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/charts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -X utf8 scripts/tools/dx/check_release_immutable.py chart --tgz ".build/threshold-exporter-${VERSION}.tgz" --registry "$CHARTS"

      # ⛔ #3848: the ONLY step that writes this image's release tags. The check
      # lives inside the publish (scripts/tools/dx/release_publish.py), so it
      # cannot be stepped around: `v<version>` absent → (--sign: sign, then) promote the
      # SCANNED digest, `latest` first and the version last, each read back;
      # already published from this commit → nothing written, `latest` untouched;
      # from another commit / without a revision label → fail. Registry 401/403/
      # 5xx/no answer → rc 2. REGISTRY_* are used only if the anonymous read is
      # refused. tests/ops/test_release_immutable_wiring.py keeps every other
      # step free of publishing commands.
      - name: Publish image (#3848)
        id: image_publish
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/threshold-exporter
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REVISION: ${{ github.sha }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 -X utf8 scripts/tools/dx/release_publish.py image --image "$IMG"
          --digest "$DIGEST" --revision "$REVISION" --tag "v${VERSION}" --tag latest

      # --- L3 supply-chain digest verification (#445 AC iii) ---
      # Verifies the image at Chart.yaml `appVersion` tag actually exists
      # in GHCR + captures digest for the release audit trail. For
      # threshold-exporter, appVersion==chart-version==tag-version, so
      # this is effectively "confirm what we just promoted is queryable".
      # Runs after promotion because it probes the formal `:v<version>` tag.
      # See docs/internal/secret-leak-remediation-sop.md for the full
      # L0/L1/L2/L3 framing.
      - name: Verify image digest (#445 AC iii)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ops/verify_release_digest.sh threshold-exporter helm/threshold-exporter/Chart.yaml

      # ⛔ #3848: the ONLY step that pushes the chart. Absent → `helm push`; the
      # same files already published → nothing pushed; different → fail.
      - name: Publish Helm chart (#3848)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHARTS: oci://${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/charts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -X utf8 scripts/tools/dx/release_publish.py chart --tgz ".build/threshold-exporter-${VERSION}.tgz" --registry "$CHARTS"

  # ----------------------------------------------------------------
  # Job 2: Build & push da-tools image + da-guard binaries (C-11)
  # ----------------------------------------------------------------
  # v2.8.0 C-11 extends this job with three customer-delivery formats
  # for the migration toolkit (tools/v* release line):
  #
  #   (a) Docker image at ghcr.io (existing path)
  #   (b) Cross-compiled da-guard binaries for direct download
  #       (linux/darwin/windows × amd64/arm64 → 6 archives + SHA256SUMS)
  #   (c) docker save of the image as gzipped tar for air-gapped
  #       environments (customers who can't pull from ghcr.io)
  #
  # Customer chooses install path at the GitHub Release page; see
  # docs/migration-toolkit-installation.md for the install matrix.
  release-da-tools:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/tools/')
    permissions:
      contents: write   # gh release create / upload
      packages: write   # ghcr push (inherited)
      # C-11 PR-3 Layer 1: id-token:write enables sigstore "keyless"
      # signing — cosign exchanges the GitHub OIDC token for an
      # ephemeral X.509 cert from Fulcio, signs the artefact, and
      # publishes the entry in the public Rekor transparency log.
      # No long-term private keys to manage. See
      # docs/internal/release-signing-runbook.md §Layer 1.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#tools/v}" >> "$GITHUB_OUTPUT"

      # C-11: pin tools/v* tag against the in-tree VERSION file so
      # forgot-to-bump errors surface at release time, not after the
      # image is already on ghcr.io.
      - name: Verify VERSION file matches tag
        run: |
          FILE_VER=$(tr -d '[:space:]' < components/da-tools/app/VERSION)
          if [ "$FILE_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: components/da-tools/app/VERSION ($FILE_VER) != tag (${{ steps.version.outputs.VERSION }})"
            echo "Run: make bump-docs TOOLS=${{ steps.version.outputs.VERSION }} && commit before re-tagging"
            exit 1
          fi

      # #1425: `da-tools init` pins the threshold-exporter chart at
      # exporter/v<THRESHOLD_EXPORTER_CHART_VERSION>; the image built here must
      # not print settings that published chart lacks. The playbook pushes
      # exporter/v* before tools/v*, so the tag must already exist; full
      # history and tags are fetched only here, for the diff against it.
      - name: Verify init's pinned chart is the chart in the tree
        run: |
          git fetch --quiet --tags --unshallow origin || git fetch --quiet --tags origin
          python3 scripts/tools/lint/check_init_chart_pin_published.py --require-tag

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Go is required for build.sh's da-guard bundling step (the
      # linux/amd64 binary baked into the image) AND for the
      # cross-compile matrix below.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: components/threshold-exporter/app/go.mod
          cache: true
          cache-dependency-path: components/threshold-exporter/app/go.sum

      # C-11 PR-3 Layer 1: install cosign + syft. cosign signs both the
      # binary archives and the Docker image with sigstore keyless
      # (no long-term private key); syft generates SPDX + CycloneDX
      # SBOM for the image. Both pinned to specific versions to
      # avoid silent supply-chain drift — bump deliberately.
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: v2.4.1

      - name: Install syft
        uses: anchore/sbom-action/download-syft@fc46e51fd3cb168ffb36c6d1915723c47db58abb # v0.17.7
        with:
          syft-version: v1.18.1

      - name: Assemble da-tools build context
        run: |
          cd components/da-tools/app
          bash build.sh --assemble-only

      # Multi-arch (#463): build.sh above cross-compiled the bundled binaries
      # per-arch (da-guard.amd64/.arm64 …); the Dockerfile COPYs by TARGETARCH.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # #1278: candidate tag only — see release-exporter for the flow.
      - name: Build and push da-tools candidate image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: components/da-tools/app
          platforms: linux/amd64,linux/arm64
          push: true
          # #3848: the commit this image is built from, read back before a
          # re-run may skip promotion (release_publish.py image).
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools:candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify multi-arch manifest (#463)
        run: bash scripts/ops/verify_multiarch.sh ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools@${{ steps.build.outputs.digest }}

      # PRE-publish hard gate on the candidate digest (#1278).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Trivy binary pinned (the action's own default moves with every
          # action bump). Same version as Makefile TRIVY_VERSION and
          # .devcontainer/install-trivy.sh — tests/shared/test_toolchain_pin_parity.py.
          version: v0.74.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # #3258: EXECUTE the candidate before it is signed or promoted. Trivy
      # reads the image's packages; nothing else in this release runs it, and
      # the PR-time build stubs tools/ and the Go binaries. So an entrypoint
      # that no longer matches COMMAND_MAP, a missing dependency, or an image
      # uid that cannot read mounted files would otherwise reach a customer's
      # pipeline first. Same digest as Trivy and promotion (amd64 slice).
      # tests/ops/test_release_da_tools_smoke.py pins this step's place.
      - name: Smoke-test candidate image (#3258)
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::build step produced no digest ('$DIGEST')"; exit 1; }
          bash scripts/ops/smoke_da_tools_image.sh "${IMG}@${DIGEST}"

      # ⛔ #3848: the ONLY step that writes this image's release tags. The check
      # lives inside the publish (scripts/tools/dx/release_publish.py), so it
      # cannot be stepped around: `v<version>` absent → (--sign: sign, then) promote the
      # SCANNED digest, `latest` first and the version last, each read back;
      # already published from this commit → nothing written, `latest` untouched;
      # from another commit / without a revision label → fail. Registry 401/403/
      # 5xx/no answer → rc 2. REGISTRY_* are used only if the anonymous read is
      # refused. tests/ops/test_release_immutable_wiring.py keeps every other
      # step free of publishing commands.
      # Signs the scanned digest (cosign keyless, by digest) BEFORE any tag is
      # written, so a formal tag never exists unsigned (needs id-token: write).
      - name: Publish image (#3848)
        id: image_publish
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REVISION: ${{ github.sha }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
        run: >-
          python3 -X utf8 scripts/tools/dx/release_publish.py image --image "$IMG"
          --digest "$DIGEST" --revision "$REVISION" --tag "v${VERSION}" --tag latest --sign

      # --- L3 supply-chain digest verification (#445 AC iii) ---
      # da-tools has no Helm chart — components/da-tools/app/VERSION is the
      # SoT, and we verify the image at v${VERSION} directly. Catches
      # silent push failure or VERSION/tag drift. After promotion: it probes
      # the formal tag.
      - name: Verify image digest (#445 AC iii)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ops/verify_release_digest.sh da-tools

      # C-11 PR-3 Layer 1: generate SBOM (Software Bill of Materials)
      # for the Docker image in BOTH SPDX and CycloneDX formats.
      # Different customer security teams prefer different formats;
      # shipping both costs ~50KB and avoids "we don't accept that
      # format" rejection on first onboarding review. Generated from the
      # digest the release tag names, not a tag lookup (#1278): the scanned
      # candidate just promoted, or — on a re-run that skipped promotion
      # (#3848) — the digest already published, never this run's rebuild.
      - name: Generate SBOM for Docker image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools
          DIGEST: ${{ steps.image_publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::no release digest ('$DIGEST')"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sbom"
          syft "${IMG}@${DIGEST}" -o spdx-json="$RUNNER_TEMP/sbom/da-tools-image-v${VERSION}.spdx.json"
          syft "${IMG}@${DIGEST}" -o cyclonedx-json="$RUNNER_TEMP/sbom/da-tools-image-v${VERSION}.cyclonedx.json"
          ls -la "$RUNNER_TEMP/sbom/"

      # Sign the SBOM files too — a tampered SBOM defeats the whole
      # supply-chain story. cosign sign-blob produces detached .sig
      # + .cert files that customers verify alongside the SBOM.
      - name: Sign SBOM files (cosign keyless)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sbom"
          for f in *.spdx.json *.cyclonedx.json; do
            echo "▸ Signing $f"
            cosign sign-blob --yes \
                --output-signature "${f}.sig" \
                --output-certificate "${f}.cert" \
                "$f"
          done
          ls -la

      # ----------------------------------------------------------------
      # C-11 extras: cross-compile binaries + air-gapped tar + Release
      # ----------------------------------------------------------------

      - name: Cross-compile da-guard + da-batchpr + da-parser binaries (6 OS/ARCH each)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/da-guard-bin"
          # All three Go CLIs use the same matrix + ldflags. C-10 PR-5
          # added da-batchpr alongside da-guard; C-8 PR-2 adds
          # da-parser for the Prometheus rule import path. The build flags
          # are scripts/ops/go_build.sh's (#3425), as the da-tools image's.
          for BIN in da-guard da-batchpr da-parser; do
            for OS in linux darwin windows; do
              for ARCH in amd64 arm64; do
                EXT=""
                [ "$OS" = "windows" ] && EXT=".exe"
                OUT="$RUNNER_TEMP/da-guard-bin/${BIN}-${OS}-${ARCH}${EXT}"
                echo "▸ Building ${BIN} $OS/$ARCH..."
                sh scripts/ops/go_build.sh -X "main.Version=v${VERSION}" \
                    --goos "$OS" --goarch "$ARCH" \
                    components/threshold-exporter/app "./cmd/${BIN}" "$OUT"
              done
            done
          done
          ls -la "$RUNNER_TEMP/da-guard-bin/"

      - name: Package binaries (tarball / zip + SHA256SUMS)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/da-guard-bin"
          # Linux + macOS: tar.gz. Windows: zip (Windows users
          # commonly lack tar/gzip; zip is universal).
          # Globs cover all three binaries (guard / batchpr / parser).
          for f in da-guard-linux-* da-guard-darwin-* \
                   da-batchpr-linux-* da-batchpr-darwin-* \
                   da-parser-linux-* da-parser-darwin-*; do
            tar czf "${f}.tar.gz" "$f"
          done
          for f in da-guard-windows-* da-batchpr-windows-* da-parser-windows-*; do
            zip -q "${f%.exe}.zip" "$f"
          done
          # Sum every artefact reviewers can download, including the
          # raw binaries for security-team teams that prefer to verify
          # the binary directly rather than the archive.
          sha256sum da-guard-linux-* da-guard-darwin-* da-guard-windows-* \
                    da-batchpr-linux-* da-batchpr-darwin-* da-batchpr-windows-* \
                    da-parser-linux-* da-parser-darwin-* da-parser-windows-* \
                    *.tar.gz *.zip > SHA256SUMS
          echo "--- Archive listing ---"
          ls -la

      # C-11 PR-3 Layer 1: sign every distributable archive + the
      # SHA256SUMS index. Customers who can verify cosign get a
      # cryptographic guarantee that the archive came from THIS repo's
      # tools/v* release workflow run; SHA256SUMS-only customers are
      # still served (we don't break their flow). Per-archive .sig +
      # .cert files are tiny (~5KB combined) and uploaded alongside
      # the archives in the GitHub Release.
      - name: Sign archives + SHA256SUMS (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/da-guard-bin"
          # Sign each archive + the SHA256SUMS index. Customers can
          # then verify EITHER an individual archive OR the full
          # SHA256SUMS (and validate any archive against the verified
          # index — common GPG-style pattern carried across to cosign).
          for f in *.tar.gz *.zip SHA256SUMS; do
            echo "▸ Signing $f"
            cosign sign-blob --yes \
                --output-signature "${f}.sig" \
                --output-certificate "${f}.cert" \
                "$f"
          done
          echo "--- Signature listing ---"
          ls -la *.sig *.cert | head

      - name: Save image as gzipped tar (air-gapped customers)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          DIGEST: ${{ steps.image_publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::no release digest ('$DIGEST')"; exit 1; }
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools"
          IMG="${REPO}:v${VERSION}"
          OUT="$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz"
          # Pull the digest the release tag names (#1278; #3848: the published
          # one on a re-run), then tag it so `docker load` on the air-gapped
          # side yields the familiar `da-tools:v<ver>`.
          docker pull "${REPO}@${DIGEST}"
          docker tag "${REPO}@${DIGEST}" "$IMG"
          docker save "$IMG" | gzip > "$OUT"
          ( cd "$RUNNER_TEMP" && sha256sum "$(basename "$OUT")" > "${OUT}.sha256" )
          ls -la "$OUT" "$OUT.sha256"

      # Sign the air-gapped image tar with cosign too. Air-gapped
      # customers can't reach Rekor at verify-time, but they CAN
      # carry the .sig/.cert in alongside the tar and verify
      # offline IF they pre-sync the Sigstore TUF root (cosign
      # initialize) — see release-signing-runbook.md §Layer 1
      # air-gapped verify path.
      - name: Sign air-gapped image tar (cosign keyless)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz"
          cosign sign-blob --yes \
              --output-signature "${OUT}.sig" \
              --output-certificate "${OUT}.cert" \
              "$OUT"
          ls -la "${OUT}.sig" "${OUT}.cert"

      # ⛔ #3848: Release assets are never replaced (no --clobber): a re-run
      # rebuilds the archives, whose bytes differ (mtimes), so a replaced asset
      # would no longer match what customers downloaded and checksummed. All
      # present → nothing uploaded; none → all uploaded; some → fail (delete
      # the partial set, then re-run). Release absent → created with
      # --generate-notes; a Release the maintainer pre-created is kept.
      # Signatures (cosign keyless) and the SBOM (SPDX + CycloneDX) are part of
      # the set; customer verification: docs/migration-toolkit-installation.md.
      - name: Publish GitHub Release assets (#3848)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: >-
          python3 -X utf8 scripts/tools/dx/release_publish.py assets
          --tag "$GITHUB_REF_NAME" --title "da-tools v${VERSION} — Migration Toolkit"
          "$RUNNER_TEMP/da-guard-bin/"*.tar.gz "$RUNNER_TEMP/da-guard-bin/"*.zip
          "$RUNNER_TEMP/da-guard-bin/SHA256SUMS"
          "$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz"
          "$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz.sha256"
          "$RUNNER_TEMP/da-guard-bin/"*.sig "$RUNNER_TEMP/da-guard-bin/"*.cert
          "$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz.sig"
          "$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz.cert"
          "$RUNNER_TEMP/sbom/"*.json "$RUNNER_TEMP/sbom/"*.sig "$RUNNER_TEMP/sbom/"*.cert

  # ----------------------------------------------------------------
  # Job 3: Build & push da-portal image (Interactive Tools Portal)
  # ----------------------------------------------------------------
  release-portal:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/portal/')
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#portal/v}" >> "$GITHUB_OUTPUT"

      - name: Verify Chart.yaml version matches tag
        # Added with #445 AC iii — release-portal previously lacked this
        # consistency gate that release-exporter / release-tenant-api
        # already had.
        run: |
          CHART_VER=$(grep '^version:' helm/da-portal/Chart.yaml | awk '{print $2}')
          if [ "$CHART_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: helm/da-portal/Chart.yaml version ($CHART_VER) != tag (${{ steps.version.outputs.VERSION }})"
            echo "Run: make bump-docs PORTAL=${{ steps.version.outputs.VERSION }}"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download vendor files for offline mode
        run: bash scripts/tools/vendor_download.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # #1278: candidate tag only — see release-exporter for the flow.
      - name: Build and push da-portal candidate image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: components/da-portal/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # #3848: the commit this image is built from, read back before a
          # re-run may skip promotion (release_publish.py image).
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-portal:candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify multi-arch manifest (#463)
        run: bash scripts/ops/verify_multiarch.sh ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-portal@${{ steps.build.outputs.digest }}

      # --- Helm chart (#1352 case A) ---
      # ⛔ Added because the customer-facing install path was a lie: this job
      # gated Chart.yaml version == tag and bump_docs.py kept the README's
      # `oci://…/charts/da-portal --version` string fresh, while nothing ever
      # packaged or pushed that chart. check_chart_pull_surface.py now asserts
      # the pair. Packaged + verified here (fails fast, publishes nothing);
      # `helm push` waits until the image digest has passed the scan (#1278),
      # so a scan failure withholds image AND chart together.
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # Explicit, never the action's `latest` default (which silently
          # crossed Helm 3→4). tests/shared/test_toolchain_pin_parity.py.
          version: v4.3.0

      - name: Package Helm chart
        run: |
          mkdir -p .build
          helm package helm/da-portal -d .build/

      # ⛔ #1755: assert what the archive CONTAINS before it is published. The
      # source-tree gate (check_chart_ship_surface.py) runs on every PR; this one
      # reads the .tgz itself, which is the only place a package-time surprise —
      # a stray file written by an earlier step, a newly pulled subchart — is
      # visible. `check_chart_ship_surface.py` asserts this step still exists.
      - name: Verify packaged chart contents (#1755)
        run: |
          python3 -X utf8 scripts/tools/lint/check_chart_package_contents.py \
            --chart helm/da-portal \
            --tgz .build/da-portal-${{ steps.version.outputs.VERSION }}.tgz

      # PRE-publish hard gate on the candidate digest (#1278).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Trivy binary pinned (the action's own default moves with every
          # action bump). Same version as Makefile TRIVY_VERSION and
          # .devcontainer/install-trivy.sh — tests/shared/test_toolchain_pin_parity.py.
          version: v0.74.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-portal@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # #3848 fail-fast: a chart version already published with other content
      # fails the job here, before the image is published. Not the gate — the
      # chart publish step below re-checks inside the push.
      - name: Check the chart version is not already published (#3848)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHARTS: oci://${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/charts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -X utf8 scripts/tools/dx/check_release_immutable.py chart --tgz ".build/da-portal-${VERSION}.tgz" --registry "$CHARTS"

      # ⛔ #3848: the ONLY step that writes this image's release tags. The check
      # lives inside the publish (scripts/tools/dx/release_publish.py), so it
      # cannot be stepped around: `v<version>` absent → (--sign: sign, then) promote the
      # SCANNED digest, `latest` first and the version last, each read back;
      # already published from this commit → nothing written, `latest` untouched;
      # from another commit / without a revision label → fail. Registry 401/403/
      # 5xx/no answer → rc 2. REGISTRY_* are used only if the anonymous read is
      # refused. tests/ops/test_release_immutable_wiring.py keeps every other
      # step free of publishing commands.
      - name: Publish image (#3848)
        id: image_publish
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-portal
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REVISION: ${{ github.sha }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 -X utf8 scripts/tools/dx/release_publish.py image --image "$IMG"
          --digest "$DIGEST" --revision "$REVISION" --tag "v${VERSION}" --tag latest

      # --- L3 supply-chain digest verification (#445 AC iii) ---
      # After promotion: it probes the formal `:v<version>` tag.
      - name: Verify image digest (#445 AC iii)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ops/verify_release_digest.sh da-portal helm/da-portal/Chart.yaml

      # ⛔ #3848: the ONLY step that pushes the chart. Absent → `helm push`; the
      # same files already published → nothing pushed; different → fail.
      - name: Publish Helm chart (#3848)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHARTS: oci://${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/charts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -X utf8 scripts/tools/dx/release_publish.py chart --tgz ".build/da-portal-${VERSION}.tgz" --registry "$CHARTS"

  # ----------------------------------------------------------------
  # Job 4: Build & push recipe-preview image (#657, #1040)
  # ----------------------------------------------------------------
  # Runs on the tools/v* tag, beside release-da-tools: one tag, one commit,
  # two images. The tenant-api chart's recipe-preview container takes its tag
  # from generator.image.tag (the da-tools pin), so the image that previews a
  # recipe carries the same bundled compiler (da-guard) as the generator that
  # judges the write. It has no chart and no release line of its own (#1040
  # removed both; the recipe-preview/v* line was never cut).
  # ⛔ check_image_pin_capability.py parses this job's `if:` at a pinned tools
  # tag to decide whether that tag built this image: keep the job name and the
  # refs/tags/tools/ condition, or the gate stops recognising releases.
  # The image bundles a SHA-pinned promtool because the firing/inactive verdict
  # format is version-bound; PROM_VERSION + amd64 digest == ci.yml's promtool gate
  # is CI-enforced (tests/preview/test_promtool_pin_parity.py).
  release-recipe-preview:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/tools/')
    permissions:
      contents: read
      packages: write
      # cosign keyless signing (sigstore): exchange the GitHub OIDC token for an
      # ephemeral Fulcio cert, publish to the Rekor transparency log — no
      # long-term keys. Job-level perms REPLACE the workflow default, so
      # contents/packages are re-declared here.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#tools/v}" >> "$GITHUB_OUTPUT"

      # Same check as release-da-tools: the tag is the da-tools version.
      - name: Verify VERSION file matches tag
        run: |
          FILE_VER=$(tr -d '[:space:]' < components/da-tools/app/VERSION)
          if [ "$FILE_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: components/da-tools/app/VERSION ($FILE_VER) != tag (${{ steps.version.outputs.VERSION }})"
            echo "Run: make bump-docs TOOLS=${{ steps.version.outputs.VERSION }} && commit before re-tagging"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: v2.4.1

      # --- Docker image (multi-arch: amd64 + arm64, #463) ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # #1278: candidate tag only — see release-exporter for the flow.
      - name: Build and push recipe-preview candidate image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: components/recipe-preview/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # GIT_SHA → image ENV → /healthz, so an operator can confirm which
          # commit's bundled compiler snapshot is running (drift observability).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Machine-readable provenance: stamp the source commit into the image
          # MANIFEST as standard OCI annotations, so admission controllers /
          # scanners (Kyverno, cosign policy, etc.) can read it WITHOUT pulling +
          # running the image — the manifest-level complement to the runtime
          # GIT_SHA in /healthz (+ the cosign signature + SBOM). Sibling component
          # jobs can adopt the same block.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recipe-preview:candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify multi-arch manifest (#463)
        run: bash scripts/ops/verify_multiarch.sh ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recipe-preview@${{ steps.build.outputs.digest }}

      # --- Security scan (PRE-publish hard gate on the candidate digest; #1278) ---
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Trivy binary pinned (the action's own default moves with every
          # action bump). Same version as Makefile TRIVY_VERSION and
          # .devcontainer/install-trivy.sh — tests/shared/test_toolchain_pin_parity.py.
          version: v0.74.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recipe-preview@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Bundled-promtool (Prometheus) binary CVEs only — recipe-preview ships no
          # first-party Go. ⛔ WHICH ids are waived, on what evidence and until when is
          # deliberately NOT summarised here — read the register. A prose summary of
          # it has nothing asserting it, and the one that used to sit here had gone
          # stale against a register that was rewritten under it. Evidence +
          # governance: .trivyignore.yaml + promtool.openvex.json in
          # components/recipe-preview/. Gate stays HARD (exit-code 1) — only the
          # register's entries are waived.
          trivyignores: components/recipe-preview/.trivyignore.yaml

      # ⛔ #3848: the ONLY step that writes this image's release tags. The check
      # lives inside the publish (scripts/tools/dx/release_publish.py), so it
      # cannot be stepped around: `v<version>` absent → (--sign: sign, then) promote the
      # SCANNED digest, `latest` first and the version last, each read back;
      # already published from this commit → nothing written, `latest` untouched;
      # from another commit / without a revision label → fail. Registry 401/403/
      # 5xx/no answer → rc 2. REGISTRY_* are used only if the anonymous read is
      # refused. tests/ops/test_release_immutable_wiring.py keeps every other
      # step free of publishing commands.
      # Signs the scanned digest (cosign keyless, by digest) BEFORE any tag is
      # written, so a formal tag never exists unsigned (needs id-token: write).
      - name: Publish image (#3848)
        id: image_publish
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recipe-preview
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REVISION: ${{ github.sha }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
        run: >-
          python3 -X utf8 scripts/tools/dx/release_publish.py image --image "$IMG"
          --digest "$DIGEST" --revision "$REVISION" --tag "v${VERSION}" --tag latest --sign

      # --- L3 supply-chain digest verification (#445 AC iii) ---
      # Confirms the image we just promoted is queryable in GHCR (no chart).
      - name: Verify image digest (#445 AC iii)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ops/verify_release_digest.sh recipe-preview

  # ----------------------------------------------------------------
  # Job 5: Build & push tenant-api image + Helm chart
  # ----------------------------------------------------------------
  release-tenant-api:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/tenant-api/')
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#tenant-api/v}" >> "$GITHUB_OUTPUT"

      - name: Verify Chart.yaml version matches tag
        run: |
          CHART_VER=$(grep '^version:' helm/tenant-api/Chart.yaml | awk '{print $2}')
          if [ "$CHART_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: Chart.yaml version ($CHART_VER) != tag (${{ steps.version.outputs.VERSION }})"
            exit 1
          fi

      # #3228: one version for the chart, the image and the tag. The image
      # below is built from this commit and pushed as `:v<tag>`, and the
      # chart's default image is `:v<appVersion>`, so an appVersion that
      # differs from the tag ships a chart pointing at some other binary.
      - name: Verify Chart.yaml appVersion matches version and tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          APP_VER=$(grep '^appVersion:' helm/tenant-api/Chart.yaml | awk '{print $2}' | tr -d "\"'")
          if [ "$APP_VER" != "$VERSION" ]; then
            echo "ERROR: helm/tenant-api/Chart.yaml appVersion ($APP_VER) != version/tag ($VERSION)"
            echo "Run: make bump-docs TENANT_API=$VERSION"
            exit 1
          fi

      # ⛔ #3228: the chart is not released while its DEFAULT pins name a
      # da-tools / recipe-preview image that cannot run the container the
      # chart starts from it. The PR gate (image-pin-capability-check) honours
      # the registered EXEMPTIONS so PRs stay green until a capable tools/v*
      # tag exists; a release must not ride on them, so they are refused here.
      # Until that tools release (and bump_docs.py --tools moving
      # generator.image.tag to it), this step fails BY DESIGN: tenant-api is
      # released after tools. It runs before the image build, so a refusal
      # leaves no candidate image or promoted tag behind (it needs neither).
      # tests/ops/test_release_tenant_api_pin_capability_gate.py
      - name: Set up Python (image-pin capability gate)
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install PyYAML (image-pin capability gate)
        run: pip install pyyaml -c requirements/ci-constraints.txt

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # Explicit, never the action's `latest` default (which silently
          # crossed Helm 3→4). tests/shared/test_toolchain_pin_parity.py.
          version: v4.3.0

      - name: Set up Go (da-crdecode, for the image-pin and rendered-chart checks)
        uses: actions/setup-go@v6
        with:
          go-version-file: components/threshold-exporter/app/go.mod
          cache: true
          cache-dependency-path: components/threshold-exporter/app/go.sum

      # The gate reads each pinned tools/vX.Y.Z tag's tree (`git show`); the
      # default checkout has no tags, and without them the gate exits 2.
      - name: Verify the chart's da-tools pins can run, exemptions refused (#3228)
        run: |
          git fetch --quiet --tags origin
          bash scripts/ops/with_da_crdecode.sh python3 -X utf8 scripts/tools/lint/check_image_pin_capability.py --chart helm/tenant-api --refuse-exemptions

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Docker image (multi-arch: amd64 + arm64, #463) ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # #1278: candidate tag only — see release-exporter for the flow.
      - name: Build and push tenant-api candidate image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: components/tenant-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # ADR-036 §12: the version `state show` / `config check` print
          # (Dockerfile ARG VERSION → -X main.version).
          build-args: |
            VERSION=v${{ steps.version.outputs.VERSION }}
          # #3848: the commit this image is built from, read back before a
          # re-run may skip promotion (release_publish.py image).
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tenant-api:candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify multi-arch manifest (#463)
        run: bash scripts/ops/verify_multiarch.sh ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tenant-api@${{ steps.build.outputs.digest }}

      # --- Helm chart: package + verify now (fail fast, publishes nothing);
      # `helm push` waits until the image digest has passed the scan (#1278) ---
      - name: Package Helm chart
        run: |
          mkdir -p .build
          helm package helm/tenant-api -d .build/

      # ⛔ #1755: assert what the archive CONTAINS before it is published. The
      # source-tree gate (check_chart_ship_surface.py) runs on every PR; this one
      # reads the .tgz itself, which is the only place a package-time surprise —
      # a stray file written by an earlier step, a newly pulled subchart — is
      # visible. `check_chart_ship_surface.py` asserts this step still exists.
      - name: Verify packaged chart contents (#1755)
        run: |
          python3 -X utf8 scripts/tools/lint/check_chart_package_contents.py \
            --chart helm/tenant-api \
            --tgz .build/tenant-api-${{ steps.version.outputs.VERSION }}.tgz

      # --- Security scan (PRE-publish hard gate on the candidate digest; #1278) ---
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Trivy binary pinned (the action's own default moves with every
          # action bump). Same version as Makefile TRIVY_VERSION and
          # .devcontainer/install-trivy.sh — tests/shared/test_toolchain_pin_parity.py.
          version: v0.74.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tenant-api@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # #3848 fail-fast: a chart version already published with other content
      # fails the job here, before the image is published. Not the gate — the
      # chart publish step below re-checks inside the push.
      - name: Check the chart version is not already published (#3848)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHARTS: oci://${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/charts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -X utf8 scripts/tools/dx/check_release_immutable.py chart --tgz ".build/tenant-api-${VERSION}.tgz" --registry "$CHARTS"

      # ⛔ #3848: the ONLY step that writes this image's release tags. The check
      # lives inside the publish (scripts/tools/dx/release_publish.py), so it
      # cannot be stepped around: `v<version>` absent → (--sign: sign, then) promote the
      # SCANNED digest, `latest` first and the version last, each read back;
      # already published from this commit → nothing written, `latest` untouched;
      # from another commit / without a revision label → fail. Registry 401/403/
      # 5xx/no answer → rc 2. REGISTRY_* are used only if the anonymous read is
      # refused. tests/ops/test_release_immutable_wiring.py keeps every other
      # step free of publishing commands.
      - name: Publish image (#3848)
        id: image_publish
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tenant-api
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REVISION: ${{ github.sha }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 -X utf8 scripts/tools/dx/release_publish.py image --image "$IMG"
          --digest "$DIGEST" --revision "$REVISION" --tag "v${VERSION}" --tag latest

      # --- L3 supply-chain digest verification (#445 AC iii) ---
      # appVersion == version == tag (gated above), so this confirms the
      # image we just promoted is queryable in GHCR.
      - name: Verify image digest (#445 AC iii)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ops/verify_release_digest.sh tenant-api helm/tenant-api/Chart.yaml

      # ⛔ #1040: the chart is not published while its DEFAULTS run an image
      # nobody can pull. The tenant-api pod runs a generator and a
      # recipe-preview container whose tags follow the da-tools pin, so a
      # tenant-api release cut before the tools release that builds those
      # images would publish a chart whose default install never becomes
      # Ready. The render is the source (a derived tag is invisible in
      # values.yaml), resolution is anonymous (as a customer pulls), and the
      # tenant-api image itself was promoted above, so it resolves too.
      # (helm and Go — da-crdecode — were set up before the capability gate.)
      - name: Verify the chart's default images resolve (#1040)
        run: bash scripts/ops/with_da_crdecode.sh python3 scripts/ops/check_image_refs_resolve.py --scope rendered --chart helm/tenant-api

      # ⛔ #3848: the ONLY step that pushes the chart. Absent → `helm push`; the
      # same files already published → nothing pushed; different → fail.
      - name: Publish Helm chart (#3848)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHARTS: oci://${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/charts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -X utf8 scripts/tools/dx/release_publish.py chart --tgz ".build/tenant-api-${VERSION}.tgz" --registry "$CHARTS"
