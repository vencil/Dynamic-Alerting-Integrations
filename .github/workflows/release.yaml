# release.yaml — Build & push container images + Helm chart on tag
#
# 觸發條件（六線版號策略）：
#   - exporter/v*        → threshold-exporter Docker image + Helm chart
#   - tools/v*           → da-tools Docker image
#   - portal/v*          → da-portal Docker image + Helm chart (Interactive Tools Portal)
#   - recipe-preview/v*  → recipe-preview Docker image + Helm chart (#657 would-fire
#                          preview) — ⛔ 這條線從未被切過，見下方「產出」
#   - tenant-api/v*      → tenant-api Docker image + Helm chart
#   - v*                 → platform tag，僅用於 GitHub Release 錨點，不觸發 build
#
# 產出：
#   - ghcr.io/vencil/threshold-exporter:v<version>  (Docker image, v-prefixed)
#   - ghcr.io/vencil/da-tools:v<da-tools-version>    (Docker image, v-prefixed)
#   - ghcr.io/vencil/da-portal:v<version>             (Docker image, v-prefixed)
#   - ghcr.io/vencil/tenant-api:v<version>             (Docker image, v-prefixed)
#   - oci://ghcr.io/vencil/charts/threshold-exporter (Helm chart)
#   - oci://ghcr.io/vencil/charts/da-portal          (Helm chart, #1352 案例 A)
#   - oci://ghcr.io/vencil/charts/tenant-api         (Helm chart)
#
# ⛔ 宣告 ≠ 已發布（#1352）。上面每一列是「切了對應 tag 之後這支 workflow 會
#   產出的東西」。recipe-preview 是唯一一條從未被切過的線——
#   `git ls-remote --tags origin 'refs/tags/recipe-preview/*'` 回空（其餘四
#   條線都有 tag），所以 ghcr.io/vencil/recipe-preview 與
#   oci://…/charts/recipe-preview 都不存在，刻意不列在上面。
#   release-recipe-preview job 本身完整可用；要啟用這條線就切一個
#   recipe-preview/v* tag，然後把這兩筆產物加回清單。
#
# 前置條件：
#   - Repository Settings → Actions → Workflow permissions → Read and write
#   - 或建立 PAT 並設為 GHCR_TOKEN secret
#
# ⛔ 先掃再發布（#1278）。每個 component job 的順序是：
#   build → push 到「候選 tag」`:candidate-<run_id>-<run_attempt>`
#   → Trivy 掃 build step 輸出的那個 digest（hard gate，exit-code 1）
#   → `docker buildx imagetools create` 把正式 tag（`:v<version>` + `:latest`）
#     指到「同一個 digest」並回讀驗證 → 之後才 cosign 簽章（簽 digest）、SBOM、
#     helm push、GitHub Release。
#   所以掃到可修的 HIGH/CRITICAL 時，客戶拉得到的東西（正式 tag、chart、簽章、
#   Release）一件都不會出現。候選 tag 不刻意清理——理由見
#   docs/internal/github-release-playbook.md §Release-gate 陷阱。
#   順序由 tests/ops/test_release_scan_before_publish.py 解析本檔守住。

name: Release

on:
  push:
    tags:
      - "exporter/v*"
      - "tools/v*"
      - "portal/v*"
      - "recipe-preview/v*"
      - "tenant-api/v*"

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: vencil

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------
  # Job 1: Build & push threshold-exporter image + Helm chart
  # ----------------------------------------------------------------
  release-exporter:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/exporter/')
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#exporter/v}" >> "$GITHUB_OUTPUT"

      - name: Verify Chart.yaml version matches tag
        run: |
          CHART_VER=$(grep '^version:' helm/threshold-exporter/Chart.yaml | awk '{print $2}')
          if [ "$CHART_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: Chart.yaml version ($CHART_VER) != tag (${{ steps.version.outputs.VERSION }})"
            echo "Run: make bump-docs EXPORTER=${{ steps.version.outputs.VERSION }}"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Docker image (multi-arch: amd64 + arm64, #463) ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # #1278: push ONLY a candidate tag. The formal `:v<version>` / `:latest`
      # tags appear later, by promotion of this step's digest, and only if the
      # Trivy scan of that digest passes.
      - name: Build and push threshold-exporter candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: components/threshold-exporter/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/threshold-exporter:candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify multi-arch manifest (#463)
        run: bash scripts/ops/verify_multiarch.sh ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/threshold-exporter@${{ steps.build.outputs.digest }}

      # --- Helm chart: package + verify now (fail fast, publishes nothing);
      # `helm push` waits until the image digest has passed the scan ---
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # Explicit, never the action's `latest` default (which silently
          # crossed Helm 3→4). tests/shared/test_toolchain_pin_parity.py.
          version: v4.3.0

      - name: Package Helm chart
        run: |
          mkdir -p .build
          helm package helm/threshold-exporter -d .build/

      # ⛔ #1755: assert what the archive CONTAINS before it is published. The
      # source-tree gate (check_chart_ship_surface.py) runs on every PR; this one
      # reads the .tgz itself, which is the only place a package-time surprise —
      # a stray file written by an earlier step, a newly pulled subchart — is
      # visible. `check_chart_ship_surface.py` asserts this step still exists.
      - name: Verify packaged chart contents (#1755)
        run: |
          python3 -X utf8 scripts/tools/lint/check_chart_package_contents.py \
            --chart helm/threshold-exporter \
            --tgz .build/threshold-exporter-${{ steps.version.outputs.VERSION }}.tgz

      # --- Security scan (PRE-publish hard gate — exit-code 1; #1278) ---
      # Scans the candidate DIGEST the build step produced — the exact object
      # the promotion step below re-tags — so "scanned" and "published" cannot
      # diverge. A fixable HIGH/CRITICAL fails the job here, and nothing a
      # customer pulls (formal tags, chart) has been created yet. (#1337 had
      # to document the opposite: this used to run after the image AND the
      # chart were already public.)
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Trivy binary pinned (the action's own default moves with every
          # action bump). Same version as Makefile TRIVY_VERSION and
          # .devcontainer/install-trivy.sh — tests/shared/test_toolchain_pin_parity.py.
          version: v0.74.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/threshold-exporter@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Point the formal tags at the SCANNED digest (single-source imagetools
      # create keeps the index as-is), then read every tag back and fail unless
      # it resolves to exactly that digest.
      - name: Promote scanned digest to release tags
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/threshold-exporter
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::build step produced no digest ('$DIGEST')"; exit 1; }
          docker buildx imagetools create --tag "${IMG}:v${VERSION}" --tag "${IMG}:latest" "${IMG}@${DIGEST}"
          for t in "v${VERSION}" latest; do
            got=$(docker buildx imagetools inspect "${IMG}:${t}" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "::error::${IMG}:${t} -> ${got}, expected scanned ${DIGEST}"; exit 1; }
            echo "✓ ${IMG}:${t} -> ${DIGEST}"
          done

      # --- L3 supply-chain digest verification (#445 AC iii) ---
      # Verifies the image at Chart.yaml `appVersion` tag actually exists
      # in GHCR + captures digest for the release audit trail. For
      # threshold-exporter, appVersion==chart-version==tag-version, so
      # this is effectively "confirm what we just promoted is queryable".
      # For other components where appVersion ≠ chart-version (e.g.
      # tenant-api at chart 2.8.0 + appVersion 2.7.0), this verifies the
      # chart's claimed binary version still has a corresponding image.
      # Runs after promotion because it probes the formal `:v<version>` tag.
      # See docs/internal/secret-leak-remediation-sop.md for the full
      # L0/L1/L2/L3 framing.
      - name: Verify image digest (#445 AC iii)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ops/verify_release_digest.sh threshold-exporter helm/threshold-exporter/Chart.yaml

      - name: Push Helm chart to OCI registry
        run: |
          helm push .build/threshold-exporter-${{ steps.version.outputs.VERSION }}.tgz \
            oci://${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/charts

  # ----------------------------------------------------------------
  # Job 2: Build & push da-tools image + da-guard binaries (C-11)
  # ----------------------------------------------------------------
  # v2.8.0 C-11 extends this job with three customer-delivery formats
  # for the migration toolkit (tools/v* release line):
  #
  #   (a) Docker image at ghcr.io (existing path)
  #   (b) Cross-compiled da-guard binaries for direct download
  #       (linux/darwin/windows × amd64/arm64 → 6 archives + SHA256SUMS)
  #   (c) docker save of the image as gzipped tar for air-gapped
  #       environments (customers who can't pull from ghcr.io)
  #
  # Customer chooses install path at the GitHub Release page; see
  # docs/migration-toolkit-installation.md for the install matrix.
  release-da-tools:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/tools/')
    permissions:
      contents: write   # gh release create / upload
      packages: write   # ghcr push (inherited)
      # C-11 PR-3 Layer 1: id-token:write enables sigstore "keyless"
      # signing — cosign exchanges the GitHub OIDC token for an
      # ephemeral X.509 cert from Fulcio, signs the artefact, and
      # publishes the entry in the public Rekor transparency log.
      # No long-term private keys to manage. See
      # docs/internal/release-signing-runbook.md §Layer 1.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#tools/v}" >> "$GITHUB_OUTPUT"

      # C-11: pin tools/v* tag against the in-tree VERSION file so
      # forgot-to-bump errors surface at release time, not after the
      # image is already on ghcr.io.
      - name: Verify VERSION file matches tag
        run: |
          FILE_VER=$(tr -d '[:space:]' < components/da-tools/app/VERSION)
          if [ "$FILE_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: components/da-tools/app/VERSION ($FILE_VER) != tag (${{ steps.version.outputs.VERSION }})"
            echo "Run: make bump-docs TOOLS=${{ steps.version.outputs.VERSION }} && commit before re-tagging"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Go is required for build.sh's da-guard bundling step (the
      # linux/amd64 binary baked into the image) AND for the
      # cross-compile matrix below.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: components/threshold-exporter/app/go.mod
          cache: true
          cache-dependency-path: components/threshold-exporter/app/go.sum

      # C-11 PR-3 Layer 1: install cosign + syft. cosign signs both the
      # binary archives and the Docker image with sigstore keyless
      # (no long-term private key); syft generates SPDX + CycloneDX
      # SBOM for the image. Both pinned to specific versions to
      # avoid silent supply-chain drift — bump deliberately.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.1

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.17.7
        with:
          syft-version: v1.18.1

      - name: Assemble da-tools build context
        run: |
          cd components/da-tools/app
          bash build.sh --assemble-only

      # Multi-arch (#463): build.sh above cross-compiled the bundled binaries
      # per-arch (da-guard.amd64/.arm64 …); the Dockerfile COPYs by TARGETARCH.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # #1278: candidate tag only — see release-exporter for the flow.
      - name: Build and push da-tools candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: components/da-tools/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools:candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify multi-arch manifest (#463)
        run: bash scripts/ops/verify_multiarch.sh ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools@${{ steps.build.outputs.digest }}

      # PRE-publish hard gate on the candidate digest (#1278).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Trivy binary pinned (the action's own default moves with every
          # action bump). Same version as Makefile TRIVY_VERSION and
          # .devcontainer/install-trivy.sh — tests/shared/test_toolchain_pin_parity.py.
          version: v0.74.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # C-11 PR-3 Layer 1: sign the Docker image with cosign keyless.
      # We sign by digest (not tag) — tags can be moved, digests are
      # immutable. The digest is the build step's output, i.e. the object
      # Trivy just scanned and the next step re-tags (#1278) — not a fresh
      # tag lookup. Signed BEFORE promotion so a formal tag never exists
      # unsigned. `cosign sign --yes` skips the interactive Y/N prompt
      # which doesn't work in non-tty CI.
      - name: Sign Docker image (cosign keyless)
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::build step produced no digest ('$DIGEST')"; exit 1; }
          echo "▸ Signing image at digest: $DIGEST"
          cosign sign --yes "${IMG}@${DIGEST}"

      - name: Promote scanned digest to release tags
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::build step produced no digest ('$DIGEST')"; exit 1; }
          docker buildx imagetools create --tag "${IMG}:v${VERSION}" --tag "${IMG}:latest" "${IMG}@${DIGEST}"
          for t in "v${VERSION}" latest; do
            got=$(docker buildx imagetools inspect "${IMG}:${t}" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "::error::${IMG}:${t} -> ${got}, expected scanned ${DIGEST}"; exit 1; }
            echo "✓ ${IMG}:${t} -> ${DIGEST}"
          done

      # --- L3 supply-chain digest verification (#445 AC iii) ---
      # da-tools has no Helm chart — components/da-tools/app/VERSION is the
      # SoT, and we verify the image at v${VERSION} directly. Catches
      # silent push failure or VERSION/tag drift. After promotion: it probes
      # the formal tag.
      - name: Verify image digest (#445 AC iii)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ops/verify_release_digest.sh da-tools

      # C-11 PR-3 Layer 1: generate SBOM (Software Bill of Materials)
      # for the Docker image in BOTH SPDX and CycloneDX formats.
      # Different customer security teams prefer different formats;
      # shipping both costs ~50KB and avoids "we don't accept that
      # format" rejection on first onboarding review. Generated from the
      # scanned digest, not a tag lookup (#1278).
      - name: Generate SBOM for Docker image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom"
          syft "${IMG}@${DIGEST}" -o spdx-json="$RUNNER_TEMP/sbom/da-tools-image-v${VERSION}.spdx.json"
          syft "${IMG}@${DIGEST}" -o cyclonedx-json="$RUNNER_TEMP/sbom/da-tools-image-v${VERSION}.cyclonedx.json"
          ls -la "$RUNNER_TEMP/sbom/"

      # Sign the SBOM files too — a tampered SBOM defeats the whole
      # supply-chain story. cosign sign-blob produces detached .sig
      # + .cert files that customers verify alongside the SBOM.
      - name: Sign SBOM files (cosign keyless)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sbom"
          for f in *.spdx.json *.cyclonedx.json; do
            echo "▸ Signing $f"
            cosign sign-blob --yes \
                --output-signature "${f}.sig" \
                --output-certificate "${f}.cert" \
                "$f"
          done
          ls -la

      # ----------------------------------------------------------------
      # C-11 extras: cross-compile binaries + air-gapped tar + Release
      # ----------------------------------------------------------------

      - name: Cross-compile da-guard + da-batchpr + da-parser binaries (6 OS/ARCH each)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/da-guard-bin"
          cd components/threshold-exporter/app
          # All three Go CLIs use the same matrix + ldflags. C-10 PR-5
          # added da-batchpr alongside da-guard; C-8 PR-2 adds
          # da-parser for the Prometheus rule import path.
          for BIN in da-guard da-batchpr da-parser; do
            for OS in linux darwin windows; do
              for ARCH in amd64 arm64; do
                EXT=""
                [ "$OS" = "windows" ] && EXT=".exe"
                OUT="$RUNNER_TEMP/da-guard-bin/${BIN}-${OS}-${ARCH}${EXT}"
                echo "▸ Building ${BIN} $OS/$ARCH..."
                CGO_ENABLED=0 GOOS="$OS" GOARCH="$ARCH" go build \
                    -buildvcs=false \
                    -ldflags "-X main.Version=v${VERSION}" \
                    -o "$OUT" \
                    "./cmd/${BIN}"
              done
            done
          done
          ls -la "$RUNNER_TEMP/da-guard-bin/"

      - name: Package binaries (tarball / zip + SHA256SUMS)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/da-guard-bin"
          # Linux + macOS: tar.gz. Windows: zip (Windows users
          # commonly lack tar/gzip; zip is universal).
          # Globs cover all three binaries (guard / batchpr / parser).
          for f in da-guard-linux-* da-guard-darwin-* \
                   da-batchpr-linux-* da-batchpr-darwin-* \
                   da-parser-linux-* da-parser-darwin-*; do
            tar czf "${f}.tar.gz" "$f"
          done
          for f in da-guard-windows-* da-batchpr-windows-* da-parser-windows-*; do
            zip -q "${f%.exe}.zip" "$f"
          done
          # Sum every artefact reviewers can download, including the
          # raw binaries for security-team teams that prefer to verify
          # the binary directly rather than the archive.
          sha256sum da-guard-linux-* da-guard-darwin-* da-guard-windows-* \
                    da-batchpr-linux-* da-batchpr-darwin-* da-batchpr-windows-* \
                    da-parser-linux-* da-parser-darwin-* da-parser-windows-* \
                    *.tar.gz *.zip > SHA256SUMS
          echo "--- Archive listing ---"
          ls -la

      # C-11 PR-3 Layer 1: sign every distributable archive + the
      # SHA256SUMS index. Customers who can verify cosign get a
      # cryptographic guarantee that the archive came from THIS repo's
      # tools/v* release workflow run; SHA256SUMS-only customers are
      # still served (we don't break their flow). Per-archive .sig +
      # .cert files are tiny (~5KB combined) and uploaded alongside
      # the archives in the GitHub Release.
      - name: Sign archives + SHA256SUMS (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/da-guard-bin"
          # Sign each archive + the SHA256SUMS index. Customers can
          # then verify EITHER an individual archive OR the full
          # SHA256SUMS (and validate any archive against the verified
          # index — common GPG-style pattern carried across to cosign).
          for f in *.tar.gz *.zip SHA256SUMS; do
            echo "▸ Signing $f"
            cosign sign-blob --yes \
                --output-signature "${f}.sig" \
                --output-certificate "${f}.cert" \
                "$f"
          done
          echo "--- Signature listing ---"
          ls -la *.sig *.cert | head

      - name: Save image as gzipped tar (air-gapped customers)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-tools"
          IMG="${REPO}:v${VERSION}"
          OUT="$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz"
          # Pull the scanned digest (#1278), then tag it so `docker load`
          # on the air-gapped side yields the familiar `da-tools:v<ver>`.
          docker pull "${REPO}@${DIGEST}"
          docker tag "${REPO}@${DIGEST}" "$IMG"
          docker save "$IMG" | gzip > "$OUT"
          ( cd "$RUNNER_TEMP" && sha256sum "$(basename "$OUT")" > "${OUT}.sha256" )
          ls -la "$OUT" "$OUT.sha256"

      # Sign the air-gapped image tar with cosign too. Air-gapped
      # customers can't reach Rekor at verify-time, but they CAN
      # carry the .sig/.cert in alongside the tar and verify
      # offline IF they pre-sync the Sigstore TUF root (cosign
      # initialize) — see release-signing-runbook.md §Layer 1
      # air-gapped verify path.
      - name: Sign air-gapped image tar (cosign keyless)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz"
          cosign sign-blob --yes \
              --output-signature "${OUT}.sig" \
              --output-certificate "${OUT}.cert" \
              "$OUT"
          ls -la "${OUT}.sig" "${OUT}.cert"

      - name: Create or update GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Idempotent: if the maintainer pre-created the Release
          # (e.g. with hand-curated notes), skip create + just
          # upload --clobber the assets. If not, create with
          # --generate-notes for a starter changelog.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "▸ Release $TAG already exists; uploading assets with --clobber"
          else
            echo "▸ Creating Release $TAG with auto-generated notes"
            gh release create "$TAG" \
                --title "da-tools v${VERSION} — Migration Toolkit" \
                --generate-notes
          fi
          gh release upload "$TAG" --clobber \
              "$RUNNER_TEMP/da-guard-bin/"*.tar.gz \
              "$RUNNER_TEMP/da-guard-bin/"*.zip \
              "$RUNNER_TEMP/da-guard-bin/SHA256SUMS" \
              "$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz" \
              "$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz.sha256"
          # C-11 PR-3 Layer 1: cosign keyless signatures + SBOM. Glob
          # the *.sig and *.cert files (one pair per archive + per
          # SHA256SUMS + per SBOM file + for the air-gapped tar);
          # absent file = nothing to upload. The SBOM directory holds
          # both spdx-json and cyclonedx-json formats so customer
          # security teams can pick whichever they consume.
          gh release upload "$TAG" --clobber \
              "$RUNNER_TEMP/da-guard-bin/"*.sig \
              "$RUNNER_TEMP/da-guard-bin/"*.cert \
              "$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz.sig" \
              "$RUNNER_TEMP/da-tools-image-v${VERSION}.tar.gz.cert" \
              "$RUNNER_TEMP/sbom/"*.json \
              "$RUNNER_TEMP/sbom/"*.sig \
              "$RUNNER_TEMP/sbom/"*.cert
          echo "✓ Release $TAG ready: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "✓ Artefacts signed with cosign keyless (sigstore.dev/Rekor)"
          echo "✓ SBOM (SPDX + CycloneDX) generated by syft"
          echo "  Customer verification: see docs/migration-toolkit-installation.md §Signature Verification"

  # ----------------------------------------------------------------
  # Job 3: Build & push da-portal image (Interactive Tools Portal)
  # ----------------------------------------------------------------
  release-portal:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/portal/')
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#portal/v}" >> "$GITHUB_OUTPUT"

      - name: Verify Chart.yaml version matches tag
        # Added with #445 AC iii — release-portal previously lacked this
        # consistency gate that release-exporter / release-tenant-api
        # already had.
        run: |
          CHART_VER=$(grep '^version:' helm/da-portal/Chart.yaml | awk '{print $2}')
          if [ "$CHART_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: helm/da-portal/Chart.yaml version ($CHART_VER) != tag (${{ steps.version.outputs.VERSION }})"
            echo "Run: make bump-docs PORTAL=${{ steps.version.outputs.VERSION }}"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download vendor files for offline mode
        run: bash scripts/tools/vendor_download.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # #1278: candidate tag only — see release-exporter for the flow.
      - name: Build and push da-portal candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: components/da-portal/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-portal:candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify multi-arch manifest (#463)
        run: bash scripts/ops/verify_multiarch.sh ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-portal@${{ steps.build.outputs.digest }}

      # --- Helm chart (#1352 case A) ---
      # ⛔ Added because the customer-facing install path was a lie: this job
      # gated Chart.yaml version == tag and bump_docs.py kept the README's
      # `oci://…/charts/da-portal --version` string fresh, while nothing ever
      # packaged or pushed that chart. check_chart_pull_surface.py now asserts
      # the pair. Packaged + verified here (fails fast, publishes nothing);
      # `helm push` waits until the image digest has passed the scan (#1278),
      # so a scan failure withholds image AND chart together.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # Explicit, never the action's `latest` default (which silently
          # crossed Helm 3→4). tests/shared/test_toolchain_pin_parity.py.
          version: v4.3.0

      - name: Package Helm chart
        run: |
          mkdir -p .build
          helm package helm/da-portal -d .build/

      # ⛔ #1755: assert what the archive CONTAINS before it is published. The
      # source-tree gate (check_chart_ship_surface.py) runs on every PR; this one
      # reads the .tgz itself, which is the only place a package-time surprise —
      # a stray file written by an earlier step, a newly pulled subchart — is
      # visible. `check_chart_ship_surface.py` asserts this step still exists.
      - name: Verify packaged chart contents (#1755)
        run: |
          python3 -X utf8 scripts/tools/lint/check_chart_package_contents.py \
            --chart helm/da-portal \
            --tgz .build/da-portal-${{ steps.version.outputs.VERSION }}.tgz

      # PRE-publish hard gate on the candidate digest (#1278).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Trivy binary pinned (the action's own default moves with every
          # action bump). Same version as Makefile TRIVY_VERSION and
          # .devcontainer/install-trivy.sh — tests/shared/test_toolchain_pin_parity.py.
          version: v0.74.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-portal@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Promote scanned digest to release tags
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/da-portal
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::build step produced no digest ('$DIGEST')"; exit 1; }
          docker buildx imagetools create --tag "${IMG}:v${VERSION}" --tag "${IMG}:latest" "${IMG}@${DIGEST}"
          for t in "v${VERSION}" latest; do
            got=$(docker buildx imagetools inspect "${IMG}:${t}" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "::error::${IMG}:${t} -> ${got}, expected scanned ${DIGEST}"; exit 1; }
            echo "✓ ${IMG}:${t} -> ${DIGEST}"
          done

      # --- L3 supply-chain digest verification (#445 AC iii) ---
      # After promotion: it probes the formal `:v<version>` tag.
      - name: Verify image digest (#445 AC iii)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ops/verify_release_digest.sh da-portal helm/da-portal/Chart.yaml

      - name: Push Helm chart to OCI registry
        run: |
          helm push .build/da-portal-${{ steps.version.outputs.VERSION }}.tgz \
            oci://${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/charts

  # ----------------------------------------------------------------
  # Job 4: Build & push recipe-preview image + Helm chart (#657)
  # ----------------------------------------------------------------
  # recipe-preview was DESIGNED as a "sync-bumped" line — re-tagged at every
  # platform release (same commit as the rule-pack ConfigMap), NOT an independent
  # cadence, so its bundled compiler snapshot cannot silently drift from the
  # platform compiler.
  #
  # ⛔ #1352 case B: that is the DESIGN, not the record. The line has never been
  # cut — zero `recipe-preview/v*` tags exist on origin — so this job has never
  # run, and the drift it guards against has never actually been guarded. The
  # sentence above used to read as a statement of fact about EVERY release; it is
  # reworded rather than deleted because the job is complete and correct, and
  # cutting the first tag is all that enabling the line takes.
  # The image bundles a SHA-pinned promtool because the firing/inactive verdict
  # format is version-bound; PROM_VERSION + amd64 digest == ci.yml's promtool gate
  # is CI-enforced (tests/preview/test_promtool_pin_parity.py).
  release-recipe-preview:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/recipe-preview/')
    permissions:
      contents: read
      packages: write
      # cosign keyless signing (sigstore): exchange the GitHub OIDC token for an
      # ephemeral Fulcio cert, publish to the Rekor transparency log — no
      # long-term keys. Job-level perms REPLACE the workflow default, so
      # contents/packages are re-declared here.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#recipe-preview/v}" >> "$GITHUB_OUTPUT"

      - name: Verify Chart.yaml version matches tag
        run: |
          CHART_VER=$(grep '^version:' helm/recipe-preview/Chart.yaml | awk '{print $2}')
          if [ "$CHART_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: helm/recipe-preview/Chart.yaml version ($CHART_VER) != tag (${{ steps.version.outputs.VERSION }})"
            echo "Run: make bump-docs RECIPE_PREVIEW=${{ steps.version.outputs.VERSION }}"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.1

      # --- Docker image (multi-arch: amd64 + arm64, #463) ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # #1278: candidate tag only — see release-exporter for the flow.
      - name: Build and push recipe-preview candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: components/recipe-preview/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # GIT_SHA → image ENV → /healthz, so an operator can confirm which
          # commit's bundled compiler snapshot is running (drift observability).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Machine-readable provenance: stamp the source commit into the image
          # MANIFEST as standard OCI annotations, so admission controllers /
          # scanners (Kyverno, cosign policy, etc.) can read it WITHOUT pulling +
          # running the image — the manifest-level complement to the runtime
          # GIT_SHA in /healthz (+ the cosign signature + SBOM). Sibling component
          # jobs can adopt the same block.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recipe-preview:candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify multi-arch manifest (#463)
        run: bash scripts/ops/verify_multiarch.sh ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recipe-preview@${{ steps.build.outputs.digest }}

      # --- Helm chart: package + verify now (fail fast, publishes nothing);
      # `helm push` waits until the image digest has passed the scan (#1278) ---
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # Explicit, never the action's `latest` default (which silently
          # crossed Helm 3→4). tests/shared/test_toolchain_pin_parity.py.
          version: v4.3.0

      - name: Package Helm chart
        run: |
          mkdir -p .build
          helm package helm/recipe-preview -d .build/

      # ⛔ #1755: assert what the archive CONTAINS before it is published. The
      # source-tree gate (check_chart_ship_surface.py) runs on every PR; this one
      # reads the .tgz itself, which is the only place a package-time surprise —
      # a stray file written by an earlier step, a newly pulled subchart — is
      # visible. `check_chart_ship_surface.py` asserts this step still exists.
      - name: Verify packaged chart contents (#1755)
        run: |
          python3 -X utf8 scripts/tools/lint/check_chart_package_contents.py \
            --chart helm/recipe-preview \
            --tgz .build/recipe-preview-${{ steps.version.outputs.VERSION }}.tgz

      # --- Security scan (PRE-publish hard gate on the candidate digest; #1278) ---
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Trivy binary pinned (the action's own default moves with every
          # action bump). Same version as Makefile TRIVY_VERSION and
          # .devcontainer/install-trivy.sh — tests/shared/test_toolchain_pin_parity.py.
          version: v0.74.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recipe-preview@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Bundled-promtool (Prometheus) binary CVEs only — recipe-preview ships no
          # first-party Go. ⛔ WHICH ids are waived, on what evidence and until when is
          # deliberately NOT summarised here — read the register. A prose summary of
          # it has nothing asserting it, and the one that used to sit here had gone
          # stale against a register that was rewritten under it. Evidence +
          # governance: .trivyignore.yaml + promtool.openvex.json in
          # components/recipe-preview/. Gate stays HARD (exit-code 1) — only the
          # register's entries are waived.
          trivyignores: components/recipe-preview/.trivyignore.yaml

      # Sign by IMMUTABLE digest — the build step's output, i.e. the object
      # Trivy just scanned and the next step re-tags (#1278). Signed BEFORE
      # promotion, so no formal tag can ever exist unsigned because a later
      # step aborted.
      - name: Sign Docker image (cosign keyless)
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recipe-preview
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::build step produced no digest ('$DIGEST')"; exit 1; }
          echo "▸ Signing image at digest: $DIGEST"
          cosign sign --yes "${IMG}@${DIGEST}"

      - name: Promote scanned digest to release tags
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recipe-preview
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::build step produced no digest ('$DIGEST')"; exit 1; }
          docker buildx imagetools create --tag "${IMG}:v${VERSION}" --tag "${IMG}:latest" "${IMG}@${DIGEST}"
          for t in "v${VERSION}" latest; do
            got=$(docker buildx imagetools inspect "${IMG}:${t}" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "::error::${IMG}:${t} -> ${got}, expected scanned ${DIGEST}"; exit 1; }
            echo "✓ ${IMG}:${t} -> ${DIGEST}"
          done

      # --- L3 supply-chain digest verification (#445 AC iii) ---
      # recipe-preview is sync-bumped: appVersion == version == tag, so this
      # confirms the image we just promoted is queryable in GHCR.
      - name: Verify image digest (#445 AC iii)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ops/verify_release_digest.sh recipe-preview helm/recipe-preview/Chart.yaml

      - name: Push Helm chart to OCI registry
        run: |
          helm push .build/recipe-preview-${{ steps.version.outputs.VERSION }}.tgz \
            oci://${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/charts

