            echo "✓ ${IMG}:${t} -> ${DIGEST}"
          done

      # --- L3 supply-chain digest verification (#445 AC iii) ---
      # ⚠️ tenant-api intentionally has Chart.yaml appVersion ≠ version
      # (chart 2.8.0 wraps appVersion 2.7.0 — chart-template changes can
      # decouple from binary changes). The verification therefore probes
      # BOTH `:v${VERSION}` (the tag just promoted) and `:v${appVersion}`
      # (the chart's claimed binary version). This catches "chart claims a
