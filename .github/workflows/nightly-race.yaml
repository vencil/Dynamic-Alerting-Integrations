name: Nightly Race Detector

# TRK-226 (#235): nightly Go race detector with -count=10.
#
# Why nightly + advisory: race detector is a sampling tool. -count=1 (used
# in PR-blocking ci.yml) won't surface low-probability races; -count=10 on
# every PR is too slow (multiplies tenant-api + threshold-exporter test time
# by 10x). Nightly schedule trades latency for coverage. Advisory-only
# (does NOT block any PR) — a failure surfaced here is a real bug to triage,
# not a "fix this PR" gate.
#
# Topology (#3541): plan -> race (one leg per module x shard) -> merge (one leg
# per module) -> report. scripts/ops/plan_race_shards.py is the SSOT for the
# module list (workdir + package patterns) and the shard count; the race
# matrix, the merge matrix and the report's --expected-modules are all derived
# from it, so they cannot drift apart.
#
# Failure handling: the race legs only PRODUCE evidence (the raw `go test -json`
# stream + its exit code, as an artifact). `merge` concatenates one module's
# shards and parses them ONCE into a fragment — the same fragment one unsharded
# leg used to produce. A single fan-in `report` job splits each module's result
# into incidents (build / package timeout / data race / failing test /
# unattributed / no-result, plus the warning-level slow-package) and keeps ONE
# tracking issue per failure fingerprint
# (`module|kind|subject`, the first line of the body), labelled
# `test-isolation`, with that fingerprint's own first-seen date and latest run.
# A slow-package (#3541 PR-B) is a package whose package-level Elapsed passed
# half of the per-binary -timeout without hitting it (parse_go_test_json.py's
# SLOW_PACKAGE_RATIO x GO_TEST_TIMEOUT_S). It gets its own issue but is a
# warning: the module still reads GREEN and no job goes red for it, because
# sharding cannot split one test binary — only cheaper tests can fix it.
# One issue per module used to merge unrelated failures (#2977). It EDITS in
# place rather than creating — GitHub does not notify on a title or body edit,
# so a standing failure stays visible without mailing anyone nightly.
#
# Two things this deliberately does NOT do, both learned the hard way:
#   * It does not call itself a race unless the race detector actually fired.
#     `-count=10` also catches repeat-run / test-isolation failures, which are a
#     different bug class with different fixes (#932 triage). Titles follow the
#     evidence, not this workflow's name.
#   * It does not auto-close or comment nightly. One green night does not prove a
#     repeat-run failure fixed, and a daily comment on standing debt is muted
#     within a week — that is how #1228 stayed invisible for 33 nights. A night
#     a fingerprint does not recur is recorded as `not seen on <date>` instead.
#
# Before this rework the issue step ran INSIDE the matrix (2 legs, fail-fast:
# false) and called issues.create() unconditionally with a date-stamped title, so
# one persistent failure minted one duplicate P2 issue per night: #1213 / #1230 /
# #1258 / #1263 were four issues for one bug. The workflow-level `concurrency`
# block below is run-scoped and never serialised the legs against each other;
# moving the write into a single fan-in job is what makes that race structurally
# impossible, rather than merely unlikely.

on:
  schedule:
    # 16:00 UTC = 00:00 Asia/Taipei. Runs once daily, off-hours.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      file_issue:
        description: "Actually create/refresh the tracking issues (leave off for a dry-run rehearsal)"
        type: boolean
        default: false

# Deny by default; each job grants only what it needs (below). The matrix job
# runs third-party test code under -race and must not hold an issues:write token.
permissions: {}

concurrency:
  group: nightly-race-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Why shards (#3541): one `go test` per module on one 4-core runner made every
  # package share those cores, so wall-clock time was inflated by contention —
  # on 11-02 tenant-api's internal/handler took 1718 s of the 1800 s per-binary
  # -timeout. `plan` splits each module by the previous night's per-package
  # timings (greedy longest-first). Scheduling is fail-open: no timings ->
  # round-robin, no package list -> ONE leg with the module's own patterns (the
  # pre-#3541 run), each as a ::warning::. Results stay fail-closed in `merge`.
  plan:
    name: plan race shards
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # list earlier runs of this workflow and download their timings artifacts
    outputs:
      race_matrix: ${{ steps.plan.outputs.race_matrix }}
      merge_matrix: ${{ steps.plan.outputs.merge_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Only for `go list`. Seeded from the platform's Go SSOT go.mod (the one
      # tests/ops/test_go_toolchain_parity.py pins); this is NOT a module list —
      # each module's own go.mod still selects its toolchain (GOTOOLCHAIN=auto
      # on the plan step).
      - name: Set up Go (version from the SSOT go.mod)
        uses: actions/setup-go@v6
        with:
          go-version-file: components/threshold-exporter/app/go.mod
          cache: false

      # Newest unexpired `race-timings-<module>` artifact of an earlier
      # completed run of THIS workflow on main. Never fails the step.
      - name: Fetch the previous night's per-package timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wf="${GITHUB_WORKFLOW_REF%%@*}"
          python3 scripts/ops/plan_race_shards.py fetch-timings \
            --repo "$GITHUB_REPOSITORY" --workflow "${wf##*/}" --branch main \
            --out-dir timings

      - name: Plan shards
        id: plan
        env:
          # Explicit: `go list` must be allowed to switch to the toolchain a
          # module's go.mod asks for, whatever setup-go exported. Otherwise a
          # too-old `stable` fails go list and every module degrades to one leg.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          python3 scripts/ops/plan_race_shards.py plan --timings-dir timings

  race:
    name: Race Detector (${{ matrix.module }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [plan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.race_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.workdir }}/go.mod

      # threshold-exporter's pkg/config docs tests run the docs' YAML
      # inventory, a Python child process that finds the code blocks with the
      # site's renderer (#3814); without its packages they fail, not skip.
      # Every leg, not only threshold-exporter's: the shards' package lists
      # are planned at run time, and the install is seconds.
      - name: Set up Python with the docs inventory's deps
        uses: ./.github/actions/docs-inventory-python

      # Module cache AND build cache: without the latter every leg recompiles
      # its module's -race dependency graph. One entry per module per run — the
      # build cache is content-addressed, so whichever shard saves it serves
      # every shard of the next night; the other legs of the run only log that
      # the key is taken. Restored by prefix, newest first.
      # Restore-only, from the key PR CI's Go jobs save (ci.yml, "Cache Go
      # modules + build cache"). This leg's own per-run saves never came back:
      # 11-04..11-11 every leg logged "Cache not found" for the previous
      # night's key, so they only cost cache storage. PR CI's entry is read on
      # every PR and restores on every leg (dispatch 43213073031: 8/8 hits;
      # legs summed 4113 s -> 3906 s). The shared key did NOT warm the
      # generator tools tenant-api's real-generator tests build in-test
      # (generator_real_test.go, ~200 s on their first run): it lacked da-read's
      # build. So each PR CI Go job saves its own `<os>-go-<module>-<hash>` and
      # each leg restores its module's (#3541); a guard test pins the names.
      - name: Restore Go modules and build cache (PR CI's key for this module)
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.module }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.module }}-
            ${{ runner.os }}-go-

      # -json so the failure is machine-readable. `cmd/go` feeds the test
      # binary's stdout AND stderr through test2json, so a `WARNING: DATA RACE`
      # banner arrives as an {"Action":"output"} event attributed to the
      # triggering test — verified against a real Go 1.26 race, not assumed.
      #
      # `set -o pipefail` + `|| rc=$?` so go test's exit code survives the tee
      # (same shape as scripts/tools/ops/bench_wrapper.sh). The step itself does
      # NOT fail here: the upload step below must still run, and the leg is
      # failed explicitly at the end so it still shows red in the Actions tab.
      # The rc file is written only once go test has returned: `merge` reads a
      # shard without one as a leg that died mid-run, i.e. a partial stream.
      - name: Run tests with -race -count=10
        id: race
        working-directory: ${{ matrix.workdir }}
        env:
          PACKAGES: ${{ matrix.packages }}
          RAW: ${{ github.workspace }}/race-raw-${{ matrix.module }}-${{ matrix.shard }}.jsonl
          ERR: ${{ github.workspace }}/race-stderr-${{ matrix.module }}-${{ matrix.shard }}.log
          RC_FILE: ${{ github.workspace }}/race-rc-${{ matrix.module }}-${{ matrix.shard }}
        # -timeout=30m guards against single test hangs (default 10m is tight at 10x).
        # It is a per-package-binary budget, so a package whose tests are merely
        # slow hits it too: threshold-exporter's cmd/da-guard did, twice (#2977).
        # Raising it is not the fix — that only postpones the next collision.
        # GO_TEST_TIMEOUT_S in parse_go_test_json.py mirrors it (the planner and
        # the slow-package threshold both read it; a test pins the two together).
        #
        # -short (#2977 option A): the -count=10 here exists to catch isolation
        # problems BETWEEN repetitions, which a reduced matrix exposes just as
        # well. The exhaustive matrices that honour testing.Short() (cmd/da-guard's
        # alias-spelling and null-override products) keep their FULL coverage in
        # PR CI (ci.yml, -race -count=1, no -short), once per PR that passes the
        # exporter job's go/docs path gate — a guard test in
        # tests/ops/test_nightly_race_issue_policy.py pins both halves. Side effect:
        # the vendored yaml.v3 TestLimits also skips under -short; tenant-api has
        # no testing.Short() call, so -short is a no-op there. Sharding (#3541)
        # superseded TRK-3180's plan of making the matrices themselves cheap.
        # -short is PERMANENT, not a stopgap (#3541, decided 2026-11-05): this run
        # is the repeat-stress tier, PR CI is the exhaustive-coverage tier — the
        # same split Go's own builders use (race builders run -short, full runs
        # live on -longtest builders). Dropping -short here would put da-guard's
        # full matrices x10 back on one binary's 30m budget, which sharding
        # cannot split: a package is one test binary.
        # PACKAGES is intentionally unquoted: it is a multi-package list.
        run: |
          set -o pipefail
          rc=0
          go test $PACKAGES -race -count=10 -short -timeout=30m -json 2>"$ERR" | tee "$RAW" || rc=$?
          echo "go test exited $rc"
          echo "$rc" > "$RC_FILE"
          echo "go_exit_code=$rc" >> "$GITHUB_OUTPUT"

      # The full race report / panic / build error, for a human triaging, and
      # the input `merge` parses.
      - name: Upload raw go test -json stream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: race-raw-${{ matrix.module }}-${{ matrix.shard }}
          path: |
            race-raw-${{ matrix.module }}-${{ matrix.shard }}.jsonl
            race-stderr-${{ matrix.module }}-${{ matrix.shard }}.log
            race-rc-${{ matrix.module }}-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn

      # Visibility: the leg goes red for the same reason it always did. The
      # upload above just happens first.
      - name: Fail the leg if go test failed
        if: always() && steps.race.outputs.go_exit_code != '0'
        env:
          RC: ${{ steps.race.outputs.go_exit_code }}
          MODULE: ${{ matrix.module }}
          SHARD: ${{ matrix.shard }}
        run: |
          echo "::error title=Nightly race::go test exited ${RC:-<none>} for ${MODULE} shard ${SHARD}"
          exit 1

  # One leg per MODULE: concatenate its shards' streams and parse them ONCE, so
  # frag-<module>.json and every fingerprint derived from it are what a single
  # unsharded leg would have produced. A shard that left no complete evidence
  # (no rc file, or no stream) means this module's results are missing: no
  # fragment is uploaded, and the report reads that as `no-result` — the verdict
  # a module whose only leg never uploaded already got. Parsing just the shards
  # that did arrive would let the missing shard's failure read green.
  merge:
    name: merge + parse (${{ matrix.module }})
    needs: [plan, race]
    # always(): a red race leg must still be merged and reported. Skipped only
    # when there is no plan to merge against; the report then finds no fragment
    # for any module and reports each as no-result.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.merge_matrix) }}
    steps:
      - uses: actions/checkout@v6 # for scripts/ops/*.py

      # continue-on-error: download-artifact FAILS the step when no artifact
      # matches. The merge step below then finds every shard missing and says so.
      - name: Download shard streams
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: race-raw-${{ matrix.module }}-*
          path: raw
          merge-multiple: true

      - name: Merge shard streams
        id: merge
        if: always()
        env:
          MODULE: ${{ matrix.module }}
          SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          python3 scripts/ops/plan_race_shards.py merge \
            --module "$MODULE" --shards "$SHARDS" --raw-dir raw \
            --output "race-raw-${MODULE}.jsonl"

      # Exactly the parse the unsharded leg ran, on the merged stream, with the
      # module's own workdir and package patterns (the triage repro command).
      - name: Extract failing tests
        if: always() && steps.merge.outputs.complete == 'true'
        env:
          RC: ${{ steps.merge.outputs.go_exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODULE: ${{ matrix.module }}
          WORKDIR: ${{ matrix.workdir }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          python3 scripts/ops/parse_go_test_json.py \
            --module "$MODULE" \
            --input "race-raw-${MODULE}.jsonl" \
            --output "frag-${MODULE}.json" \
            --go-exit-code "${RC:-1}" \
            --run-url "$RUN_URL" \
            --workdir "$WORKDIR" \
            --packages "$PACKAGES"

      # Tomorrow's plan input, only from a complete night: a partial one would
      # under-weight exactly the shard that died, so the next plan falls back to
      # the newest complete night instead.
      - name: Record per-package timings
        if: always() && steps.merge.outputs.complete == 'true'
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          python3 scripts/ops/plan_race_shards.py timings \
            --input "race-raw-${MODULE}.jsonl" \
            --output "race-timings-${MODULE}.json"

      - name: Upload fragment
        if: always() && steps.merge.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: race-frag-${{ matrix.module }}
          path: frag-${{ matrix.module }}.json
          retention-days: 14

      - name: Upload per-package timings
        if: always() && steps.merge.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: race-timings-${{ matrix.module }}
          path: race-timings-${{ matrix.module }}.json
          retention-days: 14

      - name: Fail the leg if a shard failed or is missing
        if: always() && (steps.merge.outputs.complete != 'true' || steps.merge.outputs.go_exit_code != '0')
        env:
          RC: ${{ steps.merge.outputs.go_exit_code }}
          COMPLETE: ${{ steps.merge.outputs.complete }}
          MODULE: ${{ matrix.module }}
        run: |
          echo "::error title=Nightly race::${MODULE}: go_exit_code=${RC:-<none>} complete=${COMPLETE:-<none>}"
          exit 1

  # Single writer. `needs: [merge]` + `always()` so a red leg still reports; the
  # issue write lives here and NOWHERE else, which is what makes the duplicate-
  # create race impossible rather than merely unlikely.
  report:
    name: aggregate + file/refresh tracking issues
    needs: [merge]
    # Runs on dispatch too, so this path can be REHEARSED. It is brand new and
    # cannot run in its own PR's CI (schedule/dispatch triggers only), so gating
    # the whole job on `schedule` left no way to exercise it before the first
    # real nightly. Filing is gated separately via DO_FILE below: a dispatch
    # produces the full step summary and a dry run, and only creates or edits an
    # issue when the operator ticks `file_issue`. Same shape as
    # nightly-image-scan.yaml.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6 # for scripts/ops/file_race_report.py

      # continue-on-error: download-artifact FAILS the step when no artifact
      # matches the pattern. If every module's fragment was withheld, that failure
      # would skip the reporting step below and the night would pass in silence
      # — the worst possible direction. Let it fail soft; the script treats a
      # missing fragment as a FAILING module and exits non-zero for it.
      - name: Download fragments
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: race-frag-*
          path: frags
          merge-multiple: true

      # The expected modules come from the SSOT itself, NOT from plan's outputs:
      # a plan job that died must leave every module expected (so each reads as
      # no-result), not none.
      - name: File or refresh the tracking issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # schedule always files; a manual dispatch only when explicitly asked.
          DO_FILE: ${{ github.event_name == 'schedule' || inputs.file_issue }}
        run: |
          set -euo pipefail
          mkdir -p frags
          expected="$(python3 scripts/ops/plan_race_shards.py modules)"
          python3 scripts/ops/file_race_report.py \
            --frags-dir frags \
            --expected-modules "$expected" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
