# docs-ci.yaml — Documentation CI/CD Pipeline
#
# Validates and renders documentation.
#
# The workflow triggers on EVERY pull_request to main (no top-level `paths:`
# filter) and no job in it is path-gated (#3756): every PR runs every job.
# Reason for the first half: several of these job NAMES are enrolled in
# main's branch protection required_status_checks. A workflow suppressed
# entirely by a top-level `paths:` filter reports NO status at all for a PR
# that doesn't touch those paths, and GitHub treats a required check with no
# reported status as permanently pending — blocking merge even when every
# check that DID run is green (PR #928 / #957 both needed a manual `--admin`
# bypass for this). Reason for the second: a job skipped by its own `if:`
# reports `skipped`, which also satisfies the requirement — so a path filter
# that missed one input skipped the check that would have caught the break,
# and the PR merged green. The filter was a hand-kept list; it is gone.
#
# Every job here reports its required name itself (`kind: job` in
# .github/required-checks.yaml): none has `needs:`, `if:` or a matrix, so
# none can be skipped, and a one-leg aggregate gate in front of it would only
# cost one more runner slot and one more wait in the queue (#4224).
#
# Uses caching (npm + pip) for speed.

name: Documentation CI

on:
  pull_request:
    branches: [main]
  # head-blob-hygiene also runs on every push so historical drift is caught
  # without waiting for a PR that touches docs/.
  push:
    branches: [main]

# Same as ci.yml: a PR's newer push cancels its older run, a push to main
# never cancels one. Cancelling on main used to keep a run that started before
# the next merge from reading the NEWER origin/main in drift-checks (the
# changelog cap then read the older tree as having grown `[Unreleased]`). That
# was a two-way diff; since #2217 every diff-aware check measures against the
# merge base of origin/main and HEAD, which is HEAD itself once main has moved
# on — an empty diff, not a false red (tests/lint/test_diff_scan_failure.py).
concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit least-privilege grant (repo default is read-only; every sibling
# workflow declares this block too).
permissions:
  contents: read

jobs:
  validate-mermaid:
    name: Validate Mermaid Diagrams
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          # NOTE: cache: "npm" is intentionally omitted — this repo has no
          # root-level package-lock.json.
          # Enabling cache without a lockfile makes setup-node fail with
          # "Dependencies lock file is not found".

      - name: Cache npm global dir (mermaid-cli, puppeteer)
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mermaid-cli
          restore-keys: |
            ${{ runner.os }}-npm-mermaid-

      - name: Install mermaid-cli
        run: |
          npm install -g @mermaid-js/mermaid-cli puppeteer

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install pyyaml -c requirements/ci-constraints.txt

      - name: Validate and render Mermaid diagrams
        run: |
          # Run it twice — once for docs/, once for rule-packs/ — so a failure
          # names which tree it came from. Both must pass. (validate_mermaid.py
          # takes nargs='*' since #1702, so one call with both paths would also
          # work; kept split for the attribution.)
          python scripts/tools/lint/validate_mermaid.py docs/ --ci --render
          python scripts/tools/lint/validate_mermaid.py rule-packs/ --ci --render

  check-links:
    name: Check Documentation Links
    runs-on: ubuntu-24.04
    # ⛔ Unconditional on purpose (#2107). Its input set is every Markdown file plus every
    # link target, wherever it lives; no path filter can express that, so a
    # PR that only deleted or renamed a linked non-doc file skipped this leg
    # and merged a broken link. Re-adding an `if:` reds
    # tests/ops/test_required_checks_ssot.py (`kind: job`). Accepted cost:
    # every PR pays checkout + pip, and a network flake there reds this
    # required check.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install pyyaml -c requirements/ci-constraints.txt

      - name: Check document links and cross-references (Markdown)
        run: |
          # check_doc_links.py scans the whole repo from --repo-root (default
          # ".") and does not accept positional path arguments. Passing
          # `docs/ rule-packs/` here used to fail with
          # `unrecognized arguments: docs/ rule-packs/`.
          python scripts/tools/lint/check_doc_links.py --ci

      - name: Check raw HTML doc-links (MkDocs-aware)
        run: |
          python scripts/tools/lint/lint_html_doc_links.py --ci

  head-blob-hygiene:
    name: HEAD Blob Hygiene
    # Unconditional: historical blob corruption must be caught on every push,
    # whether or not a given PR touches docs/.
    # Scans every committed blob in HEAD for corruption the staged-file
    # hygiene hook cannot retroactively fix:
    #   - NUL bytes (e.g. the architecture-quiz.jsx regression) — always fatal
    #   - Truncated YAML/JSON (e.g. mkdocs.yml ending in 'CHANGELOG.m') — always fatal
    #   - Missing EOF newlines — detected but NOT failed (~40 pre-existing
    #     drift files as of the harness-hardening PR; needs a separate
    #     cleanup pass before we can enable --strict in CI).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Scan HEAD blobs
        run: |
          # --strict is intentionally omitted until the pre-existing EOF
          # drift is cleaned up. NUL + TRUNC defects still fail the build.
          python scripts/tools/lint/check_head_blob_hygiene.py --ci

  check-frontmatter:
    name: Check Documentation Front Matter
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install pyyaml -c requirements/ci-constraints.txt

      - name: Validate documentation YAML front matter
        run: |
          # add_frontmatter.py scans a single base directory via --base-dir
          # and does not accept positional paths. Run it twice so both
          # docs/ and rule-packs/ are covered; both must pass.
          python scripts/tools/dx/add_frontmatter.py --check --base-dir docs/
          python scripts/tools/dx/add_frontmatter.py --check --base-dir rule-packs/

  check-coverage:
    name: Check Documentation Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install pyyaml -c requirements/ci-constraints.txt

      - name: Check documentation coverage (80% minimum)
        run: |
          # doc_coverage.py scans the whole repo from --repo-root (default
          # ".") and does not accept positional paths. Passing
          # `docs/ rule-packs/` here used to fail with
          # `unrecognized arguments: docs/ rule-packs/`.
          python scripts/tools/dx/doc_coverage.py --ci

  mkdocs-build:
    name: MkDocs Build Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mkdocs-${{ hashFiles('mkdocs.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-mkdocs-

      - name: Install MkDocs and plugins
        run: |
          pip install mkdocs-material mkdocs-static-i18n pymdown-extensions -c requirements/ci-constraints.txt

      - name: Build site (strict mode)
        run: |
          # Single source of truth: scripts/tools/lint/mkdocs_strict_check.sh
          # The same script powers `make lint-docs-mkdocs` for local fast
          # feedback before push. Filter rationales (known-acceptable
          # warning patterns) live as comments in that script.
          bash scripts/tools/lint/mkdocs_strict_check.sh

  documentation-checks:
    # The documentation checks as ONE job (#4224): six jobs each paid
    # checkout + toolchain setup and a runner slot for a check that runs in
    # seconds, and on this repo the runner cap, not execution, is what a PR
    # waits on. Each check keeps its own step, and every check step runs
    # `if: ${{ !cancelled() }}`: a red check does not stop the ones after it,
    # so one run reports every check and the red step names which one.
    # ⛔ Order: MkDocs builds into ./site, inside the workspace, and the link
    # and coverage checks scan the whole repo — so the build runs LAST.
    # Unconditional (#2107): no path filter can express "every Markdown file
    # plus every link target", so a PR that only renamed a linked non-doc
    # file must still run this. Re-adding an `if:` reds
    # tests/ops/test_required_checks_ssot.py (`kind: job`).
    name: Documentation Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          # NOTE: cache: "npm" is intentionally omitted — this repo has no
          # root-level package-lock.json.

      - name: Cache npm global dir (mermaid-cli, puppeteer)
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mermaid-cli
          restore-keys: |
            ${{ runner.os }}-npm-mermaid-

      - name: Install mermaid-cli
        run: |
          npm install -g @mermaid-js/mermaid-cli puppeteer

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('mkdocs.yml', 'requirements/ci-constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-

      - name: Install Python dependencies
        run: |
          pip install pyyaml mkdocs-material mkdocs-static-i18n pymdown-extensions -c requirements/ci-constraints.txt

      - name: Scan HEAD blobs
        if: ${{ !cancelled() }}
        run: |
          # Historical blob corruption the staged-file hygiene hook cannot
          # fix: NUL bytes and truncated YAML/JSON fail; missing EOF newlines
          # are reported but not failed (--strict is omitted until the
          # pre-existing EOF drift is cleaned up).
          python scripts/tools/lint/check_head_blob_hygiene.py --ci

      - name: Check document links and cross-references (Markdown)
        if: ${{ !cancelled() }}
        run: |
          # check_doc_links.py scans the whole repo from --repo-root (default
          # ".") and takes no positional paths.
          python scripts/tools/lint/check_doc_links.py --ci

      - name: Check raw HTML doc-links (MkDocs-aware)
        if: ${{ !cancelled() }}
        run: |
          python scripts/tools/lint/lint_html_doc_links.py --ci

      - name: Validate documentation YAML front matter
        if: ${{ !cancelled() }}
        run: |
          # add_frontmatter.py scans one --base-dir; run it for both trees.
          python scripts/tools/dx/add_frontmatter.py --check --base-dir docs/
          python scripts/tools/dx/add_frontmatter.py --check --base-dir rule-packs/

      - name: Check documentation coverage (80% minimum)
        if: ${{ !cancelled() }}
        run: |
          # doc_coverage.py scans the whole repo from --repo-root (default
          # ".") and takes no positional paths.
          python scripts/tools/dx/doc_coverage.py --ci

      - name: Validate and render Mermaid diagrams
        if: ${{ !cancelled() }}
        run: |
          # Once per tree so a failure names which tree it came from.
          python scripts/tools/lint/validate_mermaid.py docs/ --ci --render
          python scripts/tools/lint/validate_mermaid.py rule-packs/ --ci --render

      - name: Build site (strict mode)
        if: ${{ !cancelled() }}
        run: |
          # Single source of truth: scripts/tools/lint/mkdocs_strict_check.sh
          # (also `make lint-docs-mkdocs`). LAST: it writes ./site.
          bash scripts/tools/lint/mkdocs_strict_check.sh

  i4-runbook-smoke-test:
    # Runs copies of some jq / amtool / promtool / yq snippets from
    # docs/integration/troubleshooting-checklist.md, hand-pasted into the
    # script, against mock JSON/YAML fixtures. It does not read the
    # checklist; tests/lint/test_i4_runbook_doc_anchor.py checks the copies
    # still match it (#2142).
    #
    # Per post-#377 retrospective Q2 + Gemini's "don't defer this to CI;
    # manual scripts bit-rot regardless of churn rate". Tool downloads
    # are ~10s total on ubuntu-latest (jq/curl already built-in).
    name: I-4 Runbook Smoke Test
    runs-on: ubuntu-24.04
    # Not a required status check (`advisory:` in
    # .github/required-checks.yaml). It runs on every PR since #3756 — it was
    # behind the docs path filter only to save its tool downloads, and that
    # filter is gone with the rest.
    steps:
      - uses: actions/checkout@v6

      - name: Install amtool / promtool / yq
        # jq + curl already on ubuntu-latest. Pin versions explicitly so
        # CI catches doc breakage on tool upgrade, not silently passes.
        # PROMTOOL_VERSION is its own pin (not the rule-pack gate's), kept at
        # the same version as ci.yml's rule-pack promtool so one repo does not
        # carry two promtool behaviours (#1337); its MAJOR must match the Prometheus image in
        # k8s/03-monitoring/deployment-prometheus.yaml — a 2.x promtool
        # accepts functions 3.x removed (#1949). Enforced by
        # tests/ops/test_docs_ci_promtool_major.py. Each download is checked
        # against a pinned SHA-256 (upstream sha256sums.txt / yq `checksums`);
        # bump version and digest together.
        # amtool has NO pin of its own (#2294): it is copied out of the
        # Alertmanager image the deployment manifest runs — the same ref, tag
        # and digest, the da-tools image bundles — so a Renovate bump of the
        # manifest moves this check with it. Derived the way validate.yaml's
        # amtool step derives it (config-reloader sidecar not matched).
        run: |
          set -euo pipefail
          AM_IMAGE=$(grep -m1 -oE "prom/alertmanager:[^[:space:]\"']+" \
            k8s/03-monitoring/deployment-alertmanager.yaml || true)
          if [ -z "$AM_IMAGE" ]; then
            echo "ERROR: no prom/alertmanager image found in deployment-alertmanager.yaml" >&2
            exit 1
          fi
          echo "amtool image (from deployment manifest): $AM_IMAGE"
          PROMTOOL_VERSION=3.15.1
          PROMTOOL_SHA256=6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
          YQ_VERSION=4.53.6
          YQ_SHA256=c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385

          DL=$(mktemp -d)
          AM_CID=$(docker create "$AM_IMAGE")
          docker cp "$AM_CID:/bin/amtool" "$DL/amtool"
          docker rm "$AM_CID" >/dev/null
          sudo install -m 0755 "$DL/amtool" /usr/local/bin/

          curl -fsSL -o "$DL/prom.tar.gz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz"
          bash scripts/ops/_verify_download.sh "$DL/prom.tar.gz" "$PROMTOOL_SHA256"
          tar xzf "$DL/prom.tar.gz" -C "$DL"
          sudo install -m 0755 "$DL/prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool" /usr/local/bin/

          curl -fsSL -o "$DL/yq" \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          bash scripts/ops/_verify_download.sh "$DL/yq" "$YQ_SHA256"
          sudo install -m 0755 "$DL/yq" /usr/local/bin/yq

          echo "--- tool versions ---"
          jq --version
          yq --version
          amtool --version 2>&1 | head -1
          promtool --version 2>&1 | head -1

      - name: Run I-4 runbook smoke test
        run: bash scripts/tools/lint/smoke_test_i4_runbook.sh
