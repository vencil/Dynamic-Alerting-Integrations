# docs-ci.yaml — Documentation CI/CD Pipeline
#
# Validates and renders documentation on every PR that touches docs/**/*.md
# or rule-packs/**/*.md.
#
# The workflow itself triggers on EVERY pull_request to main (no top-level
# `paths:` filter) — only individual jobs are gated, via the detect-changes
# job's `docs_changed` output. Reason: several of these job NAMES are
# enrolled in main's branch protection required_status_checks. A workflow
# suppressed entirely by a top-level `paths:` filter reports NO status at
# all for a PR that doesn't touch those paths, and GitHub treats a required
# check with no reported status as permanently pending — blocking merge even
# when every check that DID run is green (PR #928 / #957 both needed a
# manual `--admin` bypass for this). A job that runs and is skipped via its
# own `if:`, by contrast, reports `skipped`, which satisfies the
# requirement. See detect-changes below.
#
# head-blob-hygiene is the one job that intentionally stays unconditional
# (see its own comment) — it's meant to catch historical blob corruption on
# every push regardless of whether a given PR touches docs/.
#
# Jobs:
#   1. validate-mermaid: Syntax check + optional mmdc render of Mermaid diagrams
#   2. check-links: Cross-reference validation (internal links, anchors, files)
#   3. check-frontmatter: YAML front matter consistency check
#   4. check-coverage: Documentation coverage thresholds (80% minimum)
#
# Uses caching (npm + pip) for speed.

name: Documentation CI

on:
  pull_request:
    branches: [main]
  # head-blob-hygiene also runs on every push so historical drift is caught
  # without waiting for a PR that touches docs/.
  push:
    branches: [main]

# Explicit least-privilege grant (repo default is read-only; every sibling
# workflow declares this block too). pull-requests:read is specifically for
# detect-changes' dorny/paths-filter@v3 REST-API mode below.
permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Documentation Changes
    runs-on: ubuntu-latest
    # push events keep today's behavior (every job in this workflow runs
    # unconditionally on push to main) — only pull_request needs gating, so
    # this job is a no-op (and downstream `if:` short-circuits) on push.
    if: github.event_name == 'pull_request'
    outputs:
      docs_changed: ${{ steps.filter.outputs.docs }}
    steps:
      # No actions/checkout here: dorny/paths-filter's default REST-API mode
      # for pull_request events queries the changed-files list via the
      # GitHub API and doesn't need a local clone (see its README's "For
      # pull requests it's not necessary to checkout the code").
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - "docs/**/*.md"
              - "docs/**/*.jsx"
              - "docs/**/*.html"
              - "rule-packs/**/*.md"
              - "README.md"
              - "README.en.md"
              - "CLAUDE.md"
              - "CHANGELOG.md"
              - "mkdocs.yml"
              - "scripts/tools/**/*.py"
              - "scripts/tools/lint/**/*.sh"
              # ⛔ Three inputs reached INDIRECTLY — through a script a gated job
              # merely invokes. That is exactly the class the coverage guard in
              # tests/ops/test_ci_path_filter_coverage.py documents it
              # CANNOT see, so this group is maintained by measurement, not by
              # review: every `python … .py` command in every gated leg of this
              # workflow was replayed under an open()/read_text recorder, and
              # these are the tracked files that came back uncovered.
              #   * .doclinkignore — check_doc_links.py (`check-links`) loads it
              #     to decide which link failures are WAIVED, so editing it alone
              #     changes what that required check enforces while skipping it.
              #   * scripts/tools/lint/mkdocs-anchor-debt.txt — the ledger
              #     `mkdocs-build` passes or fails on, compared as a SET in BOTH
              #     directions (`comm -13` then `comm -23`), so deleting a line
              #     is as fatal as adding one. It landed 2026-08-08 (c33508d2)
              #     already outside this filter: the `**/*.sh` entry above covers
              #     the script but not its data file.
              #   * components/threshold-exporter/README.md — read by
              #     check_doc_links.py; nothing else here reaches it.
              # ⚠️ The sweep is in-process, so it under-reports any leg that
              # fans out through subprocess — `drift-checks` (validate_all.py,
              # 12 subprocess calls) is the one that does. Its inputs are NOT
              # established by this measurement.
              - ".doclinkignore"
              - "scripts/tools/lint/mkdocs-anchor-debt.txt"
              - "components/threshold-exporter/README.md"
              # ⛔ The pin SSOT six of this workflow's gated jobs INSTALL FROM
              # (`pip install … -c requirements/ci-constraints.txt`, #1158) —
              # not a file any doc check reads, which is why no "does a test
              # read it?" review ever caught it. `mkdocs-build` installs the
              # pinned mkdocs-material / static-i18n / pymdown set from it and
              # is the ONLY pre-merge verification that the docs still build
              # (the pre-push strict hook is scoped to docs/mkdocs paths, so a
              # requirements-only push does not trigger it either). Without
              # this entry a bump of those pins touches no `docs` path, every
              # gated leg reports `skipped`, and `all-checks` tolerates
              # `skipped` unconditionally — it fails only on failure/cancelled,
              # deliberately weaker than ci.yml's gate, which re-checks the
              # detect output. So the bump merges with NO pre-merge doc-build
              # signal at all — which is the whole point of a required check.
              # (Every GATED leg reports `skipped`; `head-blob-hygiene` has no
              # `if:` and reports success, which is why `all-checks` is green
              # with nothing having built the docs.) The break then lands
              # post-merge on this workflow's own push-to-main run — push has
              # no top-level `paths:` and `mkdocs-build` gates on
              # `event_name != 'pull_request' || …`, so it runs there — i.e.
              # main goes red for everyone instead of the PR going red for its
              # author.
              #
              # Accepted cost: `docs` is ONE filter gating eight jobs, so a pin
              # bump now also runs the two that do not install from it —
              # doc-line-count and i4-runbook-smoke-test (whose three curl
              # downloads are unverified, i.e. a network-flake surface). Worth
              # it against a silently unbuilt doc site; recorded so it is a
              # choice, not a surprise. Enforced by
              # tests/ops/test_ci_path_filter_coverage.py.
              - "requirements/**"
              - ".github/workflows/docs-ci.yaml"
              - ".pre-commit-config.yaml"

  validate-mermaid:
    name: Validate Mermaid Diagrams
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          # NOTE: cache: "npm" is intentionally omitted — this repo has no
          # root-level package-lock.json (only docs/interactive/ has one).
          # Enabling cache without a lockfile makes setup-node fail with
          # "Dependencies lock file is not found".

      - name: Cache npm global dir (mermaid-cli, puppeteer)
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mermaid-cli
          restore-keys: |
            ${{ runner.os }}-npm-mermaid-

      - name: Install mermaid-cli
        run: |
          npm install -g @mermaid-js/mermaid-cli puppeteer

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install pyyaml -c requirements/ci-constraints.txt

      - name: Validate and render Mermaid diagrams
        run: |
          # Run it twice — once for docs/, once for rule-packs/ — so a failure
          # names which tree it came from. Both must pass. (validate_mermaid.py
          # takes nargs='*' since #1702, so one call with both paths would also
          # work; kept split for the attribution.)
          python scripts/tools/lint/validate_mermaid.py docs/ --ci --render
          python scripts/tools/lint/validate_mermaid.py rule-packs/ --ci --render

  check-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install pyyaml -c requirements/ci-constraints.txt

      - name: Check document links and cross-references (Markdown)
        run: |
          # check_doc_links.py scans the whole repo from --repo-root (default
          # ".") and does not accept positional path arguments. Passing
          # `docs/ rule-packs/` here used to fail with
          # `unrecognized arguments: docs/ rule-packs/`.
          python scripts/tools/lint/check_doc_links.py --ci

      - name: Check raw HTML doc-links (MkDocs-aware)
        run: |
          python scripts/tools/lint/lint_html_doc_links.py --ci

  head-blob-hygiene:
    name: HEAD Blob Hygiene
    # Scans every committed blob in HEAD for corruption the staged-file
    # hygiene hook cannot retroactively fix:
    #   - NUL bytes (e.g. the architecture-quiz.jsx regression) — always fatal
    #   - Truncated YAML/JSON (e.g. mkdocs.yml ending in 'CHANGELOG.m') — always fatal
    #   - Missing EOF newlines — detected but NOT failed (~40 pre-existing
    #     drift files as of the harness-hardening PR; needs a separate
    #     cleanup pass before we can enable --strict in CI).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Scan HEAD blobs
        run: |
          # --strict is intentionally omitted until the pre-existing EOF
          # drift is cleaned up. NUL + TRUNC defects still fail the build.
          python scripts/tools/lint/check_head_blob_hygiene.py --ci

  check-frontmatter:
    name: Check Documentation Front Matter
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install pyyaml -c requirements/ci-constraints.txt

      - name: Validate documentation YAML front matter
        run: |
          # add_frontmatter.py scans a single base directory via --base-dir
          # and does not accept positional paths. Run it twice so both
          # docs/ and rule-packs/ are covered; both must pass.
          python scripts/tools/dx/add_frontmatter.py --check --base-dir docs/
          python scripts/tools/dx/add_frontmatter.py --check --base-dir rule-packs/

  check-coverage:
    name: Check Documentation Coverage
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install pyyaml -c requirements/ci-constraints.txt

      - name: Check documentation coverage (80% minimum)
        run: |
          # doc_coverage.py scans the whole repo from --repo-root (default
          # ".") and does not accept positional paths. Passing
          # `docs/ rule-packs/` here used to fail with
          # `unrecognized arguments: docs/ rule-packs/`.
          python scripts/tools/dx/doc_coverage.py --ci

      - name: Sync glossary abbreviations
        run: |
          python scripts/tools/dx/sync_glossary_abbr.py --check

  mkdocs-build:
    name: MkDocs Build Verification
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mkdocs-${{ hashFiles('mkdocs.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-mkdocs-

      - name: Install MkDocs and plugins
        run: |
          pip install mkdocs-material mkdocs-static-i18n pymdown-extensions -c requirements/ci-constraints.txt

      - name: Build site (strict mode)
        run: |
          # Single source of truth: scripts/tools/lint/mkdocs_strict_check.sh
          # The same script powers `make lint-docs-mkdocs` for local fast
          # feedback before push. Filter rationales (known-acceptable
          # warning patterns) live as comments in that script.
          bash scripts/tools/lint/mkdocs_strict_check.sh

  doc-line-count:
    name: Documentation Line Count Monitor
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Compare doc line counts
        run: |
          PR_LINES=$(find docs rule-packs -name '*.md' -exec cat {} + | wc -l)
          BASE_LINES=$(find base/docs base/rule-packs -name '*.md' -exec cat {} + 2>/dev/null | wc -l)
          DIFF=$((PR_LINES - BASE_LINES))
          echo "Base: $BASE_LINES lines | PR: $PR_LINES lines | Delta: $DIFF lines"
          if [ "$DIFF" -gt 200 ]; then
            echo "::warning::Doc line count increased by $DIFF lines (threshold: 200). Consider trimming redundant content."
          elif [ "$DIFF" -lt -50 ]; then
            echo "::notice::Doc line count decreased by ${DIFF#-} lines. Good job trimming!"
          fi

  drift-checks:
    name: Drift Detection (validate_all.py)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history required: generate_changelog.py --check walks
          # commits from the latest vX.Y.Z tag to HEAD. The default
          # shallow fetch (depth=1) on refs/pull/N/merge left the tag
          # unreachable, which caused changelog to exit 1 with no
          # detail on every PR (observed on PRs #17 and #18).
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          # cli_default_drift below loads every da-tools subcommand to capture
          # its real ArgumentParser, so this leg needs whatever those imports
          # need. Measured under a meta_path finder that blocks site-packages
          # selectively:
          #   * pyyaml is the ONLY hard requirement — block it and a large
          #     share of the 51 commands land in `blind`, which is a hard error
          #     and turns this step red. ⚠️ No count is quoted here on purpose:
          #     three independent runs of that experiment produced three
          #     different numbers (20 / 30 / 47) because the answer depends on
          #     what the measuring process had already imported. The direction
          #     is robust; the magnitude is an artefact.
          #   * promql-parser and croniter are DEFENSIVE, not required —
          #     `migrate_rule.py:54-58` guards promql_parser with
          #     try/except ImportError, and with both removed the captured
          #     defaults are byte-identical and blind stays 0. They are here so
          #     a future unguarded import cannot turn a required check red on an
          #     unrelated PR; both are pinned in the same constraints file.
          # (An earlier revision called promql-parser required and cited a
          # measurement — that measurement showed it was LOADED, which is not
          # the same as needed.)
          pip install pyyaml promql-parser croniter -c requirements/ci-constraints.txt

      - name: Run drift checks (versions, tool-map, doc-map, rule-pack-stats, rule-pack-readme, cli-defaults)
        run: |
          python scripts/tools/validate_all.py \
            --only versions,tool_map,doc_map,rule_pack_stats,byo_rulepack_table,rule_packs,changelog,glossary,includes,repo_name,alerts,cli_default_drift \
            --ci

  i4-runbook-smoke-test:
    # Validates every jq / amtool / promtool / yq invocation in
    # docs/integration/troubleshooting-checklist.md against mock JSON/YAML
    # fixtures. Catches typos before customers do at 3am on-call.
    #
    # Per post-#377 retrospective Q2 + Gemini's "don't defer this to CI;
    # manual scripts bit-rot regardless of churn rate". Tool downloads
    # are ~10s total on ubuntu-latest (jq/curl already built-in).
    name: I-4 Runbook Smoke Test
    runs-on: ubuntu-latest
    needs: detect-changes
    # Not a required status check, but without this gate it would now run
    # (downloading amtool/promtool/yq) on every PR once the workflow-level
    # `paths:` filter above is removed — this keeps today's cost profile.
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.docs_changed == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install amtool / promtool / yq
        # jq + curl already on ubuntu-latest. Pin versions explicitly so
        # CI catches doc breakage on tool upgrade, not silently passes.
        run: |
          set -euo pipefail
          AMTOOL_VERSION=0.27.0
          PROMTOOL_VERSION=2.50.0
          YQ_VERSION=4.40.5

          cd /tmp
          curl -fsSL -o amtool.tar.gz \
            "https://github.com/prometheus/alertmanager/releases/download/v${AMTOOL_VERSION}/alertmanager-${AMTOOL_VERSION}.linux-amd64.tar.gz"
          tar xzf amtool.tar.gz
          sudo install -m 0755 "alertmanager-${AMTOOL_VERSION}.linux-amd64/amtool" /usr/local/bin/

          curl -fsSL -o prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz"
          tar xzf prom.tar.gz
          sudo install -m 0755 "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool" /usr/local/bin/

          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

          echo "--- tool versions ---"
          jq --version
          yq --version
          amtool --version 2>&1 | head -1
          promtool --version 2>&1 | head -1

      - name: Run I-4 runbook smoke test
        run: bash scripts/tools/lint/smoke_test_i4_runbook.sh

  all-checks:
    name: All Documentation Checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate-mermaid
      - check-links
      - head-blob-hygiene
      - check-frontmatter
      - check-coverage
      - mkdocs-build
      - drift-checks
      - i4-runbook-smoke-test
    steps:
      - name: Check results
        run: |
          echo "validate-mermaid: ${{ needs.validate-mermaid.result }}"
          echo "check-links: ${{ needs.check-links.result }}"
          echo "head-blob-hygiene: ${{ needs.head-blob-hygiene.result }}"
          echo "check-frontmatter: ${{ needs.check-frontmatter.result }}"
          echo "check-coverage: ${{ needs.check-coverage.result }}"
          echo "mkdocs-build: ${{ needs.mkdocs-build.result }}"
          echo "drift-checks: ${{ needs.drift-checks.result }}"
          echo "i4-runbook-smoke-test: ${{ needs.i4-runbook-smoke-test.result }}"
          # `cancelled` must fail like `failure` (mirrors the fail-closed
          # semantics of ci.yml's "Python Tests (3.13)" aggregation gate). The
          # previous form compared against "failure" only, so a job killed by
          # the concurrency group or a dead runner reported `cancelled` and
          # this required check went GREEN with that documentation leg never
          # having run. `skipped` is deliberately still tolerated — these legs
          # are path-gated by design and a skip is the intended no-op.
          bad=0
          for pair in \
            "validate-mermaid:${{ needs.validate-mermaid.result }}" \
            "check-links:${{ needs.check-links.result }}" \
            "head-blob-hygiene:${{ needs.head-blob-hygiene.result }}" \
            "check-frontmatter:${{ needs.check-frontmatter.result }}" \
            "check-coverage:${{ needs.check-coverage.result }}" \
            "mkdocs-build:${{ needs.mkdocs-build.result }}" \
            "drift-checks:${{ needs.drift-checks.result }}" \
            "i4-runbook-smoke-test:${{ needs.i4-runbook-smoke-test.result }}"; do
            job="${pair%%:*}"; res="${pair#*:}"
            if [[ "$res" == "failure" || "$res" == "cancelled" ]]; then
              echo "::error::documentation check '$job' → $res"
              bad=1
            fi
          done
          if [[ "$bad" -ne 0 ]]; then
            echo "::error::One or more documentation checks failed"
            exit 1
          fi
          echo "All documentation checks passed"
