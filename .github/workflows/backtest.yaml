name: Threshold Backtest
on:
  pull_request:
    paths:
      - 'components/threshold-exporter/config/conf.d/**'
      # #3111: the tool, the modules that decide what it compares, and this
      # workflow, so a change to how the backtest runs is run here too (as
      # config-diff-advisory.yml lists its own). A PR that changes none of
      # conf.d/ still gets a result: without a reachable Prometheus (no
      # PROMETHEUS_URL secret) it is "Prometheus is unavailable" — that check
      # comes before the "no threshold changes found." one — and goes to the
      # job summary only (see `Check for report`); with one, the latter, as
      # a PR comment.
      - 'scripts/tools/ops/backtest_threshold.py'
      - 'scripts/tools/ops/_observed_map_lib.py'
      - 'scripts/tools/ops/metric_observed_map.yaml'
      - 'scripts/tools/_lib_tenant_values.py'
      - 'scripts/tools/_lib_validation.py'
      - '.github/workflows/backtest.yaml'
      # #3756: the rest of what the job reads — the da-guard Go sources it
      # builds, the shared `_lib_*` modules the tool imports, the Makefile —
      # from what the job was measured to read by access time
      # (.github/path-traces/backtest.yaml.json), less what a pattern above
      # already covers. The job's assert step fails, naming the file, when it
      # reads something this list does not cover. Do not edit between the
      # markers.
      # BEGIN GENERATED path-trace (scripts/ops/workflow_path_filter.py generate)
      - ".github/path-traces/backtest.yaml.json"
      - ".python-version"
      - "Makefile"
      - "components/threshold-exporter/app/cmd/da-guard/*.go"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/compile-custom-alerts.want"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/conf.d/_defaults.yaml"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/conf.d/team/t1.yaml"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/default.stderr"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/default.want"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/effective.want"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/key-refs.want"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/key-spellings.input"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/key-spellings.want"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/key-verdict.want"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/parse-tree.want"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/served-values.want"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/severity-dedup.want"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/threshold-values.input"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/threshold-values.want"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/write.input"
      - "components/threshold-exporter/app/cmd/da-guard/selfcheck/write.want"
      - "components/threshold-exporter/app/go.mod"
      - "components/threshold-exporter/app/go.sum"
      - "components/threshold-exporter/app/internal/confdlayout/*.go"
      - "components/threshold-exporter/app/internal/guard/*.go"
      - "components/threshold-exporter/app/internal/guard/findingkind/*.go"
      - "components/threshold-exporter/app/internal/scrape/*.go"
      - "components/threshold-exporter/app/internal/thresholdmetric/*.go"
      - "components/threshold-exporter/app/pkg/confdname/*.go"
      - "components/threshold-exporter/app/pkg/confedit/*.go"
      - "components/threshold-exporter/app/pkg/config/*.go"
      - "components/threshold-exporter/app/pkg/config/recipe_contract.json"
      - "components/threshold-exporter/app/pkg/keyverdict/*.go"
      - "components/threshold-exporter/app/pkg/parsetree/*.go"
      - "components/threshold-exporter/app/pkg/receiverspec/*.go"
      - "components/threshold-exporter/app/pkg/tenantid/*.go"
      - "components/threshold-exporter/app/pkg/tenantid/tenant_id.json"
      - "components/threshold-exporter/app/third_party/yaml.v3/*.go"
      - "components/threshold-exporter/app/third_party/yaml.v3/go.mod"
      - "helm/threshold-exporter/Chart.yaml"
      - "requirements/ci-constraints.txt"
      - "scripts/ops/atime_trace.py"
      - "scripts/ops/go_build.sh"
      - "scripts/ops/paths_filter_glob.py"
      - "scripts/ops/workflow_path_filter.py"
      - "scripts/tools/_lib_atomic_write.py"
      - "scripts/tools/_lib_compat.py"
      - "scripts/tools/_lib_confd.py"
      - "scripts/tools/_lib_confedit.py"
      - "scripts/tools/_lib_constants.py"
      - "scripts/tools/_lib_consumer_read.py"
      - "scripts/tools/_lib_exitcodes.py"
      - "scripts/tools/_lib_godispatch.py"
      - "scripts/tools/_lib_input.py"
      - "scripts/tools/_lib_io.py"
      - "scripts/tools/_lib_label.py"
      - "scripts/tools/_lib_parse_cache.py"
      - "scripts/tools/_lib_parse_tree.py"
      - "scripts/tools/_lib_paths.py"
      - "scripts/tools/_lib_prometheus.py"
      - "scripts/tools/_lib_python.py"
      - "scripts/tools/_lib_tool_fault.py"
      - "scripts/tools/_lib_write_check.py"
      - "scripts/tools/_lib_yaml_strict.py"
      - "scripts/tools/ops/_registry_lib.py"
      - "scripts/tools/ops/_rule_packs_generated.py"
      - "scripts/tools/ops/guard_dispatch.py"
      - "scripts/tools/ops/scaffold_tenant.py"
      # END GENERATED path-trace

permissions:
  contents: read
  pull-requests: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    # #3756: no job-level `continue-on-error` — it would make the assert
    # step's failure not count. What stays advisory is said per step: the
    # backtest itself and the PR comment.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # BEGIN GENERATED path-trace-env job=backtest
      - name: Set access times back, to measure what this job reads (#3756)
        run: python3 -I scripts/ops/atime_trace.py reset --state "$RUNNER_TEMP/atime-trace.json" --canary-dir "$GITHUB_WORKSPACE/.git/atime-canary"
      # END GENERATED path-trace-env

      # #3111: the tool no longer checks a base out itself; the PR base is
      # checked out here, into its own path, and compared as a second tree.
      - name: Check out the PR base
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .backtest-base
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pip install pyyaml -c requirements/ci-constraints.txt

      # #2119: --config-dir / --baseline have the exporter read both trees
      # (`da-guard served-values`). Without da-guard the run ends rc 2
      # `served_values_unavailable` before the Prometheus check, so the
      # comment would say that instead of the backtest. Built from the PR
      # checkout, so both trees are read by the same binary.
      - name: Set up Go (da-guard)
        uses: actions/setup-go@v6
        with:
          go-version-file: components/threshold-exporter/app/go.mod
          cache: true
          cache-dependency-path: components/threshold-exporter/app/go.sum

      - name: Build da-guard
        run: |
          make da-guard-build
          echo "DA_GUARD_BINARY=$PWD/.build/da-guard" >> "$GITHUB_ENV"

      # #3111: a PR that adds the first conf.d/ has no base tree to compare
      # with; say so in the comment instead of ending rc 2 on a --baseline
      # that is not there or holds no config file.
      - name: Check the PR base has a conf.d/
        id: base
        run: |
          # At least one *.yaml / *.yml file (any case, as the exporter matches
          # it; a symlink to a file counts, a directory or a dangling symlink
          # does not) under it, hidden files and directories skipped as the
          # exporter skips them: an empty conf.d/ (or one holding only a
          # README) is a tree the exporter refuses ("no .yaml files found").
          # -H: conf.d/ itself may be a symlink to a directory.
          confd=.backtest-base/components/threshold-exporter/config/conf.d
          if [ -d "$confd" ] && [ -n "$(find -H "$confd" -mindepth 1 -name '.*' -prune -o \
              \( -iname '*.yaml' -o -iname '*.yml' \) \( -type f -o -xtype f \) \
              -print -quit)" ]; then
            echo "has_confd=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the PR base has no conf.d/ config file to compare against; backtest skipped"
            printf '%s\n' '## Threshold Backtest Results' '' \
              '> **Backtest not run:** the PR base has no `conf.d/` config file to compare against.' \
              > /tmp/backtest-comment.md
          fi

      - name: Run backtest
        id: backtest
        if: steps.base.outputs.has_confd == 'true'
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
        # PR 的 conf.d/ 對 PR base 的 conf.d/（上一步另外 checkout 到
        # .backtest-base）；客戶 repo 的 conf.d 在 repo root 時兩個路徑照改。
        working-directory: components/threshold-exporter/config
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/tools/ops/backtest_threshold.py" \
            --config-dir conf.d \
            --baseline "$GITHUB_WORKSPACE/.backtest-base/components/threshold-exporter/config/conf.d" \
            --prometheus "${PROMETHEUS_URL:-http://localhost:9090}" \
            --skip-if-unavailable \
            --markdown-output /tmp/backtest-comment.md \
            --output /tmp/backtest-report.json
        continue-on-error: true

      - name: Check for report
        id: report
        # hashFiles() 只能讀 GITHUB_WORKSPACE 內的檔案（/tmp 恆回空字串），
        # 改用 step output gate：本步寫 has_comment，下一步依它判斷。
        #
        # #3756 (owner ruling 2026-11-21): every result goes to the job
        # summary; the PR comment is for a backtest that ran or was refused.
        # One skipped because no Prometheus is reachable says nothing about
        # the PR, and since the path filter became what the job reads, about
        # half of all PRs start this workflow. Read from the JSON report's
        # `status`/`reason`, not from the comment's wording; a report that is
        # absent or unreadable (the base has no conf.d/) is not that case,
        # so the comment is posted.
        run: |
          if [ -s /tmp/backtest-comment.md ]; then
            cat /tmp/backtest-comment.md >> "$GITHUB_STEP_SUMMARY"
            if python3 -c 'import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          sys.exit(0 if (d.get("status"), d.get("reason")) == ("skipped", "prometheus_unavailable") else 1)
          ' /tmp/backtest-report.json 2>/dev/null; then
              echo "::notice::backtest not run: Prometheus is unavailable — result in the job summary, no PR comment"
            else
              echo "has_comment=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Comment PR
        if: steps.report.outputs.has_comment == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          path: /tmp/backtest-comment.md
          header: threshold-backtest
        # A PR from a fork has no token that may comment; the job was
        # `continue-on-error` as a whole before #3756.
        continue-on-error: true

      # #3756: every tracked file this job read must be in
      # `on.pull_request.paths` above. The base checkout (.backtest-base) is
      # not this commit's tree and is not measured. Only artifact uploads
      # may follow (`generate --check` refuses anything else). Generated.
      # BEGIN GENERATED path-trace-assert job=backtest
      - name: Path filter covers everything this job read (#3756)
        if: ${{ !cancelled() }}
        run: python3 -I scripts/ops/atime_trace.py finish --state "$RUNNER_TEMP/atime-trace.json" && python3 scripts/ops/workflow_path_filter.py assert --workflow backtest.yaml --job backtest --state "$RUNNER_TEMP/atime-trace.json" --out "$RUNNER_TEMP/path-trace.json" --leg "${{ strategy.job-index }}/${{ strategy.job-total }}"
      # END GENERATED path-trace-assert

      # What `assert --out` wrote: on a red run, `workflow_path_filter.py
      # merge` this file into .github/path-traces/backtest.yaml.json.
      - name: Upload the trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: path-trace-backtest-backtest
          path: ${{ runner.temp }}/path-trace.json
          if-no-files-found: warn
