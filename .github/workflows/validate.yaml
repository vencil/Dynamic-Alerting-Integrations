# validate.yaml — PR validation pipeline
#
# Runs on every PR. Catches issues before merge.
#
# The workflow triggers on EVERY pull_request to main (no top-level `paths:`
# filter) and no job in it is path-gated (#3756): every PR runs all three.
# Reason for the first half: all 3 job NAMES below (Go Lint,
# Validate Tenant Config & Routes, Version Consistency) are enrolled in
# main's branch protection
# required_status_checks. A workflow suppressed entirely by a top-level
# `paths:` filter reports NO status at all for a PR that doesn't touch those
# paths, and GitHub treats a required check with no reported status as
# permanently pending — blocking merge even when every check that DID run is
# green. This is the exact same bug class docs-ci.yaml hit (see that
# workflow's banner comment): a tenant-api-only PR pre-#216, then a
# helm/**/docs/** PR surfaced by #972/GHSA-3g2h-rf85-5rrv, both "fixed" by
# adding more paths to the filter list — which only delayed the next PR
# shape that wasn't on the list from hitting the same wall. Reason for the
# second half: a job skipped via its own `if:` reports `skipped`, which also
# satisfies the requirement, so a job-level path filter that missed one
# input skipped the check that would have caught the break. That filter was
# a hand-kept list too, and it is gone.
#
# The required NAMES belong to the `*-gate` jobs at the end of this file
# (#1398), which always run and fail unless their leg concluded `success`;
# the legs themselves are named `… — run`.
#
# DEDUP (CI-ROI wave): the former `python-tests` ("Python Tests") and
# `go-tests` ("Go Tests") jobs of this workflow were strict SUBSETS of
# ci.yml's "Python Tests" and "Go Tests":
#   - python-tests ran the SAME `pytest tests/` with the SAME --ignore list
#     as ci.yml, but with fewer optional CLIs installed (no helm / vector /
#     mtail / jsonschema) → strictly MORE silent skips, zero extra coverage.
#   - go-tests ran threshold-exporter only, WITHOUT -race / -count=1 and
#     without tenant-api at all — ci.yml runs both modules with the race
#     detector.
# Every PR paid for both duplicate runs; the two jobs are REMOVED and
# ci.yml is the single source of Python/Go test coverage on PRs.
#
# ⛔ OWNER RUNBOOK — flip branch protection BEFORE merging the PR that
# carries this change (Settings → Branches → main → required status
# checks):
#   - REMOVE "Python Tests" and "Go Tests"          (this workflow's
#     deleted job names — once the jobs are gone these checks would sit
#     "Expected" forever and hard-block EVERY PR)
#   - ADD "Python Tests" and "Go Tests" (the ci.yml
#     equivalents; ci.yml runs unfiltered on every PR + push to main, so
#     the names are reported on every PR — verify they appear in the
#     latest CI run before enrolling, per the iac-lint-baseline checklist
#     caveat)
# Until the flip, the PR carrying THIS change is itself blocked by the old
# required checks — that is expected behavior, not a bug: flip first, then
# merge.
#
# Checks:
#   1. Go lint (every Go module; linter sets live in each module's
#      .golangci.yml, and tests/ops/test_go_lint_module_coverage.py
#      asserts the floor)
#   2. Tenant config validation (schema + routing + policy)
#   3. Custom rule linting (deny-list)
#   4. Version consistency (bump_docs --check)
# (Python/Go tests live in ci.yml — see DEDUP note above.)

name: Validate

on:
  pull_request:
    branches: [main]

# Explicit least-privilege grant (repo default is read-only; every sibling
# workflow declares this block too).
permissions:
  contents: read

jobs:
  # (python-tests / go-tests jobs removed — see the DEDUP + OWNER RUNBOOK
  # banner at the top of this file. ci.yml's "Python Tests" and
  # "Go Tests" are the required checks now.)

  go-lint:
    name: Go Lint — run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: components/threshold-exporter/app/go.mod
      # golangci-lint, version pinned in GOLANGCI_VERSION below (kept equal to
      # the dev container's by tests/ops/test_go_lint_module_coverage.py).
      # Download the pinned install script and verify its SHA-256 BEFORE
      # executing — no unverified
      # `curl | sh` — matching the hadolint download-then-verify pattern in
      # ci.yml. The verified script in turn checks the golangci-lint binary's
      # own checksum against the release.
      # Download-cache for the golangci-lint BINARY (versioned-name + cache
      # pattern per ci.yml's Lint job hadolint step). Unlike the tarball
      # caches, the installed binary itself is cached — and, upholding the
      # workflow-wide "SHA-256 verification ALWAYS runs, on cached bytes
      # too" invariant, the install step below verifies the binary against
      # a pinned digest on EVERY run, cache hit and fresh install alike (a
      # cache-poisoned entry fails the job; it is never executed). The
      # binary lands in a VERSION-NAMED directory, so a version bump with a
      # stale cache key can never silently reuse the old binary (the new
      # versioned dir simply won't exist → clean reinstall, re-downloading
      # every run until the key is fixed). This is a HARD step: an install
      # or verification failure fails the job, so the cache post-save can't
      # capture a partial entry.
      - name: Cache golangci-lint binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/vibe-dl-golangci
          key: ${{ runner.os }}-vibe-dl-golangci-v2.12.2

      # Go module + build cache. ⛔ Deliberately the SAME key namespace as
      # ci.yml's Go legs, not a private one: this workflow is pull_request-only,
      # so it never writes a default-branch cache, and a `-go-lint-` namespace
      # would miss on every PR's first run while ci.yml's warm entry sat next to
      # it. Sharing makes the first run warm.
      - name: Cache Go modules + build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        run: |
          GOLANGCI_VERSION=v2.12.2
          # Pinned SHA-256 of the `golangci-lint` ELF binary shipped inside
          # golangci-lint-2.12.2-linux-amd64.tar.gz. Provenance chain (re-derivable
          # independently): download that archive from the official
          # github.com/golangci/golangci-lint release, check it against the same
          # release's golangci-lint-2.12.2-checksums.txt entry
          # (8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553),
          # extract, then sha256sum the contained `golangci-lint` file. install.sh
          # copies that binary byte-identically, so hit and miss paths verify
          # against the same digest.
          GOLANGCI_BIN_SHA256=e26335d9bd381a60e5769a13b0ccc7967db5b6fb9c39a896a1f6fd0befe0a661
          BIN="$HOME/.cache/vibe-dl-golangci/${GOLANGCI_VERSION}"
          if [ ! -x "$BIN/golangci-lint" ]; then
            GOLANGCI_INSTALL_SHA256=d32d3534af96cfd59546a084d22b213e8a47541cada5013aa8a84c4fa2589905
            curl -fsSL -o /tmp/golangci-install.sh \
              "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_VERSION}/install.sh"
            bash scripts/ops/_verify_download.sh /tmp/golangci-install.sh "$GOLANGCI_INSTALL_SHA256"
            sh /tmp/golangci-install.sh -b "$BIN" "$GOLANGCI_VERSION"
          fi
          # ALWAYS verify — cache hit AND fresh install (the "SHA-256
          # verification always runs on cached bytes" invariant). On mismatch
          # the helper DELETES the untrusted binary and exits 1 → job red →
          # no cache post-save → the next run is a clean miss that
          # reinstalls. A poisoned entry already stored under this exact key
          # keeps failing (loudly) until it is deleted or the key is bumped —
          # safety over availability, same trade as the tarball caches.
          bash scripts/ops/_verify_download.sh "$BIN/golangci-lint" "$GOLANGCI_BIN_SHA256"
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/golangci-lint" version
      # #1870. Which linters a module runs is golangci's own answer — default
      # group ∪ enable − disable — so the floor is checked against
      # `golangci-lint linters --json` rather than modelled in Python (the
      # groups differ across versions; on 2.12.2 `fast` drops errcheck, govet,
      # staticcheck and unused). Every tracked .golangci.yml is checked, which
      # covers each lint step below: each is required to have one.
      # tests/ops/test_go_lint_module_coverage.py pins that GOLANGCI_FLOOR keeps
      # the standard linters, that configs are discovered with `git ls-files`,
      # and that no linted module is named here. ⚠️ NOT pinned: an enumeration
      # that names no module literally (a shell glob) — keep it `git ls-files`.
      # Enablement is not reporting, so each config is also run against probes
      # (#1877; see the loop's comment). Resolution is one probe per TOP-LEVEL
      # directory of the module. ⚠️ NOT GUARDED, measured: a rule scoped BELOW
      # that (`path: ^internal/rbac/`) silences those files while the probe in
      # `internal/` still reports; a rule written around the probe's own path,
      # text or symbols; and suppression that is not in the config at all —
      # `//nolint` directives and files carrying a generated-code header, which
      # a probe asks nothing about. ⛔ And the nearest miss of all: the verdict
      # is "at least one finding", so `settings` that cut a linter down to a
      # single surviving check (`staticcheck.checks: ["-all", "SA4000"]`,
      # `govet.disable-all` + one `enable:`) pass — measured. Requiring every
      # planted check instead would red on legitimate narrowing, which is the
      # trade this predicate makes.
      - name: Linter floor
        env:
          GOLANGCI_FLOOR: errcheck govet ineffassign staticcheck unused godoclint
        run: |
          set -euo pipefail
          configs=$(git ls-files -- ':(glob)**/.golangci.yml')
          if [ -z "$configs" ]; then
            echo "::error::no tracked .golangci.yml, so there is nothing to check"
            exit 1
          fi
          status=0
          checked=0
          for cfg in $configs; do
            dir=$(dirname "$cfg")
            enabled=$(cd "$dir" && golangci-lint linters --json | jq -r '(.Enabled // [])[].name')
            # `checked=$((…))`, not `((checked++))`: the latter returns 1 when the
            # old value is 0, and `set -e` would end the step on the first config.
            checked=$((checked + 1))
            echo "checked $cfg"
            if [ -z "$enabled" ]; then
              echo "::error file=$cfg::golangci-lint reports no enabled linters for $dir"
              status=1
              continue
            fi
            for linter in $GOLANGCI_FLOOR; do
              if ! grep -qxF "$linter" <<<"$enabled"; then
                echo "::error file=$cfg::$dir does not run $linter (GOLANGCI_FLOOR)"
                status=1
              fi
            done
            # Enabled is not reporting: an `exclusions` rule or a linter's own
            # `settings` can silence it without changing the list above
            # (#1877). So lint a probe with THIS module's config and let
            # golangci evaluate those carriers.
            #
            # ⛔ One probe per directory that holds the module's own .go files,
            # not one at the module root: `path` rules match the path, and
            # tenant-api has no .go at its root at all, so a rule naming the
            # directories where the code actually lives (`^(internal|cmd)/`)
            # silenced those linters on every real file while a root-only
            # probe stayed green — measured, and the reason this loop derives
            # the directories instead of picking one.
            #
            # Directories come from git rather than a list, minus anything
            # under a NESTED go.mod (scripts/tools/ops/bench-canary is its own
            # module with its own config and its own turn in this loop).
            if [ ! -f "$dir/go.mod" ]; then
              echo "floor: $cfg is not at a module root — enablement checked, probe skipped"
              continue
            fi
            nested=$(git ls-files -- ":(glob)$dir/*/**/go.mod" ":(glob)$dir/*/go.mod" | xargs -r -n1 dirname)
            probe_dirs=$(git ls-files -- ":(glob)$dir/**/*.go" | {
              [ -z "$nested" ] && cat || grep -vE "^($(tr '\n' '|' <<<"$nested" | sed 's/|$//'))/"
            } | sed "s|^$dir/||" | awk -F/ '{ print (NF == 1 ? "." : $1) }' | sort -u)
            if [ -z "$probe_dirs" ]; then
              echo "floor: $dir tracks no .go of its own — probe skipped"
              continue
            fi
            targets=""
            probes=""
            placed=ok
            for pd in $probe_dirs; do
              if [ "$pd" = "." ]; then rel_dir="zz_lintprobe"; else rel_dir="$pd/zz_lintprobe"; fi
              probe="$dir/$rel_dir"
              if [ -e "$probe" ]; then
                echo "::error file=$cfg::$probe already exists; the floor probe needs that path"
                placed=taken
                break
              fi
              mkdir -p "$probe"
              probes="$probes $probe"
              if ! cp scripts/ops/golangci_floor_probe.go.txt "$probe/probe.go"; then
                echo "::error file=$cfg::cannot read the floor probe template for $dir"
                placed=failed
                break
              fi
              targets="$targets ./$rel_dir/..."
            done
            if [ "$placed" != ok ]; then
              rm -rf $probes
              status=1
              continue
            fi
            # The flags undo dedup and caps (they hide findings this loop
            # counts) and pin the output shape the grep below reads: an
            # `output:` section that drops the linter name or prints absolute
            # paths would otherwise read as "every linter is silenced".
            rc=0
            out=$(cd "$dir" && golangci-lint run --uniq-by-line=false \
              --max-issues-per-linter=0 --max-same-issues=0 \
              --output.text.path=stdout --output.text.print-linter-name=true \
              --output.text.colors=false --path-mode= --path-prefix= \
              $targets) || rc=$?
            rm -rf $probes
            if [ "$rc" -gt 1 ]; then
              echo "::error file=$cfg::golangci-lint could not lint the floor probe in $dir (rc=$rc)"
              status=1
              continue
            fi
            for pd in $probe_dirs; do
              if [ "$pd" = "." ]; then rel="zz_lintprobe/probe.go"; else rel="$pd/zz_lintprobe/probe.go"; fi
              for linter in $GOLANGCI_FLOOR; do
                grep -qxF "$linter" <<<"$enabled" || continue
                if ! grep -qE "^$rel:[0-9]+:[0-9]+: .* \\($linter\\)\$" <<<"$out"; then
                  echo "::error file=$cfg::$linter is enabled in $dir but reports nothing on the probe at $rel — this config's exclusions or settings do not let it reach that path. If every module and every path says this, the probe is stale instead."
                  status=1
                fi
              done
            done
          done
          # A green step is otherwise silent, which reads the same as checking nothing.
          echo "floor: checked $checked config(s) against: $GOLANGCI_FLOOR"
          exit "$status"
      # The two production modules. Their per-module .golangci.yml adds the
      # depguard dependency-direction ratchets (domain↛handler for tenant-api,
      # logic↛net/http for exporter) on top of the standard set. The same two
      # directions are also asserted by import_direction_test.go in each
      # module, which does not depend on this config (#1870).
      - name: Lint tenant-api
        working-directory: components/tenant-api
        run: golangci-lint run ./...
      - name: Lint threshold-exporter
        working-directory: components/threshold-exporter/app
        run: golangci-lint run ./...
      # #1751: the remaining Go modules. Until these steps existed no linter
      # read them, while the two above printed `0 issues` — a report that reads
      # like whole-repo coverage. ⛔ Do not add or drop a step by hand-counting:
      # tests/ops/test_go_lint_module_coverage.py derives the set from
      # `git ls-files` and requires every tracked .go to be reachable from it.
      - name: Lint bench-canary
        working-directory: scripts/tools/ops/bench-canary
        run: golangci-lint run ./...
      - name: Lint alertmanager-inhibit
        working-directory: tests/alertmanager-inhibit
        run: golangci-lint run ./...
      # ADR-027 §9 item 9: the module that loads the tenant-api chart's
      # oauth2-proxy config with oauth2-proxy's own code.
      - name: Lint oauth2-proxy
        working-directory: tests/oauth2-proxy
        run: golangci-lint run ./...
      # #1018: the module that judges every rendered pod with the upstream
      # Pod Security Admission library.
      - name: Lint pss
        working-directory: tests/pss
        run: golangci-lint run ./...
      # #3206: da-read, the module that keeps the alertmanager dependency out
      # of the exporter module; it ships in the da-tools image.
      - name: Lint da-read
        working-directory: components/da-read
        run: golangci-lint run ./...
      - name: Lint e2e-bench receiver
        working-directory: tests/e2e-bench/receiver
        run: golangci-lint run ./...
      # #1816: the module that exists only so bench_filter.go — the one tracked
      # .go beside, not inside, a module — is read by a linter at all.
      - name: Lint bench-filter
        working-directory: scripts/tools/ops
        run: golangci-lint run ./...

  validate-config:
    name: Validate Tenant Config & Routes — run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install pyyaml -c requirements/ci-constraints.txt

      # ADR-036 step 4 (#2906) moves the route generator onto `da-guard
      # parse-tree` (yaml.v3); from then on it exits 2 without a da-guard.
      # Built from this checkout, as guard-defaults-impact.yml builds its own.
      - name: Set up Go (da-guard for the route generator; da-read / da-crdecode)
        uses: actions/setup-go@v6
        with:
          go-version-file: components/threshold-exporter/app/go.mod
          cache: true
          cache-dependency-path: |
            components/threshold-exporter/app/go.sum
            components/da-read/go.sum
      - name: Build da-guard
        run: |
          # The shipped shape: scripts/ops/go_build.sh holds the build flags
          # (#3174 CGO_ENABLED=0, #3425 -trimpath / -s -w), as build.sh / release.yaml.
          sh scripts/ops/go_build.sh components/threshold-exporter/app ./cmd/da-guard "$RUNNER_TEMP/da-guard"
          echo "DA_GUARD_BINARY=$RUNNER_TEMP/da-guard" >> "$GITHUB_ENV"
      # The route generator's platform probe set (configmap-rules-platform)
      # and the custom-rule lint read rule files too.
      # #3206 (ADR-036 §12): the rule files these steps read are read the way
      # Prometheus' rule loader reads them (`da-read prometheus-rules`) and
      # their ConfigMaps the way kubectl reads them (da-crdecode). Built from
      # this checkout and exported; a failed build fails the job, and a tool
      # without them fails by name — never a PyYAML fallback.
      - name: Build da-read / da-crdecode
        run: |
          make da-read-build da-crdecode-build
          echo "DA_READ_BINARY=$PWD/.build/da-read" >> "$GITHUB_ENV"
          echo "DA_CRDECODE_BINARY=$PWD/.build/da-crdecode" >> "$GITHUB_ENV"

      # Schema validation + routing validation + webhook domain allowlist.
      # --strict (ADR-007): domain-policy violations are BLOCKING here —
      # without it check_domain_policies() only ever emitted WARN and a
      # violating config sailed through this required check.
      # ⛔ THIS is the routing gate for TENANT files (#2315):
      # guard-defaults-impact.yml (da-guard plus this same generator check,
      # #2904) runs only when a `_`-prefixed platform file changes. Both shipped conf.d trees are gated — the dev tree and
      # the try-local seed (its `db-demo` tenant carries `_routing`, so this
      # is not a zero-route pass; `cache-demo` has none). A tenant id declared
      # in two files fails here too.
      - name: Validate alertmanager routes
        run: |
          for confd in components/threshold-exporter/config/conf.d/ \
                       try-local/seed/conf.d/; do
            echo "::group::generate-routes --validate --strict: $confd"
            python scripts/tools/ops/generate_alertmanager_routes.py \
              --config-dir "$confd" \
              --validate \
              --strict \
              --policy .github/custom-rule-policy.yaml
            echo "::endgroup::"
          done

      # Render the GitOps ConfigMap and validate it with Alertmanager's OWN
      # parser (amtool). The --validate step above has Alertmanager's loader
      # (da-read) read the config it assembles on the built-in base, not the
      # k8s one — it cannot catch defects AM rejects at load in this one
      # (e.g. email `to` as a YAML seq → "unmarshal !!seq into string", or a
      # missing SMTP `from` → "no global SMTP from set"). #838.
      # The amtool image is DERIVED from the deployment manifest (single source
      # of truth) so a cluster Alertmanager version bump can't leave this guard
      # validating against a stale parser. Matches `prom/alertmanager:<tag>`
      # specifically → the config-reloader sidecar image is ignored.
      - name: Validate rendered Alertmanager config (amtool)
        run: |
          mkdir -p /tmp/am-etc
          AM_IMAGE=$(grep -oE "prom/alertmanager:[^[:space:]\"']+" k8s/03-monitoring/deployment-alertmanager.yaml | head -1)
          if [ -z "$AM_IMAGE" ]; then
            echo "ERROR: no prom/alertmanager image found in deployment-alertmanager.yaml" >&2
            exit 1
          fi
          echo "amtool image (from deployment manifest): $AM_IMAGE"
          python -c "import yaml,pathlib;d=yaml.safe_load(open('k8s/03-monitoring/configmap-alertmanager.yaml',encoding='utf-8'));pathlib.Path('/tmp/am-base.yml').write_text(d['data']['alertmanager.yml'],encoding='utf-8')"
          # --strict: fail-closed on the #1132 equal-label-gated invariant over
          # the base (committed Silent/Custom rules) + generated dedup merge, in
          # addition to amtool's syntax check. (amtool is green on an ungated
          # equal-label that silently drops notifications; --strict is not.)
          python scripts/tools/ops/generate_alertmanager_routes.py \
            --config-dir components/threshold-exporter/config/conf.d/ \
            --output-configmap \
            --base-config /tmp/am-base.yml \
            --strict \
            -o /tmp/am-cm.yml
          python -c "import yaml,pathlib;d=yaml.safe_load(open('/tmp/am-cm.yml',encoding='utf-8'));pathlib.Path('/tmp/am-etc/alertmanager.yml').write_text(d['data']['alertmanager.yml'],encoding='utf-8')"
          docker run --rm --entrypoint amtool \
            -v /tmp/am-etc:/etc/alertmanager \
            "$AM_IMAGE" \
            check-config /etc/alertmanager/alertmanager.yml

      # Custom rule deny-list linting
      - name: Lint custom rules
        run: |
          python scripts/tools/ops/lint_custom_rules.py \
            --rule-pack-dir rule-packs/ \
            --policy .github/custom-rule-policy.yaml \
            --ci

  version-check:
    name: Version Consistency — run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install pyyaml -c requirements/ci-constraints.txt
      # bump_docs counts the rule packs with validate_docs_versions' counter.
      - name: Set up Go (da-read / da-crdecode)
        uses: actions/setup-go@v6
        with:
          go-version-file: components/threshold-exporter/app/go.mod
          cache: true
          cache-dependency-path: |
            components/threshold-exporter/app/go.sum
            components/da-read/go.sum
      # #3206 (ADR-036 §12): the rule files these steps read are read the way
      # Prometheus' rule loader reads them (`da-read prometheus-rules`) and
      # their ConfigMaps the way kubectl reads them (da-crdecode). Built from
      # this checkout and exported; a failed build fails the job, and a tool
      # without them fails by name — never a PyYAML fallback.
      - name: Build da-read / da-crdecode
        run: |
          make da-read-build da-crdecode-build
          echo "DA_READ_BINARY=$PWD/.build/da-read" >> "$GITHUB_ENV"
          echo "DA_CRDECODE_BINARY=$PWD/.build/da-crdecode" >> "$GITHUB_ENV"
      - run: python scripts/tools/dx/bump_docs.py --check
      - name: Count consistency (hooks / tools / rule packs / JSX)
        run: python scripts/tools/dx/bump_docs.py --sync-counts --check

  go-lint-gate:
    name: Go Lint
    runs-on: ubuntu-24.04
    permissions: {}
    needs: [go-lint]
    # The REQUIRED check (#1398). A job whose dependency failed or was
    # skipped is itself skipped, and a skipped required check reports
    # Success — so this job always runs and passes only when `go-lint`
    # concluded `success` (#3756: no result is forgiven).
    if: always()
    steps:
      - name: Verify go lint succeeded
        env:
          RUN_RESULT: ${{ needs.go-lint.result }}
        run: |
          echo "go-lint: $RUN_RESULT"
          if [ "$RUN_RESULT" = "success" ]; then
            exit 0
          fi
          echo "::error::go-lint did not succeed (result=$RUN_RESULT)"
          exit 1

  validate-config-gate:
    name: Validate Tenant Config & Routes
    runs-on: ubuntu-24.04
    permissions: {}
    needs: [validate-config]
    # The REQUIRED check (#1398). A job whose dependency failed or was
    # skipped is itself skipped, and a skipped required check reports
    # Success — so this job always runs and passes only when `validate-config`
    # concluded `success` (#3756: no result is forgiven).
    if: always()
    steps:
      - name: Verify tenant config validation succeeded
        env:
          RUN_RESULT: ${{ needs.validate-config.result }}
        run: |
          echo "validate-config: $RUN_RESULT"
          if [ "$RUN_RESULT" = "success" ]; then
            exit 0
          fi
          echo "::error::validate-config did not succeed (result=$RUN_RESULT)"
          exit 1

  version-check-gate:
    name: Version Consistency
    runs-on: ubuntu-24.04
    permissions: {}
    needs: [version-check]
    # The REQUIRED check (#1398). A job whose dependency failed or was
    # skipped is itself skipped, and a skipped required check reports
    # Success — so this job always runs and passes only when `version-check`
    # concluded `success` (#3756: no result is forgiven).
    if: always()
    steps:
      - name: Verify the version check succeeded
        env:
          RUN_RESULT: ${{ needs.version-check.result }}
        run: |
          echo "version-check: $RUN_RESULT"
          if [ "$RUN_RESULT" = "success" ]; then
            exit 0
          fi
          echo "::error::version-check did not succeed (result=$RUN_RESULT)"
          exit 1
