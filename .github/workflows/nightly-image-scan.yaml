name: Nightly Image CVE Scan

# Closes the "release-night CVE ambush" gap (docs/internal/security-audit-runbook.md
# §37). Today the CVE posture has two points only:
#   - PR time (component-docker-build.yaml): Trivy is INFORMATIONAL (exit-code 0,
#     #448 — a fresh upstream base-image CVE must not block unrelated PRs).
#   - Tag time (release.yaml): Trivy is a HARD GATE (exit-code 1, CRITICAL,HIGH,
#     ignore-unfixed) on every component job.
# The gap: a new base-image (Alpine/distroless/nginx) CVE landing between the last
# PR and a tag push is discovered ONLY at release — blocking it (v2.9.0 hit 3
# freshly-disclosed HIGHs at tag time; runbook §37). This is the missing third
# dimension: scan the 7 self-built images (built from CURRENT main) PLUS
# the third-party upstream images our charts/manifests pull (#902 L1-A) every night,
# and file ONE deduped tracking issue when fixable HIGH/CRITICAL CVEs appear, so
# they surface days early. NON-BLOCKING by construction — it gates nothing
# (release.yaml stays the last line of defense); it only raises a heads-up.
#
# Alerting is DELTA-based, not level-based: the tracking issue's body and title
# refresh silently every night, and a notifying comment fires only when a CVE id
# appears that was not in the previous run (or more images fail to scan). The
# third-party bucket sits at ~120 standing findings that upstream has not rebuilt
# for — a nightly ping on that number trains the reader to ignore the issue, which
# is the same outcome as no alert at all. See scripts/ops/file_cve_report.sh.
#
# Scope honesty: da-tools is built with STUBBED Go binaries (zero-byte, mirroring
# component-docker-build.yaml's COPY-path stub) — its OS/base-image CVEs ARE
# scanned, but its Go binaries' module CVEs are NOT here (covered by release.yaml's
# real-build scan + Go CI / CodeQL govulncheck). The other 6 images build real, so
# their full image surface is scanned.
#
# THREE buckets, three tracking issues, and the split is about WHO ACTS, not about
# where the Dockerfile lives:
#   * scan             — images WE build. Lever: rebuild / bump a pinned dep.
#   * scan-thirdparty  — images WE deploy but do not build. Lever: bump the pin
#                        we own, or swap the image.
#   * scan-delivered   — images a CUSTOMER runs because `da-tools init` wrote the
#                        ref into THEIR repo. ⛔ We do not own the deployment;
#                        bumping the constant here only changes what the NEXT
#                        generated project gets. Merging this into the
#                        third-party bucket would put two incompatible
#                        remediation stories under one heading, which is the
#                        #1243 / #1058 failure (advice that cannot work teaches
#                        the reader to ignore the issue) in a new place.
#
# Third-party images our helm charts AND k8s/ manifests pull (vector, victoria-logs,
# envoy, oauth2-proxy, prom-label-proxy, python, mariadb, mysqld-exporter, grafana,
# prometheus, alertmanager, kube-state-metrics, prometheus-config-reloader, alpine/git,
# busybox) are NOT
# built here — the scan-thirdparty job pulls each ref and Trivy-scans it directly. They
# had ZERO automated CVE detection before #902 (PR/release/this job's build path
# all scan only self-built images). Keep each ref in sync with the chart values /
# k8s manifest it deploys from.

on:
  schedule:
    # 03:23 UTC daily — off-hour (avoids GH top-of-hour congestion), clear of
    # try-local-smoke (02:00) and nightly-mutation-pilot (17:00).
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      file_issue:
        description: "Also file/update the tracking issue (schedule does this automatically)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-image-cve-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }} # mirror for the `if` guard below
    strategy:
      fail-fast: false # scan every image so one build break doesn't mask the rest
      matrix:
        # Same 7 build configs as component-docker-build.yaml (#474). "Keep in
        # sync" is no longer prose: test_selfbuilt_matrix_covers_every_dockerfile
        # and test_the_three_selfbuilt_build_lists_agree (in the nightly-scan
        # matrix-drift module) pin this matrix against BOTH that workflow and
        # `make docker-build-all`, and against the Dockerfile inventory itself
        # (#1337). ⛔ Test NAMES only, no path — see the ⛔ note further down:
        # a `tests/…py` path in any comment in this file is read as a helper
        # script by the guards' discovery regex.
        include:
          - name: threshold-exporter
            context: components/threshold-exporter/app
            dockerfile: components/threshold-exporter/app/Dockerfile
          - name: da-tools
            context: components/da-tools/app
            dockerfile: components/da-tools/app/Dockerfile
          - name: da-portal
            context: .
            dockerfile: components/da-portal/Dockerfile
          - name: tenant-api
            context: .
            dockerfile: components/tenant-api/Dockerfile
          - name: recipe-preview
            context: .
            dockerfile: components/recipe-preview/Dockerfile
          # ── Self-built but NOT published (#1337) ───────────────────────────
          # These two ship inside charts rather than as release artifacts, which
          # is exactly why they had zero CVE coverage for so long: the ref
          # extractor skips them (one has no registry, the other is under our
          # own ghcr prefix) and the self-built matrix only listed components/*.
          # They belong HERE and not in scan-thirdparty because that job PULLS a
          # published ref — neither of these is pullable at all.
          - name: federation-audit-sidecar
            context: helm/federation-gateway/audit-sidecar
            dockerfile: helm/federation-gateway/audit-sidecar/Dockerfile
          - name: vector-projection-gate
            context: helm/vector/projection-gate
            dockerfile: helm/vector/projection-gate/Dockerfile
    steps:
      # Authenticated Docker Hub pulls (200/6h, per-account not shared-IP) when creds
      # are set; guarded — a no-op for forks / when the secret is unset. `secrets`
      # isn't allowed in `if`, so gate on the mirrored env var (#902 / #907 review).
      - name: Docker Hub login (no-op without creds)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same stubs as component-docker-build.yaml: da-portal needs the vendor dir
      # (CDN fallback at runtime), da-tools stubs its pre-built Go binaries
      # (COPY-path only — see the scope note in the header).
      - name: Ensure da-portal vendor dir exists
        if: matrix.name == 'da-portal'
        run: mkdir -p docs/assets/vendor

      - name: Stub da-tools build inputs
        if: matrix.name == 'da-tools'
        run: |
          mkdir -p components/da-tools/app/tools
          for b in da-guard da-batchpr da-parser; do
            for a in amd64 arm64; do
              touch "components/da-tools/app/$b.$a"
            done
          done

      # Build from CURRENT main (load, no push). pull + no-cache force a FRESH
      # base-image pull and re-run of the RUN layers (apk/apt upgrade) — that
      # freshness is the whole point: it surfaces base-image CVEs disclosed since
      # the last build. A build failure fails THIS matrix job (a real main-health
      # signal; the report job notes the missing image and won't claim "all clean").
      - name: Build image (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          pull: true
          no-cache: true
          tags: local-scan/${{ matrix.name }}:nightly

      # Trivy with the SAME contract as release.yaml (CRITICAL,HIGH + ignore-unfixed
      # = only actionable/fixable) but exit-code 0 — we CAPTURE findings here and let
      # the report job decide on alerting. JSON output for machine aggregation.
      - name: Trivy scan (JSON)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: local-scan/${{ matrix.name }}:nightly
          format: json
          output: trivy-${{ matrix.name }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          # recipe-preview: apply the SAME evidence-backed waiver as the release gate
          # so the #895 tracking issue reflects the governed posture (these 11 bundled-
          # promtool CVEs are handled, not unhandled noise). NEW promtool CVEs or
          # EXPIRED entries are NOT in the file → they still surface here (early warning
          # preserved). Empty → no-op for the other 6 self-built images.
          trivyignores: ${{ matrix.name == 'recipe-preview' && 'components/recipe-preview/.trivyignore.yaml' || '' }}

      # Shared fail-loud summarizer → emits frag-<name>.txt for the report job.
      # Same script as the scan-thirdparty job (one implementation, not two).
      - name: Summarize findings
        run: bash scripts/ops/summarize_trivy_cve.sh '${{ matrix.name }}'

      # Artifact prefixed `sb-` so the report buckets self-built apart from
      # third-party (`tp-`) — #902 L1-A.1.
      - name: Upload fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cve-frag-sb-${{ matrix.name }}
          path: frag-${{ matrix.name }}.txt
          retention-days: 14

  scan-thirdparty:
    name: scan ${{ matrix.name }} (third-party)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }} # mirror for the `if` guard below
    strategy:
      fail-fast: false # scan every image so one pull failure doesn't mask the rest
      matrix:
        # Third-party upstream images our charts / k8s manifests PULL (not build).
        # Trivy pulls each ref and scans it directly — these had ZERO automated CVE
        # detection before #902. Keep each ref in sync with the source-of-truth file
        # noted alongside it.
        #
        # NOTE: the Docker Hub refs are pulled anonymously; if GH-runner shared-IP
        # rate limits start failing pulls, they surface as a degraded/"missing"
        # alert (NOT a silent clean) — add a docker/login-action step then.
        include:
          - name: vector # helm/vector/values.yaml
            ref: "timberio/vector:0.57.0-distroless-libc@sha256:bb5968aa63f3bf7cf77f8cd7548c1442cc91f2a8c20d7ef5c5a03e2a37fbf205"
          - name: victoria-logs # helm/victorialogs/values.yaml
            ref: "victoriametrics/victoria-logs:v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e"
          - name: chargeback-python # helm/chargeback-aggregator/values.yaml
            ref: "python:3.14-slim@sha256:cea0e6040540fb2b965b6e7fb5ffa00871e632eef63719f0ea54bca189ce14a6"
          - name: envoy # helm/federation-gateway/values.yaml
            ref: "envoyproxy/envoy:distroless-v1.38.0@sha256:a7a56545102f7a682e0cafea2c9b8448af1b09ebb710eab688dfb931e3ec7ff6"
          - name: oauth2-proxy # helm/da-portal + helm/tenant-api values.yaml
            ref: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561"
          # docker.io, NOT quay.io: upstream released v0.14.0 on 2026-06-23 but never
          # pushed it to quay — quay's v0.13.0/latest/v0 all still resolve to the April
          # build. Staying on quay freezes x/net + prometheus lib at April versions.
          - name: prom-label-proxy # helm/federation-proxy/values.yaml
            ref: "prometheuscommunity/prom-label-proxy:v0.15.0@sha256:b6fc0bba6669fcb7eebe527e57de6b94eb85a6a3441b1a0546227a822fd8ea7b"
          - name: mariadb # helm/mariadb-instance/values.yaml
            ref: "mariadb:11.8.8@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4"
          - name: mysqld-exporter # helm/mariadb-instance/values.yaml
            ref: "prom/mysqld-exporter:v0.19.0@sha256:eacb4b18e2ec1e0abdf2d64851b68526c964f6d9cb3e9458fb5d5f5062ea94c1"
          - name: grafana # k8s/03-monitoring/deployment-grafana.yaml
            ref: "grafana/grafana:12.4.6@sha256:c2cd7057f6116f708b6ab11dc36089f4b34bcf5065c4457ca6b55daa42a9eb8c"
          - name: prometheus # k8s/03-monitoring/deployment-prometheus.yaml
            ref: "prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69"
          - name: alertmanager # k8s/03-monitoring/deployment-alertmanager.yaml
            ref: "prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d"
          - name: kube-state-metrics # k8s/03-monitoring/deployment-kube-state-metrics.yaml
            ref: "registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1@sha256:85108987d044b18a098126732f98602df408888c0f7d456241f5abefb9744bc1"
          # Replaced ghcr.io/jimmidyson/configmap-reload (#1243): its last release is
          # v0.15.0 / 2025-04-09 and two CVE issues (#188, #210) sat unanswered for
          # months while its 16 Go-stdlib findings accrued. prometheus-operator ships
          # a monthly-cadence equivalent.
          # Pinned in TWO manifests with the SAME digest — deployment-alertmanager.yaml
          # (routing config, #1243) and deployment-prometheus.yaml (Rule Packs, #1246).
          # A digest refresh MUST update both or they drift silently.
          - name: config-reloader # k8s/03-monitoring/deployment-{alertmanager,prometheus}.yaml (sidecars)
            ref: "quay.io/prometheus-operator/prometheus-config-reloader:v0.93.0@sha256:0ccb22ca9f3f6fd9f76ce95585d18bd2e363d421c534dde710be4bd13caa551d"
          # NOTE: alpine/git's VERSION tags are mutable — upstream's Sunday cron
          # re-pushes v<X.Y.Z> from a fresh `apk add` (alpine-docker/git build.yml), so
          # the same tag silently gains OS fixes. Only the digest pins it; a digest-only
          # Renovate refresh is what clears this image's CVEs, not a tag bump.
          # The #1316 store-mount preflight init-container in BOTH federation
          # consumer charts. One image, two charts — a digest refresh must update
          # helm/federation-gateway/values.yaml AND
          # helm/federation-reconciler/values.yaml, or the two drift silently.
          # ⛔ Do NOT cite a `tests/…py` path in a comment here: this file's
          # helper-script discovery is a plain regex over the whole text, so a
          # test path in a COMMENT gets read as a helper and its own fixtures
          # (e.g. a deliberate `gh label create … || true`) are then reported as
          # offenders by the guards below.
          - name: busybox # helm/federation-{gateway,reconciler}/values.yaml (preflight init)
            ref: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
          - name: alpine-git # k8s/04-tenant-api/deployment.yaml (gitops sidecar)
            ref: "alpine/git:v2.54.0@sha256:729da2347ce652f30476b064198577fe12e1147e58499be9f343039343ef2cee"
    steps:
      # Authenticated Docker Hub pulls (rate-limit headroom); guarded no-op without creds.
      - name: Docker Hub login (no-op without creds)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v6 # for scripts/ops/summarize_trivy_cve.sh

      # No build: Trivy pulls the upstream ref and scans it directly. SAME contract
      # as the scan job (CRITICAL,HIGH + ignore-unfixed, exit-code 0 — capture,
      # don't gate; the report job decides on alerting).
      - name: Trivy scan (JSON)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.ref }}
          format: json
          output: trivy-${{ matrix.name }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Summarize findings
        run: bash scripts/ops/summarize_trivy_cve.sh '${{ matrix.name }}'

      - name: Upload fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cve-frag-tp-${{ matrix.name }}
          path: frag-${{ matrix.name }}.txt
          retention-days: 14

  scan-delivered:
    name: scan ${{ matrix.name }} (customer-delivered)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }} # mirror for the `if` guard below
    strategy:
      fail-fast: false # scan every image so one pull failure doesn't mask the rest
      matrix:
        # Third-party images `da-tools init` writes into a CUSTOMER's repo (#1337
        # follow-up). Every ref below lands in a file the customer EXECUTES: the
        # GitLab apply stage carries `environment: name: production` plus
        # cluster-write credentials, and the git-sync patch is applied straight
        # into their cluster.
        #
        # These were in NO automated view of a registry before this job. Not by
        # decision — by three independent misses, each of which reads as
        # deliberate scoping until you check it against this question:
        #   * Renovate: all three customManagers require `@sha256:` in the match,
        #     and none of their managerFilePatterns reaches `scripts/**`.
        #   * scan-thirdparty above: its matrix is pinned by SET EQUALITY to the
        #     helm/k8s extractor, which globs `helm/*/values*.yaml` + `k8s/**`.
        #   * The existing offline pin guard (TestCustomerDeliveredImagePins in the
        #     init-project suite) says so in its own docstring: it checks FLOATING
        #     vs CONCRETE, never currency, never existence.
        #
        # ⛔ TAG-ONLY refs, no digest, and that is NOT an oversight to "fix" here.
        # The pins are tag-only at the source because the customer's repo has no
        # updater of ours to re-resolve a digest; a digest pinned by us would
        # freeze their pipeline on a layer only we can unfreeze. Adding a digest
        # to the matrix alone would make it disagree with the pin table and red
        # the drift guard — the matrix is a mirror of that table, not a place to
        # improve it.
        #
        # ⭐ WHY THIS ALSO BUYS "does the ref still exist?" for free — verified in
        # the two scripts below, not assumed. `summarize_trivy_cve.sh` is
        # fail-LOUD (`jq empty` then `jq -e 'has("Results")'`, under `set -e`), so
        # an absent or schema-broken Trivy JSON aborts the step instead of
        # degrading to COUNT=0. No fragment is written, no artifact is uploaded,
        # and `file_cve_report.sh` — which is handed an EXPECTED count — computes
        # `missing = EXPECTED - present > 0`, which forces `problem=1`, a
        # "Scan degraded" banner and a notifying comment. A ref that 404s
        # therefore surfaces as DEGRADED, never as a silent clean.
        # ⚠️ Honest boundary: that chain covers "Trivy could not produce a usable
        # report". It would not cover a hypothetical Trivy that emitted a
        # well-formed `Results: []` for an image it never pulled.
        #
        # Each entry names its source-of-truth constant + line. The drift guard
        # in the nightly-scan matrix-drift module IMPORTS that table and asserts
        # set equality, so these comments are navigation, not the contract.
        # ⛔ CONSTANT + BASENAME only — never a `scripts/…py` or `tests/…py`
        # path, in ANY comment in this file, however purely navigational. The
        # guards' helper-script discovery is a plain regex over the whole file
        # text, so such a path is read as a nightly HELPER SCRIPT and pulled
        # into their scan face. Spelling the pin table's full path here grew
        # that face from 2 files to 3 — and the third was init_project.py, a
        # 70KB general-purpose generator that is not a nightly helper at all.
        # The pin table lives in the tools/ops tree; the matrix-drift module
        # holds the one literal path, cross-checked against the checker.
        include:
          - name: delivered-kubectl # GITLAB_KUBECTL_IMAGE (init_project.py:190)
            ref: "alpine/k8s:1.34.9"
          - name: delivered-helm # GITLAB_HELM_IMAGE (init_project.py:204)
            ref: "alpine/helm:3.21.3"
          - name: delivered-argocd # GITLAB_ARGOCD_IMAGE (init_project.py:214)
            ref: "quay.io/argoproj/argocd:v3.5.0"
          # Not routed through _GITLAB_APPLY_IMAGES — this one is the git-sync
          # sidecar + init container in the generated kustomize gitops overlay,
          # emitted only on the `config_source=git` path.
          - name: delivered-git-sync # GIT_SYNC_IMAGE (init_project.py:223)
            ref: "registry.k8s.io/git-sync/git-sync:v4.7.1"
    steps:
      # Authenticated Docker Hub pulls (rate-limit headroom); guarded no-op without
      # creds. Two of the four refs are Docker Hub (alpine/k8s, alpine/helm).
      - name: Docker Hub login (no-op without creds)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v6 # for scripts/ops/summarize_trivy_cve.sh

      # SAME contract as the other two scan jobs (CRITICAL,HIGH + ignore-unfixed,
      # exit-code 0 — capture, don't gate). No trivyignores: the waiver file that
      # exists is recipe-preview's bundled promtool, which has nothing to do with
      # these.
      - name: Trivy scan (JSON)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.ref }}
          format: json
          output: trivy-${{ matrix.name }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Summarize findings
        run: bash scripts/ops/summarize_trivy_cve.sh '${{ matrix.name }}'

      # `dl-` prefix: a THIRD artifact namespace, disjoint from `sb-` and `tp-`,
      # so the report job's three download patterns cannot cross-match.
      - name: Upload fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cve-frag-dl-${{ matrix.name }}
          path: frag-${{ matrix.name }}.txt
          retention-days: 14

  report:
    name: aggregate + alert
    needs: [scan, scan-thirdparty, scan-delivered]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6 # for scripts/ops/file_cve_report.sh

      # Self-built and third-party fragments download into SEPARATE dirs → SEPARATE
      # tracking issues (#902 L1-A.1): a self-built regression (release.yaml
      # Trivy-gated) must not get buried under the larger third-party CVE debt.
      - name: Download self-built fragments
        uses: actions/download-artifact@v4
        with:
          pattern: cve-frag-sb-*
          path: frags-sb
          merge-multiple: true

      - name: Download third-party fragments
        uses: actions/download-artifact@v4
        with:
          pattern: cve-frag-tp-*
          path: frags-tp
          merge-multiple: true

      # Third dir, third issue. Deliberately NOT merged into frags-tp: the two
      # buckets share a Trivy contract but nothing else — see the WHO ACTS note
      # in the header. Mixing them would put "bump the pin we own" and "we cannot
      # reach the deployment at all" under one remediation sentence.
      - name: Download customer-delivered fragments
        uses: actions/download-artifact@v4
        with:
          pattern: cve-frag-dl-*
          path: frags-dl
          merge-multiple: true

      - name: Aggregate + maybe file the tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # schedule always files; manual dispatch only when file_issue is checked.
          DO_FILE: ${{ github.event_name == 'schedule' || inputs.file_issue }}
        run: |
          set -euo pipefail
          rc=0
          # ⚠️ The remediation prose passed to file_cve_report.sh is a
          # double-quoted bash argument, so a backtick or `$(` in it is COMMAND
          # SUBSTITUTION, not text (#1355 — tracked and fixed on its own branch;
          # this bucket's new prose below deliberately contains neither).
          # Self-built (7) — keep this signal clean. ⚠️ It feeds the release.yaml
          # Trivy gate for FIVE of the seven; the two chart-shipped ones
          # (federation-audit-sidecar / vector-projection-gate) are never
          # published, so no tag-time gate exists for them and this nightly bucket
          # plus the PR-time scan are their whole CVE signal (#1337).
          # "We own these, so patch it" is honest for 5 of the 7 — but NOT blanket
          # true, and the same wrong-advice failure the third-party sentence below
          # was rewritten for (#1243) applies here in miniature: TWO of these images
          # carry findings inside a BUNDLED upstream binary that no first-party
          # rebuild or dependency bump can clear — recipe-preview (promtool) and
          # federation-audit-sidecar (mtail's own grpc pin; #1337 already rebuilt
          # mtail from source with a current Go toolchain, which is what cleared
          # the other 20). The sentence names both exceptions rather than sending
          # the reader to do something that cannot work (#1058).
          bash scripts/ops/file_cve_report.sh frags-sb \
            nightly-cve \
            "🛡️ Nightly image scan — self-built component CVEs / build failures on main" \
            7 "self-built component" \
            "for the Go/JS components we compile, a rebuild or a pinned-dependency bump clears these — start by checking whether the Dockerfile builder pins an older toolchain than CI does (that exact split hid a stdlib CVE from every green CI run in #1058). TWO EXCEPTIONS, both bundled upstream binaries no first-party bump touches: recipe-preview bundles promtool (levers: re-pin PROM_VERSION, or an evidence-backed time-boxed entry in components/recipe-preview/.trivyignore.yaml), and federation-audit-sidecar builds mtail from upstream source whose go.mod carries grpc as an INDIRECT dependency (mtail's last release is v3.0.8, 2024-08-08). ⛔ Be precise about why that one is still open: forcing a local \`go get google.golang.org/grpc@v1.82.1\` DOES compile (measured 2026-08-04) — it is not left here because it cannot be done, but because doing it forks an unmaintained upstream's dependency graph with no upstream test coverage behind it. It is therefore left VISIBLE rather than silently patched or silently waived; revisit if it ever becomes reachable rather than merely linked. ⛔ DO NOT ASSUME THE RELEASE GATE WILL CATCH THIS. For the five published components release.yaml does scan with exit-code 1, but it runs POST-PUSH and in four of the five jobs it is the LAST step — by then the image, and for the exporter the Helm chart too, are already in the registry. So a red there means a red Actions run, not an artifact held back; only release-da-tools has steps after it (signing, SBOM, archives, the GitHub Release) that a finding actually prevents. And for federation-audit-sidecar / vector-projection-gate there is no tag-time scan at all — they ship inside charts and are never published — so a finding on those two sits here until someone acts on this issue. Treat this nightly bucket as the actionable signal, not a preview of something a tag push will stop (security-audit-runbook §37)." || rc=1
          # Third-party (15) — informational. The remediation sentence is the part
          # of this alert that decides whether a reader acts or learns to ignore it,
          # so it names the levers that have ACTUALLY cleared findings here (#1243
          # triaged all 14 and cleared 58 of 120) instead of a generic "bump the tag".
          # Two earlier wordings were wrong: "bump the pinned tag" (false for the
          # release-stalled majority) and then "tick a gated major" (false in the
          # other direction — #1243 evaluated both pending majors, grafana v13 and
          # mariadb v12, and REJECTED both: v13 buys 2 findings for ~11 breaking
          # changes incl. a one-way storage migration, and mariadb's 15 findings all
          # come from a PRE-COMPILED gosu binary that 12.x ships identically).
          bash scripts/ops/file_cve_report.sh frags-tp \
            nightly-cve-thirdparty \
            "🛡️ Nightly image scan — third-party upstream image CVEs on main" \
            15 "third-party upstream image" \
            "triage each image before assuming it is unfixable — #1243 cleared 58 of 120 this way. Four levers, in the order worth checking: (1) a DIGEST-only refresh, for images whose version tag is mutable and gets re-pushed from a fresh base (alpine/git rebuilds every Sunday); (2) a patch tag published AFTER Renovate's last weekly run — Renovate runs Mondays at 06:17 UTC, so anything released later that day waits nearly a full week (grafana 12.4.6 was built 8 hours after that run); (3) the same release published to a registry we do not pin (prom-label-proxy v0.14.0 shipped to Docker Hub, never to quay); (4) replacing a release-dormant image with a maintained equivalent (configmap-reload, last released 2025-04-09, -> prometheus-config-reloader). What is usually NOT the lever: a gated major on the Renovate Dashboard (#929) — verify it actually carries the fix first. What is left after those four splits three ways, and the split matters for the next triage: (a) FIXED ON MAIN, UNRELEASED — the project already bumped the dependency but has cut no release (mysqld-exporter, alertmanager); (b) NO FIX EXISTS ANYWHERE YET — the upstream dependency's own fix is newer than every release of the image, so no version of it can carry the fix (grafana's kin-openapi CRITICAL); (c) A MAJOR WOULD NOT HELP EITHER — the finding comes from a component the next major ships identically (mariadb's 15 findings are all a pre-compiled gosu binary that 12.x pins to the same version). Only (a) is a waiting game." || rc=1
          # Customer-delivered (4) — its own issue BECAUSE THE LEVER IS DIFFERENT.
          # The other two buckets end in an action we can merge; this one mostly
          # does not, because the ref is already frozen in someone else's repo.
          # Folding it into the third-party bucket would put "bump the pin we own"
          # next to "we cannot reach the deployment at all" under one remediation
          # sentence, and the reader would apply the wrong half — the same
          # wrong-advice failure #1243 and #1058 each had to rewrite this file for.
          # (This prose deliberately contains no backtick and no `$(` — see the
          # ⚠️ note above the self-built call.)
          bash scripts/ops/file_cve_report.sh frags-dl \
            nightly-cve-delivered \
            "🛡️ Nightly image scan — customer-delivered image CVEs on main" \
            4 "customer-delivered image" \
            "the lever here is DIFFERENT from the other two buckets, and reaching for theirs wastes the triage: we do not deploy these. da-tools init writes them into the CUSTOMER's repo, where they are frozen at generation time — so bumping the constant changes what the NEXT generated project gets, and nothing else. Three separate actions, in this order. (1) BUMP THE PIN so new projects start clean. The pins are version TAGS, not digests, on purpose: the customer has no updater of ours to re-resolve a digest, and an unmaintained digest inhibits security updates — that is a decision, not an omission to fix here. (2) ASK WHETHER THE TAG IS MUTABLE BEFORE ASSUMING ANYONE MUST ACT. alpine/k8s and alpine/helm come from the same publisher whose alpine/git the third-party bucket documents as re-pushed weekly from a fresh apk add, so an upstream rebuild of the SAME tag reaches every existing customer on their next pipeline run with no release from us — verify that per image rather than assuming it, and note the other two do not behave that way (registry.k8s.io publishes only exact patch tags for git-sync, and quay's argocd tags are release artifacts). (3) FOR EXISTING CUSTOMERS, A BUMP IS NOT DELIVERY. It is a communication task: they re-run the init tool or edit the ref themselves. ⛔ HONEST SCOPE, and it is narrower than the other two buckets: this measures the four refs WE WOULD HAND OUT TODAY, not any customer's actual posture. The generated GitLab pipeline emits them as OVERRIDABLE CI variables (DA_KUBECTL_IMAGE / DA_HELM_IMAGE / DA_ARGOCD_IMAGE), we have no telemetry on which version a customer generated from or overrode to, and the git-sync ref only reaches them at all on the config_source=git path. A clean run here means OUR DEFAULT is clean; it does not mean anyone's pipeline is. ⚠️ Finally, do not read this bucket as replacing the offline pin guard in the init-project suite: that one checks floating-vs-concrete SHAPE and says so in its own docstring — it stays green on a perfectly concrete but two-year-stale tag. This bucket is the EXISTENCE-AND-CVE half — the half that needs a registry round-trip: it pulls each ref and scans it, so a ref that has been deleted or retagged away shows up as a degraded run, and a ref that grows a CRITICAL shows up as a finding. ⛔ CURRENCY IS NOT MEASURED BY ANYTHING, HERE OR ANYWHERE. Nothing in this repo compares these four pins against what the upstream has published since, so a two-year-old tag that still exists and whose findings are all unfixed (this scan passes ignore-unfixed) is green in this bucket AND green in the offline pin guard. Answering it needs a per-registry tag-enumeration call, which is not built and is not costed — quay.io and registry.k8s.io have not been checked for a usable list API. Until then, staleness is a human review item, not an alert." || rc=1
          exit $rc

      # A cron nobody watches degrades into background noise once it is red for
      # a few nights — this job was red for 33 consecutive runs before anyone
      # looked, and the actual cause (a 422 on the label API) was four scrolls
      # into a step log. Mirror renovate.yaml's self-explanatory-failure step so
      # the run page itself says what broke and what it cost.
      - name: Explain a likely failure cause
        if: ${{ failure() }}
        run: |
          echo "::error title=Nightly CVE report failed::The scans may well have SUCCEEDED — this job is the alerting step, so a failure here means findings were computed but the tracking issue was NOT updated. Most likely causes: (1) a GitHub API validation error (label description >100 chars, issue title >256) — see the 422 in the step log; (2) the issues:write permission or GH_TOKEN scope changed; (3) one of the tracking labels — 'nightly-cve', 'nightly-cve-thirdparty', 'nightly-cve-delivered' — was deleted; in that case file_cve_report.sh still DELIVERS the alert (unlabelled, title-prefix dedup) and then exits 1 on purpose, so ONE missing label reds this whole job while the other two buckets are perfectly fine — check the step log for which LABEL is named. Findings are still in the step summary above and in the cve-frag-* artifacts."
