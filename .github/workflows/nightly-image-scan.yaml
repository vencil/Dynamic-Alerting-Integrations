name: Nightly Image CVE Scan

# Closes the "release-night CVE ambush" gap (docs/internal/security-audit-runbook.md
# §37). Today the CVE posture has two points only:
#   - PR time (component-docker-build.yaml): Trivy is INFORMATIONAL (exit-code 0,
#     #448 — a fresh upstream base-image CVE must not block unrelated PRs).
#   - Tag time (release.yaml): Trivy is a HARD GATE (exit-code 1, CRITICAL,HIGH,
#     ignore-unfixed) on every component job.
# The gap: a new base-image (Alpine/distroless/nginx) CVE landing between the last
# PR and a tag push is discovered ONLY at release — blocking it (v2.9.0 hit 3
# freshly-disclosed HIGHs at tag time; runbook §37). This is the missing third
# dimension: scan the 5 self-built component images (built from CURRENT main) PLUS
# the third-party upstream images our charts/manifests pull (#902 L1-A) every night,
# and file ONE deduped tracking issue when fixable HIGH/CRITICAL CVEs appear, so
# they surface days early. NON-BLOCKING by construction — it gates nothing
# (release.yaml stays the last line of defense); it only raises a heads-up.
#
# Alerting is DELTA-based, not level-based: the tracking issue's body and title
# refresh silently every night, and a notifying comment fires only when a CVE id
# appears that was not in the previous run (or more images fail to scan). The
# third-party bucket sits at ~120 standing findings that upstream has not rebuilt
# for — a nightly ping on that number trains the reader to ignore the issue, which
# is the same outcome as no alert at all. See scripts/ops/file_cve_report.sh.
#
# Scope honesty: da-tools is built with STUBBED Go binaries (zero-byte, mirroring
# component-docker-build.yaml's COPY-path stub) — its OS/base-image CVEs ARE
# scanned, but its Go binaries' module CVEs are NOT here (covered by release.yaml's
# real-build scan + Go CI / CodeQL govulncheck). The other 4 images build real, so
# their full image surface is scanned.
#
# Third-party images our helm charts AND k8s/ manifests pull (vector, victoria-logs,
# envoy, oauth2-proxy, prom-label-proxy, python, mariadb, mysqld-exporter, grafana,
# prometheus, alertmanager, kube-state-metrics, prometheus-config-reloader, alpine/git,
# busybox) are NOT
# built here — the scan-thirdparty job pulls each ref and Trivy-scans it directly. They
# had ZERO automated CVE detection before #902 (PR/release/this job's build path
# all scan only self-built images). Keep each ref in sync with the chart values /
# k8s manifest it deploys from.

on:
  schedule:
    # 03:23 UTC daily — off-hour (avoids GH top-of-hour congestion), clear of
    # try-local-smoke (02:00) and nightly-mutation-pilot (17:00).
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      file_issue:
        description: "Also file/update the tracking issue (schedule does this automatically)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-image-cve-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }} # mirror for the `if` guard below
    strategy:
      fail-fast: false # scan every image so one build break doesn't mask the rest
      matrix:
        # Same 5 build configs as component-docker-build.yaml (#474). Keep in sync
        # with that matrix when a component is added/removed.
        include:
          - name: threshold-exporter
            context: components/threshold-exporter/app
            dockerfile: components/threshold-exporter/app/Dockerfile
          - name: da-tools
            context: components/da-tools/app
            dockerfile: components/da-tools/app/Dockerfile
          - name: da-portal
            context: .
            dockerfile: components/da-portal/Dockerfile
          - name: tenant-api
            context: .
            dockerfile: components/tenant-api/Dockerfile
          - name: recipe-preview
            context: .
            dockerfile: components/recipe-preview/Dockerfile
    steps:
      # Authenticated Docker Hub pulls (200/6h, per-account not shared-IP) when creds
      # are set; guarded — a no-op for forks / when the secret is unset. `secrets`
      # isn't allowed in `if`, so gate on the mirrored env var (#902 / #907 review).
      - name: Docker Hub login (no-op without creds)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same stubs as component-docker-build.yaml: da-portal needs the vendor dir
      # (CDN fallback at runtime), da-tools stubs its pre-built Go binaries
      # (COPY-path only — see the scope note in the header).
      - name: Ensure da-portal vendor dir exists
        if: matrix.name == 'da-portal'
        run: mkdir -p docs/assets/vendor

      - name: Stub da-tools build inputs
        if: matrix.name == 'da-tools'
        run: |
          mkdir -p components/da-tools/app/tools
          for b in da-guard da-batchpr da-parser; do
            for a in amd64 arm64; do
              touch "components/da-tools/app/$b.$a"
            done
          done

      # Build from CURRENT main (load, no push). pull + no-cache force a FRESH
      # base-image pull and re-run of the RUN layers (apk/apt upgrade) — that
      # freshness is the whole point: it surfaces base-image CVEs disclosed since
      # the last build. A build failure fails THIS matrix job (a real main-health
      # signal; the report job notes the missing image and won't claim "all clean").
      - name: Build image (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          pull: true
          no-cache: true
          tags: local-scan/${{ matrix.name }}:nightly

      # Trivy with the SAME contract as release.yaml (CRITICAL,HIGH + ignore-unfixed
      # = only actionable/fixable) but exit-code 0 — we CAPTURE findings here and let
      # the report job decide on alerting. JSON output for machine aggregation.
      - name: Trivy scan (JSON)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: local-scan/${{ matrix.name }}:nightly
          format: json
          output: trivy-${{ matrix.name }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          # recipe-preview: apply the SAME evidence-backed waiver as the release gate
          # so the #895 tracking issue reflects the governed posture (these 11 bundled-
          # promtool CVEs are handled, not unhandled noise). NEW promtool CVEs or
          # EXPIRED entries are NOT in the file → they still surface here (early warning
          # preserved). Empty → no-op for the other 4 self-built images.
          trivyignores: ${{ matrix.name == 'recipe-preview' && 'components/recipe-preview/.trivyignore.yaml' || '' }}

      # Shared fail-loud summarizer → emits frag-<name>.txt for the report job.
      # Same script as the scan-thirdparty job (one implementation, not two).
      - name: Summarize findings
        run: bash scripts/ops/summarize_trivy_cve.sh '${{ matrix.name }}'

      # Artifact prefixed `sb-` so the report buckets self-built apart from
      # third-party (`tp-`) — #902 L1-A.1.
      - name: Upload fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cve-frag-sb-${{ matrix.name }}
          path: frag-${{ matrix.name }}.txt
          retention-days: 14

  scan-thirdparty:
    name: scan ${{ matrix.name }} (third-party)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }} # mirror for the `if` guard below
    strategy:
      fail-fast: false # scan every image so one pull failure doesn't mask the rest
      matrix:
        # Third-party upstream images our charts / k8s manifests PULL (not build).
        # Trivy pulls each ref and scans it directly — these had ZERO automated CVE
        # detection before #902. Keep each ref in sync with the source-of-truth file
        # noted alongside it.
        #
        # NOTE: the Docker Hub refs are pulled anonymously; if GH-runner shared-IP
        # rate limits start failing pulls, they surface as a degraded/"missing"
        # alert (NOT a silent clean) — add a docker/login-action step then.
        include:
          - name: vector # helm/vector/values.yaml
            ref: "timberio/vector:0.57.0-distroless-libc@sha256:bb5968aa63f3bf7cf77f8cd7548c1442cc91f2a8c20d7ef5c5a03e2a37fbf205"
          - name: victoria-logs # helm/victorialogs/values.yaml
            ref: "victoriametrics/victoria-logs:v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e"
          - name: chargeback-python # helm/chargeback-aggregator/values.yaml
            ref: "python:3.14-slim@sha256:cea0e6040540fb2b965b6e7fb5ffa00871e632eef63719f0ea54bca189ce14a6"
          - name: envoy # helm/federation-gateway/values.yaml
            ref: "envoyproxy/envoy:distroless-v1.38.0@sha256:a7a56545102f7a682e0cafea2c9b8448af1b09ebb710eab688dfb931e3ec7ff6"
          - name: oauth2-proxy # helm/da-portal + helm/tenant-api values.yaml
            ref: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561"
          # docker.io, NOT quay.io: upstream released v0.14.0 on 2026-06-23 but never
          # pushed it to quay — quay's v0.13.0/latest/v0 all still resolve to the April
          # build. Staying on quay freezes x/net + prometheus lib at April versions.
          - name: prom-label-proxy # helm/federation-proxy/values.yaml
            ref: "prometheuscommunity/prom-label-proxy:v0.14.0@sha256:e314c38621614b33dde314d0fd6635d7362f311aaa68325f24ff933b324c00d1"
          - name: mariadb # helm/mariadb-instance/values.yaml
            ref: "mariadb:11.8.8@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4"
          - name: mysqld-exporter # helm/mariadb-instance/values.yaml
            ref: "prom/mysqld-exporter:v0.19.0@sha256:eacb4b18e2ec1e0abdf2d64851b68526c964f6d9cb3e9458fb5d5f5062ea94c1"
          - name: grafana # k8s/03-monitoring/deployment-grafana.yaml
            ref: "grafana/grafana:12.4.6@sha256:dc91df727e7a90043b74ed4e2df7e4302f0eb3ad8f1e9fe278b0f7a7689d3432"
          - name: prometheus # k8s/03-monitoring/deployment-prometheus.yaml
            ref: "prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893"
          - name: alertmanager # k8s/03-monitoring/deployment-alertmanager.yaml
            ref: "prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d"
          - name: kube-state-metrics # k8s/03-monitoring/deployment-kube-state-metrics.yaml
            ref: "registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1@sha256:85108987d044b18a098126732f98602df408888c0f7d456241f5abefb9744bc1"
          # Replaced ghcr.io/jimmidyson/configmap-reload (#1243): its last release is
          # v0.15.0 / 2025-04-09 and two CVE issues (#188, #210) sat unanswered for
          # months while its 16 Go-stdlib findings accrued. prometheus-operator ships
          # a monthly-cadence equivalent.
          # Pinned in TWO manifests with the SAME digest — deployment-alertmanager.yaml
          # (routing config, #1243) and deployment-prometheus.yaml (Rule Packs, #1246).
          # A digest refresh MUST update both or they drift silently.
          - name: config-reloader # k8s/03-monitoring/deployment-{alertmanager,prometheus}.yaml (sidecars)
            ref: "quay.io/prometheus-operator/prometheus-config-reloader:v0.92.1@sha256:74550ba3e8bf93f47bc574231090d340ae9c01d25cd11ff74799e65f9fdb9a48"
          # NOTE: alpine/git's VERSION tags are mutable — upstream's Sunday cron
          # re-pushes v<X.Y.Z> from a fresh `apk add` (alpine-docker/git build.yml), so
          # the same tag silently gains OS fixes. Only the digest pins it; a digest-only
          # Renovate refresh is what clears this image's CVEs, not a tag bump.
          # The #1316 store-mount preflight init-container in BOTH federation
          # consumer charts. One image, two charts — a digest refresh must update
          # helm/federation-gateway/values.yaml AND
          # helm/federation-reconciler/values.yaml, or the two drift silently.
          # ⛔ Do NOT cite a `tests/…py` path in a comment here: this file's
          # helper-script discovery is a plain regex over the whole text, so a
          # test path in a COMMENT gets read as a helper and its own fixtures
          # (e.g. a deliberate `gh label create … || true`) are then reported as
          # offenders by the guards below.
          - name: busybox # helm/federation-{gateway,reconciler}/values.yaml (preflight init)
            ref: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
          - name: alpine-git # k8s/04-tenant-api/deployment.yaml (gitops sidecar)
            ref: "alpine/git:v2.54.0@sha256:b4d933c7185b5cc9da7704f2c6e19d477f935ea31a50d9a017ffce2bbd1109a3"
    steps:
      # Authenticated Docker Hub pulls (rate-limit headroom); guarded no-op without creds.
      - name: Docker Hub login (no-op without creds)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v6 # for scripts/ops/summarize_trivy_cve.sh

      # No build: Trivy pulls the upstream ref and scans it directly. SAME contract
      # as the scan job (CRITICAL,HIGH + ignore-unfixed, exit-code 0 — capture,
      # don't gate; the report job decides on alerting).
      - name: Trivy scan (JSON)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.ref }}
          format: json
          output: trivy-${{ matrix.name }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Summarize findings
        run: bash scripts/ops/summarize_trivy_cve.sh '${{ matrix.name }}'

      - name: Upload fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cve-frag-tp-${{ matrix.name }}
          path: frag-${{ matrix.name }}.txt
          retention-days: 14

  report:
    name: aggregate + alert
    needs: [scan, scan-thirdparty]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6 # for scripts/ops/file_cve_report.sh

      # Self-built and third-party fragments download into SEPARATE dirs → SEPARATE
      # tracking issues (#902 L1-A.1): a self-built regression (release.yaml
      # Trivy-gated) must not get buried under the larger third-party CVE debt.
      - name: Download self-built fragments
        uses: actions/download-artifact@v4
        with:
          pattern: cve-frag-sb-*
          path: frags-sb
          merge-multiple: true

      - name: Download third-party fragments
        uses: actions/download-artifact@v4
        with:
          pattern: cve-frag-tp-*
          path: frags-tp
          merge-multiple: true

      - name: Aggregate + maybe file the tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # schedule always files; manual dispatch only when file_issue is checked.
          DO_FILE: ${{ github.event_name == 'schedule' || inputs.file_issue }}
        run: |
          set -euo pipefail
          rc=0
          # Self-built (5) — feeds the release.yaml Trivy gate; keep this signal clean.
          # "We own these, so patch it" is honest for 4 of the 5 — but NOT blanket
          # true, and the same wrong-advice failure the third-party sentence below
          # was rewritten for (#1243) applies here in miniature: recipe-preview is a
          # Python service whose findings all live in a BUNDLED upstream promtool
          # binary, so no first-party rebuild or dependency bump can clear them. The
          # sentence names that exception rather than sending the reader to do
          # something that cannot work (#1058).
          bash scripts/ops/file_cve_report.sh frags-sb \
            nightly-cve \
            "🛡️ Nightly image scan — self-built component CVEs / build failures on main" \
            5 "self-built component" \
            "for the Go/JS components we compile, a rebuild or a pinned-dependency bump clears these — start by checking whether the Dockerfile builder pins an older toolchain than CI does (that exact split hid a stdlib CVE from every green CI run in #1058). ONE EXCEPTION: recipe-preview is a Python service and its findings live in the BUNDLED upstream promtool binary, so no first-party bump touches them — the levers there are re-pinning PROM_VERSION or an evidence-backed, time-boxed entry in components/recipe-preview/.trivyignore.yaml. The release-time Trivy gate (release.yaml) blocks a tag until this bucket is 0 (security-audit-runbook §37)." || rc=1
          # Third-party (15) — informational. The remediation sentence is the part
          # of this alert that decides whether a reader acts or learns to ignore it,
          # so it names the levers that have ACTUALLY cleared findings here (#1243
          # triaged all 14 and cleared 58 of 120) instead of a generic "bump the tag".
          # Two earlier wordings were wrong: "bump the pinned tag" (false for the
          # release-stalled majority) and then "tick a gated major" (false in the
          # other direction — #1243 evaluated both pending majors, grafana v13 and
          # mariadb v12, and REJECTED both: v13 buys 2 findings for ~11 breaking
          # changes incl. a one-way storage migration, and mariadb's 15 findings all
          # come from a PRE-COMPILED gosu binary that 12.x ships identically).
          bash scripts/ops/file_cve_report.sh frags-tp \
            nightly-cve-thirdparty \
            "🛡️ Nightly image scan — third-party upstream image CVEs on main" \
            15 "third-party upstream image" \
            "triage each image before assuming it is unfixable — #1243 cleared 58 of 120 this way. Four levers, in the order worth checking: (1) a DIGEST-only refresh, for images whose version tag is mutable and gets re-pushed from a fresh base (alpine/git rebuilds every Sunday); (2) a patch tag published AFTER Renovate's last weekly run — Renovate runs Mondays at 06:17 UTC, so anything released later that day waits nearly a full week (grafana 12.4.6 was built 8 hours after that run); (3) the same release published to a registry we do not pin (prom-label-proxy v0.14.0 shipped to Docker Hub, never to quay); (4) replacing a release-dormant image with a maintained equivalent (configmap-reload, last released 2025-04-09, -> prometheus-config-reloader). What is usually NOT the lever: a gated major on the Renovate Dashboard (#929) — verify it actually carries the fix first. What is left after those four splits three ways, and the split matters for the next triage: (a) FIXED ON MAIN, UNRELEASED — the project already bumped the dependency but has cut no release (mysqld-exporter, alertmanager); (b) NO FIX EXISTS ANYWHERE YET — the upstream dependency's own fix is newer than every release of the image, so no version of it can carry the fix (grafana's kin-openapi CRITICAL); (c) A MAJOR WOULD NOT HELP EITHER — the finding comes from a component the next major ships identically (mariadb's 15 findings are all a pre-compiled gosu binary that 12.x pins to the same version). Only (a) is a waiting game." || rc=1
          exit $rc

      # A cron nobody watches degrades into background noise once it is red for
      # a few nights — this job was red for 33 consecutive runs before anyone
      # looked, and the actual cause (a 422 on the label API) was four scrolls
      # into a step log. Mirror renovate.yaml's self-explanatory-failure step so
      # the run page itself says what broke and what it cost.
      - name: Explain a likely failure cause
        if: ${{ failure() }}
        run: |
          echo "::error title=Nightly CVE report failed::The scans may well have SUCCEEDED — this job is the alerting step, so a failure here means findings were computed but the tracking issue was NOT updated. Most likely causes: (1) a GitHub API validation error (label description >100 chars, issue title >256) — see the 422 in the step log; (2) the issues:write permission or GH_TOKEN scope changed; (3) the 'nightly-cve' / 'nightly-cve-thirdparty' label was deleted. Findings are still in the step summary above and in the cve-frag-* artifacts."
