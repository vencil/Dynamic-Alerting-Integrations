name: Image Ref Resolve

# Verify every concrete PUBLIC third-party image ref in helm values / k8s manifests
# actually RESOLVES in its registry — catches a typo'd / yanked tag at PR time
# (the #897 class: a non-existent `mariadb:11.8.1` shipped → ImagePullBackOff).
# This is #902 L1-B; it complements the nightly scan (which resolves the WORKFLOW
# MATRIX refs, not the values.yaml ones — so a values typo / matrix↔values drift
# slips past it).
#
# First-party (ghcr.io/vencil/*) and locally-built (federation-audit-sidecar) refs
# are skipped by the script — see scripts/ops/check_image_refs_resolve.py.
#
# TWO SCOPES, run as two named steps and never as one combined invocation,
# because they answer different questions and a reader should be able to tell
# WHICH one broke from the step name alone (the checker offers no combined value
# for the same reason):
#   * `deploy`    — what WE install (helm values + k8s manifests). The #897 class.
#   * `delivered` — what a CUSTOMER installs: the third-party refs `da-tools init`
#                   writes into their repo (#1337 follow-up). Those live in
#                   `scripts/**`, outside every glob this checker had, outside
#                   Renovate's customManagers (all key on `@sha256:`), and
#                   outside the nightly CVE matrix — i.e. nothing answered "does
#                   this ref still exist?" for them at all.
#
# Path-filtered: only runs when a source carrying an image ref changes (or the
# checker itself).
#
# ⚠️ IT IS NO LONGER FREE FOR UNRELATED PRs, and that cost is deliberate. Adding
# the `delivered` scope meant adding its pin source to the filter, and that
# source is `scripts/tools/ops/init_project.py` — a ~70KB general-purpose
# generator that rule-pack work routinely touches (e9a7d92b / 1b2e6bf7 /
# 222742c5 all did). A GitHub path filter has no granularity below the file, so
# there is no way to say "only when the pin constants change"; the alternative
# was to widen the scan face and NOT the trigger face, which is exactly the
# decorative gate #1302 was about. So a rule-pack PR now pays two registry
# round-trips it does not need.
# What keeps that bounded: this job ("resolve chart/manifest image refs") is NOT
# in main's required status checks — it is under `advisory:` in
# .github/required-checks.yaml — so a red run here does not block a merge. It is a signal,
# and on an unrelated PR it is a signal you may read and move on from. Revisit
# only if the noise, not the runtime, starts costing something.

on:
  pull_request:
    paths:
      # ⛔ `values*.yaml`, not `values.yaml` (#1302). The checker's own globs were
      # widened to cover `-f values-tier2.yaml` overlay profiles; leaving this
      # filter narrow would give a gate that CAN see those files but is never
      # invoked when one changes — the trigger source has to match the scan face
      # or the widening is decorative. Pinned by
      # tests/ops/test_nightly_scan_matrix_drift.py.
      - "helm/**/values*.yaml"
      - "k8s/**"
      # ⛔ Same discipline as the `values*` line above, for the `delivered`
      # scope: this file IS the pin table that scope reads, so a PR that bumps
      # one of the customer-facing refs must be the PR that re-resolves
      # them. Widening the scan face without widening the trigger face gives a
      # gate that CAN see the pins and is never invoked when one changes.
      # Pinned by a sibling assertion in the nightly-scan matrix-drift module.
      - "scripts/tools/ops/init_project.py"
      # ⛔ Everything above is the hand-written part: the DATA this workflow
      # scans. What the job LOADS is not listed by hand any more (#3756 —
      # `scripts/tools/_lib_input.py` was imported two modules deep and missing
      # from this list). The region below is written by
      # `make workflow-path-filters` from what the job was measured to load
      # (.github/path-traces/image-ref-resolve.yaml.json), the Go sources of
      # the da-crdecode it builds, the literal imports of those files, and the
      # boundary set — files something other than Python reads, named with the
      # reason in BOUNDARY (scripts/ops/workflow_path_filter.py). The job's
      # last `run:` step fails, naming the file, when the job loads something
      # this list does not cover. Do not edit between the markers.
      # BEGIN GENERATED path-trace (scripts/ops/workflow_path_filter.py generate)
      - ".github/path-traces/image-ref-resolve.yaml.json"
      - ".github/workflows/image-ref-resolve.yaml"
      - ".python-version"
      - "Makefile"
      - "components/da-tools/app/VERSION"
      - "components/threshold-exporter/app/cmd/da-crdecode/*.go"
      - "components/threshold-exporter/app/go.mod"
      - "components/threshold-exporter/app/go.sum"
      - "components/threshold-exporter/app/third_party/yaml.v3/*.go"
      - "components/threshold-exporter/app/third_party/yaml.v3/go.mod"
      - "requirements/ci-constraints.txt"
      - "scripts/ops/check_image_refs_resolve.py"
      - "scripts/ops/go_build.sh"
      - "scripts/ops/path_trace/sitecustomize.py"
      - "scripts/ops/paths_filter_glob.py"
      - "scripts/ops/workflow_path_filter.py"
      - "scripts/tools/_lib_atomic_write.py"
      - "scripts/tools/_lib_compat.py"
      - "scripts/tools/_lib_confd.py"
      - "scripts/tools/_lib_confedit.py"
      - "scripts/tools/_lib_constants.py"
      - "scripts/tools/_lib_consumer_read.py"
      - "scripts/tools/_lib_engine.py"
      - "scripts/tools/_lib_exitcodes.py"
      - "scripts/tools/_lib_godispatch.py"
      - "scripts/tools/_lib_input.py"
      - "scripts/tools/_lib_io.py"
      - "scripts/tools/_lib_label.py"
      - "scripts/tools/_lib_parse_cache.py"
      - "scripts/tools/_lib_parse_tree.py"
      - "scripts/tools/_lib_paths.py"
      - "scripts/tools/_lib_prometheus.py"
      - "scripts/tools/_lib_python.py"
      - "scripts/tools/_lib_registry.py"
      - "scripts/tools/_lib_validation.py"
      - "scripts/tools/_lib_write_check.py"
      - "scripts/tools/ops/_registry_lib.py"
      - "scripts/tools/ops/_rule_packs_generated.py"
      - "scripts/tools/ops/guard_dispatch.py"
      - "scripts/tools/ops/scaffold_tenant.py"
      # END GENERATED path-trace
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-ref-resolve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: resolve chart/manifest image refs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # #3756: from here on every Python process of this job records what it
      # executes and opens, and go_build.sh records the package it builds; the
      # job's last `run:` step reads that back. It has to be the FIRST `run:`
      # step — pip below opens requirements/ci-constraints.txt, and that read
      # is measured only because this comes first. Generated; `generate
      # --check` holds both its text and its position.
      # BEGIN GENERATED path-trace-env job=resolve
      - name: Trace what this job loads (#3756)
        run: python3 scripts/ops/workflow_path_filter.py env --trace-dir "$RUNNER_TEMP/path-trace" >> "$GITHUB_ENV"
      # END GENERATED path-trace-env

      # Its own step so a dependency failure cannot be mistaken for a resolve
      # failure in either scope below.
      - name: Install Python deps
        run: python3 -m pip install --quiet pyyaml -c requirements/ci-constraints.txt

      # #3206 (ADR-036 §12): the values files and manifests are read through
      # da-crdecode (kubectl's / Helm's reading); without it the scan exits 2.
      - uses: actions/setup-go@v6
        with:
          go-version-file: components/threshold-exporter/app/go.mod
          cache: true
          cache-dependency-path: components/threshold-exporter/app/go.sum

      - name: Build da-crdecode
        run: |
          make da-crdecode-build
          echo "DA_CRDECODE_BINARY=$PWD/.build/da-crdecode" >> "$GITHUB_ENV"

      - name: Resolve image refs (deploy scope — helm values + k8s manifests)
        id: deploy_scope
        run: python3 scripts/ops/check_image_refs_resolve.py --scope deploy

      # Runs even when the deploy scope FAILED: `!cancelled()` (not `always()`)
      # relaxes only the implicit success() check, so a real failure above does
      # not hide this face.
      #
      # ⛔ A second clause `&& steps.deploy_scope.conclusion != 'skipped'` used to
      # sit here, with a comment arguing it never narrows because an unconditional
      # step "cannot be skipped" and an un-run step is ABSENT from the context.
      # Review found that reasoning inverted: a step with no `if:` carries the
      # implicit `success()`, so when an earlier step fails it is recorded with
      # `conclusion: skipped` — present, not absent — and the clause gated this
      # step in precisely the case the comment said it did not. It was also an
      # allowlisted expression in the reachability guard, i.e. a fail-open
      # exemption resting on a false premise, inside a module whose whole design
      # is "unknown expression ⇒ assume it gates ⇒ red". Removed rather than
      # re-argued: it bought nothing that `!cancelled()` plus a red job does not
      # already give.
      # The two scopes are independent faces: "the customer pipeline's kubectl
      # image is gone" is worth knowing in the SAME run as "our grafana tag is
      # typo'd", not in the run after.
      - name: Resolve image refs (delivered scope — what `da-tools init` writes)
        if: ${{ !cancelled() }}
        run: python3 scripts/ops/check_image_refs_resolve.py --scope delivered

      # #3756: every first-party file the steps above loaded, and every in-repo
      # source of the da-crdecode they built, must be in `on.pull_request.paths`
      # above — otherwise a PR changing only that file would not have started
      # this workflow. `!cancelled()` so a failed scope still gets its loads
      # checked (a step that did not run loaded nothing, which is not a pass
      # for it — it is simply not measured on this run). Generated, and it has
      # to stay the job's LAST `run:` step.
      # BEGIN GENERATED path-trace-assert job=resolve
      - name: Path filter covers everything this job loaded (#3756)
        if: ${{ !cancelled() }}
        run: python3 scripts/ops/workflow_path_filter.py assert --workflow image-ref-resolve.yaml --job resolve --trace-dir "$RUNNER_TEMP/path-trace" --out "$RUNNER_TEMP/path-trace.json"
      # END GENERATED path-trace-assert

      # The trace `assert --out` wrote: on a red run, this file is what the
      # `resolve` entry of .github/path-traces/image-ref-resolve.yaml.json
      # should become.
      - name: Upload the trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: path-trace-image-ref-resolve-resolve
          path: ${{ runner.temp }}/path-trace.json
          if-no-files-found: warn
