# 夜跑成對量測的固定參考版本（ADR-032）。
#
# ⛔ 改這個值 = 一次「吸收事件」。
#    換參考版本的當下，main 上有什麼，新參考點就吸收什麼——包含一個已經開票、
#    評估後決定暫不修的退化。之後比值回到 1.00，監測器會讀成「不再超標」。
#    詳見 ADR-032 §待決 1，那是本設計最大的未解問題。
#
#    因此參考版本**釘死在這個檔案裡，而不是自動跟最新 tag**。自動跟隨會讓參考點
#    在任何人打 tag 的瞬間悄悄移動——一次沒有人審過的吸收事件，正是本 ADR 要
#    消滅的那種行為。改這裡需要一個 PR，這是刻意的摩擦。
#
# ⛔ 換版前必須滿足 ADR-032 §待決 1 的不變量：
#       換參考版本不得關閉尚未結案的效能票。
#    未結案的幅度要換算到新參考版本上重新表述；拿不到換算依據時 fail closed
#    ——票保持開啟，不得以「算不出來」為由關閉或改判。
#
# 為什麼綁 exporter 線而不是平台線：
#    夜跑量的是 components/threshold-exporter/app。平台線會為了與 exporter
#    無關的發布多做一次吸收（例如 v2.8.1 是平台 tag only，exporter 沒動）。
#    換版次數越少，吸收事件越少。
#
# ⛔ 為什麼是 SHA 而不是 tag：
#    tag 是可移動的。有人把 exporter/v2.9.0 指到別的 commit，參考點就悄悄變了
#    ——那是一次沒有人審過的吸收事件，正是本檔案存在的目的要擋掉的東西，只是
#    換了一條路徑進來。checkout 走 sha，tag 只是給人看的標籤。
#    （順帶解掉 CodeQL 的 cache-poisoning 告警：夜跑 job 跑在 default branch
#    的特權情境，執行一份由可變 ref 決定的程式碼是它點名的模式。）
#
# 換版時兩個欄位都要改，取得方式：
#    git rev-parse <新 tag>^{commit}
#
# 相關：ADR-032 / 實作追蹤 TRK-359（#1439）

tag: exporter/v2.9.0
sha: 3fd96b51f52e61566bb12c4c3fa23fed7e34dfa0

# ── 工作定義閉包（ADR-032 §工作定義漂移）────────────────────────────────
#
# 比值 M/R 要讀成「同一件事，新舊實作誰比較貴」，前提是兩側**做同一件事**。
# 決定「同一件事」的不是產品程式碼，是這批測試檔。它們一改，比值就會出現一階
# 永久階梯，形狀與真退化一模一樣。
#
# ⛔ 這裡放的是**規則**不是凍結結果。`derived_glob` 由 find 推導，所以新增或
#    刪除 benchmark 檔會自動進出閉包；把 8 個檔名全部寫死的話，新增一支
#    benchmark 會**靜默**掉出閉包——而掉出去的失效模式看起來與正常一模一樣。
#
# ⛔ `helpers` 是**手工列舉**，這是已知弱點不是疏漏：列舉錯了的失效是靜默的
#    （漏掉的 helper 綁在參考版本那側，兩側工作定義分岔而畫面上看不出來）。
#    現值是實測迭代出的閉包（2026-08-18，`3fd96b51`..main，第 4 輪不動點）：
#    起點是 config_bench_test.go 用到 config_test.go 的 SV / SVScheduled
#    （fixture 值建構子，影響 8 支夜跑 bench，而它不是 *bench_test.go，
#    所以舊版夜跑的 drift 清單看不到它）。
#    ⚠️ 範圍不能無限外推：覆蓋兩個 package 的全部 *_test.go 會因參考版本沒有
#    的產品 API（ExpiryMeta / canonicalKeyFor 等）編譯失敗——「全都蓋、絕不
#    遺漏」這個安全方向不可用。詳見 benchmark-playbook.md §工作定義效應。
#
# 消費者：
#    - bench-record.yaml（夜跑）—— drift 清單與 digest 的範圍
#    - bench-workload-effect.yaml —— overlay 集合。⚠️ 它的 workflow_dispatch
#      input 預設值必須是字面值（GitHub Actions 不在 input default 求值
#      `${{ }}`），所以那份副本無法消除，改由一道漂移檢查擋住：兩邊不一致就
#      讓 job 紅掉，而不是靜默分岔。

workload_closure:
  derived_glob: "*bench_test.go"
  helpers:
    - config_test.go
    - config_debounce_test.go
    - config_metrics_test.go
    - watchloop_test.go
