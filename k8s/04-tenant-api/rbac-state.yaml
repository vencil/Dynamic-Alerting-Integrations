# tenant-api's access to its state store (#2856): get + update on the one
# state ConfigMap, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-api-state
  namespace: tenant-api
  labels:
    app: tenant-api
    app.kubernetes.io/part-of: dynamic-alerting
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["tenant-api-state"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-api-state
  namespace: tenant-api
  labels:
    app: tenant-api
    app.kubernetes.io/part-of: dynamic-alerting
subjects:
  - kind: ServiceAccount
    name: tenant-api
    namespace: tenant-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-api-state
