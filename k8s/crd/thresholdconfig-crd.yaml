# ThresholdConfig CRD — Optional entry point for declarative tenant config.
#
# Namespace-scoped.  The da-assembler-controller watches these resources and
# renders each into a directory under config-dir/ (<name>/<name>.yaml, and
# <name>/_defaults.yaml for spec.defaults) that threshold-exporter reads.
#
# The spec.tenants structure mirrors the existing tenant YAML format exactly,
# so migration from hand-written YAML to CRD is copy-paste.
#
# Install:
#   kubectl apply -f k8s/crd/thresholdconfig-crd.yaml
#
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: thresholdconfigs.dynamicalerting.io
  labels:
    app.kubernetes.io/part-of: dynamic-alerting
    app.kubernetes.io/component: assembler
spec:
  group: dynamicalerting.io
  names:
    kind: ThresholdConfig
    listKind: ThresholdConfigList
    plural: thresholdconfigs
    singular: thresholdconfig
    shortNames:
      - tc
      - tconfig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            ThresholdConfig declares tenant alerting thresholds in a K8s-native
            way.  The assembler controller renders each resource into a tenant
            YAML file that threshold-exporter hot-reloads via SHA-256 hashing.
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - tenants
              # #3671: a field the controller would render to no reader is
              # refused at admission, not accepted and dropped.
              x-kubernetes-validations:
                - rule: "!has(self.stateFilters)"
                  message: >-
                    spec.stateFilters is not supported: the exporter reads
                    state_filters only from the root _defaults.yaml. Declare
                    the filter there.
                - rule: "!has(self.profile)"
                  message: >-
                    spec.profile is not rendered. Set _profile on each tenant
                    under spec.tenants instead.
              properties:
                tenants:
                  description: >-
                    Map of tenant name → threshold overrides.  Structure is
                    identical to a hand-written conf.d/<tenant>.yaml file.
                  type: object
                  additionalProperties:
                    description: >-
                      Per-tenant threshold map.  Keys are metric names (or
                      reserved keys like _silent_mode, _routing, _state_*).
                      Values are strings (threshold), "disable", or objects
                      (for _routing, _metadata, scheduled values).
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                defaults:
                  description: >-
                    Optional defaults for this resource's tenants alone,
                    rendered as <name>/_defaults.yaml (the exporter's subtree
                    defaults layer).  Only keys the root _defaults.yaml or
                    optional_overrides declares are delivered.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                stateFilters:
                  description: >-
                    Not supported (refused by the validation rule above): the
                    exporter reads state_filters only from the root
                    _defaults.yaml.  Kept in the schema so the rule can name it.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                profile:
                  description: >-
                    Not supported (refused by the validation rule above): set
                    _profile on each tenant under spec.tenants.
                  type: string
            status:
              type: object
              properties:
                phase:
                  description: Current reconciliation phase.
                  type: string
                  enum:
                    - Pending
                    - Rendered
                    - Error
                lastRenderedHash:
                  description: >-
                    SHA-256 over the files last rendered for this resource
                    (each file's path and bytes, in path order).
                  type: string
                lastRenderedTime:
                  description: Timestamp of last successful render.
                  type: string
                  format: date-time
                message:
                  description: Human-readable status message.
                  type: string
                tenantCount:
                  description: Number of tenants declared in this resource.
                  type: integer
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Tenants
          type: integer
          jsonPath: .status.tenantCount
        - name: Last Rendered
          type: date
          jsonPath: .status.lastRenderedTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
