# Example ThresholdConfig CR — equivalent to a hand-written conf.d/db-a.yaml
#
# Apply:
#   kubectl apply -f k8s/crd/examples/example-thresholdconfig.yaml
#
# The da-assembler-controller watches this and renders it to:
#   config-dir/db-a/db-a.yaml   (spec.defaults, when set: config-dir/db-a/_defaults.yaml)
#
apiVersion: dynamicalerting.io/v1alpha1
kind: ThresholdConfig
metadata:
  name: db-a
  namespace: db-a
  labels:
    app.kubernetes.io/part-of: dynamic-alerting
    domain: payment
spec:
  tenants:
    db-a:
      mysql_connection_usage_percent: "70"
      # threads_running 1m-avg saturation (concurrent threads, NOT host CPU%). The
      # platform ships no default (a healthy value scales with the host's CPU count,
      # #3778); the key is declared, so a tenant or the deployment's defaults can set
      # it, and a tenant line alone is served. Suggested critical tier 50 (#944) — a
      # _critical is served only once the defaults carry a base value for this key.
      # Renamed from mysql_cpu (#1231 — the old spelling
      # still resolves during the 2-release alias window). 25 = a value sized for this
      # payment-domain tenant's host (pt-osc throttle tier).
      mysql_threads_running: "25"
      container_memory: "85"
      _silent_mode: "disable"
      _routing:
        receiver:
          type: "webhook"
          url: "https://webhook.db-a.example.com/alerts"
        group_by: ["alertname", "severity"]
        group_wait: "30s"
        repeat_interval: "4h"
