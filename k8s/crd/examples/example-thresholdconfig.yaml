# Example ThresholdConfig CR — equivalent to a hand-written conf.d/db-a.yaml
#
# Apply:
#   kubectl apply -f k8s/crd/examples/example-thresholdconfig.yaml
#
# The da-assembler-controller watches this and renders it to:
#   config-dir/db-a.yaml
#
apiVersion: dynamicalerting.io/v1alpha1
kind: ThresholdConfig
metadata:
  name: db-a
  namespace: db-a
  labels:
    app.kubernetes.io/part-of: dynamic-alerting
    domain: payment
spec:
  tenants:
    db-a:
      mysql_connections: "70"
      # threads_running 1m-avg saturation (concurrent threads, NOT host CPU%); platform
      # default 30, suggested critical tier 50 (#944). Renamed from mysql_cpu (#1231 —
      # the poisoned name is retired; the old spelling still resolves during the
      # 2-release alias window). 25 = a deliberate tightening for this payment-domain
      # tenant (pt-osc throttle tier), matching the stricter mysql_connections above.
      mysql_threads_running: "25"
      container_memory: "85"
      _silent_mode: "disable"
      _routing:
        receiver:
          type: "webhook"
          url: "https://webhook.db-a.example.com/alerts"
        group_by: ["alertname", "severity"]
        group_wait: "30s"
        repeat_interval: "4h"
