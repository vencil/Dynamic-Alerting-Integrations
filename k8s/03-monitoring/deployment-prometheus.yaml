apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            # ⚠️ 安全注意：啟用 lifecycle 會暴露 /-/reload 和 /-/quit 端點（無認證）——
            # `/-/quit` 可被任何搆得到此埠的人用來關閉 Prometheus。生產環境請用
            # NetworkPolicy 擋掉**叢集內其他 Pod** 對 9090 的存取，或用 auth proxy 保護。
            # ⛔ NetworkPolicy 選取的單位是 Pod，做不到「只放行本 Pod 內某個容器」；
            # 同 Pod 內的流量走 loopback、根本不經 NetworkPolicy（#1243 更正）。
            - "--web.enable-lifecycle"
            # ── Federation blast-radius Layer 1 (ADR-020 IV-2c, #508) ──
            # Hard query caps so a tenant federation read cannot OOM or
            # hang this Prometheus. This server backs BOTH platform rule
            # evaluation AND federation reads (it is the federation-proxy
            # upstream), and both flags are GLOBAL — they bound every
            # query, not just federation ones. The values are the
            # federation-driven starting points from ADR-020 §Blast
            # radius Layer 1; raise them if internal rule evaluation
            # false-positives (Prometheus native defaults: 50000000 / 2m).
            #
            # --query.max-samples — total samples a single query may
            #   load into memory. 5M (tuning range 5M–50M): sits above a
            #   typical 1000-series × 1d @30s scrape (~3M), a
            #   conservative federation starting point. NOTE: this cap is
            #   only a real OOM guard if resources.limits.memory below is
            #   sized to hold a near-cap query plus the TSDB baseline —
            #   the two are coupled. Raising the cap toward 50M needs a
            #   correspondingly larger memory limit.
            - "--query.max-samples=5000000"
            # --query.timeout — 25s, deliberately SHORTER than the Layer
            #   2 gateway's 30s route timeout (cascading timeouts, NOT
            #   equal). The inner layer must fire first: Prometheus then
            #   kills the slow query, frees its memory, and returns a
            #   precise error code the gateway logs accurately. Equal
            #   timeouts race — the gateway's timer starts earlier (at
            #   request arrival), so it would 504 the client first while
            #   Prometheus keeps churning and its clean error goes
            #   nowhere. 25s leaves a ~5s margin over hop latency / skew.
            - "--query.timeout=25s"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # memory limit is coupled to --query.max-samples above: a
            # near-cap (5M-sample) query plus the TSDB baseline must fit,
            # or the cgroup OOM-killer fires before max-samples can
            # cleanly reject — defeating the cap. 1Gi suits this lab
            # scale; size up for production data volume or a higher cap.
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
        # #1246: Rule Pack 熱更新的觸發器。在此之前這個 Pod 只有一個容器，而
        # **Prometheus 不監看 rule 檔** —— kubelet 會把 ConfigMap 變更同步進下面
        # 的 projected volume（30–90s），但規則要等到有人 POST /-/reload 或 Pod
        # 重啟才真的生效，而 repo 內**沒有任何自動化**會去打它——散在文件裡的
        # /-/reload 都是人工步驟（troubleshooting-checklist 與 BYO 指南的
        # kubectl exec / curl、tenant-federation 的 token 輪替說明等，不只兩處，
        # 別在這裡維護清單）。ADR-005「動態管理」等多份文件卻寫成 sidecar 自動
        # reload —— 這個 sidecar 就是把那個說法補成真。
        #
        # 與 Alertmanager 側同一顆 image（#1243 引進，已在部署 SSOT 與 nightly
        # 掃描矩陣內，不新增第三方供應鏈面）。--reload-url 顯式寫出來（值刻意與
        # 上游預設 http://127.0.0.1:9090/-/reload 逐字相同，不用 localhost——後者
        # 可能解析到 ::1 而 Prometheus 綁的是 0.0.0.0），免得日後上游改預設時靜默
        # 指向別處。
        #
        # ⚠️ 範圍誠實：這只修 RULE PACK。主設定 prometheus.yml 是以
        # `subPath: prometheus.yml` 掛載的，而 **Kubernetes 對 subPath 掛載不傳播
        # ConfigMap 更新** —— 那份檔案在 Pod 內永遠不會變，reload 也只是重讀同一
        # 份舊檔。改 prometheus.yml 仍必須重啟 Pod。故這裡只 watch rules 目錄，
        # 不 watch /etc/prometheus，避免暗示後者也會自動生效。
        - name: config-reloader
          image: quay.io/prometheus-operator/prometheus-config-reloader:v0.93.1@sha256:428f088fe6fe07ab138bda92113664b04848a1dc408e4d3680a60ecdb55d1a65
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--watched-dir=/etc/prometheus/rules"
            - "--reload-url=http://127.0.0.1:9090/-/reload"
          volumeMounts:
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # ============================================================
        # Projected Volume: merges independent Rule Pack ConfigMaps
        # into /etc/prometheus/rules/ (matched by rule_files: "*.yml")
        # Each ConfigMap is maintained by its respective team.
        #
        # optional: true — 允許租戶透過 kubectl delete cm 卸載不需要的
        # Rule Pack，Prometheus 不會因缺少 ConfigMap 而 Crash。
        # 大型客戶可關閉黃金標準，改用 migrate_rule.py 轉出的
        # 自訂規則包 (configmap-rules-custom-*.yaml)。
        # ============================================================
        - name: rules
          projected:
            sources:
              - configMap:
                  name: prometheus-rules-mariadb
                  optional: true
                  items:
                    - key: mariadb-recording.yml
                      path: mariadb-recording.yml
                    - key: mariadb-alert.yml
                      path: mariadb-alert.yml
              - configMap:
                  name: prometheus-rules-kubernetes
                  optional: true
                  items:
                    - key: kubernetes-recording.yml
                      path: kubernetes-recording.yml
                    - key: kubernetes-alert.yml
                      path: kubernetes-alert.yml
              - configMap:
                  name: prometheus-rules-redis
                  optional: true
                  items:
                    - key: redis-recording.yml
                      path: redis-recording.yml
                    - key: redis-alert.yml
                      path: redis-alert.yml
              - configMap:
                  name: prometheus-rules-mongodb
                  optional: true
                  items:
                    - key: mongodb-recording.yml
                      path: mongodb-recording.yml
                    - key: mongodb-alert.yml
                      path: mongodb-alert.yml
              - configMap:
                  name: prometheus-rules-elasticsearch
                  optional: true
                  items:
                    - key: elasticsearch-recording.yml
                      path: elasticsearch-recording.yml
                    - key: elasticsearch-alert.yml
                      path: elasticsearch-alert.yml
              - configMap:
                  name: prometheus-rules-oracle
                  optional: true
                  items:
                    - key: oracle-recording.yml
                      path: oracle-recording.yml
                    - key: oracle-alert.yml
                      path: oracle-alert.yml
              - configMap:
                  name: prometheus-rules-db2
                  optional: true
                  items:
                    - key: db2-recording.yml
                      path: db2-recording.yml
                    - key: db2-alert.yml
                      path: db2-alert.yml
              - configMap:
                  name: prometheus-rules-clickhouse
                  optional: true
                  items:
                    - key: clickhouse-recording.yml
                      path: clickhouse-recording.yml
                    - key: clickhouse-alert.yml
                      path: clickhouse-alert.yml
              - configMap:
                  name: prometheus-rules-postgresql
                  optional: true
                  items:
                    - key: postgresql-recording.yml
                      path: postgresql-recording.yml
                    - key: postgresql-alert.yml
                      path: postgresql-alert.yml
              - configMap:
                  name: prometheus-rules-kafka
                  optional: true
                  items:
                    - key: kafka-recording.yml
                      path: kafka-recording.yml
                    - key: kafka-alert.yml
                      path: kafka-alert.yml
              - configMap:
                  name: prometheus-rules-rabbitmq
                  optional: true
                  items:
                    - key: rabbitmq-recording.yml
                      path: rabbitmq-recording.yml
                    - key: rabbitmq-alert.yml
                      path: rabbitmq-alert.yml
              - configMap:
                  name: prometheus-rules-jvm
                  optional: true
                  items:
                    - key: jvm-recording.yml
                      path: jvm-recording.yml
                    - key: jvm-alert.yml
                      path: jvm-alert.yml
              - configMap:
                  name: prometheus-rules-nginx
                  optional: true
                  items:
                    - key: nginx-recording.yml
                      path: nginx-recording.yml
                    - key: nginx-alert.yml
                      path: nginx-alert.yml
              - configMap:
                  name: prometheus-rules-platform
                  optional: true
                  items:
                    - key: platform-alert.yml
                      path: platform-alert.yml
              - configMap:
                  name: prometheus-rules-liveness
                  optional: true
                  items:
                    - key: liveness-alert.yml
                      path: liveness-alert.yml
              - configMap:
                  name: prometheus-rules-operational
                  optional: true
                  items:
                    - key: operational-alert.yml
                      path: operational-alert.yml
        - name: data
          emptyDir: {}
