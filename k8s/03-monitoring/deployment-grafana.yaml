apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:12.4.12@sha256:83be3e511ede559bee80e2215bb1987cb1246075461cb961beb515b0341e7aea
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # VictoriaLogs datasource plugin (#539 Phase 1), pinned to an
            # exact version (TRK-2605). Grafana installs it from grafana.com
            # before it starts serving (a failed install fails startup) and,
            # because the version is pinned, never auto-updates it. Renovate
            # tracks the grafana.com catalog (renovate.json, datasource
            # custom.grafana-plugins); tests/ops/test_grafana_plugins_are_version_pinned.py
            # rejects an entry without `@<version>`. Air-gapped clusters MUST
            # pre-bake the plugin into a custom image and remove this env var.
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: "victoriametrics-logs-datasource@0.32.0"
            # Grafana 12.4 also installs these app plugins from grafana.com in
            # the background, unpinned and auto-updated, unless they are
            # disabled (pkg/setting/setting_plugins.go defaultPreinstallPlugins).
            # No dashboard here uses them. Keep the list in step with the
            # Grafana minor; the guard above pins which minor it was taken from.
            - name: GF_PLUGINS_DISABLE_PLUGINS
              value: "grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app"
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/mariadb-overview.json
              subPath: mariadb-overview.json
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/federation-revocation-dashboard.json
              subPath: federation-revocation-dashboard.json
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
