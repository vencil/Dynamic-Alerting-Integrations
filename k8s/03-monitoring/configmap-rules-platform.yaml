    \ https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/adr/017-defaults-yaml-inheritance-dual-hash.md\n\
    \      summary: Config change rippled to >500 tenants (p99, 5m)\n  - alert: ConfigDefaultsShadowedSurge\n\
    \    expr: max without (instance, pod) (rate(da_config_defaults_shadowed_total[1h]))\
