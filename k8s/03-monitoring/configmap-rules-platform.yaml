    \      Read together with FederationRevocationLiveSetRejected — this one\n\n \
    \       is the gateway''s account, that one is the file''s. Details:\n\n     \
    \   docs/internal/federation-revocation-reconciler-runbook.md.\n\n        '\n\
    \      runbook_url: https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/federation-revocation-reconciler-runbook.md\n\
    \      summary: 'Federation gateway REFUSED its revoked-set reload — it is enforcing\
