    \        (revoked.txt). A failed read does NOT clear the set: each gateway\n\n\
    \        worker keeps enforcing the set it last loaded successfully, so\n\n  \
    \      tokens in that set are still rejected, but every revocation issued\n\n\
    \        after that load is NOT in force until a read succeeds (reloads are\n\n\
