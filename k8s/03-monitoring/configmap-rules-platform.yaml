    \n        '\n      runbook_url: https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/federation-revocation-reconciler-runbook.md\n\
    \      summary: 'Federation revoked set violates its line contract — the gateway\
