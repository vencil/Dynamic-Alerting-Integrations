    \"monitoring\\\"}\\n    ) == 1,\\n    \\\"owner_name\\\", \\\"$1\\\", \\\"cronjob\\\
    \", \\\"(.*)\\\"\\n  )\\n\"\n    for: 15m\n    labels:\n      alert_source: platform\n\
    \      severity: warning\n    annotations:\n      description: 'The most recent\
    \ Job created by CronJob {{ $labels.owner_name }}\n\n        in namespace {{ $labels.namespace\
    \ }} ended in a Failed\n\n        condition. Unlike a staleness alert — which\
