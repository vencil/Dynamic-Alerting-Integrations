    \ the platform\n\n        0:0 copy but no tenant partition. Likely causes: (a)\
    \ audit\n\n        traffic from a tenant that has no projection yet (new tenant,\n\
    \n        or `tenantProjections` behind `_account_registry.yaml`);\n\n       \
    \ (b) a forged or malformed payload flood. This is a coarse\n\n        surge signal:\
    \ it cannot name the account and it is NOT a\n\n        registry-desync detector\
    \ — a small or long-standing gap is\n\n        part of the baseline and does not\
    \ fire, and a permanent step\n\n        stops firing after about a day. Query\
    \ the 0:0 store for\n\n        recent `log_type:federation_audit` rows by `tenant_id`\
    \ and\n\n        compare against `tenantProjections`. See\n\n        platform-log-aggregation-runbook\
    \ §8.7.\n\n        '\n      runbook_url: https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/integration/tenant-log-query.md\n\
    \      summary: Unprojected tenant audit rows surged above 3x their 1-day baseline\
    \ for 15m\n  - alert: VectorProjectionGateMismatch\n    expr: \"max by (mode,\
    \ namespace) (\\n  vector_tenant_projection_gate_info{category=\\\"mismatch\\\"\
    }\\n) > 0\\n\"\n    for: 5m\n    labels:\n      alert_source: platform\n     \
    \ severity: critical\n    annotations:\n      description: 'A `tenantProjections`\
    \ entry''s accountId does not match the\n\n        AccountID registry''s (`_account_registry.yaml`)\
    \ allocation — a unique-but-wrong\n\n        value (the cross-tenant-leak case\
    \ the render-time uniqueness\n\n        guard and the integer schema both pass).\
    \ The gate DEGRADED to\n\n        platform-only 0:0: the tenant-sanitized projection\
    \ sinks are\n\n        omitted, so affected tenants silently get NO own-logs partition\n\
    \n        (the leak itself is PREVENTED — Vector never wrote to the wrong\n\n\
    \        partition). ACTION: reconcile `tenantProjections` against\n\n       \
    \ `_account_registry.yaml` (the SSOT), fix the mismatched\n\n        accountId,\
    \ and roll the DaemonSet so the gate re-validates.\n\n        The exact offending\
    \ pair is in the projection-gate\n\n        init-container logs (`kubectl logs\
    \ <vector-pod> -c\n\n        projection-gate`). See platform-log-aggregation-runbook\
    \ §8.9.1.\n\n        '\n      runbook_url: https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/integration/tenant-log-query.md\n\
    \      summary: Vector projection gate found a wrong accountId (mode={{ $labels.mode\
    \ }}) — tenant log routing degraded to 0:0\n  - alert: VectorRegistryUnreadableAtBoot\n\
    \    expr: \"max by (mode, namespace) (\\n  vector_tenant_projection_gate_info{category=\\\
    \"registry_unreadable\\\"}\\n) > 0\\n\"\n    for: 5m\n    labels:\n      alert_source:\
    \ platform\n      severity: critical\n    annotations:\n      description: 'The\
    \ projection-gate init-container could not trust the\n\n        `_account_registry.yaml`\
    \ it mounts at boot and DEGRADED Vector to\n\n        platform-only 0:0. Most\
    \ likely the fresh-deploy ORDERING RACE\n\n        (Vector started before the\
    \ registry ConfigMap synced); the gate\n\n        validates ONCE at boot, so it\
    \ STAYS degraded even after the\n\n        registry appears — tenant log routing\
    \ is silently off while\n\n        everything else looks healthy. Could also be\
    \ a malformed or\n\n        newer-schema registry (fail-closed refusal). ACTION:\
    \ confirm the\n\n        registry ConfigMap (`projectionGate.registry.configMapName`)\n\
    \n        exists and is well-formed, then\n\n        `kubectl rollout restart\
    \ ds/<vector>` to re-run the gate against\n\n        it. Details in the init-container\
    \ logs (`kubectl logs\n\n        <vector-pod> -c projection-gate`). See\n\n  \
    \      platform-log-aggregation-runbook §8.9.2.\n\n        '\n      runbook_url:\
    \ https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md\n\
    \      summary: Vector projection gate could not read the account registry at\
    \ boot (mode={{ $labels.mode }}) — tenant routing silently degraded\n  - alert:\
    \ VectorProjectionGateStuck\n    expr: \"max by (namespace) (\\n  max_over_time(\\\
    n    kube_pod_init_container_status_waiting_reason{container=\\\"projection-gate\\\
    \", reason=~\\\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|InvalidImageName|CreateContainerConfigError\\\
    \"}[5m]\\n  )\\n) > 0\\n\"\n    for: 5m\n    labels:\n      alert_source: platform\n\
    \      severity: critical\n    annotations:\n      description: 'The projection-gate\
    \ init-container is stuck waiting (crash loop,\n\n        image-pull failure,\
    \ or container-config error) — the pod never\n\n        starts Vector, and on\
    \ a DaemonSet maxUnavailable then HALTS the\n\n        rollout cluster-wide (mid-roll\
    \ nodes lose logging; un-rolled\n\n        nodes keep the old config — a split\
    \ brain). The verdict metric\n\n        is NOT served in this state (Vector +\
    \ the sidecar never start),\n\n        so the degrade alerts cannot see it — this\
    \ KSM signal is the\n\n        only one. Causes: `tenantProjectionGate: enforce`\
    \ + a config-bug\n\n        mismatch (fail-closed working as designed — REVERT\
    \ the bad\n\n        `tenantProjections` change); a wrong/garbled gate image or\
    \ args\n\n        (any mode — fix `projectionGate.image` / the init spec); a\n\
    \n        missing staging ConfigMap. Inspect `kubectl describe pod` for\n\n  \
    \      the waiting reason and `kubectl logs <vector-pod> -c\n\n        projection-gate\
    \ --previous` for crash output. Consider `degrade`\n\n        mode if a hard rollout\
    \ stop is worse than fail-available 0:0 for\n\n        your environment. See platform-log-aggregation-runbook\
    \ §8.9.3.\n\n        '\n      runbook_url: https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/internal/platform-log-aggregation-runbook.md\n\
    \      summary: Vector projection-gate init-container is stuck (crash loop / image\
    \ pull) — DaemonSet rollout wedged in {{ $labels.namespace }}\n"
