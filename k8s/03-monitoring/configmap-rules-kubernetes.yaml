    \ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}:\
    \ {{ $value }} container(s) reporting but kube-state-metrics shows no pod of this\
    \ tenant — check kube-state-metrics and its scrape'\n      platform_summary_zh:\
    \ '[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant)\
    \ }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant\
    \ }}：{{ $value }} 個容器有回報，但 kube-state-metrics 沒有這個租戶的任何 Pod — 請查 kube-state-metrics\
    \ 與它的抓取'\n      runbook_url: '{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})`\
    \ $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end\
    \ }}'\n      summary: No pod state metrics for {{ $labels.tenant }} while its\
    \ containers run — pod-state alerts are blind\n      summary_zh: '{{ $labels.tenant\
    \ }} 的容器在跑，卻沒有 Pod 狀態指標 — Pod 狀態類告警看不到它'\n      tier: '{{ with query (printf `topk(1,\
    \ tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier\
    \ }}{{ end }}{{ end }}'\n- name: kubernetes-custom-disk-recipe-sentinel\n  rules:\n\
    \  - record: tenant:kube_pods_running:count\n    expr: \"count by(tenant, da_cluster)\
    \ (\\n  label_replace(kube_pod_status_phase{namespace=~\\\"db-.+\\\", phase=\\\
    \"Running\\\"} == 1, \\\"tenant\\\", \\\"$1\\\", \\\"namespace\\\", \\\"(.+)\\\
    \")\\n)\\n\"\n  - record: tenant:kubelet_volume_stats:count\n    expr: \"count\
    \ by(tenant, da_cluster) (\\n  label_replace(kubelet_volume_stats_available_bytes{namespace=~\\\
    \"db-.+\\\"}, \\\"tenant\\\", \\\"$1\\\", \\\"namespace\\\", \\\"(.+)\\\")\\n)\\\
    nand on(tenant, da_cluster)\\ncount by(tenant, da_cluster) (\\n  label_replace(kubelet_volume_stats_capacity_bytes{namespace=~\\\
    \"db-.+\\\"}, \\\"tenant\\\", \\\"$1\\\", \\\"namespace\\\", \\\"(.+)\\\")\\n)\\\
    n\"\n  - alert: CustomRecipeDiskInert\n    expr: \"(\\n  max by(tenant, da_cluster)\
    \ (tenant:kube_pods_running:count)\\n  and on(tenant)\\n  max by(tenant) (\\n\
    \    user_threshold{component=\\\"custom\\\", metric=\\\"kubelet_volume_stats_available_bytes\\\
    \"}\\n    or\\n    user_threshold{component=\\\"custom\\\", metric=\\\"kubelet_volume_stats_used_bytes\\\
    \"}\\n  )\\n)\\nunless on(tenant, da_cluster)\\ntenant:kubelet_volume_stats:count\\\
    nunless on(tenant)\\n(user_state_filter{filter=\\\"maintenance\\\"} == 1)\\n\"\
    \n    for: 15m\n    labels:\n      maintenance: mute\n      severity: warning\n\
    \      tenant: '{{ $labels.tenant }}'\n    annotations:\n      description: You\
    \ declared a disk-fill custom alert, but the platform sees no disk (volume) metrics\
    \ for your workload{{ with $labels.da_cluster }} in cluster {{ . }}{{ end }},\
    \ so the alert can never fire{{ with $labels.da_cluster }} there{{ end }}. This\
    \ usually means your service mounts no PersistentVolumeClaim{{ with $labels.da_cluster\
    \ }} in that cluster{{ end }} — check your deployment. If you DO use a PVC, contact\
    \ the platform team to investigate disk-metric collection.\n      description_zh:\
    \ 您設定了磁碟填滿告警，但平台偵測不到您工作負載{{ with $labels.da_cluster }}在叢集 {{ . }} {{ end }}的磁碟(volume)指標，該告警{{\
    \ with $labels.da_cluster }}在該叢集{{ end }}永遠不會觸發。這通常表示您的服務{{ with $labels.da_cluster\
    \ }}在該叢集{{ end }}沒有掛載 PersistentVolumeClaim — 請確認您的部署。若您確實使用 PVC，請聯繫平台團隊排查磁碟指標收集。\n\
    \      owner: '{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})`\
    \ $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}'\n\
    \      platform_runbook_url: https://github.com/vencil/Dynamic-Alerting-Integrations/blob/main/docs/integration/byo-prometheus-integration.md\n\
    \      platform_summary: '[SRE] {{ $labels.tenant }} disk recipe inert — volume-stats\
    \ absent{{ with $labels.da_cluster }} in cluster {{ . }}{{ end }}. Check in order:\
    \ (1) tenant mounts no PVC (most common, tenant-side); (2) kubelet volume-stats\
    \ scrape job (series keep their `namespace`); (3) CSI NodeGetVolumeStats support\
    \ (kind''s default local-path does not).'\n      platform_summary_zh: '[SRE] 租戶\
    \ {{ $labels.tenant }} disk recipe inert — volume-stats 缺席{{ with $labels.da_cluster\
    \ }}（叢集 {{ . }}）{{ end }}。依序查:(1) 租戶根本沒掛 PVC(最常見、屬租戶端);(2) kubelet volume-stats\
    \ scrape job 是否存在、序列是否保留 `namespace`;(3) CSI 是否實作 NodeGetVolumeStats(kind 預設 local-path\
    \ 不實作)。'\n      runbook_url: '{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})`\
    \ $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end\
    \ }}'\n      summary: Disk alert declared but no disk data is visible for {{ $labels.tenant\
    \ }}{{ with $labels.da_cluster }} in cluster {{ . }}{{ end }}\n      summary_zh:\
    \ 已設定磁碟告警，但偵測不到 {{ $labels.tenant }}{{ with $labels.da_cluster }} 在叢集 {{ . }}{{\
    \ end }} 的磁碟資料\n      tier: '{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})`\
    \ $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}'\n\
    - name: kubernetes-node-health\n  rules:\n  - record: tenant:node_owner:info\n\
    \    expr: \"max by(node, tenant, da_cluster) (\\n  label_replace(\\n    kube_pod_info{namespace=~\\\
    \"db-.+\\\"}\\n    and on(namespace, pod, uid, da_cluster)\\n      (kube_pod_status_phase{phase=\\\
    \"Running\\\"} == 1),\\n    \\\"tenant\\\", \\\"$1\\\", \\\"namespace\\\", \\\"\
    (.*)\\\"\\n  )\\n)\\n\"\n  - record: rule_pack_kubernetes:node_not_ready:core\n\
    \    expr: \"(\\n  tenant:node_owner:info\\n  and on(node, da_cluster)\\n    (kube_node_status_condition{condition=\\\
    \"Ready\\\", status=\\\"true\\\"} == 0)\\n)\\n\"\n  - alert: NodeNotReady\n  \
    \  expr: 'rule_pack_kubernetes:node_not_ready:core\n\n      unless on(tenant)\n\
    \n      (user_state_filter{filter=\"maintenance\"} == 1)\n\n      '\n    for:\
    \ 3m\n    keep_firing_for: 10m\n    labels:\n      maintenance: mute\n      node:\
    \ '{{ $labels.node }}'\n      severity: warning\n      tenant: '{{ $labels.tenant\
    \ }}'\n    annotations:\n      description: A Kubernetes node hosting this tenant's\
    \ running pod(s) is NotReady; the workload may be rescheduled or unavailable.\n\
    \      description_zh: 承載此租戶運行中 Pod 的 Kubernetes 節點處於 NotReady 狀態；工作負載可能被重新調度或無法使用。\n\
    \      owner: '{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})`\
    \ $labels.tenant) }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}'\n\
    \      platform_summary: '[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})`\
    \ $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}]\
    \ {{ $labels.tenant }}: node {{ $labels.node }} NotReady — check node health /\
    \ pod rescheduling'\n      platform_summary_zh: '[{{ with query (printf `topk(1,\
    \ tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier\
    \ }}{{ end }}{{ end }}] {{ $labels.tenant }}: 節點 {{ $labels.node }} NotReady —\
    \ 請檢查節點健康 / Pod 重新調度'\n      runbook_url: '{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})`\
    \ $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end\
    \ }}'\n      summary: Kubernetes node {{ $labels.node }} NotReady — affects {{\
    \ $labels.tenant }}\n      summary_zh: Kubernetes 節點 {{ $labels.node }} NotReady\
    \ — 影響 {{ $labels.tenant }}\n      tier: '{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})`\
    \ $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}'\n\
    \  - record: rule_pack_kubernetes:node_readiness_flapping:core\n    expr: \"(\\\
    n  tenant:node_owner:info\\n  and on(node, da_cluster)\\n    (\\n      max by(node,\
    \ da_cluster) (\\n        changes(kube_node_status_condition{condition=\\\"Ready\\\
    \", status=\\\"true\\\"}[15m])\\n      ) > 2\\n    )\\n)\\n\"\n  - alert: NodeReadinessFlapping\n\
    \    expr: 'rule_pack_kubernetes:node_readiness_flapping:core\n\n      unless\
    \ on(tenant)\n\n      (user_state_filter{filter=\"maintenance\"} == 1)\n\n   \
    \   '\n    for: 15m\n    labels:\n      maintenance: mute\n      node: '{{ $labels.node\
    \ }}'\n      severity: warning\n      tenant: '{{ $labels.tenant }}'\n    annotations:\n\
    \      description: A Kubernetes node hosting this tenant's running pod(s) keeps\
    \ switching between Ready and NotReady; the workload on it is intermittently unreachable\
    \ and may be rescheduled.\n      description_zh: 承載此租戶運行中 Pod 的 Kubernetes 節點在\
    \ Ready 與 NotReady 之間反覆切換；其上的工作負載會間歇性無法連線，並可能被重新調度。\n      owner: '{{ with query\
    \ (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with\
    \ index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}'\n      platform_summary:\
    \ '[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant)\
    \ }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant\
    \ }}: node {{ $labels.node }} readiness flapping, more than 2 changes in 15m —\
    \ check kubelet / node network / node pressure'\n      platform_summary_zh: '[{{\
    \ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant)\
    \ }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant\
    \ }}: 節點 {{ $labels.node }} 就緒狀態反覆變動（15 分鐘內超過 2 次）— 請檢查 kubelet／節點網路／節點資源壓力'\n\
    \      runbook_url: '{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})`\
    \ $labels.tenant) }}{{ with index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end\
    \ }}'\n      summary: Kubernetes node {{ $labels.node }} readiness is flapping\
    \ — affects {{ $labels.tenant }}\n      summary_zh: Kubernetes 節點 {{ $labels.node\
    \ }} 的就緒狀態反覆變動 — 影響 {{ $labels.tenant }}\n      tier: '{{ with query (printf `topk(1,\
    \ tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with index . 0 }}{{ .Labels.tier\
    \ }}{{ end }}{{ end }}'\n- name: kubernetes-ha-replicas\n  rules:\n  - record:\
    \ rule_pack_kubernetes:ha_replicas_degraded:by_kind\n    expr: \"(\\n  max by(tenant,\
    \ workload_kind, da_cluster) (\\n    label_replace(\\n      label_replace(\\n\
    \        (\\n          kube_statefulset_status_replicas_ready{namespace=~\\\"\
    db-.+\\\"}\\n          < kube_statefulset_status_replicas{namespace=~\\\"db-.+\\\
    \"}\\n        )\\n        and on(namespace, statefulset, da_cluster)\\n      \
    \    (changes(kube_statefulset_status_replicas_updated{namespace=~\\\"db-.+\\\"\
    }[10m]) == 0)\\n        and on(namespace, statefulset, da_cluster)\\n        \
    \  (kube_statefulset_replicas{namespace=~\\\"db-.+\\\"} >= 2),\\n        \\\"\
    tenant\\\", \\\"$1\\\", \\\"namespace\\\", \\\"(.+)\\\"\\n      ),\\n      \\\"\
    workload_kind\\\", \\\"statefulset\\\", \\\"\\\", \\\"\\\"\\n    )\\n  )\\n  or\\\
    n  max by(tenant, workload_kind, da_cluster) (\\n    label_replace(\\n      label_replace(\\\
    n        (\\n          kube_deployment_status_replicas_available{namespace=~\\\
    \"db-.+\\\"}\\n          < kube_deployment_spec_replicas{namespace=~\\\"db-.+\\\
    \"}\\n        )\\n        and on(namespace, deployment, da_cluster)\\n       \
    \   (changes(kube_deployment_status_replicas_updated{namespace=~\\\"db-.+\\\"\
    }[10m]) == 0)\\n        and on(namespace, deployment, da_cluster)\\n         \
    \ (kube_deployment_spec_replicas{namespace=~\\\"db-.+\\\"} >= 2),\\n        \\\
    \"tenant\\\", \\\"$1\\\", \\\"namespace\\\", \\\"(.+)\\\"\\n      ),\\n      \\\
    \"workload_kind\\\", \\\"deployment\\\", \\\"\\\", \\\"\\\"\\n    )\\n  )\\n)\\\
    n\"\n  - alert: TenantHAReplicasDegraded\n    expr: 'max by(tenant, da_cluster)\
    \ (rule_pack_kubernetes:ha_replicas_degraded:by_kind)\n\n      unless on(tenant)\n\
    \n      (user_state_filter{filter=\"maintenance\"} == 1)\n\n      '\n    for:\
    \ 15m\n    labels:\n      maintenance: mute\n      severity: warning\n      tenant:\
    \ '{{ $labels.tenant }}'\n    annotations:\n      degraded_workload_kinds: '{{\
    \ range $i, $s := query (printf `rule_pack_kubernetes:ha_replicas_degraded:by_kind{tenant=%q,\
    \ da_cluster=%q}` $labels.tenant $labels.da_cluster) | sortByLabel `workload_kind`\
    \ }}{{ if $i }}, {{ end }}{{ $s.Labels.workload_kind }}{{ end }}'\n      description:\
    \ Your HA database has fewer ready replicas than desired — redundancy is reduced\
    \ or lost (at zero ready the workload is down, with a critical alert also firing).\
    \ A node/pod failure or a stuck reschedule is the usual cause; one more failure\
    \ could take the service down.\n      description_zh: 您的 HA 資料庫就緒副本數少於期望值 — 備援已降低或失去（就緒數為\
    \ 0 時工作負載已中斷，並應同時有 critical 告警）。通常成因是節點/Pod 故障或排程卡住；再壞一個就可能導致服務中斷。\n      owner:\
    \ '{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant)\
    \ }}{{ with index . 0 }}{{ .Labels.owner }}{{ end }}{{ end }}'\n      platform_summary:\
    \ '[{{ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant)\
    \ }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant\
    \ }}: ready replicas < desired on an HA set (≥2) — a replica is missing or not-ready.\
    \ A vanished or stuck-rescheduled pod is invisible to the value-based DB liveness\
    \ rules (#875), so this is the K8s-layer complement. Check kube_statefulset/deployment\
    \ status + node health / scheduling.'\n      platform_summary_zh: '[{{ with query\
    \ (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with\
    \ index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}] {{ $labels.tenant }}: HA 工作負載（≥2）就緒副本數\
    \ < 期望數 — 有副本消失或未就緒。消失或重排卡住的 pod 對 value-based DB 存活規則（#875）不可見，故為 K8s 層互補。請查\
    \ kube_statefulset/deployment 狀態 + 節點健康 / 排程。'\n      runbook_url: '{{ with query\
    \ (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant) }}{{ with\
    \ index . 0 }}{{ .Labels.runbook_url }}{{ end }}{{ end }}'\n      summary: HA\
    \ workload for {{ $labels.tenant }} is running with reduced redundancy\n     \
    \ summary_zh: '{{ $labels.tenant }} 的 HA 工作負載正以降級（失去備援）狀態運行'\n      tier: '{{\
    \ with query (printf `topk(1, tenant_metadata_info{tenant=%q})` $labels.tenant)\
    \ }}{{ with index . 0 }}{{ .Labels.tier }}{{ end }}{{ end }}'\n"
