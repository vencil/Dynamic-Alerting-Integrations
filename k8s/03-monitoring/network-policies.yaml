# Network Policies — restrict ingress & egress for monitoring components
# Apply after namespace creation: kubectl apply -f k8s/03-monitoring/network-policies.yaml
---
# Default deny all ingress AND egress in monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Prometheus: allow scraping from within monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
---
# Alertmanager: allow from Prometheus and config-reloader (same pod)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
        # maintenance-scheduler drives the silences API (/api/v2/silences) for
        # planned-maintenance windows. Its egress to 9093 was already allowed
        # (allow-maintenance-scheduler-egress) but this side was not — and a
        # NetworkPolicy connection needs BOTH ends, so every silence call was
        # dropped here. The CronJob pod is labelled
        # {app: dynamic-alerting, component: maintenance-scheduler}, so the
        # `app: prometheus` peer above never matched it. Failure mode was
        # silent-and-self-concealing: silences simply never appear, and the
        # alerts they were meant to suppress fire through the maintenance
        # window instead.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              component: maintenance-scheduler
      ports:
        - protocol: TCP
          port: 9093
---
# threshold-exporter: allow scraping from Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-threshold-exporter-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: threshold-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
# Grafana: allow from all within monitoring (for dashboard access)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
---
# kube-state-metrics: allow scraping from Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-state-metrics-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
---
# ── Egress policies ─────────────────────────────────────────
# Prometheus: needs to scrape all tenant namespaces + reach Alertmanager
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    # Scrape targets in tenant namespaces (mysqld-exporter 9104, threshold-exporter 8080)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9104
        - protocol: TCP
          port: 8080
    # Alertmanager
    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    # kube-state-metrics
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server (service discovery)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
---
# Alertmanager: only needs DNS (for webhook receivers) + loopback (config-reload)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Webhook receivers (HTTPS).
    #
    # ⚠️ THIS RULE ENCODES A TOPOLOGY: "Alertmanager's notification destinations
    # are EXTERNAL HTTPS endpoints". True for internet-connected deployments on
    # SaaS notifiers (and for the ADR-025 watchdog heartbeat, whose url_file
    # Secret the operator supplies). NOT true for air-gapped / internal-NOC
    # deployments — see the block below before assuming this rule is enough.
    #
    # ⚠️ The `except:` metadata-endpoint carve-out is CNI-DEPENDENT. ipBlock
    # except is longest-prefix-match, not set subtraction, and several CNIs have
    # shipped bugs here — if you rely on it as a control, verify it on YOUR CNI
    # rather than trusting this line.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32  # Block cloud metadata endpoint
      ports:
        - protocol: TCP
          port: 443
    #
    # ── AIR-GAPPED / IN-CLUSTER RECEIVER TOPOLOGY ────────────────────────────
    # In a disconnected install the rule above allows something nobody uses (no
    # internet to reach) and blocks everything people do use: the standard
    # bridges that translate Alertmanager webhooks into SNMP/SMS/Teams/ITSM all
    # listen on non-443 ports — sachet 9876, prom2teams 8089,
    # prometheus-webhook-snmp 9099, snmp_notifier 9464. (Prometheus' own port
    # registry allocates webhook receivers in 9100-9999; none use 443.) An
    # internal SMTP smarthost is 25/587. All of them are dropped here.
    #
    # NetworkPolicy rules are ADDITIVE — there are no deny rules, only allows
    # plus "selected but unmatched ⇒ implicitly denied". So you do NOT edit this
    # file: add your own policy alongside it. That also survives re-applying
    # this manifest, which an in-place edit would not.
    #
    # Prefer a selector over an ipBlock when the receiver runs in-cluster: pod
    # IPs are ephemeral, and a selector additionally gets checked by
    # tests/k8s/test_networkpolicy_symmetry.py (which cannot verify ipBlock
    # peers — there is no ingress side to look at).
    #
    #   apiVersion: networking.k8s.io/v1
    #   kind: NetworkPolicy
    #   metadata:
    #     name: allow-alertmanager-egress-noc
    #     namespace: monitoring
    #   spec:
    #     podSelector:
    #       matchLabels:
    #         app: alertmanager
    #     policyTypes:
    #       - Egress
    #     egress:
    #       - to:
    #           - podSelector:
    #               matchLabels:
    #                 app.kubernetes.io/name: <your-webhook-bridge>
    #         ports:
    #           - protocol: TCP
    #             port: <bridge port, e.g. 9876>
    #
    # Replacing the 0.0.0.0/0:443 rule above with a precise destination is a net
    # TIGHTENING, not a relaxation — that rule is an opening, the protection
    # comes from default-deny-all. Doing so is recommended once you know your
    # receiver; keep 443 only if you genuinely reach an external HTTPS endpoint
    # (e.g. an internet-reachable dead-man's-switch).
    # ─────────────────────────────────────────────────────────────────────────
---
# Grafana: needs Prometheus data source + DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Egress
  egress:
    # Prometheus data source
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# kube-state-metrics: needs Kubernetes API server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-state-metrics-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes:
    - Egress
  egress:
    # Kubernetes API server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# threshold-exporter: only needs DNS (stateless, serves metrics)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-threshold-exporter-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: threshold-exporter
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# threshold-govern CronJob (#656): reach Prometheus (read observed-workload
# percentiles) + the tenant-api internal port 8080 (open per-tenant PRs) + DNS.
# Without this egress allow, the monitoring-ns default-deny-all blocks the Job
# and it silently no-ops (every Prometheus query fails → empty plan). This is
# ALSO the control the cron manifest's security note relies on: only this pod
# may reach tenant-api:8080 to inject a governance identity.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-threshold-govern-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      component: threshold-govern
  policyTypes:
    - Egress
  egress:
    # Prometheus (recommendation percentiles)
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # tenant-api internal port (8080) in the tenant-api namespace — open PRs.
    # Matching ingress: k8s/04-tenant-api/networkpolicy.yaml (monitoring ns → 8080).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tenant-api
          podSelector:
            matchLabels:
              app: tenant-api
      ports:
        - protocol: TCP
          port: 8080
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# maintenance-scheduler CronJob: creates Alertmanager silences for recurring
# maintenance windows (its core function). Reaches Alertmanager:9093 + DNS.
# Without this egress allow, the monitoring-ns default-deny-all blocks the Job
# and every silence call fails — the cron silently no-ops. (Pushgateway egress
# is intentionally omitted: the cron's --pushgateway flag is commented out; add
# a port-9091 rule here if it is enabled.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-maintenance-scheduler-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      component: maintenance-scheduler
  policyTypes:
    - Egress
  egress:
    # Alertmanager (create / expire silences)
    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
