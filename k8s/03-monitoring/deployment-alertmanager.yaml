apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          # ADR-025 D1 / #838: the watchdog-heartbeat receiver uses
          # webhook_configs[].url_file, which Alertmanager has supported for the
          # generic webhook since v0.26.0 (PR prometheus/alertmanager#3223). The
          # pin below (a current stable release) is well past that floor — keep any
          # future bump ≥ v0.26.0 so the heartbeat secret keeps loading.
          image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            # ⛔ 這裡曾有 `--web.enable-lifecycle`（#1243 移除）。**Alertmanager 沒有這個
            # flag**——那是 Prometheus 的；v0.33.1 實跑會 `unknown long flag` 直接退出，
            # 這個 Deployment 帶著它根本起不來。Alertmanager 的 `/-/reload` 是**無條件
            # 啟用**的（POST，GET 回 405），不需要任何 flag。
            # ⚠️ 安全注意：`/-/reload` 因此關不掉且無認證。生產環境用 NetworkPolicy 擋掉
            # **叢集內其他 Pod** 對 9093 的存取，或用 auth proxy 擋在前面。
            # ⛔ 別誤解 NetworkPolicy 的作用點：同 Pod 內的 config-reloader 走 loopback、
            # 共用同一個 network namespace，那段流量**不經 NetworkPolicy**（也不需要）——
            # NetworkPolicy 能保護的是 pod-to-pod，做不到「只放行本 Pod 內某個容器」。
            # ⚠️ 另一個常見誤解：Alertmanager **沒有 `/-/quit`**（v0.33.1 實測 404、行程續活），
            # 那同樣是 Prometheus 的端點——別把 Prometheus 的 lifecycle 威脅模型抄過來。
          ports:
            - containerPort: 9093
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
            # ADR-025 D1 / #838: the Watchdog dead-man's-switch URL (a secret —
            # embeds a token/UUID) is mounted here and referenced via the
            # watchdog-heartbeat receiver's url_file. Read-only; compatible with
            # readOnlyRootFilesystem (a separate volume mount, not the root fs).
            - name: watchdog-secret
              mountPath: /etc/alertmanager/secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: config-reloader
          # #1243: was ghcr.io/jimmidyson/configmap-reload:v0.15.0 — release-dormant
          # (last release 2025-04-09; CVE issues #188/#210 unanswered) and carrying 16
          # fixable Go-stdlib HIGHs. prometheus-operator's reloader is the maintained
          # equivalent (monthly cadence) and is a plain directory watcher: it builds NO
          # Kubernetes client and needs no CRD, RBAC or --config-file. Flag mapping:
          #   --volume-dir      -> --watched-dir   (repeatable)
          #   --webhook-url     -> --reload-url    (default is Prometheus' :9090 — MUST override)
          #   --webhook-method  -> dropped; the POST verb is hardcoded upstream
          # Net reduction in exposed surface: configmap-reload defaulted
          # `-web.listen-address` to :9533, whereas this one's --listen-address is
          # empty-by-default = metrics listener disabled, so the sidecar now opens NO
          # port at all. It also polls every 3m by default (--watch-interval) as a
          # backstop for fsnotify, which configmap-reload had no equivalent of.
          image: quay.io/prometheus-operator/prometheus-config-reloader:v0.93.1@sha256:428f088fe6fe07ab138bda92113664b04848a1dc408e4d3680a60ecdb55d1a65
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--watched-dir=/etc/alertmanager"
            - "--reload-url=http://localhost:9093/-/reload"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
        # ADR-025 D1 / #838: external dead-man's-switch URL (
        # secret-watchdog-heartbeat.yaml). optional:true so Alertmanager still starts if the
        # Secret has not been applied yet — the heartbeat then fails to egress and
        # AlertmanagerWebhookNotificationsFailing fires, rather than taking the
        # whole alerting plane down on a missing Secret.
        - name: watchdog-secret
          secret:
            secretName: watchdog-heartbeat
            optional: true
