# Pod Security Standards (#1018): every app-tier namespace ENFORCES restricted.
# - enforce-version is the minor of the kind node image
#   (scripts/ops/kind-node-image.env), so an apiserver upgrade does not tighten
#   the profile under running workloads unannounced.
# - warn/audit stay on the unpinned (latest) form on purpose: they report drift
#   against the newest standard before it is enforced.
# - Held by tests/pss (TestLabNamespacesEnforce): every namespace here enforces,
#   at restricted unless a chart of the same name declares a weaker level in
#   its Chart.yaml (only `vector`), at that pinned version.
apiVersion: v1
kind: Namespace
metadata:
  name: db-a
  labels:
    purpose: database
    instance: db-a
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: db-b
  labels:
    purpose: database
    instance: db-b
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    purpose: monitoring
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
