# tenant-api Helm values
# Reference: ADR-009 — Tenant Manager CRUD API Architecture

# ⛔ PR/MR write-back modes (--write-mode pr-github / pr-gitlab, ADR-011)
# require replicaCount=1. The pending-PR dedup (per-tenant "one open PR at a
# time") is enforced by an in-memory tracker + claim that is per-process — it
# does NOT coordinate across pods, so >1 replica can open duplicate PRs for the
# same tenant. The default `direct` write mode is unaffected. See #615 and
# internal/platform/tracker.go (ClaimTenant).
# ⛔ replicaCount=1 alone is NOT enough: the Deployment pins `strategy: Recreate`
# so a rollout doesn't surge a second Ready pod that overlaps the old one as a
# phantom writer (see deployment.yaml + #677 / TRK-324). Raising replicaCount
# without cross-pod write coordination (K8s Lease) reintroduces the breach.
replicaCount: 1

image:
  repository: ghcr.io/vencil/tenant-api
  # tag 留空 → template 自動推導為 v<Chart.appVersion>（= published image）。需覆寫才設此值。
  tag: ""
  pullPolicy: IfNotPresent

# oauth2-proxy sidecar configuration. Always rendered: it is the pod's only
# oauth2-proxy and the only way to the API (ADR-027 §5); the former
# `oauth2Proxy.enabled` switch was removed (§6) and the schema refuses it.
oauth2Proxy:
  image:
    # renovate: datasource=docker depName=quay.io/oauth2-proxy/oauth2-proxy
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: "v7.15.6"
    # Pinned by digest (#902 L2); the nightly scan matrix must carry the same
    # ref. This is the deployment's only oauth2-proxy (ADR-027 §5).
    # ⛔ Digest is AUTHORITATIVE: `--set oauth2Proxy.image.tag=…` ALONE does NOT
    #    upgrade — k8s silently keeps running THIS digest. Also set
    #    oauth2Proxy.image.digest to the new tag's digest; do NOT clear it.
    #    Renovate (#902 L3) bumps tag + digest together.
    digest: "sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048"
    pullPolicy: IfNotPresent
  # ADR-027 §2, §10: oauth2-proxy runs with a structured config file
  # (--alpha-config) rendered from the values below (provider, header
  # injection, listener); the same file is mounted into tenant-api, which
  # reads from it which header carries email, groups and each claim
  # (templates/configmap-oauth2-proxy.yaml). No value written into that file
  # (provider, clientID, scope, oidcIssuerUrl, gitlabGroups, claimHeaders) may
  # hold '$': the render fails. Values passed as flags (redirectUrl, cookie*)
  # are not in the file and not checked here.
  # Provider: github | google | oidc | gitlab
  provider: github
  # ⛔ Replace before deploying: the OAuth client ID, like the placeholder
  # Secret's values (createSecret below). It is written into the config file
  # (a ConfigMap — the client ID is not a secret; it is in every login
  # redirect). Since ADR-027 §10 the OAUTH2_PROXY_CLIENT_ID key of
  # secretName is no longer read; the client secret still comes from
  # secretName's OAUTH2_PROXY_CLIENT_SECRET key, mounted as a file into
  # oauth2-proxy only. An empty value fails the render.
  clientID: "REPLACE_WITH_CLIENT_ID"
  # Extra identity claims: claim name → the header oauth2-proxy injects it
  # in, e.g. {org: X-Auth-Request-Org}. The claim name is what _rbac.yaml's
  # match.claims and org-scope refer to. oauth2-proxy strips any client copy
  # of each header before injecting it. Only OIDC-type providers (oidc,
  # gitlab) have extra claims; the github provider has none (ADR-027 §7).
  # email and groups are always injected (X-Forwarded-Email,
  # X-Forwarded-Groups) and must not be listed. A header name uses letters,
  # digits and single '-'; tenant-api refuses to start otherwise.
  claimHeaders: {}
  # OIDC issuer URL — REQUIRED for `provider: oidc` and `provider: gitlab`
  # (self-hosted GitLab CE: the bare instance URL, e.g. https://gitlab.acme.internal).
  # Empty (default) → github provider, flag not rendered. See docs/integration/gitlab-ce-sso.md.
  oidcIssuerUrl: ""
  # OAuth scope. GitLab CE: "openid profile email" (groups come from /oauth/userinfo
  # under `openid`; `read_api` is only needed for --gitlab-group project filtering).
  # Empty → oauth2-proxy provider default.
  scope: ""
  # Optional GitLab group restriction (--gitlab-group, repeatable). Full paths, e.g.
  # ["acme/sre", "acme/dba"]. Empty → no group restriction at the proxy (RBAC still
  # enforced by rbac._rbacYaml). GitLab provider only.
  gitlabGroups: []
  # Session lifetime / refresh — revocation-lag guard: groups are resolved at login and
  # cached in the session cookie, so a user removed from a group keeps access until the
  # cookie expires. Shorten for tighter revocation. Empty → oauth2-proxy defaults.
  cookieExpire: ""   # e.g. "4h"
  cookieRefresh: ""  # e.g. "1h" (must be < cookieExpire)
  # Redirect URL must match the registered OAuth2 app callback URL.
  # Set to your actual Ingress host.
  redirectUrl: "http://tenant-api.example.com/oauth2/callback"
  # Accept all email domains — restrict further via rbac._rbacYaml groups.
  emailDomain: "*"
  # Cookie settings
  cookieSecure: true  # Requires HTTPS; set false only for local dev
  cookieHttpOnly: true
  # One of "", lax, strict, none — lower case: oauth2-proxy v7.15.5 refuses
  # any other spelling at start (the earlier default "Lax" did).
  cookieSameSite: "lax"
  cookieName: "_tenant_api_session"
  # Set to false to skip creating the placeholder Secret
  # (use this in production with externally managed secrets)
  createSecret: true
  # Secret name (must be pre-created; see secret-oauth2proxy.yaml template).
  # Keys read: OAUTH2_PROXY_COOKIE_SECRET, OAUTH2_PROXY_CLIENT_SECRET.
  secretName: oauth2-proxy-secrets

# tenant-api application settings
# ADR-027 §5: the portal's static files, served from a container in this pod
# behind oauth2-proxy's "/" upstream (the API is /api/ → tenant-api's Unix
# socket). The container listens on the
# pod's loopback only and runs the chart's nginx config, which forwards
# nothing (templates/_helpers.tpl tenant-api.portalNginxConfig).
portal:
  image:
    # The portal release line (portal/v*): `bump_docs.py --portal` rewrites
    # this tag at release time (two-line repository/tag pin), as
    # `--tools` does generator.image. A first-party image, so not Renovate's.
    repository: ghcr.io/vencil/da-portal
    tag: "v2.9.0"
    # Optional digest pin. Empty = tag only. ⛔ When set, the digest is what
    # runs: `--set portal.image.tag=…` alone would not change the image.
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

tenantApi:
  listenAddr: ":8080"
  reloadInterval: "30s"
  # Git committer identity for commit-on-write audit trail.
  # Author comes from X-Forwarded-Email (oauth2-proxy).
  gitCommitterName: "da-portal"
  gitCommitterEmail: "da-portal@dynamic-alerting.local"

  # git CLI per-command timeout (#630). Empty → binary default (60s). Every write
  # holds a process-wide lock while git runs; a hung `git push` (degraded on-prem
  # forge / network microcut) would otherwise freeze ALL tenant writes until it
  # returns. The binary bounds each git invocation and releases the lock on timeout.
  # Raise for a slow on-prem GitLab (Go duration string, e.g. "90s"); read as
  # TENANT_API_GIT_TIMEOUT. Emitted only when set, so a default upgrade is a no-op.
  gitTimeout: ""

  # In-lock base fetch timeout (TRK-318 / ADR-023 §2). Empty → binary default (5s).
  # Before each PR write, tenant-api runs `git fetch --prune origin <base>` INSIDE
  # the write lock to anchor the branch on the freshest origin/<base> — otherwise a
  # long-lived pod branches from a base that went stale after a remote merge and
  # silently rolls back a shared file (_groups.yaml / _views.yaml) another tenant
  # already merged. Kept DELIBERATELY separate from (and far more aggressive than)
  # gitTimeout: the fetch holds the global lock, so a degraded forge must fast-fail
  # to 503 in seconds, not the full git timeout. Read as TA_GIT_FETCH_TIMEOUT
  # (Go duration, e.g. "5s"). Emitted only when set, so a default upgrade is a no-op.
  gitFetchTimeout: ""

  # Write-plane load-shedding queue depth (TRK-320 / ADR-023 §3). Empty → binary
  # default (5). The write plane is a single writer; this bounds how many writes
  # may QUEUE behind the one in-flight write before further writes are shed with a
  # 503 + Retry-After (instead of piling up unbounded goroutines blocked on the
  # lock and running orphan writes after the client already timed out). Total
  # admitted = 1 in-flight + this. An explicit 0 IS valid and IS emitted (shed
  # everything past the single in-flight write) — the template gates on
  # `ne (toString .) ""`, not a plain `if`, so a numeric 0 isn't dropped as falsy.
  # Read as TA_WRITE_QUEUE_DEPTH (integer). Only the empty-string default skips it.
  writeQueueDepth: ""

  # HTTP server tuning (issue #144). Defaults match the binary's
  # hardcoded values pre-#144 so a default Helm upgrade is a no-op;
  # override only when an environment needs different headroom.
  # All four keys read by tenant-api as TA_* env vars (binary parses
  # malformed values back to the default and logs WARN at startup).
  server:
    timeouts:
      # Long-tail writes (PR-mode batch with N tenants × WritePR
      # commit latency) brushed up against 30s pre-PR-11; raise if
      # your deployment commits large batches.
      read: "15s"
      write: "30s"
      idle: "60s"
    # Request body size cap. 1 MiB fits even the largest realistic
    # tenant YAML (deeply-nested rule pack) with order-of-magnitude
    # headroom. Raise only for atypical payloads — a higher cap
    # widens the OOM blast radius of a single POST.
    maxBodyBytes: 1048576
    # #1722: the BATCH endpoints get a tighter, SEPARATE budget. Their body is
    # not merely held in memory — WritePRBatch takes the single-writer token
    # first and validates every operation twice inside it, and the group-batch
    # endpoint applies one patch to every member, so an oversize batch delays
    # every OTHER tenant's write, not just its own sender.
    # Sizing evidence is asserted by TestRealisticBulkBatchFitsTheBudget rather
    # than quoted here; no figure in this file is a source of truth.
    maxBatchBodyBytes: 262144
    # #1722: pre-parse ceiling on ONE tenant document. yaml.v3 cost grows faster
    # than size in the number of keys in a single mapping, and this parse happens
    # while the write lock is held — so the cap bounds cross-tenant write latency
    # rather than memory. Sizing evidence lives in
    # TestRealTenantFilesAreNowhereNearTheCap / TestCapClearsTheRecipeCeiling.
    # ⚠️ It measures the document the write path PARSES: on the merged (batch /
    # patch) paths that is the whole merged FILE, so a tenant sharing a very
    # large flat conf.d file can be refused for a small patch — raise this or
    # split the file.
    maxTenantDocBytes: 65536
  # #143: SSE (/api/v1/events) per-client liveness. Defaults match the binary
  # built-in (heartbeat 25s / write 10s / max-lifetime disabled), so a default
  # upgrade is a no-op. Read as TA_SSE_* env (malformed → default + WARN).
  sse:
    # heartbeat MUST stay below the smallest downstream proxy/LB idle timeout
    # (commonly 30s) AND is load-bearing for stuck-client detection — setting
    # it to "0s" re-opens the idle-stuck-client goroutine leak this closes.
    heartbeat: "25s"
    # per-write deadline: a stuck/half-open client's write unblocks the serving
    # goroutine after this. "0s" disables it (not recommended).
    writeTimeout: "10s"
    # optional hard max connection lifetime cap (defense-in-depth). "0s" = off.
    maxLifetime: "0s"

# conf.d volume: holds tenant YAML files and the git repository.
# For production, set type=pvc and provide a storageClass.
# A repository already on a node (kind dev, single-node, a host-side `git pull`):
# put it on a PersistentVolume — a local or hostPath PV, its directory owned by
# podSecurityContext.runAsUser (fsGroup does not apply to host directories) —
# bind a PVC to it and name it in pvc.existingClaim. The pod itself then needs
# no hostPath and stays within Pod Security `restricted`.
confDir:
  # type: emptyDir | pvc   (hostPath was removed in #1018: the render fails with
  # these migration steps if it is still set)
  type: emptyDir
  hostPath: ""        # removed (#1018); must stay empty
  pvc:
    storageClass: ""
    size: 1Gi
    accessMode: ReadWriteOnce
    # Use this PVC instead of creating <name>-conf (the chart then creates none).
    # Needs type: pvc — with any other type the render fails rather than
    # ignoring it. Moving an install that used the chart's own PVC: that PVC is
    # kept (helm.sh/resource-policy: keep) and stops being managed, with the
    # repository still in it — point existingClaim at <name>-conf to keep using
    # it, or move the data and delete it yourself.
    existingClaim: ""

# Git repository to clone on startup (optional for `direct`; required for the
# PR modes, and then it must be an https:// URL). Leave empty to skip the init
# container (use a pre-populated PVC instead, see confDir). Do not put
# credentials in this URL: it is stored in a ConfigMap. Credentials for a
# private repo come from writeBack.token, offered only to this URL's host.
# tenant-api refuses to start (and to write) while the repository's git config
# — or a global / system one, or GIT_CONFIG_* in its env — names a filter,
# diff or merge driver (filter.*.clean/smudge/process, diff.*.textconv/command,
# merge.*.driver): a repository that needs git-lfs or git-crypt cannot be
# served (#3175; docs/api/tenant-api-hardening.md §3.11).
gitRepoUrl: ""

# Where writes go (#2855). ⛔ REQUIRED — the chart refuses to render until
# `writeBack.mode` is set, because the choice decides whether a write ever
# reaches threshold-exporter.
#
#   pr-github / pr-gitlab — each write opens a PR/MR on your config repo. After
#     merge, your GitOps pipeline builds the threshold-config ConfigMap that
#     threshold-exporter reads (docs/integration/gitops-deployment.md). This is
#     the production mode.
#   direct — each write is a commit in this pod's /conf.d only. It is never
#     pushed, never reaches threshold-exporter (which reads the threshold-config
#     ConfigMap, not this pod's tree), and with the default emptyDir confDir it
#     is gone on the next restart. Only for a throwaway trial install; requires
#     `directAcknowledgeNotDelivered: true`.
writeBack:
  mode: ""
  directAcknowledgeNotDelivered: false
  # Local branch the PR modes cut feature branches from (--git-base-branch).
  # Set it to your config repo's default branch.
  baseBranch: main
  github:
    repo: ""          # owner/repo (TA_GITHUB_REPO) — required for pr-github
    targetBranch: main  # branch the PRs target (TA_GITHUB_BASE_BRANCH)
    apiUrl: ""        # GitHub Enterprise API URL (TA_GITHUB_API_URL); empty = github.com
  gitlab:
    project: ""       # group/project or numeric id (TA_GITLAB_PROJECT) — required for pr-gitlab
    targetBranch: main  # TA_GITLAB_TARGET_BRANCH
    apiUrl: ""        # self-hosted GitLab URL (TA_GITLAB_API_URL); empty = gitlab.com
  # Existing Secret holding the forge token — required for the PR modes. The
  # same token opens the PR/MR through the API and authenticates `git clone` /
  # `git push` over HTTPS (git credential helper fed from the environment; the
  # token is never written to the URL, the ConfigMap or the disk). Scopes:
  # GitHub contents:write + pull_requests:write; GitLab api.
  token:
    secretName: ""
    secretKey: token

# RBAC configuration (_rbac.yaml content)
rbac:
  _rbacYaml: |
    groups:
      - name: platform-admins
        tenants: ["*"]
        permissions: [read, write, admin]

      - name: db-operators
        tenants: ["db-a-*", "db-b-*"]
        permissions: [read, write]

      - name: viewers
        tenants: ["*"]
        permissions: [read]

# ── Tenant federation (ADR-020 IV-2m, issue #519) ───────────────────────────
# Disabled by default. When enabled, tenant-api exposes
# /api/v1/federation/tokens so a tenant can mint short-lived RS256 JWTs and
# pull its own metric subset out to tenant-side infrastructure.
#
# Enabling on an existing deployment:
#   1. Generate the signing key — the private key never touches disk or git,
#      it streams straight from the pipe into etcd:
#        da-tools fed-key | kubectl apply -n <release-namespace> -f -
#      This creates Secret `tenant-federation-signing-key` and writes the
#      public JWKS to ./federation-jwks.json (feed that to federation-gateway).
#   2. helm upgrade <release> helm/tenant-api --set federation.enabled=true
#      The chart then pre-creates the (empty) token-store ConfigMap, adds the
#      get+update RBAC, mounts the signing-key Secret, and passes the three
#      --federation-* flags. tenant-api owns store.json at runtime; the chart
#      never templates THAT key (it templates only its own mount sentinel, see
#      store.sentinelKey), so `helm upgrade` cannot wipe live tokens.
# tenant-api's own records — groups, saved views, the federation whitelist
# and subsets, the AccountID registry — live in this ConfigMap, not in conf.d
# (#2856). The chart pre-creates it (kept on uninstall); tenant-api writes its
# keys. On the first start after upgrading, tenant-api copies any of these
# records still in conf.d into it; the conf.d copies are not read afterwards.
state:
  configMapName: tenant-api-state
  # The one key this chart templates into it (see configmap-state.yaml).
  sentinelKey: .chart-managed

federation:
  enabled: false

  # RS256 signing key. NOT created by this chart — generate it out-of-band
  # with `da-tools fed-key` (ADR-020 IV-2l) so the private key reaches etcd
  # straight off a pipe. These two values must match that Secret.
  signingKey:
    secretName: tenant-federation-signing-key
    secretKey: federation-signing-key.pem

  # Token record store. This chart pre-creates the ConfigMap (empty);
  # tenant-api populates store.json / revoked.txt at runtime. The name must
  # match the federation-gateway chart's revoked-set source.
  store:
    configMapName: tenant-federation-store
    # Mount sentinel key (#1316). The ONE key this chart writes into the store
    # ConfigMap, present from the first `helm install` and independent of whether
    # tenant-api has ever written a token. federation-gateway and
    # federation-reconciler each run a preflight init-container that looks for it:
    # finding it proves their `optional: true` ConfigMap volume actually resolved
    # THIS object, which the runtime keys cannot prove (their absence is also what
    # a legitimately fresh store looks like) and which Kubernetes will not tell
    # them either — a missing optional ConfigMap yields an empty directory, a
    # Ready pod and no event (#1313).
    #
    # ⛔ THE SAME STRING MUST BE SET IN BOTH CONSUMERS (federation-gateway's
    # `revokedSet.sentinelKey`, federation-reconciler's `store.sentinelKey`).
    # Three charts, three copies, no shared helper — the drift is pinned by
    # tests/helm/test_federation_store_sentinel_guard.py, not by convention.
    #
    # ⛔ It must NOT be `store.json` or `revoked.txt`: templating a runtime key
    # here would make every `helm upgrade` overwrite the live token store. The
    # template refuses to render in that case rather than trusting this comment.
    #
    # The leading dot is deliberate: the gateway mounts the WHOLE ConfigMap, and
    # a dot-prefixed key stays out of a plain `ls` of the mount, so the preflight
    # can use "are there any non-dot entries?" as its separate legacy-store test.
    sentinelKey: .chart-managed
    # Namespace the store ConfigMap is created in. EMPTY = this release's
    # namespace (the historical behaviour; existing installs are unaffected).
    #
    # ⛔ SET THIS when federation-gateway / federation-reconciler do NOT run in
    # tenant-api's own namespace. A ConfigMap is namespace-scoped and both of
    # them consume it as a projected VOLUME, so each can only resolve one in its
    # OWN namespace. The documented install paths put tenant-api in `tenant-api`
    # (docs/getting-started/for-platform-engineers.md) and both consumers in
    # `monitoring` (helm/federation-gateway/README.md) — under which the default
    # leaves the gateway with no revoked.txt at all. Its volume is
    # `optional: true`, so the pod starts clean and the Lua filter loads an
    # EMPTY revoked set: every revoked token is honoured until its TTL, with no
    # Kubernetes event to say so (#1313). Since #1316 the consumers' preflight
    # init-container does log it at pod start (and can be set to refuse to
    # start) — but that is a boot-time notification, not a continuous detector,
    # so getting this value right is still the actual fix.
    #
    # Only the ConfigMap moves — tenant-api's own POD stays in this release's
    # namespace, so helm/vector's evidence binding (`evidenceChannel.podNamespace`,
    # #1288/#1307) is unaffected: it binds the producer pod's namespace, not the
    # store's.
    #
    # ⚖️ TRADE-OFF, choose knowingly: mounting a ConfigMap as a volume needs NO
    # RBAC — only the ability to create a pod in that namespace. So wherever the
    # store lives, its contents are readable by whoever can create pods there,
    # and `monitoring` is a SHARED namespace (prometheus / grafana / alertmanager
    # / kube-state-metrics / CronJobs) — a wider set than tenant-api's own.
    # store.json holds opaque token_ids and expiries only (ADR-028 D3; the
    # signing key is a Secret and is NOT in here), so this is disclosure, not
    # privilege escalation — and the alternative is a revocation set the gateway
    # never reads at all. The reverse direction is equally valid: install the
    # gateway and reconciler INTO tenant-api's namespace instead and leave this
    # empty. Its cost is that the gateway's Prometheus scrape depends on it
    # living in `monitoring` (helm/federation-gateway/README.md).
    #
    # ⛔ CHANGING THIS ON A RUNNING DEPLOYMENT IS A DATA MOVE, NOT A SETTING
    # CHANGE. The chart only creates an EMPTY ConfigMap in the new namespace
    # (it templates only its own mount sentinel, never the runtime keys — see the
    # object's own comment), so the new object carries no revocations; the
    # old one stays put under `helm.sh/resource-policy: keep` and is then read by
    # nobody. tenant-api's store only verifies that the target object EXISTS, not
    # what is in it (`NewConfigMapStore` in
    # components/tenant-api/internal/federation/token/configmap_store.go), so it
    # comes up cleanly against an empty store — and every existing revocation is
    # gone, so already-revoked tokens are accepted again until their TTL. That is
    # precisely the un-revoke ADR-028 exists to detect, caused by the migration
    # itself.
    #
    # Move the data WITH the setting, in this order (no revocation gap):
    #   1. Copy the ConfigMap into the target namespace, carrying Helm's
    #      ownership metadata so the upgrade adopts it rather than colliding:
    #      annotations meta.helm.sh/release-name + meta.helm.sh/release-namespace
    #      and label app.kubernetes.io/managed-by=Helm. Keep its other
    #      annotations: `tenant-api.vibe/account-id-high-water` is the AccountID
    #      high-water mark (#2928), and a copy without it loses the check that
    #      stops an older registry from re-issuing AccountIDs.
    #   2. `helm upgrade` with the new value. Helm adopts the object and patches
    #      only the keys its manifest carries — the mount sentinel, never
    #      store.json / revoked.txt — so the copy survives.
    #   3. Verify the enforcement plane actually sees it — exec into a gateway pod
    #      and read /etc/revoked/revoked.txt.
    #   4. Only then delete the ConfigMap in the old namespace.
    # Doing step 2 before step 1 leaves a window in which revocations are not
    # enforced.
    #
    # A comment is not a control, so the chart also REFUSES to render that move
    # while the old object still holds data — see acknowledgeDataMove below.
    namespace: ""
    # Escape hatch for the data-move guard above. Leave false.
    #
    # When `namespace` points somewhere other than this release's namespace AND
    # the ConfigMap in this release's namespace still holds a `store.json`, the
    # render FAILS with the migration steps rather than silently stranding the
    # revocation set. Set true only when that old store is genuinely disposable
    # (e.g. a fresh install where the namespace was set wrongly once).
    #
    # The guard is a no-op under `helm template` (`lookup` has no cluster to
    # query), so CI renders and chart tests are unaffected; it fires on a real
    # `helm upgrade`, which is where the data is actually at risk.
    acknowledgeDataMove: false

  # Federation token lifetime, passed as --federation-token-ttl (Go duration).
  # Matches the binary default; with Posture B server-side revocation an
  # operator may safely raise this.
  tokenTTL: 4h

# ADR-027 §2, §6: tenant-api serves its API only on a pod-internal Unix socket
# (the oauth2-proxy sidecar's upstream); its path is fixed by the chart, so
# there is no key for it. `machineIdentity` and `humanSocket` are gone: the
# schema refuses both, so a values file that still sets them fails the render.

# Generator container (ADR-036 §3–§5, #2902, #2903): a da-tools sidecar
# running `da-tools generator-service`. tenant-api asks it before EVERY write
# that changes a conf.d file (--generator-socket): it judges the tree with the
# write applied with `generate-routes --validate --strict`, and only a pass is
# committed. It answers over a pod-internal Unix socket (no network port),
# reads the conf.d repository read-only, from git objects only, as the same
# uid as tenant-api (podSecurityContext below).
#
# ⛔ REQUIRED since #2903 — there is no switch. The chart refuses to render
# without what the container needs: podSecurityContext.runAsUser, and a git
# repository in conf.d (gitRepoUrl, or confDir.type pvc holding
# one; "git 為必要", ADR-036 §3). Without the container answering, every
# content-changing write is refused with 503 VALIDATOR_UNAVAILABLE; reads
# keep working.
#
# ⛔ IMAGE: the pin below (tools/v2.9.0) has NO `generator-service`
# subcommand — with it the container crash-loops, keeps the pod out of Ready
# and every write is refused. Until the next da-tools release (the tools/v*
# release after v2.9.0 ships it, and `bump_docs.py --tools` raises this pin
# with it), set generator.image to an image that ships generator-service. If
# generator.image.digest is set, the DIGEST is what runs: changing only the
# tag changes nothing — update (or clear) the digest too, and make both name
# an image that ships generator-service.
#
# ⚠️ The chart sets git's `gc.auto=0` on the conf.d repository (init
# containers git-clone / git-gc-off). Operational cost: git no longer packs or
# prunes loose objects on its own, so every tenant-api commit leaves its
# objects loose and the repository only grows. Reclaim space by hand in a
# maintenance window: scale the Deployment to 0 so nothing reads or writes the
# repository, run `git gc` on it (for a pvc conf.d, from a one-off
# pod mounting the same volume as the same uid; an emptyDir conf.d is cloned
# afresh on every pod start), then scale back to 1. Why it must not run by itself: the
# generator reads git objects of a base commit WHILE tenant-api commits, and
# an automatic gc repacking or pruning under that read is the race ADR-036 §3
# closes by turning it off.
#
# Body limits: the generator's --max-body-bytes / --max-inflight-body-bytes
# are derived from tenantApi.server.maxBodyBytes / maxBatchBodyBytes (raise
# those, the generator's follow; see _helpers.tpl generatorBodyArgs). The
# derivation sizes for what tenant-api RECEIVES; the files a batch produces
# can add up to more. Such a write is refused with 422 GENERATOR_REJECTED,
# reason too_large ("split the batch"), and nothing is written.
generator:
  # Same da-tools release line and tag as helm/federation-reconciler.
  # `bump_docs.py --tools` rewrites this tag at release time (two-line
  # repository/tag pin). ⚠️ Keep `tag:` explicit: check_image_pin_capability.py
  # reads it to verify the image contains generator-service, and registers
  # v2.9.0 (which does not) as an exemption that a capable release turns stale.
  image:
    repository: ghcr.io/vencil/da-tools
    tag: "v2.9.0"
    # Optional digest pin. Empty = tag only. ⛔ When set, the digest is what
    # runs: `--set generator.image.tag=…` alone would not change the image.
    digest: ""
    pullPolicy: IfNotPresent
  # ADR-036 §3: request = limit (512Mi, 1 CPU). The memory budget is the
  # resident service (~80Mi) plus one judgement process and one Go program it
  # starts (192Mi RLIMIT_DATA each). The render fails when requests and limits
  # differ; raise both together (and the service's --memory-limit-bytes) when
  # the parse cache outgrows the judgement budget.
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # --work-dir: a disk-backed emptyDir (also the container's /tmp) holding the
  # tree of the one judgement in flight and what the generator writes for it.
  # Disk, not Memory, because a tmpfs counts against the 512Mi above. 1Gi is
  # generous for one conf.d copy plus generated config; exceeding it evicts
  # the pod, so raise it with very large conf.d trees rather than lowering it.
  workDir:
    sizeLimit: 1Gi
  # Deployment-side policy file (ADR-036 §5, #2826): `allowed_domains` (and
  # optionally `min_generator_version`, and `shared_secrets` — the shared
  # Secrets a receiver's secretRef may name, #1560; each entry's `fields` lists
  # full field paths such as `api_url` or `http_config.basic_auth.password`,
  # a bare `http_config` makes the policy unusable since #1560 ⑤-b, see the
  # BYO integration guide §5) kept OUTSIDE the tenant repository, so
  # a user who can write to the repository cannot loosen it. The chart ships
  # no policy content: name an existing ConfigMap you manage and its key. Set,
  # it is mounted read-only into the generator (passed as --policy) and into
  # tenant-api at the same path (passed as TA_DEPLOY_POLICY: tenant-api checks
  # that the generator judged with the same file, by its hash, #2903). The
  # ConfigMap must exist: the pod does not start without it. An unusable
  # policy file refuses every content-changing write with 503
  # POLICY_UNAVAILABLE (tenant_api_policy_available 0); there is no escape
  # hatch (ADR-036 §5).
  policy:
    existingConfigMap: ""
    key: policy.yaml

# ── recipe-preview container (ADR-027 §5, #1040) ─────────────────────────────
# Answers POST /api/v1/tenants/{id}/recipe-preview ("would this recipe fire?")
# for tenant-api, over a Unix socket in the pod: tenant-api authorizes the
# caller on {id}, then asks it. No network port, no identity, no Kubernetes API
# access. Runs as the pod's uid: the service answers only a peer of its own uid
# (SO_PEERCRED), and tenant-api is that peer. Disabled, tenant-api answers the
# route with 503 PREVIEW_NOT_CONFIGURED; everything else is unaffected.
#
# ⛔ IMAGE: the recipe-preview image ships with the da-tools release (one
# `tools/v*` tag builds both, from one commit), so it carries the same bundled
# compiler (da-guard) as the generator above, which judges every write. Its
# tag is NOT set here: it follows generator.image.tag, the one pin
# `bump_docs.py --tools` rewrites. Set image.tag only to run a different image
# on purpose. The pin above (v2.9.0) predates this: no recipe-preview image
# exists for it, so the container cannot be pulled until the next tools
# release (check_image_pin_capability.py registers v2.9.0 as an exemption that
# release turns stale) — until then, run with recipePreview.enabled=false or
# point image.tag at an image you built.
recipePreview:
  enabled: true
  image:
    repository: ghcr.io/vencil/recipe-preview
    # Empty = generator.image.tag (see above).
    tag: ""
    # Optional digest pin. ⛔ Not inherited from generator.image.digest: the
    # two images differ. When set, the digest is what runs.
    digest: ""
    pullPolicy: IfNotPresent
  # The service's own limits. The request body limit is NOT here: tenant-api
  # checks the body it forwards against the service's default (64 KiB,
  # recipepreview.MaxRequestBytes), so the two cannot disagree.
  maxConcurrency: 4      # previews evaluated at once (each runs promtool)
  queueTimeout: 10       # seconds a request waits for a slot
  rateLimitPerMin: 30    # per tenant
  # Previews are rare and short (the compiler plus one promtool process); the
  # numbers the standalone recipe-preview chart shipped with.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

service:
  type: ClusterIP
  # Port 80 → oauth2-proxy (4180) — external traffic
  port: 80
  # Port 8080 → tenant-api directly — cluster-internal (Prometheus scrape)
  internalPort: 8080

# ServiceMonitor for a Prometheus Operator install (kube-prometheus-stack),
# #1595 D1b. Off by default: without the monitoring.coreos.com CRDs the object
# cannot be applied. On, it scrapes the same pod port as the raw
# `platform-components` job (the Service's api-internal port), with no
# jobLabel, so `job` is the Service name `tenant-api` in both modes.
serviceMonitor:
  enabled: false
  interval: 15s
  # Labels Prometheus's serviceMonitorSelector matches. kube-prometheus-stack's
  # default selector matches `release: <its Helm release name>`; the default
  # matches `da-tools operator-generate`. `release: null` drops it. A key the
  # chart's own labels set cannot be overridden (the render fails).
  labels:
    release: kube-prometheus-stack

# Ingress (disabled by default — configure per-environment)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tenant-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resource requests and limits
resources:
  tenantApi:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  oauth2Proxy:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  gitClone:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Pod security context (non-root)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  # ⛔ Keep fsGroup: the oauth2-proxy client-secret file is
  # mounted 0440 and oauth2-proxy (pod-level uid/gid) reads it through this
  # group; without it oauth2-proxy cannot read clientSecretFile and exits.
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# NetworkPolicy
# ⛔ enabled: false is FORBIDDEN and will fail `helm template`/`install`
# (GHSA-3g2h-rf85-5rrv). Port 8080 serves only /health, /ready and /metrics
# and answers identity headers with 400 (ADR-027 §2, §3); this policy keeps even
# that surface to the scrapers. It is a required control, not a toggle.
networkPolicy:
  enabled: true
  # Namespace that Prometheus is in (allowed to scrape internal port)
  prometheusNamespace: monitoring
  # Pod-level allow-list for the internal port (8080), which serves only
  # /health, /ready and /metrics (ADR-027 §3): the Prometheus scrapers. The
  # recipe-preview and da-portal entries are gone with the relay topology
  # (ADR-027 §5, §6); the schema refuses them. Change only if you relabel
  # Prometheus.
  internalPortAllow:
    # This repo's raw Prometheus (k8s/03-monitoring/deployment-prometheus.yaml).
    prometheus:
      app: prometheus
    # A Prometheus Operator / kube-prometheus-stack Prometheus (#1595 D1b): its
    # pods carry app.kubernetes.io/name=prometheus, not app=prometheus, so with
    # only the entry above a ServiceMonitor scrape of 8080 was refused wherever
    # the policy is enforced and every tenant-api platform alert went blind.
    # Same namespace scoping (prometheusNamespace) as every entry here.
    prometheusOperator:
      app.kubernetes.io/name: prometheus
  # Egress restriction (ADR-024 §3). DEFAULT false = egress stays
  # UNrestricted (the policy is Ingress-only), which is the historical
  # posture and lets tenant-api reach Prometheus (metric discovery),
  # the K8s API (federation ConfigMap store), the git forge (PR mode),
  # and DNS without enumeration.
  #
  # ⛔ Blast radius: setting egress.enabled=true flips the policy to
  # DENY-by-default for ALL outbound traffic — you MUST then allow every
  # destination tenant-api needs. The block below ships DNS + the
  # Prometheus discovery port (9090); your cluster's K8s API server and
  # git-forge egress are deployment-specific, so add them via extraEgress
  # before enabling, or tenant-api writes/federation will break.
  egress:
    enabled: false
    # Port tenant-api uses to query Prometheus for metric discovery.
    prometheusPort: 9090
    # Extra egress rules merged verbatim (K8s API 443, git forge, etc.).
    # Required when egress.enabled=true in a real cluster.
    extraEgress: []

# Prometheus scrape annotations. prometheus.io/port is not set here: the
# deployment template derives it from tenant-api.apiPort (#3483).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
