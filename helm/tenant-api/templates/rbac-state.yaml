# tenant-api's access to its state store (#2856): get + update on the one
# state ConfigMap. resourceNames pins the grant to that object — a
# compromised pod cannot enumerate or rewrite any other ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tenant-api.name" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ .Values.state.configMapName }}"]
    # get: statestore.NewConfigMap probes existence + every read.
    # update: the resourceVersion compare-and-swap write.
    # No create — configmap-state.yaml pre-creates it.
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tenant-api.name" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-api.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tenant-api.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tenant-api.name" . }}-state
