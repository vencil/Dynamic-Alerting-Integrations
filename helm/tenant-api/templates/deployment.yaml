{{- /*
  ADR-023 single-writer invariant — LAYER 1 (static enforcement).
  The write plane is a single writer: a per-process write lock + an in-memory
  pending-PR tracker (internal/platform/tracker.go) that do NOT coordinate
  across pods. Two replicas push to the same git working tree → tree corruption
  + silent data loss; two PR-mode replicas open duplicate PRs for one tenant.
  replicaCount MUST stay 1. Horizontal write scaling needs a K8s Lease
  (leader-election) — ADR-023 Deferred option A3, not a replicaCount bump.
*/ -}}
{{- include "tenant-api.writeBackGuard" . }}
{{- include "tenant-api.generatorGuard" . }}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail (printf "ADR-023 single-writer invariant violated: tenant-api replicaCount=%d but MUST be 1. The write plane has no cross-pod coordination; multi-replica writes corrupt the shared git tree. To scale writes, implement a K8s Lease (ADR-023 Deferred option A3) — do not raise replicaCount." (int .Values.replicaCount)) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenant-api.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate (not the default RollingUpdate) because tenant-api is a
  # single-writer by design: replicaCount=1 + an in-process write lock
  # and pending-PR tracker that do NOT coordinate across pods (see #615,
  # internal/platform/tracker.go). The default RollingUpdate surges a new
  # pod and waits for it to be Ready before terminating the old one, so a
  # rollout-restart / env-change deploy leaves two Ready pods both holding
  # their own write lock for tens of seconds — a phantom-replica window
  # where both push to the same git plane (emptyDir: dual-writer race;
  # RWO PVC: tree corruption / Multi-Attach stall). Recreate kills the old
  # pod before starting the new one, eliminating the overlap. Cost: a brief
  # deploy-time gap — not a regression, since replicaCount=1 already has no
  # read HA. Zero-downtime would need a K8s Lease (leaderelection) gating
  # /ready; deferred until a write deployment needs it (#677 / TRK-324).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tenant-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenant-api.labels" . | nindent 8 }}
      annotations:
        # Force rolling restart when RBAC config changes
        checksum/rbac: {{ include (print $.Template.BasePath "/configmap-rbac.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tenant-api.name" . }}
      # Always on since #2856: the state store (groups, views, federation
      # settings, AccountID registry) is a ConfigMap read through the
      # in-cluster API client. Federation's token store and machineIdentity's
      # TokenReview use the same client. The ServiceAccount disables automount
      # by default; the Role in rbac-state.yaml grants get+update on the state
      # ConfigMap only.
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      # ── Init: clone git repository (skipped if gitRepoUrl is empty) ──────────
      {{- /* #2903: the generator container is required, so gc.auto=0 is
           always set — by git-clone, or by git-gc-off when there is no
           gitRepoUrl. One of the two always runs. */}}
      {{- $gcOffInit := not .Values.gitRepoUrl }}
      initContainers:
      {{- if .Values.gitRepoUrl }}
        - name: git-clone
          image: alpine/git:v2.54.0@sha256:832b1cd1a271509f3d5272a1a62d4cb2ab1a53426ebde1f6c2cb7349f907dc6f
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              if [ -d /conf.d/.git ]; then
                git -C /conf.d pull --ff-only
              else
                git clone "$GIT_REPO_URL" /conf.d
              fi
              # ADR-036 §3 (#2902): the generator reads git objects of this
              # repository while tenant-api commits to it; automatic gc could
              # prune or repack them under its reads. The clone/pull status is
              # kept: a failed pull must still fail this init container.
              status=$?
              [ "$status" -eq 0 ] || exit "$status"
              git -C /conf.d config gc.auto 0
          env:
            - name: GIT_REPO_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tenant-api.name" . }}-config
                  key: GIT_REPO_URL
            {{- include "tenant-api.gitCredentialEnv" . | nindent 12 }}
          volumeMounts:
            - name: conf-dir
              mountPath: /conf.d
          resources:
            {{- toYaml .Values.resources.gitClone | nindent 12 }}
      {{- end }}
      {{- if $gcOffInit }}
        # ADR-036 §3 (#2902): gc.auto=0 on a repository that is already in a
        # pvc / hostPath conf.d (no gitRepoUrl, so git-clone above does not run
        # and cannot set it). No repository yet = nothing to set: skipped, not
        # failed. Same pinned alpine/git image as git-clone — tools/v2.9.0's
        # da-tools image has no git, and a da-tools container running git is
        # an entry point check_image_pin_capability.py cannot verify.
        - name: git-gc-off
          image: alpine/git:v2.54.0@sha256:832b1cd1a271509f3d5272a1a62d4cb2ab1a53426ebde1f6c2cb7349f907dc6f
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              if [ -e /conf.d/.git ]; then
                git -C /conf.d config gc.auto 0
              else
                echo "git-gc-off: /conf.d holds no git repository; gc.auto not set (the generator container needs one, ADR-036 §3)"
              fi
          volumeMounts:
            - name: conf-dir
              mountPath: /conf.d
          resources:
            {{- toYaml .Values.resources.gitClone | nindent 12 }}
      {{- end }}

      containers:
        # ── Primary: tenant-api ────────────────────────────────────────────────
        - name: tenant-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # ADR-036 §12: every setting tenant-api reads from a TA_* variable
          # (envOrDefault / envBool / envNonEmptyOrDefault in cmd/server) is
          # passed in `env:` below, never as an arg, so a subcommand run in
          # this container with `kubectl exec ... tenant-api state show|restore`
          # or `config check` reads the same settings as the server. Only flags
          # with no TA_* counterpart stay args.
          # tests/helm/test_tenant_api_settings_are_env.py derives the TA_*
          # flag list from the Go source and fails on any such flag here.
          # A TA_* variable this image does not read stops it (exit 2, the
          # name printed: cmd/server/env_check.go), as an unknown flag does —
          # so a chart newer than its image fails loudly instead of having a
          # setting ignored. An image older than that check still ignores it.
          args:
            - --reload-interval={{ .Values.tenantApi.reloadInterval }}
          env:
            {{- include "tenant-api.taEnv" (list "TA_ADDR" .Values.tenantApi.listenAddr "tenantApi.listenAddr") | nindent 12 }}
            - name: TA_CONFIG_DIR
              value: "/conf.d"
            - name: TA_GIT_DIR
              value: "/conf.d"
            - name: TA_RBAC_PATH
              value: "/etc/rbac/_rbac.yaml"
            # #2855: always explicit — the chart used to pass none, so every
            # install ran direct. writeBackGuard (_helpers.tpl) rejects an
            # unset or incomplete writeBack before we get here.
            {{- include "tenant-api.taEnv" (list "TA_WRITE_MODE" .Values.writeBack.mode "writeBack.mode") | nindent 12 }}
            {{- if ne .Values.writeBack.mode "direct" }}
            {{- include "tenant-api.taEnv" (list "TA_GIT_BASE_BRANCH" .Values.writeBack.baseBranch "writeBack.baseBranch") | nindent 12 }}
            {{- end }}
            {{- if eq .Values.writeBack.mode "pr-github" }}
            {{- include "tenant-api.taEnv" (list "TA_GITHUB_REPO" .Values.writeBack.github.repo "writeBack.github.repo") | nindent 12 }}
            {{- include "tenant-api.taEnv" (list "TA_GITHUB_BASE_BRANCH" .Values.writeBack.github.targetBranch "writeBack.github.targetBranch") | nindent 12 }}
            {{- end }}
            {{- if eq .Values.writeBack.mode "pr-gitlab" }}
            {{- /* A numeric project id written in a values file is a float64
                 to helm, printed as 4.5678901e+07 from 1e6 up; print it as an
                 integer. */}}
            {{- $project := .Values.writeBack.gitlab.project }}
            {{- include "tenant-api.taEnv" (list "TA_GITLAB_PROJECT" (ternary (toString ($project | int64)) (toString $project) (kindIs "float64" $project)) "writeBack.gitlab.project") | nindent 12 }}
            {{- include "tenant-api.taEnv" (list "TA_GITLAB_TARGET_BRANCH" .Values.writeBack.gitlab.targetBranch "writeBack.gitlab.targetBranch") | nindent 12 }}
            {{- end }}
            {{- if .Values.rbac.metadataScopeEnforce }}
            # ADR-027 / LD-6 P1: flip the env/domain metadata scope filter from
            # SHADOW (default) to fail-closed — an unlabeled tenant on a
            # restricted rule is DENIED (hidden from the list). Flip ONLY after
            # increase(tenant_api_scope_would_deny_total{axis="metadata"}[soak])
            # has stayed 0 over the soak window (monotonic counter — a zero rate,
            # not an absolute-zero value) AND a scan confirms no still-unlabeled
            # tenant, mirroring the machineIdentity audit→enforce discipline.
            - name: TA_RBAC_METADATA_SCOPE_ENFORCE
              value: "true"
            {{- end }}
            {{- if .Values.rbac.metadataWriteScopeEnforce }}
            # ADR-027 / #1597: bind the env/domain metadata axis to the WRITE
            # plane too (before #1597 it constrained list visibility only, so a
            # rule scoped to one environment could still PUT a tenant in
            # another). Its OWN switch, not metadataScopeEnforce: that one flips
            # an already-bound axis, this one binds writes for the first time, so
            # sharing would tighten a list-plane-soaked deployment on upgrade
            # with no soak window. Flip ONLY after
            # increase(tenant_api_scope_would_deny_total{axis="metadata_write"}[soak])
            # has stayed 0 over the window — a non-zero rate names the real
            # writes this flip starts rejecting.
            - name: TA_RBAC_METADATA_WRITE_SCOPE_ENFORCE
              value: "true"
            {{- end }}
            {{- if .Values.rbac.orgScopeEnforce }}
            # ADR-027 / LD-6 P4: flip the org scope axis from SHADOW (default) to
            # fail-closed — ONE switch atomically enforces list visibility, write
            # authorization AND read-by-id (P4a+P4b+P4c) for org-scoped rules; no
            # split-brain. Flip ONLY after
            # increase(tenant_api_scope_would_deny_total{axis="org"}[soak]) AND
            # {axis="org_write"} BOTH stay 0 over the soak window (axis="org" now
            # covers list + read-by-id/collection reads — P4c closed the read
            # IDOR, #1040) plus a scan for still-unlabeled tenants. Ship
            # _tenant_orgs.yaml before the org-scoped _rbac.yaml rules.
            - name: TA_RBAC_ORG_SCOPE_ENFORCE
              value: "true"
            {{- end }}
            # ADR-036 §3–§5 (#2903): every content-changing write asks the
            # generator container on this socket before it commits; with a
            # deployment policy file, tenant-api reads the same file (same
            # path in both containers) to check that the generator judged
            # with it.
            {{- include "tenant-api.taEnv" (list "TA_GENERATOR_SOCKET" (include "tenant-api.generatorSocketPath" .) "tenant-api.generatorSocketPath") | nindent 12 }}
            {{- if .Values.generator.policy.existingConfigMap }}
            {{- include "tenant-api.taEnv" (list "TA_DEPLOY_POLICY" (include "tenant-api.generatorPolicyPath" .) "generator.policy (tenant-api.generatorPolicyPath)") | nindent 12 }}
            {{- end }}
            {{- if .Values.federation.enabled }}
            {{- $keyFile := .Values.federation.signingKey.secretKey }}
            {{- include "tenant-api.taEnv" (list "TA_FEDERATION_KEY" (ternary "" (printf "/etc/federation/%s" (toString $keyFile)) (empty $keyFile)) "federation.signingKey.secretKey") | nindent 12 }}
            {{- include "tenant-api.taEnv" (list "TA_FEDERATION_STORE" .Values.federation.store.configMapName "federation.store.configMapName") | nindent 12 }}
            # Always passed, never inferred. The binary would otherwise fall back
            # to the pod's own namespace, which silently disagrees with the
            # ConfigMap the chart just created whenever the two differ (#1313).
            {{- include "tenant-api.taEnv" (list "TA_FEDERATION_NAMESPACE" (include "tenant-api.federationStoreNamespace" .) "federation.store.namespace (tenant-api.federationStoreNamespace)") | nindent 12 }}
            {{- /* As a flag, a malformed TTL stopped the start; tenant-api
                 reads TA_FEDERATION_TOKEN_TTL leniently (warn + the 4h
                 default), so the render refuses one Go cannot parse. */}}
            {{- if not (regexMatch "^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$" (toString .Values.federation.tokenTTL)) }}
            {{- fail (printf "federation.tokenTTL %q is not a Go duration (e.g. 4h, 90m)" (toString .Values.federation.tokenTTL)) }}
            {{- end }}
            {{- include "tenant-api.taEnv" (list "TA_FEDERATION_TOKEN_TTL" .Values.federation.tokenTTL "federation.tokenTTL") | nindent 12 }}
            {{- end }}
            {{- if .Values.machineIdentity.enabled }}
            # ADR-027 machine-identity audit baseline — verify machine callers'
            # projected SA tokens via TokenReview and AUDIT (log+metric) only;
            # authz still runs on the oauth2-proxy hop headers. audit-only:
            # never blocks. The audience below is HARD-gated: TokenReview only
            # accepts a token whose audience list contains it, so an empty
            # audience would accept ANY SA token (incl. the default-audience
            # kube-apiserver token) — `required` fails the render loudly rather
            # than shipping that hole (ADR-027 G4).
            - name: TA_MACHINE_IDENTITY_AUDIT
              value: "true"
            {{- include "tenant-api.taEnv" (list "TA_MACHINE_IDENTITY_AUDIENCE" (required "machineIdentity.audience MUST be set (ADR-027 G4: empty audience = TokenReview accepts ANY SA token incl default-audience)" .Values.machineIdentity.audience) "machineIdentity.audience") | nindent 12 }}
            {{- end }}
            {{- if .Values.humanSocket.enabled }}
            # ADR-027 D2-B (GHSA-3g2h-rf85-5rrv L7 root-cause series): serve the
            # human plane on a pod-internal Unix socket that the oauth2-proxy
            # sidecar (below) targets as its upstream, so browser traffic never
            # touches the network 8080 plane. The socket lives on the human-sock
            # emptyDir mounted into both containers. audit-only impact: requests
            # over this listener are excluded from the machine-identity audit.
            {{- include "tenant-api.taEnv" (list "TA_HUMAN_SOCKET" .Values.humanSocket.path "humanSocket.path") | nindent 12 }}
            {{- end }}
            - name: TA_STATE_STORE
              value: "configmap"
            {{- include "tenant-api.taEnv" (list "TA_STATE_CONFIGMAP" .Values.state.configMapName "state.configMapName") | nindent 12 }}
            {{- if .Values.identity.claimHeaders }}
            # ADR-027 / LD-6 P2: named trusted-hop headers → principal claims
            # (identity.claimHeaders). Rendered as ONE value, keys sorted (helm
            # map range iterates key-sorted). Carriage-only in P2 — the binary
            # loads the named claims onto the verified principal; no authz
            # behavior changes until P3 match evaluation consumes them.
            {{- $pairs := list }}
            {{- range $k, $v := .Values.identity.claimHeaders }}
            {{- $pairs = append $pairs (printf "%s=%s" $k $v) }}
            {{- end }}
            {{- include "tenant-api.taEnv" (list "TA_IDENTITY_CLAIM_HEADERS" (join "," $pairs) "identity.claimHeaders") | nindent 12 }}
            {{- end }}
            {{- if eq .Values.writeBack.mode "pr-github" }}
            - name: TA_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.writeBack.token.secretName }}
                  key: {{ .Values.writeBack.token.secretKey }}
            {{- with .Values.writeBack.github.apiUrl }}
            {{- include "tenant-api.taEnv" (list "TA_GITHUB_API_URL" . "writeBack.github.apiUrl") | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.writeBack.mode "pr-gitlab" }}
            - name: TA_GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.writeBack.token.secretName }}
                  key: {{ .Values.writeBack.token.secretKey }}
            {{- with .Values.writeBack.gitlab.apiUrl }}
            {{- include "tenant-api.taEnv" (list "TA_GITLAB_API_URL" . "writeBack.gitlab.apiUrl") | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- include "tenant-api.gitCredentialEnv" . | nindent 12 }}
            - name: GIT_COMMITTER_NAME
              value: {{ .Values.tenantApi.gitCommitterName | quote }}
            - name: GIT_COMMITTER_EMAIL
              value: {{ .Values.tenantApi.gitCommitterEmail | quote }}
            {{- if .Values.tenantApi.gitTimeout }}
            # git CLI per-command timeout (#630) — bounds a hung git push so it
            # can't hold the write lock and freeze all tenant writes. Emitted only
            # when set; otherwise the binary's 60s default applies.
            - name: TENANT_API_GIT_TIMEOUT
              value: {{ .Values.tenantApi.gitTimeout | quote }}
            {{- end }}
            {{- if .Values.tenantApi.gitFetchTimeout }}
            # In-lock base fetch timeout (TRK-318) — bounds the `git fetch` that
            # anchors each PR write on the freshest origin/<base>. Separate from
            # (and more aggressive than) the regular git timeout so a degraded forge
            # fast-fails to 503 instead of pinning the write lock. Emitted only when
            # set; otherwise the binary's 5s default applies.
            {{- include "tenant-api.taEnv" (list "TA_GIT_FETCH_TIMEOUT" .Values.tenantApi.gitFetchTimeout "tenantApi.gitFetchTimeout") | nindent 12 }}
            {{- end }}
            {{- if ne (toString .Values.tenantApi.writeQueueDepth) "" }}
            # Write-plane load-shedding queue depth (TRK-320) — bounds writes
            # queued behind the single in-flight write; past it → 503 + Retry-After
            # instead of unbounded goroutine pileup. Emitted whenever SET (incl. an
            # explicit 0 = shed everything past the single in-flight write, which
            # the binary honours); only the empty-string default skips it. NB the
            # `ne (toString …) ""` gate — a plain `if` would treat numeric 0 as
            # falsy and silently drop a deliberate 0. Otherwise the binary's
            # default (5) applies.
            - name: TA_WRITE_QUEUE_DEPTH
              value: {{ include "tenant-api.intEnv" (list "tenantApi.writeQueueDepth" .Values.tenantApi.writeQueueDepth) }}
            {{- end }}
            # Server tuning (issue #144). The binary has working
            # defaults built in; emit env vars only when the chart
            # has them so a default deploy doesn't churn the env
            # block on every helm upgrade.
            {{- with .Values.tenantApi.server }}
            {{- with .timeouts }}
            {{- if .read }}
            {{- include "tenant-api.taEnv" (list "TA_READ_TIMEOUT" .read "tenantApi.server.timeouts.read") | nindent 12 }}
            {{- end }}
            {{- if .write }}
            {{- include "tenant-api.taEnv" (list "TA_WRITE_TIMEOUT" .write "tenantApi.server.timeouts.write") | nindent 12 }}
            {{- end }}
            {{- if .idle }}
            {{- include "tenant-api.taEnv" (list "TA_IDLE_TIMEOUT" .idle "tenantApi.server.timeouts.idle") | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if .maxBodyBytes }}
            - name: TA_MAX_BODY_BYTES
              value: {{ include "tenant-api.intEnv" (list "tenantApi.server.maxBodyBytes" .maxBodyBytes) }}
            {{- end }}
            {{- if .maxBatchBodyBytes }}
            - name: TA_MAX_BATCH_BODY_BYTES
              value: {{ include "tenant-api.intEnv" (list "tenantApi.server.maxBatchBodyBytes" .maxBatchBodyBytes) }}
            {{- end }}
            {{- if .maxTenantDocBytes }}
            - name: TA_MAX_TENANT_DOC_BYTES
              value: {{ include "tenant-api.intEnv" (list "tenantApi.server.maxTenantDocBytes" .maxTenantDocBytes) }}
            {{- end }}
            {{- end }}
            {{- with .Values.tenantApi.sse }}
            {{- if .heartbeat }}
            {{- include "tenant-api.taEnv" (list "TA_SSE_HEARTBEAT" .heartbeat "tenantApi.sse.heartbeat") | nindent 12 }}
            {{- end }}
            {{- if .writeTimeout }}
            {{- include "tenant-api.taEnv" (list "TA_SSE_WRITE_TIMEOUT" .writeTimeout "tenantApi.sse.writeTimeout") | nindent 12 }}
            {{- end }}
            {{- if .maxLifetime }}
            {{- include "tenant-api.taEnv" (list "TA_SSE_MAX_LIFETIME" .maxLifetime "tenantApi.sse.maxLifetime") | nindent 12 }}
            {{- end }}
            {{- end }}
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: conf-dir
              mountPath: /conf.d
            - name: rbac-config
              mountPath: /etc/rbac
              readOnly: true
            - name: git-tmp
              mountPath: /tmp
            {{- if .Values.federation.enabled }}
            - name: federation-signing-key
              mountPath: /etc/federation
              readOnly: true
            {{- end }}
            {{- if .Values.humanSocket.enabled }}
            # ADR-027 D2-B: shared dir for the human-plane Unix socket. tenant-api
            # binds+owns the socket here; the oauth2-proxy sidecar dials it.
            - name: human-sock
              mountPath: {{ dir .Values.humanSocket.path }}
            {{- end }}
            # ADR-036 §3 (#2902): the generator's socket directory. tenant-api
            # only dials the socket (--generator-socket, #2903), so read-only.
            - name: generator-sock
              mountPath: {{ include "tenant-api.generatorSocketDir" . }}
              readOnly: true
            {{- if .Values.generator.policy.existingConfigMap }}
            # ADR-036 §4/§5: the same deployment policy file the generator
            # judges with, at the same path; tenant-api hashes it
            # (--deploy-policy, #2903).
            - name: generator-policy
              mountPath: {{ include "tenant-api.generatorPolicyDir" . }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources.tenantApi | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

        # ── Sidecar: generator (ADR-036 §3, #2902; required since #2903) ─────
        # `da-tools generator-service` judges conf.d writes with
        # generate-routes --validate --strict over a Unix socket. No network
        # port. Runs as the pod's uid (no runAsUser here): git refuses a
        # repository another uid owns, so it must equal tenant-api's.
        - name: generator
          image: "{{ .Values.generator.image.repository }}:{{ .Values.generator.image.tag }}{{ with .Values.generator.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.generator.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The image's ENTRYPOINT dispatches `da-tools <subcommand>`.
          args:
            - generator-service
            - --socket={{ include "tenant-api.generatorSocketPath" . }}
            # tenant-api runs with --config-dir=/conf.d and --git-dir=/conf.d:
            # conf.d IS the repository root, so the config subdirectory inside
            # the repository is "" (the root). Change tenant-api's two flags
            # and these two must follow (pinned by
            # tests/helm/test_generator_container.py).
            - --repo=/conf.d
            - --config-subdir=
            - --work-dir={{ include "tenant-api.generatorWorkDir" . }}
            {{- if .Values.generator.policy.existingConfigMap }}
            - --policy={{ include "tenant-api.generatorPolicyPath" . }}
            {{- end }}
            {{- include "tenant-api.generatorBodyArgs" . | nindent 12 }}
          volumeMounts:
            - name: generator-sock
              mountPath: {{ include "tenant-api.generatorSocketDir" . }}
            - name: conf-dir
              mountPath: /conf.d
              readOnly: true
            - name: generator-work
              mountPath: {{ include "tenant-api.generatorWorkDir" . }}
            # Python's tempfile (the amtool check writes its config there)
            # needs a writable /tmp; the root filesystem is read-only. A volume
            # of its own, not a subPath of generator-work: kubelet creates a
            # missing subPath directory itself, possibly root-owned and not
            # writable by the pod's uid.
            - name: generator-tmp
              mountPath: /tmp
            {{- if .Values.generator.policy.existingConfigMap }}
            - name: generator-policy
              mountPath: {{ include "tenant-api.generatorPolicyDir" . }}
              readOnly: true
            {{- end }}
            # The pod mounts its ServiceAccount token into every container
            # (automountServiceAccountToken above). This container parses
            # content API users write and needs no Kubernetes API access, so
            # an empty directory shadows the token path: code execution here
            # does not become the tenant-api ServiceAccount.
            - name: generator-no-sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            {{- toYaml .Values.generator.resources | nindent 12 }}
          # The socket has no HTTP port, so the probes run a short python3
          # snippet (the image's interpreter; nothing added to the image) that
          # asks GET /v1/status over the socket and passes on a 200. It runs as
          # the container's uid, which the service's SO_PEERCRED check admits.
          # ⚠️ 200 means the service is up and answering; it does NOT require
          # status.ready (policy usable, amtool present): an unusable policy
          # must reject writes with 503 (ADR-036 §5), not take the whole pod —
          # reads included — out of the Service.
          startupProbe:
            {{- include "tenant-api.generatorProbe" . | nindent 12 }}
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            {{- include "tenant-api.generatorProbe" . | nindent 12 }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            {{- include "tenant-api.generatorProbe" . | nindent 12 }}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

        # ── Sidecar: oauth2-proxy ──────────────────────────────────────────────
        {{- if .Values.oauth2Proxy.enabled }}
        - name: oauth2-proxy
          image: "{{ .Values.oauth2Proxy.image.repository }}:{{ .Values.oauth2Proxy.image.tag }}{{ with .Values.oauth2Proxy.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.oauth2Proxy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --provider={{ .Values.oauth2Proxy.provider }}
            {{- with .Values.oauth2Proxy.oidcIssuerUrl }}
            - --oidc-issuer-url={{ . }}
            {{- end }}
            {{- with .Values.oauth2Proxy.scope }}
            - --scope={{ . }}
            {{- end }}
            {{- range .Values.oauth2Proxy.gitlabGroups }}
            - --gitlab-group={{ . }}
            {{- end }}
            {{- if .Values.humanSocket.enabled }}
            # ADR-027 D2-B: upstream is the pod-internal Unix socket, NOT the
            # network 8080 plane. oauth2-proxy dials the socket over the shared
            # human-sock volume; --flush-interval defaults to 1s, well below the
            # SSE 25s heartbeat, so /api/v1/events streaming is not buffered
            # (spike-verified against this exact oauth2-proxy digest).
            - --upstream=unix://{{ .Values.humanSocket.path }}
            {{- else }}
            - --upstream=http://localhost:8080
            {{- end }}
            - --http-address=0.0.0.0:4180
            - --redirect-url={{ .Values.oauth2Proxy.redirectUrl }}
            - --email-domain={{ .Values.oauth2Proxy.emailDomain }}
            - --pass-user-headers=true
            - --set-xauthrequest=true
            - --skip-auth-route=^/health$
            - --skip-auth-route=^/ready$
            - --cookie-secure={{ .Values.oauth2Proxy.cookieSecure }}
            - --cookie-httponly={{ .Values.oauth2Proxy.cookieHttpOnly }}
            - --cookie-samesite={{ .Values.oauth2Proxy.cookieSameSite }}
            - --cookie-name={{ .Values.oauth2Proxy.cookieName }}
            {{- with .Values.oauth2Proxy.cookieExpire }}
            - --cookie-expire={{ . }}
            {{- end }}
            {{- with .Values.oauth2Proxy.cookieRefresh }}
            - --cookie-refresh={{ . }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2Proxy.secretName }}
                  key: OAUTH2_PROXY_COOKIE_SECRET
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2Proxy.secretName }}
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2Proxy.secretName }}
                  key: OAUTH2_PROXY_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          {{- if .Values.humanSocket.enabled }}
          # ADR-027 D2-B: mount the shared human-sock dir so oauth2-proxy can dial
          # the Unix socket tenant-api binds. readOnly: the proxy only connects to
          # the socket, never creates files here (its rootfs stays read-only).
          volumeMounts:
            - name: human-sock
              mountPath: {{ dir .Values.humanSocket.path }}
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources.oauth2Proxy | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 5
        {{- end }}

      volumes:
        - name: conf-dir
          {{- include "tenant-api.confDirVolume" . | nindent 10 }}

        - name: rbac-config
          configMap:
            name: rbac-config

        - name: git-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi

        {{- if .Values.humanSocket.enabled }}
        # ADR-027 D2-B: pod-internal dir for the human-plane Unix socket. Memory-
        # backed (tmpfs) — the socket is an ephemeral pod-local rendezvous, never
        # persisted. Tiny: it holds one socket inode. Shared by tenant-api (binds)
        # and oauth2-proxy (dials); pod-level fsGroup 65534 makes it group-writable
        # to both.
        - name: human-sock
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}

        # ADR-036 §3 (#2902): the generator's socket directory. Memory-backed
        # and tiny (one socket inode). Mounted ONLY by the generator and
        # tenant-api — that mount is part of the service's trust boundary,
        # pinned by tests/helm/test_generator_container.py.
        - name: generator-sock
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # The generator's --work-dir: the tree being judged and
        # the generated config. DISK, not Memory — a tmpfs counts against the
        # container's memory limit, which ADR-036 §3 budgets for processes.
        - name: generator-work
          emptyDir:
            sizeLimit: {{ .Values.generator.workDir.sizeLimit }}
        # The generator's /tmp (disk-backed for the same reason).
        - name: generator-tmp
          emptyDir:
            sizeLimit: {{ include "tenant-api.generatorTmpSizeLimit" . }}
        - name: generator-no-sa-token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if .Values.generator.policy.existingConfigMap }}
        # ADR-036 §5: the deployment policy file, from a ConfigMap the operator
        # owns (the chart ships no policy content). Not optional: a missing
        # ConfigMap keeps the pod from starting rather than judging without
        # the allowlist.
        - name: generator-policy
          configMap:
            name: {{ .Values.generator.policy.existingConfigMap }}
            items:
              - key: {{ .Values.generator.policy.key }}
                path: policy.yaml
        {{- end }}

        {{- if .Values.federation.enabled }}
        # RS256 private key for signing federation tokens. defaultMode 0440 so
        # the fsGroup (65534, matching runAsGroup) can read it; the file owner
        # is root, so an owner-only mode would lock the non-root process out.
        - name: federation-signing-key
          secret:
            secretName: {{ .Values.federation.signingKey.secretName }}
            defaultMode: 0440
        {{- end }}
