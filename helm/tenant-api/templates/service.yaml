apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenant-api.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-api.labels" . | nindent 4 }}
    # Platform scrape discovery (#1425): kept by Prometheus'
    # `platform-components` job in any namespace (see
    # helm/threshold-exporter/templates/service.yaml).
    dynamic-alerting.io/scrape: platform
  annotations:
    prometheus.io/scrape: "true"
    # The POD port, not service.internalPort (#3483): see tenant-api.apiPort.
    prometheus.io/port: "{{ include "tenant-api.apiPort" . }}"
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tenant-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 4180
      protocol: TCP
    - name: api-internal
      port: {{ .Values.service.internalPort }}
      targetPort: {{ include "tenant-api.apiPort" . }}
      protocol: TCP
