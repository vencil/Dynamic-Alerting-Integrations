{{- /*
  ADR-027 §2, §10: the oauth2-proxy structured config file (--alpha-config).
  Provider, request-header injection and listener live here; the same file
  is mounted into the tenant-api container, which reads its
  injectRequestHeaders to know which header carries email, groups and each
  extra claim (TA_OAUTH2_PROXY_CONFIG). tenant-api refuses a file whose
  shape is ambiguous (internal/proxyconfig), so this template only renders
  the shape it accepts: one claimSource per header, no prefix, no fixed
  value, the client's copy stripped (oauth2-proxy's default).

  ⛔ No '$' anywhere in the file: oauth2-proxy expands environment
  references in it before parsing and tenant-api refuses a file holding one.
  Secrets stay out of it: the client secret is read from clientSecretFile
  (a Secret mounted into the oauth2-proxy container only), the cookie secret
  from the environment.

  CI runs `oauth2-proxy --config-test` on this render with the image digest
  values.yaml pins, and loads it with the same oauth2-proxy library version
  (tests/oauth2-proxy/, ADR-027 §9 item 9).
*/ -}}
{{- $config := include "tenant-api.oauth2ProxyConfig" . }}
{{- if contains "$" $config }}
{{- fail "oauth2Proxy: a value holds '$' — oauth2-proxy expands environment references in its config file and tenant-api refuses such a file (ADR-027 §2)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tenant-api.oauth2ProxyConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-api.labels" . | nindent 4 }}
# See tenant-api.oauth2ProxyConfigMap: immutable, renamed on every change.
immutable: true
data:
  {{ include "tenant-api.oauth2ProxyConfigKey" . }}: |
    {{- $config | nindent 4 }}
