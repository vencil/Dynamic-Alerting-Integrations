{{- /*
  Ingress (#2027). values.yaml carried a full `ingress:` block for a long time
  with no template reading it — `ingress.enabled: true` rendered nothing and
  `helm install` still exited 0.

  ⛔ The backend is HARD-WIRED to the Service's `http` port (80 → oauth2-proxy
  :4180) and is deliberately not configurable. The API is reachable only
  through oauth2-proxy, on the pod-internal Unix socket (ADR-027 §2, §3). The
  other Service port, `api-internal` (8080), serves only /health, /ready and
  /metrics and answers any identity header with 400; an Ingress pointed there
  would expose the probes and metrics to the internet and nothing else useful.

  The oauth2-proxy sidecar is always rendered (ADR-027 §5, §6: there is no
  switch to turn it off), so the `http` port always has a listener.
*/ -}}
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.enabled=true requires at least one entry in ingress.hosts: an Ingress with no rules and no default backend is rejected by the API server." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tenant-api.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-api.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- with .secretName }}
      secretName: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /* `--set ingress.hosts[0].host=x` replaces the whole list and drops
                 `paths`; the API server rejects an empty http.paths, so a host
                 given without paths serves `/` (Prefix). */}}
          {{- range (.paths | default (list (dict "path" "/" "pathType" "Prefix"))) }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "tenant-api.name" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
