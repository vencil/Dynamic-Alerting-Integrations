apiVersion: v2
name: tenant-api
description: Tenant Management API for the Dynamic Alerting Platform (ADR-009)
type: application
# version: Helm Chart 版本（隨 Chart 結構/模板變更升級）
# 2.9.8 — #902 L2: pin oauth2-proxy sidecar by digest (oauth2Proxy.image.digest)
# 2.9.9 — #902 L2 slice-2: pin the alpine/git init-container image by digest
# 2.9.10 — PR-0: oauth2-proxy GitLab CE OIDC enablement (--oidc-issuer-url/--scope/--gitlab-group)
# 2.9.11 — PR-1b-i: machine-identity audit baseline (opt-in tokenreviews ClusterRole + --machine-identity-audit, ADR-027)
# 2.9.12 — #1004: admit recipe-preview's /access probe on the port-8080 netpol (third pod-scoped allow entry)
# 2.9.13 — ADR-027 D2-B: opt-in humanSocket (oauth2-proxy UDS upstream) + da-portal as 4th port-8080 netpol allow entry
# 2.9.14 — ADR-027 / #962: opt-in rbac.metadataScopeEnforce (env/domain scope shadow→enforce flip; default shadow = no-op)
# 2.9.15 — ADR-027 / #962: opt-in identity.claimHeaders (named trusted-hop headers → principal claims; default empty = no-op)
# 2.9.16 — ADR-027 / #962: opt-in rbac.orgScopeEnforce (org scope shadow→enforce flip, atomic over list+write; default shadow = no-op)
# 2.9.17 — ADR-027 / #962 P4c: org scope now covers read-by-id (atomic over list+write+read); values/deployment enforce-note refreshed (comment-only, behavior unchanged)
# 2.9.18 — ADR-027 / #962 P7a: what-if dry-run audit endpoint (POST access-report/dry-run) + /me org_claim_keys (additive API surface, no template change)
# 2.9.19 — #1313: federation.store.namespace — let the token store live in its consumers' namespace (default empty = release namespace, unchanged)
# 2.9.20 — #1316: federation.store.sentinelKey — the store ConfigMap now carries ONE
#          chart-owned key (`.chart-managed`) so the gateway / reconciler preflight can
#          tell "my volume resolved this object" from "I mounted an empty directory".
#          store.json / revoked.txt are still never templated; verified on a real
#          cluster that upgrade, `--reuse-values` and rollback all leave them intact.
# 2.9.21 — ADR-027 / #1597: opt-in rbac.metadataWriteScopeEnforce (the env/domain
#          metadata axis on the WRITE plane, shadow->enforce). Deliberately a
#          SEPARATE value from rbac.metadataScopeEnforce: that one flips an axis the
#          list plane already binds, this one binds writes for the first time, so
#          sharing it would tighten writes the moment a list-plane-soaked deployment
#          upgrades. Default shadow = no-op.
# 2.9.22 — #2027: templates/ingress.yaml — the long-declared `ingress.*` values now
#          render an Ingress (default off = no-op). Backend is hard-wired to the
#          oauth2-proxy `http` port; render fails with oauth2Proxy.enabled=false.
# 2.9.23 — ADR-036 §3 / #2902: opt-in generator container (generator.enabled,
#          default false = no-op): da-tools generator-service on a pod-internal
#          socket, read-only conf.d, deployment policy ConfigMap, gc.auto=0.
# 2.9.24 — ADR-036 §3–§5 / #2903: the generator container is REQUIRED (no
#          generator.enabled): tenant-api gets --generator-socket (and
#          --deploy-policy with a policy ConfigMap); conf.d must hold a git
#          repository or the render fails. policy.unavailableOpen removed.
version: 2.9.24
# appVersion == version == release tag (#3228). release.yaml publishes the
# tenant-api image as `:v<version>` from the same commit as the chart, and the
# deployment defaults to `:v<appVersion>`, so the two must be the same number
# or the chart runs a binary older than its own templates. Move both with
# `bump_docs.py --tenant-api <ver>`; release.yaml's release-tenant-api job and
# tests/helm/test_image_tag_derivation.py fail when they differ.
appVersion: "2.9.24"
keywords:
  - dynamic-alerting
  - tenant-management
  - gitops
home: https://github.com/vencil/Dynamic-Alerting-Integrations
maintainers:
  - name: vencil
