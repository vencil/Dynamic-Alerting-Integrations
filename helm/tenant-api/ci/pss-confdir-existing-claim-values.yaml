# PSS gate value set (#1018): turns on every values path a workload template
# branches on, so tests/pss judges the pods those branches shape. A new
# if/with/range on .Values in a workload template needs a value here
# (TestWorkloadConditionalsAreExercised). Not a deployment example.
# A pvc conf.d on a claim the operator made (confDir.pvc.existingClaim) — the
# replacement for the removed hostPath conf.d: the pod mounts a PVC only, so it
# stays within `restricted` whatever PV backs the claim.
gitRepoUrl: ""
confDir:
  type: pvc
  pvc:
    existingClaim: tenant-api-conf-repo
writeBack:
  mode: direct
  directAcknowledgeNotDelivered: true
