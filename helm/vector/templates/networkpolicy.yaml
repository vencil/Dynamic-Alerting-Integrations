{{- /*
Ingress lockdown for the Vector pods (#1595 D2④).

Vector takes NO inbound traffic of its own: the kubernetes_logs source reads node
files, and the Vector API is disabled (configmap.yaml `api.enabled: false`). The
only listeners are the scrape ports — the self-telemetry exporter
(metrics.port, on by default) and, with tenantProjections, the projection-gate
verdict exposer (projectionGate.metrics.port). Both carry per-tenant data: the
self-telemetry series name every `vl_tenant_<accountId>` sink and its event
counts. So ingress is limited to the Prometheus that scrapes them; with no
scrape port rendered, ingress is denied outright (`ingress: []`).

Ingress only, on purpose: egress (VictoriaLogs sinks, syslog forwarders, the
Kubernetes API for kubernetes_logs) is deployment-specific and left open.
⚠️ Like every NetworkPolicy this only isolates on a CNI that enforces policy.
*/}}
{{- /* Nil-safe: `helm upgrade --reuse-values` from a pre-0.11.0 release carries
     no `networkPolicy` map at all. An ABSENT map takes the chart default (on,
     monitoring namespace) — never "off" and never "any namespace"; a present
     map is taken as written (so `scrapeNamespaceLabel: null` still means any). */}}
{{- $np := .Values.networkPolicy | default (dict "enabled" true "scrapeNamespaceLabel" (dict "kubernetes.io/metadata.name" "monitoring")) }}
{{- if $np.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vector.name" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vector.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or .Values.metrics.enabled .Values.tenantProjections }}
  ingress:
    # Prometheus scrape. scrapeNamespaceLabel null = any namespace
    # (`namespaceSelector: {}`).
    - from:
        {{- with $np.scrapeNamespaceLabel }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        {{- if .Values.metrics.enabled }}
        - protocol: TCP
          port: {{ .Values.metrics.port }}
        {{- end }}
        {{- if .Values.tenantProjections }}
        - protocol: TCP
          port: {{ .Values.projectionGate.metrics.port }}
        {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
