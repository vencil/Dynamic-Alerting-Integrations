# Vector unit tests — ADR-021 Phase 1 (b) tenant-sanitized projection / #609
#
# These tests are MERGED with the helm-rendered Vector config at `vector test`
# time, so they assert against the SAME transforms that ship (no VRL is
# duplicated here — drift-proof). They are NOT a standalone config.
#
# How to run (codifies runbook §4.4; CI runs the equivalent in
# tests/shared/test_vector_projection_vrl.py):
#
#   helm template vector ./helm/vector -n vector \
#     --set 'tenantProjections[0].tenantId=tenant-alpha' \
#     --set 'tenantProjections[0].accountId=1000' \
#     --set 'tenantProjections[1].tenantId=tenant-beta' \
#     --set 'tenantProjections[1].accountId=1001' \
#     | yq '.[] | select(.kind=="ConfigMap" and (.metadata.name|test("vector-config"))) | .data."vector.yaml"' \
#     > /tmp/rendered-vector.yaml
#   vector test /tmp/rendered-vector.yaml helm/vector/tests/projection_tests.yaml
#
# The fixture render MUST include tenantProjections for tenant-alpha→1000 and
# tenant-beta→1001, or the tenant_project / tenant_route transforms (and the
# t_1000 / t_1001 routes these tests reference) are not rendered.
#
# The mock events model what Vector's kubernetes_logs source produces: a raw
# `.message` string (the gateway's audit JSON, or Envoy operational text) plus
# a `.kubernetes.*` metadata blob. We insert_at `demux` so the full shipped
# VRL runs, then assert on:
#   - `demux`                 → the platform full copy (0:0) — what the
#                               primary `victorialogs` sink writes.
#   - `tenant_route.t_1000`   → tenant-alpha's sanitized partition.
#   - `tenant_route._unmatched` → the discard bucket (no sink consumes it):
#                               proof a row did NOT reach any tenant partition.
#
# The ADR-028 / #1234 evidence-channel cases at the bottom insert_at
# `origin_split` instead — the whole point of that group is the ROUTING
# decision, so they must run the route transform, not bypass it.

tests:
  # ── (i) NEGATIVE ASSERTION: sanitization actually REMOVES topology ────────
  # The whole point of (b): a tenant's projected copy must NOT carry infra
  # topology. Feed an audit row carrying EVERY sensitive field (both in the
  # JSON payload AND in the k8s metadata that demux promotes) and assert the
  # tenant copy has none of them — while the 0:0 copy keeps them. This tests
  # "removed", not merely "produced".
  # Seeded from the gateway's REAL json_format (envoy.yaml &audit_json:
  # tenant_id/token_id/account_id/method/path/query/status/upstream/
  # response_flags) PLUS injected attacker values — NOT from the keep-list, so
  # it actually exercises the leak surface. Sanitization is a fail-closed
  # ALLOWLIST: the tenant copy is rebuilt from tenantProjectionKeepFields only,
  # so upstream (the backend IP), infra naming, the raw .message, and payload-
  # injected account_id/log_event_id are all structurally absent.
  - name: "projection sanitizes via allowlist — upstream IP / infra naming / raw message / injected ids absent from tenant copy"
    inputs:
      - insert_at: demux
        type: log
        log_fields:
          message: '{"tenant_id":"tenant-alpha","token_id":"tok-abc","account_id":9999,"method":"GET","path":"/select/logsql/query","query":"_time:5m","status":200,"duration_ms":12,"upstream":"10.42.7.13:9428","response_flags":"-","log_event_id":"deadbeef-dead-7ead-8ead-deaddeaddead"}'
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: federation-gateway-7d9f-abcde
          kubernetes.pod_node_name: node-7
          kubernetes.pod_owner: ReplicaSet/federation-gateway-7d9f
    outputs:
      # 0:0 platform full copy KEEPS everything — upstream, raw line, k8s topology.
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              assert_eq!(.log_type, "federation_audit")
              assert_eq!(.tenant_id, "tenant-alpha")
              assert_eq!(.upstream, "10.42.7.13:9428", "0:0 keeps the backend IP")
              assert_eq!(.pod_node, "node-7", "0:0 keeps node hostname")
              assert_eq!(.k8s_namespace, "monitoring", "0:0 keeps namespace")
              assert!(is_string(.log_event_id), "0:0 carries log_event_id")
      # Tenant copy: ALLOWLIST only — infra gone, injected ids overridden.
      - extract_from: tenant_route.t_1000
        conditions:
          - type: vrl
            source: |
              # Trusted partition key — the GitOps map value, NOT payload 9999.
              assert_eq!(.account_id, 1000, "account_id is the map value, not payload-injected 9999")
              assert_eq!(.tenant_id, "tenant-alpha")
              # log_event_id is platform-owned (UUIDv7); payload value overwritten.
              assert!(.log_event_id != "deadbeef-dead-7ead-8ead-deaddeaddead", "payload log_event_id overwritten")
              assert!(match(to_string(.log_event_id) ?? "", r'^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'), "platform UUIDv7")
              # ── Infra topology / naming ABSENT (the leaks the allowlist closes) ──
              assert!(!exists(.upstream),      "LEAK: upstream backend IP (%UPSTREAM_HOST%)")
              assert!(!exists(.app),           "LEAK: app/container name")
              assert!(!exists(.k8s_namespace), "LEAK: platform namespace")
              assert!(!exists(.pod_node),      "LEAK: node hostname")
              assert!(!exists(.pod_name),      "LEAK: pod identity")
              assert!(!exists(.pod_ip),        "LEAK: pod IP")
              assert!(!exists(.pod_owner),     "LEAK: ReplicaSet owner")
              assert!(!exists(.host),          "LEAK: host")
              # Re-serialized _msg must NOT smuggle the backend IP as a string.
              assert!(!contains(to_string(.message) ?? "", "10.42.7.13"), "LEAK: upstream IP inside re-serialized message")
              # ── Tenant-safe allowlist fields KEPT ──
              assert_eq!(.status, "200")
              assert_eq!(.method, "GET")
              assert_eq!(.path, "/select/logsql/query")
              assert_eq!(.query, "_time:5m")
              assert_eq!(.token_id, "tok-abc")
              assert!(is_string(.log_event_id), "join key kept")

  # ── (iv) log_event_id is the SAME value in both copies ────────────────────
  # On-call joins a tenant's redacted row to the full 0:0 row by this id, so
  # the value must be identical across partitions, not re-generated per branch.
  - name: "log_event_id identical across 0:0 and tenant copy (join key)"
    inputs:
      - insert_at: demux
        type: log
        log_fields:
          message: '{"tenant_id":"tenant-alpha","status":200}'
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: federation-gateway-7d9f-abcde
          kubernetes.pod_node_name: node-7
          kubernetes.pod_owner: ReplicaSet/federation-gateway-7d9f
    outputs:
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              # uuid_v7 is time-sortable (high 48 bits = ms epoch). Assert the
              # textual form matches the v7 layout — the version nibble is the
              # '7' after the 2nd dash; a random v4 would have '4' there.
              # Value-equality across copies is structural: the id is set ONCE
              # in the shared demux stage (upstream of the fan-out), so both
              # branches inherit the SAME value — not re-generated per branch.
              assert!(is_string(.log_event_id))
              assert!(
                match(to_string(.log_event_id) ?? "",
                  r'^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'),
                "log_event_id must be a v7 (time-sortable) uuid, not v4/random"
              )
      - extract_from: tenant_route.t_1000
        conditions:
          - type: vrl
            source: |
              assert!(is_string(.log_event_id), "tenant copy carries the same join key field")
              assert!(
                match(to_string(.log_event_id) ?? "",
                  r'^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'),
                "tenant copy id is the v7 form too (survived sanitization unchanged)"
              )

  # ── (ii) FAIL-CLOSED: blank tenant_id → 0:0 only, no tenant partition ─────
  - name: "blank tenant_id is fail-closed (0:0 only, not in any tenant route)"
    inputs:
      - insert_at: demux
        type: log
        log_fields:
          message: '{"tenant_id":"","status":200,"path":"/x"}'
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: federation-gateway-7d9f-abcde
          kubernetes.pod_node_name: node-7
          kubernetes.pod_owner: ReplicaSet/federation-gateway-7d9f
    outputs:
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              assert_eq!(.log_type, "federation_audit")
              # The 0:0 copy still gets it (platform sees everything).
              assert!(is_string(.log_event_id))
    # The load-bearing fail-closed assertion: NOTHING from this input reaches
    # the tenant plane. _unmatched is the discard bucket; t_1000/t_1001 are the
    # tenant sinks. Asserting no output from ALL tenant-facing routes proves
    # the blank-tenant row cannot land in a tenant partition.
    no_outputs_from:
      - tenant_route.t_1000
      - tenant_route.t_1001

  # ── (ii') FAIL-CLOSED: unknown/forged tenant_id → 0:0 only ────────────────
  # A tenant_id not in tenantProjections (never onboarded, or a forged value)
  # must NOT be coerced into a partition — it has no AccountID, so it drops.
  - name: "unknown tenant_id is fail-closed (not mapped to any partition)"
    inputs:
      - insert_at: demux
        type: log
        log_fields:
          message: '{"tenant_id":"tenant-ZZZ-not-onboarded","status":200}'
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: federation-gateway-7d9f-abcde
          kubernetes.pod_node_name: node-7
          kubernetes.pod_owner: ReplicaSet/federation-gateway-7d9f
    outputs:
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              assert_eq!(.tenant_id, "tenant-ZZZ-not-onboarded", "0:0 keeps the row verbatim")
    no_outputs_from:
      - tenant_route.t_1000
      - tenant_route.t_1001

  # ── (ii'') FAIL-CLOSED: MISSING tenant_id field (key absent) → 0:0 only ───
  # Distinct from blank "": the audit JSON has NO tenant_id key at all. Whether
  # demux still classifies it federation_audit (then VRL coerces the absent
  # field via to_string(null) → "null" → not in tenantProjections → abort) or
  # classifies it as something else (eligibility gate aborts on log_type), the
  # row reaches NO tenant route. Pinned explicitly so a future change to the
  # blank-string check can't silently open a missing-field hole — the absent
  # and empty-string cases are separate code paths.
  - name: "missing tenant_id field is fail-closed (0:0 only)"
    inputs:
      - insert_at: demux
        type: log
        log_fields:
          message: '{"status":200,"path":"/select/logsql/query","token_id":"tok-xyz"}'
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: federation-gateway-7d9f-abcde
          kubernetes.pod_node_name: node-7
          kubernetes.pod_owner: ReplicaSet/federation-gateway-7d9f
    outputs:
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              # Reaches 0:0 regardless of how demux classifies it; the load-
              # bearing assertion is no_outputs_from below (tenant plane empty).
              assert!(is_string(.log_event_id), "0:0 still stamps the correlation id")
    no_outputs_from:
      - tenant_route.t_1000
      - tenant_route.t_1001

  # ── (iii) PARSE-ERROR / non-JSON payload → 0:0 only (Gemini 1c) ───────────
  # A line that isn't JSON becomes gateway_operational in demux. It is NOT
  # federation_audit, so the projection's eligibility gate drops it — it must
  # never reach a tenant partition even though it physically mentions a
  # tenant-looking token.
  - name: "non-JSON payload is fail-closed to 0:0 (parse-error path)"
    inputs:
      - insert_at: demux
        type: log
        log_fields:
          message: "upstream connect error or disconnect/reset before headers tenant_id=tenant-alpha"
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: federation-gateway-7d9f-abcde
          kubernetes.pod_node_name: node-7
          kubernetes.pod_owner: ReplicaSet/federation-gateway-7d9f
    outputs:
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              assert_eq!(.log_type, "gateway_operational", "non-JSON → operational, not audit")
              # 0:0 still receives operational lines (centrally queryable).
              assert!(is_string(.log_event_id))
    no_outputs_from:
      - tenant_route.t_1000
      - tenant_route.t_1001

  # ── (v) gateway_operational → 0:0 ONLY (never a tenant partition) ─────────
  # Even a perfectly-formed operational JSON (parse OK) that is NOT
  # federation_audit must stay platform-only. Here: a prometheus_query_log
  # shape (parse OK, has params.query) carrying a tenant — still platform-only
  # for the (b) projection, which is federation_audit-only.
  - name: "operational + query-log rows stay 0:0 only, never tenant partition"
    inputs:
      # gateway_operational (parse OK but not audit — explicit log_type via a
      # JSON the demux classifies as operational by failing parse is awkward,
      # so use the query-log shape which is a real non-audit parse-OK case).
      - insert_at: demux
        type: log
        log_fields:
          message: '{"params":{"query":"up{tenant=\"tenant-alpha\"}"},"ruleGroup":"platform","status":200}'
          kubernetes.container_name: prometheus
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: prometheus-5f8c-abcde
          kubernetes.pod_node_name: node-7
          kubernetes.pod_owner: ReplicaSet/prometheus-5f8c
    outputs:
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              assert_eq!(.log_type, "prometheus_query_log", "parse-OK non-audit shape")
    no_outputs_from:
      - tenant_route.t_1000
      - tenant_route.t_1001

  # ── multi-tenant routing isolation: alpha and beta never cross ────────────
  - name: "tenant-beta row routes to t_1001 only, never t_1000"
    inputs:
      - insert_at: demux
        type: log
        log_fields:
          message: '{"tenant_id":"tenant-beta","status":503}'
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: federation-gateway-7d9f-fghij
          kubernetes.pod_node_name: node-9
          kubernetes.pod_owner: ReplicaSet/federation-gateway-7d9f
    outputs:
      - extract_from: tenant_route.t_1001
        conditions:
          - type: vrl
            source: |
              assert_eq!(.account_id, 1001, "tenant-beta → AccountID 1001")
              assert_eq!(.tenant_id, "tenant-beta")
              assert!(!exists(.pod_node), "still sanitized")
    # Must NOT leak into tenant-alpha's partition.
    no_outputs_from:
      - tenant_route.t_1000

  # ══ ADR-028 D1 / #1234 — federation revocation EVIDENCE channel ═══════════
  # These insert_at `origin_split` (NOT demux) because the routing decision is
  # what is under test. The pod label is the split key and it is read from the
  # PRISTINE `.kubernetes.*` blob — before any payload deep-merge — so a log
  # producer cannot forge its own origin.

  # ── (E1) The channel actually carries FIELDS, not an opaque string ────────
  # This is the assertion that would have caught the fatal first-draft omission:
  # without `parse_json(.message)` + deep merge, VictoriaLogs stores exactly one
  # `message` string, the reconciler's field query `event:"..."` matches nothing,
  # and the ADR-028 detection plane returns zero rows while LOOKING wired up.
  - name: "ADR-028: tenant-api revocation event reaches the evidence stream as TOP-LEVEL fields"
    inputs:
      - insert_at: origin_split
        type: log
        log_fields:
          message: '{"time":"2026-07-26T09:00:00.123456789Z","level":"INFO","msg":"federation token revoked","event":"federation_token_revoked","token_id":"tok-abc","expires_at":"2026-07-26T13:00:00Z"}'
          'kubernetes.pod_labels."app.kubernetes.io/name"': tenant-api
          kubernetes.container_name: tenant-api
          kubernetes.pod_namespace: tenant-api
          kubernetes.pod_name: tenant-api-6c4f-abcde
          kubernetes.pod_node_name: node-3
    outputs:
      - extract_from: federation_evidence
        conditions:
          - type: vrl
            source: |
              # ⛔ LOAD-BEARING: the reconciler filters on the FIELD `event`
              # and reads top-level `token_id` / `expires_at`. If the merge is
              # ever removed these three assertions are the ones that go red.
              assert_eq!(.event, "federation_token_revoked", "`event` must be a TOP-LEVEL field, not buried inside .message")
              assert_eq!(.token_id, "tok-abc", "reconciler correlates on token_id")
              assert_eq!(.expires_at, "2026-07-26T13:00:00Z")
              # Platform-owned classification + promotion, taken from the
              # PRE-merge k8s locals.
              assert_eq!(.log_type, "federation_evidence")
              assert_eq!(.app, "tenant-api")
              assert_eq!(.k8s_namespace, "tenant-api")
              assert_eq!(.pod_name, "tenant-api-6c4f-abcde")
              assert!(!exists(.kubernetes), "raw k8s blob dropped once promoted (same as demux)")
              # Every row in this store carries the correlation id.
              assert!(
                match(to_string(.log_event_id) ?? "",
                  r'^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'),
                "evidence rows carry a platform UUIDv7 log_event_id like every other row"
              )
    # ⛔ ISSUE #1234 ACCEPTANCE CRITERION 3, pinned mechanically: a tenant-api
    # row must not land in ANY tenant projection partition. It cannot even reach
    # `demux` — which is what makes tenant_project's fail-closed gate a
    # structural guarantee here rather than a runtime branch we hope fires.
    no_outputs_from:
      - demux
      - tenant_route.t_1000
      - tenant_route.t_1001

  # ── (E2) The liveness canary takes the same path ──────────────────────────
  - name: "ADR-028: heartbeat canary reaches the evidence stream (channel_up depends on it)"
    inputs:
      - insert_at: origin_split
        type: log
        log_fields:
          message: '{"time":"2026-07-26T09:05:00Z","level":"INFO","msg":"federation revocation evidence channel heartbeat","event":"federation_revocation_channel_heartbeat"}'
          'kubernetes.pod_labels."app.kubernetes.io/name"': tenant-api
          kubernetes.container_name: tenant-api
          kubernetes.pod_namespace: tenant-api
          kubernetes.pod_name: tenant-api-6c4f-abcde
          kubernetes.pod_node_name: node-3
    outputs:
      - extract_from: federation_evidence
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event, "federation_revocation_channel_heartbeat")
              assert_eq!(.log_type, "federation_evidence")
              # ADR-028 §D3: the canary carries NO tenant identifier. If one
              # ever appears here the PII boundary has regressed at the producer.
              assert!(!exists(.tenant_id), "heartbeat must not carry a tenant identifier")
    no_outputs_from:
      - demux
      - tenant_route.t_1000
      - tenant_route.t_1001

  # ── (E3) PII filter: ordinary tenant-api request logs are DROPPED ─────────
  # tenant-api's request middleware logs `caller` (the operator's EMAIL) and
  # `remote` (client IP) on EVERY request. Shipping the pod's whole stderr into
  # a 30-day audit store would violate the PII-minimisation rule ADR-028 sets
  # for itself. Asserting the row DID enter the evidence BRANCH and then did NOT
  # come out of the remap proves the drop is the ALLOWLIST's doing — not an
  # accident of routing that a selector change could silently undo.
  - name: "ADR-028 D3: ordinary tenant-api request log (carries operator email) is dropped, never stored"
    inputs:
      - insert_at: origin_split
        type: log
        log_fields:
          message: '{"time":"2026-07-26T09:06:00Z","level":"INFO","msg":"request","caller":"operator@example.com","remote":"10.0.0.5","method":"PUT","path":"/api/v1/tenants/acme/thresholds","status":200}'
          'kubernetes.pod_labels."app.kubernetes.io/name"': tenant-api
          kubernetes.container_name: tenant-api
          kubernetes.pod_namespace: tenant-api
          kubernetes.pod_name: tenant-api-6c4f-abcde
          kubernetes.pod_node_name: node-3
    outputs:
      - extract_from: origin_split.evidence
        conditions:
          - type: vrl
            source: |
              # It reached the branch (routing is by POD, not by content)…
              assert!(contains(to_string(.message) ?? "", "operator@example.com"))
    # …and the allowlist stopped it here. Nothing downstream ever sees it.
    no_outputs_from:
      - federation_evidence
      - demux
      - tenant_route.t_1000
      - tenant_route.t_1001

  # ── (E4) Non-JSON tenant-api stderr is dropped too ────────────────────────
  # Go runtime noise / panics are not evidence. Deliberately NOT reclassified
  # into an operational stream — that would re-open the E3 PII hole via a
  # different door (a panic can print request context).
  - name: "ADR-028 D3: non-JSON tenant-api stderr is dropped from the evidence stream"
    inputs:
      - insert_at: origin_split
        type: log
        log_fields:
          message: "panic: runtime error: invalid memory address caller=operator@example.com"
          'kubernetes.pod_labels."app.kubernetes.io/name"': tenant-api
          kubernetes.container_name: tenant-api
          kubernetes.pod_namespace: tenant-api
          kubernetes.pod_name: tenant-api-6c4f-abcde
          kubernetes.pod_node_name: node-3
    outputs:
      - extract_from: origin_split.evidence
        conditions:
          - type: vrl
            source: |
              assert!(contains(to_string(.message) ?? "", "panic:"))
    no_outputs_from:
      - federation_evidence
      - demux
      - tenant_route.t_1000
      - tenant_route.t_1001

  # ── (E5) REGRESSION: gateway rows behave exactly as before ────────────────
  # The split must be transparent to the pre-existing pipeline: a gateway row
  # still reaches demux, is still classified federation_audit, and still
  # projects into its tenant partition. It must NOT appear on the evidence
  # stream (which would double-write it into 0:0).
  - name: "ADR-028 regression: gateway rows still flow demux → 0:0 → tenant partition, and never onto the evidence stream"
    inputs:
      - insert_at: origin_split
        type: log
        log_fields:
          message: '{"tenant_id":"tenant-alpha","token_id":"tok-gw","status":200,"path":"/select/logsql/query"}'
          'kubernetes.pod_labels."app.kubernetes.io/name"': federation-gateway
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: federation-gateway-7d9f-abcde
          kubernetes.pod_node_name: node-7
          kubernetes.pod_owner: ReplicaSet/federation-gateway-7d9f
    outputs:
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              assert_eq!(.log_type, "federation_audit", "gateway classification unchanged by the split")
              assert_eq!(.tenant_id, "tenant-alpha")
              assert_eq!(.k8s_namespace, "monitoring")
      - extract_from: tenant_route.t_1000
        conditions:
          - type: vrl
            source: |
              assert_eq!(.account_id, 1000, "tenant projection still works through the split")
              assert_eq!(.token_id, "tok-gw")
    no_outputs_from:
      - federation_evidence

  # ══ #1293 — pod_owner is "<Kind>/<Name>", not a bare workload name ═════════
  # The origin spoof guard compares a workload-NAME prefix. Vector builds
  # pod_owner as format!("{}/{}", kind, name), so the raw value never starts
  # with that prefix and EVERY real gateway audit row was reclassified to
  # suspicious_audit — which tenant_project then aborts, silently emptying
  # every tenant partition. The three cases below pin the SHAPE-HANDLING truth
  # table so it can't drift back: real owner passes, foreign owner is caught,
  # missing owner is fail-closed.
  #
  # ⛔ SCOPE — what these three do NOT cover. They set `kubernetes.pod_owner`
  # directly and their payloads carry no `kubernetes` key, so they exercise
  # "given a trustworthy pod_owner, is the compare right?" — NOT "is pod_owner
  # still trustworthy when the compare reads it?". It is not: demux merges the
  # attacker-controlled `.message` payload into the event (`deep: true`) BEFORE
  # this check runs, so a payload carrying its own `kubernetes.pod_owner`
  # overrides the kubelet's. That ordering is unchanged by #1293 and is a
  # separate defect of its own class (platform-owned fields read AFTER the
  # untrusted merge); do not read these cases as evidence that the guard
  # resists a forged payload.
  #
  # ⛔ The FIXTURES above carry the real "ReplicaSet/..." shape for the same
  # reason. Before #1293 they used the bare name, so the suite validated a
  # contract production never produces and stayed green through the outage.

  # ── (O1) A legitimate gateway pod must stay federation_audit ──────────────
  # This is the case whose absence let #1293 ship. It asserts the POSITIVE
  # path end-to-end: correct owner → federation_audit → tenant partition.
  - name: "#1293: real pod_owner shape (ReplicaSet/<name>) keeps a legitimate gateway row in federation_audit and in its tenant partition"
    inputs:
      - insert_at: origin_split
        type: log
        log_fields:
          message: '{"tenant_id":"tenant-alpha","token_id":"tok-real","status":200}'
          'kubernetes.pod_labels."app.kubernetes.io/name"': federation-gateway
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: federation-gateway-7d9f-abcde
          kubernetes.pod_node_name: node-7
          kubernetes.pod_owner: ReplicaSet/federation-gateway-7d9f
    outputs:
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              assert_eq!(.log_type, "federation_audit",
                "a real gateway pod must NOT be reclassified — the Kind prefix has to be stripped before the compare")
      - extract_from: tenant_route.t_1000
        conditions:
          - type: vrl
            source: |
              assert_eq!(.account_id, 1000,
                "reclassification would abort tenant_project and empty the partition")
              assert_eq!(.token_id, "tok-real")

  # ── (O2) A foreign owner must still be caught ─────────────────────────────
  # Stripping the Kind must not turn the guard into a no-op: same label, same
  # container name, but owned by something else.
  - name: "#1293: a gateway-labelled pod owned by a FOREIGN workload is still reclassified to suspicious_audit"
    inputs:
      - insert_at: origin_split
        type: log
        log_fields:
          message: '{"tenant_id":"tenant-alpha","token_id":"tok-forged","status":200}'
          'kubernetes.pod_labels."app.kubernetes.io/name"': federation-gateway
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: not-the-gateway-1234-abcde
          kubernetes.pod_node_name: node-7
          kubernetes.pod_owner: ReplicaSet/not-the-gateway-1234
    outputs:
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              assert_eq!(.log_type, "suspicious_audit", "foreign owner must still be caught")
    no_outputs_from:
      - tenant_route.t_1000
      - tenant_route.t_1001

  # ── (O3) No ownerReferences ⇒ no pod_owner field ⇒ fail-closed ────────────
  # Vector omits pod_owner entirely for a pod with no ownerReferences (a bare
  # attacker-created Pod is exactly that), so `owner` is "". That must NOT be
  # read as "nothing to check".
  - name: "#1293: a bare pod with NO pod_owner field is fail-closed, not admitted by omission"
    inputs:
      - insert_at: origin_split
        type: log
        log_fields:
          message: '{"tenant_id":"tenant-alpha","token_id":"tok-bare","status":200}'
          'kubernetes.pod_labels."app.kubernetes.io/name"': federation-gateway
          kubernetes.container_name: federation-gateway
          kubernetes.pod_namespace: monitoring
          kubernetes.pod_name: bare-pod
          kubernetes.pod_node_name: node-7
    outputs:
      - extract_from: demux
        conditions:
          - type: vrl
            source: |
              assert_eq!(.log_type, "suspicious_audit", "absent pod_owner must fail closed")
    no_outputs_from:
      - tenant_route.t_1000
      - tenant_route.t_1001
