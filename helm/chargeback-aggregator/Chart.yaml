apiVersion: v2
name: chargeback-aggregator
description: Daily federation-chargeback aggregator — queries VictoriaLogs for prometheus_query_log entries, computes per-tenant samples_scanned + exec_time totals, writes CSV report (#539 Phase 2 / #552). The accurate per-tenant cost signal the gateway access-log count cannot provide.
type: application
# version: Helm Chart 版本（隨 Chart 結構/模板變更升級）
# 0.1.0 — #539 Phase 2: initial chart (CronJob + Python script + PVC output)
# 0.1.1 — #539: self-review — exec_time_ms→_s (correctness), PVC resource-policy: keep, query both _s + _ms legacy across upgrade window
# 0.1.2 — #566 T5: image.digest knob (supply-chain pinning); default empty so existing deploys are no-op
# 0.2.0 — #566 batch C: CSV sha256 sidecar + append-only manifest.jsonl (T2-4 tamper-evident); extraEnv/extraEnvFrom (Q5 platform convention)
# 0.2.1 — #902 L2 slice-2: pin the python base image by digest (image.digest)
# 0.2.2 — CSV report opened with explicit encoding="utf-8" (no longer follows the container locale)
# 0.2.3 — #1243: image python:3.14-slim → gcr.io/distroless/python3-debian13:nonroot (no pip, no shell)
# 0.3.0 — #1295: victorialogs.auth {username, existingSecret}. With a Secret named, the CronJob and the manual Job send HTTP basic auth to the store's vmauth. No Secret = no change.
# 0.4.0 — #1295: NetworkPolicy (networkPolicy.enabled, default on) allowing egress to DNS and to VictoriaLogs :9428 only — the documented namespace (monitoring) default-denies egress, and runs failed before their first query. ⚠️ BEHAVIOUR CHANGE: the policy selects VictoriaLogs pods by `app.kubernetes.io/name: victorialogs` in the namespace `networkPolicy.victorialogsNamespaceLabel` names (default monitoring) on 9428. A store in another namespace needs that label set and the aggregator's namespace in VictoriaLogs' `networkPolicy.allowedNamespaces`; `--reuse-values` from 0.3.x (no `networkPolicy` map) takes the default (on); a store not installed from helm/victorialogs, or on another port, needs `networkPolicy.enabled: false`
# 0.4.1 — #1295: README only (it ships in the package): a store in another namespace now admits the aggregator through VictoriaLogs' `auth.consumers[chargeback-aggregator].from.namespace`, not the removed `networkPolicy.allowedNamespaces`. No template or value change
version: 0.4.1
# appVersion: Python version inside the pinned image
appVersion: "3.13"
keywords:
  - dynamic-alerting
  - federation
  - chargeback
  - observability
home: https://github.com/vencil/Dynamic-Alerting-Integrations
maintainers:
  - name: vencil
