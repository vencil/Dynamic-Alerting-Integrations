# federation-reconciler — ADR-028 D1 (#924) revocation tamper-evidence reconciler.

# The da-tools image bakes the reconciler script (scripts/tools/ops/
# _federation_revocation_reconciler.py) via build.sh. Pure stdlib — no extra deps.
#
# ⛔ NOT SATISFIED TODAY — the tag below cannot run this chart. The reconciler
# was added to build.sh TOOL_FILES AFTER `tools/v2.9.0` was cut, and v2.9.0 is
# still the newest da-tools tag, so NO released image contains
# /opt/da-tools/_federation_revocation_reconciler.py: the Deployment's
# `command:` (templates/deployment.yaml) fails on a missing file. Bumping `tag`
# below (and Chart.yaml `appVersion`) to the next tools/v* release is the whole
# fix. The chart is deliberately left DEPLOYABLE rather than disabled:
# FederationRevocationReconcileStale (k8s/03-monitoring/configmap-rules-
# platform.yaml) is severity:critical / for:10m with an `or absent(...)` arm, so
# scaling to zero would page on-call within 10 minutes. (That `absent(...)` arm
# is what makes this reasoning hold HERE and not for the sibling case: the
# threshold-govern CronJob's staleness alert has no such arm, so that outage has
# no runtime detector at all — see k8s/03-monitoring/cronjob-threshold-govern.yaml.)
# Registered in EXEMPTIONS in scripts/tools/lint/check_image_pin_capability.py.
# The exemption key includes the TAG (`helm/federation-reconciler`,
# `_federation_revocation_reconciler.py`, `v2.9.0`), so moving this pin to
# another tag that still lacks the script fails CI instead of inheriting the
# licence — and shipping a release that does contain it makes the gate demand
# the entry's deletion.
#
# ⚠️ Keep `tag:` EXPLICIT here. Dropping it (letting the template fall back to
# `.Chart.AppVersion`) is an error in that gate, not a pass: it cannot verify a
# tag the values file does not state. `bump_docs.py --tools` rewrites this pin
# and Chart.yaml `appVersion` together, so the two cannot drift apart.
image:
  repository: ghcr.io/vencil/da-tools
  tag: "v2.9.0"
  # Optional digest pin (supply-chain; #566 T5 / #902 convention). Empty = tag only.
  # ⛔ Digest AUTHORITATIVE when set: `--set image.tag=…` alone won't upgrade.
  digest: ""
  pullPolicy: IfNotPresent

# The tenant-federation-store ConfigMap (ADR-020) whose revoked.txt key is the
# live revoked set. Mounted read-only — a kubelet projection is a DIRECT read of
# the source of truth (NOT via the possibly-compromised tenant-api API), and
# needs no RBAC (ADR-028 §MVP G3).
#
# ⛔ The ConfigMap must be in THIS release's namespace — a volume resolves one
# only in the mounting pod's own namespace. tenant-api's chart creates it in ITS
# namespace by default, so when the two differ, set tenant-api's
# `federation.store.namespace` to this one. Getting it wrong is silent: the
# volume is `optional: true`, so the pod starts clean and `read_live_set` treats
# the absent file as a benign empty set ("nothing revoked yet") — the reconcile
# then compares real revocation events against an empty live set (#1313).
#
# ⛔ The invariant is a THREE-WAY equality: this chart, helm/federation-gateway
# (which mounts the same key to ENFORCE revocation) and the store ConfigMap must
# all live in one namespace, and tenant-api's `federation.store.namespace` must
# name it. Satisfying only two of the three still breaks, just more quietly —
# see that chart's README for which half goes silent in each case.
store:
  configMapName: tenant-federation-store
  revokedKey: revoked.txt

# VictoriaLogs endpoint the reconciler queries (matches helm/victorialogs).
victorialogs:
  url: "http://victorialogs.monitoring.svc.cluster.local:9428"

reconcile:
  intervalSeconds: 300      # reconcile cadence
  lookbackSeconds: 86400    # revocation-event window [now-24h, now-settle]
  settleSeconds: 60         # skip logs younger than this (ingestion lag)
  # ⛔ #1238. A SECOND, independent age guard, applied to the revocation-event
  # query ONLY (effective near edge = max(settleSeconds, this)). It covers this
  # pod's own kubelet ConfigMap projection lag: reconcile an event before the
  # projected revoked.txt has caught up and a token that WAS revoked correctly
  # reads as absent from the live set — a legitimate revocation reported as
  # tamper. Until #1238 the alert's `for: 5m` absorbed that for free; latching
  # the alert removes the absorption, so the hazard is handled at its source.
  # ⛔ Do NOT "simplify" this by raising settleSeconds instead: settleSeconds is
  # shared with the gateway-side queries, whose window is [now-600s, now-settle],
  # and raising their near edge SHRINKS it — making a single refused reload
  # harder to catch, the opposite of what #1238 does for those gauges.
  # Set to 0 to reproduce the pre-#1238 windows exactly.
  projectionGraceSeconds: 180
  skewMarginSeconds: 120    # ~2 min clock-skew tolerance at the TTL boundary
  failopenLookbackSeconds: 600  # RECENT window for the gateway fail-open gauge
  # ADR-028 D1 / #1234 evidence-channel canary window. tenant-api emits
  # `federation_revocation_channel_heartbeat` every 5m, so 1800s holds ~5-6 of
  # them and ONE missed emission can never drive channel_up to 0. ⛔ Narrowing
  # this toward the 5m producer cadence removes that margin and makes
  # FederationRevocationEvidenceChannelDown flap on a single lost log line;
  # widening it delays detection of a genuinely severed channel.
  heartbeatLookbackSeconds: 1800

metricsPort: 9099

# Ship the platform's default scrape-annotation contract (federation-gateway parity).
service:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# NetworkPolicy: default-deny + only the egress the reconciler needs (DNS +
# VictoriaLogs) and ingress from the monitoring namespace (Prometheus scrape).
networkPolicy:
  enabled: true
  # Namespace label selector for the Prometheus that scrapes /metrics.
  scrapeNamespaceLabel:
    kubernetes.io/metadata.name: monitoring

nodeSelector: {}
tolerations: []
affinity: {}
