# PSS gate value set (#1018): turns on every values path a workload template
# branches on, so tests/pss judges the pods those branches shape. A new
# if/with/range on .Values in a workload template needs a value here
# (TestWorkloadConditionalsAreExercised). Not a deployment example.
extraArgs:
  - -loggerLevel=INFO
extraEnv:
  - name: PSS_GATE
    value: "1"
extraEnvFrom:
  - configMapRef:
      name: pss-gate
podAnnotations:
  pss-gate: "1"
nodeSelector:
  pss-gate: "1"
tolerations:
  - key: pss-gate
    operator: Exists
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
            - key: pss-gate
              operator: Exists
# The default auth.mode=enforce refuses to render until every consumer has a
# Secret (#1295). auth.existingSecrets is a map (#3847), so naming them does not
# restate the consumer registry; this renders the pod an operator deploys,
# Secret-backed env vars included.
auth:
  existingSecrets:
    vector: pss-gate
    grafana: pss-gate
    chargeback-aggregator: pss-gate
    federation-gateway: pss-gate
    federation-reconciler: pss-gate
