apiVersion: v2
name: victorialogs
description: Single-pod VictoriaLogs — central store for the platform log-aggregation pipeline (#539 Phase 1). Consumer #1 is the federation-gateway audit log (ADR-020 IV-2f); consumer #2 is the chargeback query log (#552). Vector DaemonSet ships into this store.
type: application
# version: Helm Chart 版本（隨 Chart 結構/模板變更升級）
# 0.1.0 — #539 Phase 1: initial chart (single pod + PVC + retention flag)
# 0.1.1 — #539: default persistence.size 10Gi→30Gi to match runbook §5 capacity estimate
# 0.1.2 — #539 red-team T2-2: NetworkPolicy enabled by default, locks :9428 to vector + chargeback + grafana (HTTP API has no built-in auth, in-cluster pods could `wget DELETE`)
# 0.1.3 — #566 T5: image.digest knob (supply-chain pinning); default empty so existing deploys are no-op
# 0.1.4 — #566 Q5: extraEnv/extraEnvFrom (platform convention with helm/vector + helm/chargeback-aggregator)
# 0.2.0 — ADR-021 Phase 1 / #609: Layer-1 query guardrails (.Values.search → -search.maxQueryTimeRange / maxQueryDuration / maxConcurrentRequests / maxQueueDuration); maxQueryDuration 25s < gateway 30s (cascading-timeout)
# 0.2.1 — #902 L2 slice-2: pin the VictoriaLogs image by digest (image.digest)
# 0.3.0 — #1018 PSS: default netpol admits the dedicated `vector` namespace (allowedNamespaces) — the log-agent PSS carve-out moved Vector out of `monitoring`; default ingress-topology change ⇒ minor bump
# 0.3.1 — #1295: correct the netpol's protection claim. The rendered manifest previously asserted that a same-namespace attacker pod "cannot reach :9428"; podSelector rows match SELF-DECLARED labels, so they do not hold against anyone able to create a pod in this namespace. Comments/values wording only — NO rendered policy rule changed, so no behaviour change on upgrade
# 0.4.0 — #1295: a vmauth sidecar now owns the Service port and VictoriaLogs listens on 127.0.0.1:<auth.backendPort> only. `auth.consumers` holds each consumer to its paths (vector: /insert only; the readers: /select only); passwords come from operator-created Secrets. Default `auth.mode: observe` keeps requests without credentials working, so upgrading changes nothing for existing consumers; `enforce` (only /health, /ping, /metrics without credentials) is the next step once every consumer authenticates. ⚠️ BEHAVIOUR CHANGE: anything that reached the pod IP on :9428 now reaches vmauth (same port, same paths in observe), and a new image (victoriametrics/vmauth) is pulled
# 0.5.0 — #1295: `auth.mode` defaults to `enforce`. ⚠️ BREAKING: a render with no `auth.consumers[].existingSecret` now fails, naming every consumer that lacks one — create the Secrets and name them, remove consumers you do not run, or set `auth.mode: observe` explicitly while rolling credentials out (runbook §1.2). The render checks the store side only: a consumer chart that sends no credential still renders and is refused (401) — Vector then drops events (alert VectorStoreSinkDroppingEvents). `helm upgrade --reuse-values` keeps the previous release's observe. On upgrade (this release's Deployment exists) every named Secret is looked up and a missing one, or one with no non-empty `password`, fails the upgrade — Recreate would otherwise delete the running pod first; offline renders skip the lookup; a deployer that cannot read Secrets sets `auth.checkSecretsOnUpgrade: false`. Every consumer chart can send its credential since #3650 (vector 0.12.0, chargeback-aggregator 0.3.0, federation-gateway 0.7.0, federation-reconciler 0.4.0; the reconciler also needs the da-tools image of the release that carries it).
# 0.5.1 — #1295: the NetworkPolicy also admits `app: prometheus` (the /metrics scrape on the Service port). Without it the store was never scraped where the policy is enforced. In enforce an unauthenticated request reaches only /metrics, /health, /ping. vmauth's own metrics stay on its internal port and are not scraped
# 0.6.0 — #1295: the NetworkPolicy is rendered from `auth.consumers[].from` (each consumer's namespace and/or pod labels) plus `networkPolicy.scrapers` (default `app: prometheus`), so who may connect and what it may do are one list. ⚠️ BREAKING: `networkPolicy.allowedPodSelectors` / `allowedNamespaces` are removed and fail the render if set (`--reuse-values` carries them: use `--reset-then-reuse-values`); a values file that restates `auth.consumers` must give every consumer a `from`. Vector's row is now its namespace AND its pod label, and the same-namespace `app.kubernetes.io/name: vector` row (pre-#1018 installs) is gone
# 0.7.0 — #3847: each consumer's Secret is named in `auth.existingSecrets` (<consumer>: <Secret>, a map) instead of `auth.consumers[].existingSecret`, so naming the Secrets no longer means restating the consumer list (Helm replaces lists wholesale; maps merge per key). ⚠️ BREAKING: a consumer row that still carries `existingSecret` fails the render with the key to move it to (`--reuse-values` carries the old rows: use `--reset-then-reuse-values`); a key in `existingSecrets` that names no consumer fails too
version: 0.7.0
# appVersion: pinned VictoriaLogs release
appVersion: "v1.50.0"
keywords:
  - dynamic-alerting
  - log-aggregation
  - victorialogs
  - observability
