# victorialogs Helm values
# Reference: #539 — Platform log aggregation (Vector + VictoriaLogs).
#
# Single-pod deployment. Per #539 §3 the operational-simplicity selection
# of VictoriaLogs (single binary, no object-storage ring / compactor /
# memcached) is the explicit rationale — do NOT shard this into a
# cluster topology without revisiting the ADR. PVC-backed storage; pod
# recycles do not lose history.
#
# Hard rule (#539 §2): producers MUST NEVER HTTP-push directly here.
# The shipper (Vector DaemonSet) tails container stdout and pushes;
# log-store downtime must not wedge the producer (the federation
# gateway, etc.). This values.yaml does not expose any direct-push
# convenience knob on purpose.

replicaCount: 1

image:
  # renovate: datasource=docker depName=victoriametrics/victoria-logs
  repository: victoriametrics/victoria-logs
  tag: "v1.53.0"
  # Pinned by digest (#902 L2 supply-chain; was #566 T5): the rendered image
  # is `repo:tag@sha256:...`, so kubelet pulls by digest (immutable; an
  # upstream tag swap cannot substitute). Renovate bumps tag + digest together
  # (#902 L3). To bump by hand, get the digest with:
  #   docker buildx imagetools inspect <repo>:<tag> | grep Digest
  # ⛔ Digest AUTHORITATIVE: `--set image.tag=…` alone won't upgrade (k8s keeps THIS
  #    digest); set image.digest to the new tag's digest too. Do NOT clear it:
  #    that pulls by tag alone and drops the pin. In-repo, a third-party image
  #    without a digest fails tests/ops/test_thirdparty_images_are_digest_pinned.py.
  digest: "sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d"
  pullPolicy: IfNotPresent

# HTTP listen port for ingestion + query. VictoriaLogs default is 9428.
# The Vector sink in #539 Phase 1 hits :9428/insert/elasticsearch/ and
# Grafana queries the same port via /select/logsql/query.
listenPort: 9428

# Retention window. Per #539 §5: "Phase 1 default: TBD — typical
# ops/forensic 30–90 days. Revisit when an explicit compliance
# requirement names a window." 30d is the conservative entry point;
# operators override per environment via Helm values.
retentionPeriod: "30d"

# ── Layer-1 query guardrails — ADR-021 §Blast radius Layer 1 / #609 ─────────
# Tenant log query (ADR-021) puts a NEW read load on this single-pod store
# (#539 sized it for ingestion only). LogsQL has no Prometheus-style sample
# cap, so the primary blast-radius primitive is a TIME-RANGE limit plus an
# execution-duration cap. These are rendered as `-search.*` flags on the
# deployment. Starting values per ADR-021 — observe and tune after rollout.
search:
  # Reject queries with no/too-wide time filter — the main blast-radius
  # control in the log world. Keep <= retentionPeriod (a wider window can
  # never return data anyway, but bounding it stops a full-retention scan).
  maxQueryTimeRange: "7d"
  # ⛔ Single-query execution-time cap. MUST be SHORTER than the gateway
  # route timeout (ADR-020/021 gateway = 30s) so the CASCADE makes
  # VictoriaLogs abort FIRST — otherwise a query the gateway already gave up
  # on keeps burning a storage concurrency slot as a zombie. 25s < 30s.
  # (Gemini fold-in — do not raise to/above 30s without raising the gateway
  # timeout in lockstep.)
  maxQueryDuration: "25s"
  # Concurrent query cap — the real RAM/CPU backstop. Also the per-pod
  # rate-limit backstop for the multi-replica gateway asymmetry (ADR-021
  # Layer 2 note): no matter how many gateway replicas wave a single token
  # through, actual concurrent execution here is bounded. Conservative
  # start; raise once steady-state read load is understood.
  maxConcurrentRequests: 6
  # How long an over-the-concurrency-limit query waits in queue before being
  # rejected (vs failing instantly). Bounded so a backlog can't pile up
  # unboundedly behind the concurrency cap.
  maxQueueDuration: "10s"

# Extra command-line flags. VictoriaLogs has "sane defaults" for most
# knobs (per upstream); the chart only sets retention + listen + data
# path + the ADR-021 Layer-1 search guardrails above. Add overrides here
# without forking the deployment template.
# Example: ["-loggerLevel=WARN", "-storage.minFreeDiskSpaceBytes=10GB"]
extraArgs: []

# ── Consumer authorization — #1295 ──────────────────────────────────────────
# VictoriaLogs has one global Basic Auth credential at most, and anyone who can
# POST /insert can write rows with any `log_type` — including the federation
# evidence ADR-028 detects un-revokes from. So the store sits behind a vmauth
# sidecar (VictoriaLogs' own recommendation): VictoriaLogs listens on
# 127.0.0.1:<backendPort>, reachable only from inside this pod, and vmauth
# takes the Service port and holds each consumer to its own paths.
#
# `consumers` is the single list of who may talk to the store and on which
# paths. The username is the consumer's `name`; its password is key
# `password` of `existingSecret`, a Secret in THIS namespace that the operator
# creates (the chart never generates one: `helm template` / Argo CD cannot keep
# a generated value stable across renders). Each consumer sends the same
# password from its own namespace: the consumer charts through
# `victorialogs.auth.{username,existingSecret}`, Grafana through its
# datasource's basic auth (k8s/03-monitoring). Adding, removing or renaming a
# consumer here must be matched on that side —
# tests/shared/test_victorialogs_consumers.py fails otherwise.
# ⛔ Password format: hex only, no trailing newline —
#   kubectl create secret generic <name> --from-literal=password="$(openssl rand -hex 32)"
# vmauth substitutes the value into its YAML config as raw text before parsing
# it: a `"` breaks the config (vmauth exits, the store goes down), a `\t`
# style escape is silently rewritten, and a trailing newline (common with
# --from-file) becomes part of the expected password.
#
# mode:
#   observe  — consumers that present credentials are held to their paths;
#              requests WITHOUT credentials (or with wrong ones) still reach
#              every path, so an install whose consumers are not wired yet
#              keeps working. A consumer with an empty existingSecret is not
#              rendered. Use this to roll the credentials out.
#   enforce  — (default) only /health, /ping and /metrics pass without
#              credentials, and every consumer must name its existingSecret:
#              the render fails, listing every consumer that has none.
# ⛔ The default is enforce, so a plain `helm install` refuses to render until
#   the Secrets are named here. Remove consumers you do not run from the list.
# ⚠️ The render checks THIS side only: a consumer whose own chart sends no
#   credential still renders fine and is refused (401) from then on — and
#   Vector drops a refused batch without retrying (alert
#   VectorStoreSinkDroppingEvents). Check every consumer authenticates
#   (docs/internal/platform-log-aggregation-runbook.md §1.2 step 2) before
#   enforce applies. `helm upgrade --reuse-values` keeps the previous
#   release's values, including observe, the default before chart 0.5.0.
# ⚠️ observe is NOT a security boundary — it is the migration step.
auth:
  mode: enforce
  # On `helm upgrade` (this release's Deployment exists), look up every Secret
  # auth.consumers names and refuse when one is missing or has no non-empty
  # `password`: the strategy is Recreate, so the running pod would be deleted
  # and the new one would never start. Offline renders (`helm template`,
  # Argo CD) and first installs skip it. ⚠️ Needs `get secrets` in this
  # namespace: a deployer without it fails EVERY upgrade with "forbidden" —
  # set false for such a deployer (e.g. HELM_DRIVER=configmap with a Role that
  # leaves Secrets out) and check the Secrets yourself before upgrading.
  # Only an explicit false turns it off: unset (`--reuse-values` from a chart
  # before this key) counts as on.
  checkSecretsOnUpgrade: true
  # VictoriaLogs' own listener, on loopback only.
  backendPort: 9429
  # vmauth's own /health and /metrics (its per-user request counters).
  # ⚠️ Also serves /debug/pprof and /flags without credentials; the
  # NetworkPolicy admits only listenPort, so keep it enabled.
  internalPort: 8426
  # Concurrent requests vmauth forwards, globally and per user (the same
  # value: in observe, every request without credentials is one user).
  maxConcurrentRequests: 1000
  image:
    # renovate: datasource=docker depName=victoriametrics/vmauth
    repository: victoriametrics/vmauth
    tag: "v1.155.0"
    digest: "sha256:dfeb63e5eff4bc32ed0fa2d43d8e85b717e8442c8b5c753e83c216669665a7de"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
  consumers:
    # Ingest. The ONLY writer: ADR-028's evidence rows must not be writable by
    # anything but the shipper.
    - name: vector
      paths: ["/insert/.*"]
      existingSecret: ""
    # Query only.
    - name: grafana
      paths: ["/select/.*"]
      existingSecret: ""
    - name: chargeback-aggregator
      paths: ["/select/.*"]
      existingSecret: ""
    # The tenant log-query authorization plane (ADR-021): it pins the verified
    # AccountID header on every request it forwards.
    - name: federation-gateway
      paths: ["/select/.*"]
      existingSecret: ""
    # Reads the evidence stream (ADR-028).
    - name: federation-reconciler
      paths: ["/select/.*"]
      existingSecret: ""

# Persistent storage. The pod loses history without this — VictoriaLogs
# stores indexed data on disk. Default size sized for federation audit
# at ~50 RPS × 1 KB/line × 30d × 1.3 overhead ≈ 130 GB raw → ≈ 13 GB
# at VictoriaLogs's typical ~10× compression; 30Gi gives ~2× headroom
# for traffic spikes and the operational stream. Re-estimate when #552
# (chargeback query log) joins as consumer #2. Formula + worked example
# in docs/internal/platform-log-aggregation-runbook.md §5.
persistence:
  enabled: true
  size: 30Gi
  # storageClass: "" leaves the cluster default storage class to
  # provision; set explicitly to pin a class.
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Extra environment variables — #566 Q5, mirroring helm/vector pattern
# so operators have one consistent shape across the log-aggregation
# charts. VictoriaLogs accepts a few sensitive env vars (e.g. authKeys
# for HTTP API protection beyond the NetworkPolicy perimeter); wire
# them via Secret refs here.
extraEnv: []
extraEnvFrom: []

# Pod-level security: non-root, drop all capabilities. VictoriaLogs
# binary needs only read/write under -storageDataPath.
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

service:
  type: ClusterIP
  # Same port for ingestion + Grafana queries. Splitting them would
  # require two listeners — VictoriaLogs ships one.
  port: 9428

# Optional Prometheus scrape annotations on the Service. The pod
# exposes /metrics on the same port as ingestion.
prometheusScrapeAnnotations:
  enabled: true

# NetworkPolicy — locks the :9428 HTTP API (ingest + query + DELETE;
# unauthenticated unless auth.mode is enforce) to the legitimate consumers. T2-2 mitigation
# from the #539 red-team: any in-cluster pod that can reach :9428 can
# wipe history (`wget DELETE`), so the producer-side §2 hard rule is
# necessary-but-not-sufficient — the store itself needs a perimeter.
#
# Defaults (same-namespace consumers, the common install topology):
#   - Vector DaemonSet (ingest)              app.kubernetes.io/name=vector
#     ⚠️ since #1018 Vector deploys into its dedicated `vector` namespace
#     (PSS privileged carve-out) and reaches :9428 via `allowedNamespaces`
#     below; the same-ns podSelector row is RETAINED for pre-migration
#     installs.
#   - chargeback-aggregator CronJob (query)  app.kubernetes.io/name=chargeback-aggregator
#   - Grafana (query)                        app=grafana  (k8s/03-monitoring label)
#   - federation-gateway (query, ADR-021)    app.kubernetes.io/name=federation-gateway
#   - federation-reconciler (evidence read,  app.kubernetes.io/name=federation-reconciler
#     ADR-028 D1 / #1234)
#
# ⚠️ EVERY ROW BELOW IS A SAME-NAMESPACE MATCH. A NetworkPolicy
# `podSelector` with no sibling `namespaceSelector` selects pods in the
# POLICY's own namespace, so each entry admits its consumer only while that
# consumer runs in VictoriaLogs' namespace. Deploy a consumer elsewhere (the
# reconciler chart takes `-n` like any other, and its default
# `victorialogs.url` points at `victorialogs.monitoring.svc`) and its
# podSelector row does NOT admit it — it needs an `allowedNamespaces` entry,
# which is precisely why Vector has one since #1018. Symptom of getting this
# wrong is per-consumer: the reconciler fails LOUD (query raises →
# `reconcile_errors_total` → `FederationRevocationReconcileStale` critical),
# Vector ingest fails SILENT.
#
# ⛔ WHAT THIS ALLOWLIST IS AND IS NOT (corrected in #1295). It decides
# which SELF-DECLARED pod labels are admitted from THIS namespace. A pod
# label is not an identity: any principal able to create a pod here can
# wear one of these values, so this list does not hold against them —
# and :9428 is unauthenticated ingest + query until `auth.mode: enforce`
# (see `auth` above). `allowedNamespaces`
# below is different in kind (namespace labels are control-plane assigned,
# not self-declared) and IS a boundary. Treat the rows below as "which
# workloads are supposed to talk to the store", i.e. a routing and
# blast-radius decision, and read the tenant-isolation argument that
# follows as conditional on nobody hostile being able to create pods in
# this namespace. Candidate fixes: #1295.
#
# ⚠️ Trust boundary of this allowlist (ADR-021): every entry is EITHER a
# platform-trusted component (Vector / chargeback / Grafana never carry a
# tenant identity — they read the platform partition or set their own
# AccountID) OR the federation-gateway, which is the ONLY tenant-facing
# reader and pins a verified AccountID header on every request (it is the
# authorization plane). This list must NEVER contain a pod a tenant can
# reach directly with an arbitrary AccountID — that would bypass the
# gateway's per-tenant enforcement. The gateway is allowed unconditionally
# (it only initiates :9428 traffic in `mode: victorialogs`).
#
# Cross-namespace consumers go in `allowedNamespaces`. Setting
# `enabled: false` reverts to no policy (cluster-wide reachable);
# only acceptable for chart smoke-tests, never for steady-state.
networkPolicy:
  enabled: true
  allowedPodSelectors:
    - matchLabels:
        app.kubernetes.io/name: vector
    - matchLabels:
        app.kubernetes.io/name: chargeback-aggregator
    - matchLabels:
        app: grafana
    # federation-gateway in `mode: victorialogs` (ADR-021 #609): the
    # tenant log-query authorization plane. Without this entry the gateway
    # → :9428 forward is dropped and the whole mode is DOA in-cluster.
    - matchLabels:
        app.kubernetes.io/name: federation-gateway
    # federation-reconciler (ADR-028 D1 / #924, #1234): the un-revoke
    # tamper-evidence reconciler. It READS the evidence stream from :9428 on
    # every reconcile loop — it never writes, and it carries no tenant
    # identity (all six of its metrics are platform-global with zero labels;
    # and the evidence rows carry no DIRECT tenant id — that holds because the
    # producer does not emit one and `evidenceChannel.keepFields` does not list
    # one, NOT as an intrinsic property of the channel, so re-check it if either
    # side changes; `token_id` is still indirectly tenant-attributable via the
    # token registry — see log-visibility-2tier-catalogue.md), so it belongs in
    # the "platform-internal reader" class above. Without this
    # entry its queries are dropped at the network layer and the ENTIRE
    # ADR-028 detection plane is DOA in-cluster. That failure is LOUD, not
    # silent: a dropped connection makes `query_victorialogs()` raise, the
    # reconciler's fail-closed path bumps `reconcile_errors_total` WITHOUT
    # refreshing `last_reconcile_ts`, and `FederationRevocationReconcileStale`
    # (critical) fires. The silent variant is the sibling half of #1234 — a
    # reachable store that the evidence never reaches, which reconciles to a
    # clean all-clear. Both must be closed for the control to mean anything.
    - matchLabels:
        app.kubernetes.io/name: federation-reconciler
    # Prometheus (k8s/03-monitoring, `app: prometheus`): scrapes /metrics on
    # this same port (Service annotation `prometheus.io/port`). Without this
    # row every scrape of the store and its vmauth sidecar was refused, so the
    # store had no series and nothing could alert on it. In `auth.mode:
    # enforce` an unauthenticated request reaches only /metrics, /health and
    # /ping; in `observe` it reaches every path, like any row here.
    - matchLabels:
        app: prometheus
  # `vector`: the log shipper's dedicated namespace (#1018 PSS privileged
  # carve-out — its 3 hostPath mounts are forbidden even by PSS baseline,
  # so it cannot share the restricted-tier `monitoring` ns). A
  # namespaceSelector entry admits ALL pods of that namespace — acceptable
  # ONLY because k8s/00-namespaces/namespace-vector.yaml pins it as a
  # single-workload namespace. ⛔ Never add a shared/multi-tenant ns here.
  allowedNamespaces:
    - vector

# Pod placement. Single pod has no affinity rules; if scaled up the
# chart user is expected to add an anti-affinity block manually since
# the upstream design is single-binary.
nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
