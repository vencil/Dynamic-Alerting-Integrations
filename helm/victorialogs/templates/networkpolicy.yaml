{{- $np := .Values.networkPolicy | default (dict "enabled" true) }}
{{- if $np.enabled }}
{{- /* Values from a chart before 0.6.0 (`helm upgrade --reuse-values` carries
them) still hold the two hand-written lists. Refuse rather than render a policy
from half old, half new values: the rows they held are now each consumer's
`auth.consumers[].from` (#1295 PR2). */}}
{{- range $legacy := list "allowedPodSelectors" "allowedNamespaces" }}
{{- if hasKey $np $legacy }}
{{- fail (printf "networkPolicy.%s was removed in chart 0.6.0: who may reach the store is now each auth.consumers[].from, and the Prometheus scrape is networkPolicy.scrapers. Move any custom rows there and drop the key. With `helm upgrade --reuse-values`, upgrade with your values file instead, or `--reset-then-reuse-values` (Helm >= 3.14); either way, a values file that restates auth.consumers must give every consumer a `from` — copy it from the chart's values.yaml (#1295)" $legacy) }}
{{- end }}
{{- end }}
{{- /* The registry's own checks (names, duplicates, Secrets) first, so an
invalid list is reported as such and not as a missing `from`. */}}
{{- $_ := include "victorialogs.authConsumers" . }}
{{- $scrapers := $np.scrapers }}
{{- if not (hasKey $np "scrapers") }}
{{- $scrapers = list (dict "podLabels" (dict "app" "prometheus")) }}
{{- end }}
{{- /* An empty `from` is not "nobody": the API reads it as every source. */}}
{{- if not (or .Values.auth.consumers $scrapers) }}
{{- fail "networkPolicy: auth.consumers and networkPolicy.scrapers are both empty — the ingress rule would have no `from`, which admits every source. List a consumer, or set networkPolicy.enabled=false explicitly (#1295)" }}
{{- end }}
# Who may open a connection to the store's port (#539 T2-2, #1295).
#
# Rendered from the same list vmauth authorizes: one peer per
# `auth.consumers[].from`, plus `networkPolicy.scrapers` (Prometheus is not a
# consumer — in enforce an unauthenticated request reaches only /metrics,
# /health and /ping). Adding a consumer to one and not the other is no longer
# possible (#1295 PR2).
#
# ⛔ How strong a peer is depends on its shape. A `namespace` peer matches the
# control-plane-assigned `kubernetes.io/metadata.name` label — a pod cannot
# choose it. A `podLabels`-only peer matches SELF-DECLARED labels in this
# namespace: anyone able to create a pod here can wear them. That is why
# vmauth (`auth.mode: enforce`) is the boundary and this policy is the outer
# layer that keeps everyone else off the port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "victorialogs.name" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "victorialogs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "victorialogs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.listenPort }}
          protocol: TCP
      from:
        {{- range .Values.auth.consumers }}
        {{- include "victorialogs.netpolPeer" (dict "who" (printf "auth.consumers[%s]" (toString .name)) "from" .from "ns" $.Release.Namespace) | nindent 8 }}
        {{- end }}
        {{- range $i, $s := $scrapers }}
        {{- include "victorialogs.netpolPeer" (dict "who" (printf "networkPolicy.scrapers[%d]" $i) "from" $s "ns" $.Release.Namespace) | nindent 8 }}
        {{- end }}
{{- end }}
