{{- if .Values.networkPolicy.enabled }}
# T2-2 mitigation (#539 red-team): VictoriaLogs has no built-in auth
# on its HTTP listener — ingest + query + DELETE all share :9428. The
# §2 hard rule guards the producer side (gateway → stdout, not direct
# push) but does not protect the store itself from compromised
# in-cluster pods. This NetworkPolicy narrows the port to the declared
# consumers: the Vector DaemonSet (ingest — since #1018 in its
# dedicated `vector` namespace via `allowedNamespaces`; the same-ns
# podSelector row remains for debug pods / pre-migration installs), the
# chargeback CronJob (query), Grafana (query), the federation-gateway in
# `mode: victorialogs` (tenant-scoped log query, ADR-021 #609), the
# federation-reconciler (revocation-evidence read, ADR-028 D1 / #1234),
# and same-pod loopback (probes).
#
# ⛔ HOW STRONG THIS ACTUALLY IS — corrected in #1295. This block used to
# end with "Any other pod in the cluster — including a freshly
# attacker-deployed one in the same namespace — cannot reach :9428". That
# is FALSE for the same-namespace half, and the two kinds of row below are
# NOT equally strong:
#   * `allowedNamespaces` renders a `namespaceSelector` on
#     `kubernetes.io/metadata.name`. A pod cannot choose its own namespace,
#     and that label is maintained by the control plane — this row IS a
#     boundary.
#   * `allowedPodSelectors` renders a bare `podSelector`, i.e. a match on
#     SELF-DECLARED pod labels within this namespace. Any principal able to
#     create a pod here can wear one of the five labels and be admitted.
# So what the policy buys is: everything from other namespaces is blocked
# unless explicitly allowed, and same-namespace workloads that are not
# deliberately impersonating a consumer are blocked. What it does NOT buy
# is protection against a principal who can already create pods in THIS
# namespace — for them, while `auth.mode` is observe, the port is still
# unauthenticated ingest + query (in enforce, vmauth requires a consumer's
# credentials; see values.yaml `auth`). Note that such a principal is already highly privileged here
# (mounting any ConfigMap in a namespace needs no RBAC at all), so read
# this as "an attacker already inside can also erase the evidence", not as
# "anyone can walk in".
# ⚠️ This is also the ceiling on any ingest-time classification done in
# Vector (#1288): binding producer identity inside the pipeline cannot
# constrain someone who writes to the store directly. #1295 closes that with
# the vmauth sidecar (only `vector` may write) once `auth.mode` is enforce.
#
# ⚠️ Every `allowedPodSelectors` row is a SAME-NAMESPACE match: a k8s
# NetworkPolicy `podSelector` with no `namespaceSelector` beside it selects
# pods in the policy's OWN namespace only. So each row admits its consumer
# ONLY when that consumer runs in VictoriaLogs' namespace. A consumer
# deployed elsewhere needs an `allowedNamespaces` entry instead (that is
# exactly why Vector, since #1018, has one) — its podSelector row alone
# will NOT let it in. The exact set is pinned by
# tests/shared/test_helm_chart_log_aggregation.py
# ::test_networkpolicy_locks_to_the_declared_consumer_set, so this list and
# the values.yaml enumeration must be edited together with that test.
#
# Authentication now sits in the pod itself (#1295): a vmauth sidecar holds
# each consumer to its paths (values.yaml `auth`). ⚠️ In `auth.mode: observe`
# (the default until every consumer is wired) requests without credentials
# still pass, so this NetworkPolicy is still the only perimeter; in `enforce`
# it becomes the outer layer. Either way it is not a boundary against
# same-namespace pod creation — do not cite it as one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "victorialogs.name" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "victorialogs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "victorialogs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.listenPort }}
          protocol: TCP
      from:
        {{- /* Same-namespace pod selectors — the legitimate consumers (Vector / chargeback / Grafana / federation-gateway). */}}
        {{- range .Values.networkPolicy.allowedPodSelectors }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- /* Cross-namespace allowance — empty list = no cross-ns ingress. */}}
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
{{- end }}
