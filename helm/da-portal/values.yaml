# da-portal Helm values
# Static-only Interactive Tools portal (Tier 1): nginx serves the bundled
# tools and data files, with no login, no API and no reverse proxy.
#
# ADR-027 §5: the portal that needs a login (tenant management, recipe
# preview, federation tokens) runs inside the tenant-api pod, behind its
# oauth2-proxy — install the tenant-api chart for that. This chart cannot
# forward anything to tenant-api: values.schema.json rejects the removed
# keys (oauth2Proxy, ingress, portal.tenantApiUrl, …) so an old values file
# fails the install instead of being silently ignored.

replicaCount: 1

image:
  repository: ghcr.io/vencil/da-portal
  # tag 留空 → template 自動推導為 v<Chart.appVersion>（= published image）。需覆寫才設此值。
  tag: ""
  pullPolicy: IfNotPresent

# Portal application settings
portal:
  # Port nginx listens on inside the container
  listenPort: 80

# Custom data (optional): the volume's .json / .yaml files are served in place
# of the image's /assets/<same name> (platform-data.json, flows.json, ...);
# names the volume does not carry still come from the image.
customData:
  # Enable custom data volume
  enabled: false
  # Use ConfigMap or emptyDir
  type: configMap  # configMap | emptyDir
  configMapName: da-portal-custom
  # If type: emptyDir, you can use init container to clone/setup

# Service configuration. Expose it with your own Ingress / LoadBalancer if
# you want; nothing behind it needs a login.
service:
  type: ClusterIP
  port: 80

# Resource requests and limits (the single nginx container)
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Pod security context (non-root)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# NetworkPolicy: ingress only from the listed namespaces; this policy allows
# no egress (another NetworkPolicy selecting the pod can still allow some)
# (a static file server opens no outbound connection, not even DNS).
networkPolicy:
  enabled: true
  # Namespaces allowed to reach the portal. Do not list tenant namespaces:
  # a tenant workload has no reason to reach the portal.
  # Set the second entry to YOUR ingress controller's namespace
  # (ingress-nginx | istio-system | traefik | …).
  allowedNamespaces:
    - monitoring
    - ingress-nginx

# Pod annotations
podAnnotations: {}
