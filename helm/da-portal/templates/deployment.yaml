apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "da-portal.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "da-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "da-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "da-portal.labels" . | nindent 8 }}
      annotations:
        # Force rolling restart when nginx config changes
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "da-portal.name" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        # The only container: nginx serving static files (ADR-027 §5 — no
        # login, no reverse proxy; the logged-in portal lives in the
        # tenant-api pod).
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.portal.listenPort }}
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /var/run
            {{- if .Values.customData.enabled }}
            - name: custom-data
              mountPath: /usr/share/nginx/html/custom
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.portal.listenPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.portal.listenPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "da-portal.name" . }}-nginx-config

        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi

        {{- if .Values.customData.enabled }}
        {{- if eq .Values.customData.type "configMap" }}
        - name: custom-data
          configMap:
            name: {{ .Values.customData.configMapName }}
        {{- else if eq .Values.customData.type "emptyDir" }}
        - name: custom-data
          emptyDir:
            sizeLimit: 256Mi
        {{- end }}
        {{- end }}
