{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "da-portal.name" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "da-portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "da-portal.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.portal.listenPort }}
          protocol: TCP
  # No egress rule: a static file server opens no outbound connection
  # (ADR-027 §5 — it forwards nothing to tenant-api or anything else).
  egress: []
{{- end }}
