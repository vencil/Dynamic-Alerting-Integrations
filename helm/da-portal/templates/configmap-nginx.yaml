apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "da-portal.name" . }}-nginx-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "da-portal.labels" . | nindent 4 }}
data:
  # Static-only server block (ADR-027 §5): no forwarding, no identity header —
  # this portal forwards nothing anywhere. Pinned by
  # tests/helm/test_portal_static_tier_guard.py.
  default.conf: |
    server {
      listen {{ .Values.portal.listenPort }} default_server;
      server_name _;

      # Access logs to stderr for k8s logging
      access_log /dev/stderr combined;
      error_log /dev/stderr warn;

      # ── Security Headers ────────────────────────────────────────────────────
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;

      # ── Health Endpoint ────────────────────────────────────────────────────
      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
      }

      # ── Simulate preview: explicitly NOT provided (#2125) ─────────────────
      # POST /api/v1/tenants/simulate is served by threshold-exporter; this
      # portal has no API behind it. The fixed code is what the
      # simulate-preview widget keys on (drift pinned by
      # tests/shared/test_portal_simulate_not_provided.py).
      # No add_header here on purpose: any add_header in a location drops the
      # server-level security headers above; Content-Type comes from
      # default_type instead.
      location = /api/v1/tenants/simulate {
        default_type application/json;
        return 501 '{"code":"SIMULATE_NOT_PROVIDED","error":"simulate preview is not provided by this deployment: the portal does not proxy /api/v1/tenants/simulate (served by threshold-exporter)"}';
      }

      # ── Static Files (Interactive Tools, JSX, platform-data.json, etc.) ────
      # The image's entry page is interactive/index.html (components/da-portal
      # Dockerfile); there is no index.html at the document root.
      # No add_header in any location below: one there would drop every
      # server-level security header above for that response. Caching is set
      # with `expires` alone.
      location / {
        root /usr/share/nginx/html;
        index interactive/index.html;
        {{- if .Values.customData.enabled }}

        # Custom data (customData): a file in the customData volume replaces
        # the image's file of the same name under /assets/ (platform-data.json,
        # flows.json, ...) — the tools read /assets/<file>, never /custom/.
        # First among the regex locations, so it wins over the ones below.
        location ~ ^/assets/([^/]+\.(json|ya?ml))$ {
          expires 1h;
          try_files /custom/$1 $uri =404;
        }
        {{- end }}

        # Long TTL for hashed assets, short for pages and data.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
          expires 7d;
        }

        location ~* \.(html|json)$ {
          expires 1h;
        }

        # Fallback to index.html for SPA routing
        try_files $uri $uri/ /interactive/index.html;
      }

      # ── Deny access to sensitive files ──────────────────────────────────────
      location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
      }

      location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
      }
    }
