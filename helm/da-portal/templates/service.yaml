apiVersion: v1
kind: Service
metadata:
  name: {{ include "da-portal.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "da-portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "da-portal.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.portal.listenPort }}
      protocol: TCP
