{{- /* #1425: thresholdConfig.existingConfigMap names a ConfigMap someone
       ELSE owns (`da-tools init --deploy kustomize` builds one named
       threshold-config from conf.d). Set, this chart renders no ConfigMap
       of its own and the Deployment mounts that one; every other
       thresholdConfig.* value is then not rendered anywhere. */}}
{{- if not .Values.thresholdConfig.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: threshold-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: threshold-exporter
data:
  # _defaults.yaml — loaded first (underscore prefix sorts before letters)
  # Contains global defaults and state_filters (platform-managed)
  _defaults.yaml: |
    defaults:
      {{- .Values.thresholdConfig.defaults | toYaml | nindent 6 }}
    {{- /* Type check sits OUTSIDE the truthy guard below, deliberately: `false`,
           `0` and `""` are all falsy, so a guard-internal check can never see
           them and a mistyped falsy scalar would stay indistinguishable from
           "deliberately unset" (CodeRabbit #1336). Only genuinely absent/null
           (kind `invalid`) and any slice — including the empty one — are let
           through; the truthy guard then skips the empty cases as before.
           Why a type check at all: the note below counts the list, and `len`
           aborts the WHOLE render on a non-collection (`len of type bool`),
           taking deployment.yaml with it over one mistyped value; while a
           scalar does NOT abort — `len` counts CHARACTERS, so
           `optional_overrides: "oracle_wait_time_rate"` rendered a confident
           "21 keys". */}}
    {{- if not (or (kindIs "invalid" .Values.thresholdConfig.optional_overrides) (kindIs "slice" .Values.thresholdConfig.optional_overrides)) }}
    {{- fail (printf "thresholdConfig.optional_overrides must be a LIST of key names (array of string), got %s. This tier DECLARES keys without asserting values; a scalar or map here would assert one." (kindOf .Values.thresholdConfig.optional_overrides)) }}
    {{- end }}
    {{- if .Values.thresholdConfig.optional_overrides }}
    {{- /* #1310: TOP-LEVEL key, sibling of defaults/state_filters — NOT a child
           of defaults. It is a LIST of key names the platform recognises but
           asserts no value for (ThresholdConfig.OptionalOverrides []string);
           nesting it under defaults would decode as a threshold value. */}}
    {{- /* #1321: the note below is emitted as literal YAML comments INSIDE the
           _defaults.yaml value, because `toYaml` renders the parsed list only —
           every comment in values.yaml (the tier rationale at the top of the
           block AND the per-key unit hints) is stripped at values-parse time
           and cannot be recovered in the template. Without this, the one
           artifact that reaches EVERY install is a bare list of key names, and
           the reason they carry no value lives only in docs the reader may not
           have. The count is rendered from the list itself so it cannot drift
           away from what is emitted directly beneath it. */}}
    {{- /* #3924: every rule-pack key is built into the exporter, so the
           chart ships this list EMPTY and it only ever carries an operator's
           OWN custom keys. The #1176 counter-example pointer that used to sit
           here described registry keys; it lives on the rule-pack headers now
           and is deliberately not repeated for keys the platform never saw. */}}
    # ⛔ 以下 {{ len .Values.thresholdConfig.optional_overrides }} 個自訂 key，平台「認得但不主張值」。
    # 規則包的鍵都已內建，不必列在這裡；這份清單只給你自己的規則用。
    # 租戶不填＝該告警靜默，預設不會有任何錯誤訊息——那是設計，不是遺漏的預設值。
    # 要在執行期收到提醒：租戶寫 _state_unset_thresholds: "enable"，或平台把
    # state_filters.unset_thresholds 的 default_state 設成 "enable"（#1200 D-A A3）。
    # 看某個租戶目前有哪些還沒填（輸出的 declared 段就是這批）：
    #   da-tools diagnose <tenant> --config-dir <conf.d 目錄> --show-inheritance
    optional_overrides:
      {{- .Values.thresholdConfig.optional_overrides | toYaml | nindent 6 }}
    {{- end }}
    {{- /* #3475: which labels a dimensional key of each base may carry and
           still be served (ADR-038 §11). A MAP of base -> list of labels;
           anything else fails here, not silently in the exporter's decode. */}}
    {{- if not (or (kindIs "invalid" .Values.thresholdConfig.dimensions) (kindIs "map" .Values.thresholdConfig.dimensions)) }}
    {{- fail (printf "thresholdConfig.dimensions must be a MAP of base key -> list of labels, got %s" (kindOf .Values.thresholdConfig.dimensions)) }}
    {{- end }}
    {{- range $base, $labels := (.Values.thresholdConfig.dimensions | default dict) }}
    {{- if not (kindIs "slice" $labels) }}
    {{- fail (printf "thresholdConfig.dimensions.%s must be a LIST of label names, got %s (--set thresholdConfig.dimensions.%s={version})" $base (kindOf $labels) $base) }}
    {{- end }}
    {{- range $labels }}
    {{- if not (kindIs "string" .) }}
    {{- fail (printf "thresholdConfig.dimensions.%s: every label must be a string, got %s" $base (kindOf .)) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.thresholdConfig.dimensions }}
    dimensions:
      {{- .Values.thresholdConfig.dimensions | toYaml | nindent 6 }}
    {{- end }}
    {{- if .Values.thresholdConfig.state_filters }}
    state_filters:
      {{- .Values.thresholdConfig.state_filters | toYaml | nindent 6 }}
    {{- end }}
    {{- /* #2028: TOP-LEVEL sibling of defaults, read ONLY from this root
           carrier. Checked BEFORE the truthy guard for the same reason as
           optional_overrides above: a mistyped value must fail loudly, not be
           indistinguishable from "unset". A non-integer would otherwise reach
           the exporter's decode of the WHOLE _defaults.yaml and fail it. */}}
    {{- $cap := .Values.thresholdConfig.max_metrics_per_tenant }}
    {{- if not (kindIs "invalid" $cap) }}
    {{- if not (or (kindIs "int" $cap) (kindIs "int64" $cap) (kindIs "float64" $cap)) }}
    {{- fail (printf "thresholdConfig.max_metrics_per_tenant must be an integer, got %s" (kindOf $cap)) }}
    {{- end }}
    {{- if ne (float64 $cap) (floor (float64 $cap)) }}
    {{- fail (printf "thresholdConfig.max_metrics_per_tenant must be an integer, got %v" $cap) }}
    {{- end }}
    {{- if ne (int64 $cap) 0 }}
    max_metrics_per_tenant: {{ int64 $cap }}
    {{- end }}
    {{- end }}
  # Per-tenant YAML files — one key per tenant
  {{- range $tenant, $overrides := .Values.thresholdConfig.tenants }}
  {{ $tenant }}.yaml: |
    tenants:
      {{ $tenant }}:
        {{- $overrides | toYaml | nindent 8 }}
  {{- end }}
{{- end }}
