apiVersion: v1
kind: ConfigMap
metadata:
  name: threshold-config
  namespace: monitoring
  labels:
    app: threshold-exporter
data:
  # _defaults.yaml — loaded first (underscore prefix sorts before letters)
  # Contains global defaults and state_filters (platform-managed)
  _defaults.yaml: |
    defaults:
      {{- .Values.thresholdConfig.defaults | toYaml | nindent 6 }}
    {{- if .Values.thresholdConfig.optional_overrides }}
    {{- /* #1310: TOP-LEVEL key, sibling of defaults/state_filters — NOT a child
           of defaults. It is a LIST of key names the platform recognises but
           asserts no value for (ThresholdConfig.OptionalOverrides []string);
           nesting it under defaults would decode as a threshold value. */}}
    optional_overrides:
      {{- .Values.thresholdConfig.optional_overrides | toYaml | nindent 6 }}
    {{- end }}
    {{- if .Values.thresholdConfig.state_filters }}
    state_filters:
      {{- .Values.thresholdConfig.state_filters | toYaml | nindent 6 }}
    {{- end }}
  # Per-tenant YAML files — one key per tenant
  {{- range $tenant, $overrides := .Values.thresholdConfig.tenants }}
  {{ $tenant }}.yaml: |
    tenants:
      {{ $tenant }}:
        {{- $overrides | toYaml | nindent 8 }}
  {{- end }}
