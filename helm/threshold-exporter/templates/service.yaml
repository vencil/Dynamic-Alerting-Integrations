apiVersion: v1
kind: Service
metadata:
  name: threshold-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: threshold-exporter
    # Platform scrape discovery (#1425): Prometheus' `platform-components` job
    # keeps Services carrying this label in ANY namespace, so the release
    # namespace is listed nowhere. A literal, not a value: the scrape contract
    # is the chart's, and scripts/tools/lint/check_scrape_reachability.py
    # matches it against that job.
    dynamic-alerting.io/scrape: platform
  annotations:
    # prometheus.io/port is the container port (service.port is both, see
    # deployment.yaml), never a free value: Prometheus' platform-components job
    # keeps only the endpoint whose port equals it (#3483), so a stale literal
    # drops every exporter target. Setting it in service.annotations to
    # anything else fails the render.
    {{- $ann := .Values.service.annotations | default dict }}
    {{- if and (hasKey $ann "prometheus.io/port") (ne (toString (index $ann "prometheus.io/port")) (toString .Values.service.port)) }}
    {{- fail (printf "service.annotations prometheus.io/port=%v differs from service.port=%v: the platform-components job keeps only the endpoint on the annotated port, so every exporter target would be dropped. Remove the annotation; it is derived from service.port." (index $ann "prometheus.io/port") .Values.service.port) }}
    {{- end }}
    prometheus.io/port: {{ .Values.service.port | quote }}
    {{- with omit $ann "prometheus.io/port" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
  selector:
    app: threshold-exporter
