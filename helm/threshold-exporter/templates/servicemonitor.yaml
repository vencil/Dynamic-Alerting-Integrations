{{- if eq .Values.rules.mode "operator" }}
{{- if .Values.rules.operator.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: da-threshold-exporter
  namespace: {{ .Release.Namespace | default "monitoring" }}
  labels:
    app: threshold-exporter
    app.kubernetes.io/part-of: dynamic-alerting
    {{- with .Values.rules.operator.serviceMonitor.labels }}
    {{- range $k, $_ := . }}
    {{- if or (eq $k "app") (eq $k "app.kubernetes.io/part-of") }}
    {{- fail (printf "rules.operator.serviceMonitor.labels must not set %q — the chart sets it" $k) }}
    {{- end }}
    {{- end }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: threshold-exporter
  endpoints:
  - port: http
    interval: {{ .Values.rules.operator.serviceMonitor.interval | default "15s" }}
    path: /metrics
{{- end }}
{{- end }}
