# Default values for threshold-exporter
replicaCount: 2

image:
  repository: ghcr.io/vencil/threshold-exporter
  # tag 留空 → template 自動推導為 v<Chart.appVersion>（= published image），單一 SoT、不漂移。
  # 需覆寫才設此值。本機 kind-load 開發改用 `-f environments/local/threshold-exporter.yaml`（pin :dev + pullPolicy Never）。
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  # prometheus.io/port is not set here: the Service template derives it from
  # service.port (the container port), #3483.
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"

# NetworkPolicy for the exporter pods, rendered into the release namespace
# (#1425). Before #1425 these were two raw manifests pinned to `monitoring`
# (k8s/03-monitoring/network-policies.yaml); a release installed anywhere else
# got none, so the exporter silently lost its ingress isolation.
# Ingress: the metrics port only. Egress: DNS only — the exporter reads its
# mounted ConfigMap and talks to nothing else.
networkPolicy:
  enabled: true
  # true (default): any pod may reach the metrics port; the policy restricts
  # the port, not the source. The chart cannot know your scraper's labels —
  # kube-prometheus-stack's pods carry `app.kubernetes.io/name: prometheus`,
  # not `app: prometheus`, and vmagent / a blackbox probe differ again — so a
  # guessed default would silently cut the scrape instead.
  # false: only pods matching prometheusPodLabels in prometheusNamespace; both
  # must then be set, and the chart refuses to render without them.
  allowExternal: true
  # Namespace your scraper runs in. Read only when allowExternal is false.
  prometheusNamespace: ""
  # Labels of your scraper's pods. Read only when allowExternal is false.
  # Must not be empty then: an empty selector matches EVERY pod in
  # prometheusNamespace, so the chart refuses it.
  prometheusPodLabels: {}

# Exporter runtime config
exporter:
  listenAddr: ":8080"
  reloadInterval: "30s"    # How often to check config file for changes
  # #459 memory levers (default off = unchanged Go runtime behavior).
  # Reach for these only under abnormally high reload cadence; see
  # docs/integration/deployment-sizing.md before tuning.
  #
  # goMemLimit: Go soft heap ceiling (GOMEMLIMIT env, Go 1.19+). Empty =
  # unset (effectively unlimited). When set, the runtime paces GC harder
  # near the limit and returns idle pages to the OS sooner — the primary
  # bound on go_memstats_sys_bytes / heap_idle creep. Accepts the Go suffix
  # form, e.g. "96MiB". Keep it ABOVE steady-state heap_inuse and BELOW the
  # container memory limit (a good start: ~75% of resources.limits.memory).
  goMemLimit: ""
  # freeOsMemAfterReload: call runtime/debug.FreeOSMemory() after each reload
  # (one extra STW GC per reload). Off by default; turn on only if GOMEMLIMIT
  # alone doesn't bound the creep AND reload cadence is low enough that the
  # per-reload GC cost is negligible.
  freeOsMemAfterReload: false

# Generic env injection — #607, mirroring helm/vector + helm/victorialogs +
# helm/chargeback-aggregator so operators have one consistent shape across
# platform charts. Escape hatch for env the chart does not model as a
# first-class field (HTTP_PROXY, APM agent vars, custom cert paths…); wire
# Secret refs via valueFrom / extraEnvFrom. For memory tuning prefer the
# dedicated exporter.goMemLimit above — it is discoverable, typed, and paired
# with freeOsMemAfterReload.
# COLLISION: extraEnv is rendered AFTER the dedicated fields, so a duplicate
# key here (e.g. GOMEMLIMIT) overrides the dedicated value via K8s
# last-one-wins. The escape hatch always has final say.
extraEnv: []
extraEnvFrom: []

# Threshold config (embedded in ConfigMap)
# This is the actual alerting threshold configuration.
# See config/conf.d/ directory for the reference multi-file format.
# For multi-DB examples (Redis, MongoDB, Elasticsearch), see:
#   config/conf.d/examples/ and migration-guide.md §7 (維度標籤)
#
# defaults 為生成段（#1200 WS1a PR-2）：內容＝threshold-registry 裡
# arming: default 的 key——kubernetes pack＝Scenario B container 閾值、mariadb pack
# ＝Scenario A MySQL 閾值、postgresql pack＝pg warning 兩鍵（#1200 Q3=C /
# D4 folding 拍板升格，2026-07-25）。改值走 rule-packs/threshold-registry.yaml ＋
# check_threshold_registry.py --regen；緊接的 helm-unarmed 註解段列出規則包會讀、
# chart 卻不出貨的 key 與原因（D-A A1）；出貨集增減是 D4 家族產品拍板，
# 勿在此手改。
# 史料：mysql_cpu 80→30 校準（#944）時本 chart 副本是最後被漏掉的一份
# （#1200 WS1a 反向稽核補正）；改為生成段後該類漂移由 gate 根除。該 key 已於
# #1231 改名為 mysql_threads_running（毒名退役，2-release alias 過渡窗）。
thresholdConfig:
  defaults:
    # >>> GENERATED:threshold-registry:helm-defaults — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
    # ── kubernetes：Kubernetes (cAdvisor + KSM) ──
    # % — Container CPU % of limit (weakest link)（critical 加嚴 opt-in：container_cpu_critical，registry
    # 建議 95）
    container_cpu: 80
    # % — Chronic CFS throttle: % of ACTIVE 100ms periods throttled, NOT % CPU lost (critical tier
    # opt-in via container_cpu_throttle_critical, declared in optional_overrides; #944)（critical 加嚴
    # opt-in：container_cpu_throttle_critical，registry 建議 50）
    container_cpu_throttle: 25
    # % — Container memory % of limit (weakest link)（critical 加嚴
    # opt-in：container_memory_critical，registry 建議 95）
    container_memory: 85
    # ── postgresql：PostgreSQL (postgres_exporter) ──
    # % of max_connections — Connection usage % warning（critical 加嚴
    # opt-in：pg_connections_critical，registry 建議 90）
    pg_connections: 80
    # seconds — Replication lag warning（critical 加嚴 opt-in：pg_replication_lag_critical，registry 建議
    # 60）
    pg_replication_lag: 30
    # ── mariadb：MariaDB / MySQL (mysqld_exporter) ──
    # % of max_connections — Connection usage warning: threads_connected as a share of
    # max_connections, per instance, busiest instance per tenant; 80 = PMM "MySQL connections in
    # use" template / awesome-prometheus-alerts. Replaces the absolute-count key mysql_connections
    # (#3778: a unit change is a removal plus an addition, no alias)（critical 加嚴
    # opt-in：mysql_connection_usage_percent_critical，registry 建議 90）
    mysql_connection_usage_percent: 80
    # seconds — Async replication lag warning (seconds behind primary, sql_delay-adjusted); 30 =
    # APA/mysqld-mixin consensus trigger (they page critical at 30s; demoted to warning — PMM's
    # lag-template family default is 600s warning). Enabled by default (#1200 WS5-P0-a
    # Q3=C)（critical 加嚴 opt-in：mysql_replication_lag_critical，registry 建議 120）
    mysql_replication_lag: 30
    # ── elasticsearch：Elasticsearch (elasticsearch_exporter) ──
    # % — JVM heap usage warning; #1196 C identity fix: renamed from es_jvm_memory_used_percent
    # (alert demands es_heap_usage_percent) — unwired dead key, no alias（critical 加嚴
    # opt-in：es_heap_usage_percent_critical，registry 建議 90）
    es_heap_usage_percent: 85
    # % — Disk USAGE % warning (used = 1 - available/size, recording rule
    # tenant:es_disk_usage_percent:max, compared with >); 85 = same band as oracle/db2
    # tablespace_used_percent; #1196 C semantic flip: replaces es_filesystem_free_percent 15 (FREE
    # %) — carrying 15 into a used-% rule would fire permanently（critical 加嚴
    # opt-in：es_disk_usage_percent_critical，registry 建議 90）
    es_disk_usage_percent: 85
    # ── oracle：Oracle Database (oracledb_exporter) ──
    # % — Tablespace usage warning（critical 加嚴
    # opt-in：oracle_tablespace_used_percent_critical，registry 建議 95）
    oracle_tablespace_used_percent: 85
    # <<< GENERATED:threshold-registry:helm-defaults
    # >>> GENERATED:threshold-registry:helm-unarmed — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
    # 下列 key 規則包會讀，但 chart 預設不出貨值：helm install 後對應的告警不會響。用 chart 自建的 ConfigMap 時，在上面的 defaults 補值；設了
    # thresholdConfig.existingConfigMap 時 chart 不讀這裡，要在那個 ConfigMap 的來源補值（其 <key>_critical 也要先有 base
    # 值）。原因取自 threshold-registry 的 arming、portability 與 blocker 欄位。
    # ── redis ──
    #   redis_memory_used_bytes 未啟用（待改比值）：絕對位元組跨部署沒有意義；可攜的形式是佔 maxmemory
    #     的比例（redis_memory_max_bytes），待 #1320
    #   redis_connected_clients 未啟用（待改比值）：絕對連線數跨部署沒有意義；可攜的形式是佔 maxclients
    #     的比例（redis_config_maxclients），待 #1320
    #   redis_evicted_keys_rate 未啟用（依部署而定）：LRU 快取淘汰是常態，可容忍的速率取決於工作負載
    #   redis_replication_lag 未啟用（可攜，待驗證）：這個值可跨部署沿用，但還沒通過出貨驗證（綁定 promtool 測試、登記廠商或共識依據），通過後才出貨
    # ── mongodb ──
    #   mongodb_connections_current 未啟用（待改比值）：絕對連線數跨部署沒有意義；可攜的形式是佔「已用＋可用」連線的比例，待 #1320
    #   mongodb_replication_lag 未啟用（可攜，待驗證）：這個值可跨部署沿用，但還沒通過出貨驗證（綁定 promtool 測試、登記廠商或共識依據），通過後才出貨
    #   mongodb_opcounters_rate 未啟用（依部署而定）：操作量是工作負載而非故障，任何數字都只適用於特定部署
    # ── elasticsearch ──
    #   es_pending_tasks 未啟用（依部署而定）：正常的 pending task 量隨叢集規模與變更頻率而定
    #   es_search_latency_ms 未啟用（依部署而定）：可接受的搜尋延遲是各部署的服務等級選擇
    # ── oracle ──
    #   oracle_sessions_active 未啟用（待改比值）：絕對 session 數跨部署沒有意義（#1176 量到良性尖峰 240）；可攜的形式是佔 SESSIONS
    #     上限的比例，待 #1320
    #     ⚠ 參考庫實測反例（#1176）：健康的日夜週期尖峰會到 240 個 active session —— 此值會對正常運作誤警；這個數字是起點，不是平台背書的值
    # ── db2 ──
    #   db2_connections_active 未啟用（待改比值）：絕對連線數跨部署沒有意義（#1176 量到良性尖峰 360）；可攜的形式是佔 MAXAPPLS 的比例，待 #1320
    #     ⚠ 參考庫實測反例（#1176）：尖峰時段的工作負載會到 360 個連線 —— 此值會對正常運作誤警；這個數字是起點，不是平台背書的值
    #   db2_bufferpool_hit_ratio 未啟用（依部署而定）：交易型與分析型工作負載的合理命中率不同
    #   db2_lock_wait_time 未啟用（依部署而定）：可容忍的鎖等待累積量取決於工作負載與延遲預算
    #     ⚠ 參考庫實測反例（#1176）：良性批次的 lock-wait 短暫維持 18 s/s 達 7 分鐘（negative-db2.yaml） ——
    #     此值會對正常運作誤警；這個數字是起點，不是平台背書的值
    # ── clickhouse ──
    #   clickhouse_queries_rate 未啟用（依部署而定）：查詢量是工作負載而非故障，任何數字都只適用於特定部署
    #   clickhouse_active_connections 未啟用（待改比值）：絕對連線數跨部署沒有意義；上限（max_connections）目前沒有匯出，分母由 #1320 決定
    # ── kafka ──
    #   kafka_consumer_lag 未啟用（依部署而定）：可容忍的訊息延遲隨各 topic 的吞吐量而定
