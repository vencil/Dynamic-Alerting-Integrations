  # ⛔ 內容只含 optional_overrides tier 的「平鍵」，不含任何 `<base>_critical`：
  # 那些的解析走 resolveCriticalRows，它讀 defaults[base]，base 沒值就丟棄整列，
  # 列進來只會是裝飾（#1311）。
