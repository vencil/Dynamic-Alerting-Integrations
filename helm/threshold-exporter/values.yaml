  # 維度讀，就在這裡加上 base 與 label（regex 選擇器送出 <label>_re，要宣告的是那個名稱）。
  # 改出貨內容走 scaffold_tenant.RULE_PACKS ＋ --regen。
  dimensions:
    # >>> GENERATED:threshold-registry:helm-dimensions — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
    container_cpu: [version]
    container_memory: [version]
    # <<< GENERATED:threshold-registry:helm-dimensions

  # 每租戶指標上限（#2028）：一個租戶最多發射幾條 threshold series，超過的會被截斷，
  # 並由 da_tenant_metrics_over_limit{tenant} > 0 回報。留空（null）或 0 ＝內建 500；
  # ⚠️ 負值＝完全不截斷（關掉這道防線），只在確定需要時使用。
  # 只會寫進根目錄的 _defaults.yaml——租戶檔、子目錄的 _defaults.yaml 裡的同名 key
  # 一律被 exporter 忽略並記 WARN（租戶不能替自己調高上限）。
  # 在 #2028 之前，目錄模式（本 chart 的執行模式）完全不讀這個 key。
  max_metrics_per_tenant: null

  # Scenario C: State-based monitoring filters
  # Each filter maps to kube_pod_container_status_waiting_reason values.
  # Enabled by default for all tenants; per-tenant disable via _state_<name>: "disable"
  state_filters:
    container_crashloop:
      reasons: ["CrashLoopBackOff"]
      severity: "critical"
    container_imagepull:
      reasons: ["ImagePullBackOff", "InvalidImageName"]
      severity: "warning"
    # Scenario D: Maintenance mode — unless 攔截所有常規警報
    # default_state: disable → 預設不啟用; 租戶透過 _state_maintenance: "enable" 開啟
    maintenance:
      reasons: []
      severity: "info"
      default_state: "disable"

  # Tenant overrides — 客戶依自身環境設定，chart 預設不帶任何測試租戶。
  # 透過 values-override.yaml 或 GitOps 注入，例如：
  #   tenants:
  #     db-a:
  #       mysql_connection_usage_percent: "70"
  #       container_cpu: "70"
  #     db-b:
  #       mysql_connection_usage_percent: "85"
  #       _state_container_crashloop: "disable"
  #
  # 開發/測試環境請使用 environments/local/threshold-exporter.yaml
  # 完整範例參見 config/conf.d/examples/
  tenants: {}

  # #1425: name of a ConfigMap this chart must NOT create — it mounts that
  # one instead. Use it when something else owns the thresholds, e.g.
  # `da-tools init --deploy kustomize`, whose tree builds `threshold-config`
  # from conf.d/: install with
  #   --set thresholdConfig.existingConfigMap=threshold-config
  # in the SAME namespace as the kustomize tree. Left empty, the chart renders
  # `threshold-config` from the values above. Set, every other
  # thresholdConfig.* value is ignored (nothing renders them).
  existingConfigMap: ""

# Rules deployment mode: configmap (default) or operator (CRD-based).
# This chart does NOT ship Rule Packs in either mode — the mode only decides
# whether it renders a ServiceMonitor for the exporter (operator) or not.
# - configmap (Path A): mount k8s/03-monitoring/configmap-rules-*.yaml into
#   your Prometheus yourself.
# - operator (Path B): generate PrometheusRule / ServiceMonitor CRDs with
#   `da-tools operator-generate`; Alertmanager routing is rendered by
#   `da-tools generate-routes` into alertmanager.yaml and given to the
#   Alertmanager as its configSecret, not AlertmanagerConfig CRDs (#3572) —
#   per ADR-008 the chart stays path-agnostic (#2073).
# IMPORTANT: Do NOT mix modes in the same cluster's Alertmanager.
rules:
  mode: configmap    # configmap | operator
  # Operator-mode settings (only used when mode: operator)
  operator:
    # ServiceMonitor for threshold-exporter scraping
    serviceMonitor:
      enabled: true
      interval: 15s
      # Extra labels so Prometheus's serviceMonitorSelector picks it up (#2075).
      # kube-prometheus-stack's default selector matches `release: <its Helm
      # release name>`; the default below matches `da-tools operator-generate`.
      # Set `release` to your stack's release name, or `release: null` to drop
      # it. `app` and `app.kubernetes.io/part-of` are set by the chart and
      # cannot be overridden.
      labels:
        release: kube-prometheus-stack

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Config validation (#3353): a CronJob that runs `da-tools validate-config` —
# the rows CI runs, with the same severities (the shared key verdict,
# ADR-038; the yaml_quoting row, #3764) — on the ConfigMap the exporter
# reads. It judges a tree that reached that ConfigMap WITHOUT CI — a commit
# straight to git, a ConfigMap sync. (tenant-api's `direct` writes stay in
# its pod and never reach this ConfigMap; they are not judged here, nor
# served.) A FAIL row fails the Job, and
# the platform rule CronJobLastRunFailed (rule-pack-platform) fires —
# ⚠️ that rule watches the `monitoring` namespace only, so install this
# release there for the alert to cover it. The findings are in the Job's log
# (`kubectl logs job/<name>`).
#
# Memory is NOT a second number: it is resources.limits.memory above ×
# memoryFactor (templates/_helpers.tpl), so raising the exporter for more
# tenants raises this with it; a factor too small fails the Job (OOM), and
# the same alert fires.
#
# ⚠️ The image's validate-config is the one of its tools/v* tag: v2.9.0's
# predates yaml_quoting, the shared key verdict, guard_errors
# and json_schema, so with it this judges far less than CI on main does.
# Bump `image.tag` to the next tools/v* release (bump_docs.py --tools does it).
configValidation:
  enabled: false
  schedule: "*/15 * * * *"
  # Measured validate-config peak / exporter load RSS: 2.5× at 500 tenants,
  # 3.2× at 5000 (synthetic-v2). A positive integer.
  memoryFactor: 4
  # A run past this is killed and counts as failed (5000 tenants took ~3.5
  # minutes in the measurement above).
  activeDeadlineSeconds: 1800
  cpuRequest: 100m
  image:
    repository: ghcr.io/vencil/da-tools
    tag: "v2.9.0"
    # Optional digest pin (supply-chain; #566 T5 / #902). Empty = tag only.
    digest: ""
    pullPolicy: IfNotPresent

# startupProbe covers the startup config load (#2153). The exporter loads
# the whole conf.d tree BEFORE its HTTP server starts, so /health refuses
# connections for as long as that load takes. Without a startupProbe the
# livenessProbe below (10s delay, 10s period, 3 failures) restarts a Pod
# whose load runs past roughly 30-40s, and every restart starts the load
# over: a CrashLoop that never finishes loading. A single file declaring
# 2000 tenants was measured at 30s to load, 4000 at about 3 minutes; the
# load time is reported as da_config_initial_load_duration_seconds.
# Liveness and readiness probes do not run until this probe succeeds.
# Budget = periodSeconds × failureThreshold = 10s × 60 = 10 minutes: raise
# failureThreshold if your trees load slower. To use an exec or tcpSocket
# handler instead, also set `httpGet: null` (Helm merges maps, so the
# default httpGet would otherwise stay). Set `startupProbe: null` to omit it.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
