    #   rabbitmq_node_mem_percent 未啟用（值有爭議，#3929）：沒有廠商或上游來源用 80；查到量同一件事的兩個來源（Grafana
    #     rabbitmq-mixin、awesome-prometheus-alerts）都在 90 告警。
    #   rabbitmq_connections 未啟用（待改比值）：絕對連線數跨部署沒有意義；exporter 的 sockets_used／sockets_available
