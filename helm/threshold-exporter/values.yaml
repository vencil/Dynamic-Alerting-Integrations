# Default values for threshold-exporter
replicaCount: 2

image:
  repository: ghcr.io/vencil/threshold-exporter
  # tag 留空 → template 自動推導為 v<Chart.appVersion>（= published image），單一 SoT、不漂移。
  # 需覆寫才設此值。本機 kind-load 開發改用 `-f environments/local/threshold-exporter.yaml`（pin :dev + pullPolicy Never）。
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

# Exporter runtime config
exporter:
  listenAddr: ":8080"
  reloadInterval: "30s"    # How often to check config file for changes
  # #459 memory levers (default off = unchanged Go runtime behavior).
  # Reach for these only under abnormally high reload cadence; see
  # docs/integration/deployment-sizing.md before tuning.
  #
  # goMemLimit: Go soft heap ceiling (GOMEMLIMIT env, Go 1.19+). Empty =
  # unset (effectively unlimited). When set, the runtime paces GC harder
  # near the limit and returns idle pages to the OS sooner — the primary
  # bound on go_memstats_sys_bytes / heap_idle creep. Accepts the Go suffix
  # form, e.g. "96MiB". Keep it ABOVE steady-state heap_inuse and BELOW the
  # container memory limit (a good start: ~75% of resources.limits.memory).
  goMemLimit: ""
  # freeOsMemAfterReload: call runtime/debug.FreeOSMemory() after each reload
  # (one extra STW GC per reload). Off by default; turn on only if GOMEMLIMIT
  # alone doesn't bound the creep AND reload cadence is low enough that the
  # per-reload GC cost is negligible.
  freeOsMemAfterReload: false

# Generic env injection — #607, mirroring helm/vector + helm/victorialogs +
# helm/chargeback-aggregator so operators have one consistent shape across
# platform charts. Escape hatch for env the chart does not model as a
# first-class field (HTTP_PROXY, APM agent vars, custom cert paths…); wire
# Secret refs via valueFrom / extraEnvFrom. For memory tuning prefer the
# dedicated exporter.goMemLimit above — it is discoverable, typed, and paired
# with freeOsMemAfterReload.
# COLLISION: extraEnv is rendered AFTER the dedicated fields, so a duplicate
# key here (e.g. GOMEMLIMIT) overrides the dedicated value via K8s
# last-one-wins. The escape hatch always has final say.
extraEnv: []
extraEnvFrom: []

# Threshold config (embedded in ConfigMap)
# This is the actual alerting threshold configuration.
# See config/conf.d/ directory for the reference multi-file format.
# For multi-DB examples (Redis, MongoDB, Elasticsearch), see:
#   config/conf.d/examples/ and migration-guide.md §7 (維度標籤)
#
# defaults 為生成段（#1200 WS1a PR-2）：內容＝threshold-registry 的
# chart_default 集——kubernetes pack＝Scenario B container 閾值、mariadb pack
# ＝Scenario A MySQL 閾值、postgresql pack＝pg warning 兩鍵（#1200 Q3=C /
# D4 folding 拍板升格，2026-07-25）。改值走 scaffold_tenant.RULE_PACKS ＋
# check_threshold_registry.py --regen；出貨集增減是 D4 家族產品拍板，
# 勿在此手改。
# 史料：mysql_cpu 80→30 校準（#944）時本 chart 副本是最後被漏掉的一份
# （#1200 WS1a 反向稽核補正）；改為生成段後該類漂移由 gate 根除。該 key 已於
# #1231 改名為 mysql_threads_running（毒名退役，2-release alias 過渡窗）。
thresholdConfig:
  defaults:
    # >>> GENERATED:threshold-registry:helm-defaults — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
    # ── kubernetes：Kubernetes (cAdvisor + KSM) ──
    # % — Container CPU % of limit (weakest link)
    container_cpu: 80
    # % — Chronic CFS throttle: % of ACTIVE 100ms periods throttled, NOT % CPU lost (critical tier
    # opt-in via container_cpu_throttle_critical, suggest 50; #944)
    container_cpu_throttle: 25
    # % — Container memory % of limit (weakest link)
    container_memory: 85
    # ── postgresql：PostgreSQL (postgres_exporter) ──
    # % of max_connections — Connection usage % warning（critical 加嚴
    # opt-in：pg_connections_critical，registry 建議 90）
    pg_connections: 80
    # seconds — Replication lag warning（critical 加嚴 opt-in：pg_replication_lag_critical，registry 建議
    # 60）
    pg_replication_lag: 30
    # ── mariadb：MariaDB / MySQL (mysqld_exporter) ──
    # count — Max threads_connected warning（critical 加嚴 opt-in：mysql_connections_critical，registry
    # 建議 120）
    mysql_connections: 80
    # threads — threads_running saturation, NOT host CPU% — running-threads 1m-avg warning; 80→30 =
    # PMM/Nichter 'high' (#944); renamed from mysql_cpu (#1231 owner-approved reversal of the #944
    # keep — 2-release alias window, old spelling still resolves)（critical 加嚴
    # opt-in：mysql_threads_running_critical，registry 建議 50）
    mysql_threads_running: 30
    # seconds — Async replication lag warning (seconds behind primary, sql_delay-adjusted); 30 =
    # APA/mysqld-mixin consensus trigger (they page critical at 30s; demoted to warning — PMM's
    # lag-template family default is 600s warning). Enabled by default (#1200 WS5-P0-a
    # Q3=C)（critical 加嚴 opt-in：mysql_replication_lag_critical，registry 建議 120）
    mysql_replication_lag: 30
    # <<< GENERATED:threshold-registry:helm-defaults

  # optional_overrides 為生成段（#1310）——這一格的語意是「平台認得這個 key，
  # 但不主張它的值」。列在此的 key 通過租戶端 key 驗證（租戶可在自己的 conf.d
  # 設它並生效，exporter 的 resolveDeclaredRows 只在租戶給了值時發射），而平台
  # 自己不發射任何值：租戶不設＝靜默，沒有平台回退，那正是這一格存在的理由。
  #
  # ⛔ 這不是「defaults 的候補名單」。把 key 從這裡搬進上面的 defaults ＝ 對每一個
  # 租戶都武裝一個平台選的數字，那是 D4 家族產品拍板，不是機械編輯。
  # ⛔ 內容只含 optional_overrides tier 的「平鍵」，不含任何 `<base>_critical`：
  # 那些的解析走 resolveCriticalRows，它讀 defaults[base]，base 沒值就丟棄整列，
  # 列進來只會是裝飾（#1311）。
  # 改內容走 scaffold_tenant.RULE_PACKS ＋ check_threshold_registry.py --regen。
  optional_overrides:
    # >>> GENERATED:threshold-registry:helm-optional — generated block, DO NOT EDIT（改 scaffold_tenant.RULE_PACKS 後跑 check_threshold_registry.py --regen）
    # ── oracle：Oracle Database (oracledb_exporter) ──
    - oracle_wait_time_rate   # s/s — Wait time rate (5m)
    - oracle_process_count   # count — Active processes warning
      # ⚠ 參考庫實測反例（#1176）：例行備份批次會到 560 個 process —— 此值會對正常運作誤警；這個數字是起點，不是平台背書的值
    - oracle_pga_allocated_bytes   # bytes (4GB) — PGA allocation warning
      # ⚠ 參考庫實測反例（#1176）：計畫性 stats-gather 會用到 22 GB PGA —— 此值會對正常運作誤警；這個數字是起點，不是平台背書的值
    # ── db2：IBM DB2 (ibm_db2_exporter) ──
    - db2_log_usage_percent   # % — Transaction log usage warning
    - db2_deadlock_rate   # count/s — Deadlock rate (5m)
      # ⚠ 參考庫實測反例（#1176）：真實的 ~90/min deadlock storm 低於 5/s（＝300/min），因此接不到 ——
      # 此值接不到該抓的故障；這個數字是起點，不是平台背書的值
    - db2_tablespace_used_percent   # % — Tablespace usage warning
    # ── clickhouse：ClickHouse (built-in /metrics) ──
    - clickhouse_max_part_count   # count — Max part count per partition
    - clickhouse_replication_queue   # count — Replication queue size
    - clickhouse_memory_tracking_bytes   # bytes (8GB) — Memory tracking warning
    # <<< GENERATED:threshold-registry:helm-optional

  # Scenario C: State-based monitoring filters
  # Each filter maps to kube_pod_container_status_waiting_reason values.
  # Enabled by default for all tenants; per-tenant disable via _state_<name>: "disable"
  state_filters:
    container_crashloop:
      reasons: ["CrashLoopBackOff"]
      severity: "critical"
    container_imagepull:
      reasons: ["ImagePullBackOff", "InvalidImageName"]
      severity: "warning"
    # Scenario D: Maintenance mode — unless 攔截所有常規警報
    # default_state: disable → 預設不啟用; 租戶透過 _state_maintenance: "enable" 開啟
    maintenance:
      reasons: []
      severity: "info"
      default_state: "disable"

  # Tenant overrides — 客戶依自身環境設定，chart 預設不帶任何測試租戶。
  # 透過 values-override.yaml 或 GitOps 注入，例如：
  #   tenants:
  #     db-a:
  #       mysql_connections: "70"
  #       container_cpu: "70"
  #     db-b:
  #       mysql_connections: "100"
  #       _state_container_crashloop: "disable"
  #
  # 開發/測試環境請使用 environments/local/threshold-exporter.yaml
  # 完整範例參見 config/conf.d/examples/
  tenants: {}

# Rules deployment mode: configmap (default) or operator (CRD-based)
# - configmap: Rule Packs mounted as ConfigMap via projected volume (Path A)
# - operator: Rule Packs deployed as PrometheusRule CRD (Path B)
# See ADR-008 for architecture details.
# IMPORTANT: Do NOT mix modes in the same cluster's Alertmanager.
rules:
  mode: configmap    # configmap | operator
  # Operator-mode settings (only used when mode: operator)
  operator:
    # PrometheusRule labels for Operator ruleSelector matching
    ruleLabels:
      prometheus: kube-prometheus
    # ServiceMonitor for threshold-exporter scraping
    serviceMonitor:
      enabled: true
      interval: 15s
    # AlertmanagerConfig receiver template
    # Supported: slack, pagerduty, email, teams, opsgenie, webhook
    receiverTemplate: webhook
    # K8s Secret reference for receiver credentials
    # NEVER put plaintext credentials in values.yaml
    secretRef:
      name: ""       # e.g. da-alerts-secret
      key: ""        # e.g. webhook-url

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
