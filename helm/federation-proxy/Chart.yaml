apiVersion: v2
name: federation-proxy
description: Tenant federation label-injection proxy (ADR-020 Layer 3) — prom-label-proxy that force-injects a per-tenant matcher into every PromQL query and metadata-API call
type: application
# version: Helm Chart 版本（隨 Chart 結構/模板變更升級）
# 0.1.2 — #902 L2: pin prom-label-proxy by digest (image.digest knob) — supply-chain
# 0.1.3 — #1243: v0.13.0 -> v0.14.0 and quay.io -> docker.io (upstream never pushed
#         v0.14.0 to quay; quay's tags are frozen at the 2026-04-21 build)
# 0.1.4 — #1269: names the content 0.1.3 carried after it was cut. The image moved
#         v0.14.0 -> v0.15.1 -> v0.16.2 (tag + digest; #2329, #3784) without a version
#         bump, so "0.1.3" named three packages; appVersion catches up to v0.16.2.
#         No value keys change
# 0.2.0 — #3807: the NetworkPolicy also restricts egress, to DNS and the upstream's port in the upstream's namespace (`networkPolicy.upstreamNamespace`, else read from upstream.url `<svc>.<ns>.svc`). Before, the proxy had no egress at all in a namespace that defaults to deny, as k8s/03-monitoring does, so every federated query failed at the proxy. ⚠️ BREAKING: an upstream.url host that is not a Service name (external FQDN, IP) fails the render until upstreamNamespace is set or `networkPolicy.restrictEgress: false`; the rule matches the destination POD port: where the upstream Service maps ports, set `networkPolicy.upstreamPort`
version: 0.2.0
# appVersion: pinned prom-label-proxy release
appVersion: "v0.16.2"
# kubeVersion: the deployment uses the native preStop.sleep lifecycle
# action, beta-on-by-default since Kubernetes 1.29.
kubeVersion: ">=1.29.0-0"
keywords:
  - dynamic-alerting
  - tenant-federation
  - prom-label-proxy
  - multi-tenancy
home: https://github.com/vencil/Dynamic-Alerting-Integrations
maintainers:
  - name: vencil
