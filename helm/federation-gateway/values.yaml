# federation-gateway Helm values
# Reference: ADR-020 — Tenant Federation, Layer 2 (API gateway)
#
# The gateway sits in front of the Layer 3 proxy (IV-2a federation-proxy)
# and is the compensating control for not having a server-side token
# revocation list at signing time. Per request, in cheap-before-expensive
# order, Envoy:
#   1. coarse per-client-IP rate limit  (anti-flood before any crypto)
#   2. RS256 JWT verify + jwt_cache     (envoy.filters.http.jwt_authn)
#   3. revoked-set check + tenant wiring (Lua filter)
#   4. per-token + per-tenant rate limit (Sybil defense)
#
# A request only reaches the upstream if all four pass.

# prom-label-proxy | vm-cluster | victorialogs
#   prom-label-proxy — inject the verified tenant id as a trusted header
#                      and forward to the federation-proxy service (IV-2a).
#   vm-cluster       — rewrite the path to /select/<tenant_id>/prometheus/
#                      and forward to a VictoriaMetrics cluster vmselect
#                      (ADR-020: VM-cluster isolation is accountID routing,
#                      done here rather than by a Layer 3 proxy).
#   victorialogs     — tenant LOG query (ADR-021). Inject the verified
#                      numeric AccountID + ProjectID header pair (VictoriaLogs
#                      native tenancy) and forward to the VictoriaLogs store.
#                      The Lua filter FAILS CLOSED if the token has no valid
#                      account_id claim; routing is a default-deny allowlist of
#                      the LogsQL query/metadata endpoints (see victorialogs.*).
#                      ⚠️ this mode REQUIRES jwt.audience=tenant-federation-logs
#                      (a metrics-pull token must not query the log store) —
#                      enforced at template render (fail-loud).
mode: prom-label-proxy

# Emergency global kill switch (#551). false in steady state. Set true
# — via a GitOps commit — to make the gateway direct_respond 503 to
# EVERY request: no traffic reaches the Layer 3 proxy or the storage
# backend. Use it in a federation incident (a prom-label-proxy 0-day, a
# storage meltdown) to shed all federation load at once, instead of
# revoking tenants' tokens one by one. Takes effect after the GitOps
# sync + pod reload (~3 min); for an instant cut see the chart README
# ("Emergency global block").
emergencyGlobalBlock: false

replicaCount: 2

image:
  # renovate: datasource=docker depName=envoyproxy/envoy
  repository: envoyproxy/envoy
  # distroless: nonroot, no shell, core binary only — the production tag.
  tag: "distroless-v1.38.0"
  # Pinned by digest (#902 L2 supply-chain): immutable content ref; tag kept for
  # readability. Bump via `docker buildx imagetools inspect <repo>:<tag> --format
  # '{{ .Manifest.Digest }}'`. MUST stay in sync with the scan-thirdparty matrix in
  # .github/workflows/nightly-image-scan.yaml (the drift-guard test enforces it).
  # ⛔ Digest is AUTHORITATIVE: `--set image.tag=…` ALONE does NOT upgrade — k8s
  #    silently keeps running THIS digest (tag becomes a lie). To upgrade you MUST
  #    also `--set image.digest=<new>` (or `=""`). L3/Renovate will automate both.
  digest: "sha256:a7a56545102f7a682e0cafea2c9b8448af1b09ebb710eab688dfb931e3ec7ff6"
  pullPolicy: IfNotPresent

# ── JWT verification (ADR-020 §Token model) ──────────────────────────
# The gateway verifies the federation RS256 JWT with the PUBLIC half of
# tenant-api's signing key, supplied as a JWKS document. issuer/audience
# MUST match what tenant-api signs (internal/federation: iss=tenant-api,
# aud=tenant-federation). The keypair is produced by IV-2l (#518); until
# then paste the public JWKS into `jwks`.
jwt:
  issuer: tenant-api
  audience: tenant-federation
  # Clock-skew leeway — tenant-api may sign a few seconds ahead of the
  # gateway's clock; without leeway a just-issued token's iat lands in
  # the verifier's future and 401s (ADR-020 round-7).
  clockSkewSeconds: 60
  # Verified-JWT cache size — repeat presentations of the same token skip
  # the RSA signature check (the expensive step).
  cacheSize: 1000
  # JWKS JSON (RSA public key, kty=RSA / alg=RS256). Not secret — it is a
  # public key. The empty default is a keyless JWKS that Envoy refuses to
  # start with (fail-loud CrashLoopBackOff) — a real deploy MUST set it.
  jwks: ""

# ── Upstream ─────────────────────────────────────────────────────────
upstream:
  # prom-label-proxy mode: the federation-proxy Service (IV-2a).
  # vm-cluster mode: a vmselect host:port.
  # victorialogs mode: the VictoriaLogs Service — e.g.
  #   host: victorialogs.monitoring.svc
  #   port: 9428
  # (helm/victorialogs Service name = `victorialogs`, port 9428). Set these
  # when mode=victorialogs; the default below is the prom-label-proxy target.
  host: federation-proxy.monitoring.svc
  port: 8080

# ── victorialogs mode (ADR-021 — tenant log query) ───────────────────
# Only consulted when mode=victorialogs. The gateway is the AUTHORIZATION
# PLANE for tenant log queries: it injects the verified VictoriaLogs
# (AccountID, ProjectID) tenant header pair and forwards to the VictoriaLogs
# store. Cross-tenant isolation is VictoriaLogs-native; this chart enforces
# (1) fail-closed on a missing/invalid account_id claim (revoked_check.lua),
# (2) a default-deny endpoint allowlist (below). See the chart README.
victorialogs:
  # Endpoint allowlist — DEFAULT-DENY. Only the VictoriaLogs LogsQL
  # query / metadata endpoints below are forwarded; EVERYTHING else (incl.
  # `/select/logsql/tail`, `/insert/*`, and any unknown/future endpoint)
  # gets a catch-all 403. This is an allowlist, NOT a denylist: a new
  # VictoriaLogs endpoint stays denied until a maintainer adds it here on
  # purpose (ADR-021 §Blast radius Layer 3). `/tail` is intentionally
  # ABSENT — a live long-lived connection bypasses -search.maxQueryDuration
  # and squats a concurrency slot; audit-log queries do not need it.
  # Matched as path-segment prefixes (a trailing slash / sub-path is
  # covered, a sibling like `_other` is not over-matched).
  allowedEndpoints:
    - /select/logsql/query
    - /select/logsql/hits
    - /select/logsql/facets
    - /select/logsql/stats_query
    - /select/logsql/stats_query_range
    - /select/logsql/streams
    - /select/logsql/stream_ids
    - /select/logsql/stream_field_names
    - /select/logsql/stream_field_values
    - /select/logsql/field_names
    - /select/logsql/field_values

# ── Revoked set (ADR-020 Posture B) ──────────────────────────────────
# tenant-api writes revoked.txt into the tenant-federation-store ConfigMap
# (#520). The gateway mounts that key as a (tmpfs-backed) projected volume
# and the Lua filter checks token_id against it. Eventually consistent:
# a revocation propagates within the ConfigMap sync window + reloadInterval.
revokedSet:
  configMapName: tenant-federation-store
  key: revoked.txt
  # The store ConfigMap's chart-owned mount sentinel (#1316). Written by the
  # tenant-api chart (`federation.store.sentinelKey`) at install time; this
  # chart only READS it, in the preflight init-container below.
  # ⛔ Must equal tenant-api's value verbatim. Three charts hold three copies of
  # this string and there is no shared helper across charts — a rename in one of
  # them silently disarms the preflight, which is why
  # tests/helm/test_federation_store_sentinel_guard.py pins them equal.
  sentinelKey: .chart-managed
  # How often each Envoy worker re-reads the (tmpfs) revoked file. The
  # read is a microsecond memory read gated to once per worker per
  # interval — not a hot-path disk stall.
  reloadIntervalSeconds: 30
  # ── revoked.txt line contract (#1235 / TRK-349) ────────────────────
  # The strict shape a revoked.txt line must have to be accepted. It is
  # templated INTO revoked_check.lua (a Lua pattern) rather than
  # hard-coded there, so the chart carries the contract instead of the
  # script — `revoked.txt` has two independently-implemented readers
  # (this gateway and the ADR-028 reconciler) and a hand-copied pattern
  # in each is precisely the shape of drift #1235 is about.
  #
  # It must stay equivalent to tenant-api's `tokenIDPattern`
  # (components/tenant-api/internal/federation/token/manager.go) and the
  # reconciler's `TOKEN_ID_PATTERN`
  # (scripts/tools/ops/_federation_revocation_reconciler.py).
  # tests/ops/test_revoked_set_contract.py asserts the three agree —
  # but ⛔ literal equality is NOT semantic equality across three regex
  # dialects, and it is only one of four guards, none of which stands in
  # for another:
  #   * the three-literal check      — a hand-copied pattern drifting;
  #   * federation-e2e S11 (positive) — PATTERN-DIALECT drift, one literal
  #     meaning different things to three engines;
  #   * federation-e2e S10 (negative) — READER-SEMANTICS drift, the two
  #     readers disagreeing about what a line IS. ⚠️ S11 has NO resistance
  #     to that class: both the old and the current reader pass S11;
  #   * the conformance matrix in tests/ops/test_revoked_set_contract.py —
  #     the byte space, mechanically enumerated.
  #
  # A non-conforming line makes the gateway DISCARD THE WHOLE RELOAD and
  # keep its previously-loaded set (see revoked_check.lua) — widening
  # this pattern therefore widens what the enforcement plane accepts.
  tokenIdPattern: "^ftk_[0-9a-f]+$"

# ── Store-mount preflight (#1316) ────────────────────────────────────
# A one-shot init-container that answers, BEFORE Envoy starts, the question the
# revoked volume cannot answer by itself: did my ConfigMap mount actually
# resolve? The volume is `optional: true` (see the Deployment for why that
# stays), and Kubernetes gives a pod whose optional ConfigMap is missing an
# empty directory, Ready status and NO event — measured on a real cluster
# (#1313). The Lua filter then enforces an empty revoked set and every revoked
# token is honoured until its TTL.
#
# ⛔ WHAT THIS IS NOT — four boundaries, all of them measured or derived from
# the shipped numbers, none of them hypothetical:
#
# 1. BOOT-TIME, NOT CONTINUOUS. One line per pod start.
#    `FederationGatewayRevokedSetMissing` latches on `max_over_time(...[1h])`,
#    so one line pages within `for: 5m`; but if nobody acts the alert RESOLVES
#    after the latch window while the misconfiguration is still there. The
#    continuous detector remains the Lua's own per-request warning, which needs
#    the gateway to receive traffic — and an idle misconfigured gateway produces
#    exactly nothing, which is the gap this closes.
# 2. THE LINE HAS A DELIVERY WINDOW. The reconciler queries
#    `[now-failopenLookback, now-settle]` (600s/60s by default) every 300s, so a
#    single line is only visible to a reconcile that runs ~60-600s after it. The
#    reconciler is a single replica: if it is not up and querying in that window
#    — a cold co-deployment of the whole stack is exactly when it might not be —
#    that line is lost for good, because nothing re-emits it until the pod
#    restarts.
# 3. SUCCESS IS SILENCE, so "healthy" and "the check was removed" are
#    observationally identical: `mode: off`, an init-container edited out of a
#    live Deployment, or a broken log hop all look like a clean mount. There is
#    no positive heartbeat. helm/vector's `projection-gate` has the same shape
#    and answers it with a ValidatingAdmissionPolicy
#    (k8s/03-monitoring/validatingadmissionpolicy-projection-gate.yaml); nothing
#    equivalent guards this one yet.
# 4. IT ADDS AN IMAGE-PULL DEPENDENCY to a pod that had none. If busybox is
#    unreachable (private registry not mirrored, rate limit, bad digest) the pod
#    wedges in `Init:ImagePullBackOff` in EVERY mode, warn included — a rolling
#    update keeps the old pods, but a fresh install or a scale-up does not come
#    up. Air-gapped installs must mirror `preflight.image` or set
#    `preflight.mode: "off"`.
preflight:
  # off     — do not render the init-container at all.
  # warn    — check, log, and START ANYWAY (default). The log line carries the
  #           SAME phrase the Lua uses for a missing revoked set, so it feeds the
  #           existing critical alert; no new alert, no new metric.
  # enforce — additionally exit non-zero, wedging the pod in
  #           Init:CrashLoopBackOff. Chooses "no federation service" over
  #           "federation service with revocation disabled".
  # ⚠️ enforce is NOT the default on purpose, and the reason is sharper than
  # "upgrades are racy". A store that has NEVER been written to is byte-identical
  # at the mount to a store that is not there: the ConfigMap a pre-2.9.20
  # tenant-api chart creates carries no `data` at all, and the runtime keys only
  # appear on the first token write. So a topologically CORRECT fresh install
  # whose producer chart simply lags reads as MISSING — under `warn` that is a
  # false critical page (the message says so and names the kubectl that settles
  # it); under `enforce` it is a refusal to start. And this repo ships no gateway
  # replica-down alert, so an outage caused here is LESS visible than the
  # fail-open it prevents. Turn it on once tenant-api >= 2.9.20 is deployed
  # everywhere AND the stores have been written to at least once.
  # ⛔ Quote it in a values FILE — YAML 1.1 reads a bare `off` as a boolean and
  # the chart refuses to render (`--set preflight.mode=off` is unaffected).
  mode: warn
  image:
    # A shell and `ls` are the whole requirement. The gateway's own image is
    # distroless (no shell), so the check cannot reuse it; busybox is the
    # smallest thing that can run it (~2.2 MB).
    # renovate: datasource=docker depName=busybox
    repository: busybox
    tag: "1.36"
    # Pinned by digest, same supply-chain convention as the Envoy and
    # alpine/git images. Bump via `docker buildx imagetools inspect
    # busybox:<tag> --format '{{"{{"}}.Manifest.Digest{{"}}"}}'`.
    digest: "sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 1m
      memory: 8Mi
    limits:
      memory: 16Mi

# ── Rate limits ──────────────────────────────────────────────────────
# All limits are per-Envoy-instance: with N replicas behind the Service
# the effective ceiling is N x the value. This is deliberate — the rate
# limit is a SOFT / approximate control; the HARD cap is Layer-1 storage
# (--query.max-samples / -search.maxUniqueTimeseries). Keep defaults low
# for multi-replica headroom (ADR-020 round-3).
rateLimit:
  # Coarse per-source-IP anti-flood, evaluated before JWT crypto so a
  # garbage-JWT flood is dropped without spending an RSA verify.
  perIp:
    maxTokens: 200          # burst
    tokensPerFill: 100      # 100 r/s sustained
    fillInterval: "1s"
    maxDynamicDescriptors: 10000
  # Per-token: the per-leaked-token abuse ceiling. Tuning corridor
  # 15-60 r/m (ADR-020 §Blast radius Layer 2).
  perToken:
    maxTokens: 10           # burst — opening a ~10-panel dashboard
    tokensPerFill: 15       # 15 r/m sustained
    fillInterval: "60s"
    maxDynamicDescriptors: 4096
  # Per-tenant: caps a tenant that round-robins its <=16 live tokens to
  # multiply its quota (Sybil). Above per-token, well below 16x it.
  perTenant:
    maxTokens: 20
    tokensPerFill: 60       # 60 r/m sustained
    fillInterval: "60s"
    maxDynamicDescriptors: 1024

listenPort: 8080

# Envoy worker-thread count. Envoy otherwise defaults to one worker per
# NODE CPU — far more than a CPU-limited pod can use, which wastes context
# switches and multiplies the per-worker revoked-set cache. Keep this
# roughly aligned with resources.limits.cpu.
concurrency: 2

service:
  type: ClusterIP
  port: 8080

# X-Forwarded-For handling. The per-IP rate limiter keys on the client IP
# Envoy resolves. Behind a cloud LB / ingress that resolution needs the
# trusted-hop count, or it collapses to the LB's IP — one shared per-IP
# bucket for the WHOLE platform, where one noisy tenant 429s everyone.
# Set xffTrustedHops to the number of trusted L7 proxies in front of this
# gateway: 0 = directly exposed, 1 = one ingress / LB, 2 = LB + ingress.
# There is no safe universal default — a wrong value silently breaks
# per-IP limiting, so confirm it against the deployment topology.
network:
  xffTrustedHops: 0

# NetworkPolicy — restricts who may reach the gateway. The gateway is the
# federation entrypoint; ingress should come only from the cluster ingress
# controller / the namespaces that expose it. Empty allowedNamespaces =
# allow the listen port from anywhere in the cluster.
networkPolicy:
  enabled: true
  allowedNamespaces: []

# Horizontal autoscaling — JWT verify (RSA) + PromQL pass-through is
# CPU-bound; scale on CPU.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    cpu: "1"
    memory: 256Mi

# Graceful shutdown — a federation query may run up to 30s; on rollout /
# scale-down the gateway must drain in-flight requests, not 502 them.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 45

# PodDisruptionBudget — keeps the federation entrypoint up through node
# drains / cluster upgrades.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Pod security context (non-root, unprivileged). The distroless Envoy
# image already runs as nonroot uid 101.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  # fsGroup so the audit-log emptyDir is group-writable by every
  # container: Envoy (uid 101) writes it, the mtail / logrotate sidecars
  # read and rotate it. Without fsGroup the sidecars cannot touch a file
  # Envoy created (ADR-020 IV-2f).
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

podAnnotations: {}

# ── Audit log + anomaly metric (ADR-020 IV-2f, #511) ─────────────────
# Envoy writes one JSON line per federation request to TWO sinks
# (files/envoy.yaml access_log):
#   * stdout         — the durable, collector-ready compliance trail.
#     Shipping it to a central store (Loki / SIEM) is the IV-2f
#     follow-up #539; until then it rides the container-log path.
#   * the emptyDir file below — tailed by the mtail sidecar to derive
#     tenant_federation_requests_total{tenant,status}. EPHEMERAL by
#     design: a per-pod metrics feed, not the system of record.
# It is an emptyDir, NOT a PVC: a single ReadWriteOnce PVC cannot be
# mounted by the gateway's replicaCount>1 / podAntiAffinity pods at all,
# and a ReadWriteMany PVC would drag in NFS/EFS for throwaway data.
auditLog:
  # Master switch for the in-pod metrics pipeline — the mtail + logrotate
  # sidecars, the emptyDir mirror they share, and the
  # tenant_federation_requests_total scrape. true (default) renders all
  # of it. Set false to run the gateway WITHOUT those sidecars: a
  # missing or broken audit-sidecar image can then never crash-loop a
  # sidecar and hold the whole gateway pod out of its Service. The
  # stdout audit log (the durable compliance trail, with the `query`
  # field) is emitted either way — this only gates the metrics pipeline.
  enabled: true
  # Sink-2 file path. Its parent directory is the emptyDir mount point.
  path: /var/log/federation/audit.log
  # Request-body buffer cap (envoy.filters.http.buffer). The Lua filter
  # reads POST PromQL bodies from this buffer. 1 MiB is generous enough
  # for a Grafana selector with hundreds of pod names yet far below a
  # memory-exhaustion risk; too small a cap would 413 a legit query.
  maxRequestBytes: 1048576
  # emptyDir size cap. Deliberately generous: it is disk-backed (NOT
  # medium: Memory) so a 1 GiB cap costs node ephemeral storage, not RAM.
  # The headroom matters under a log flood — a malicious tenant spraying
  # rejected (429) requests still produces one audit line each; logrotate
  # must win the race before the emptyDir fills and Kubelet evicts the
  # pod. 1 GiB + the 10s logrotate loop below leaves a wide margin.
  volumeSizeLimit: 1Gi
  # The mtail + logrotate sidecars share one image, built from
  # audit-sidecar/Dockerfile. Override repository before deploying.
  # ⛔ TAG BUMPED TO 3.0.8-2 (#1337) — you must rebuild and push before upgrading.
  # The mtail version did NOT change; the BUILD did (compiled from mtail's pinned
  # upstream commit with a current Go toolchain, and Alpine 3.23.5), taking the
  # image from 23 fixable HIGH/CRITICAL to 2. The `-2` build-revision suffix is
  # what makes that visible: this container has no `digest` knob and the pod
  # template's checksum annotations only hash ConfigMaps, so leaving the tag at
  # 3.0.8 would render a BYTE-IDENTICAL pod spec — no rollout, and with the
  # default `IfNotPresent` the kubelet would keep serving the old 23-CVE image
  # while the platform's nightly scan reported 2. Rebuild from
  # audit-sidecar/Dockerfile, push as 3.0.8-2, then upgrade.
  image:
    repository: federation-audit-sidecar
    tag: "3.0.8-2"
    pullPolicy: IfNotPresent
  # mtail — tails sink 2, exposes the metric on this port; the Service
  # carries the prometheus.io/scrape annotations for it.
  mtail:
    port: 3903
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  # logrotate — caps the emptyDir mirror. Runs on a sleep loop, no cron.
  logrotate:
    # Rotate once the live file exceeds this size (MiB).
    sizeMB: 50
    # Rotated files kept. Disk ceiling ~= sizeMB * (keep + 1).
    keep: 2
    # How often the loop re-checks the file size. Kept SHORT (seconds,
    # not minutes): a log flood of rejected requests can add several
    # MiB/s, so a minute-scale interval would let the emptyDir balloon
    # between rotations and risk a Kubelet eviction. 10s reacts fast.
    intervalSeconds: 10
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
