{{- if .Values.networkPolicy.enabled }}
{{- /* Unset counts as on: `--reuse-values` from 0.7.x carries no such key. */}}
{{- $restrictEgress := ne (toString .Values.networkPolicy.restrictEgress) "false" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "federation-gateway.name" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "federation-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "federation-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: {{ .Values.listenPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.allowedNamespaces }}
      # Restrict ingress to the named namespaces (e.g. the cluster ingress
      # controller's namespace). Empty list = allow the port cluster-wide.
      from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      {{- end }}
    {{- if .Values.auditLog.enabled }}
    # Prometheus scrape of the audit-metrics sidecar (#1595 D1b). Without this
    # rule the policy admitted only listenPort and every scrape was refused.
    # scrapeNamespaceLabel null = any namespace: `namespaceSelector: {}`, never
    # a rule without `from` (that would admit every source, ipBlocks included).
    - ports:
        - port: {{ .Values.auditLog.metrics.port }}
          protocol: TCP
      from:
        {{- with .Values.networkPolicy.scrapeNamespaceLabel }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
    {{- end }}
  {{- if $restrictEgress }}
  # Egress (#1295 PR2): DNS and the one upstream — Envoy has no other off-pod
  # dependency (JWKS and the revoked set are mounted files). Without this the
  # gateway had no egress at all wherever its namespace defaults to deny, as
  # k8s/03-monitoring does. What it allows is wider than "the upstream": port 53
  # on any pod, and upstream.port on ANY pod of the upstream's namespace (in
  # the default install, every :8080 there) — those pods' own ingress rules
  # are what keep the gateway out of them.
  # ⚠️ NetworkPolicy matches the destination POD port, and upstream.port is the
  # Service port. They are equal for federation-proxy and victorialogs by
  # default; where they differ, set networkPolicy.upstreamPort to the pod port.
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "federation-gateway.upstreamNamespace" . | quote }}
      ports:
        - protocol: TCP
          port: {{ include "federation-gateway.upstreamPort" . }}
  {{- end }}
{{- end }}
