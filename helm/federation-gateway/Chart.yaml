apiVersion: v2
name: federation-gateway
description: Tenant federation API gateway (ADR-020 Layer 2) — Envoy that verifies the RS256 federation JWT, checks the revoked set, and per-token / per-tenant rate-limits before forwarding to the Layer 3 proxy
type: application
# version: Helm Chart 版本（隨 Chart 結構/模板變更升級）
# 0.2.0 — ADR-020 IV-2f: audit-log dual sink + mtail / logrotate sidecars
# 0.2.1 — ADR-020 IV-2b: close /api/v1/read 403 route-bypass (path canonicalisation)
# 0.2.2 — ADR-020 IV-2b: close the residual %2F escaped-slash 403 bypass
# 0.2.3 — ADR-020 IV-2f: fix mtail regex — Envoy sorts JSON keys, audit metric never emitted
# 0.2.4 — #551: emergency global kill switch (emergencyGlobalBlock → 503)
# 0.3.0 — ADR-021 (#609) PR-2: victorialogs mode — tenant log-query authz plane
#         (AccountID/ProjectID injection, fail-closed null-claim guard,
#         default-deny LogsQL endpoint allowlist, aud=tenant-federation-logs)
# 0.3.1 — #902 L2: pin the Envoy image by digest (image.digest knob) — supply-chain
# 0.4.0 — #1235: revoked.txt line contract — new revokedSet.tokenIdPattern value
#         templated into revoked_check.lua, template-time guards on it, and a
#         rewritten revoked-set reader in that filter. MINOR, not patch: the
#         filter's behaviour on a malformed revoked set changes (it now refuses
#         the reload and keeps the previously loaded set), and a new value key
#         appears. `helm upgrade --reuse-values` is safe — the key has a default
#         and Helm deep-merges the revokedSet map — but the runtime behaviour
#         change is what earns the minor bump.
# 0.5.0 — #1316: store-mount preflight init-container. New `preflight` value block
#         (mode off|warn|enforce, default warn) and `revokedSet.sentinelKey`; a
#         busybox init-container reports at boot when the revoked volume resolved
#         to an empty directory, using the SAME log phrase the Lua uses so the
#         existing FederationGatewayRevokedSetMissing alert covers it. MINOR: new
#         value keys and a new container in the pod spec. `helm upgrade
#         --reuse-values` is safe (both keys have defaults and Helm deep-merges
#         the maps). Default `warn` never blocks startup; `optional: true` on the
#         revoked volume is unchanged.
# 0.5.1 — #1337: auditLog.image.tag 3.0.8 -> 3.0.8-2. The mtail VERSION is
#         unchanged; the sidecar image's BUILD changed (mtail compiled from its
#         pinned upstream commit with a current Go toolchain + Alpine 3.23.5,
#         23 fixable HIGH/CRITICAL -> 2). ⛔ NOT cosmetic: this container has no
#         digest knob and the pod-template checksums hash only ConfigMaps, so
#         without a tag change the rendered pod spec would be byte-identical —
#         no rollout, and `IfNotPresent` would keep the old image. PATCH: no new
#         value keys, no container added or removed. ⚠️ REQUIRES ACTION: rebuild
#         audit-sidecar/Dockerfile and push it as 3.0.8-2 BEFORE upgrading, or
#         the mtail/logrotate containers hit ImagePullBackOff.
# 0.5.2 — #1278: auditLog.image.tag 3.0.8-2 -> 3.0.8-3. mtail version unchanged;
#         the BUILD changed again (Go 1.26.8 builder clears 8 stdlib CVEs,
#         Alpine 3.23.6 runtime carries libcrypto3 3.5.8). Same reasoning as
#         0.5.1: no digest knob, so only a tag change rolls the pods. PATCH.
#         ⚠️ REQUIRES ACTION: rebuild audit-sidecar/Dockerfile and push it as
#         3.0.8-3 BEFORE upgrading, or mtail/logrotate hit ImagePullBackOff.
# 0.6.0 — #1278 D1: the metrics sidecar is upstream Vector (timberio/vector, same
#         image as helm/vector) running files/audit-metrics.vector.yaml instead of
#         mtail. Same metric names/labels/buckets; mtail's `prog` label is gone.
#         VALUES: `auditLog.mtail` -> `auditLog.metrics` (adds image + dataSizeLimit;
#         memory limit 64Mi -> 128Mi). auditLog.image (logrotate only now) tag
#         3.0.8-3 -> alpine3.23.6-1 — rebuild and push before upgrading.
# 0.6.1 — #2469: access-log `path` drops the query string (REQ_WITHOUT_QUERY),
#         so a token put in the URL is no longer logged. Audit line format
#         changes (other URL params gone); no value keys change. PATCH.
# 0.6.2 — #3520: auditLog.metrics.image Vector 0.57.0 -> 0.61.0 (tag + digest,
#         same image as helm/vector), clearing libssl3 CVE-2026-84782. The
#         sidecar's audit-metrics.vector.yaml uses no component or option
#         0.58-0.61 removed or changed. No value keys change. PATCH.
# 0.7.0 — #1295: victorialogs.auth {username, existingSecret}. Only a non-empty existingSecret is mode-checked: with any mode but victorialogs it fails the render; username alone is ignored there, and an empty username falls back to the chart name. The Secret is mounted as a file and revoked_check.lua replaces Authorization with HTTP basic auth on every forwarded log query, re-reading the file on the revoked-set cadence (rotation without restart); a credential that never loaded answers 503. No Secret = no change.
# 0.7.1 — #3715: auditLog.image.tag alpine3.23.6-1 -> alpine3.24.4-1 (audit-sidecar/Dockerfile
#         FROM alpine 3.23.6 -> 3.24.4). No digest knob, so only the tag rolls
#         the pods. No value keys change. PATCH.
#         ⚠️ REQUIRES ACTION: rebuild audit-sidecar/Dockerfile and push it as
#         alpine3.24.4-1 BEFORE upgrading, or logrotate hits ImagePullBackOff.
# 0.8.0 — #1295: the NetworkPolicy also restricts egress, to DNS and TCP upstream.port in the upstream's namespace (`networkPolicy.upstreamNamespace`, else read from upstream.host `<svc>.<ns>.svc`). Before, the gateway had no egress at all in a namespace that defaults to deny, as k8s/03-monitoring does. ⚠️ BREAKING: an upstream.host that is not a Service name (external FQDN, IP) fails the render until upstreamNamespace is set or `networkPolicy.restrictEgress: false`; the rule matches the destination POD port: where the upstream Service maps ports, set `networkPolicy.upstreamPort`
version: 0.8.0
# appVersion: pinned Envoy release
appVersion: "v1.38.0"
# kubeVersion: the deployment uses the native preStop.sleep lifecycle
# action, beta-on-by-default since Kubernetes 1.29.
kubeVersion: ">=1.29.0-0"
keywords:
  - dynamic-alerting
  - tenant-federation
  - envoy
  - api-gateway
  - multi-tenancy
home: https://github.com/vencil/Dynamic-Alerting-Integrations
maintainers:
  - name: vencil
