# _defaults.yaml — Platform-managed global settings
# Generated by scaffold_tenant.py
#
# optional_overrides（若存在）：只有 key 名稱、沒有值。平台「認得」這些 key
# ——租戶可以在自己的檔案裡設定並生效——但平台不主張任何值，所以租戶不設就是
# 靜默。那是刻意的終態，不是漏掉的預設：這些閾值只有租戶自己的 baseline 校
# 準得出來。⛔ 不要為了「讓它不再靜默」把 key 搬進上面的 defaults——那是對
# 每一個租戶都武裝一個平台選的數字。

defaults:
  container_cpu: 80
  container_cpu_throttle: 25
  container_memory: 85
  mysql_connections: 80
  mysql_threads_running: 30
  mysql_replication_lag: 30
dimensions:
  container_cpu:
    - "version"
  container_memory:
    - "version"
state_filters:
  container_crashloop:
    reasons:
      - "CrashLoopBackOff"
    severity: "critical"
  container_imagepull:
    reasons:
      - "ImagePullBackOff"
      - "InvalidImageName"
    severity: "warning"
  maintenance:
    reasons: []
    severity: "info"
    default_state: "disable"
