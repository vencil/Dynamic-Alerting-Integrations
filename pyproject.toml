# ── pytest ────────────────────────────────────────────────────
# Single source of truth for pytest config (setup.cfg [tool:pytest] removed)
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# -x (exit-first) removed from the GLOBAL default (CI-ROI wave, owner
# decision): a repo-wide fail-fast hides every failure after the first,
# forcing deselect-enumeration loops to attribute multi-failure runs
# (burned in dx-tool CI sweeps). Fail-fast is opt-in per invocation now
# (`pytest -x`); CI keeps its own explicit flags on the command line.
addopts = "--tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: 跨模組整合測試",
    "benchmark: 效能基線測試（需 pytest-benchmark）",
    "regression: 已知 bug 回歸測試",
    "snapshot: 輸出格式穩定性快照測試",
]

# ── coverage ──────────────────────────────────────────────────
# Single source of truth for coverage config (setup.cfg [coverage:*] removed)
[tool.coverage.run]
source = ["scripts/tools", "components/da-tools/app"]
# ⛔ parallel 不是效能選項，是正確性選項（TRK-379）。測試以 subprocess 呼叫工具時，
# coverage 的 a1_coverage.pth 會在每個子行程各自啟動一份 coverage；沒有 parallel 就
# 全部寫同一個 .coverage，last writer wins。實測同一模組：parallel+combine 量到 93%、
# 無 parallel 只量到 64.3%——差值是被覆寫掉的真實執行，不是沒被執行。
# ⚠️ 連帶：任何裸 `coverage report/xml` 前必須先 `coverage combine`；pytest-cov 會自己 combine。
parallel = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/vendor/*",
    # orchestrator：以 subprocess 呼叫其他工具，需 integration test 而非 unit coverage
    "scripts/tools/validate_all.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
skip_empty = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = ".build/htmlcov"
